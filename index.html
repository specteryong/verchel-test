并购重组","section":"第三节投资决策","point":"","type":"single","stem":"长期股权投资的运营管理风险有（ ）。","material":"","options":[{"key":"A","text":"可行性论证风险"},{"key":"B","text":"公司治理结构风险"},{"key":"C","text":"投资协议风险"},{"key":"D","text":"道德风险"},{"key":"E","text":"退出风险"}],"answer":["B"],"explanation":"《公司法》第二百一十八条规定，公司合并可以采取吸收合并或者新设合并。一个公司吸收其他公司为吸收合并，被吸收的公司解散。案例中，L公司被合并，与N公司不形成母子公司关系。N公司向L公司发行普通股，股本增加，N公司原股东持股比例下降（股权被稀释）。","id":"guanfang-0794","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节投资决策","point":"","type":"single","stem":"长期股权投资的风险主要有（ ）。","material":"","options":[{"key":"A","text":"投资运营管理风险"},{"key":"B","text":"投资清理风险"},{"key":"C","text":"投资决策风险"},{"key":"D","text":"投资制度风险"},{"key":"E","text":"投资信息不对称风险"}],"answer":["B"],"explanation":"长期股权投资的投资决策风险具体包括：违反国家法律法规风险、未经审批或超越授权审批风险、被投资单位所处行业和环境的风险及其本身的技术和市场风险、投资项目的尽职调查及可行性论证风险、决策程序不完善和程序执行不严格的风险等。","id":"guanfang-0795","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"single","stem":"企业并购重组的客观原因不包括（ ）。","material":"","options":[{"key":"A","text":"扩大管理者职权"},{"key":"B","text":"谋求企业长远发展"},{"key":"C","text":"缩短投入产出时间"},{"key":"D","text":"享受优惠政策"}],"answer":["A"],"explanation":"并购重组的客观动因是指从企业发展本身出发考虑的动因，包括谋求更长远发展、多元化经营、实现规模经营、减少竞争、缩短投入产出时间、确保原材料和半成品供应、提高生产能力、提高科研水平、获得科技优势、提高市场占有率、开发新市场、提高资金利用效率、减少财务风险、降低经营及投资风险、获得专门资产、高价出售资产、低价收购资产、上市、享受优惠政策以及避税和减税等。","id":"guanfang-0796","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"multi","stem":"企业并购重组的主观动因包括（ ）。","material":"","options":[{"key":"A","text":"扩大管理者职权"},{"key":"B","text":"管理者自我实现的需要"},{"key":"C","text":"实现规模经营"},{"key":"D","text":"提高资金利用效率"},{"key":"E","text":"降低经营风险"}],"answer":["A","B"],"explanation":"企业并购重组的主观动因是指企业所有者、管理者和目标公司管理者从各自利益出发考虑的动因，包括扩大管理者职权、以并购业绩保障经理职位及自我实现的需要等。","id":"guanfang-0797","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"single","stem":"某房地产企业全部使用自有资金并购另一家房地产企业，这属于","material":"","options":[{"key":"A","text":"横向并购"},{"key":"B","text":"纵向并购"},{"key":"C","text":"混合并购"},{"key":"D","text":"要约并购"}],"answer":["A"],"explanation":"按照双方的业务性质划分，企业并购可分为：①纵向并购，指处于同类产品且不同产销阶段的两个或多个企业所进行的并购。②横向并购，指处于同一行业的两个或多个企业所进行的并购。③混合并购，指处于不相关行业的企业所进行的并购。依据题干表述，并购双方都是房地产公司，属于同行业企业间进行的并购，应为横向并购。","id":"guanfang-0798","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"single","stem":"钢铁公司并购铁矿公司属于（ ）。","material":"","options":[{"key":"A","text":"横向并购"},{"key":"B","text":"纵向并购"},{"key":"C","text":"混合并购"},{"key":"D","text":"二级市场并购"}],"answer":["B"],"explanation":"纵向并购是指处于同类产品且不同产销阶段的两个或多个企业所进行的并购。依据题干表述，钢铁公司并购铁矿公司，属于同类产品的不同产销阶段的企业之间进行的并购，应为纵向并购。","id":"guanfang-0799","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"single","stem":"M公司通过证券交易所分批买人N公司股票，最终获得N公司控制权。该并购方式属于（ ）。","material":"","options":[{"key":"A","text":"协议并购"},{"key":"B","text":"要约并购"},{"key":"C","text":"二级市场并购"},{"key":"D","text":"敌意并购"}],"answer":["C"],"explanation":"二级市场并购是指买方通过股票二级市场并购目标公司的股权，从而实现并购目标公司的并购方式。","id":"guanfang-0800","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"single","stem":"通过公开并购进而改选目标企业现任经理和董事会成员，是一种降低企业（ ）的外部控制机制。","material":"","options":[{"key":"A","text":"沉没成本"},{"key":"B","text":"机会成本"},{"key":"C","text":"代理成本"},{"key":"D","text":"资本成本"}],"answer":["C"],"explanation":"在企业的所有权与经营权相分离的情况下，经理是决策或控制的代理人，而企业所有者作为委托人成为风险承担者，这会造成代理成本的出现，具体包括契约成本、监督成本和剩余损失。企业内部恰当的组织机构安排可以在一定程度上降低代理成本。但当不足以控制代理问题时，并购机制使得企业被接管的威胁始终存在。通过公开并购或代理权争夺而造成的接管，将会改选现任经理和董事会成员，从而作为外部控制机制降低代理成本。","id":"guanfang-0801","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"single","stem":"M公司与N公司重组后，M公司存续，N公司全部资产并人M公司，并注销N公司法人资格，此重组采用的是（ ）方式。","material":"","options":[{"key":"A","text":"新设合并"},{"key":"B","text":"吸收合并"},{"key":"C","text":"收购"},{"key":"D","text":"回购"}],"answer":["B"],"explanation":"《公司法》规定，公司合并可以采取吸收合并或者新设合并。一个公司吸收其他公司为吸收合并，被吸收的公司解散。两个以上公司合并设立一个新的公司为新设合并，合并各方解散。","id":"guanfang-0802","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"single","stem":"下列并购方式中，能够减少并购企业现金支出但有可能影响并购企业的资本结构的是（ ）。","material":"","options":[{"key":"A","text":"承担债务式并购"},{"key":"B","text":"要约并购"},{"key":"C","text":"现金购买式并购"},{"key":"D","text":"二级市场并购"}],"answer":["A"],"explanation":"承担债务式并购，即在被并购企业资不抵债或资产与债务相等的情况下，并购企业以承担被并购企业全部或部分债务为条件，取得被并购企业的资产所有权和经营权。采用这种并购方式，可以减少并购企业在并购中的现金支出，但有可能影响并购企业的资本结构。","id":"guanfang-0803","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"multi","stem":"按并购的支付方式来划分，企业并购可分为（ ）。","material":"","options":[{"key":"A","text":"要约并购"},{"key":"B","text":"承担债务式并购"},{"key":"C","text":"现金购买式并购"},{"key":"D","text":"股权交易式并购"},{"key":"E","text":"协议并购"}],"answer":["B","C","D"],"explanation":"按照并购的支付方式来划分，企业并购可分为：①承担债务式并购。②现金购买式并购。③股权交易式并购。","id":"guanfang-0804","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"multi","stem":"按并购的实现方式划分，企业并购分为（ ）。","material":"","options":[{"key":"A","text":"协议并购"},{"key":"B","text":"混合并购"},{"key":"C","text":"要约并购"},{"key":"D","text":"杠杆并购"},{"key":"E","text":"二级市场并购"}],"answer":["A","C","E"],"explanation":"按并购的实现方式划分，企业并购可分为协议并购、要约并购、二级市场并购三种。","id":"guanfang-0805","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"multi","stem":"并购的效应包括（ ）。","material":"","options":[{"key":"A","text":"筹集资金"},{"key":"B","text":"实现经营协同效应"},{"key":"C","text":"实现战略合并"},{"key":"D","text":"降低代理成本"},{"key":"E","text":"获得特殊资产和渠道"}],"answer":["B","D","E"],"explanation":"并购的效应主要有：①实现协同效应，主要包括管理协同、经营协同、财务协同。②实现战略重组，开展多元化经营。③获得特殊资产和渠道。④降低代理成本。","id":"guanfang-0806","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"single","stem":"关于公司分立的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"标准的分立中，新公司与母公司有着相同股东和持股结构"},{"key":"B","text":"分立过程中，股权和控制权会向母公司及其股东之外第三者转移"},{"key":"C","text":"存续分立中，原公司继续存在并设立一个以上新的公司"},{"key":"D","text":"解散分立中，原公司解散并设立两个以上新的公司"}],"answer":["B"],"explanation":"分立是指一家公司依照法律规定、行政命令或公司自行决策，分解为两家或两家以上的相互独立的新公司。标准的分立是指一个母公司将其在某子公司中所拥有的股份，按母公司股东在母公司中的持股比例分配给现有母公司的股东，从而在法律上和组织上将子公司的经营从母公司的经营中分离出去。这会形成一个与母公司有着相同股东和持股结构的新公司。在分立过程中，不存在股权和控制权向母公司及其股东之外第三者转移的情况，因为现有股东对母公司和分立出来的子公司同样保持着他们的权利。公司分立有存续分立和解散分立两种方式。存续分立也称派生分立，是指一个公司将其部分资产分离出去，成立一个或多个新的公司，原公司继续存在的一种公司分立方式。解散分立也称新设分立，是指一个公司将其全部资产分别归人两个或两个以上新设立的公司，原公司解散，丧失法人资格的一种公司分立方式。","id":"guanfang-0807","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"single","stem":"某互联网公司B将其运营游戏产品的子公司A独立出来，B公司保留对A公司的经营控制权。数月后，A公司股票上市。此项行为属于（ ）。","material":"","options":[{"key":"A","text":"收购兼并"},{"key":"B","text":"分拆"},{"key":"C","text":"以股抵债"},{"key":"D","text":"出售"}],"answer":["B"],"explanation":"分拆是指将公司的一部分设立为一个独立的新公司，原公司会持有新公司的部分股票，这一新设的分拆公司公开发行新股并上市就称分拆上市。3. 根据《上市公司分拆规则（试行）》,上市公司可以进行分拆的条件之一是应满足最近3个会计年度连续盈利。4. 根据《上市公司分拆规则（试行）》,上市公司分拆原则上应当满足上市公司股票境内上市已满3年等条件。","id":"guanfang-0808","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"multi","stem":"根据《上市公司分拆规则（试行）》，上市公司进行分拆需满足最近（ ）个会计年度连续盈利。","material":"","options":[{"key":"A","text":"1"},{"key":"B","text":"2"},{"key":"C","text":"3"},{"key":"D","text":"4"}],"answer":["A","B"],"explanation":"公司分立的动机包括：①适应战略调整。②减轻负担。③筹集资金。清晰主业。③化解内部竞争性冲突。","id":"guanfang-0809","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"single","stem":"根据《上市公司分拆规则（试行》,进行分拆的上市公司股票境内上市应当满（ ）年。","material":"","options":[{"key":"A","text":"1"},{"key":"B","text":"2"},{"key":"C","text":"3"},{"key":"D","text":"5"}],"answer":["A"],"explanation":"资产置换是指交易双方（有时可由多方）按某种约定价格（如谈判价格、评估价格等),在某一时期内相互交换资产的交易。资产置换的双方均出资产，通常意味着业务的互换。","id":"guanfang-0810","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"single","stem":"公司分立的动机包括（ ）。","material":"","options":[{"key":"A","text":"减轻负担"},{"key":"B","text":"清晰主业"},{"key":"C","text":"降低成本"},{"key":"D","text":"增加业务种类"},{"key":"E","text":"化解内部竞争性冲突"}],"answer":["A"],"explanation":"资产注人是指交易双方中的一方将公司账面上的资产，可以是流动资产、固定资产、无形资产、股权中的某一项或某几项，按评估价或协议价注人对方公司。如果对方支付现金，则意味着资产注人方的资产变现；如果对方出让股权，则意味着资产注人方以资产出资进行投资或并购。","id":"guanfang-0811","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"single","stem":"M公司以其生产的甲产品资产，与N公司生产的乙产品资产进行等值交易，则两家公司在进行（ ）。","material":"","options":[{"key":"A","text":"资产置换"},{"key":"B","text":"吸收合并"},{"key":"C","text":"以股抵债"},{"key":"D","text":"新设合并"}],"answer":["B"],"explanation":"以股抵债是指债务人以其持有的股权抵偿其所欠债务的行为。以股抵债为缺乏现金清偿能力的股东偿还公司债务提供了途径。以股抵债的积极效应主要体现在能有效提升债权公司的资产质量，使每股收益和净资产收益率水平提高。","id":"guanfang-0812","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"single","stem":"甲公司将其持有的某项专利权及一条生产线，按评估价整体注人乙公司，乙公司以向甲公司定向发行股份的方式支付对价。该资产重组方式属于（ ）。","material":"","options":[{"key":"A","text":"资产注人"},{"key":"B","text":"资产置换"},{"key":"C","text":"吸收合并"},{"key":"D","text":"债务重组"}],"answer":["B"],"explanation":"上市公司及其控股或者控制的公司购买、出售资产，达到下列标准之一的，构成重大资产重组：①购买、出售的资产总额占上市公司最近一个会计年度经审计的合并财务会计报告期末资产总额的比例达到50%以上。②购买、出售的资产在最近一个会计年度所产生的营业收入占上市公司同期经审计的合并财务会计报告营业收人的比例达到50%以上，且超过5000万元人民币。③购买、出售的资产净额占上市公司最近一个会计年度经审计的合并财务会计 报告期末净资产额的比例达到50%以上，且超过5000万元人民币。","id":"guanfang-0813","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"single","stem":"A公司控股股东以其持有的B公司的股权抵偿对B公司的债务，这种行为会使B公司的（ ）。","material":"","options":[{"key":"A","text":"每股收益减少"},{"key":"B","text":"净资产收益率提高"},{"key":"C","text":"流动资产增加"},{"key":"D","text":"流动资产减少"}],"answer":["D"],"explanation":"市净率是每股市价与每股净资产的比率。代人数据，则该上市公司当时的市净率：30 →（10→2)=6（倍)。","id":"guanfang-0814","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"single","stem":"根据《上市公司重大资产重组管理办法》，上市公司购买、出售的资产总额占上市公司最近一个会计年度经审计的合并财务会计报告期末资产总额的比例达到（ ）以上，即构成重大资产重组。","material":"","options":[{"key":"A","text":"30%"},{"key":"B","text":"50%"},{"key":"C","text":"60%"},{"key":"D","text":"75%"}],"answer":["C"],"explanation":"市销率也称价格营收比，是股票市值与销售收人（营业收人）的比率。目标企业的价值即销售收人（营业收人）与标准市销率的乘积。代人数据，投行给出该企业的估值15×1.5=22.5（亿元）。","id":"guanfang-0815","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"single","stem":"某上市公司的总股本为2亿股，2025年6月30日的收盘价为30元，账面净资产价值为10亿元，则该上市公司当时的市净率为（ ）倍。","material":"","options":[{"key":"A","text":"3"},{"key":"B","text":"4"},{"key":"C","text":"5"},{"key":"D","text":"6"}],"answer":["D"],"explanation":"市盈率是某种股票普通股每股市价（或市值）与每股盈利（或净利润总额）的比率。目标企业的价值即企业净利润总额与标准市盈率的乘积。代人数据，G公司的价值=600×20=12000（万元）。","id":"guanfang-0816","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"multi","stem":"某投行在对目标企业估值时采用市销率法。假设该目标企业所在行业的标准市销率为1.5,该企业2025年的销售收人为15亿元，则投行给出该企业的估值应为（ ）亿元。","material":"","options":[{"key":"A","text":"10"},{"key":"B","text":"17.5"},{"key":"C","text":"22.5"},{"key":"D","text":"30"}],"answer":["A","D"],"explanation":"价值评估方法主要有收益法、市盈率法、市净率法、市盈率相对盈利增长比率法和市销率法。市销率也称价格营收比，是股票市值与销售收入（营业收入）的比率。市盈率是某种股票普通股每股市价（或市值）与每股盈利（或净利润总额）的比率。市净率是每股市价与每股净资产的比率。这三种方法所评估的企业价值都受其市值的影响。","id":"guanfang-0817","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"single","stem":"G公司2025年营业收人为2000万元，净利润总额是600万元，由专业资产评估机构进行资产评估和科学估算后，G公司估值可参考的标准市盈率为20倍。采用市盈率法估值，G公司的价值为（ ）万元。","material":"","options":[{"key":"A","text":"23000"},{"key":"B","text":"25000"},{"key":"C","text":"40000"},{"key":"D","text":"12000"}],"answer":["B"],"explanation":"市盈率相对盈利增长比率也称PEG指标，是指用公司的市盈率除以公司未来3年或5年的每股收益复合增长率。当PEG等于1时，表明市场赋予这只股票的估值可以充分反映其未来业绩的成长性；而当PEG大于或小于1时，则说明这只股票的价值可能被高估或低估，或市场认为这家公司的业绩成长性会高于或低于市场的预期。","id":"guanfang-0818","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第四节并购重组","point":"","type":"multi","stem":"下列企业价值评估方法中，所评估的企业价值受其市值影响的有（ ）。","material":"","options":[{"key":"A","text":"市销率法"},{"key":"B","text":"收益法"},{"key":"C","text":"成本法"},{"key":"D","text":"市盈率法"},{"key":"E","text":"市净率法"}],"answer":["A","B"],"explanation":"企业价值评估中的收益法，是指将预期收益资本化或者折现，确定评估对象价值的评估方法。收益法常用的具体方法包括股利折现法和现金流量折现法。 國第十一章国际商务运营","id":"guanfang-0819","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"国际商务的本质是（ ）。","material":"","options":[{"key":"A","text":"产业分工"},{"key":"B","text":"跨国界"},{"key":"C","text":"信息化"},{"key":"D","text":"金融化"}],"answer":["B"],"explanation":"国际商务的本质是“跨国界”,最基本的国际商务活动是跨国界的经济交易活动。","id":"guanfang-0820","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"multi","stem":"国际商务活动的类型有（ ）。","material":"","options":[{"key":"A","text":"电子商务"},{"key":"B","text":"国际贸易"},{"key":"C","text":"国际直接投资"},{"key":"D","text":"企业分立"},{"key":"E","text":"特许经营"}],"answer":["B","C","E"],"explanation":"国际商务活动可以分为三大类：①国际贸易，即货物与服务的进出口。②国际直接投资，即以控制国（境）外企业的经营管理权为核心的经济活动。③其他国际经济活动，主要包括特许经营、合作经营、合作开发、工程承包及劳务合作、国际信贷及融资等活动。","id":"guanfang-0821","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"跨国公司的界定标准不包括（ ）。","material":"","options":[{"key":"A","text":"结构标准"},{"key":"B","text":"业绩标准"},{"key":"C","text":"行为标准"},{"key":"D","text":"员工数量标准"}],"answer":["D"],"explanation":"判定一家企业是否为跨国公司，通常有以下三种标准：结构标准、业绩标准和行为标准。","id":"guanfang-0822","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"关于办事处的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"非法律实体机构"},{"key":"B","text":"登记手续简单"},{"key":"C","text":"必须向东道国缴纳所得税"},{"key":"D","text":"不能在东道国开展投资生产业务"}],"answer":["C"],"explanation":"办事处是指母公司（总公司）在海外设立企业的初级形式，是为进一步打开海外市场而设立的一个非法律实体的机构，它不构成企业。办事处登记手续简单。办事处只能开展一些信息收集、联络客户、推销产品之类的活动，不能在东道国从事投资生产、接受信贷、谈判签约等业务。由于不能直接在东道国开展业务，办事处不必向东道国缴纳所得税。","id":"guanfang-0823","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"设立子公司的优点不包括（ ）。","material":"","options":[{"key":"A","text":"有利于开展业务"},{"key":"B","text":"融资比较便利"},{"key":"C","text":"行政管理费用比较低"},{"key":"D","text":"有利于收回投资"}],"answer":["C"],"explanation":"设立子公司的优点包括：①有利于开展业务。②融资比较便利。③有利于进行创造性的经营管理。有利于收回投资，可以采用与其他公司合并或出售股份的形式收回投资。③有利于母公司开展合法的避税活动。缺点包括：①手续比较繁杂。②行政管理费用比较高。③经营管理方面存在一定的困难。","id":"guanfang-0824","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"跨国公司的法律组织形式中，不具有独立的法人地位，但可以在东道国开展业务活动的是（ ）。","material":"","options":[{"key":"A","text":"子公司"},{"key":"B","text":"分公司"},{"key":"C","text":"办事处"},{"key":"D","text":"母公司"}],"answer":["B"],"explanation":"分公司是总公司的一个分支机构或附属机构，在法律上和经济上没有独立性，不是法人。分公司的业务活动由总公司主导，分公司只能以总公司的名义，并根据其委托开展业务活动。","id":"guanfang-0825","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"在跨国公司的管理组织形式中，能够集中加强对国际业务的管理，但容易造成国内、国际业务部门的对立，不利于资源优化配置的是（ ）。","material":"","options":[{"key":"A","text":"国际业务部"},{"key":"B","text":"全球职能结构"},{"key":"C","text":"全球产品结构"},{"key":"D","text":"全球矩阵结构"}],"answer":["A"],"explanation":"跨国公司的国际业务部拥有全面的专营权，负责公司在母国以外的一切业务。该管理组织形式的优点包括：集中加强对国际业务的管理；树立体现全球战略意图的国际市场意识，提高员工的国际业务水平。其缺点包括：人为地将国内、国际业务割裂开来，容易造成国内、国际业务部门的对立，不利于资源优化配置；国际业务部发展到一定阶段后，其他部门难以与之匹配，反而会影响企业的经营效率。","id":"guanfang-0826","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"能够增强公司的整体实力和提高公司的应变能力，但管理层之间容易发生冲突的跨国公司管理组织形式是（ ）。","material":"","options":[{"key":"A","text":"国际业务部"},{"key":"B","text":"全球职能结构"},{"key":"C","text":"全球性地区结构"},{"key":"D","text":"全球矩阵结构 是（ ）。"},{"key":"E","text":"国际业务部"},{"key":"F","text":"全球职能结构"},{"key":"G","text":"全球产品结构"},{"key":"H","text":"全球矩阵结构"}],"answer":["D"],"explanation":"全球矩阵结构是指跨国公司将职能主线和产品/地区主线结合起来，纵横交错，形成矩阵形组织。全球矩阵结构的优点包括：可以集合公司优势，增强公司的整体实力；提高公司的应变能力，既可以应对复杂多变的国际业务环境，又可以保证母公司对子公司的控制。其缺点包括：打破了传统的统一管理的原则，管理层之间容易发生冲突；组织结构比较复杂，各层次的利益关系难以协调。","id":"guanfang-0827","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"关于子公司的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"子公司在法律上和经济上没有独立性，不是法人"},{"key":"B","text":"子公司没有自己独立的公司名称和章程"},{"key":"C","text":"总公司对子公司债务负无限责任"},{"key":"D","text":"子公司能够以自身的名义开展业务"}],"answer":["B"],"explanation":"全球职能结构中，跨国公司的一切业务都围绕公司的研发、生产、销售、财务等主要职能展开，设立职能部门，每个部门都需负责该项职能的全球性业务，分管职能部门的副总裁向总裁负责。该组织形式的优点包括：通过专业化的分工，明确了职责，提高了效率；易于实行严格的规章制度；有利于统一成本核算和利润考核。其缺点包括：难以开展多种经营活动和实现产品多样化，并给地区间组织协作造成很大的困难。","id":"guanfang-0828","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"设立分公司的优点包括（ ）。","material":"","options":[{"key":"A","text":"设立手续比较简单"},{"key":"B","text":"亏损可以在总公司税前利润中扣除"},{"key":"C","text":"便于管理"},{"key":"D","text":"有利于总公司的业务保密"},{"key":"E","text":"有利于发挥分公司的创造性"}],"answer":["D"],"explanation":"子公司是指按当地法律注册成立，由母公司控制但法律上是一个独立的法律实体的企业机构。子公司自身是一个完整的公司，有独立的名称、章程和行政管理机构；能独立支配财产，自负盈亏；可以以自己的名义开展业务。","id":"guanfang-0829","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"multi","stem":"在跨国公司进入国外市场的方式中，出口的特点不包括（ ）。","material":"","options":[{"key":"A","text":"帮助跨国公司实现经验曲线效应和区位经济"},{"key":"B","text":"避免在东道国进行制造和经营活动通常所需的巨额成本"},{"key":"C","text":"避免关税壁垒带来的风险"},{"key":"D","text":"运输费用较高"}],"answer":["A","B","C"],"explanation":"设立分公司的优点包括：①设立手续比较简单。②由于不是独立核算法人，其亏损可以在总公司税前利润中扣除。③便于管理。④在某些方面受东道国管制较少，东道国对该分公司在该国以外的财产没有管辖权。设立分公司的缺点包括：①对总公司的不利影响。注册时须披露总公司的相关信息，不利于总公司的业务保密；总公司对分公司债务承担无限责 任；退出时不能与其他公司合并，只能出售资产。②对分公司的不利影响。受总公司严格限 制，难以充分发挥分公司的积极性、创造性；在东道国开展业务有一定困难。③对母国的不利 影响。常会引起母国税收的减少。","id":"guanfang-0830","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"下列行业中，适用交钥匙工程的是（ ）。","material":"","options":[{"key":"A","text":"纺织服装、服饰业"},{"key":"B","text":"农副食品加工业"},{"key":"C","text":"化工行业"},{"key":"D","text":"居民服务业"}],"answer":["C"],"explanation":"出口是指跨国公司将国内生产的产品销售至其他国家或地区。出口模式的优点包括：①避免在东道国进行制造和经营活动通常所需的巨额成本。②帮助跨国公司实现经验曲线效应和区位经济。出口模式的缺点包括：①生产成本较高。如果国外有成本更低的地方可以生产产品，那么从母国出口显然很不合算。②运输费用较高，尤其是对大宗商品而言。③关税壁垒带来的风险。④难以控制营销工作。","id":"guanfang-0831","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"成立合资企业的优点不包括（ ）。","material":"","options":[{"key":"A","text":"获得东道国竞争状况等相关信息"},{"key":"B","text":"与合作伙伴分摊开发成本或风险"},{"key":"C","text":"政治上易接受"},{"key":"D","text":"有助于实现区位经济和经验曲线效应"}],"answer":["C"],"explanation":"交钥匙工程是指公司（承包商）按规定为东道国客户（国外企业）包干建造某项工程项目，合同期满，承包商将工程的所有权和管理权移交国外企业。交钥匙工程是向其他国家出口连续性技术的手段之一，这一模式在化工、医药、炼油和金属加工行业十分普遍，这些行业都需采用复杂、昂贵的生产技术。","id":"guanfang-0832","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"特许经营主要适用于（ ）。","material":"","options":[{"key":"A","text":"服务企业"},{"key":"B","text":"制造企业"},{"key":"C","text":"农业企业"},{"key":"D","text":"高新技术企业"}],"answer":["D"],"explanation":"，成立合资企业的优点：①跨国公司可以通过从当地合资伙伴处获得有关东道国竞争状况、文化、语言、政治体制和经营体制等相关信息而受益。②跨国公司可以与当地的合作伙伴分摊这些成本或风险。③在许多国家，合资企业往往是唯一可行的进入模式。与当地企业建立合资企业这一方式在东道国政府采取国有化或其他干预措施时面临的风险较低。","id":"guanfang-0833","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"当一家公司的竞争优势建立在技术能力的基础上时，最合适的国外市场生人方式是（ ）。","material":"","options":[{"key":"A","text":"交钥匙工程"},{"key":"B","text":"技术授权"},{"key":"C","text":"成立全资子公司"},{"key":"D","text":"成立合资企业"}],"answer":["A"],"explanation":"从根本上讲，特许经营是技术授权的一种特殊形式，但特许经营往往比技术授权涉及的期限更长。在特许经营中，特许方向被特许方出售无形资产（通常为商标),要求被特许方严格按照特许方的要求进行企业经营。除此之外，特许方定期对被特许方的经营业务提供帮助。技术授权主要用于制造企业，而特许经营主要用于服务企业。","id":"guanfang-0834","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"跨国公司的国外市场进入方式包括（ ）。","material":"","options":[{"key":"A","text":"出口"},{"key":"B","text":"交钥匙工程"},{"key":"C","text":"技术授权"},{"key":"D","text":"企业分立"},{"key":"E","text":"与东道国企业成立合资企业"}],"answer":["C"],"explanation":"当一家公司的竞争优势建立在技术能力的基础上时，成立全资子公司常常是最合适的国外市场进入方式。","id":"guanfang-0835","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"multi","stem":"技术授权的优点包括（ ）。","material":"","options":[{"key":"A","text":"开发成本和风险低"},{"key":"B","text":"可以实现区位经济和经验曲线效应"},{"key":"C","text":"有利于进行国家间战略协调"},{"key":"D","text":"存在投资壁垒时可以使用"},{"key":"E","text":"存在不想开发的无形资产时可以使用"}],"answer":["A","B","C","E"],"explanation":"跨国公司通常采用六种方式进入国外市场，即出口、交钥匙工程、技术授权、特许经营、成立合资企业以及成立全资子公司。","id":"guanfang-0836","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"multi","stem":"在跨国公司经营战略中，当降低成本的压力强烈而地区调适的压力很低时，使用（ ）最为有效。","material":"","options":[{"key":"A","text":"跨国战略"},{"key":"B","text":"本土化战略"},{"key":"C","text":"全球标准化战略"},{"key":"D","text":"国际战略"}],"answer":["A","D"],"explanation":"技术授权的优点包括：①许可方不必承担开发一个国外市场所需的开发费用和风险。②当跨国公司不愿对一个不熟悉或政治环境动荡的国外市场投入巨大的财务资源时，技术授权也具有相当大的吸引力。③当国外市场存在投资壁垒时，可以采用技术授权。④当一家跨国公司拥有某些有商业应用价值的无形资产，而又不想开发这些应用价值时，采用技术授权可以获得经济收益。技术授权的缺点包括：①跨国公司不能对制造、营销以及实现区位经济和经验曲线效应所必需的战略进行严密的控制。②技术授权不支持在全球市场竞争中进行国家间战略协调，如利用在一个国家所赚取的利润支持其在另一个国家的竞争性行为。③技术授权使跨国公司面临失去技术决穷控制权的风险。","id":"guanfang-0837","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"跨国公司子单位中最重要的行政组织控制是（ ）。","material":"","options":[{"key":"A","text":"风险评估"},{"key":"B","text":"价值体系"},{"key":"C","text":"企业准则"},{"key":"D","text":"预算和资金使用规则"}],"answer":["C"],"explanation":"跨国公司在国际环境竞争中通常采用四种基本的经营战略，即全球标准化战略、跨国战略、国际战略和本土化战略。各种战略的适用性取决于降低成本和地区调适压力的大小。当降低成本的压力强烈而地区调适的压力很低时，使用全球标准化战略能达到最好的效果。","id":"guanfang-0838","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"实施全球标准化战略的跨国公司一般采用的组织结构形式是（ ）。","material":"","options":[{"key":"A","text":"全球产品结构"},{"key":"B","text":"全球性地区结构"},{"key":"C","text":"全球职能结构"},{"key":"D","text":"全球矩阵结构"}],"answer":["D"],"explanation":"跨国公司子单位中最重要的行政组织控制是预算和资金使用规则。 特征明显，一般采用全球范围的产品分部结构，即全球产品结构。","id":"guanfang-0839","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"与其他经营战略相比，实施全球标准化战略的跨国公司，最适合采用的权责配置模式是（ ）。","material":"","options":[{"key":"A","text":"分权"},{"key":"B","text":"核心竞争力集权，其他分权"},{"key":"C","text":"某种程度的集权"},{"key":"D","text":"集权与分权相结合"}],"answer":["C"],"explanation":"采取全球标准化战略的跨国公司，适宜采用某种程度的集权；采取本土化战略的跨国公司，适宜采用分权；采取国际战略的跨国公司，核心竞争力适合集权、其他分权；采取跨国战略的跨国公司，适宜集权与分权相结合。","id":"guanfang-0840","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"single","stem":"跨国公司的四种经营战略中，部门间相互依赖性低、绩效模糊程度低、控制成本程度低的战略是（ ）。","material":"","options":[{"key":"A","text":"全球标准化战略"},{"key":"B","text":"本土化战略"},{"key":"C","text":"跨国战略"},{"key":"D","text":"国际战略"}],"answer":["B"],"explanation":"全球标准化战略下，部门间相互依赖性高，绩效模糊程度高，控制成本程度高；本土化战略下，部门间相互依赖性低，绩效模糊程度低，控制成本程度低；跨国战略下，部门间相互依赖性很高，绩效模糊程度很高，控制成本程度很高；国际战略下，部门间相互依赖性中等，绩效模糊程度中等，控制成本程度中等。","id":"guanfang-0841","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"multi","stem":"跨国公司控制系统的控制方式包括（ ）。","material":"","options":[{"key":"A","text":"个人控制"},{"key":"B","text":"产出控制"},{"key":"C","text":"绩效控制"},{"key":"D","text":"行政组织控制"},{"key":"E","text":"文化控制"}],"answer":["A","B","D","E"],"explanation":"跨国公司使用的控制系统主要有四种，即个人控制、行政组织控制、产出控制和文化控制。","id":"guanfang-0842","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节国际商务与跨国公司","point":"","type":"multi","stem":"关于跨国公司四种经营战略在组织形式和控制需求方面的差异的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"跨国战略要求集权和分权相结合"},{"key":"B","text":"采用国际战略的公司多采用全球矩阵结构"},{"key":"C","text":"本土化战略的协调需求低"},{"key":"D","text":"全球标准化战略的文化控制需求高"},{"key":"E","text":"本土化战略要求核心竞争力集权，其他分权"}],"answer":["A","C","D"],"explanation":"跨国战略要求集权和分权相结合；本土化战略一般采用分权，协调需求低；采用跨国战略的公司多采用全球矩阵结构；采用国际战略的公司多采用全球产品结构；全球标准化战略的文化控制需求高。","id":"guanfang-0843","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节国际直接投资业务","point":"","type":"single","stem":"国内某知名手机品牌因本土市场饱和且遇到强有力的竞争对手，为拓展业务空间，选择在非洲市场投资建厂并设立营销网络。该企业的投资动机属于（)。","material":"","options":[{"key":"A","text":"优惠政策导向型"},{"key":"B","text":"分散投资风险导向型"},{"key":"C","text":"降低成本导向型"},{"key":"D","text":"市场导向型"}],"answer":["A"],"explanation":"国际直接投资企业的建立方式有两种：在东道国建立新企业和并购东道国企业。其中，以新建方式设立国际直接投资企业又称绿地投资。","id":"guanfang-0844","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节国际直接投资业务","point":"","type":"single","stem":"国际直接投资动机中，为了规避汇率风险，获取自然资源和原材料的动机属于（ ）。","material":"","options":[{"key":"A","text":"市场导向型"},{"key":"B","text":"降低成本导向型"},{"key":"C","text":"优惠政策导向型"},{"key":"D","text":"分散投资风险导向型"}],"answer":["C"],"explanation":"跨国并购的优点包括：①可以利用目标企业现有的生产设备、技术人员和熟练工人，获得对并购企业发展有用的技术、专利和商标等无形资产，同时还可以缩短项目的建设周期。②可以利用目标企业原有的销售渠道，较快地进入本国以及他国市场，不必经过艰难的市场开拓阶段。③通过跨行业的并购活动，可以迅速扩大经营范围和扩充经营场所，增加经营方式，促进产品的多样化和生产规模的扩大。④可以减少市场上的竞争对手。③并购后再次出售目标企业的股票或资产一般可以使并购企业获得更多利润。","id":"guanfang-0845","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节国际直接投资业务","point":"","type":"multi","stem":"国际直接投资动机中，“不要把所有鸡蛋都放在一个篮子里”指的是（ ）动机。","material":"","options":[{"key":"A","text":"市场导向型"},{"key":"B","text":"降低成本导向型"},{"key":"C","text":"优惠政策导向型"},{"key":"D","text":"分散投资风险导向型"}],"answer":["A","B"],"explanation":"跨国并购的缺点包括：①由于目标企业所在国的会计准则与财务制度往往与东道国存在差异，所以有时候难以准确评估目标企业真实的财务情况，导致并购目标企业的实际投资金额增加。②东道国反托拉斯法的存在以及对外来资本股权和被并购企业行业的限制，是并购行为在法律和政策上的障碍。③当对一国的并购数量和并购金额较大时，常会受到当地奥论的抵制。④目标企业原有契约或传统关系的存在，会成为对其进行改造的障碍，如目标企 业的人员安置问题。","id":"guanfang-0846","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节国际直接投资业务","point":"","type":"multi","stem":"根据产品生命周期理论，企业开始在其他发达国家或地区进行对外直接投资并建立子公司进行出口替代发生在（ ）。","material":"","options":[{"key":"A","text":"产品创新阶段"},{"key":"B","text":"产品再创新阶段"},{"key":"C","text":"产品成熟阶段"},{"key":"D","text":"产品标准化阶段"}],"answer":["A","D"],"explanation":"以新建方式设立国际直接投资企业的优点包括：①创建新的企业不易受到东道国法律和政策上的限制，也不易受到当地奥论的抵制。②在大多数国家，创建海外企业比并购海外企业的手续简单。③在东道国创建新的企业，尤其是合资企业，常会享受到东道国的优惠政策。对新创建海外企业所需要的资金一般能作出准确的估价，后续工作流程简单。其缺点包括：①投资建设周期长。②不利于迅速进入东道国以及其他国家市场。③不利于迅速进行跨行业经营，迅速实现产品与服务多样化。","id":"guanfang-0847","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节国际直接投资业务","point":"","type":"single","stem":"根据邓宁的国际生产折中理论，适合采取出口贸易的形式参与国际经济活动的企业应同时拥有（ ）。","material":"","options":[{"key":"A","text":"所有权优势"},{"key":"B","text":"使用权优势"},{"key":"C","text":"内部化优势"},{"key":"D","text":"整体性优势"},{"key":"E","text":"区位优势"}],"answer":["A"],"explanation":"在国际直接投资中，生产选址的影响因素主要包括国家因素、技术因素和生产因素。","id":"guanfang-0848","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节国际直接投资业务","point":"","type":"single","stem":"在国际直接投资企业的建立方式中，被称为绿地投资的是（ ）。","material":"","options":[{"key":"A","text":"在东道国新建企业"},{"key":"B","text":"在东道国并购企业"},{"key":"C","text":"在东道国收购企业"},{"key":"D","text":"在东道国兼并企业"}],"answer":["C"],"explanation":"影响生产选址的生产因素包括产品特点、生产工厂的选址和生产工厂的战略地位。其中，影响生产选址的两大产品特点：①产品的价值重量比，因为它会影响运输成本的高低。价值重量比较高的产品适合在最佳区位集中生产并向全球市场供应，价值重量比较低的产品如大宗货物则应在目标市场附近的多个地点生产以降低运输成本。②产品能否满足共同需要。如果各国消费者对某类产品的偏好几乎无差异，即该类产品能满足共同需要，则这类产品适合在一个最佳区位集中生产。球市场的生产战略。②分散生产战略，即在紧邻主要市场的不同国家或地区的多个区位进行生产的生产战略。","id":"guanfang-0849","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节国际直接投资业务","point":"","type":"single","stem":"跨国并购的优点不包括（ ）。","material":"","options":[{"key":"A","text":"可以利用目标企业现有的资源"},{"key":"B","text":"可以迅速扩大经营范围和扩充经营场所"},{"key":"C","text":"可以减少对目标企业进行改造的障碍"},{"key":"D","text":"可以减少市场上的竞争对手"}],"answer":["D"],"explanation":"分散生产最具合理性的情形包括：①各国之间政治、经济、文化和相对要素成本的差异对各国生产成本没有很大的影响。②贸易壁垒高。③区位外部性不是很重要。④预期重要的汇率变动频繁。③生产技术的固定成本低，最小有效规模小，且不存在柔性制造技术。③产品的价值重量比低。①产品不能满足共同需要，即各国消费者的品位和偏好存在很大差异。","id":"guanfang-0850","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节国际直接投资业务","point":"","type":"multi","stem":"跨国并购的缺点包括（ ）。","material":"","options":[{"key":"A","text":"容易面临当地奥论抵制"},{"key":"B","text":"面临东道国法律上的障碍"},{"key":"C","text":"投资建设期长"},{"key":"D","text":"会增加市场上的竞争对手"},{"key":"E","text":"无法利用原有销售渠道"}],"answer":["A","C","E"],"explanation":"影响生产选址的技术因素包括固定成本水平、最小有效规模及柔性制造技术。","id":"guanfang-0851","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节国际直接投资业务","point":"","type":"multi","stem":"以新建方式设立国际直接投资企业的缺点有（ ）。","material":"","options":[{"key":"A","text":"投资建设周期长"},{"key":"B","text":"容易受到当地奥论的抵制"},{"key":"C","text":"容易受到东道国法律的限制"},{"key":"D","text":"不利于迅速进行跨行业经营"},{"key":"E","text":"手续烦琐"}],"answer":["A","C","D"],"explanation":"集中生产最具合理性的情形如下：①各国之间政治、经济、文化和相对要素成本的差异对各国生产成本有相当大的影响。②贸易壁垒低。③相似的企业集中，导致区位外部性的产生。④预期重要的汇率将保持相对稳定。③生产技术的固定成本高，相对于全球总需求来说有很大的最小有效规模，并且存在柔性制造技术。③产品的价值重量比高。①产品能满足共同需要。","id":"guanfang-0852","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节国际直接投资业务","point":"","type":"multi","stem":"在国际直接投资中，生产选址的影响因素不包括（ ）。","material":"","options":[{"key":"A","text":"渠道因素"},{"key":"B","text":"国家因素"},{"key":"C","text":"技术因素"},{"key":"D","text":"生产因素"}],"answer":["A","B","C"],"explanation":"对东道国来说，国际直接投资的主要收益是资源转移效应、就业效应、国际收支效应及对竞争和经济增长的影响。","id":"guanfang-0853","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节国际直接投资业务","point":"","type":"multi","stem":"在国际直接投资中，关于影响生产选址的生产因素的说法，错误的是","material":"","options":[{"key":"A","text":"价值重量比较高的产品适合在最佳区位集中生产并向全球市场供应"},{"key":"B","text":"价值重量比较低的产品应在目标市场附近的多个地点生产"},{"key":"C","text":"能满足共同需要的产品适合在目标市场附近的多个地点生产"},{"key":"D","text":"生产工厂的选址和生产工厂的战略地位影响生产选址"}],"answer":["B","C","D"],"explanation":"东道国在吸引外来直接投资方面有三种成本：①对东道国国内竞争的负面效应。当国际直接投资获得该跨国公司的补贴和支持，可能将东道国企业赶出市场，从而垄断该市场，对东道国经济产生不利影响。②对国际收支的负面效应。其一，国际直接投资带来的最初的资本流人会导致随后的东道国子公司向母公司的利润流出；其二，若东道国子公司从国外进口大量用于生产的产品，会借记东道国国际收支经常项目账户。③部分经济独立性的丧失。一些东道国政府担心外来投资会影响其经济发展，却对此没有实际的控制能力。","id":"guanfang-0854","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节国际直接投资业务","point":"","type":"multi","stem":"在国际直接投资中，生产选址的两大基本战略是（ ）。","material":"","options":[{"key":"A","text":"集中生产策略与规模生产策略"},{"key":"B","text":"跨国生产策略与国内生产策略"},{"key":"C","text":"规模生产策略与分散生产策略"},{"key":"D","text":"集中生产策略与分散生产策略"}],"answer":["A","B","C","D"],"explanation":"限制外来直接投资最常见的两种方式是所有权限制和运作限制。所有权限制 形式有投资领域准人限制和外商投资者持股比例限制，所有权限制是出于对国家安全和竞争 的考虑，通常采取的做法是将外来投资排除在某些特定的行业之外；常见的运作限制包括产品 的国产化程度、出口量、技术转移以及当地居民参与高层管理等方面。","id":"guanfang-0855","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节国际直接投资业务","point":"","type":"multi","stem":"跨国企业在进行国际直接投资时，适合采取分散生产战略的情形是","material":"","options":[{"key":"A","text":"贸易壁垒低"},{"key":"B","text":"预期重要的汇率将保持相对稳定"},{"key":"C","text":"区位外部性很重要"},{"key":"D","text":"产品的价值重量比低"}],"answer":["C","D"],"explanation":"国际直接投资对母国（投资国）有三方面的好处：①母国的国际收支因国外子公司的收益回流得到改善。②国际直接投资增加母国就业。当东道国子公司形成对母国的进口需求时，就会产生就业效应。③母国的国外子公司可以将国外习得的技能转移回母国。这相当于逆向的资源转移效应。","id":"guanfang-0856","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节国际直接投资业务","point":"","type":"multi","stem":"在国际直接投资中，影响生产选址的技术因素包括（ ）。","material":"","options":[{"key":"A","text":"固定成本水平"},{"key":"B","text":"变动成本水平"},{"key":"C","text":"最小有效规模"},{"key":"D","text":"最大有效规模"},{"key":"E","text":"柔性制造技术"}],"answer":["C","D","E"],"explanation":"母国可以通过政策鼓励或限制本国企业的国际直接投资。鼓励国际直接投资的政策包括保险、资金支持、税收优惠和政治压力。限制国际直接投资的政策包括限制企业资本转出的数量，采取税收政策鼓励企业在本国投资，限制本国企业投资某些特定的国家等。","id":"guanfang-0857","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"发盘在（ ）时生效。","material":"","options":[{"key":"A","text":"到达受盘人"},{"key":"B","text":"发盘人发出"},{"key":"C","text":"签订合同"},{"key":"D","text":"达成交易意向"}],"answer":["A"],"explanation":"《公约》规定，发盘到达受盘人时生效。","id":"guanfang-0858","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"国际货物贸易中，关于“接受”的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"接受必须由受盘人做出"},{"key":"B","text":"接受送达发盘人时生效"},{"key":"C","text":"逾期接受仍是有效的接受"},{"key":"D","text":"只接受发盘中的部分内容，不能构成接受，只能视作还盘"}],"answer":["C"],"explanation":"《公约》规定，接受必须由受盘人做出；接受送达发盘人时生效；如接受通知未在发盘规定的时限内送达发盘人，或者发盘没有规定时限，且在合理时间内未曾送达发盘人，则该项接受称作逾期接受。按照惯例，逾期接受不是有效的接受。一项有效的接受必须是同意发盘所提出的交易条件，只接受发盘中的部分内容，或对发盘条件提出实质性的修改，或提出有条件的接受，均不能构成接受，而只能视作还盘。","id":"guanfang-0859","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"关于虚盘特点的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"向一个或一个以上的特定人提出"},{"key":"B","text":"在发盘中保留条件"},{"key":"C","text":"发盘的内容模糊，不做肯定表示"},{"key":"D","text":"缺少主要交易条件"}],"answer":["A"],"explanation":"虚盘是指对发盘人和受盘人都无约束力的发盘，发盘人可随时撤回、撤销和修改内容，而受盘人对虚盘表示接受，需经发盘人的确认。虚盘的特点：①在发盘中保留条件。②发盘的内容模糊，不做肯定表示。③缺少主要交易条件。","id":"guanfang-0860","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"multi","stem":"发盘为失效的情形有（ ）。","material":"","options":[{"key":"A","text":"受盘人还盘"},{"key":"B","text":"发盘人依法撤销发盘"},{"key":"C","text":"不可抗力造成发盘的失效"},{"key":"D","text":"发盘人依法撤回发盘"},{"key":"E","text":"在发盘被接受前，当事人丧失行为能力"}],"answer":["A","B","C","E"],"explanation":"符合以下任意一种情形，发盘为失效，发盘人不再受发盘的约束;①受盘人还盘。②发盘人依法撤销发盘。③发盘中规定的有效期届满。④不可抗力造成发盘的失效，如政府禁令或限制措施。③在发盘被接受前，当事人丧失行为能力、死亡或法人破产等。","id":"guanfang-0861","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"multi","stem":"我国对外贸易业务中，主要采用的书面合同有（ ）。","material":"","options":[{"key":"A","text":"合同"},{"key":"B","text":"确认书"},{"key":"C","text":"协议书"},{"key":"D","text":"备忘录"},{"key":"E","text":"意向书"}],"answer":["A","B"],"explanation":"我国对外贸易业务中，主要采用的书面合同是“合同”“确认书”两种。","id":"guanfang-0862","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"国际贸易术语明确的内容不包括（ ）。","material":"","options":[{"key":"A","text":"产品产地"},{"key":"B","text":"交货地点"},{"key":"C","text":"费用划分"},{"key":"D","text":"责任"}],"answer":["A"],"explanation":"国际贸易术语是在长期的国际贸易实践中产生的，用来表示商品的价格构成，说 明交货地点，确定风险、责任、费用划分等问题的专门用语，是贸易合同中价格条款的核心 内容。","id":"guanfang-0863","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"根据《2020年国际贸易术语解释通则》,适用于任何运输方式的贸易术语是（ ）。","material":"","options":[{"key":"A","text":"CIP"},{"key":"B","text":"CFR"},{"key":"C","text":"FOB"},{"key":"D","text":"CIF"}],"answer":["A"],"explanation":"CIP适用于任何运输方式,CFR、FOB、CIF适用于海运或内河水运。","id":"guanfang-0864","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"根据《2020 年国际贸易术语解释通则》,FCA的风险转移界限是（ ）。","material":"","options":[{"key":"A","text":"货物交到船上时"},{"key":"B","text":"货交第一承运人时"},{"key":"C","text":"卖方将货物交到船边时"},{"key":"D","text":"买方处置货物后"}],"answer":["B"],"explanation":"根据《2020 年国际贸易术语解释通则》,FCA的风险转移界限是货交第一承运人。","id":"guanfang-0865","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"关于贸易术语CIF的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"风险转移界限是卖方将货物交到船边时"},{"key":"B","text":"保险责任及费用承担方是卖方"},{"key":"C","text":"进口报关责任及费用承担方是卖方"},{"key":"D","text":"适用于任何运输方式"}],"answer":["B"],"explanation":"根据《2020 年国际贸易术语解释通则》,贸易术语CIF表示：风险转移界限是货物交到船上时，签订运输合同及运费支付方是卖方，保险责任及费用承担方是卖方，出口报关责任及费用承担方是卖方，进口报关责任及费用承担方是买方，适用于海运或内河水运。","id":"guanfang-0866","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"关于信用证审证、改证的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"卖方着重审核信用证内容与买卖合同是否一致"},{"key":"B","text":"卖方如发现信用证内容与合同规定不符，应及时向开证行提出修改"},{"key":"C","text":"在同一信用证上如有多处需要修改的，应当一次提出"},{"key":"D","text":"如一份修改通知书中包括多项内容，只能全部接受或全部拒绝"}],"answer":["B"],"explanation":"信用证是依据合同开立的，信用证内容与合同条款应当一致。在实际业务中，银行着重审核开证行的政治背景、资信能力、付款责任和索汇路线等方面的内容，卖方则着重审核信用证内容与买卖合同是否一致。在审证过程中如发现信用证内容与合同规定不符，应及时提醒开证申请人修改，在同一信用证上如有多处需要修改的，应当一次提出。对通知行转来的修改通知书内容，如经审核不能接受时，应及时表示拒绝。如一份修改通知书中包括多项内容，只能全部接受或全部拒绝，不能只接受其中一部分，而拒绝另一部分。","id":"guanfang-0867","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"在大豆进出口贸易中，规定含水量属于（ ）表示商品质量的方式。","material":"","options":[{"key":"A","text":"凭规格买卖"},{"key":"B","text":"凭等级买卖"},{"key":"C","text":"凭标准买卖"},{"key":"D","text":"凭商标或牌号买卖"}],"answer":["A"],"explanation":"商品的质量可以用说明的方式来表示，主要包括：①凭规格买卖。如规定成交大豆的杂质、含水量等。②凭等级买卖。如特级绿茶。③凭标准买卖。④凭说明书和图样买卖。③凭商标或牌号买卖。③凭产地名称买卖。","id":"guanfang-0868","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"电器和仪表等技术密集型产品的质量适合以（ ）的方式说明。","material":"","options":[{"key":"A","text":"凭规格买卖"},{"key":"B","text":"凭标准买卖"},{"key":"C","text":"凭说明书和图样买卖"},{"key":"D","text":"凭产地名称买卖"}],"answer":["C"],"explanation":"凭说明书和图样买卖指的是有些机器、电器和仪表等技术密集型产品，通常是以说明书并附以图样及各种数据来说明其具体性能和结构特点。","id":"guanfang-0869","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"下列选项中，属于定牌中性包装的是（ ）。","material":"","options":[{"key":"A","text":"包装上既无生产地名和厂商名称，又无商标、牌号"},{"key":"B","text":"包装上只用外商所指定的商标或牌号，而不标明生产国别和出口厂商名称"},{"key":"C","text":"包装上标明我国的商标或牌号，同时也加注国外商号名称或表示其商号的标记"},{"key":"D","text":"包装在采用买方所指定的商标或牌号的同时，在其商标或牌号下标示“中国制造” 字样"}],"answer":["B"],"explanation":"我国定牌生产中涉及定牌包装的具体做法包括下列几种：①在定牌生产的商品或包装上，只用外商所指定的商标或牌号，而不标明生产国别和出口厂商名称，这属于定牌中性包装。②在定牌生产的商品或包装上，标明我国的商标或牌号，同时也加注国外商号名称或表示其商号的标记。③在定牌生产的商品或包装上，在采用买方所指定的商标或牌号的同时，在其商标或牌号下标示“中国制造”字样。","id":"guanfang-0870","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"下列不属于正确刷制运输标志的重要性的是（ ）。","material":"","options":[{"key":"A","text":"掩盖包装内货物的性质"},{"key":"B","text":"保证货物被适当处置"},{"key":"C","text":"帮助收货人识别货物"},{"key":"D","text":"保证包装内货物的品质不受损"}],"answer":["D"],"explanation":"正确刷制运输标志的重要性主要反映在以下四个方面:①符合运输和有关国家海关的规定。②保证货物被适当处置。③掩盖包装内货物的性质。④帮助收货人识别货物。","id":"guanfang-0871","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"出境货物最迟应在出口报关或装运前（ ）报检。","material":"","options":[{"key":"A","text":"24小时"},{"key":"B","text":"3天"},{"key":"C","text":"7天"},{"key":"D","text":"14天"}],"answer":["C"],"explanation":"出境货物最迟应在出口报关或装运前7天报检，对于个别检验检疫周期较长的货物，应留有相应的检验检疫时间。","id":"guanfang-0872","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"关于班轮运输的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"按事先公布的船期表进行有规律的、反复的航行"},{"key":"B","text":"服务对象是非特定的、分散的众多货主"},{"key":"C","text":"货物由承运人负责配载装卸"},{"key":"D","text":"买方凭大副收据向船方或其代理人交付运费并换取正式提单"}],"answer":["D"],"explanation":"班轮运输又称定期船运输，是指船舶在特定航线上和固定港口之间，按事先公布的船期表进行有规律的、反复的航行，以从事货物运输业务并按事先公布的费率收取运费的一种运输方式。它的服务对象是非特定的、分散的众多货主，具有公共承运人的性质。除了基本运费，班轮运价还包括装卸费用，即货物由承运人负责配载装卸。班轮运输中，卖方通常凭大副收据向船方或其代理人交付运费并换取正式提单。","id":"guanfang-0873","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"关于国际贸易中租船业务的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"定期租船又称航次租船"},{"key":"B","text":"定程租船中船舶的经营管理由船方负责"},{"key":"C","text":"定程租船不计算滞期费和速遣费"},{"key":"D","text":"定期租船严格规定船舶航线和装卸港口"}],"answer":["B"],"explanation":"定程租船又称航次租船，是以航程为基础的租船方式。定程租船有以下特点：船舶的经营管理由船方负责；规定一定的航线和装运的货物种类、名称、数量以及装卸港口；船方除对船舶航行、驾驶、管理负责外，还应对货物运输负责；运费按所运货物数量计算，有时也采用整船包干运费；规定一定的装卸期限或装卸率，并计算滞期费和速遣费。定期租船简称期租船，船舶出租人将船舶租给租船人使用一定期限，并在规定的期限内由租船人自行调度和经营管理。定期租船有以下特点：租赁期间，船舶的经营管理由租船人负责；不规定船舶航线和装 卸港口，只规定船舶航行区域；可以装运各种合法货物；不规定装卸期限或装卸率，不计算滞 期费和速遣费；租金按租期每月每吨若干金额计算。","id":"guanfang-0874","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"关于海运提单的作用的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"货物质量合格证明"},{"key":"B","text":"货物运输许可证明"},{"key":"C","text":"物权凭证"},{"key":"D","text":"运费缴纳凭证"}],"answer":["C"],"explanation":"海运提单简称提单，是货物的承运人或其代理人在收到货物后签发给托运人（CIF条件下指卖方）的一种凭证，是海洋运输中的主要单证，具有货物收据、物权凭证和运输契约证明的作用。","id":"guanfang-0875","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"我国海洋运输货物保险险别中，不属于基本险的是（)。","material":"","options":[{"key":"A","text":"平安险"},{"key":"B","text":"水渍险"},{"key":"C","text":"一切险"},{"key":"D","text":"附加险"}],"answer":["D"],"explanation":"我国海洋运输货物保险条款的险别包括基本险和附加险两类。基本险包括平安险、水溃险和一切险，附加险通常包括一般附加险和特殊附加险。 本红著在、含选相阶表","id":"guanfang-0876","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"根据我国《海洋运输货物保险条款》,某批出口货物投保了平安险，下列损失中，可以得到保险赔偿的是（ ）。","material":"","options":[{"key":"A","text":"船舶搁浅导致的部分损失"},{"key":"B","text":"地震、海啸导致的部分损失"},{"key":"C","text":"雷电导致的部分损失"},{"key":"D","text":"恶劣气候导致的部分损失"}],"answer":["A"],"explanation":"根据《海洋运输货物保险条款》（2018版）,平安险的责任范围包括：①被保险货物在运输途中由恶劣气候、雷电、海啸、地震、洪水自然灾害造成整批货物的全部损失或推定全损。②由运输工具遭受搁浅、触礁、沉没、互撞、与流冰或其他物体碰撞以及失火、爆炸意外事故造成货物的全部或部分损失。③在运输工具已经发生搁浅、触礁、沉没、焚毁意外事故的情况下，货物在此前后又在海上遭受恶劣气候、雷电、海啸等自然灾害所造成的部分损失。④在装卸或转运时由一件或数件整件货物落海造成的全部或部分损失。③被保险人对遭受承保责任内危险的货物采取抢救、防止或减少货损的措施而支付的合理费用，但以不超过该批被救货物的保险金额为限。③运输工具遭遇海难后，在避难港由卸货所引起的损失以及在中途港、避难港由卸货、存仓以及运送货物所产生的特别费用。①共同海损的牺牲、分摊和救助费用。③运输契约订有“船舶互撞责任”条款，根据该条款规定应由货方偿还船方的损失。","id":"guanfang-0877","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"信用证议付行收到出口商的出口单据后，经审查无误，将单据寄交国外付款行索取货款的结汇做法是（ ）。","material":"","options":[{"key":"A","text":"收妥结汇"},{"key":"B","text":"定期结汇"},{"key":"C","text":"换汇"},{"key":"D","text":"押汇"}],"answer":["A"],"explanation":"收妥结汇又称收妥付款，是指信用证议付行收到出口商的出口单据后，经审查无误，将单据寄交国外付款行索取货款的结汇做法。这种方式下，议付行收到付款行的货款时，即从国外付款行收到该行账户的贷项通知书时，才按当日外汇牌价，按照出口商的指示，将货款折成人民币划人出口商的账户。","id":"guanfang-0878","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"multi","stem":"国际标准化组织制定的标准运输标志包括（ ）。","material":"","options":[{"key":"A","text":"收货人或买方名称的英文缩写字母或简称"},{"key":"B","text":"参考号"},{"key":"C","text":"原产地"},{"key":"D","text":"目的地"},{"key":"E","text":"件号"},{"key":"F","text":"相对固定的费率"},{"key":"G","text":"固定航线"},{"key":"H","text":"固定港口"},{"key":"I","text":"固定货物"},{"key":"J","text":"固定船期"}],"answer":["A","B","D","E"],"explanation":"国际标准化组织制定的标准运输标志包括四部分：①收货人或买方名称的英文缩写字母或简称。②参考号。如运单号、订单号或发票号。③目的地。④件号。","id":"guanfang-0879","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"multi","stem":"按FOB条件成交的进口合同，货物采用海运的方式进行运输，使用（ ）确定装卸时间比较公平，船、货双方均愿接受。","material":"","options":[{"key":"A","text":"连续日"},{"key":"B","text":"工作日"},{"key":"C","text":"晴天工作日"},{"key":"D","text":"连续24小时晴天工作日"}],"answer":["A","B","C"],"explanation":"班轮运输具有“四固定”的特点，即固定航线、固定港口、固定船期和相对固定的费率。","id":"guanfang-0880","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"滞期费通常约定为每天若干金额，不足一天者（ ）。","material":"","options":[{"key":"A","text":"不计算"},{"key":"B","text":"按比例计算"},{"key":"C","text":"按半天计算"},{"key":"D","text":"按全天计算"}],"answer":["D"],"explanation":"连续24小时晴天工作日，即天气晴好、时钟连续走24小时算一个工作日，在此期间如有几个小时是坏天气不能作业，则予以扣除。这种方法比较公平，船、货双方均愿接受。","id":"guanfang-0881","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"关于滞期费和速遣费的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"滞期费是货方对船方支付的奖金"},{"key":"B","text":"速遣费是船方对货方支付的奖金"},{"key":"C","text":"货方对超过的时间应向船方支付的一定罚金"},{"key":"D","text":"速遣费一般为滞期费的一半"}],"answer":["B"],"explanation":"滞期费和速遣费通常约定为每天若干金额，不足一天者，按比例计算。","id":"guanfang-0882","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"某公司进口一批CIF总值为100万元的五金产品，该批货物于2025年3月3日到达天津港。该公司业务人员在3月20日向海关申报进口时，被海关征收了一笔滞报金，该笔滞报金金额为（ ）元。","material":"","options":[{"key":"A","text":"1500"},{"key":"B","text":"2000"},{"key":"C","text":"8500"},{"key":"D","text":"15000"}],"answer":["A"],"explanation":"滞期费是指在规定的装卸期限内，货方未完成装卸作业，给船方造成经济损失，货方对超过的时间应向船方支付的一定罚金。速遣费是指在规定的装卸期限内，货方提前完成装卸作业，使船方节省了船舶在港的费用开支，船方应向货方就可节省的时间支付的一定奖金。按惯例，速遣费一般为滞期费的一半。","id":"guanfang-0883","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"按FOB条件成交的合同，进口商在提取货物时，以（ ）换取提货单。","material":"","options":[{"key":"A","text":"海运提单"},{"key":"B","text":"进口合同"},{"key":"C","text":"信用证"},{"key":"D","text":"报关单"}],"answer":["A"],"explanation":"进口货物申报时间为自运输工具申报进境之日起14日内。超过规定期限未申报的，由海关依法按日征收滞报金，以自运输工具申报进境之日起第十五日为起征日，以海关接受申报之日为截止日，起征日和截止日均计人滞报期间，另有规定的除外。滞报金的日征收金额为进口货物计税价格（实务中主要指CIF价格）的0.5%o，以人民币“元”为计征单位，不足人民币1元的部分免予计征。本题中，沸报天数为3天，所以该笔滞报金金额= 100000×0.5%×3=1500（元）。","id":"guanfang-0884","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"向卖方索赔应在合同规定的索赔期限内提出，《联合国国际货物销售合同公约》（以下简称《公约》）规定，在合同未明确索赔期限的情况下，索赔期限最长不超过","material":"","options":[{"key":"A","text":"6个月"},{"key":"B","text":"1年"},{"key":"C","text":"2年"},{"key":"D","text":"3年"}],"answer":["A"],"explanation":"按FOB条件成交的合同，一般是运费到付合同，进口商在提取货物时，首先要凭海运提单到承运人或其代理人处付清应付的运费，以海运提单换取提货单。","id":"guanfang-0885","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节国际商品进出口实务","point":"","type":"single","stem":"对承运人发起的进口索赔被称为（ ）。","material":"","options":[{"key":"A","text":"贸易索赔"},{"key":"B","text":"运输索赔"},{"key":"C","text":"保险索赔"},{"key":"D","text":"连带索赔"}],"answer":["C"],"explanation":"向卖方索赔应在合同规定的索赔期限内提出，《公约》规定，在合同未明确索赔期限的情况下，索赔期限最长不超过2年。","id":"guanfang-0886","bank":"guanfang"}]}]};
  </script>
  <script>
  (function () {
    "use strict";
    const STORE = "zjjs_progress_v1";
    const $ = (id) => document.getElementById(id);
    const banks = DATA.banks;
    let progress = load();
    let state = { bankId: null, mode: "study", index: 0, queue: [], answered: false, selected: [] };

    function load() {
      try { return JSON.parse(localStorage.getItem(STORE)) || {}; }
      catch (e) { return {}; }
    }
    function save() {
      try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) {}
    }
    function bank(id) { return banks.find((b) => b.id === id); }
    function pOf(id) {
      if (!progress[id]) progress[id] = { answered: {} };
      return progress[id];
    }
    function answerMap(id) { return pOf(id).answered; }
    function wrongIds(id) {
      const a = answerMap(id);
      const wrong = [];
      for (const q of bank(id).questions) if (a[q.id] === "wrong") wrong.push(q.id);
      return wrong;
    }
    function doneCount(id) { return Object.keys(answerMap(id)).length; }
    function correctCount(id) {
      const a = answerMap(id); let n = 0;
      for (const k in a) if (a[k] === "right") n++;
      return n;
    }

    function renderHome() {
      $("homeView").classList.remove("hidden");
      $("quizView").classList.add("hidden");
      $("homeBtn").hidden = true;
      const bl = $("bankList");
      bl.innerHTML = "";
      banks.forEach((b) => {
        const done = doneCount(b.id), total = b.questions.length;
        const wc = wrongIds(b.id).length;
        const pct = total ? Math.round(done / total * 100) : 0;
        const card = document.createElement("div");
        card.className = "bank-card";
        card.innerHTML =
          '<div class="row"><span class="name">' + b.name + '</span>' +
          '<span class="count">' + done + "/" + total + " · " + pct + "%</span></div>" +
          '<div class="meta">已完成 ' + done + " 题" + (wc ? "，错题 " + wc + " 题" : "") +
          '<span class="reset-link" data-reset="' + b.id + '">重置</span></div>' +
          '<div class="progress"><i style="width:' + pct + '%"></i></div>';
        card.onclick = () => startStudy(b.id);
        card.querySelector(".reset-link").onclick = (e) => {
          e.stopPropagation();
          openReset(b.id);
        };
        bl.appendChild(card);
      });

      const wl = $("wrongList");
      wl.innerHTML = "";
      let any = false;
      banks.forEach((b) => {
        const wc = wrongIds(b.id).length;
        if (!wc) return;
        any = true;
        const row = document.createElement("div");
        row.className = "bank-card";
        row.innerHTML =
          '<div class="row"><span class="name">' + b.name + ' · 错题重温</span>' +
          '<span class="badge red">' + wc + " 题</span></div>";
        row.onclick = () => startReview(b.id);
        wl.appendChild(row);
      });
      if (!any) wl.innerHTML = '<div class="empty">暂无错题。答错的题会自动收集到这里。</div>';
    }

    function buildQueue(b, mode) {
      if (mode === "review") {
        const ws = new Set(wrongIds(b.id));
        return b.questions.filter((q) => ws.has(q.id));
      }
      // study: jump to first unanswered if any, else start at 0
      const a = answerMap(b.id);
      const first = b.questions.findIndex((q) => !a[q.id]);
      return { all: b.questions, start: first < 0 ? 0 : first };
    }

    function startStudy(id) {
      const b = bank(id);
      const q = buildQueue(b, "study");
      state = { bankId: id, mode: "study", index: q.start, queue: q.all, answered: false, selected: [] };
      showQuiz(0);
    }
    function startReview(id) {
      const b = bank(id);
      const queue = buildQueue(b, "review");
      if (!queue.length) { renderHome(); return; }
      state = { bankId: id, mode: "review", index: 0, queue, answered: false, selected: [] };
      showQuiz(0);
    }

    function showQuiz(delta) {
      const b = bank(state.bankId);
      if (state.mode === "review" && !state.queue.length) { renderHome(); return; }
      state.index = Math.max(0, Math.min(state.index + delta, state.queue.length - 1));
      if (state.index >= state.queue.length) { renderHome(); return; }
      state.answered = false;
      state.selected = [];
      $("homeView").classList.add("hidden");
      $("quizView").classList.remove("hidden");
      $("homeBtn").hidden = false;
      $("qResult").classList.add("hidden");
      $("qActions").classList.add("hidden");
      $("submitBtn").classList.remove("hidden");
      $("submitBtn").disabled = true;
      const q = state.queue[state.index];
      const typeLabel = q.type === "multi" ? "多选题" : "单选题";
      const scope = [q.chapter, q.section, q.point].filter(Boolean).join(" / ");
      const modeLabel = state.mode === "review" ? "错题重温" : "刷题";
      $("quizMeta").innerHTML =
        modeLabel + " · " + (state.index + 1) + "/" + state.queue.length +
        ' · 已完成 ' + doneCount(state.bankId) + "/" + b.questions.length +
        ' &nbsp; <span class="qbadge">' + typeLabel + "</span><br>" + scope;
      $("qStem").textContent = q.stem;
      const mat = $("material");
      if (q.material) { mat.textContent = q.material; mat.classList.remove("hidden"); }
      else mat.classList.add("hidden");
      const opts = $("qOpts");
      opts.innerHTML = "";
      q.options.forEach((o) => {
        const d = document.createElement("button");
        d.type = "button";
        d.className = "opt";
        d.innerHTML = '<span class="key">' + o.key + "</span><span class=\"txt\"></span>";
        d.querySelector(".txt").textContent = o.text;
        d.onclick = () => toggleSelect(o.key, q.type);
        opts.appendChild(d);
      });
      window.scrollTo(0, 0);
    }

    function toggleSelect(key, type) {
      if (state.answered) return;
      if (type === "multi") {
        const i = state.selected.indexOf(key);
        if (i >= 0) state.selected.splice(i, 1);
        else state.selected.push(key);
      } else {
        state.selected = [key];
      }
      state.selected.sort();
      renderOpts();
      $("submitBtn").disabled = state.selected.length === 0;
    }

    function renderOpts() {
      const q = state.queue[state.index];
      const keys = q.options.map((o) => o.key);
      const buttons = $("qOpts").children;
      keys.forEach((k, i) => {
        buttons[i].classList.toggle("selected", state.selected.indexOf(k) >= 0);
      });
    }

    function same(a, b) {
      if (a.length !== b.length) return false;
      const sa = a.slice().sort(), sb = b.slice().sort();
      return sa.every((v, i) => v === sb[i]);
    }

    function submit() {
      if (state.selected.length === 0) return;
      const q = state.queue[state.index];
      const correct = same(state.selected, q.answer);
      state.answered = true;
      const a = answerMap(state.bankId);
      a[q.id] = correct ? "right" : "wrong";
      save();

      // highlight options
      const buttons = $("qOpts").children;
      q.options.forEach((o, i) => {
        const isRight = q.answer.indexOf(o.key) >= 0;
        const isSel = state.selected.indexOf(o.key) >= 0;
        buttons[i].disabled = true;
        if (isRight) buttons[i].classList.add("right");
        else if (isSel) buttons[i].classList.add("wrong");
        else buttons[i].classList.add("muted");
      });

      const r = $("qResult");
      r.className = "result " + (correct ? "correct" : "wrong");
      const ansText = q.answer.join("、");
      r.innerHTML =
        '<div><span class="tag">' + (correct ? "回答正确" : "回答错误") + '</span>' +
        ' <span class="ans">正确答案：' + ansText + "</span></div>" +
        (q.explanation ? '<div class="exp">' + escapeHtml(q.explanation) + "</div>" : "");
      r.classList.remove("hidden");
      $("submitBtn").classList.add("hidden");

      const acts = $("qActions");
      acts.classList.remove("hidden");
      const next = $("nextBtn");
      const last = state.index >= state.queue.length - 1;
      next.textContent = last ? "完成本套" : "下一题";
      next.onclick = () => {
        if (last) renderHome();
        else showQuiz(1);
      };
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    $("submitBtn").onclick = submit;
    $("homeBtn").onclick = renderHome;

    let resetTarget = null;
    function openReset(id) {
      resetTarget = id;
      $("resetText").textContent = "将清空《" + bank(id).name + "》的作答记录与错题，且不可恢复。";
      $("resetMask").classList.remove("hidden");
    }
    $("resetCancel").onclick = () => { $("resetMask").classList.add("hidden"); resetTarget = null; };
    $("resetOk").onclick = () => {
      if (resetTarget) { progress[resetTarget] = { answered: {} }; save(); }
      $("resetMask").classList.add("hidden");
      resetTarget = null;
      renderHome();
    };

    renderHome();
  })();
  </script>
