C、D错误，根据财政政策在调节国民经济总量和结构中的不同功能来划分：扩张性财政政策、紧缩性财政政策、中性财政政策。故本题选AE选项。","id":"jichu-0123","bank":"jichu"},{"chapter":"刷章节母题 第十七章 财政政策 共6题","point":"财政政策乘数与时滞","type":"single","stem":"根据财政乘数效应原理，如果政府投资扩大、税收减少，对宏观经济会产生（ ）。效应。","material":"","options":[{"key":"A","text":"平衡"},{"key":"B","text":"紧缩O"},{"key":"C","text":"扩张"},{"key":"D","text":"挤出"}],"answer":["C"],"explanation":"本题考查财政乘数效应。，.。财政乘数效应表明：当政府投资或支出扩大、税收减少时，对国民收入有加倍扩大的作用，从而产生宏观经济的扩张效应；当政府投资或支出减少、税收增加时，对国民收入有加倍收缩的作用，从而产生宏观经济的紧缩效应。故本题选C选项。","id":"jichu-0124","bank":"jichu"},{"chapter":"刷章节母题 第十七章 财政政策 共6题","point":"财政政策乘数与时滞","type":"multi","stem":"与决策单位发生直接关系，而且直接影响社会经济活动的财政政策时滞有（ ）。","material":"","options":[{"key":"A","text":"认识时滞"},{"key":"B","text":"行政时滞"},{"key":"C","text":"决策时滞"},{"key":"D","text":"执行时滞"},{"key":"E","text":"效果时滞"}],"answer":["C","D","E"],"explanation":"本题考查财政政策时滞。财政政策时滞有内在时滞和外在时滞之分，其中外在时滞是指从财政当局采取具体措施到这些措施对经济体系产生影响的这一段时间，包括决策时滞、执行时滞、效果时滞，它们与决策单位发生直接关系，而且直接影响社会经济活动（选项C、 D.E正确)。内在时滞只涉及行政单位，与立法机关无关，即这种时滞只属于研究过程，与决策机关没有关系，包括认识时滞和行政时滞（选项A、B错误)。故本题选CDE选项。","id":"jichu-0125","bank":"jichu"},{"chapter":"刷章节母题 第十八章 货币供求与货币均衡 共8题","point":"货币需求","type":"multi","stem":"下列关于货币需求的说法中，正确的是（ ）。","material":"","options":[{"key":"A","text":"货币需求是有效需求"},{"key":"B","text":"货币需求是主观需求"},{"key":"C","text":"货币需求是有支付能力的需求"},{"key":"D","text":"货币需求是派生需求"},{"key":"E","text":"货币需求是一种经济需求"}],"answer":["A","C","D","E"],"explanation":"本题考查货币需求与货币需求量。货币需求作为一种经济需求，理应是由货币需求能力和货币需求愿望共同决定的有效需求，选项A、E正确货币需求不单纯是一种心理上的欲望，而是能力和愿望的统一体，其不是一种主观愿望，选项B错误。货币需求是有支付能力的需求。货币是固定充当一般等价物的特殊商品，具有流通手段、支付手段和贮藏手段等职能，能够满足商品生产和交换的需要，以及以货币形式持有财富的需要等，选项C正确。货币需求是一种派生需求，派生于人们对商品的需要，选项D正确。故本题选ACDE选项。","id":"jichu-0126","bank":"jichu"},{"chapter":"刷章节母题 第十八章 货币供求与货币均衡 共8题","point":"货币需求","type":"single","stem":"在流动性偏好理论对货币需求动机的分析中，将由于收入和支出时间的不一致，为进行日常交易而产生的持有货币的愿望称为（ ）。","material":"","options":[{"key":"A","text":"预防动机"},{"key":"B","text":"投机动机"},{"key":"C","text":"交易动机"},{"key":"D","text":"平衡动机"}],"answer":["C"],"explanation":"本题考查凯恩斯的货币需求理论。人凯恩斯流动性偏好理论指出货币需求是由三类动机决定的，即：（1）交易动机，即由于收入和支出的时间不一致，为进行日常交易而产生的持有货币的愿望，选项C正确。（2）预防动机，即为应付各种紧急情况而产生的持有货币的愿望，选项A错误。（3）投机动机，即由于利率的不确定性，根据对市场利率变化的预期需要持有货币以便从中获利的货币需求动机，选项B错误。平衡动机是指由于消费者本人存在某些方面的不足，需要通过消费商品来弥补个人的不足以取得心理平衡的消费动机，选项D错误。故本题选C选项。","id":"jichu-0127","bank":"jichu"},{"chapter":"刷章节母题 第十八章 货币供求与货币均衡 共8题","point":"货币供给","type":"multi","stem":"根据我国目前货币层次的划分，属于广义货币M2层次的有（ ）。","material":"","options":[{"key":"A","text":"单位活期存款"},{"key":"B","text":"单位定期存款"},{"key":"C","text":"流通中的货币"},{"key":"D","text":"个人定期存款"},{"key":"E","text":"财政存款"}],"answer":["A","B","C","D"],"explanation":"本题考查货币供给层次的划分。，，。..。，。MO=流通中货币；M1=MO+单位活期存款+个人活期存款+非银行支付机构客户备付金；M2=M1+单位定期存款+个人定期存款+其他存款（财政存款除外）。故本题选ABCD选项。","id":"jichu-0128","bank":"jichu"},{"chapter":"刷章节母题 第十八章 货币供求与货币均衡 共8题","point":"货币供给","type":"multi","stem":"商业银行的信用扩张能力并非无限的，一般来说，银行体系扩张信用、创造派生存款的能力要受到限制。以下各项中，不属于其限制因素的有（ ）。","material":"","options":[{"key":"A","text":"自身资金不足"},{"key":"B","text":"提取现金数量"},{"key":"C","text":"企事业单位及社会公众缴付税款"},{"key":"D","text":"信贷资产流动性"},{"key":"E","text":"缴存中央银行存款准备金"}],"answer":["A","D"],"explanation":"本题考查货币供给机制。一般来说，银行体系扩张信用、创造派生存款的能力要受到三类因素的制约：（1）受到缴存中央银行存款准备金的限制（选项E不符合题意）；（2）受到提取现金数量的限制（选项B不符合题意）；（3）受到企事业单位及社会公众缴付税款的限制（选项C不符合题意）。总的来说，基础货币的漏出，会限制银行体系扩张信用、创造派生存款的能力。选项A、D符合题意，存款准备金是指金融机构为保证客户提取存款和资金清算需要而准备的，在中央银行的存款。故本题选AD选项。","id":"jichu-0129","bank":"jichu"},{"chapter":"刷章节母题 第十八章 货币供求与货币均衡 共8题","point":"货币均衡","type":"single","stem":"下列关于货币失衡说法错误的是（ ）。 人","material":"","options":[{"key":"A","text":"结构性货币失衡主要发生在发展中国家"},{"key":"B","text":"总量性货币失衡和结构性货币失衡是相互联系、相互交织在一起的"},{"key":"C","text":"总量性货币失衡是指货币供给在总量上偏离货币需求达到一定程度从而使货币运行影响经济的状态"},{"key":"D","text":"总量性货币失衡的原因是社会经济结构不合理，所以必须通过经济结构调整加以解决"}],"answer":["D"],"explanation":"本题考查货币均衡与失衡。，选项A正确，结构性失衡主要发生在发展中国家，是指在货币供给与需求大体一致的总量均衡条件下，货币供给结构与对应的货币需求结构不相适应。选项B正确，总量性货币失衡和结构性货币失衡不是非此即彼的简单关系，在现实经济运行中往往是两者相互交织、相互联系，从而形成“你中有我，我中有你”的局面，以至于难以分辨。选项C正确，总量性货币失衡是指货币供给在总量上偏离货币需求达到一定程度 从而使货币运行影响经济的状态。 选项D错误，结构性货币失衡的原因是社会经济结构不合理，所以必须通过经济 结构调整加以解决。 故本题选D选项。","id":"jichu-0130","bank":"jichu"},{"chapter":"刷章节母题 第十八章 货币供求与货币均衡 共8题","point":"货币均衡","type":"multi","stem":"下列关于货币均衡水平决定的说法中，正确的有（ ）。","material":"","options":[{"key":"A","text":"货币在运动过程中通过其内在机制的自我调节，能够自发保持供给与需求的均衡关系"},{"key":"B","text":"流通领域的货币数量取决于货币的均衡水平"},{"key":"C","text":"假定货币流通速度相对稳定，货币供应量（M1）应当与国内生产总值（GDP）同步增长"},{"key":"D","text":"若将物价自然上升因素考虑进去，流通领域中货币数量的增长应略低于国内生产总值的增长"},{"key":"E","text":"随着产品的更新换代，技术性能不断提高，无形中使同类产品的价格自然上升，这种价格上升属于物价自然上涨"}],"answer":["A","B","C","E"],"explanation":"本题考查货币均衡水平决定。货币在运动过程中通过其内在机制的自我调节，能够自发保持供给与需求的均衡关系，而货币供应量正是按货币需求向流通领域供给货币的结果，是货币供求关系的产物。流通领域的货币数量取决于货币的均衡水平，选项A、B正确。保持总需求与总供给的均衡关系，要求处理好货币数量与经济增长之间的关系。要保证国民经济在物价稳定的条件下协调发展，就必须使流通领域中货币数量的增长幅度与国民经济的增长速度相匹配。假定货币流通速度相对稳定，货币供应量（M1）就应当与国内生产总值（GDP）同步增长，选项C正确。在现代信用货币制度下，剔除通货膨胀等非正常因素的影响，仍存在着物价水平自然上升的倾向。若将物价自然上升因素考虑进去，则流通领域中货币数量的增长应略高于国内生产总值的增长，选项D错误。物价自然上涨的因素：①在调整产品价格剪刀差现象时，一般是通过调高价格低于价值的那部分劳动密集型产品的价格，以使价格体系趋于合理化，结果必然是价格总水平上涨。②随着产品的更新换代，技术性能不断提高，也无形中使同类产品的价格自然上升，结果也是导致物价总水平的不断上涨，选项E正确。故本题选ABCE选项。","id":"jichu-0131","bank":"jichu"},{"chapter":"刷章节母题 第十八章 货币供求与货币均衡 共8题","point":"通货膨胀","type":"multi","stem":"下列关于通货膨胀的表述正确的是（ ）。","material":"","options":[{"key":"A","text":"通货膨胀是有效需求大于有效供给"},{"key":"B","text":"通货膨胀经常是由货币供给过度所引起的"},{"key":"C","text":"通货膨胀是指一般物价水平持续上涨的状态"},{"key":"D","text":"通货膨胀普遍反映为物价持续上涨"},{"key":"E","text":"通货膨胀是指一次性或短期的价格总水平的上升"}],"answer":["A","B","C","D"],"explanation":"本题考查通货膨胀的含义。有的认为通货膨胀是一种普遍的超额需求，即太多的货币追逐太少的商品；有的 认为是人均货币存量或人均货币所得的普遍上升；有的则认为是因不能增加就业 或产出的货币投入导致的物价水平处于持续上升的状态；等等。 尽管说法多种多样，但有两点是共同的：一是有效需求大于有效供给，二是物价 持续上涨，选项A、B、C、D正确。 选项E错误，通货膨胀不是指一次性或短期的价格总水平的上升，只有当价格持 续的上涨作为趋势不可逆转时，才可称为通货膨胀。 故本题选ABCD选项。","id":"jichu-0132","bank":"jichu"},{"chapter":"刷章节母题 第十八章 货币供求与货币均衡 共8题","point":"通货膨胀","type":"multi","stem":"关于通货膨胀的原因，下列说法中正确的是（ ）。","material":"","options":[{"key":"A","text":"在现代信用货币制度下，银行体系的活期存款对货币均衡状况没有影响，与通货膨胀无关"},{"key":"B","text":"形成通货膨胀的直接原因不仅在于过度的现金发行，更在于过度的信用供给"},{"key":"C","text":"财政赤字或推行赤字财政政策，可能造成通货膨胀"},{"key":"D","text":"“信用膨胀”是通货膨胀的幕后推手"},{"key":"E","text":"过度的信贷供给是造成通货膨胀的间接原因"}],"answer":["B","C","D"],"explanation":"本题考查通货膨胀的原因。导致通货膨胀的直接原因有：（ ）。从定义看，通货膨胀是由于货币供给过度，导致货币贬值，物价上涨。在现代信用货币制度下，货币不仅包括中央银行发行的现金，而且包括银行体系的活期存款。此外，银行的其他存款以及其他信用流通工具，也同货币供应量有着密切的数量替代关系，对货币均衡状况产生重要影响（选项A错误）。在现代经济生活中，形成通货膨胀的直接原因不仅在于过度的现金发行，更在于过度的信用供给（选项B正确）。无论是现金通货还是存款货币，都是通过信贷供给的，因此，过度的信贷供给是造成通货膨胀的直接原因（选项E错误）。导致通货膨胀的主要原因有两个方面：／（ ）。（1）财政原因。因财政原因迫使过度供给货币的情况有两种，即发生财政赤字和推行赤字财政政策（选项C正确）。（2）信贷原因。因信贷原因迫使过度供给货币的情况主要是指银行信用提供的货币量超过了经济发展对货币数量的客观需求，一般称为“信用膨胀”（选项D正确)。引起信用膨胀的原因有很多，既有来自财政赤字的压力，也有来自社会上过热的经济增长要求的压力，还有来自银行自身决策失误的原因。故本题选BCD选项。包","id":"jichu-0133","bank":"jichu"},{"chapter":"刷章节母题 第十九章 中央银行与货币政策 共4题","point":"中央银行","type":"multi","stem":"下列关于中央银行的地位、职能和制度的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"中央银行也称货币当局，处于金融中介体系的中心环节"},{"key":"B","text":"中央银行是开发的银行、银行的银行和政府的银行"},{"key":"C","text":"中央银行具有国家行政管理机关和银行的双重性质"},{"key":"D","text":"中央银行制度的形成是与中央银行的产生与发展联系在一起的。"},{"key":"E","text":"中央银行是国家干预经济、调节全国货币流通与信用的金融管理机关，它代表国家管理金融，制定和执行金融方针政策"}],"answer":["A","C","D","E"],"explanation":"本题考查中央银行制度。中央银行也称货币当局，处于金融中介体系的中心环节，具有特殊的地位，选项A正确。中央银行是发行的银行、银行的银行和政府的银行，具有国家行政管理机关和银行的双重性质，选项B错误、选项C正确。（中央银行制度的形成是与中央银行的产生与发展联系在一起的，选项D正确。中央银行是国家干预经济、调节全国货币流通与信用的金融管理机关，它代表国家管理金融，制定和执行金融方针政策，选项E正确。故本题选ACDE选项。","id":"jichu-0134","bank":"jichu"},{"chapter":"刷章节母题 第十九章 中央银行与货币政策 共4题","point":"中央银行","type":"multi","stem":"以下项目中，属于中央银行对政府的业务有（ ）。","material":"","options":[{"key":"A","text":"货币发行业务"},{"key":"B","text":"经理国库业务"},{"key":"C","text":"作为最后贷款人"},{"key":"D","text":"主持全国清算"},{"key":"E","text":"保管外汇和黄金储备"}],"answer":["B","E"],"explanation":"本题考查中央银行的主要业务。人中央银行的主要业务：（1）货币发行业务（选项A错误）；）（2）对银行的业务：集中存款准备金、充当最后贷款人、组织全国银行间的清算（选项C、D错误)；（3）对政府业务：经理国库、代理国家债券发行、对国家给予信贷支持、保管外汇和黄金储备、制定并监督执行有关金融管理法规、代表政府参加国际金融组织，出席国际会议（选项B、E正确）。故本题选BE选项。","id":"jichu-0135","bank":"jichu"},{"chapter":"刷章节母题 第十九章 中央银行与货币政策 共4题","point":"货币政策","type":"multi","stem":"下列选项关于货币政策及其目标的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"货币政策也就是金融政策"},{"key":"B","text":"货币政策的目标应该是解决微观经济问题的决策"},{"key":"C","text":"货币政策一般包括政策目标、实现目标所运用的政策工具两个方面的内容"},{"key":"D","text":"货币政策目标一般包括稳定物价；经济增长；充分就业；平衡国际收支"},{"key":"E","text":"我国货币政策目标是保持货币币值稳定，并以此促进经济的增长"}],"answer":["D","E"],"explanation":"本题考查货币政策的含义与目标体系。，。，货币政策并不等同于金融政策，它只是金融政策的一部分，选项A错误。货币政策的作用范围是宏观经济领域，货币政策的目标应该是解决宏观经济问题的决策，选项B错误。货币政策一般包括三个方面的内容：①政策目标；②实现目标所运用的政策工具；③预期达到的政策效果，选项C错误。货币政策目标一般包括：稳定物价；经济增长；充分就业；平衡国际收支，选项D正确。《中国人民银行法》第三条规定：“货币政策目标是保持货币币值稳定，并以此促进经济的增长”，选项E正确。故本题选DE选项。","id":"jichu-0136","bank":"jichu"},{"chapter":"刷章节母题 第二十章 商业银行与金融市场 共4题","point":"商业银行的运营与管理","type":"single","stem":"在下列关于商业银行和中央银行本质特征的表述中，正确的是（ ）。","material":"","options":[{"key":"A","text":"都能对工商企业发放贷款"},{"key":"B","text":"都追求利润最大化"},{"key":"C","text":"商业银行能吸收社会公众的活期存款，中央银行则不能"},{"key":"D","text":"商业银行承担货币发行任务，中央银行则没有"}],"answer":["C"],"explanation":"本题考查商业银行的内涵。商业银行是最典型的银行，是以营利为目的、主要以吸收存款和发放贷款形式为工商企业或个人提供融资服务，并办理结算业务的金融企业。中央银行不以营利为目的，其业务服务对象是政府、商业银行及其他金融机构，选项A、B错误。货币发行是中央银行的主要业务，选项D错误。商业银行是唯一能够面向公众吸收活期存款的金融机构，选项C正确。故本题选C选项。","id":"jichu-0137","bank":"jichu"},{"chapter":"刷章节母题 第二十章 商业银行与金融市场 共4题","point":"商业银行的运营与管理","type":"single","stem":"在商业银行管理中，安全性原则的基本含义是在放款和投资等业务经营过程中","material":"","options":[{"key":"A","text":"必须保有一定比例的现金资产或其他容易变现的资产"},{"key":"B","text":"要能够按期收回本息，特别是要避免本金受损"},{"key":"C","text":"要有较强的取得现款的能力"},{"key":"D","text":"必须获得尽可能高的收益"}],"answer":["B"],"explanation":"本题考查商业银行的经营管理。商业银行经营管理的基本原则：盈利性原则、流动性原则和安全性原则。（1）盈利性原则：商业银行在经营资产业务中，必须获得尽可能高的收益，注重资产业务的盈利性，是商业银行业务经营的首要原则，选项D错误。 （2）流动性原则： ①商业银行必须保有一定比例的现金资产或其他容易变现的资产； ②商业银行取得现款的能力，选项A、C错误。 （3）安全性原则：商业银行在放款和投资等业务经营过程中要能够按期收回本 息，特别是要避免本金受损，选项B正确。 故本题选B选项。","id":"jichu-0138","bank":"jichu"},{"chapter":"刷章节母题 第二十章 商业银行与金融市场 共4题","point":"金融市场","type":"multi","stem":"关于金融市场运行机理的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"引起金融债权、债务的产生和清偿"},{"key":"B","text":"资金只有在运动过程中才能够创造价值"},{"key":"C","text":"金融资产的所有权发生变化（"},{"key":"D","text":"货币资金在使用方面总是存在着“时间差”和“空间差”"},{"key":"E","text":"金融市场使金融交易客观需求产生"}],"answer":["A","B","C","D"],"explanation":"本题考查金融市场运行机理。金融交易是指在金融市场上发生的金融资产所有权的变化，引起金融债权、债务的产生和清偿的交易（选项A、C正确）。从全社会来看，在同一时间内，既存在着资金不足的单位，又存在着资金盈余的单位，即货币资金在使用方面总是存在着“时间差”和“空间差”（选项D正确），资金只有在运动过程中才能够创造价值（选项B正确）并使价值增加，这样，就产生了金融交易的客观需求。金融交易是指在金融市场上发生的金融资产所有权变化，引起金融债权、债务的产生和清偿的交易（选项E错误），应该是资金运动过程创造和增加价值使金融交易的客观需求产生。故本题选ABCD选项。","id":"jichu-0139","bank":"jichu"},{"chapter":"刷章节母题 第二十章 商业银行与金融市场 共4题","point":"金融市场","type":"single","stem":"美国经济学家法玛认为，如果有关证券的历史资料不影响证券价格的变动，则证券市场达到（ ）。","material":"","options":[{"key":"A","text":"弱型效率"},{"key":"B","text":"半强型效率"},{"key":"C","text":"半弱型效率"},{"key":"D","text":"强型效率"}],"answer":["A"],"explanation":"本题考查有效市场理论。根据信息对证券价格的影响程度，法玛将市场有效性分为三类：（1）弱型效率：证券市场效率的最低程度，如果有关证券的历史资料（如价格、交易量等）对证券的价格变动没有任何影响，则市场达到弱型效率（选项A正确)。（2）半强型效率：证券市场效率的中等程度，如果有关证券公开发表的资料（如公司对外公布的盈利报告等）对证券的价格变动没有任何影响，则市场达到半强型效率。（3）强型效率：证券市场效率的最高程度，如果有关证券的所有相关信息，包括公开发表的资料以及内幕信息对证券的价格变动没有任何影响，即证券价格充 分、及时地反映了与证券有关的所有信息，则证券市场达到强型效率。 故本题选A选项。","id":"jichu-0140","bank":"jichu"},{"chapter":"刷章节母题 第二十一章 金融风险与金融监管 共10题","point":"金融风险","type":"single","stem":"在市场经济体系中，金融风险具有（ ）。","material":"","options":[{"key":"A","text":"确定性"},{"key":"B","text":"低杠杆性"},{"key":"C","text":"传染性"},{"key":"D","text":"独立性"}],"answer":["C"],"explanation":"本题考查金融风险的特征。金融风险的特征包括不确定性、相关性、高杠杆性和传染性。故本题选C选项。","id":"jichu-0141","bank":"jichu"},{"chapter":"刷章节母题 第二十一章 金融风险与金融监管 共10题","point":"金融风险","type":"single","stem":"由于原油价格暴跌导致原油期货合同出现大幅亏损，这种金融风险属于（ ）。","material":"","options":[{"key":"A","text":"流动性风险"},{"key":"B","text":"市场风险（"},{"key":"C","text":"信用风险"},{"key":"D","text":"操作风险。"}],"answer":["B"],"explanation":"本题考查金融风险类型。常见的金融风险有四类：（1）由于市场因素（利率、汇率、股价以及商品价格等）的波动而导致的金融参与者的资产价值变化的市场风险。（2）由于借款人或市场交易对手的违约而导致损失的信用风险。（3）金融参与者由于资产流动性降低而导致的流动性风险。（4）由于金融机构交易系统不完善、管理失误或其他一些人为错误而导致的操作风险。本题通过“价格”可选择“市场风险”。故本题选B选项。人","id":"jichu-0142","bank":"jichu"},{"chapter":"刷章节母题 第二十一章 金融风险与金融监管 共10题","point":"金融危机","type":"multi","stem":"关于金融危机的说法，正确的是（ ）。高句","material":"","options":[{"key":"A","text":"金融危机是指一个国家或几个国家与地区的全部或大部分金融指标出现急剧、短暂和超周期恶化"},{"key":"B","text":"金融危机的发生具有频繁性、广泛性、传染性和不严重性的特点"},{"key":"C","text":"在世界范围内，除了美国等少数大国外，几乎所有的国家都曾经遭受过危机的侵袭"},{"key":"D","text":"金融危机会使一国实体经济受到影响，经济增长放缓甚至衰退，严重时还会令金融市场完全崩溃，甚至导致国家破产"},{"key":"E","text":"金融危机的发生不局限于经济的某一方面，现实中的金融危机都是综合性金融危机，"}],"answer":["A","D","E"],"explanation":"本题考查金融危机的含义及特点。金融危机是指一个国家或几个国家与地区的全部或大部分金融指标（如短期利率、金融资产、房地产、商业破产数和金融机构倒闭数等）的急剧、短暂和超周期的恶化，选项A正确。金融危机的发生具有频繁性、广泛性、传染性和严重性等特点，其后果已严重影响到区域甚至全球经济金融系统的稳定性，选项B错误。在世界范围内，几乎所有的国家都曾经遭受过危机的侵袭，选项C错误。金融危机会使一国实体经济受到影响，经济增长放缓甚至衰退，严重时还会令金融市场完全崩溃，甚至导致国家破产，选项D正确。在现代经济中，随着全球化的发展，金融危机的国际性更为突出。金融危机的发生不局限于经济的某一方面，现实中的金融危机都是综合性金融危机，选项E正确。故本题选ADE选项。","id":"jichu-0143","bank":"jichu"},{"chapter":"刷章节母题 第二十一章 金融风险与金融监管 共10题","point":"金融危机","type":"multi","stem":"关于不同类型金融危机的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"流动性危机主要限于一国国内发生，不会在国际间蔓延"},{"key":"B","text":"支付能力危机主要是指一国的债务不合理、无法按期偿还债务而引起的危机"},{"key":"C","text":"发生内部综合性危机的国家的共同特点是金融体系脆弱，危机由证券行业传导至整个经济体系"},{"key":"D","text":"国际债务危机、欧洲货币危机和亚洲金融危机的共同特点是危机国家实行钉住汇率制度"},{"key":"E","text":"综合性金融危机一定程度上暴露了危机国家所存在的深层次结构问题"}],"answer":["B","D","E"],"explanation":"本题考查金融危机的类型。选项A错误，流动性危机包括国内流动性危机和国际流动性危机。流动性危机不仅限于一国国内发生，也会在国际间蔓延。选项B是支付能力危机的含义。选项C错误，发生内部综合性危机的国家的共同特点是金融体系脆弱，危机由银行传导至整个经济体系。选项D正确，国际债务危机、欧洲货币危机和亚洲金融危机的共同特点是危机国家实行钉住汇率制度。人选项E正确，综合性危机一方面严重损害了相关国家的经济金融利益，且极易升级为经济危机或政治危机；另一方面也在一定程度上暴露了危机国家所存在的深层次结构问题。意包A成故本题选BDE选项。","id":"jichu-0144","bank":"jichu"},{"chapter":"刷章节母题 第二十一章 金融风险与金融监管 共10题","point":"金融监管理论","type":"multi","stem":"金融监管可以实施（ ）行为。","material":"","options":[{"key":"A","text":"外部监督"},{"key":"B","text":"稽核"},{"key":"C","text":"检查"},{"key":"D","text":"对违法违规行为进行处罚"},{"key":"E","text":"内部审计"}],"answer":["A","B","C","D"],"explanation":"本题考查金融监管的含义。金融监管或称金融监督管理，是指一国的金融管理部门为达到稳定货币、维护金融业正常秩序等目的，依照国家法律、行政法规的规定，对金融机构及其经营活动实施外部监督、稽核、检查和对其违法违规行为进行处罚等一系列行为。故本题选ABCD选项。","id":"jichu-0145","bank":"jichu"},{"chapter":"刷章节母题 第二十一章 金融风险与金融监管 共10题","point":"金融监管理论","type":"single","stem":"监管是政府对公众要求纠正某些社会个体和社会组织的不公平、不公正和无效率或低效率的一种回应。这种理论属于金融监管理论中的（ ）。","material":"","options":[{"key":"A","text":"金融风险控制论"},{"key":"B","text":"信息不对称论"},{"key":"C","text":"保护债权论"},{"key":"D","text":"公共利益论"}],"answer":["D"],"explanation":"本题考查金融监管的一般性理论。公共利益论认为监管是政府对公众要求纠正某些社会个体和社会组织的不公平、不公正和无效率或低效率的一种回应，选项D正确。金融风险控制论来源于“金融不稳定假说”，认为银行的利润最大化目标促使其系统内增加有风险的活动，导致系统内的不稳定性，选项A错误。保护债权论的观点是一一为了保护债权人的利益，需要金融监管。所谓债权人就是存款人、证券持有人和投保人等，选项C错误。“信息不对称论”不属于金融监管的一般性理论，选项B错误。故本题选D选项。","id":"jichu-0146","bank":"jichu"},{"chapter":"刷章节母题 第二十一章 金融风险与金融监管 共10题","point":"金融监管体制","type":"multi","stem":"金融监管体制从监管客体的角度分类分为（ ）。","material":"","options":[{"key":"A","text":"综合监管体制"},{"key":"B","text":"分业监管体制"},{"key":"C","text":"以中央银行为重心的监管体制"},{"key":"D","text":"独立于中央银行的综合监管体制"},{"key":"E","text":"综合监管与分业监管相结合的监管体制人"}],"answer":["A","B"],"explanation":"本题考查金融监管体制的含义与分类。金融监管体制从监管客体的角度分类分为综合监管体制和分业监管体制，选项A、B正确。从银行的监管主体以及中央银行的角色来分类分为以中央银行为重心的监管体制和独立于中央银行的综合监管体制，选项C、D、E错误。故本题选AB选项。 ；提醒； （2）分业监管体制：分业监管体制是对不同类型的金融机构分别设立不同的专 门机构进行监管。当前，大多数发展中国家，包括中国，仍然实行分业监管体制， 主要原因是：①实行分业经营体制;②金融发展水平不高;③金融监管能力不足。","id":"jichu-0147","bank":"jichu"},{"chapter":"刷章节母题 第二十一章 金融风险与金融监管 共10题","point":"金融监管体制","type":"single","stem":"我国形成了由银监会、证监会和保监会组成的分业管理体制。新的监管体制下，中央银行将继续发挥其独特的作用，说法不正确的有（ ）。","material":"","options":[{"key":"A","text":"作为最后贷款人在必要时救助高风险金融机构"},{"key":"B","text":"共享监管信息，采取各种措施防范系统性金融风险"},{"key":"C","text":"由国务院建立监管协调机制"},{"key":"D","text":"作为第一贷款人在必要时救助高风险金融机构"}],"answer":["D"],"explanation":"本题考查我国金融监管体制演变。自20世纪80年代以来，我国的金融监管体制根据金融发展情况不断演变，经历了单一全能型体制、分业监管和综合监管体制。中国人民银行及其分支机构的职能主要包括以下几个方面：（1）作为最后贷款人在必要时救助高风险金融机构，选项A正确、选项D错误。（2）共享监管信息，采取各种措施防范系统性金融风险，选项B正确。（3）由国务院建立监管协调机制，选项C正确。中国人民银行在金融监管方面拥有监督检查权。故本题选D选项。（ ）。","id":"jichu-0148","bank":"jichu"},{"chapter":"刷章节母题 第二十一章 金融风险与金融监管 共10题","point":"国际金融监管协调","type":"single","stem":"关于巴塞尔协议的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"巴塞尔协议是国际货币基金组织成员国达成的一系列重要协议的统称"},{"key":"B","text":"1988年巴塞尔报告确认了监督银行资本的可行的统一标准"},{"key":"C","text":"2003年新巴塞尔资本协议推出了最低资本要求、监管当局的监督检查及市场约束的内容"},{"key":"D","text":"2010年巴塞尔协议IⅢI体现了微观审慎监管与宏观审慎监管有机结合的监管新思维"}],"answer":["A"],"explanation":"本题考查巴塞尔协议产生的背景与发展。选项A错误，巴塞尔协议是国际清算银行成员国达成的一系列重要协议的统称。选项B正确，1988年巴塞尔报告确认了监督银行资本的可行的统一标准。生成选项C正确，在2003年新巴塞尔资本协议中，最引人注目的是该协议提出的最低资本要求、监管当局的监督检查以及市场约束的内容，被称为巴塞尔协议的“三大支柱”。选项D正确，2010年巴塞尔协议IⅢI体现了微观审慎监管与宏观审慎监管有机结合的监管新思维。故本题选A选项。","id":"jichu-0149","bank":"jichu"},{"chapter":"刷章节母题 第二十一章 金融风险与金融监管 共10题","point":"国际金融监管协调","type":"single","stem":"2010年巴塞尔委员会对现行银行监管国际规则进行了重大改革，确定了三个最低资本充足率监管标准，其中普通股充足率为（ ）。","material":"","options":[{"key":"A","text":"4%"},{"key":"B","text":"8%"},{"key":"C","text":"6%"},{"key":"D","text":"4. 5%"}],"answer":["D"],"explanation":"本题考查巴塞尔协议ⅢI。2009年中期以来，基于美国次贷危机引起全球金融危机的教训，巴塞尔委员会对现行银行监管国际规则进行了重大改革，发布了一系列国际银行业监管新标准，统称为巴塞尔协议ⅢI。巴塞尔委员会确定了三个最低资本充足率监管标准，普通股充足率为4.5%，一级资本充足率为6%，总资本充足率为8%。故本题选D选项。","id":"jichu-0150","bank":"jichu"},{"chapter":"刷章节母题 第二十二章 对外金融关系与政策 共8题","point":"汇率制度","type":"multi","stem":"一般来说，决定一个国家汇率制度的因素主要有（ ）。","material":"","options":[{"key":"A","text":"经济开放程度"},{"key":"B","text":"经济规模"},{"key":"C","text":"进出口贸易的商品结构和地域分布"},{"key":"D","text":"居民消费习惯"},{"key":"E","text":"相对通货膨胀率"}],"answer":["A","B","C","E"],"explanation":"本题考查影响汇率制度选择的因素。决定一个国家汇率制度的因素有：（2）经济规模；（3）国内金融市场的发达程度及其国际金融市场的一体程度；（4）进出口贸易的商品结构和地域分布；（（5）相对的通货膨胀率。故本题选ABCE选项。","id":"jichu-0151","bank":"jichu"},{"chapter":"刷章节母题 第二十二章 对外金融关系与政策 共8题","point":"汇率制度","type":"multi","stem":"当前我国人民币汇率制度的特点有（ ）。","material":"","options":[{"key":"A","text":"汇率以市场供求为基础"},{"key":"B","text":"可调整的固定汇率"},{"key":"C","text":"参考一篮子货币进行调节"},{"key":"D","text":"有管理的汇率（"},{"key":"E","text":"浮动汇率"}],"answer":["A","C","D","E"],"explanation":"本题考查人民币汇率制度。2005年7月21日，在主动性、可控性、渐进性原则的指导下，改革人民币汇率形成机制，实行以市场供求为基础，参考一篮子货币进行调节、有管理的浮动汇率制度。选项B为布雷顿森林体系的运行特征。故本题选ACDE选项。","id":"jichu-0152","bank":"jichu"},{"chapter":"刷章节母题 第二十二章 对外金融关系与政策 共8题","point":"国际货币体系","type":"multi","stem":"国际货币体系的主要内容包括（ ）。","material":"","options":[{"key":"A","text":"确定国际储备资产"},{"key":"B","text":"确定汇率制度"},{"key":"C","text":"确定国际金融机构职责"},{"key":"D","text":"确定经济政策协调方式"},{"key":"E","text":"确定国际收支调节方式"}],"answer":["A","B","E"],"explanation":"本题考查国际货币体系的主要内容。国际货币体系的内容主要有三个方面：（1）确定国际储备资产。（2）确定汇率制度。（3）确定国际收支调节方式。故本题选ABE选项。","id":"jichu-0153","bank":"jichu"},{"chapter":"刷章节母题 第二十二章 对外金融关系与政策 共8题","point":"国际货币体系","type":"multi","stem":"下列关于国际主要的金融组织的宗旨说法正确的有（ ）。","material":"","options":[{"key":"A","text":"国际货币基金组织宗旨包括促进国际货币领域的合作、促进国际贸易的扩大和平衡发展、促进汇率的稳定、保持成员国之间的秩序和汇率安排"},{"key":"B","text":"世界银行的宗旨是对生产性投资提供便利，协助成员国的经济复兴以及生产和资源的开发"},{"key":"C","text":"国际清算银行的宗旨是促进各国中央银行之间的合作，为国际金融活动提供额外的便利，并在国际清算中充当受托人或代理人"},{"key":"D","text":"世界银行的宗旨是促进私人对外贷款和投资，鼓励国际投资，开发成员国的生产资源，促进国际贸易长期均衡发展，维持国际收支平衡（ ）。"},{"key":"E","text":"国际主要金融组织的宗旨对每个国家发展影响是相同的"}],"answer":["A","B","C","D"],"explanation":"本题考查国际主要金融组织。国际货币基金组织是国际货币体系的核心机构。其宗旨主要是：促进国际货币领域的合作；促进国际贸易的扩大和平衡发展；促进汇率的稳定，保持成员国之间有秩序的汇率安排等，选项A正确。世界银行是世界上最大的多边开发机构，其法定宗旨是：对生产性投资提供便利，协助成员方的经济复兴以及生产和资源的开发；促进私人对外贷款和投资；鼓励国际投资，开发成员方的生产资源，促进国际贸易长期均衡发展，维持国际收支平衡，选项B、D正确。国际清算银行的宗旨是促进各国中央银行之间的合作，为国际金融活动提供额外的便利，并在国际清算中充当受托人或代理人，选项C正确。国际主要金融组织的宗旨对不同国家发展影响是不同的，选项E错误。故本题选ABCD选项。","id":"jichu-0154","bank":"jichu"},{"chapter":"刷章节母题 第二十二章 对外金融关系与政策 共8题","point":"人民币跨境使用","type":"single","stem":"跨境人民币是指（ ）之间的以人民币开展的或用人民币结算的各类跨境业务。","material":"","options":[{"key":"A","text":"居民"},{"key":"B","text":"居民和非居民"},{"key":"C","text":"非居民"},{"key":"D","text":"华侨"}],"answer":["B"],"explanation":"本题考查跨境人民币业务的概念。，，。，跨境人民币业务是指居民（境内机构、境内个人）和非居民（境外机构、境外个人）之间以人民币开展的或用人民币结算的各类跨境业务。故本题选B选项。","id":"jichu-0155","bank":"jichu"},{"chapter":"刷章节母题 第二十二章 对外金融关系与政策 共8题","point":"人民币跨境使用","type":"multi","stem":"关于跨境人民币结算的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"经国家允许指定的、有条件的企业在自愿的基础上以人民币进行跨境贸易的结"},{"key":"B","text":"目前，境内企业货物贸易、服务贸易及其他资本项目均可以选择以人民币进行结算"},{"key":"C","text":"按照“事后管理”的原则，各商业银行主要依据企业提供的境外直接投资主管部门的核准证书或文件等材料办理境外直接投资人民币结算业务"},{"key":"D","text":"政策性银行和境内商业银行可以在香港特别行政区发行人民币债券，香港市场将这些人民币债券称为“点心债”"},{"key":"E","text":"境内机构在境外发行的人民币债券称为“熊猫债”"}],"answer":["A","C","D"],"explanation":"本题考查跨境人民币业务的概念和类型。跨境贸易人民币结算是指经国家允许指定的、有条件的企业在自愿的基础上以人民币进行跨境贸易的结算，各商业银行在中国人民银行规定的政策范围内，可直接为企业提供跨境贸易人民币相关结算服务，选项A正确。境内企业货物贸易、服务贸易及其他经常项目均可以选择以人民币进行结算，选项B错误。按照“事后管理”的原则，各商业银行主要依据企业提供的境外直接投资主管部门的核准证书或文件等材料办理境外直接投资人民币结算业务。企业可以凭境外直接投资主管部门的核准证书或文件直接到商业银行办理境外直接投资人民币资金汇出、人民币前期费用汇出和境外投资企业增资、减资、转股、清算等人民币资金汇出入手续，选项C正确。政策性银行和境内商业银行可在香港特别行政区发行人民币债券。香港市场将这些人民币债券称为“点心债”。目前，海外金融机构、跨国企业和跨国组织均可参与到香港特别行政区人民币债券发行主体中，境内在香港特别行政区上市企业也可以在香港市场融资发债，选项D正确。在境内发行人民币债券（也称为“熊猫债”）的境外机构主要为国际开发机构，选项E错误。故本题选ACD选项。包","id":"jichu-0156","bank":"jichu"},{"chapter":"刷章节母题 第二十三章 统计与数据科学 共10题","point":"统计学","type":"single","stem":"下列统计处理中，属于描述统计的是（ ）。","material":"","options":[{"key":"A","text":"用图形展示居民消费价格指数（CPI）的基本走势"},{"key":"B","text":"根据样本客户信息估计公司客户满意度"},{"key":"C","text":"用1%人口抽样调查数据推估年末总人口"},{"key":"D","text":"对回归模型进行假设检验"}],"answer":["A"],"explanation":"本题考查统计学。描述统计是研究数据收集、整理和描述的统计方法。其内容包括：（1）如何取得所需要的数据；（2）如何用图表或数学方法对数据进行整理和展示；（3）如何描述数据的一般特征。选项B、C、D均属于推断统计。故本题选A选项。","id":"jichu-0157","bank":"jichu"},{"chapter":"刷章节母题 第二十三章 统计与数据科学 共10题","point":"统计学","type":"multi","stem":"下列统计分析中，需要采用推断统计方法的有（ ）。","material":"","options":[{"key":"A","text":"用样本信息估计总体特征"},{"key":"B","text":"用图表对数据进行展示"},{"key":"C","text":"描述一组数据的集中趋势"},{"key":"D","text":"用样本信息检验对总体的假设是否成立"},{"key":"E","text":"描述一组数据的离散趋势"}],"answer":["A","D"],"explanation":"本题考查统计学。推断统计是研究如何利用样本数据推断总体特征的统计方法，其内容包括：（1）参数估计：利用样本信息推断总体特征；（2）假设检验：利用样本信息判断对总体假设是否成立。选项B、C、E属于描述统计。故本题选AD选项。","id":"jichu-0158","bank":"jichu"},{"chapter":"刷章节母题 第二十三章 统计与数据科学 共10题","point":"变量和数据","type":"single","stem":"下列统计变量中，属于定量变量的是（ ）。","material":"","options":[{"key":"A","text":"性别"},{"key":"B","text":"年龄"},{"key":"C","text":"产品等级"},{"key":"D","text":"汽车品牌"}],"answer":["B"],"explanation":"本题考查变量和数据。..。当变量的取值是数量时，该变量被称为定量变量或数量变量。选项A、C、D均属于定性变量。 故本题选B选项。","id":"jichu-0159","bank":"jichu"},{"chapter":"刷章节母题 第二十三章 统计与数据科学 共10题","point":"变量和数据","type":"single","stem":"下列属于顺序变量的是（ ）。","material":"","options":[{"key":"A","text":"性别"},{"key":"B","text":"产品等级"},{"key":"C","text":"产品产量"},{"key":"D","text":"年龄"}],"answer":["B"],"explanation":"本题考查变量和数据。定量数据（数值型数据）是对定量变量的观测结果，其取值表现为具体的数值。如企业的销售额是1000万元。分类数据指分类变量的观测结果，表现为类别，一般用文字来表述，也可用数字描述。如，用1表示“男性”，２表示“女性”。顺序数据指顺序变量的观测结果，表现为类别，一般用文字描述，也可用数字描述。如用1表示“硕士及以上”2表示“本科”，3表示“大专及以下”。选项A属于分类变量，选项C、D属于定量变量（数量变量）。故本题选B选项。","id":"jichu-0160","bank":"jichu"},{"chapter":"刷章节母题 第二十三章 统计与数据科学 共10题","point":"数据的来源","type":"multi","stem":"下列统计数据中，属于观测数据的有（ ）。","material":"","options":[{"key":"A","text":"CPI数据"},{"key":"B","text":"三次产业增加值"},{"key":"C","text":"新药疗效数据"},{"key":"D","text":"灯泡使用寿命数据"},{"key":"E","text":"电池使用寿命数据"}],"answer":["A","B"],"explanation":"本题考查观测数据和实验数据。统计数据，按其收集方法，可以分为观测数据和实验数据。（1）通过直接调查或测量而收集到的数据，称为观测数据。观测数据是在没有对事物施加任何人为控制因素的条件下得到的，几乎所有与社会经济现象有关的统计数据都是观测数据，如GDP、CPI、房价等（选项A、B正确）。（2）通过在实验中控制实验对象以及其所处的实验环境收集到的数据，称为实验数据。自然科学领域的数据大多是实验数据。如，一种新产品使用寿命的数据；一种新药疗效的数据（选项C、D、E错误)。故本题选AB选项。","id":"jichu-0161","bank":"jichu"},{"chapter":"刷章节母题 第二十三章 统计与数据科学 共10题","point":"数据的来源","type":"single","stem":"在社会经济领域，（ ）是获得数据的主要方法，也是获得一手数据的重要方式。","material":"","options":[{"key":"A","text":"统计调查"},{"key":"B","text":"科学实验"},{"key":"C","text":"观察"},{"key":"D","text":"测量"}],"answer":["A"],"explanation":"本题考查一手数据与二手数据。 在社会经济领域，统计调查是获得数据的主要方法，也是获得一手数据的重要方 式。 选项B、C、D为一手数据的来源。 故本题选A选项。","id":"jichu-0162","bank":"jichu"},{"chapter":"刷章节母题 第二十三章 统计与数据科学 共10题","point":"统计调查","type":"multi","stem":"下列调查方式中，属于非全面调查的有（ ）。","material":"","options":[{"key":"A","text":"重点调查"},{"key":"B","text":"抽样调查"},{"key":"C","text":"典型调查"},{"key":"D","text":"普查"},{"key":"E","text":"全面报表"}],"answer":["A","B","C"],"explanation":"本题考查统计调查的概念与分类。统计调查按调查对象的范围不同，分为全面调查和非全面调查。全面调查包括全面统计报表和普查。非全面调查包括非全面统计报表、抽样调查、重点调查和典型调查。故本题选ABC选项。","id":"jichu-0163","bank":"jichu"},{"chapter":"刷章节母题 第二十三章 统计与数据科学 共10题","point":"统计调查","type":"multi","stem":"下列统计调查方式中，仅对调查对象中的一部分单位进行调查的有","material":"","options":[{"key":"A","text":"典型调查"},{"key":"B","text":"全面统计报表"},{"key":"C","text":"普查"},{"key":"D","text":"抽样调查"},{"key":"E","text":"重点调查"}],"answer":["A","D","E"],"explanation":"本题考查统计调查的方式。典型调查是一种非全面调查，它是根据调查的目的与要求在对被调查对象进行全面分析的基础上，有意识地选择若干具有典型意义的或有代表性的单位进行的调查（选项A正确），全面统计报表要求调查对象中的每一个单位都填报（选项B错误)。普查是为某一特定目的而专门组织的一次性全面调查（选项C错误)。选项D正确，抽样调查是从调查对象的总体中抽取一部分单位作为样本进行调查，并根据样本调查结果来推断总体数量特征的一种非全面调查。重点调查是一种非全面调查，它是在所要调查的总体中选择一部分重点单位进行的调查，选项E正确。故本题选ADE选项。","id":"jichu-0164","bank":"jichu"},{"chapter":"刷章节母题 第二十三章 统计与数据科学 共10题","point":"数据科学与大数据","type":"multi","stem":"关于数据科学与大数据的内容，下列说法中错误的有（ ）。","material":"","options":[{"key":"A","text":"数据科学的研究对象是数据"},{"key":"B","text":"大数据具有数据量大、数据多样性、价值密度高、数据的产生和处理速度快等特性"},{"key":"C","text":"数据挖掘的数据源必须是真实的、大量的、无噪声的"},{"key":"D","text":"数据科学是一门通过系统性研究获取与数据相关的知识体系的学科"},{"key":"E","text":"常见的数据挖掘方法可分为监督学习、无监督学习和半监督学习"}],"answer":["B","C"],"explanation":"本题考查数据科学与大数据。数据科学（data science）是一门通过系统性研究获取与数据相关的知识体系的学科，选项D正确。大数据具有“4V”特性：数据量大、数据多样性、价值密度低、数据的产生和处理速度快，选项B错误。数据挖掘的数据源必须是真实的、大量的、有噪声的，选项C错误。常见的数据挖掘方法可分为监督学习、无监督学习和半监督学习，选项E正确。数据科学的研究对象是数据，研究目标是获得洞察力和理解力，通过对数据的分析，来解释、预测、洞见和决策，为现实世界服务，选项A正确。故本题选BC选项。（ ）。","id":"jichu-0165","bank":"jichu"},{"chapter":"刷章节母题 第二十三章 统计与数据科学 共10题","point":"数据科学与大数据","type":"multi","stem":"关于数据挖掘的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"数据源必须是真实的、大量的、无噪声的"},{"key":"B","text":"发现的是用户感兴趣的知识"},{"key":"C","text":"发现的知识是可接受、可理解、可运用的"},{"key":"D","text":"并不要求发现放之四海而皆准的知识，仅支持特定的发现问题"},{"key":"E","text":"核心任务是对数据关系和特征进行探索（ ）。"}],"answer":["B","C","D","E"],"explanation":"本题考查数据挖掘。数据挖掘的定义包含以下几层含义：人（1）数据源必须是真实的、大量的、有噪声的，选项A错误。（2）发现的是用户感兴趣的知识，选项B正确。（3）发现的知识是可接受、可理解、可运用的，选项C正确。（4）并不要求发现放之四海而皆准的知识，仅支持特定的发现问题，选项D正确。数据挖掘以解决实际问题为出发点，核心任务是对数据关系和特征进行探索，选项E正确。故本题选BCDE选项。","id":"jichu-0166","bank":"jichu"},{"chapter":"刷章节母题 第二十四章 描述统计 共8题","point":"集中趋势的测度","type":"single","stem":"下列统计量中，适用于描述分类数据和顺序数据集中趋势的是（ ）。","material":"","options":[{"key":"A","text":"众数"},{"key":"B","text":"均值"},{"key":"C","text":"标准分数"},{"key":"D","text":"中位数"}],"answer":["A"],"explanation":"本题考查集中趋势的测度。集中趋势的测度包含均值、中位数和众数，其中适用于描述分类数据和顺序数据的是众数；均值适用于定量变量，而中位数不适用于分类变量。故本题选A选项。","id":"jichu-0167","bank":"jichu"},{"chapter":"刷章节母题 第二十四章 描述统计 共8题","point":"集中趋势的测度","type":"multi","stem":"下列有关均值(即平均数)、中位数和众数的说法中，正确的有（ ）。","material":"","options":[{"key":"A","text":"均值是集中趋势最主要的测度值，主要适用于数值型数据，不适用于分类数据和顺序数据"},{"key":"B","text":"中位数是一个位置代表值，主要适用于顺序数据和数值型数据，但不适用于分类数据（ ）。"},{"key":"C","text":"众数适用于描述分类数据和顺序数据，不适用于描述定量数据的集中位置"},{"key":"D","text":"在定量数据中，一组数据的众数是唯一的"},{"key":"E","text":"众数是指一组数据中出现次数（频数）最多的变量值，众数比较稳定"}],"answer":["A","B","C"],"explanation":"本题考查均值、中位数和众数的比较及适用范围。均值也叫作平均数，是数据组中所有数值的总和除以该组数值的个数。均值是集中趋势最主要的测度值，主要适用于数值型数据，不适用于分类数据和顺序数据，选项A正确。中位数是把一组数据按从小到大或从大到小的顺序进行排列，位置居中的数值叫作中位数。中位数是一个位置代表值，主要适用于顺序数据和数值型数据，但不适用于分类数据，选项B正确。众数是指一组数据中出现次数（频数）最多的变量值。众数的缺点是没有充分利用数据的全部信息，缺乏稳定性，而且可能不唯一，选项E错误。众数适用于描述分类数据和顺序数据的集中趋势，不适用于描述定量数据的集中位置。在定量数据中，可能出现多众数或无众数的情况，选项C正确、选项D错误。","id":"jichu-0168","bank":"jichu"},{"chapter":"刷章节母题 第二十四章 描述统计 共8题","point":"离散程度的测度","type":"single","stem":"集中趋势的测度值对一组数据的代表程度，取决于该组数据的离散水平。数据的离散程度越大，集中趋势的测度值对该组数据的代表性（ ）。","material":"","options":[{"key":"A","text":"越好"},{"key":"B","text":"越差"},{"key":"C","text":"始终不变"},{"key":"D","text":"在一定区间内反复变化"}],"answer":["B"],"explanation":"本题考查离散程度的测度。集中趋势的测度值是对数据水平的一个概括性的度量，它对一组数据的代表程度，取决于该组数据的离散水平。数据的离散程度越大，集中趋势的测度值对该组数据的代表性就越差，离散程度越小，其代表性就越好。故本题选B选项。","id":"jichu-0169","bank":"jichu"},{"chapter":"刷章节母题 第二十四章 描述统计 共8题","point":"离散程度的测度","type":"single","stem":"一组数据的方差为36，均值为600，则这组数据的离散系数为（ ）。","material":"","options":[{"key":"A","text":"0. 5"},{"key":"B","text":"0. 01"},{"key":"C","text":"0.2"},{"key":"D","text":"0.05"}],"answer":["B"],"explanation":"本题考查离散系数。标准差等于方差的平方根，所以标准差=6。离散系数=标准差/均值=6/600=0.01。故本题选B选项。","id":"jichu-0170","bank":"jichu"},{"chapter":"刷章节母题 第二十四章 描述统计 共8题","point":"分布形态的测度（ ）。","type":"single","stem":"如果一组数据的偏态系数为0.3，则该组数据的分布为（ ）。","material":"","options":[{"key":"A","text":"轻度左偏"},{"key":"B","text":"严重右偏"},{"key":"C","text":"轻度右偏"},{"key":"D","text":"中度右偏"}],"answer":["C"],"explanation":"本题考查偏态系数。偏态系数取决于离差三次方的平均数与标准差三次方的比值。如果偏态系数等于0，说明数据的分布是对称的；如果偏态系数为正值，说明分布为右偏的：取值在０和0.5之间说明轻度右偏，取值在0.5和1之间说明中度右偏，取值大于1说明严重右偏。故本题选C选项。","id":"jichu-0171","bank":"jichu"},{"chapter":"刷章节母题 第二十四章 描述统计 共8题","point":"分布形态的测度（ ）。","type":"single","stem":"根据经验法则，当数据从对称的钟形分布时，与平均数的距离在2个标准差之内的数据项所占比例约为（ )。","material":"","options":[{"key":"A","text":"99%"},{"key":"B","text":"68%"},{"key":"C","text":"95%"},{"key":"D","text":"100%"}],"answer":["C"],"explanation":"本题考查分布形态的测度。当数据服从对称的钟形分布时，经验法则表明：（1）约有68%的数据与平均数的距离在1个标准差之内；（2）约有95%的数据与平均数的距离在2个标准差之内； （3）约有99%的数据与平均数的距离在3个标准差之内。 故本题选C选项。","id":"jichu-0172","bank":"jichu"},{"chapter":"刷章节母题 第二十四章 描述统计 共8题","point":"变量间的相关分析","type":"single","stem":"下列关于变量之间的相关关系表述错误的是（ ）。","material":"","options":[{"key":"A","text":"当一个变量的取值完全由另一个变量的取值变化所确定时，称这两个变量间的关系为完全相关"},{"key":"B","text":"按相关的方向可将相关关系分为正相关和负相关"},{"key":"C","text":"按相关的形式可将相关关系分为线性相关和非线性相关"},{"key":"D","text":"相关关系等同于因果关系"}],"answer":["D"],"explanation":"本题考查变量间的相关关系。当一个变量的取值完全由另一个变量的取值变化所确定时，称这两个变量间的关系为完全相关，选项A正确。按相关的方向可将相关关系分为正相关和负相关，选项B正确。按相关的形式可将相关关系分为线性相关和非线性相关，选项C正确。相关关系并不等同于因果关系，例如夏天雪糕的销售量与遮阳伞之间呈正相关，但它们并不存在因果关系，选项D错误。故本题选D选项。","id":"jichu-0173","bank":"jichu"},{"chapter":"刷章节母题 第二十四章 描述统计 共8题","point":"变量间的相关分析","type":"single","stem":"两个变量的Pearson相关系数为0.03，则这两个变量间可视为（ ）。","material":"","options":[{"key":"A","text":"低度线性相关"},{"key":"B","text":"无线性相关关系"},{"key":"C","text":"高度线性相关"},{"key":"D","text":"中度线性相关"}],"answer":["B"],"explanation":"本题考查相关系数。，在说明两个变量之间的线性关系的强弱时，根据经验可将相关程度分为以下几种情况：（1）当lrl≥0.8时，可视为高度相关； 人（2）当0.5≤|rl<0.8时，可视为中度相关；（3）当0.3≤|rl<0.5时，可视为低度相关；（4）当|rl<0.3时，说明两个变量之间的相关程度极弱，可视为无线性相关关系。o原包题中信息为0.03，绝对值小于0.3，可视为无线性相关关系。故本题选B选项。","id":"jichu-0174","bank":"jichu"},{"chapter":"刷章节母题 第二十五章 抽样调查 共6题","point":"抽样调查基本概念","type":"multi","stem":"以下属于概率抽样特点的有（ ）。","material":"","options":[{"key":"A","text":"按一定的概率以随机原则抽取样本"},{"key":"B","text":"抽取样本并不是依据随机原则"},{"key":"C","text":"总体中每个单元被抽中的概率是未知的"},{"key":"D","text":"总体中每个单元被抽中的概率是可以计算出来的"},{"key":"E","text":"当采用样本对总体参数进行估计时，要考虑到每个样本单元被抽中的概率"}],"answer":["A","D","E"],"explanation":"本题考查概率抽样的特点。概率抽样具有以下特点：①按一定的概率以随机原则抽取样本（选项A正确、选项B错误)。所谓随机原则，就是在抽取样本时排除主观上有意识地抽取调查单元的情况，使每个单元都有一定的机会被抽中。②总体中每个单元被抽中的概率是已知的，或者是可以计算出来的（选项C错误、选项D正确）。③当采用样本对总体参数进行估计时，要考虑到每个样本单元被抽中的概率（选项E正确）。故本题选ADE选项。","id":"jichu-0175","bank":"jichu"},{"chapter":"刷章节母题 第二十五章 抽样调查 共6题","point":"抽样调查基本概念","type":"multi","stem":"非抽样误差产生的原因，主要有（ ）。","material":"","options":[{"key":"A","text":"抽样框误差"},{"key":"B","text":"组织性误差"},{"key":"C","text":"无回答误差"},{"key":"D","text":"测量误差"},{"key":"E","text":"计量误差"}],"answer":["A","C","E"],"explanation":"本题考查抽样调查中的误差。），非抽样误差是指除抽样误差以外，由其他原因引起的样本统计量与总体真值之间的差异。非抽样误差产生的原因主要有：抽样框误差、无回答误差、计量误差。故本题选ACE选项。","id":"jichu-0176","bank":"jichu"},{"chapter":"刷章节母题 第二十五章 抽样调查 共6题","point":"几种基本概率抽样方法","type":"multi","stem":"关于分层抽样设计的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"不同层间单元的差异尽可能大"},{"key":"B","text":"各层的样本单元比例必须与该层的总体单元比例一致"},{"key":"C","text":"不等比例分层抽样的抽样误差大于等比例分层抽样"},{"key":"D","text":"抽样框中必须有总体单元的分层信息"},{"key":"E","text":"同一层内单元间的差异尽可能小"}],"answer":["A","D","E"],"explanation":"本题考查分层抽样。分层抽样中，样本量在各层中分配的方法可以归为两类：等比例分配和不等比例分配，选项B错误。 在条件具备时，如果各层的总体方差已知，不等比例抽样的抽样误差可能比等比 例抽样更小，选项C错误。 分层抽样的应用条件是：抽样框中有足够的辅助信息，能够将总体单位按某种标 准划分到各层之中，实现在同一层内各单位之间的差异尽可能地小，不同层之间 各单位的差异尽可能地大，选项A、D、E正确。 故本题选ADE选项。","id":"jichu-0177","bank":"jichu"},{"chapter":"刷章节母题 第二十五章 抽样调查 共6题","point":"几种基本概率抽样方法","type":"multi","stem":"关于整群抽样的说法正确的有（ ）。","material":"","options":[{"key":"A","text":"抽样误差比较大"},{"key":"B","text":"调查效率比较低"},{"key":"C","text":"抽样框的编制得以简化"},{"key":"D","text":"实施调查方便，可以节省费用和时间"},{"key":"E","text":"抽样的样本单位比较分散"}],"answer":["A","C","D"],"explanation":"本题考查整群抽样的优缺点。整群抽样的优点有：①实施调查方便，可以节省费用和时间（选项D正确)。群中各单位的分布非常集中（选项E错误)，抽中一个群以后，在一个点上可以调查多个单位，调查效率较高（选项B错误）。②抽样框编制得以简化（选项C正确），抽样时只需要群的抽样框，而不要求全部基本单位的抽样框。整群抽样的主要缺点是：由于抽取的样本单位比较集中，群内各单位之间存在相似性，差异比较小，而群与群之间的差别往往比较大，使得整群抽样的抽样误差比较大（选项A正确）。为了达到一定的误差要求，就有必要增大样本量，如多抽取一些群进行调查。但是，如果群的构造是相反的情况，即群内各单位之间存在较大的差异，而群与群的结构相似，整群抽样反而会降低估计误差。故本题选ACD选项。","id":"jichu-0178","bank":"jichu"},{"chapter":"刷章节母题 第二十五章 抽样调查 共6题","point":"估计量和样本量","type":"single","stem":"对于不放回简单随机抽样，所有可能的样本均值取值的平均值总是等于总体均值，这就是样本估计量的（ ）。","material":"","options":[{"key":"A","text":"无偏性"},{"key":"B","text":"有效性原包"},{"key":"C","text":"一致性"},{"key":"D","text":"渐进性"}],"answer":["A"],"explanation":"本题考查估计量的性质。对于不放回简单随机抽样，所有可能的样本均值取值的平均值总是等于总体均值，这就是样本均值估计量的无偏性。故本题选A选项。","id":"jichu-0179","bank":"jichu"},{"chapter":"刷章节母题 第二十五章 抽样调查 共6题","point":"估计量和样本量","type":"multi","stem":"下列关于抽样误差的表述正确的有（ ）。","material":"","options":[{"key":"A","text":"抽样误差无法避免，但可计算"},{"key":"B","text":"抽样误差与总体分布有关，总体方差越大，抽样误差越大"},{"key":"C","text":"其他条件相同，样本量越大，抽样误差越小"},{"key":"D","text":"抽样误差与抽样方式和估计量的选择也有关"},{"key":"E","text":"分层抽样的估计量方差一般大于简单随机抽样"}],"answer":["A","B","C","D"],"explanation":"本题考查抽样误差的估计。，抽样误差虽然无法避免，但它是可计算的（选项A正确）。抽样误差的影响因素主要有：①抽样误差与总体分布有关，总体单位值之间差异越大，即总体方差Sä 越大，抽样误差就越大（选项B正确)；②抽样误差与样本量n有关，在其他条件相同情况下，样本量越大，抽样误差就越小（选项C正确）。此外，抽样误差与抽样方式和估计量的选择也有关系（选项D正确)。分层抽样的估计量方差一般小于简单随机抽样，即分层抽样的误差小于简单随机抽样（选项E错误)。故本题选ABCD选项。","id":"jichu-0180","bank":"jichu"},{"chapter":"刷章节母题 第二十六章 回归分析 共6题","point":"回归模型","type":"multi","stem":"回归分析和相关分析之间的关系是（ ）。","material":"","options":[{"key":"A","text":"具有共同的研究方法"},{"key":"B","text":"具有共同的研究对象"},{"key":"C","text":"具体应用时，常常必须互相补充"},{"key":"D","text":"相关分析需要依靠回归分析来表明现象数量相关的具体形式"},{"key":"E","text":"回归分析则需要依靠相关分析来表明现象数量变化的相关程度"}],"answer":["B","C","D","E"],"explanation":"本题考查回归分析与相关分析的关系。回归分析和相关分析有着密切的联系，它们不仅具有共同的研究对象，而且在具体应用时，常常必须互相补充（选项A错误，选项B、C正确）。相关分析需要依靠回归分析来表明现象数量相关的具体形式，而回归分析则需要依靠相关分析来表明现象数量变化的相关程度（选项D、E正确）。只有当变量之间存在着高度相关时，进行回归分析寻求其相关的具体形式才有意义。故本题选BCDE选项。","id":"jichu-0181","bank":"jichu"},{"chapter":"刷章节母题 第二十六章 回归分析 共6题","point":"回归模型","type":"single","stem":"关于一元线性回归模型，下列表述错误的是（ ）。","material":"","options":[{"key":"A","text":"只涉及一个自变量的线性回归模型称为一元线性回归模型"},{"key":"B","text":"因变量Y是自变量X的线性函数加上误差项"},{"key":"C","text":"βo+β X反映了由于自变量X的变化而引起的因变量Y的线性变化"},{"key":"D","text":"误差项是个随机变量，表示除线性关系之外的随机因素对Y的影响，能由X和的线性关系所解释的Y的变异性"}],"answer":["D"],"explanation":"本题考查一元线性回归模型。，一元线性回归模型是研究两个变量之间相关关系的最简单的回归模型，只涉及一个自变量，表示为Y=βo+βiX+ε，因变量Y是自变量的线性函数（βo+βiX）加上误差项 ε；βo+β X反映了由于自变量X的变化而引起的因变量Y的线性变化。误差项ε是个随机变量，表示除线性关系之外的随机因素对Ｙ的影响，它是不能由X和Ｙ的线性关系所解释的的变异性（选项D错误）。故本题选D选项。","id":"jichu-0182","bank":"jichu"},{"chapter":"刷章节母题 第二十六章 回归分析 共6题","point":"最小二乘法","type":"single","stem":"对于一元线性回归方程E(Y)=β+βiX，确定 βo、βi的方法是（ ）。","material":"","options":[{"key":"A","text":"二次平均"},{"key":"B","text":"加权平均"},{"key":"C","text":"斯特基方法"},{"key":"D","text":"最小二乘法"}],"answer":["D"],"explanation":"本题考查最小二乘法。 在现实中，模型的参数 β。、β都是未知的，需要利用样本数据去估计，采用的 估计方法是最小二乘法。 故本题选D选项。","id":"jichu-0183","bank":"jichu"},{"chapter":"刷章节母题 第二十六章 回归分析 共6题","point":"最小二乘法","type":"single","stem":"根据利用最小二乘法估计回归方程参数的原理是（ ）。","material":"","options":[{"key":"A","text":"残差平方和最小"},{"key":"B","text":"残差的二倍最小"},{"key":"C","text":"相关系数最小"},{"key":"D","text":"总离差最小"}],"answer":["A"],"explanation":"本题考查最小二乘法。最小二乘法就是使得因变量的观测值与估计值之间的离差平方和最小来估计参数β。和β的方法。故本题选A选项。","id":"jichu-0184","bank":"jichu"},{"chapter":"刷章节母题 第二十六章 回归分析 共6题","point":"模型的检验和预测","type":"single","stem":"一般情况下，使用估计的回归方程之前，需要对模型进行检验，不包括（ ）。","material":"","options":[{"key":"A","text":"分析回归系数的经济含义是否合理"},{"key":"B","text":"分析变量之间相关的方向和程度。"},{"key":"C","text":"分析估计的模型对数据的拟合效果如何（ ）。"},{"key":"D","text":"对模型进行假设检验"}],"answer":["B"],"explanation":"本题考查回归模型的拟合效果分析。一般情况下，使用估计的回归方程之前，需要对模型进行检验：②分析估计的模型对数据的拟合效果如何。③对模型进行假设检验。故本题选B选项。（","id":"jichu-0185","bank":"jichu"},{"chapter":"刷章节母题 第二十六章 回归分析 共6题","point":"模型的检验和预测","type":"multi","stem":"在某城市随机抽取1000户居民作为样本对该城市居民消费水平进行研究，以居民月消费支出Ｙ（单位：元）和月收入（单位：元）建立回归模型，得到估计的回归模型：Y=130+0.6X，决定系数为0.96，关于该模型的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"居民月收入和月消费支出之间正相关"},{"key":"B","text":"回归模型的拟合效果很好"},{"key":"C","text":"居民月收入难以解释月消费支出的变化"},{"key":"D","text":"居民月收入每增长1元月消费支出将平均增长0.6元"},{"key":"E","text":"居民月收入为1000时，居民人均月消费支出大约为730元"}],"answer":["A","B","D","E"],"explanation":"本题考查模型的检验和预测。观察得到的模型，发现X的系数为0.6,大于零，表示X与Y的变动是同方向的，即人均可支配收入每增加1元，人均消费将平均增长0.6元，选项A、D正确。决定系数取值在O到1之间，决定系数越高，模型的拟合效果越好，即模型解释因变量的能力越强，题中决定系数为0.96，说明拟合效果很好，收入可以很好解 释月消费支出的变化，选项B正确、选项C错误。 当居民月收入为1000时，人均月消费支出大约为：Y=130+0.6×1000=730，选项 E正确。 故本题选ABDE选项。","id":"jichu-0186","bank":"jichu"},{"chapter":"刷章节母题 第二十七章 时间序列分析 共10题","point":"时间序列及其分类","type":"single","stem":"下列统计指标中，属于相对指标的是（ ）。","material":"","options":[{"key":"A","text":"社会消费品零售总额"},{"key":"B","text":"人口性别比"},{"key":"C","text":"房屋建筑面积"},{"key":"D","text":"城镇居民人均可支配收入"}],"answer":["B"],"explanation":"本题考查时间序列及其分类。选项A、C属于总量指标。（选项D属于平均指标。故本题选B选项。","id":"jichu-0187","bank":"jichu"},{"chapter":"刷章节母题 第二十七章 时间序列分析 共10题","point":"时间序列及其分类","type":"single","stem":"下列指标中累积后没有意义的是（ ）。","material":"","options":[{"key":"A","text":"商品零售额"},{"key":"B","text":"能源生产总量"},{"key":"C","text":"财政收入。"},{"key":"D","text":"股票价格（ ）。"}],"answer":["D"],"explanation":"本题考查时间序列及其分类。时点指标是反映社会经济现象在某一时刻或某一时点上的状况的总量指标。不具有可加性，指标数值大小与登记时间的间隔长短无关，指标数值是间断计数的。时期指标反映的是总体现象在一定时期内的累计总量水平的指标。是表现社会经济现象总体在一段时期内发展过程的总结果。如一定时期的工业总产值、人口出生数、工资总额等。选项A、B、C为时期指标，选项D属于时点指标，时点指标通常不能累积，其累积后没有意义。故本题选D选项。（人","id":"jichu-0188","bank":"jichu"},{"chapter":"刷章节母题 第二十七章 时间序列分析 共10题","point":"时间序列的水平分析","type":"multi","stem":"关于平均发展水平计算方法，正确的是（ ）。","material":"","options":[{"key":"A","text":"相对数时间序列的平均发展水平可就序列中的相对数直接进行平均计算"},{"key":"B","text":"平均发展水平也称为序时平均数"},{"key":"C","text":"间断时点序列平均发展水平的计算采用“两次平均”的思路"},{"key":"D","text":"连续时点序列和间断时点序列平均发展水平计算方法相同"},{"key":"E","text":"时点序列和时期序列平均发展水平的计算方法不同"}],"answer":["B","C","E"],"explanation":"本题考查平均发展水平。，，。要计算相对数或平均数时间序列的序时平均数，不能就序列中的相对数或平均数 直接进行平均计算；而必须分别求出分子指标和分母指标时间序列的序时平均数， 然后再进行对比，选项A错误。 连续时点序列一般采用（简单/加权)算术平均；间断时点序列需用“两次平均” 等方法，选项D错误。 故本题选BCE选项。","id":"jichu-0189","bank":"jichu"},{"chapter":"刷章节母题 第二十七章 时间序列分析 共10题","point":"时间序列的水平分析","type":"single","stem":"报告期发展水平与基期发展水平之差称为（ ）。","material":"","options":[{"key":"A","text":"增长量"},{"key":"B","text":"平均增长量"},{"key":"C","text":"发展速度"},{"key":"D","text":"增长速度"}],"answer":["A"],"explanation":"本题考查增长量与平均增长量。报告期发展水平与基期发展水平之差称为增长量，选项正A确。平均增长量是时间序列中逐期增长量的序时平均数，选项B错误。发展速度是以相对数形式表示的两个不同时期发展水平的比值，选项C错误。增长速度是报告期增长量与基期水平的比值，选项D错误。故本题选A选项。","id":"jichu-0190","bank":"jichu"},{"chapter":"刷章节母题 第二十七章 时间序列分析 共10题","point":"时间序列的速度分析","type":"multi","stem":"下列时间序列指标中，适用于水平分析的有（ ）。","material":"","options":[{"key":"A","text":"发展水平"},{"key":"B","text":"平均发展水平"},{"key":"C","text":"平均增长量"},{"key":"D","text":"增长量"},{"key":"E","text":"平均增长速度"}],"answer":["A","B","C","D"],"explanation":"本题考查发展水平。时间序列的水平分析指标包括：发展水平、平均发展水平、增长量与平均增长量，选项A、B、C、D正确，选项E错误。人故本题选ABCD选项。","id":"jichu-0191","bank":"jichu"},{"chapter":"刷章节母题 第二十七章 时间序列分析 共10题","point":"时间序列的速度分析","type":"multi","stem":"在对时间序列进行速度分析时，下列说法正确的有（ ）。","material":"","options":[{"key":"A","text":"在应用速度分析实际问题时，须防止误用乃至滥用的现象"},{"key":"B","text":"当时间序列中的指标值出现O或负数时，不宜计算速度"},{"key":"C","text":"速度指标的数值与基数的大小关系不大"},{"key":"D","text":"在环比增长速度时间序列中，不需要结合“增长1%的绝对值”这一水平指标进行分析"},{"key":"E","text":"“增长1%的绝对值”反映同样的增长速度，在不同时间条件下所包含的绝对水"}],"answer":["A","B","E"],"explanation":"本题考查速度的分析与应用。 （1）在应用速度分析实际问题时，须防止误用乃至滥用的现象（选项A正确）， 应注意的事项： ①当时间序列中的指标值出现O或负数时，不宜计算速度，选项B正确； ②速度指标的数值与基数的大小有密切关系，选项C错误。 （2）在环比增长速度时间序列中，各期的基数不同，因此，运用这一指标反映 现象增长的快慢时，往往要结合“增长1%的绝对值”这一水平指标的分析才能 得出正确结论，它反映同样的增长速度，在不同时间条件下所包含的绝对水平， 选项D错误、选项E正确。 故本题选ABE选项。","id":"jichu-0192","bank":"jichu"},{"chapter":"刷章节母题 第二十七章 时间序列分析 共10题","point":"时间序列的分解和预测程序","type":"single","stem":"时间序列在一年内重复出现的周期性波动，称之为（ ）。","material":"","options":[{"key":"A","text":"长期趋势"},{"key":"B","text":"季节变动"},{"key":"C","text":"循环波动"},{"key":"D","text":"不规则波动"}],"answer":["B"],"explanation":"本题考查时间序列的分解和预测程序。季节变动（S）是时间序列在一年内重复出现的周期性波动。故本题选B选项。（ ）。","id":"jichu-0193","bank":"jichu"},{"chapter":"刷章节母题 第二十七章 时间序列分析 共10题","point":"时间序列的分解和预测程序","type":"multi","stem":"时间序列的成分有（ ）。","material":"","options":[{"key":"A","text":"短期趋势"},{"key":"B","text":"季节变动"},{"key":"C","text":"优先变动"},{"key":"D","text":"循环波动"},{"key":"E","text":"不规则波动"}],"answer":["B","D","E"],"explanation":"本题考查时间序列的分解和预测程序。时间序列的成分通常有长期趋势（T）、季节变动（S）、循环波动（C）和不规则波动（I）等四种。故本题选BDE选项。","id":"jichu-0194","bank":"jichu"},{"chapter":"刷章节母题 第二十七章 时间序列分析 共10题","point":"平滑预测法","type":"multi","stem":"下列统计方法中，适用消除时间序列不规则成分所引起的随机波动的有（ ）。","material":"","options":[{"key":"A","text":"移动平均法"},{"key":"B","text":"最小二乘法"},{"key":"C","text":"斯特基方法"},{"key":"D","text":"指数平滑法"},{"key":"E","text":"相关分析方法"}],"answer":["A","D"],"explanation":"本题考查平滑预测法。平滑法的目的是“消除”时间序列的不规则成分所引起的随机波动，具体包括指数平滑法和移动平均法，选项A、D正确。最小二乘法就是使得因变量的观测值与估计值之间的离差（残差）平方和最小来估计 β。和 βi的方法，选项B错误。斯特基方法计算的是分组组数。组距是每组观察值的最大差，即每组的上限值与下限值之间的差，选项错误。相关分析是研究两个或两个以上处于同等地位的随机变量间的相关关系的统计分析方法，选项E错误。故本题选AD选项。","id":"jichu-0195","bank":"jichu"},{"chapter":"刷章节母题 第二十七章 时间序列分析 共10题","point":"平滑预测法","type":"single","stem":"已知某国居民消费价格指数2016年、2017年、2018年、2019年、2020年分别为103.3、104.7、102.6、103.5、103.8,指数平滑预测值分别为101.6、102.7、104.6、103.1、104.3，应用指数平滑法，选取平滑系数α=0.8，可预测得到2021年的居民消费价格指数是（ ）。·）·）","material":"","options":[{"key":"A","text":"103.5"},{"key":"B","text":"102.6"},{"key":"C","text":"103.9"},{"key":"D","text":"104.8"}],"answer":["C"],"explanation":"本题考查指数平滑法。指数平滑法是利用过去时间序列值的加权平均数作为预测值，即使得第t+1期的预测值等于第t期的实际观察值与第期预测值的加权平均值。这种方法的特点是，观测值离预测时期越久远，其权重也变得越小，呈现出指数下降，因而称为指数平滑。其基本计算公式为：F=α Y,+(1-α)Ft。2021年的预测值为： F2021=0. 8Y2020+0. 2F2020=0.8×103.8+0. 2×104. 3=103. 9。故本题选C选项。","id":"jichu-0196","bank":"jichu"},{"chapter":"刷章节母题 第二十八章 会计概论 共14题","point":"会计基本概念","type":"single","stem":"会计的最基本职能是（ ）。","material":"","options":[{"key":"A","text":"预算"},{"key":"B","text":"核算"},{"key":"C","text":"分析"},{"key":"D","text":"控制"}],"answer":["B"],"explanation":"本题考查会计的基本职能。会计具有核算和监督两项基本职能。其中，核算职能是会计的最基本职能。故本题选B选项。","id":"jichu-0197","bank":"jichu"},{"chapter":"刷章节母题 第二十八章 会计概论 共14题","point":"会计基本概念","type":"multi","stem":"下列业务中，属于资金退出的有（ ）。","material":"","options":[{"key":"A","text":"购买材料"},{"key":"B","text":"银行借款"},{"key":"C","text":"分配利润"},{"key":"D","text":"缴纳税金。"},{"key":"E","text":"偿还债务（ ）。"}],"answer":["C","D","E"],"explanation":"本题考查资金的退出。企业收回的货币资金中，用于缴纳税金（选项D正确）、偿还债务（选项E正确）和向投资者分配股利或利润（选项C正确）的这部分资金就退出了企业的资金循环和周转，剩余的资金则留在企业，继续用于企业的再生产过程；选项A“购买材料”是供应过程，属于资金的循环与周转过程；（ ）。选项B“银行借款”是资金的筹集，属于资金的投入。故本题选CDE选项。","id":"jichu-0198","bank":"jichu"},{"chapter":"刷章节母题 第二十八章 会计概论 共14题","point":"会计目标","type":"multi","stem":"下列关于会计目标说法正确的有（ ）。","material":"","options":[{"key":"A","text":"会计目标是指会计工作预期达到的最终结果"},{"key":"B","text":"市场经济条件下会计的一般目标是向企业内部管理部门和企业外部与企业有利害关系的主体提供决策所需要的会计信息及与之相关的其他财务信息"},{"key":"C","text":"我国企业会计的目标可以帮助会计信息使用者做出经济决策"},{"key":"D","text":"我国企业会计的目标有助于评价企业的经营管理责任以及资源使用的有效性"},{"key":"E","text":"市场经济条件下会计的目标只对企业内部管理部门负责"}],"answer":["A","B","C","D"],"explanation":"本题考查会计目标。会计目标是指会计工作预期达到的最终结果，选项A正确。市场经济条件下会计的一般目标是向企业内部管理部门和企业外部与企业有利害关系的主体提供决策所需要的会计信息及与之相关的其他财务信息，不仅对企业内部管理部门负责，也对企业外部与企业有利害关系的主体负责，选项B正确，选项E错误。我国企业会计的目标可以帮助会计信息使用者做出经济决策，有助于评价企业的经营管理责任以及资源使用的有效性，选项C、D正确。故本题选ABCD选项。","id":"jichu-0199","bank":"jichu"},{"chapter":"刷章节母题 第二十八章 会计概论 共14题","point":"会计目标","type":"multi","stem":"企业会计信息的主要内容包括（ ）。","material":"","options":[{"key":"A","text":"有关现金流量的信息"},{"key":"B","text":"有关经营成果的信息（ ）。"},{"key":"C","text":"会计核算质量信息"},{"key":"D","text":"有关财务状况的信息"},{"key":"E","text":"预算执行情况的信息"}],"answer":["A","B","D"],"explanation":"本题考查企业会计信息的主要内容。总体上说，企业会计信息的主要内容大致有以下三大类：（1）有关企业财务状况的信息，要通过企业编制的资产负债表来反映；（2）有关企业经营成果的信息，主要通过利润表来反映；（3）有关企业现金流量的信息，主要通过现金流量表来反映。故本题选ABD选项。","id":"jichu-0200","bank":"jichu"},{"chapter":"刷章节母题 第二十八章 会计概论 共14题","point":"会计要素","type":"single","stem":"下列会计要素组合中，反映企业财务状况的是（ ）。","material":"","options":[{"key":"A","text":"资产、负债、费用"},{"key":"B","text":"收入、费用、利润"},{"key":"C","text":"资产、负债、所有者权益"},{"key":"D","text":"资产、负债、利润"}],"answer":["C"],"explanation":"本题考查反映财务状况的会计要素。企业会计要素包括：（1）反映财务状况的会计要素：资产、负债、所有者权益。（2）反映经营成果的会计要素：收入、费用、利润。故本题选C选项。","id":"jichu-0201","bank":"jichu"},{"chapter":"刷章节母题 第二十八章 会计概论 共14题","point":"会计要素","type":"multi","stem":"关于会计要素收入、费用和利润的说法，错误的有（ ）。","material":"","options":[{"key":"A","text":"总流入会计上称为费用"},{"key":"B","text":"期间费用包括管理费用、制造费用、财务费用和销售费用"},{"key":"C","text":"制造成本是指与生产产品直接有关的费用，应计入产品成本"},{"key":"D","text":"利润包括收入减去费用后的净额和直接计入所有者权益的利得和损失等"},{"key":"E","text":"收入是企业持续经营的基本条件，也是企业获得利润的前提条件"}],"answer":["A","B","D"],"explanation":"本题考查反映经营成果的会计要素。收入是指企业在日常活动中形成的、会导致所有者权益增加的、与所有者投入资本无关的经济利益的总流入。费用是指企业在日常活动中发生的、会导致所有者权益减少的、与向所有者分配利润无关的经济利益的总流出，选项A错误。营业费用是企业费用的主体部分，按照是否构成产品成本，工业企业的营业费用可分为制造成本和期间费用。①制造成本是指与生产产品直接有关的费用，应计入产品成本，从销售收入中得到补偿，选项C正确。②期间费用是指与生产产品无直接关系，属于某一时期耗用的费用。包括管理费用、研发费用、财务费用和销售费用。期间费用不参与成本计算，而是直接计入当期损益，选项B错误。利润是指企业在一定会计期间内的经营成果，是企业在生产经营过程中各种收入扣除各种费用后的盈余，是反映经营成果的最终要素。利润包括收入减去费用后的净额（日常活动的业绩）、直接计入当期利润的利得和损失等（非日常活动的业绩），选项D错误。收入是企业持续经营的基本条件，也是企业获得利润的前提条件，选项E正确。故本题选ABD选项。","id":"jichu-0202","bank":"jichu"},{"chapter":"刷章节母题 第二十八章 会计概论 共14题","point":"会计要素确认和计量基本原则","type":"multi","stem":"会计要素确认和计量基本原则包括（ ）。","material":"","options":[{"key":"A","text":"划分收益性支出和资本性支出原则（ ）。"},{"key":"B","text":"配比原则"},{"key":"C","text":"谨慎性原则"},{"key":"D","text":"历史成本原则人"},{"key":"E","text":"权责发生制原则"}],"answer":["A","B","D","E"],"explanation":"本题考查会计要素确认和计量基本原则。会计要素确认和计量基本原则主要有：权责发生制原则、配比原则、历史成本原则、划分收益性支出与资本性支出原则。选项C是会计信息质量要求之一。故本题选ABDE选项。","id":"jichu-0203","bank":"jichu"},{"chapter":"刷章节母题 第二十八章 会计概论 共14题","point":"会计要素确认和计量基本原则","type":"single","stem":"凡是当期已经实现的收入和已经发生或应当负担的费用，不论款项是否收付，都应当作为当期的收入和费用，这是（ ）的要求。","material":"","options":[{"key":"A","text":"可比性"},{"key":"B","text":"权责发生制"},{"key":"C","text":"收付实现制"},{"key":"D","text":"持续经营"}],"answer":["B"],"explanation":"本题考查权责发生制原则。选项B正确，企业的会计核算应当以权责发生制为基础，凡是当期已经实现的收入和已经发生或应当负担的费用，无论款项是否收付，均应作为当期的收入和费用处理。凡是不属于当期的收入和费用，即使款项已经在当期收付，都不应作为当期的收入和费用处理。选项A错误，可比性要求同一企业不同时期发生相同或者相似的交易或者事项，必须采用一致的会计政策。企业会计核算方法和程序前后各期应当保持一致，不得随意变更；不同企业发生的相同或者相似的交易或者事项，应当采用规定的会计政策和会计处理办法。选项C错误，收付实现制按照款项实际收到或付出的日期来确定收益和费用的归属期。选项D错误，持续经营是指会计核算应当以持续正常的生产经营活动为前提，在可以预见的将来，企业将会按照当前的规模和状态继续经营下去，而不考虑企业停业或破产清算，也不考虑企业大规模削减业务，所持有的资产将正常营运，所负有的负债将正常偿还。故本题选B选项。","id":"jichu-0204","bank":"jichu"},{"chapter":"刷章节母题 第二十八章 会计概论 共14题","point":"会计基本前提","type":"single","stem":"在会计核算的基本前提中，界定会计核算空间范围的是（ ）。","material":"","options":[{"key":"A","text":"持续经营"},{"key":"B","text":"会计期间"},{"key":"C","text":"会计主体"},{"key":"D","text":"货币计量"}],"answer":["C"],"explanation":"本题考查会计主体。，会计基本前提包括会计主体、持续经营、会计分期、货币计量。会计主体是指会计确认、计量和报告的空间范围，是会计所服务的特定单位。故本题选C选项。","id":"jichu-0205","bank":"jichu"},{"chapter":"刷章节母题 第二十八章 会计概论 共14题","point":"会计基本前提","type":"single","stem":"关于货币计量这一会计基本前提的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"我国企业会计准则规定，企业会计应当以货币计量"},{"key":"B","text":"以货币计量时假定币值是稳定的"},{"key":"C","text":"只能用人民币作为唯一的货币来计量企业发生的经济业务"},{"key":"D","text":"企业在进行会计核算时货币不一定是唯一的计量单位"}],"answer":["C"],"explanation":"本题考查货币计量。货币计量是指企业在进行会计确认、计量和报告时采用货币为主要计量单位进行记录，并假定货币的币值保持不变。我国《企业会计准则》规定，企业会计应当以货币计量。货币计量的假设不表示货币是唯一的计量单位，有时在会计核算中也辅以实物数量等计量单位。故本题选C选项。","id":"jichu-0206","bank":"jichu"},{"chapter":"刷章节母题 第二十八章 会计概论 共14题","point":"会计信息质量要求","type":"single","stem":"企业采用融资租赁方式租入的固定资产在会计核算上视为企业的资产，这体现了会计信息质量（ ）的要求。","material":"","options":[{"key":"A","text":"相关性"},{"key":"B","text":"重要性"},{"key":"C","text":"实质重于形式"},{"key":"D","text":"谨慎性"}],"answer":["C"],"explanation":"本题考查实质重于形式。《企业会计准则》对企业提供的会计信息的质量要求包括：可靠性、相关性、清晰性、可比性、实质重于形式、重要性、谨慎性和及时性。实质重于形式要求企业应当按照交易或事项的经济实质进行会计确认、计量和报告，而不应当仅仅按照交易或者事项的法律形式为依据。根据实质重于形式的要求，融资租赁固定资产从经济实质上，企业拥有资产的实际控制权，在会计核算上视为企业资产。故本题选C选项。","id":"jichu-0207","bank":"jichu"},{"chapter":"刷章节母题 第二十八章 会计概论 共14题","point":"会计信息质量要求","type":"single","stem":"企业应当对应收账款计提坏账准备，这体现的会计信息质量要求是（ ）。","material":"","options":[{"key":"A","text":"重要性（ ）。"},{"key":"B","text":"清晰性"},{"key":"C","text":"谨慎性"},{"key":"D","text":"可靠性"}],"answer":["C"],"explanation":"本题考查谨慎性。《企业会计准则》对企业提供的会计信息的质量要求包括：可靠性、相关性、清晰性、可比性、实质重于形式、重要性、谨慎性和及时性。其中，谨慎性又称为稳健性，要求企业对交易或者事项进行会计确认、计量和报告应当保持应有的谨慎，不应高估资产或者收益、低估负债或者费用。故本题选C选项。人","id":"jichu-0208","bank":"jichu"},{"chapter":"刷章节母题 第二十八章 会计概论 共14题","point":"会计法规","type":"single","stem":"下列有关会计法规内容说法，不正确的是（ ）。 痘句","material":"","options":[{"key":"A","text":"我国现行的会计法规以《会计法》为核心，以会计准则、财务规则和会计制度为主要内容"},{"key":"B","text":"企业会计准则由财政部制定，包括基本准则和具体准则"},{"key":"C","text":"政府会计制度对政府会计信息质量要求、政府预算会计要素、政府财务会计要素、政府决算报告和财务报告等作出了规定"},{"key":"D","text":"会计准则包括企业会计准则、事业单位会计准则和政府会计准则"}],"answer":["C"],"explanation":"本题考查会计法规。．，．。．。我国现行的会计法规以《会计法》为核心，以会计准则、财务规则和会计制度为主要内容（选项A不符合题意）。 我国的《企业会计准则》由财政部制定，包括基本准则和具体准则两大部分（选 项B不符合题意）。 《政府会计准则》是财政部为了规范政府的会计核算，保证会计信息质量制定的 原则性规定。它主要对政府会计信息质量要求、政府预算会计要素、政府财务会 计要素、政府决算报告和财务报告等作出了规定（选项C符合题意）。 会计准则包括《企业会计准则》《事业单位会计准则》和《政府会计准则》（选项 D不符合题意）。 故本题选C选项。","id":"jichu-0209","bank":"jichu"},{"chapter":"刷章节母题 第二十八章 会计概论 共14题","point":"会计法规","type":"multi","stem":"下列法律制度中，属于会计法规的有（ ）。","material":"","options":[{"key":"A","text":"预算法"},{"key":"B","text":"政府采购法"},{"key":"C","text":"企业会计制度"},{"key":"D","text":"会计法"},{"key":"E","text":"政府会计准则"}],"answer":["C","D","E"],"explanation":"本题考查会计法规。会计法规包括会计法、会计准则（包括企业会计准则、政府会计准则、事业单位会计准则）财务规则（行政单位财务规则、事业单位财务规则)；会计制度（企业会计制度和政府会计制度）（·）故本题选CDE选项。","id":"jichu-0210","bank":"jichu"},{"chapter":"刷章节母题 第二十九章 会计循环 共8题","point":"会计确认","type":"multi","stem":"会计确认主要解决的问题包括（ ）。","material":"","options":[{"key":"A","text":"确定某一经济业务是否需要进行确认"},{"key":"B","text":"确定一项经济业务的货币金额"},{"key":"C","text":"确定某一经济业务应在何时进行确认"},{"key":"D","text":"确定某一经济业务应确认为哪个会计要素"},{"key":"E","text":"为编制财务报告积累数据"}],"answer":["A","C","D"],"explanation":"本题考查会计确认的概念。会计确认主要解决三个问题：（1）确定某一经济业务是否需要进行确认；（2）确定该业务应在何时进行确认；（3）确定该业务应确认为哪个会计要素。故本题选ACD选项。","id":"jichu-0211","bank":"jichu"},{"chapter":"刷章节母题 第二十九章 会计循环 共8题","point":"会计确认","type":"single","stem":"关于会计确认的说法，错误的是（ ）。 。","material":"","options":[{"key":"A","text":"会计确认时要明确某一经济业务涉及哪个会计要素的问题（ ）。"},{"key":"B","text":"会计确认是指会计数据进入会计系统时确定如何进行记录的过程"},{"key":"C","text":"会计确认采用复式记账法"},{"key":"D","text":"在确认收入时，应采用权责发生制"}],"answer":["C"],"explanation":"本题考查会计确认的标准。，会计确认是指会计数据进入会计系统时确定如何进行记录的过程，即将某一会计事项作为资产、负债、所有者权益、收入、费用或利润等会计要素正式列入会计报表的过程，选项B正确。（会计确认主要解决三个问题：①确定某一经济业务是否需要进行确认；人②确定该业务应在何时进行确认；③确定该业务应确认为哪个会计要素，选项A正确。在确认收入时，应当及时、并坚持权责发生制，选项D正确。故本题选C选项。","id":"jichu-0212","bank":"jichu"},{"chapter":"刷章节母题 第二十九章 会计循环 共8题","point":"会计计量","type":"multi","stem":"关于会计计量说法正确的有（ ）。","material":"","options":[{"key":"A","text":"会计计量目的是进一步明确一项经济业务所带来的某一会计要素变化的数量"},{"key":"B","text":"会计的计量单位主要是货币量度和实物量度"},{"key":"C","text":"会计计量的属性主要包括历史成本、重置成本、可变现净值、终值和公允价值"},{"key":"D","text":"资产负债表日存货应当按成本与可变现净值敦熟高计量"},{"key":"E","text":"企业在对会计要素进行计量时，一般应当采用历史成本"}],"answer":["A","E"],"explanation":"本题考查会计计量的概念。会计计量目的是进一步明确一项经济业务所带来的某一会计要素变化的数量为多少，体现了会计信息的定量化特点，选项A正确。会计计量由计量单位（计量尺度）和计量属性（计量基础）两方面内容构成。会计的计量单位主要是货币量度，同时为了管理的需要辅之以各种实物量度，选项B错误。会计计量属性主要包括：历史成本、重置成本、可变现净值、现值和公允价值等，选项C错误。我国企业会计准则规定，资产负债表日，存货应当按照成本与可变现净值敦低计量，对可变现净值低于存货成本的差额，应当计提存货跌价准备，计入当期损益，选项D错误。企业在对会计要素进行计量时，一般应当采用历史成本，采用重置成本、可变现净值、现值、公允价值计量的，应当保证所确定的会计要素金额能够取得并可靠计量，选项E正确。故本题选AE选项。","id":"jichu-0213","bank":"jichu"},{"chapter":"刷章节母题 第二十九章 会计循环 共8题","point":"会计计量","type":"multi","stem":"会计计量属性主要包括（ ）。","material":"","options":[{"key":"A","text":"历史成本"},{"key":"B","text":"重置成本"},{"key":"C","text":"现行市价"},{"key":"D","text":"公允价值"},{"key":"E","text":"货币"}],"answer":["A","B","D"],"explanation":"本题考查会计计量的属性。计量属性主要有5种：历史成本、重置成本、可变现净值、现值和公允价值。故本题选ABD选项。","id":"jichu-0214","bank":"jichu"},{"chapter":"刷章节母题 第二十九章 会计循环 共8题","point":"会计记录","type":"multi","stem":"关于会计记录的说法正确的有（ ）。","material":"","options":[{"key":"A","text":"会计记录的方法主要包括设置账户、复式记账、填制和审核凭证、登记账簿、编制会计报表"},{"key":"B","text":"账户是对会计要素进行分类核算的工具"},{"key":"C","text":"借贷记账法、收付记账法和增减记账法都是复式记账的方法"},{"key":"D","text":"填制和审核会计凭证，是会计工作的开始"},{"key":"E","text":"各单位采用何种账务处理程序，由各单位自主选用或设计"}],"answer":["B","C","D","E"],"explanation":"本题考查会计记录的概念。会计记录的方法主要包括：设置账户、复式记账填制和审核凭证、登记账簿，选项A错误。账户是根据以会计要素划分的会计科目设置的，具有一定的格式和结构，用于分类反映会计要素各项目增减变动情况及其结果的载体，是对会计要素进行分类核算的工具，选项B正确。主要的复式记账法有；借贷记账法、收付记账法和增减记账法，选项C正确。填制和审核会计凭证，是会计工作的开始。通过填制和审核会计凭证，可以控制 经济活动，保证会计资料真实正确，明确经济责任，为记账提供可靠依据，保证 会计记录真实可靠，选项D正确。 会计账务处理程序有多种形式，各单位应采用何种账务处理程序由各单位自主选 用或设计，选项E正确。 故本题选BCDE选项。","id":"jichu-0215","bank":"jichu"},{"chapter":"刷章节母题 第二十九章 会计循环 共8题","point":"会计记录","type":"single","stem":"下列会计活动中，属于会计记录方法的是（ ）。","material":"","options":[{"key":"A","text":"设置账户"},{"key":"B","text":"编制会计报表"},{"key":"C","text":"财务分析"},{"key":"D","text":"预算管理"}],"answer":["A"],"explanation":"本题考查会计记录的方法。会计记录的方法包括设置账户、复式记账、填制和审核凭证、登记账簿。故本题选A选项。","id":"jichu-0216","bank":"jichu"},{"chapter":"刷章节母题 第二十九章 会计循环 共8题","point":"财务会计报告·）·（ ）。","type":"multi","stem":"在编制财务会计报告之前，为了保证报告的数字真实可靠，做到（ ），必须进行财产清查。","material":"","options":[{"key":"A","text":"做到账表相符"},{"key":"B","text":"做到账证相符"},{"key":"C","text":"做到账账相符"},{"key":"D","text":"进行财产清查"},{"key":"E","text":"做到账实相符"}],"answer":["B","C","E"],"explanation":"本题考查财务会计报告。会计报告是对账簿记录资料进行的再加工，在编制财务会计报告之前，为了保证报告的数字真实可靠，做到账证相符、账账相符、账实相符，必须进行财产清查，选项B、C、E正确。故本题选BCE选项。","id":"jichu-0217","bank":"jichu"},{"chapter":"刷章节母题 第二十九章 会计循环 共8题","point":"财务会计报告·）·（ ）。","type":"multi","stem":"按会计报表编制的时间范围不同可以分为（ ）。","material":"","options":[{"key":"A","text":"年度会计报表"},{"key":"B","text":"季度会计报表"},{"key":"C","text":"月度会计报表"},{"key":"D","text":"个别会计报表"},{"key":"E","text":"合并会计报表"}],"answer":["A","B","C"],"explanation":"本题考查会计报表的分类。选项A、B、C正确，会计报表按会计报表编制的时间范围不同可以分为年度会计报表、季度会计报表、月度会计报表。 故本题选ABC选项。","id":"jichu-0218","bank":"jichu"},{"chapter":"刷章节母题 第三十章 会计报表 共10题","point":"会计报表的概念","type":"single","stem":"关于会计报表的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"会计报表是包括反映企业财务状况、经营成果和现金流量等会计信息的书面文"},{"key":"B","text":"会计报表是单位财务人员向管理层报告工作的书面文件"},{"key":"C","text":"会计报表是会计循环过程的终点"},{"key":"D","text":"会计报表是会计核算的最后一个环节"}],"answer":["B"],"explanation":"本题考查会计报表的概念。会计报表的概念：会计报表是以日常账簿资料为主要依据编制的，总括反映企业财务状况、经营成果和现金流量等会计信息的书面文件，选项A正确。会计报表是会计核算环节的最后一个环节，也是会计循环过程的终点，是会计核算的最终成果，选项C、D正确。企业会计报表的目标是向会计报表使用者提供与企业财务状况、经营成果和现金流量等有关的会计信息。会计报表的使用者包括债权人、投资者、管理层、国家有关部门等，选项B错误。 。 。故本题选B选项。（ ）。","id":"jichu-0219","bank":"jichu"},{"chapter":"刷章节母题 第三十章 会计报表 共10题","point":"会计报表的概念","type":"multi","stem":"下列关于会计报表作用的说法，正确的是（ )。","material":"","options":[{"key":"A","text":"根据财务报表可以进行正确的投资决策和信贷决策"},{"key":"B","text":"根据财务报表可以考核和分析企业财务成本计划或预算的完成情况"},{"key":"C","text":"根据财务报表可以总结和分析企业经营中所取得的成绩和存在的问题，评价企业的经济效益，作出改进生产经营管理的决策"},{"key":"D","text":"根据财务报表投资者不能评估企业管理层对受托资源的经营管理责任的履行情况"},{"key":"E","text":"根据财务报表可以了解和掌握各部门、各地区的经济运行情况、各项财经法律制度的执行情况（人"}],"answer":["A","B","C","E"],"explanation":"本题考查会计报表的作用。企业的投资者和债权人通过会计报表提供的会计信息，可以了解有关企业财务状况、经营成果和现金流量的情况，据以进行正确的投资决策和信贷决策（选项A正确)。同时，投资者还可以评估企业管理层对受托资源的经营管理责任的履行情况（选项D错误）。企业管理者通过会计报表提供的会计信息，可以掌握本企业有关财务状况、经营成果和现金流量的情况，据以考核和分析企业财务成本计划或预算的完成情况（选项B正确）。总结和分析企业经营中所取得的成绩和存在的问题，评价企业的经济效益，作出改进生产经营管理的决策（选项C正确）。国家有关部门通过对企业提供的会计报表资料进行汇总分析，可以了解和掌握各部门、各地区的经济运行情况、各项财经法律制度的执行情况，并针对存在的问题，采取各种经济杠杆和政策进行必要的宏观调控，促进社会资源的有效配置(选 项E正确）。 故本题选ABCE选项。","id":"jichu-0220","bank":"jichu"},{"chapter":"刷章节母题 第三十章 会计报表 共10题","point":"资产负债表","type":"multi","stem":"关于资产负债表的说法，错误的有（ ）。","material":"","options":[{"key":"A","text":"资产负债表反映企业在某一特定日期的财务状况"},{"key":"B","text":"资产负债表可以总括反映企业资金的来源渠道和构成情况"},{"key":"C","text":"资产负债表主要用于反映企业的盈利能力"},{"key":"D","text":"目前我国采用报告式资产负债表格式"},{"key":"E","text":"资产负债表反映企业在一定会计期间的经营成果"}],"answer":["C","D","E"],"explanation":"本题考查资产负债表的概念。资产负债表是反映企业在某一特定日期财务状况的会计报表（选项A正确、选项E错误），是按照一定的标准和顺序将资产、负债、所有者权益进行适当排列编制的，反映企业在某一特定日期所拥有或控制的经济资源、所承担的现时义务和所有者对净资产的要求权（选项C错误)。编制资产负债表的作用主要体现在以下四个方面：（1）资产负债表为报表使用者提供企业所拥有和控制掌握的经济资源及其分布和构成情况的信息，为经营者分析资产分布是否合理提供依据。（2）资产负债表总括反映企业资金的来源渠道和构成情况（选项B正确）。（3）通过对资产负债表的分析，可以了解企业的财务状况，判断企业的偿债能力和支付能力。（4)通过对前后期资产负债表的对比分析，可以了解企业资金结构的变化情况，经营者、投资者和债权人据此可以掌握企业财务状况的变化情况和变化趋势。资产负债表的格式有账户式和报告式两种，我国采用账户式资产负债表格式（选项D错误）。故本题选CDE选项。","id":"jichu-0221","bank":"jichu"},{"chapter":"刷章节母题 第三十章 会计报表 共10题","point":"资产负债表","type":"single","stem":"下列会计科目中，属于流动资产的是（ ）。","material":"","options":[{"key":"A","text":"固定资产"},{"key":"B","text":"存货"},{"key":"C","text":"短期借款"},{"key":"D","text":"预收账款"}],"answer":["B"],"explanation":"本题考查资产负债的格式和内容。流动资产是指预计在一个正常营业周期中变现、出售或耗用，或者主要为交易目的而持有，或者预计在资产负债表日起1年内（含1年）变现的资产，以及自资产负债表日起1年内交换其他资产或清偿负债的能力不受限制的现金或现金等价物。流动资产主要包括货币资金、交易性金融资产、应收票据及应收账款、预付款项、其他应收款、存货（选项B正确）等。“固定资产”属于非流动资产（选项A错误）。“短期借款”“预收账款”属于流动负债（选项C、D错误)。故本题选B选项。","id":"jichu-0222","bank":"jichu"},{"chapter":"刷章节母题 第三十章 会计报表 共10题","point":"利润表","type":"multi","stem":"利润表的基本格式主要有（ ）。","material":"","options":[{"key":"A","text":"账户式"},{"key":"B","text":"单步式"},{"key":"C","text":"多步式"},{"key":"D","text":"报告式"},{"key":"E","text":"复合式"}],"answer":["B","C"],"explanation":"本题考查利润表的格式和内容。利润表的基本格式主要有单步式和多步式。我国采用多步式。故本题选BC选项。","id":"jichu-0223","bank":"jichu"},{"chapter":"刷章节母题 第三十章 会计报表 共10题","point":"利润表","type":"single","stem":"已知某企业本年营业收入280万元，营业成本160万元，管理费用60万元，“营业外支出”为40万元。假设不考虑其他因素，该企业本年营业利润为（ ）。万元。","material":"","options":[{"key":"A","text":"20"},{"key":"B","text":"120"},{"key":"C","text":"60"},{"key":"D","text":"80"}],"answer":["C"],"explanation":"本题考查利润表的格式和内容。营业利润=营业收入-营业成本-营业税金及附加-销售费用-管理费用-研发费用－财务费用-资产减值损失-信用减值损失+其他收益+投资收益+公允价值变动损益+资产处置收益，营业外支出不属于营业利润的计算范围，所以该企业本年营业利润=280-160-60=60万元。故本题选C选项。人","id":"jichu-0224","bank":"jichu"},{"chapter":"刷章节母题 第三十章 会计报表 共10题","point":"现金流量表","type":"multi","stem":"下列经济业务不会发生现金流量的有（ ）。高句","material":"","options":[{"key":"A","text":"用固定资产偿还债务"},{"key":"B","text":"用固定资产对外投资"},{"key":"C","text":"用原材料对外投资"},{"key":"D","text":"从银行提取现金"},{"key":"E","text":"销售商品取得的收入"}],"answer":["A","B","C","D"],"explanation":"本题考查现金流量表的概念。企业发生的经济业务，若只是涉及现金各项目之间的变动或非现金项目之间的增减变动，如从银行提取现金或将现金存入银行等业务属于现金各项目之间内部资金的转换，不会发生现金流量，而以固定资产清偿债务、用原材料或固定资产等 对外投资等经营业务，则属于非现金各项目之间的增减变动，也不会发生现金流 量，选项A、B、C、D正确。 只有发生的经济业务涉及现金各项目与非现金各项目之间的增减变动时，如用现 金购买原材料、用现金对外投资、收回长期债券投资等，才会影响现金流量，选 项E错误。 故本题选ABCD选项。","id":"jichu-0225","bank":"jichu"},{"chapter":"刷章节母题 第三十章 会计报表 共10题","point":"现金流量表","type":"multi","stem":"下列现金流量中，属于投资活动产生的有（ ）。","material":"","options":[{"key":"A","text":"收回投资收到的现金"},{"key":"B","text":"分配股利支付的现金"},{"key":"C","text":"支付各项税费"},{"key":"D","text":"取得借款收到的现金"},{"key":"E","text":"购建固定资产支付的现金"}],"answer":["A","E"],"explanation":"本题考查现金流量表的编制方法。投资活动是指企业长期资产的购建和不包括在现金等价物范围内的投资及其处的现金”项目、“处置固定资产、无形资产和其他长期资产收回的现金净额”项目、“处置子公司及其他营业单位收到的现金净额”项目、“收到其他与投资活动有关的现金”项目、“购建固定资产、无形资产和其他长期资产支付的现金”项目（选项E正确）、“投资支付的现金”项目、“取得子公司及其他营业单位支付的现金净额”项目、“支付其他与投资活动有关的现金”项目。故本题选AE选项。","id":"jichu-0226","bank":"jichu"},{"chapter":"刷章节母题 第三十章 会计报表 共10题","point":"会计报表附注","type":"multi","stem":"我国企业会计准则规定，附注一般应当披露的内容有（ ）。","material":"","options":[{"key":"A","text":"财务报表的编制基础"},{"key":"B","text":"遵循企业会计准则的声明"},{"key":"C","text":"重要会计政策的说明"},{"key":"D","text":"重要会计估计的说明（人"},{"key":"E","text":"企业董事会信息"}],"answer":["A","B","C","D"],"explanation":"本题考查会计报表附注。会计报表附注的内容一般应该包括：（1）财务报表的编制基础，选项A正确；（2）遵循企业会计准则的说明，选项B正确；（3）重要会计政策的说明，选项C正确；（4）重要会计估计的说明，选项D正确；（5）会计政策和估计变更以及差错更正的说明；（6）对已在资产负债表、现金流量表等会计报表中列示的重要项目的进一步说明。故本题选ABCD选项。","id":"jichu-0227","bank":"jichu"},{"chapter":"刷章节母题 第三十章 会计报表 共10题","point":"会计报表附注","type":"multi","stem":"我国企业会计准则规定，会计报表附注一般应当披露的内容有（ ）。","material":"","options":[{"key":"A","text":"或有事项"},{"key":"B","text":"财务报表的编制基础"},{"key":"C","text":"遵循企业会计准则的声明"},{"key":"D","text":"企业的成立时间"},{"key":"E","text":"会计政策和会计估计变更的说明"}],"answer":["A","B","C","E"],"explanation":"本题考查会计报表附注。根据我国会计准则，附注中一般应当披露：①企业的基本情况；②财务报表的编制基础（选项B正确)；③遵循企业会计准则的声明（选项C正确)；④重要会计政策的说明，包括财务报表项目的计量基础和会计政策的确定依据；③重要会计估计的说明，包括下一会计期间内很可能导致资产、负债账面价值重大调整的会计估计的确定依据等；③会计政策和会计估计变更以及差错更正的说明（选项E正确)；①对已在资产负债表、利润表、现金流量表和所有者权益变动表等会计报表中列示的重要项目的进一步说明，包括终止经营税后利润的金额及其构成情况等；③或有事项和承诺事项（选项A正确）、资产负债表日后非调整事项、关联方关系及其交易等需要说明的事项；③有助于财务报表使用者评价企业管理资本的目标、政策及程序的信息。企业的成立时间不属于一般应当披露的内容，选项D错误。故本题选ABCE选项。","id":"jichu-0228","bank":"jichu"},{"chapter":"刷章节母题 第三十一章 财务报表分析 共6题","point":"财务报表分析的意义和内容","type":"multi","stem":"财务分析是通过财务指标的高低评价企业的（ ），为企业投资者、债权人和其他利益关系人提供管理决策的依据。","material":"","options":[{"key":"A","text":"偿债能力"},{"key":"B","text":"发展能力"},{"key":"C","text":"经营成果"},{"key":"D","text":"盈利能力"},{"key":"E","text":"营运能力"}],"answer":["A","B","D","E"],"explanation":"本题考查财务报表分析的意义。财务报表分析，简称财务分析，是通过收集、整理企业财务会计报告中的有关数据，并结合其他有关的补充信息，对企业的财务状况、经营成果和现金流量情况进行综合比较，并通过财务指标的高低评价企业的偿债能力、盈利能力、营运能力和发展能力（选项A、B、D、E正确），为企业投资者、债权人和其他利益关系人提供管理决策的依据。故本题选ABDE选项。","id":"jichu-0229","bank":"jichu"},{"chapter":"刷章节母题 第三十一章 财务报表分析 共6题","point":"财务报表分析的意义和内容","type":"multi","stem":"关于财务报表分析的内容，下列说法中正确的有（ ）。","material":"","options":[{"key":"A","text":"财务报表分析的基本内容主要包括偿债能力、营运能力和盈利能力等"},{"key":"B","text":"财务报表分析方法包括比率分析法、比较分析法、因素分析法"},{"key":"C","text":"做好财务报表分析可以预测企业未来的报酬和风险"},{"key":"D","text":"营运能力是企业财务目标实现的稳健保证"},{"key":"E","text":"财务报表分析最基本的分析方法是比率分析法（ ）。"}],"answer":["A","C"],"explanation":"本题考查财务报表分析的内容。选项A正确，从企业总体来看，财务报表分析的基本内容，主要包括以下三个方面：①分析企业的偿债能力，分析企业权益的结构，评价企业归还债务的能力，估量企业对债务资金的利用程度。②评价企业资产的营运能力，分析企业资产的分布情况和周转使用情况，估量企业对资产的利用效率。原包③评价企业的盈利能力，分析企业利润目标的完成情况和不同年度盈利水平的变动情况，评价企业的发展能力，分析企业发展的方向和发展潜力。以上三个方面的分析内容互相联系、互相补充，可综合描述出企业生产经营的财务状况、经营成果和现金流量情况，以满足不同使用者对会计信息的基本需要。其中偿债能力是企业财务目标实现的稳健保证（选项D错误），而营运能力是企业财务目标实现的物质基础，盈利能力则是前两者共同作用的结果，同时也对前两者的提升起着推动作用。做好财务报表分析工作：①可以正确评价企业的财务状况、经营成果和现金流量情况，揭示企业经营活动中存在的矛盾和问题，为改善经营管理提供方向和线索。 ②可以预测企业未来的报酬和风险，检查企业预算完成情况，考核经营管理人员 的业绩，为建立健全合理的激励机制提供帮助，选项C正确。 财务报表分析常用的方法包括：比率分析法、比较分析法、趋势分析法。其中最 基本的分析方法是比较分析法，选项B、E错误。 故本题选AC选项。","id":"jichu-0230","bank":"jichu"},{"chapter":"刷章节母题 第三十一章 财务报表分析 共6题","point":"财务报表分析的基本方法","type":"multi","stem":"在对财务报表进行比率分析时，常用的财务比率有（ ）。","material":"","options":[{"key":"A","text":"结构比率"},{"key":"B","text":"效率比率"},{"key":"C","text":"定基动态比率"},{"key":"D","text":"绝对数差异"},{"key":"E","text":"相关比率"}],"answer":["A","B","E"],"explanation":"本题考查比率分析法。在比率分析中，常用的财务比率有相关比率、结构比率和效率比率。故本题选ABE选项。","id":"jichu-0231","bank":"jichu"},{"chapter":"刷章节母题 第三十一章 财务报表分析 共6题","point":"财务报表分析的基本方法","type":"multi","stem":"比较分析法下，按比较对象不同可以分为（ ）。","material":"","options":[{"key":"A","text":"绝对数比较分析（ ）。"},{"key":"B","text":"绝对数增减变动分析。"},{"key":"C","text":"百分比增减变动分析"},{"key":"D","text":"实际指标同计划指标比较"},{"key":"E","text":"本期指标与上期指标比较"}],"answer":["A","B","C"],"explanation":"本题考查财务报表分析的基本方法。比较分析法下，按比较对象不同可以分为：绝对数比较分析、绝对数增减变动分析、百分比增减变动分析，选项A、B、C正确。按比较标准不同可以分为实际指标同计划指标比较、本期指标与上期指标比较、本企业指标同国内外先进企业指标比较，选项D、E错误。故本题选ABC选项。","id":"jichu-0232","bank":"jichu"},{"chapter":"刷章节母题 第三十一章 财务报表分析 共6题","point":"财务报表分析的基本指标","type":"single","stem":"下列财务分析指标中，用来反映企业偿债能力的是（ ）。","material":"","options":[{"key":"A","text":"流动资产周转率"},{"key":"B","text":"市盈率"},{"key":"C","text":"营业利润率"},{"key":"D","text":"资产负债率"}],"answer":["D"],"explanation":"本题考查偿债能力分析。反映企业短期偿债能力的比率：流动比率、速动比率和现金比率。反映企业长期偿债能力的比率：资产负债率、产权比率、已获利息倍数。选项A“流动资产周转率”反映的是营运能力。 故本题选D选项。","id":"jichu-0233","bank":"jichu"},{"chapter":"刷章节母题 第三十一章 财务报表分析 共6题","point":"财务报表分析的基本指标","type":"single","stem":"下列财务指标中，反映投资者投入资本盈利能力的是（ ）。","material":"","options":[{"key":"A","text":"净资产收益率"},{"key":"B","text":"营业利润率"},{"key":"C","text":"资产周转率"},{"key":"D","text":"主管业务净利润率"}],"answer":["A"],"explanation":"本题考查盈利能力。盈利能力指标主要有：营业利润率；主营业务净利润率；资本收益率；净资产收益率；资产净利润率；普通股每股收益；市盈率；资本保值增值。其中，净资产收益率也称所有者权益报酬率或净资产利润率，反映所有者对企业投资部分的盈利能力，题干强调投入资本，所以应选择净资产收益率。故本题选A选项。","id":"jichu-0234","bank":"jichu"},{"chapter":"刷章节母题 第三十二章 政府会计 共6题","point":"政府会计的概念","type":"single","stem":"目前我国政府财务会计核算采用（ ）。","material":"","options":[{"key":"A","text":"实地盘存制"},{"key":"B","text":"收付实现制"},{"key":"C","text":"永续盘存制"},{"key":"D","text":"权责发生制"}],"answer":["D"],"explanation":"本题考查政府会计的概念。政府财务会计提供与政府财务状况、运行情况（含运行成本）和现金流量等有关信息，实行权责发生制。故本题选D选项。","id":"jichu-0235","bank":"jichu"},{"chapter":"刷章节母题 第三十二章 政府会计 共6题","point":"政府会计的概念","type":"multi","stem":"政府会计由（ ）构成。","material":"","options":[{"key":"A","text":"财务会计"},{"key":"B","text":"管理会计"},{"key":"C","text":"预算会计。"},{"key":"D","text":"责任会计（ ）。"},{"key":"E","text":"决算会计。"}],"answer":["A","C"],"explanation":"本题考查政府会计的概念。政府会计由预算会计和财务会计构成。故本题选AC选项。","id":"jichu-0236","bank":"jichu"},{"chapter":"刷章节母题 第三十二章 政府会计 共6题","point":"政府会计要素","type":"multi","stem":"政府预算会计要素包括（ ）。人","material":"","options":[{"key":"A","text":"预算收入"},{"key":"B","text":"预算支出"},{"key":"C","text":"预算结余包"},{"key":"D","text":"预算资产"},{"key":"E","text":"预算费用"}],"answer":["A","B","C"],"explanation":"本题考查政府预算会计的要素。政府预算会计要素包括预算收入、预算支出和预算结余。故本题选ABC选项。","id":"jichu-0237","bank":"jichu"},{"chapter":"刷章节母题 第三十二章 政府会计 共6题","point":"政府会计要素","type":"multi","stem":"反映政府会计主体某一会计期间运行情况的会计要素的有（ ）。","material":"","options":[{"key":"A","text":"资产"},{"key":"B","text":"负债"},{"key":"C","text":"费用"},{"key":"D","text":"收入"},{"key":"E","text":"利润"}],"answer":["C","D"],"explanation":"本题考查政府财务会计要素。反映财务状况的会计要素包括资产、负债、净资产；反映运行情况的会计要素包括收入和费用。故本题选CD选项。","id":"jichu-0238","bank":"jichu"},{"chapter":"刷章节母题 第三十二章 政府会计 共6题","point":"政府会计报告","type":"single","stem":"政府财政部门编制的，反映各级政府整体财务状况、运行情况和财政中长期可持续性的报告称为（ ）。","material":"","options":[{"key":"A","text":"政府综合财务报告"},{"key":"B","text":"政府部门财务报告"},{"key":"C","text":"政府财务报告"},{"key":"D","text":"政府决算报告"}],"answer":["A"],"explanation":"本题考查政府财务报告的构成。政府财务报告包括政府综合财务报告和政府部门财务报告。其中，政府综合财务报告是指由政府财政部门编制的，反映各级政府整体财务状况、运行情况和财政中长期可持续性的报告。故本题选A选项。","id":"jichu-0239","bank":"jichu"},{"chapter":"刷章节母题 第三十二章 政府会计 共6题","point":"政府会计报告","type":"multi","stem":"政府部门财务报告中，会计报表至少应当包括（ ）。","material":"","options":[{"key":"A","text":"资产负债表"},{"key":"B","text":"现金流量表"},{"key":"C","text":"收入费用表"},{"key":"D","text":"净资产差异表"},{"key":"E","text":"当期盈余与预算结余差异表"}],"answer":["A","C","D","E"],"explanation":"本题考查政府部门财务报告。会计报表至少应当包括：资产负债表、收入费用表、当期盈余与预算结余差异表和净资产差异表。故本题选ACDE选项。","id":"jichu-0240","bank":"jichu"},{"chapter":"刷章节母题 第三十三章 法律对经济关系的调整 共6题","point":"“调整经济的法”和“经济法”","type":"single","stem":"在奴隶制社会和封建社会法律对经济关系的调整模式是（ ）。","material":"","options":[{"key":"A","text":"诸法合一，刑法、民法不分"},{"key":"B","text":"民商法主导模式"},{"key":"C","text":"行政法主导模型"},{"key":"D","text":"民商法、经济法主导，环境法、劳动法、社会保障法等辅助模式"}],"answer":["A"],"explanation":"本题考查“调整经济的法”和“经济法”。法律对经济关系的调整阶段如下：（（1）第一个阶段是在奴隶制社会和封建社会，法律对经济关系的调整是诸法合一，刑法、民法不分。（2）第二个阶段始自封建社会末期和自由资本主义阶段，从最初诸法合一发展为刑法、民法分离；以后又分为民法、刑法、行政法，以致发展到十几个法律部门。这个时期对经济关系调整起主导作用的是民商法。（3）第三阶段是进入当代社会，法律体系重新整合，民法、商法和经济法共同对经济关系进行调整，同时社会保障法、环境保护法等新兴法律部门也成为调整经济关系的辅助性法律部门。故本题选A选项。","id":"jichu-0241","bank":"jichu"},{"chapter":"刷章节母题 第三十三章 法律对经济关系的调整 共6题","point":"“调整经济的法”和“经济法”","type":"single","stem":"关于“经济法”和“调整经济的法”，正确的是（ ）。","material":"","options":[{"key":"A","text":"两个概念内涵一致"},{"key":"B","text":"“经济法”的外延比“调整经济的法”的外延大（ ）。"},{"key":"C","text":"“经济法”是与“调整经济的法”并列的法律部门"}],"answer":["A"],"explanation":"本题考查“调整经济的法”和“经济法”。“经济法”是与民法、商法、行政法、刑法等部门法并列的一个法律部门，是现代法律体系的一个重要组成部分。所谓“调整经济的法”，是调整围绕社会物质财富的生产、交换、分配和消费过程所进行的各种经济关系的法律规范的总体，它既包括传统法律体系中的民法、商法，也包括近代产生的经济法，它既包括调整国内经济关系的法，也包括调整国际经济关系的国际私法和国际经济法，它是一国所有调整经济关系的法律规范的总和。故本题选A选项。","id":"jichu-0242","bank":"jichu"},{"chapter":"刷章节母题 第三十三章 法律对经济关系的调整 共6题","point":"调整社会主义市场经济的法律体系","type":"multi","stem":"体现人对财产支配关系的法律制度有（ ）。","material":"","options":[{"key":"A","text":"知识产权法律制度"},{"key":"B","text":"人格权法律制度.合同法律制度"},{"key":"C","text":"物权法律制度"},{"key":"D","text":"法人制度"}],"answer":["A","D"],"explanation":"本题考查民商法。人类要进行物质资料的生产，首先要完成人与生产资料的结合。这种结合具体体现为人对财产的支配关系，在法律上就表现为物权法律制度。知识产权法律制度作为调整无形的智力成果的支配关系的法律制度，也属于调整财产支配关系的范围。物权法律制度和知识产权法律制度通过调整各种社会物质财富的归属和利用关系，直接影响社会生产的过程和社会经济的结构。故本题选AD选项。","id":"jichu-0243","bank":"jichu"},{"chapter":"刷章节母题 第三十三章 法律对经济关系的调整 共6题","point":"调整社会主义市场经济的法律体系","type":"single","stem":"关于经济法的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"经济法的调整对象包括经济管理关系，市场关系和组织管理性的流转和协作关"},{"key":"B","text":"经济法就是调整经济的法"},{"key":"C","text":"经济法是调整各种经济关系的法律规范的总称"},{"key":"D","text":"物权法是经济法的重要组成部分（ ）。"}],"answer":["A"],"explanation":"本题考查经济法。（ ），（·，）经济法的调整对象包括三类：经济管理关系、市场管理关系、组织管理性的流转和协作关系，选项A正确。“调整经济的法”和“经济法”它们是两个不同的概念，“调整经济的法”是调整各种经济关系的法律规范的总称。物权法不属于经济法，选项B、C、D错误。故本题选A选项。","id":"jichu-0244","bank":"jichu"},{"chapter":"刷章节母题 第三十三章 法律对经济关系的调整 共6题","point":"优化营商环境的制度与实践（ ）。","type":"multi","stem":"我国优化营商环境的实践范围，包括（ ）。","material":"","options":[{"key":"A","text":"市场主体保护"},{"key":"B","text":"市场环境"},{"key":"C","text":"政务服务"},{"key":"D","text":"监督执法"},{"key":"E","text":"要素流动"}],"answer":["A","B","C","D"],"explanation":"本题考查优化营商环境的制度与实践。近年来，党和国家高度重视优化营商环境建设，我国优化营商环境的实践范围包括市场主体保护、市场环境、政务服务、监督执法、法治保障等。故本题选ABCD选项。","id":"jichu-0245","bank":"jichu"},{"chapter":"刷章节母题 第三十三章 法律对经济关系的调整 共6题","point":"优化营商环境的制度与实践（ ）。","type":"multi","stem":"优化营商环境应当秉持的基本原则包括（ ）。","material":"","options":[{"key":"A","text":"持续深化简政放权、放管结合、优化服务改革的原则"},{"key":"B","text":"坚持市场化、法治化、国际化原则"},{"key":"C","text":"建立以公众满意度为导向的原则"},{"key":"D","text":"建立统一开放、竞争有序的现代市场体系原则"},{"key":"E","text":"平等对待各类市场主体原则"}],"answer":["A","B","D","E"],"explanation":"本题考查营商环境的概念和优化营商环境的基本原则。优化营商环境应当秉持以下基本原则：①国家持续深化简政放权、放管结合、优化服务改革的原则。②坚持市场化、法治化、国际化原则。③建立统一开放、竞争有序的现代市场体系原则。④平等对待各类市场主体原则。故本题选ABDE选项。","id":"jichu-0246","bank":"jichu"},{"chapter":"刷章节母题 第三十四章 物权法律制度 共8题","point":"物权概述","type":"multi","stem":"关于物权与债权区别的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"物权是支配权，债权是请求权"},{"key":"B","text":"物权为绝对权，债权为相对权"},{"key":"C","text":"物权不允许当事人自由创设，债权可以由当事人自由确定"},{"key":"D","text":"物权具有优先力与追及力，债权只有追及力"},{"key":"E","text":"物权的客体可以是物，也可以是行为"}],"answer":["A","B","C"],"explanation":"本题考查物权的概念和特征。物权和债权构成了市场经济社会的最基本的财产权利。物权与债权的区别主要体现在以下几个方面：①物权是绝对权（对世权)；债权是相对权（对人权)。②物权属于支配权；债权属于请求权。③物权是法定的，物权的设定采用法定主义。（④物权的客体一般为物。③物权具有追及效力和优先效力，债权原则上不具有追及效力，选项D错误。物权的标的是物而不是行为，选项E错误。 （ ）。故本题选ABC选项。","id":"jichu-0247","bank":"jichu"},{"chapter":"刷章节母题 第三十四章 物权法律制度 共8题","point":"物权概述","type":"multi","stem":"关于物权法律制度的基本原则，说法正确的有（ ）。","material":"","options":[{"key":"A","text":"物权的种类、内容、效力、得丧变更及其保护的方法由法律规定"},{"key":"B","text":"一个特定的标的物上只有一个所有权，同一物之上不可以并存数个物权"},{"key":"C","text":"动产物权的设立、变更、转让和消灭，经依法登记，发生效力"},{"key":"D","text":"依法属于国家所有的自然资源，所有权可以不登记（ ）。"},{"key":"E","text":"物权法律制度的基本原则包括物权法定原则、一物一权原则和物权公示原则"}],"answer":["A","D","E"],"explanation":"本题考查物权法律制度的基本原则。人物权法定原则是指物权的种类、内容、效力、得丧变更及其保护的方法均源自法律的直接规定，当事人不得自由地创设，选项A正确。一个特定的标的物上只有一个所有权。同一物上不得设有两个以上相互冲突和矛盾的物权。同一物之上可以并存数个不相矛盾的物权，选项B错误。包依照我国法律的规定，普通的动产一经交付，便发生所有权转移的后果；不动产物权的设立、变更、转让和消灭，经依法登记，发生效力；未经登记，不发生效力，但是法律另有规定的除外，选项C错误。依法属于国家所有的自然资源，所有权可以不登记，选项D正确。物权法律制度的基本原则主要包括：物权法定原则、一物一权原则和物权公示原则，选项E正确。故本题选ADE选项。","id":"jichu-0248","bank":"jichu"},{"chapter":"刷章节母题 第三十四章 物权法律制度 共8题","point":"所有权","type":"multi","stem":"下列对所有权的描述中正确的有（ ）。","material":"","options":[{"key":"A","text":"所有权是一个整体的权利，其部分权利不能转移给他人行使"},{"key":"B","text":"同一物上只能有一个所有权存在，不能形成双重所有权"},{"key":"C","text":"占有权是所有权内容的核心，是拥有所有权的根本标志"},{"key":"D","text":"先占、添附、赠与、善意取得、拾得遗失物都属于所有权的原始取得方式"},{"key":"E","text":"枪支弹药、黄金、麻醉品等禁止或限制流通物不适用所有权的善意取得制度"}],"answer":["B","E"],"explanation":"本题考查所有权的概念和法律特征。所有权并非占有、使用、收益和处分四项权利的简单相加，而是一个整体的权利。所有权人既可以由自己统一行使，也可以将其部分权能转移给他人行使，选项A错误。处分权是所有权内容的核心，是拥有所有权的根本标志，选项C错误。先占、添附、善意取得、拾得遗失物属于所有权的原始取得方式，而赠与属于所有权的继受取得方式，选项D错误。故本题选BE选项。","id":"jichu-0249","bank":"jichu"},{"chapter":"刷章节母题 第三十四章 物权法律制度 共8题","point":"所有权","type":"single","stem":"所有权的合法取得方式分为原始取得与继受取得，下列方式属于所有权继受取得的是（ ）。","material":"","options":[{"key":"A","text":"生产"},{"key":"B","text":"添附"},{"key":"C","text":"国有化和没收"},{"key":"D","text":"赠与"}],"answer":["D"],"explanation":"本题考查所有权的取得与消灭。所有权的合法取得方式可分为原始取得与继受取得两种。（1）原始取得。所有权首次产生或不依赖于原所有人的意志而取得物的所有权。原始取得的方式主要有：生产、先占、添附、发现埋藏物和隐藏物、拾得遗失物、国有化和没收，选项A、B、C错误。 人（2）继受取得。继受取得是指通过一定的法律行为或基于法定的事实从原所有人处取得所有权。所有权继受取得的原因主要包括：①因一定的法律行为而取得所有权。法律行为具体包括买卖合同、赠与和互易等，选项D正确。②因法律行为以外的事实而取得所有权。例如继承遗产。③因其他合法原因取得所有权。如合作经济组织的成员通过合股集资的方式形成新的所有权形式。故本题选D选项。","id":"jichu-0250","bank":"jichu"},{"chapter":"刷章节母题 第三十四章 物权法律制度 共8题","point":"用益物权","type":"multi","stem":"下列权利中，属于用益物权的是（ ）。","material":"","options":[{"key":"A","text":"地役权"},{"key":"B","text":"宅基地使用权"},{"key":"C","text":"留置权"},{"key":"D","text":"质权"},{"key":"E","text":"土地承包经营权"}],"answer":["A","B","E"],"explanation":"本题考查用益物权的概念和法律特征。在我国，用益物权的种类主要包括：土地承包经营权、建设用地使用权、宅基地使用权、海域使用权、地役权、国家集体自然资源使用权、探矿权、采矿权、取水权、渔业养殖捕捞权等。故本题选ABE选项。","id":"jichu-0251","bank":"jichu"},{"chapter":"刷章节母题 第三十四章 物权法律制度 共8题","point":"用益物权","type":"multi","stem":"关于用益物权的下列表述，正确的有（ ）。","material":"","options":[{"key":"A","text":"用益物权包括土地承包经营权、建设用地使用权、抵押权、留置权等"},{"key":"B","text":"设立建设用地使用权可以采取出让或者划拨等方式"},{"key":"C","text":"用益物权的标的物主要是动产"},{"key":"D","text":"地役权是按照合同设立的"},{"key":"E","text":"承包经营合同是确认土地承包经营权的主要依据"}],"answer":["B","D","E"],"explanation":"本题考查几种具体的用益物权。用益物权是由所有权派生的物权，是受限制的物权，但也是一项独立的物权，一般以不动产为客体，包括土地承包经营权、建设用地使用权、宅基地使用权、海域使用权、地役权等，选项A错误、选项C错误。设立建设用地使用权的，可以采取出让和划拨的方式，选项B正确。地役权是按照合同约定利用他人的不动产，以提高自已不动产效益的权利。是按照合同设立的，设立地役权，当事人应当采取书面形式。地役权不能由法律强制，应当采取协商的方式由当事人约定，选项D正确。承包经营合同是确认土地承包经营权的主要依据，选项E正确。故本题选BDE选项。","id":"jichu-0252","bank":"jichu"},{"chapter":"刷章节母题 第三十四章 物权法律制度 共8题","point":"担保物权","type":"single","stem":"在所担保的债权未受全部清偿前，担保权人可就担保物的全部行使权利，这体现了担保物权的（ ）特点。","material":"","options":[{"key":"A","text":"价值权性"},{"key":"B","text":"法定性O原包"},{"key":"C","text":"不可分性"},{"key":"D","text":"物上代位性"}],"answer":["C"],"explanation":"本题考查担保物权的概念和法律特征。担保物权具有：（1）不可分性，即在所担保的债权未受全部清偿前，担保权人可就担保物的全部行使权利，选项C正确。担保物权的不可分性不是担保物权在性质上的不可分，而是为增加其效力赋予担保物权不可分性，当事人可约定排除担保物权行使的不可分性。（2）价值权性：担保物权以支配标的物的交换价值为内容，以担保债务的清偿 为目的；担保物权实现时，其价值权也得以实现，选项A错误。 （3）法定性：当事人不得约定设立担保物权，也不得协议变更担保物权发生的 要件和内容，选项B错误。 （4）物上代位性：担保标的物变化为其他的价值形态时，担保物权所具有的支 配效力及于变形物或代替物。担保物因毁损灭失所获得的赔偿金成为担保物的代 替物，担保物权人可就该代替物行使担保物权，选项D错误。 故本题选C选项。","id":"jichu-0253","bank":"jichu"},{"chapter":"刷章节母题 第三十四章 物权法律制度 共8题","point":"担保物权","type":"single","stem":"根据物权法律规定，下列财产中禁止抵押的是（ ）。","material":"","options":[{"key":"A","text":"土地所有权"},{"key":"B","text":"正在建造的建筑物"},{"key":"C","text":"生产设备"},{"key":"D","text":"建设用地使用权"}],"answer":["A"],"explanation":"本题考查几种主要的担保物权。选项B、C、D不符合题意，债务人或者第三人有权处分的下列财产可以作为抵押标的：①建筑物和其土地附着物；（②建设用地使用权；③以招标、拍卖、公开协商等方式取得的荒地等土地承包经营权；④生产设备、原材料、半成品、产品；③正在建造的建筑物、船舶、航空器；③交通运输工具；法律、行政法规未禁止抵押的其他财产。选项A符合题意，不得用于抵押的财产包括：①土地所有权;②耕地、宅基地、自留地、自留山等集体所有的土地使用权，但法律规定可以抵押的除外；③学校、幼儿园、医院等以公益为目的的事业单位、社会团体的教育设施、医疗卫生设施和其他社会公益设施；④所有权、使用权不明或者有争议的财产；③依法被查封、扣押、监管的财产；③法律、行政法规规定不得抵押的其他财产。故本题选A选项。意包","id":"jichu-0254","bank":"jichu"},{"chapter":"刷章节母题 第三十五章 合同法律制度 共12题","point":"合同概述","type":"single","stem":"关于合同的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"合同是关于民事权利义务关系的协议"},{"key":"B","text":"合同是双方或多方的民事法律行为"},{"key":"C","text":"合同当事人的法律地位在特殊条件下是不平等的"},{"key":"D","text":"合同是当事人在自愿原则的基础上进行的民事行为"}],"answer":["C"],"explanation":"本题考查合同的概念和特征。合同是平等主体的自然人、法人、其他组织之间设立、变更、终止民事权利义务关系的协议（选项A正确）。合同具有如下法律特征：（1）合同当事人的法律地位平等（选项C错误）。（2）合同是在当事人自愿基础上进行的民事法律行为（选项D正确）。（3）合同是双方或多方的民事法律行为（选项B正确）。（4）合同是关于民事权利义务关系的协议。故本题选C选项。","id":"jichu-0255","bank":"jichu"},{"chapter":"刷章节母题 第三十五章 合同法律制度 共12题","point":"合同概述","type":"multi","stem":"从合同的法律性质分析，赠与合同属于（ ）。","material":"","options":[{"key":"A","text":"单务合同"},{"key":"B","text":"要式合同"},{"key":"C","text":"从合同"},{"key":"D","text":"单方合同"},{"key":"E","text":"有名合同"}],"answer":["A","E"],"explanation":"本题考查合同的分类。（赠与合同是赠与人将自己的财产无偿给予受赠人，受赠人表示接受赠与的合同。所以赠与合同属于单务合同。人赠与合同是合同法中有明文规定的合同，又称为典型合同。对赠与合同法律没有规定任何形式，所以是不要式合同，不是要式合同。故本题选AE选项。","id":"jichu-0256","bank":"jichu"},{"chapter":"刷章节母题 第三十五章 合同法律制度 共12题","point":"合同的效力","type":"single","stem":"以下哪项不属于合同生效的法律要件（ ）。","material":"","options":[{"key":"A","text":"主体合格"},{"key":"B","text":"双方签字"},{"key":"C","text":"内容合法"},{"key":"D","text":"意思表示真实"}],"answer":["B"],"explanation":"本题考查合同生效的要件。，，，。．.。合同的成立和生效是两个不同的概念，当事人达成合意，意味着合同成立；合同 符合法律规定的生效要件，才能获得法律的保护，才意味着合同的生效。 合同生效的法律要件主要包括：主体合格，内容合法，意思表示真实以及合同的 形式合法，选项A、C、D不符合题意。 双方签字仅仅是当事人达成合意的一种表现方式，故双方签字并不属于合同的生 效要件，选项B符合题意。 故本题选B选项。","id":"jichu-0257","bank":"jichu"},{"chapter":"刷章节母题 第三十五章 合同法律制度 共12题","point":"合同的效力","type":"multi","stem":"甲企业与乙企业签订了一份再生原料买卖合同，由乙企业向甲企业供货30吨，合同总价款20万元。双方依约全部履行完义务后，乙企业提供的再生原料被查出属于非法进口的洋垃圾。关于该合同的说法，错误的有（ ）。","material":"","options":[{"key":"A","text":"该合同无效，但既已履行，双方均无须返还"},{"key":"B","text":"该合同效力待定，但既已履行完毕，双方均无须返还"},{"key":"C","text":"该合同有效，且已履行完毕，甲企业与乙企业权利义务终止"},{"key":"D","text":"该合同无效，乙企业应归还甲企业货款并赔偿其因此受到的损失"},{"key":"E","text":"该合同属于可撤销合同，甲企业有权诉至法院要求撤销该合同"}],"answer":["A","B","C","E"],"explanation":"本题考查效力存在瑕疵的合同。《民法典》规定：违反法律、行政法规的强制性规定的合同，属于无效合同，因为乙企业提供的再生原料被查出属于非法进口的洋垃圾，所以判定为无效合同，选项A、B、C、E错误，选项D正确。故本题选ABCE选项。","id":"jichu-0258","bank":"jichu"},{"chapter":"刷章节母题 第三十五章 合同法律制度 共12题","point":"合同的订立、履行和终止","type":"single","stem":"下列情形中，属于要约的是（ ）。","material":"","options":[{"key":"A","text":"拍卖公告"},{"key":"B","text":"悬赏公告"},{"key":"C","text":"招标公告"},{"key":"D","text":"招股说明书"}],"answer":["B"],"explanation":"本题考查要约。（人要约是向要约人希望与其缔结合同的相对人发出的意思表示；要约只有得到受要约人的承诺，才能使合同成立，所以要约必须是向受要约人发出的。如果不能确定受要约人，则表明发出提议的人并没有选择相对人，所发出提议的目的是邀请不特定的人向自己发出要约，属于要约邀请，如一般商业广告等。但是，在有些情况下，受要约人也可以是不特定的，比如，商店中标明价格的商品销售、悬赏广告等，就是向不特定的人发出的要约，选项B正确。《民法典》第四百七十三条规定了多种典型的要约邀请形式，即拍卖公告、招标公告、招股说明书、债券募集办法、基金招募说明书、商业广告和宣传、寄送的价目表等，选项A、C、D错误。故本题选B选项。","id":"jichu-0259","bank":"jichu"},{"chapter":"刷章节母题 第三十五章 合同法律制度 共12题","point":"合同的订立、履行和终止","type":"single","stem":"甲公司与乙公司签订了一份食品买卖合同，双方约定甲公司先付款，付款前爆出乙公司食品违法使用添加剂的新闻，乙公司商誉尽失。此种情形下，甲公司可以行使（ ）。","material":"","options":[{"key":"A","text":"先履行抗辩权"},{"key":"B","text":"不安抗辩权"},{"key":"C","text":"先诉抗辩权"},{"key":"D","text":"同时履行抗辩权"}],"answer":["B"],"explanation":"本题考查不安抗辩权。双务合同中的抗辩权主要有以下几种：（1）同时履行抗辩权。同时履行抗辩权是指双务合同中当事人在没有约定先后履行顺序时，一方在对方未进行对等给付之前，有拒绝履行自己的合同义务的权利。（2）不安抗辩权。不安抗辩权是指在双务合同中有先给付义务的当事人，在有证据证明后给付人具有丧失或者可能丧失履行债务能力的情况时，可以中止自己先给付义务的履行。甲公司属于先履行义务的人，拥有不安抗辩权，且“爆出乙公司食品违法使用添加剂的新闻”，选项B正确。（3）先履行抗辩权。先履行抗辩权是指在双务合同中履行义务顺序在后的一方当事人，在履行义务顺序在先的一方当事人没有履行或不适当履行义务时，拒绝先履行一方请求其履行义务的权利。故本题选B选项。","id":"jichu-0260","bank":"jichu"},{"chapter":"刷章节母题 第三十五章 合同法律制度 共12题","point":"合同的担保和保全（ ）。","type":"multi","stem":"合同担保方式包括（ ）。，","material":"","options":[{"key":"A","text":"保证"},{"key":"B","text":"承诺"},{"key":"C","text":"定金"},{"key":"D","text":"抵押"},{"key":"E","text":"质押"}],"answer":["A","C","D","E"],"explanation":"本题考查合同的担保。（担保物权（抵押、质押和留置）都是合同担保的形式，除了这些物权担保之外，合同担保的形式还有保证及定金。 人故本题选ACDE选项。","id":"jichu-0261","bank":"jichu"},{"chapter":"刷章节母题 第三十五章 合同法律制度 共12题","point":"合同的担保和保全（ ）。","type":"single","stem":"关于债权人代位权的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"债权人代位权的行使必须通过诉讼程序，而且代位权范围以其债权为限主成"},{"key":"B","text":"债权人必须以债务人的名义行使代位权"},{"key":"C","text":"债权人代位权的行使必须取得债务人的同意"},{"key":"D","text":"代位权行使的费用必须由债权人自己承担"}],"answer":["A"],"explanation":"本题考查债权人的代位权。债权人的代位权是指当债务人怠于行使其对第三人的权利而危害债权实现时，债权人享有的以自己名义（选项B、C错误）代位行使债务人权利的权利。债权人代位权必须通过诉讼方式行使，代位权的行使范围以债权人的债权为限（选项A正确）。债权人行使代位权的必要费用，由债务人负担（选项D错误）。 故本题选A选项。","id":"jichu-0262","bank":"jichu"},{"chapter":"刷章节母题 第三十五章 合同法律制度 共12题","point":"合同的转让、变更和解除","type":"multi","stem":"下列关于合同的转让的表述正确的有（ ）。","material":"","options":[{"key":"A","text":"合同转让需经过另一方当事人的同意"},{"key":"B","text":"具有人身性质的债权不得转让"},{"key":"C","text":"当事人一方经对方同意，可以将自己在合同中的权利和义务一并转让给第三人"},{"key":"D","text":"当事人订立合同后合并的，由合并后的法人或者其他组织行使合同权利，履行合同义务"},{"key":"E","text":"债权人转让债权，未通知债务人的，该转让对受让人不发生效力"}],"answer":["B","C","D"],"explanation":"本题考查合同的转让。，合同转让要看是合同权利的转让还是合同义务的转让，如果是合同权利的转让仅通知对方当事人即可，如果是合同义务的转让则需要经过对方当事人的同意，选项A错误。债权人转让债权，未通知债务人的，该转让对债务人不发生效力，而非受让人，选项E错误。故本题选BCD选项。","id":"jichu-0263","bank":"jichu"},{"chapter":"刷章节母题 第三十五章 合同法律制度 共12题","point":"合同的转让、变更和解除","type":"single","stem":"关于合同解除权的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"解除权是一种形成权"},{"key":"B","text":"基于解除权解除合同需要经过对方当事人的同意"},{"key":"C","text":"约定解除和协议解除的法律性质不同"},{"key":"D","text":"解除权的行使是一种单方法律行为"}],"answer":["B"],"explanation":"本题考查合同的解除。，，，。解除权是指合同当事人可以依据法律规定或合同约定的条件解除合同的权利。选项A正确、选项B错误，解除权是一种形成权，即只要解除权人将解除合同的单方意思表示通知对方即可产生解除合同的效力，而不必经对方的同意。所以，基于解除权解除合同属于合同的单方解除。人约定解除是依事先约定的解除条件成就时，一方行使解除权；协议解除是事后协商一致解除合同，属于合同行为（双方行为)，选项C正确。行使解除权时只需通知对方，通知到达即合同解除（对方有异议可请求法院或仲裁机构确认），此为单方意思表示，选项D正确。故本题选B选项。","id":"jichu-0264","bank":"jichu"},{"chapter":"刷章节母题 第三十五章 合同法律制度 共12题","point":"违约责任","type":"single","stem":"甲与乙签订了一份电脑买卖合同，甲为卖方，乙为买方，同时，合同约定：甲将电脑发货给丙，因为乙与丙也签订了一份电脑买卖合同，乙为卖方，丙为买方。现因为甲发给丙的电脑存在质量问题引发纠纷，丙应向（ ）追究违约责任。","material":"","options":[{"key":"A","text":"甲或乙"},{"key":"B","text":"甲"},{"key":"C","text":"甲和乙"}],"answer":["A"],"explanation":"本题考查违约责任的概念。违约责任即违反合同的责任，是指合同当事人不履行或不适当履行合同义务所应承担的民事责任，且违约责任只在合同关系当事人之间产生，对于合同以外的第三人并不发生违约责任，所以丙应向与其签订合同的乙追究违约责任。故本题选A选项。","id":"jichu-0265","bank":"jichu"},{"chapter":"刷章节母题 第三十五章 合同法律制度 共12题","point":"违约责任","type":"multi","stem":"根据合同法律制度的规定，合同中的下列免责条款无效（ ）。","material":"","options":[{"key":"A","text":"一方以欺诈、胁迫的手段订立合同，并未损害国家利益的条款"},{"key":"B","text":"造成对方人身伤害的"},{"key":"C","text":"故意造成对方财产损失的"},{"key":"D","text":"重大过失造成对方财产损失的"},{"key":"E","text":"违反法律规定或社会公共利益的"}],"answer":["B","D","E"],"explanation":"本题考查违约的免责事由。免责条款是合同当事人在合同中约定的免除其在将来可能发生的违约责任的条款。合同中的下列免责条款无效：①造成对方人身损害的，选项B正确。②因故意或者重大过失造成对方财产损失的，选项C、D正确。当事人虽然可以根据合同自由原则约定免责条款，但是这种约定并不是可以任意进行的。既然免责条款是当事人就责任免除所达成的合意，所以它必须符合法律行为的有效条件的要求，而违反法律规定或社会公共利益的免责条款则不能发生法律效力，选项E正确。“欺诈和胁迫”行为属于可撤销合同，受欺诈方和受胁迫方有权请求人民法院或者仲裁机构予以撤销，撤销后就不具备合同的效力了，选项A错误。故本题选BCDE选项。","id":"jichu-0266","bank":"jichu"},{"chapter":"刷章节母题 第三十六章 公司法律制度 共16题","point":"公司和公司法概述","type":"single","stem":"在我国，关于公司法律特征的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"有的公司具备法人资格，有的公司不具备法人人格"},{"key":"B","text":"公司有独立的财产，公司对公司的财产享有法人财产权"},{"key":"C","text":"公司有自己的名称、组织机构和场所"},{"key":"D","text":"公司能够以自己的名义从事民商事活动并独立承担民事责任"}],"answer":["A"],"explanation":"本题考查公司的特征。公司的主要特征包括以下几方面：（1）公司具有法人人格（选项A错误）。公司具有民事权利能力和民事行为能力，为独立的法人，法律地位独立于股东、管理人员和职工；公司可以自已的名义对外从事法律行为，并承担相应的法律责任（选项D正确）；公司可拥有自己的财产（选项B正确)，并以其全部财产对自己的债务承担责任。（2）公司是营利法人。营利法人是以取得利润并分配给股东等出资人为目的成立的法人。（3）股东承担有限责任。公司有自己的名称、组织机构、住所（选项C正确)。故本题选A选项。","id":"jichu-0267","bank":"jichu"},{"chapter":"刷章节母题 第三十六章 公司法律制度 共16题","point":"公司和公司法概述","type":"multi","stem":"根据组织结构不同，公司可分为（ ）。","material":"","options":[{"key":"A","text":"无限公司"},{"key":"B","text":"两合公司"},{"key":
