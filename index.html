属于（ ）。","material":"","options":[{"key":"A","text":"各期产量年均分配法"},{"key":"B","text":"各期产量均匀增长分配法"},{"key":"C","text":"各期产量平均分配法"},{"key":"D","text":"各期产量抛物线形增长分配法"}],"answer":["D"],"explanation":"本题考查大量大批生产企业。 （1）各期产量年平均分配法，即把全年计划产量平均分配到各季、月。适用于对该产品需求比较稳定的情况。 （2）各期产量均匀增长分配法，即把全年产量均匀的安排到各季月。适用于对该产品需要不断增加的情况。 （3）各期产量抛物线形增长分配法，即将全年计划产量按照开始增长较快，以后增长慢的要求安排各月任务，使产量增长的曲线呈抛物线状。适用于新产品的开发。 根据题目关键信息“开始增长快，以后增长较慢”、“呈抛物线形状”，可知属于各期产量抛物线增长分配法。 故本题选 D 选项。","id":"gongshang-0129","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"将产量较大的产品，用“细水长流”的方式大致均匀地分配到各季、月生产，这种方法属于产品出产进度安排的哪种（ ）。","material":"","options":[{"key":"A","text":"大量大批生产企业"},{"key":"B","text":"成批轮番生产企业"},{"key":"C","text":"单件小批生产企业"},{"key":"D","text":"多件小批生产企业"}],"answer":["B"],"explanation":"本题考查成批轮番生产企业。 成批轮番生产企业通常使用方法如下： （1）将产量较大的产品，用“细水长流”的方式大致均匀地分配到各季、月生产； （2）产量较少的产品，用集中生产方式参照用户要求的交货期和产品结构工艺的相似程度及设备负荷情况，用集中生产方式安排当月生产； （3）安排老产品，要考虑新老产品的逐渐交替； （4）精密产品和一般产品、高档产品和低档产品也要合理搭配，以充分利用企业各种设备和生产能力，为均衡生产创造条件。 根据题目“细水长流”，可知属于成批轮番生产企业。 故本题选 B 选项。 ▎考点 生产作业计划概述★","id":"gongshang-0130","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"multi","stem":"生产作业计划包括的内容有（ ）。","material":"","options":[{"key":"A","text":"编制企业各个层次的作业计划"},{"key":"B","text":"编制生产准备计划"},{"key":"C","text":"计算负荷率，进行生产任务和生产能力之间的细致平衡"},{"key":"D","text":"日常生产的派工、生产、调度、执行情况的统计分析与控制"},{"key":"E","text":"对生产计划执行过程进行监督、检查、调度和调节"}],"answer":["A","B","C","D"],"explanation":"本题考查生产作业计划概述。 生产作业计划的内容有： （1）编制企业各个层次的作业计划； （2）编制生产准备计划； （3）计算负荷率，进行生产任务和生产能力之间的细致平衡； （4）日常生产的派工、生产、调度、执行情况的统计分析与控制。 对生产计划执行过程进行监督、检查、调度和调节属于生产调度的概念，选项 E 错误。 故本题选 ABCD 选项。","id":"gongshang-0131","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"协调企业日常生产活动的中心环节是（ ）。","material":"","options":[{"key":"A","text":"生产作业计划"},{"key":"B","text":"长期生产计划"},{"key":"C","text":"年度生产计划"},{"key":"D","text":"生产计划"}],"answer":["A"],"explanation":"本题考查生产作业计划的概念。 生产作业计划是企业年度生产计划的具体执行计划。它是协调企业日常生产活动的中心环节。 故本题选 A 选项。 ▎考点 期量标准★★","id":"gongshang-0132","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"作为生产企业的一种期量标准，节拍适合于（ ）生产类型的企业。","material":"","options":[{"key":"A","text":"单件"},{"key":"B","text":"小批"},{"key":"C","text":"成批轮番"},{"key":"D","text":"大批大量"}],"answer":["D"],"explanation":"本题考查期量标准。 期量标准是指为加工对象（零件、部件、产品等）在生产期限和生产数量方面规定的标准数据，是编制生产作业计划的重要依据。 （1）大批大量生产企业的期量标准有节拍或节奏、流水线的标准工作指示图表、在制品定额等； （2）成批轮番生产企业的期量标准有批量、生产周期、生产间隔期、生产提前期等； （3）单件小批生产企业的期量标准有生产周期、生产提前期等。 因此，节拍适合于大批大量生产企业。 故本题选 D 选项。","id":"gongshang-0133","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"multi","stem":"成批轮番生产企业和单件小批量生产企业的期量标准中，相同的有（ ）。","material":"","options":[{"key":"A","text":"生产间隔期"},{"key":"B","text":"在制品定额"},{"key":"C","text":"生产周期"},{"key":"D","text":"批量"},{"key":"E","text":"生产提前期"}],"answer":["C","E"],"explanation":"本题考查期量标准。 成批轮番生产企业的期量标准有： （1）批量； （2）生产周期； （3）生产间隔期； （4）生产提前期等。 单件小批生产企业的期量标准包括： （1）生产周期； （2）生产提前期等。 两者共同的期量标准应是生产周期和生产提前期。 故本题选 CE 选项。 ▎考点 生产作业计划的编制★★★★","id":"gongshang-0134","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"multi","stem":"安排车间生产任务的方法主要包括（ ）。","material":"","options":[{"key":"A","text":"连锁计算法"},{"key":"B","text":"成品定额法"},{"key":"C","text":"累计编号法"},{"key":"D","text":"延期法"},{"key":"E","text":"生产周期法"}],"answer":["A","C","E"],"explanation":"本题考查生产作业计划的编制。 安排车间生产任务的方法随车间的生产类型和生产组织形式而不同，主要有： （1）在制品定额法，又称连锁计算法，适合于大批大量生产类型企业的生产作业计划编制； （2）提前期法，又称累计编号法，适用于成批轮番生产类型企业的生产作业计划编制； （3）生产周期法，适用于单件小批生产类型企业的生产作业计划编制。 故本题选 ACE 选项。","id":"gongshang-0135","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"下列说法中，错误的是（ ）。","material":"","options":[{"key":"A","text":"在制品定额法也叫连锁计算法，适合大批大量生产类型企业的生产作业计划编制。这种方法是运用预先制定的在制品定额，按照工艺反顺序计算方法，调整车间的投入和出产数量，顺次确定各车间的生产任务"},{"key":"B","text":"提前期法又称累计编号法，适用于成批轮番生产类型企业的生产作业计划编制，是成批轮番生产作业计划重要的期量标准之一"},{"key":"C","text":"采用提前期法，对生产的产品应实行累计编号。在同一时间上，产品在某一生产环节上的累计号数，同成品出产累计号数相比，相差的号数就叫提前量"},{"key":"D","text":"提前期法适用于单件小批生产类型企业的生产作业计划编制，单件小批生产类型企业编制作业计划要解决的主要问题是各车间在生产时间上的联系，以保证如期交货"}],"answer":["D"],"explanation":"本题考查生产作业计划的编制。 提前期法又称累计编号法，适用于成批轮番生产企业的生产作业计划编制，选项 D 错误。 故本题选 D 选项。 ▎考点 生产控制的概念☆","id":"gongshang-0136","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"multi","stem":"生产控制的目的主要有（ ）。","material":"","options":[{"key":"A","text":"保证产品产量的最大化"},{"key":"B","text":"保证生产过程协调地进行"},{"key":"C","text":"保证以最少的人力完成生产任务"},{"key":"D","text":"保证以最少物力完成生产任务"},{"key":"E","text":"保证产品生产计划的科学编制"}],"answer":["B","C","D"],"explanation":"本题考查生产控制的概念。 生产控制既要保证生产过程协调地进行（选项 B 正确），又要保证以最少的人力和物力完成生产任务（选项 CD 正确），所以它是一种协调性和促进性的管理活动，是生产管理系统的一个重要组成部分。生产控制的目的是提高生产管理的有效性。 故本题选 BCD 选项。","id":"gongshang-0137","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"狭义的生产控制主要指的是对生产活动中（ ）的控制。","material":"","options":[{"key":"A","text":"生产进度"},{"key":"B","text":"库存"},{"key":"C","text":"成本"},{"key":"D","text":"质量"}],"answer":["A"],"explanation":"本题考查生产控制的概念。 狭义的生产控制主要指的是对生产活动中生产进度的控制，又称生产作业控制。 故本题选 A 选项。 ▎考点 生产控制的基本程序★★","id":"gongshang-0138","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"某企业参照自身的历史水平或者同行业的先进水平制定控制标准，这种制定标准的方法是（ ）。","material":"","options":[{"key":"A","text":"标准化法"},{"key":"B","text":"定额法"},{"key":"C","text":"分解法"},{"key":"D","text":"类比法"}],"answer":["D"],"explanation":"本题考查制定控制标准。 （1）标准化法，使用权威机构制定的标准，如国际标准、国家标准、部颁标准以及行业标准等，选项 A 错误。 （2）定额法，为生产过程中某些消耗规定标准，包括：劳动消耗定额、材料消耗定额，选项 B 错误。 （3）分解法，把企业层的指标按部门按产品层层分解为一个个小指标，作为每个生产单元的控制目标，选项 C 错误。 （4）类比法是指参照本企业的历史水平制定标准，也可参照同行业的先进水平制定标准。这种方法简单易行，标准也比较客观可行。 依据题干表述，该企业参照自身的历史水平或者同行业的先进水平制定生产标准正是采用了类比法，选项 D 正确。 故本题选 D 选项。 ▎考点 生产控制的方式★★","id":"gongshang-0139","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"下列生产控制方式中，属于前馈控制的是（ ）。","material":"","options":[{"key":"A","text":"事前控制方式"},{"key":"B","text":"事中控制方式"},{"key":"C","text":"事后控制方式"},{"key":"D","text":"全程控制方式"}],"answer":["A"],"explanation":"本题考查生产控制的方式。 选项 A 正确，事前控制方式属于前馈控制，控制的重点在事前计划与执行中有关影响因素的预测上。 选项 B 错误，事中控制方式是指通过获取作业现场信息并实时进行核算，与作业计划指标对比，发现偏差后迅速提出控制措施并实施，确保生产活动按计划顺利进行的一种方式。 选项 C 错误，事后控制方式属于反馈控制，控制的重点在于下期生产活动。 选项 D 错误，根据生产管理的特点，常把生产控制方式划分为事前控制方式、事中控制方式、事后控制方式，不包含全程控制方式。 故本题选 A 选项。","id":"gongshang-0140","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"通过对作业现场获取信息，实时进行作业核算，并把结果与作业计划相关指标进行对比分析，及时提出控制措施。这种生产控制方式是（ ）。","material":"","options":[{"key":"A","text":"事前控制方式"},{"key":"B","text":"事中控制方式"},{"key":"C","text":"事后控制方式"},{"key":"D","text":"全程控制方式"}],"answer":["B"],"explanation":"本题考查生产控制的方式。 根据生产管理的自身特点，常把生产控制方式划分为以下三种： （1）事后控制方式； （2）事中控制方式； （3）事前控制方式。 其中，事中控制方式是指通过获取作业现场信息并实时进行核算，与作业计划指标对比，发现偏差后迅速提出控制措施并实施，确保生产活动按计划顺利进行的一种方式。 故本题选 B 选项。 ▎考点 生产进度控制★","id":"gongshang-0141","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"生产进度控制的目的是（ ）。","material":"","options":[{"key":"A","text":"降低成本"},{"key":"B","text":"优化生产工艺"},{"key":"C","text":"准时出厂"},{"key":"D","text":"提高产品质量"}],"answer":["C"],"explanation":"本题考查生产进度控制的目的。 生产进度控制的目的在于保证产品能准时装配出厂。 故本题选 C 选项。","id":"gongshang-0142","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"在生产中对每道工序上的加工进度控制是（ ）。","material":"","options":[{"key":"A","text":"投入进度控制"},{"key":"B","text":"工序进度控制"},{"key":"C","text":"生产进度控制"},{"key":"D","text":"出产进度控制"}],"answer":["B"],"explanation":"本题考查生产进度控制的内容。 （1）投入进度控制是指在产品生产中对产成品的投入日期、数量，以及对原材料、零部件投入提前期的控制，选项 A 错误。 （2）工序进度控制是指在生产中对每道工序上的加工进度控制，选项 B 正确。 （3）生产进度控制的基本内容主要包括投入进度控制、工序进度控制和出产进度控制，不包含生产进度控制，选项 C 错误。 （4）出产进度控制是指对成品的出产日期、出产数量的控制，还包括对产品配套的控制和品种出产均衡性的控制，选项 D 错误。 故本题选 B 选项。 ▎考点 在制品控制★","id":"gongshang-0143","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"下列在制品中，（ ）是指已投入车间，正处于加工、装配、检验、等待或运输过程中的各种原材料、毛坯、外购件、半成品等。","material":"","options":[{"key":"A","text":"毛坯"},{"key":"B","text":"半成品"},{"key":"C","text":"入库前成品"},{"key":"D","text":"车间在制品"}],"answer":["D"],"explanation":"本题考查在制品的概念。 选项 A 错误，毛坯是指已由下料工序下料完毕，铸件清砂、铲毛刺、打底漆完毕，锻件去飞边整形完毕，并经检验合格办完入库手续的在制品。 选项 B 错误，半成品是指毛坯经机械加工成为零件，并已经检验合格办完入库手续的在制品。 选项 C 错误，入库前成品是指已完成加工任务但尚未办理入库手续的物品。 选项 D 正确，车间在制品是指已投入车间，正处于加工、装配、检验、等待或运输过程中的各种原材料、毛坯、外购件、半成品等。 故本题选 D 选项。","id":"gongshang-0144","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"multi","stem":"在制品控制的主要工作有（ ）。","material":"","options":[{"key":"A","text":"合理确定在制品管理任务和组织分工"},{"key":"B","text":"认真确定在制品定额，加强在制品控制，做好统计与核查工作"},{"key":"C","text":"建立健全的在制品的收、发与领用制度"},{"key":"D","text":"合理存放和妥善保管在制品"},{"key":"E","text":"仔细清理残缺在制品，减少在制品储备，防止浪费"}],"answer":["A","B","C","D"],"explanation":"本题考查在制品控制的工作内容。 在制品控制的工作内容： （1）合理确定在制品管理任务和组织分工； （2）认真确定在制品定额，加强在制品控制，做好统计与核查工作； （3）建立健全的在制品的收、发与领用制度； （4）合理存放和妥善保管在制品。 故本题选 ABCD 选项。 ▎考点 库存控制★★","id":"gongshang-0145","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"企业库存量过大会导致（ ）。","material":"","options":[{"key":"A","text":"流动资金被大量占用"},{"key":"B","text":"生产系统原材料供应不足"},{"key":"C","text":"服务水平下降"},{"key":"D","text":"订货次数增加"}],"answer":["A"],"explanation":"本题考查库存量过大产生的问题。 库存量过大所产生的问题包括： （1）增加仓库面积和库存保管费用，从而提高了产品成本； （2）占用大量的流动资金，选项 A 正确； （3）造成产成品和原材料的有形损耗和无形损耗； （4）造成企业资源的大量闲置； （5）掩盖了企业生产经营全过程的各种矛盾和问题，不利于企业提高管理水平。 生产系统原材料供应不足、服务水平下降和订货次数增加均属于库存量过小时产生的问题，选项 BCD 错误。 故本题选 A 选项。","id":"gongshang-0146","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"每次订购物料所需的联系、谈判等费用属于（ ）。","material":"","options":[{"key":"A","text":"仓储成本"},{"key":"B","text":"订货成本"},{"key":"C","text":"机会成本"},{"key":"D","text":"沉没成本"}],"answer":["B"],"explanation":"本题考查库存管理成本。 选项 A 错误，仓储成本是指维持库存物料本身所需花费，包括存储成本、搬运和盘点成本、保险和税收以及库存物料由于变质、陈旧、损坏、丢失等造成损失及购置库存物料所占用资金的利息等。 选项 B 正确，订货成本是指订购物料所需的联系、谈判、运输、检验等费用。订货成本与订购次数有关。 选项 C 错误，机会成本是指企业为从事某项经营活动而放弃另一项经营活动的机会，或利用一定资源获得某种收入时所放弃的另一种收入。 选项 D 错误，库存管理成本包括仓储成本、订货成本和机会成本，不包含沉没成本。 故本题选 B 选项。 ▎考点 生产调度★★","id":"gongshang-0147","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"生产调度工作的基本原则有（ ）。","material":"","options":[{"key":"A","text":"快速"},{"key":"B","text":"准确"},{"key":"C","text":"以生产进度计划为依据"},{"key":"D","text":"高度集中和统一"}],"answer":["C"],"explanation":"本题考查生产调度工作的基本要求。 生产调度工作必须以生产进度计划为依据，这是生产调度工作的基本原则。生产调度工作的灵活性必须服从计划的原则性，要围绕完成计划任务来开展调度业务。 故本题选 C 选项。","id":"gongshang-0148","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"multi","stem":"生产调度工作制度一般有（ ）。","material":"","options":[{"key":"A","text":"加班制度"},{"key":"B","text":"调度值班制度"},{"key":"C","text":"调度会议制度"},{"key":"D","text":"现场调度制度"},{"key":"E","text":"调度报告制度"}],"answer":["B","C","D","E"],"explanation":"本题考查调度工作制度。 调度工作制度一般有调度值班制度、调度报告制度、调度会议制度、现场调度制度、班前班后小组会议制度等。 故本题选 BCDE 选项。 ▎考点 物料需求计划、制造资源计划和企业资源计划★","id":"gongshang-0149","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"multi","stem":"物料需求计划（MRP）的主要依据包括（ ）。","material":"","options":[{"key":"A","text":"在制品生产计划"},{"key":"B","text":"库存处理信息"},{"key":"C","text":"物料清单"},{"key":"D","text":"主生产计划"},{"key":"E","text":"车间的生产作业计划"}],"answer":["B","C","D"],"explanation":"本题考查物料需求计划的结构。 物料需求计划的主要依据是主生产计划、物料清单和库存处理信息三大部分，它们是物料需求计划的主要输入信息。 故本题选 BCD 选项。","id":"gongshang-0150","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"生产控制模块是 ERP 的核心模块，该模块的主要内容不包括（ ）。","material":"","options":[{"key":"A","text":"主生产计划"},{"key":"B","text":"物料需求计划"},{"key":"C","text":"生产现场控制"},{"key":"D","text":"供应链管理系统"}],"answer":["D"],"explanation":"本题考查企业资源计划的内容。 生产控制模块是 ERP 的核心模块，这一模块的主要内容有：主生产计划、物料需求计划、能力需求计划、生产现场控制、制造标准等，选项 ABC 不符合题意。 故本题选 D 选项。 ▎考点 精益生产管理和丰田精益生产方式★★","id":"gongshang-0151","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"丰田生产方式最基本的理念是（ ）。","material":"","options":[{"key":"A","text":"以人为本"},{"key":"B","text":"从顾客的需求出发、杜绝浪费"},{"key":"C","text":"更短的生产周期"},{"key":"D","text":"零缺陷"}],"answer":["B"],"explanation":"本题考查丰田精益生产方式。 丰田精益生产方式最基本的理念就是从顾客的需求出发，杜绝浪费材料、人力、时间、空间、能量和运输等资源。 故本题选 B 选项。","id":"gongshang-0152","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"multi","stem":"丰田生产方式是一个包容了多种制造技术和管理技术的综合技术体系，其具体的思想和手段主要包括（ ）。","material":"","options":[{"key":"A","text":"准时制和自动化"},{"key":"B","text":"全面质量管理"},{"key":"C","text":"差异化"},{"key":"D","text":"标准化作业"},{"key":"E","text":"看板管理系统"}],"answer":["A","B","D","E"],"explanation":"本题考查丰田精益生产方式。 丰田式生产方式具体的思想和手段包括：（1）准时制和自动化；（2）标准化作业；（3）多技能作业员；（4）看板管理系统；（5）全员参与的现场改善活动；（6）全面质量管理。 故本题选 ABDE 选项。","id":"gongshang-0153","bank":"gongshang"},{"chapter":"","point":"物流的概念与功能","type":"multi","stem":"关于物流含义的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"物流活动创造价值"},{"key":"B","text":"物流服务是典型的实物形态的商品"},{"key":"C","text":"物流服务是非实物形态商品"},{"key":"D","text":"物流活动不可以创造空间价值"},{"key":"E","text":"物流活动是生产性服务活动"}],"answer":["A","C","E"],"explanation":"本题考查物流的概念。 物流包含以下三个方面的含义： ①物流服务是非实物形态的商品（选项C正确，选项B错误）； ②物流活动是生产性服务活动（选项E正确）； ③物流活动创造价值（选项A正确）。物流活动创造时间价值和空间价值（选项D错误）。 故本题选ACE选项。","id":"gongshang-0154","bank":"gongshang"},{"chapter":"","point":"物流的概念与功能","type":"single","stem":"在物流活动中的出现频率高于其他各项活动，并且能把“物”的实体运动的各个阶段连接成为连续的“流”，使物流活动顺利进行的活动是（ ）。","material":"","options":[{"key":"A","text":"配送"},{"key":"B","text":"包装"},{"key":"C","text":"装卸搬运"},{"key":"D","text":"流通加工"}],"answer":["C"],"explanation":"本题考查物流的基本功能。 物流的基本功能包括运输、储存、装卸搬运、包装、流通加工、配送和信息处理。 其中，装卸搬运，是指在物流活动中出现频率高、根据物流运输和保管需要而进行的作业。只有通过装卸搬运作业，“物”的实体运动的各个阶段才能连接成为连续的“流”，物流活动才可以顺利进行。 故本题选C选项。","id":"gongshang-0155","bank":"gongshang"},{"chapter":"","point":"物流管理的概念与内容","type":"single","stem":"下列不属于包装的功能的是（ ）。","material":"","options":[{"key":"A","text":"保护功能"},{"key":"B","text":"方便功能"},{"key":"C","text":"美化功能"},{"key":"D","text":"销售功能"}],"answer":["C"],"explanation":"本题考查包装的功能。 包装的功能主要有保护功能、方便功能和销售功能。 故本题选C选项。","id":"gongshang-0156","bank":"gongshang"},{"chapter":"","point":"物流管理的概念与内容","type":"multi","stem":"下列属于装卸搬运作业的特点的有（ ）。","material":"","options":[{"key":"A","text":"装卸搬运作业量大、对象复杂"},{"key":"B","text":"装卸搬运作业均衡"},{"key":"C","text":"装卸搬运作业对安全性要求高"},{"key":"D","text":"装卸搬运作业具有伴生性"},{"key":"E","text":"装卸搬运作业不具有起讫性"}],"answer":["A","C","D"],"explanation":"本题考查装卸搬运作业的特点。 装卸搬运作业的特点有： ①装卸搬运作业量大、对象复杂，选项A正确； ②装卸搬运作业不均衡，选项B错误； ③装卸搬运作业对安全性要求高，选项C正确； ④装卸搬运作业具有伴生性和起讫性，选项D正确，选项E错误。 故本题选ACD选项。","id":"gongshang-0157","bank":"gongshang"},{"chapter":"","point":"物流管理的发展","type":"multi","stem":"第三方物流模式的价值体现在（ ）。","material":"","options":[{"key":"A","text":"降低企业成本"},{"key":"B","text":"帮助企业提高顾客服务水平和质量"},{"key":"C","text":"规避风险"},{"key":"D","text":"供应链管理"},{"key":"E","text":"提升企业竞争力"}],"answer":["A","B","C","E"],"explanation":"本题考查第三方物流。 第三方物流模式的价值体现在以下几个方面： ①降低企业成本； ②提高企业顾客服务水平和质量； ③规避风险； ④提高企业竞争力； ⑤社会价值。 故本题选ABCE选项。","id":"gongshang-0158","bank":"gongshang"},{"chapter":"","point":"物流管理的发展","type":"multi","stem":"供应链管理的含义包括（ ）。","material":"","options":[{"key":"A","text":"以客户和最终用户为中心"},{"key":"B","text":"强调企业间的合作"},{"key":"C","text":"强调企业成本最小化"},{"key":"D","text":"是一种集成化的管理模式"},{"key":"E","text":"提升企业竞争力"}],"answer":["A","B","D"],"explanation":"本题考查供应链管理的含义 供应链管理的含义包括： ①供应链管理强调企业间的合作； ②供应链管理是一种集成化的管理模式； ③供应链管理以客户和最终用户为中心。 故本题选ABD选项。","id":"gongshang-0159","bank":"gongshang"},{"chapter":"","point":"仓储与仓储合理化☆","type":"multi","stem":"仓储的功能有（ ）。","material":"","options":[{"key":"A","text":"调节功能"},{"key":"B","text":"保管检验功能"},{"key":"C","text":"成本管理功能"},{"key":"D","text":"集散功能"},{"key":"E","text":"防范风险功能"}],"answer":["A","B","D","E"],"explanation":"本题考查仓储的功能。 仓储的功能有调节功能、保管检验功能、集散功能、客户服务功能、防范风险功能。 故本题选ABDE选项。","id":"gongshang-0160","bank":"gongshang"},{"chapter":"","point":"仓储与仓储合理化☆","type":"single","stem":"仓储合理化的评判标准不包括（ ）。","material":"","options":[{"key":"A","text":"仓储质量"},{"key":"B","text":"仓储数量"},{"key":"C","text":"仓储结构"},{"key":"D","text":"仓储环境"}],"answer":["D"],"explanation":"本题考查仓储合理化。 仓储合理化的评判标准有： ①仓储质量。②仓储数量。③储存时间。④仓储结构。⑤仓储费用。 故本题选D选项。","id":"gongshang-0161","bank":"gongshang"},{"chapter":"","point":"仓储设施与设备","type":"multi","stem":"仓库按使用范围的不同分类，可分为（ ）。","material":"","options":[{"key":"A","text":"普通仓库"},{"key":"B","text":"自用仓库"},{"key":"C","text":"营业仓库"},{"key":"D","text":"公用仓库"},{"key":"E","text":"气调仓库"}],"answer":["B","C","D"],"explanation":"本题考查仓储设施。 仓库按使用的范围不同可分为自用仓库、营业仓库、公用仓库，选项BCD正确。 普通仓库和气调仓库属于按保管条件不同分类，选项AE错误。 故本题选BCD选项。","id":"gongshang-0162","bank":"gongshang"},{"chapter":"","point":"仓储设施与设备","type":"single","stem":"某公司仓库B区为托盘存储区，每小时进出该库区的商品有1500件（单件尺寸基本相同），每个托盘的平均使用周期为10小时，托盘的标准装载量为18件，平均装载效率为80%，则需要（ ）个托盘。（计算结果保留整数）","material":"","options":[{"key":"A","text":"500"},{"key":"B","text":"1000"},{"key":"C","text":"1500"},{"key":"D","text":"2000"}],"answer":["C"],"explanation":"本题考查托盘需要量的计算。 仓库中储存商品所需托盘的数量主要根据单位时间进出商品的数量、托盘的平均使用周期、所使用托盘的标准装载量和平均装载效率来计算。 计算公式为：。 式中，N为托盘的需要数量（个）；D为单位时间进出商品的数量（件/小时）；T为托盘的平均使用周期（小时）；X为托盘的平均装载效率（%）；C为托盘的标准装载量（件/个）。 依据题干，。 故本题选C选项。","id":"gongshang-0163","bank":"gongshang"},{"chapter":"","point":"仓储作业流程管理","type":"multi","stem":"在商品入库作业管理中，货位分配的原则主要包括（ ）。","material":"","options":[{"key":"A","text":"质量第一原则"},{"key":"B","text":"商品同一性原则"},{"key":"C","text":"先进先出原则"},{"key":"D","text":"安全第一原则"},{"key":"E","text":"以周转率为基础的原则"}],"answer":["B","C","E"],"explanation":"本题考查货位分配原则。 货位分配的原则包括以下几条： ①以周转率为基础的原则，选项E正确； ②商品相关性原则； ③商品同一性原则，选项B正确； ④商品类似性原则； ⑤商品替代性原则； ⑥商品相容性原则； ⑦先进先出原则，选项C正确。 故本题选BCE选项。","id":"gongshang-0164","bank":"gongshang"},{"chapter":"","point":"仓储作业流程管理","type":"single","stem":"下列不属于商品储存维护方法的是（ ）。","material":"","options":[{"key":"A","text":"自然通风"},{"key":"B","text":"密封"},{"key":"C","text":"堆码"},{"key":"D","text":"除潮"}],"answer":["C"],"explanation":"本题考查商品储存维护方法。 商品储存维护方法包括自然通风、密封和除潮。 故本题选C选项。","id":"gongshang-0165","bank":"gongshang"},{"chapter":"","point":"库存管理","type":"single","stem":"按照库存的功能进行分类，为了满足补货或订货期间的平均需求而形成的必要库存为（ ）。","material":"","options":[{"key":"A","text":"周转库存"},{"key":"B","text":"安全库存"},{"key":"C","text":"在途库存"},{"key":"D","text":"季节性库存"}],"answer":["A"],"explanation":"本题考查库存的分类。 选项A正确，周转库存，又称周期库存，指为了满足补货/订货期间的平均需求而形成的必要库存。 选项B错误，安全库存，又称缓冲库存，指为了应对需求和补货提前期变动的不确定，防止产品制造与供应的意外情况而设立的一种库存。 选项C错误，在途库存，指从一个地方到另外一个地方，处于运输状态或为了运输的目的而暂时处于储存状态的物品。 选项D错误，调节库存，又称季节性库存，指为了避免生产供给或者消费需求的季节性波动而持有的库存。 故本题选A选项。","id":"gongshang-0166","bank":"gongshang"},{"chapter":"","point":"库存管理","type":"single","stem":"某小型化工厂每年需消耗某种原材料1600吨，单价是40000元/吨，单次订货费用为800元，每吨年保管费率为1%，则该种原材料的经济订货批量为（ ）。","material":"","options":[{"key":"A","text":"120"},{"key":"B","text":"80"},{"key":"C","text":"60"},{"key":"D","text":"100"}],"answer":["B"],"explanation":"本题考查订购点与订购批量的计算。 根据经济订购批量的计算公式： 代入相关数据得，经济订购批量 = √(2×1600×800 / 40000×1%) = 80（吨）。 故本题选B选项。","id":"gongshang-0167","bank":"gongshang"},{"chapter":"","point":"运输管理","type":"single","stem":"运输系统的构成要素中，连接不同运输方式，处于运输线路上的承担货物集散、运输业务办理、运输工具保养和维修的基地与场所指的是（ ）。","material":"","options":[{"key":"A","text":"运输节点"},{"key":"B","text":"管理机构"},{"key":"C","text":"运输工具"},{"key":"D","text":"运输线路"}],"answer":["A"],"explanation":"本题考查运输系统的构成要素。 运输系统的构成要素主要有运输线路、运输工具、运输参与者和运输节点。其中，运输节点是指运输系统网络中，连接不同运输方式，处于承担货物集散、运输业务办理、运输工具保养和维修的基地与场所。例如，公路运输线路上的停车场（库）、货运站，铁道运输线路上的编组站、货运站，水路运输线路上的航空运输线路上的空港，管道运输线路上的管道站等都属于运输节点。 故本题选A选项。","id":"gongshang-0168","bank":"gongshang"},{"chapter":"","point":"运输管理","type":"multi","stem":"不合理运输的主要形式包括（ ）。","material":"","options":[{"key":"A","text":"空驶运输"},{"key":"B","text":"迂回运输"},{"key":"C","text":"重复运输"},{"key":"D","text":"对向运输"},{"key":"E","text":"过近运输"}],"answer":["A","B","C"],"explanation":"本题考查不合理运输的形式。 商品的不合理运输是指在现有条件下可以达到的运输水平而未达到，从而造成了运力浪费、运输时间增加、运费超支等问题的运输形式。 不合形式主要有： ①空驶运输（选项A正确）； ②对流运输（选项D错误）； ③迂回运输（选项B正确）； ④重复运输（选项C正确）； ⑤倒流运输； ⑥过远运输（选项E错误）； ⑦运力选择不当； ⑧托运方式选择不当； ⑨无效运输。 故本题选ABC选项。","id":"gongshang-0169","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"配送中心按物流设施的归属不同可分为（ ）。","material":"","options":[{"key":"A","text":"自有型配送中心"},{"key":"B","text":"以制造商为运营主体的配送中心"},{"key":"C","text":"合作型配送中心"},{"key":"D","text":"公共型配送中心"},{"key":"E","text":"面向最终消费者的配送中心"}],"answer":["A","C","D"],"explanation":"本题考查配送中心的分类。 配送中心常见的有以下几种分类方式： ①按物流设施的归属不同可分为自有型配送中心、公共型配送中心和合作型配送中心，选项ACD正确； ②按配送中心的服务对象不同可分为面向最终中心、面向制造企业的配送中心和面向零售商的配送中心，选项BE错误； ③按运营主体不同可分为以制造商为运营主体的配送中心、以批发商为运营主体的配送中心、以零售商为运营主体和以仓储运输企业为运营主体的配送中心。 故本题选ACD选项。","id":"gongshang-0170","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"分区分拣的优点包括（ ）。","material":"","options":[{"key":"A","text":"分拣简单，出错率低，不需要进一步分类处理"},{"key":"B","text":"能降低总的分拣时间，每个人负责自己熟悉的部分"},{"key":"C","text":"可以缩短拣取商品时的行走搬运距离和时间，增加单位时间的拣货量"},{"key":"D","text":"能提高分拣效率，降低出错率"},{"key":"E","text":"拣取作业方法简单，接到订单可立即拣货，作业前置时间短，作业人员责任明确，拣货后不用再进行分类作业"}],"answer":["B","D"],"explanation":"本题考查配送中心的分拣策略。 分区分拣将订单按区段分解，能降低总的分拣时间，每个人负责自己熟悉的部分，能提高分拣效率，降低出错率，选项BD正确。 分拣简单，出错率低，不需要进一步分类处理属于单人分拣的优点，选项A错误。 可以缩短拣取商品时的行走搬运距离和时间，增加单位时间的拣货量属于批量分拣的优点，选项C错误。 拣取作业方法简单，接到订单可立即拣货，作业前置时间短，作业人员责任明确，拣货后不用再进行分类作业属于按订单分拣的优点，选项E错误。 故本题选BD选项。 ▎考点 技术创新的特点★★★","id":"gongshang-0171","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"下列关于技术创新的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"技术创新是一种技术行为，不是经济行为"},{"key":"B","text":"技术创新是高风险活动"},{"key":"C","text":"不同层次的技术创新所需的时间因其性质不同而异"},{"key":"D","text":"技术创新不具有外部性"},{"key":"E","text":"技术创新具有一体化与国际化特征"}],"answer":["B","C","E"],"explanation":"本题考查技术创新的特点。 技术创新的主要特点包括： （1）技术创新是一种经济行为，选项A错误； （2）技术创新是一项高风险活动，选项B正确； （3）技术创新时间具有的差异性，选项C正确； （4）技术创新具有外部性，选项D错误； （5）技术创新具有一体化与国际化特征，选项E正确。 故本题选BCE选项。","id":"gongshang-0172","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"企业技术创新分为发展性开发、应用性技术开发和基础性开发。其中，应用性开发一般需要（ ）年。","material":"","options":[{"key":"A","text":"1"},{"key":"B","text":"2-3"},{"key":"C","text":"5"},{"key":"D","text":"8-10"}],"answer":["C"],"explanation":"本题考查技术创新时间具有差异性。 不同层次的技术创新所需的时间因其性质不同而异。 据统计，大部分技术创新需要2～10年的时间，选项A错误。 工厂开发部门从事发展性开发属于短期创新，一般需要2～3年，选项B错误； 应用性技术开发属于中期创新，一般需要5年左右，如应用电子技术开发出电子手表以替换齿轮机械表就属于此类，选项C正确。 另外，基础性开发由于是技术原理的发现和新技术的发明，需要的时间可能更长，一般需要8～10年，选项D错误。 故本题选C选项。 ▎考点 技术创新的分类★","id":"gongshang-0173","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"根据技术创新的对象来划分，可将技术创新划分为（ ）。","material":"","options":[{"key":"A","text":"产品创新"},{"key":"B","text":"工艺创新"},{"key":"C","text":"原始创新"},{"key":"D","text":"集成创新"},{"key":"E","text":"引进、消化吸收再创新"}],"answer":["A","B"],"explanation":"本题考查技术创新的分类。 技术创新的分类有很多方法，比较有代表性的是基于技术创新对象、基于技术创新模式和基于技术创新的新颖程度。 其中按照创新对象不同，技术创新分为产品创新和工艺创新，选项AB正确。 原始创新、集成创新、引进、消化吸收再创新属于按照基于技术创新模式不同进行的划分，选项CDE错误。 故本题选AB选项。","id":"gongshang-0174","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"技术创新根据创新模式不同可划分为不同类型，其中，（ ）活动主要集中在基础科学和前沿技术领域。","material":"","options":[{"key":"A","text":"原始创新"},{"key":"B","text":"集成创新"},{"key":"C","text":"工艺创新"},{"key":"D","text":"引进、消化吸收再创新"}],"answer":["A"],"explanation":"本题考查技术创新的分类。 技术创新根据创新模式不同可分为：原始创新，集成创新和引进、消化吸收再创新。 原始创新活动主要集中在基础科学和前沿技术领域，选项A正确。 集成创新的主体是企业，所应用的技术都是已经存在的，其创新之处就在于对这些已经存在的单项技术按照自己的需要进行系统集成并创造出全新的产品或工艺，选项B错误。 引进、消化吸收再创新是最常见、最基本的创新形式，核心概念是利用各种引进的技术资源，在消化吸收的基础上完成重大创新，选项D错误。 工艺创新属于根据技术创新对象的不同分的类别，选项C错误 故本题选A选项。 ▎考点 技术创新模式★★★","id":"gongshang-0175","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"研究开发是创新构思的主要来源，这是（ ）创新模式的基本观点。","material":"","options":[{"key":"A","text":"系统集成和网络模型"},{"key":"B","text":"国家创新系统"},{"key":"C","text":"需求拉动"},{"key":"D","text":"技术推动"}],"answer":["D"],"explanation":"本题考查技术创新模式。 技术推动创新模式的基本观点是研究开发是创新构思的主要来源。技术推动或科技推动的创新是一种简单的线性关系，从基础研究开始，到应用研究，到研究开发，再到生产制造，直到商业化的新产品在市场上销售。 故本题选D选项。","id":"gongshang-0176","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"下列关于A—U过程创新模式的表述，错误的是（ ）。","material":"","options":[{"key":"A","text":"A—U过程创新模式是从产业层面进行探讨分析的"},{"key":"B","text":"在产业成长的前期阶段，产品创新比工艺创新活跃，创新成果更多"},{"key":"C","text":"在产业成长的后期阶段，工艺创新较产品创新有更丰富的成果"},{"key":"D","text":"不稳定阶段创新的重点是以质量和降低成本为目标的渐进性的工艺创新"}],"answer":["D"],"explanation":"本题考查A—U过程创新模式。 在A—U过程创新模式的不稳定阶段，创新的重点是进行新产品的设计与开发，寻找该技术可以开发能为消费者喜欢的有价值的产品，于是多种产品设计进入市场且频繁变动，选项D错误。 故本题选D选项。 ▎考点 技术创新战略的类型★★★","id":"gongshang-0177","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"技术创新战略按照企业所期望的技术竞争地位不同，可分为（ ）。","material":"","options":[{"key":"A","text":"自主创新战略、合作创新战略和模仿创新战略"},{"key":"B","text":"领先战略和跟随战略"},{"key":"C","text":"进攻型战略、防御型战略和切入型战略"},{"key":"D","text":"集成创新战略和原始创新战略"}],"answer":["B"],"explanation":"本题考查技术创新战略类型。 按照企业所期望的技术竞争地位，技术创新战略可分为领先战略和跟随战略，选项B正确； 按照企业行为方式的不同，技术创新战略可分为进攻型战略和防御型战略、切入型，选项C错误； 按照技术来源的不同分类，可以分为自主创新战略、合作创新战略和模仿创新战略，选项A错误。 技术创新战略类型不包含集成创新战略和原始创新战略，选项D错误。 故本题选B选项。","id":"gongshang-0178","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"根据企业行为方式的不同，可以将技术创新战略分为（ ）。","material":"","options":[{"key":"A","text":"进攻型战略、防御型战略和切入型战略"},{"key":"B","text":"自主创新战略、模仿创新战略和合作创新战略"},{"key":"C","text":"领先战略和跟随战略"},{"key":"D","text":"自主创新战略、领先战略和切入型战略"}],"answer":["A"],"explanation":"本题考查技术创新战略类型。 根据企业行为方式的不同，可以将技术创新战略分为进攻型战略、防御型战略和切入型战略，选项A正确。 根据企业所期望的技术竞争地位的不同，可将企业技术创新战略分为领先战略和跟随战略，选项C错误。 根据技术来源的不同，可将企业技术创新战略分为自主创新战略、模仿创新战略和合作创新战略，选项BD错误。 故本题选A选项。 ▎考点 技术创新战略的管理★★★","id":"gongshang-0179","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"下列关于领先战略与跟随战略的表述，正确的有（ ）。","material":"","options":[{"key":"A","text":"领先战略的技术来源以自主研发为主"},{"key":"B","text":"跟随战略的技术来源以模仿、引进为主，其核心技术一般不是自行开发的"},{"key":"C","text":"领先战略技术开发的重点主要是对产品基本原理、功能的开发，因此开发重心处于技术链的前端"},{"key":"D","text":"领先战略要在大市场中开发细分市场或挤占他人市场"},{"key":"E","text":"跟随战略的投资重点偏向于生产、销售环节，研究开发环节相对来说较少"}],"answer":["A","B","C","E"],"explanation":"本题考查两种基本战略的基本特征。 （1）领先战略要求企业必须率先开发市场，一般是要开拓一个全新的市场； （2）跟随战略则在领先者已开拓的大市场中开发细分市场或挤占他人市场，选项D错误。 故本题选ABCE选项。","id":"gongshang-0180","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"世界知识产权组织界定的知识产权包括（ ）。","material":"","options":[{"key":"A","text":"关于集成电路布图设计的权利"},{"key":"B","text":"关于未披露信息的权利"},{"key":"C","text":"关于科学发现的权利"},{"key":"D","text":"关于工业品外观设计的权利"},{"key":"E","text":"关于文学、艺术和科学作品的权利"}],"answer":["C","D","E"],"explanation":"本题考查知识产权的类型。 世界知识产权组织把知识产权界定为： （1）关于文学、艺术和科学作品的权利，选项E正确； （2）关于表演艺术家的表演以及唱片和广播节目的权利； （3）关于人类一切活动领域的发明的权利； （4）关于科学发现的权利，选项C正确； （5）关于工业品外观设计的权利，选项D正确； （6）关于商标、服务标记以及商业名称和标志的权利； （7）关于制止不正当竞争的权利； （8）在工业、科学、文学艺术领域内由于智力创造活动而产生的一切其他权利。 关于集成电路布图设计的权利和关于未披露信息的权利属于世界贸易组织《与贸易有关的知识产权协定》对知识产权类型进行的列举内容，选项AB错误。 故本题选CDE选项。 ▎考点 技术创新决策的评估方法★★★","id":"gongshang-0181","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"下列属于技术创新决策的定性评估方法的有（ ）。","material":"","options":[{"key":"A","text":"折现现金流量法"},{"key":"B","text":"轮廓图法"},{"key":"C","text":"风险分析法"},{"key":"D","text":"检查清单法"},{"key":"E","text":"评分法"}],"answer":["B","D","E"],"explanation":"本题考查定性评估方法。 技术创新决策的定性评估方法包括轮廓图法、检查清单法、评分法、动态排序列表法，选项BDE正确。 折现现金流量法和风险分析法属于定量评估方法，选项AC错误。 故本题选BDE选项。","id":"gongshang-0182","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"用矩阵分析技术组合时采用的维度包括（ ）。","material":"","options":[{"key":"A","text":"技术先进性"},{"key":"B","text":"技术重要性"},{"key":"C","text":"技术复杂性"},{"key":"D","text":"技术相对竞争地位"},{"key":"E","text":"技术兼容性"}],"answer":["B","D"],"explanation":"本题考查项目组合评估。 分析技术组合，对企业的每一项重要技术从两个维度进行分析，（1）第一个维度代表某一具体技术对行业发展的重要性；（2）另一个维度表示企业在此技术上的投资和相对竞争地位。 故本题选BD选项。 ▎考点 企业技术创新的内部组织模式★","id":"gongshang-0183","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"下列有关内企业家的表述，正确的是（ ）。","material":"","options":[{"key":"A","text":"结构较复杂"},{"key":"B","text":"活动局限在企业内部"},{"key":"C","text":"其行为不必征得企业的认同和许可"},{"key":"D","text":"可自由选择自己认为有价值的机会"}],"answer":["B"],"explanation":"本题考查内企业。 选项A错误，内企业是结构最简单、行动最灵活的创新组织。 选项B正确，选项D错误，由内企业家创建的企业称为内企业，内企业家与企业家的根本不同在于，内企业家的活动局限在企业内部，其行动受到企业的规定、政策和制度以及其他因素的限制。 选项C错误，内企业指企业为了鼓励创新，允许自己的员工在一定限度的时间内离开本岗位工作，从事自己感兴趣的创新活动，并且可以利用企业的现有条件，如资金、设备等。 故本题选B选项。","id":"gongshang-0184","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"技术创新小组的优点有（ ）。","material":"","options":[{"key":"A","text":"具有更多的自由意识"},{"key":"B","text":"个人决策变为小组成员共同决策"},{"key":"C","text":"淡化了纵向和横向的直线权力制"},{"key":"D","text":"更容易具有认同感、归属感、成就感"},{"key":"E","text":"技术创新小组成人员多，工作效率高"}],"answer":["A","B","C","D"],"explanation":"本题考查技术创新小组。 技术创新小组的优点： 淡化了纵向和横向的直线权力制（选项C正确）、个人决策变为小组成员共同决策（选项B正确），减少由纵向信息交流所产生的等级影响和横向信息交流障碍导致部门之间的矛盾，小组接近\"自由人联合体\"更容易具有认同感、归属感、成就感（选项D正确），具有更多的自由意识（选项A正确）。 技术创新小组是针对复杂的技术创新项目中的技术难题或较简单小型的技术项目而成立的，组成人员少，工作效率高（选项E错误）。 故本题选ABCD选项。 ▎考点 企业技术创新的外部组织模式★★★","id":"gongshang-0185","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"企业技术创新的外部组织模式有（ ）。","material":"","options":[{"key":"A","text":"产学研合作模式"},{"key":"B","text":"企业技术中心"},{"key":"C","text":"企业—政府模式"},{"key":"D","text":"技术创新小组"},{"key":"E","text":"企业联盟"}],"answer":["A","C","E"],"explanation":"本题考查企业技术创新的外部组织模式。 企业技术创新的外部组织模式包括产学研合作模式、企业—政府模式和企业联盟，选项ACE正确。 企业技术中心和技术创新小组属于企业技术创新的内部组织模式，选项BD错误。 故本题选ACE选项。","id":"gongshang-0186","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"企业联盟的组织运行模式主要有（ ）。","material":"","options":[{"key":"A","text":"事业部模式"},{"key":"B","text":"星形模式"},{"key":"C","text":"直线模式"},{"key":"D","text":"平行模式"},{"key":"E","text":"联邦模式"}],"answer":["B","D","E"],"explanation":"本题考查企业联盟。 企业联盟的组织运行模式有星形模式、平行模式、联邦模式。 故本题选BDE选项。 ▎考点 企业研发管理★★★","id":"gongshang-0187","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"研究与发展（R&D）和开发研究的主要类型包括基础研究、（ ）。","material":"","options":[{"key":"A","text":"理论研究"},{"key":"B","text":"应用研究"},{"key":"C","text":"市场研究"},{"key":"D","text":"高端研究"}],"answer":["B"],"explanation":"本题考查研发的主要类型。 国际上通常把研究与发展分为三类： （1）基础研究，也称为纯理论研究； （2）应用研究； （3）开发研究，也称为试验研究开发。 故本题选B选项。","id":"gongshang-0188","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"企业研发的模式有（ ）。","material":"","options":[{"key":"A","text":"自主研发"},{"key":"B","text":"合作研发"},{"key":"C","text":"委托研发"},{"key":"D","text":"应用研发"},{"key":"E","text":"基础研发"}],"answer":["A","B","C"],"explanation":"本题考查企业研发的模式。 企业研发的模式有：自主研发、合作研发、委托研发。 故本题选ABC选项。 ▎考点 管理创新概述★★","id":"gongshang-0189","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"管理创新的特点有（ ）。","material":"","options":[{"key":"A","text":"全员性"},{"key":"B","text":"虚拟性"},{"key":"C","text":"风险性"},{"key":"D","text":"基础性"},{"key":"E","text":"动态性"}],"answer":["A","C","D","E"],"explanation":"本题考查管理创新的特点。 管理创新具有全员性、风险性、基础性、动态性、系统性。 故本题选ACDE选项。","id":"gongshang-0190","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"（ ）是管理创新的主体，其利用在管理中的优势地位，对旧的均衡体系进行\"创造性的破坏\"。","material":"","options":[{"key":"A","text":"企业家"},{"key":"B","text":"管理者"},{"key":"C","text":"科学家"},{"key":"D","text":"工程师"}],"answer":["A"],"explanation":"本题考查管理创新的主体。 企业家是指从事企业经营管理活动，并有管理支配能力的高级管理人员。企业家利用其管理优势以及本身具有的特殊地位和素质，在管理创新过程中扮演着极为重要的角色。 创新理论的创始人熊彼特认为，管理创新是企业家的重要职能，企业家是对生产要素进行新的组合、建立新的生产函数的人，因而企业家必须是管理创新的主体。 企业家的贡献在于对旧的均衡体系进行\"创造性的破坏\"和跨越原有范围的开 拓创新。 故本题选A选项。 ▎考点 管理创新的动因★★★","id":"gongshang-0191","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"下列因素中，属于管理创新外部动因的是（ ）。","material":"","options":[{"key":"A","text":"环境污染"},{"key":"B","text":"自我价值实现"},{"key":"C","text":"经济性动机"},{"key":"D","text":"责任感"}],"answer":["A"],"explanation":"本题考查管理创新的动因。 管理创新的外部动因包括：社会文化环境的变迁、经济的发展变化、自然条件的约束、科学技术的发展，选项A正确。 管理创新的内部动因包括：自我价值实现、责任感、经济性动机，选项BCD错误。 故本题选A选项。 ▎考点 管理创新的主要领域★","id":"gongshang-0192","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"（ ）是管理创新的灵魂和基石。","material":"","options":[{"key":"A","text":"管理理念创新"},{"key":"B","text":"管理组织创新"},{"key":"C","text":"管理方式方法创新"},{"key":"D","text":"管理制度创新"}],"answer":["A"],"explanation":"本题考查管理创新的主要领域。 管理理念创新是企业进行管理创新的灵魂和基石。 故本题选A选项。","id":"gongshang-0193","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"（ ）是管理创新的最高层次，是管理创新实现的根本保证。","material":"","options":[{"key":"A","text":"管理理念创新"},{"key":"B","text":"管理组织创新"},{"key":"C","text":"管理方式方法创新"},{"key":"D","text":"管理制度创新"}],"answer":["D"],"explanation":"本题考查管理创新的主要领域。 管理制度创新把管理理念创新、管理组织创新、管理方式方法创新活动制度化、规范化，同时又具有引导管理理念创新、管理组织创新、管理方式方法创新的功效。它是管理创新的最高层次，是管理创新实现的根本保证。 故本题选D选项。 ▎考点 人力资源规划概述★★★","id":"gongshang-0194","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"某企业进行人力资源需求与供给预测。通过统计研究发现，销售额每增加 500 万元，需增加管理人员、销售人员和客服人员共 20 人。新增人员中，管理人员、销售人员和客服人员的比例是 2:7:1。该企业预计 2017 年销售额将比 2016 年销售额增加 1000 万元。根据人力资源需求与供给情况，该企业制定了总体规划和人员补充计划。该企业制定人员补充计划主要应考虑（ ）。","material":"","options":[{"key":"A","text":"补充人员的数量"},{"key":"B","text":"加强岗位轮换"},{"key":"C","text":"员工知识技能的改善"},{"key":"D","text":"补充人员的类型"},{"key":"E","text":"增加人力资源供给"}],"answer":["A","D"],"explanation":"本题考查人力资源规划的类别和内容。 人员补充计划的目标是明确补充人员的数量、类型、层次、优化人员结构等，选项 AD 正确。 加强岗位轮换是人员使用计划的目标，选项 B 错误。 员工知识技能的改善是人员培训开发计划的目标，选项 C 错误。 增加人力资源供给是薪酬激励计划的目标，选项 E 错误。 故本题选 AD 选项。","id":"gongshang-0195","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"下列属于企业人员补充计划的目标有（ ）。","material":"","options":[{"key":"A","text":"明确补充人员的数量"},{"key":"B","text":"优化人员结构"},{"key":"C","text":"提高绩效"},{"key":"D","text":"确定后备人员数量"},{"key":"E","text":"灵活就业"}],"answer":["A","B"],"explanation":"本题考查人力资源规划的类别和内容。 人员补充计划的目标包括：明确补充人员数量、类型、层次，优化人员结构等，选项 AB 正确。 提高绩效属于人员培训开发计划的目标，选项 C 错误； 确定后备人员数量属于人员接续升迁计划的目标，选项 D 错误 人力资源规划的内容不包含灵活就业，选项 E 错误。 故本题选 AB 选项。 ▎考点 人力资源规划的制定程序★","id":"gongshang-0196","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"企业内部信息不包括（ ）。","material":"","options":[{"key":"A","text":"劳动力市场供求状况"},{"key":"B","text":"企业发展战略"},{"key":"C","text":"经营计划"},{"key":"D","text":"人力资源现状"}],"answer":["A"],"explanation":"本题考查收集信息，分析企业经营战略对人力资源的要求。 人力资源信息可以分为企业内部信息和外部环境信息两大类，其中企业内部信息包括企业发展战略（选项 B 不符合题意）、经营计划（选项 C 不符合题意）、人力资源现状（选项 D 不符合题意）（包括员工数量和构成、员工使用情况、教育培训情况、离职率和流动性等）。 劳动力市场供求状况属于企业外部环境信息（选项 A 符合题意） 故本题选 A 选项。","id":"gongshang-0197","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"制定人力资源总体规划主要体现在（ ）。","material":"","options":[{"key":"A","text":"数量规划"},{"key":"B","text":"质量规划"},{"key":"C","text":"部门规划"},{"key":"D","text":"职责规划"},{"key":"E","text":"结构规划"}],"answer":["A","B","E"],"explanation":"本题考查人力资源规划的制定程序。 制定人力资源总体规划主要体现在三个方面：人力资源数量规划、人力资源质量规划和人力资源结构规划。 故本题选 ABE 选项。 ▎考点 人力资源需求与供给预测★★★","id":"gongshang-0198","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"在进行企业人力资源需求预测时，应充分考虑的影响因素有（ ）。","material":"","options":[{"key":"A","text":"企业未来某个时期的生产经营任务及其对人力资源的需求"},{"key":"B","text":"企业人力资源需求预测的方法"},{"key":"C","text":"企业的财务资源对人力资源需求的约束"},{"key":"D","text":"企业生产技术水平的提高和组织管理方式的变革对人力资源需求的影响"},{"key":"E","text":"企业提高产品或服务质量或进入新市场的决策对人力资源需求的影响"}],"answer":["A","C","D","E"],"explanation":"本题考查人力资源需求预测。 在进行企业人力资源需求预测时，应充分考虑以下影响因素： （1）企业未来某个时期的生产经营任务及其对人力资源的需求，选项 A 正确； （2）预期的员工流动率及由此引起的职位空缺规模； （3）企业生产技术水平的提高和组织管理方式的变革对人力资源需求的影响，选项 D 正确； （4）企业提高产品或服务质量或进入新市场的决策对人力资源需求的影响，选项 E 正确； （5）企业的财务资源对人力资源需求的约束，选项 C 正确。 故本题选 ACDE 选项。","id":"gongshang-0199","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"最常用的企业人力资源内部供给预测的方法有（ ）。","material":"","options":[{"key":"A","text":"人员核查法"},{"key":"B","text":"一元回归分析法"},{"key":"C","text":"马尔可夫模型法"},{"key":"D","text":"管理人员判断法"},{"key":"E","text":"德尔菲法"}],"answer":["A","C"],"explanation":"本题考查企业人力资源内部供给预测。 企业人力资源供给预测包括内部供给预测和外部供给预测两方面。常用的内部供给预测方法有： （1）人员核查法； （2）马尔可夫模型法。 故本题选 AC 选项。 ▎考点 绩效的含义与特点★","id":"gongshang-0200","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"影响员工绩效的客观因素是（ ）。","material":"","options":[{"key":"A","text":"员工受到的激励"},{"key":"B","text":"员工的能力"},{"key":"C","text":"员工的知识"},{"key":"D","text":"员工的工作意愿"}],"answer":["A"],"explanation":"本题考查绩效的特点。 影响绩效的因素主要包括员工个人所拥有的与工作相关的知识与能力，受到的激励与所处的环境等。其中，知识与能力是主观因素，激励与环境是客观因素。 故本题选 A 选项。","id":"gongshang-0201","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"下列属于影响绩效的主观因素的有（ ）。","material":"","options":[{"key":"A","text":"激励"},{"key":"B","text":"环境"},{"key":"C","text":"政策"},{"key":"D","text":"知识"},{"key":"E","text":"能力"}],"answer":["D","E"],"explanation":"本题考查绩效的特点。 影响绩效的因素主要包括员工个人所拥有的与工作相关的知识与能力，受到的激励与所处的环境等。其中，知识与能力是主观因素，激励与环境是客观因素。 故本题选 DE 选项。 ▎考点 绩效考核的含义与功能★★","id":"gongshang-0202","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"正确理解绩效考核的含义，应注意把握的内容有（ ）。","material":"","options":[{"key":"A","text":"绩效考核是一项管理活动，是由制定绩效目标、围绕绩效目标的经常性沟通、绩效评价和绩效反馈等环节所构成的系统过程"},{"key":"B","text":"绩效考核对企业的运行、对员工的工作具有监控的作用和功能"},{"key":"C","text":"绩效考核的目的是促进员工个人、所在部门和整个企业整体绩效的提高"},{"key":"D","text":"绩效考核是人力资源管理的一项重要职能，是组织中所有管理者的责任"},{"key":"E","text":"绩效考核必须有一个事先确定的时间周期，必须借助一定的方法"}],"answer":["A","C","D","E"],"explanation":"本题考查绩效考核的含义。 绩效考核对企业的运行、对员工的工作具有监控的作用和功能体现的是绩效考核的监控功能，而不是绩效考核应注意把握的内容，选项 B 错误。 故本题选 ACDE 选项。","id":"gongshang-0203","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"下列不属于绩效考核的功能的是（ ）。","material":"","options":[{"key":"A","text":"管理功能"},{"key":"B","text":"心理援助功能"},{"key":"C","text":"监控功能"},{"key":"D","text":"增进绩效功能"}],"answer":["B"],"explanation":"本题考查绩效考核的功能。 作为人力资源管理的一项重要职能，绩效考核的功能包括：（1）管理功能；（2）激励功能；（3）学习和导向功能；（4）沟通功能；（5）监控功能；（6）增进绩效功能。 心理援助功能不属于绩效考核功能，选项 B 符合题意。 故本题选 B 选项。 ▎考点 绩效考核的内容和标准★★★","id":"gongshang-0204","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"企业对于员工绩效考核的项目主要包括（ ）。","material":"","options":[{"key":"A","text":"工作目标"},{"key":"B","text":"工作业绩"},{"key":"C","text":"工作职能"},{"key":"D","text":"工作能力"},{"key":"E","text":"工作态度"}],"answer":["B","D","E"],"explanation":"本题考查绩效考核内容。 绩效考核内容是对企业员工工作任务的界定，它明确地回答了企业员工在绩效考核期内应该完成什么样的工作，具体包括绩效考核项目和绩效考核指标两个部分。其中，绩效考核项目是指绩效考核的维度，即从哪些方面对企业员工进行考核，它指明了绩效考核内容的范围。当前企业对员工的绩效考核主要包括：（1）工作业绩；（2）工作能力；（3）工作态度三个考核项目。 故本题选 BDE 选项。","id":"gongshang-0205","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"下列符合绩效考核设计标准的有（ ）。","material":"","options":[{"key":"A","text":"科学、主观原则"},{"key":"B","text":"明确、具体、可衡量"},{"key":"C","text":"必须有明确的时间期限"},{"key":"D","text":"对企业成员具有可变性"},{"key":"E","text":"既有挑战性，又有实现的可能性"}],"answer":["B","C","D","E"],"explanation":"本题考查绩效考核的标准。 为了确定科学合理的绩效考核标准，必须充分注意以下三个问题： （1）绩效考核标准必须明确、具体、清楚，不能含混不清，应尽量使用量化标准（选项 BC 正确）。 （2）绩效考核标准必须适度，一方面要有一定的难度；另一方面员工经过努力又可以达到（选项 E 正确）。 （3）绩效考核标准必须具有可变性（选项 D 正确）：一方面，对于同一个员工来说，在不同的绩效考核周期，随着外部环境的变化，绩效考核标准也要有相应的变化；另一方面，对于不同的员工来说，即使在同样的绩效考核周期，由于工作环境的变化，绩效考核标准也可能发生相应的变化。 绩效考核设计通常强调科学、客观原则，而不是主观原则（选项 A 错误）。 故本题选 BCDE 选项。 ▎考点 绩效考核的步骤与方法★★★","id":"gongshang-0206","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"绩效考核的步骤包括（ ）。","material":"","options":[{"key":"A","text":"绩效考核的准备阶段"},{"key":"B","text":"绩效考核的实施阶段"},{"key":"C","text":"绩效考核结果的反馈"},{"key":"D","text":"绩效考核结果的运用"},{"key":"E","text":"绩效考核结果的修正"}],"answer":["A","B","C","D"],"explanation":"本题考查绩效考核的步骤。 绩效考核的步骤包括：绩效考核的准备阶段、绩效考核的实施阶段、绩效考核结果的反馈、绩效考核结果的运用。 故本题选 ABCD 选项。","id":"gongshang-0207","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"常用的绩效考核方法主要有（ ）。","material":"","options":[{"key":"A","text":"职位等级法"},{"key":"B","text":"民主评议法"},{"key":"C","text":"书面鉴定法"},{"key":"D","text":"比较法"},{"key":"E","text":"关键事件法"}],"answer":["B","C","D","E"],"explanation":"本题考查绩效考核的方法。 常用的绩效考核方法主要有：民主评议法、书面鉴定法、关键事件法、比较法、量表法。 故本题选 BCDE 选项。 ▎考点 薪酬的概念、构成与功能★★","id":"gongshang-0208","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"企业根据员工、团队或者企业自身的绩效而支付给员工的具有变动性质的薪酬属于（ ）。","material":"","options":[{"key":"A","text":"补偿薪酬"},{"key":"B","text":"激励薪酬"},{"key":"C","text":"福利薪酬"},{"key":"D","text":"基本薪酬"}],"answer":["B"],"explanation":"本题考查薪酬的概念与构成。 在企业中，员工的薪酬一般由基本薪酬、激励薪酬、间接薪酬三部分构成，不包含补偿薪酬和福利薪酬，选项 AC 错误。 激励薪酬是指企业根据员工、团队或者企业自身的绩效而支付给员工的具有变动性质的薪酬，选项 B 正确。 基本薪酬，指企业根据员工所承担的工作或者所具备的技能而支付给员工的比较稳定的薪酬，选项 D 错误。 故本题选 B 选项。","id":"gongshang-0209","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"从员工的角度，薪酬具有的功能有（ ）。","material":"","options":[{"key":"A","text":"增值功能"},{"key":"B","text":"保障功能"},{"key":"C","text":"激励功能"},{"key":"D","text":"调节功能"},{"key":"E","text":"改善用人活动功效的功能"}],"answer":["B","C","D"],"explanation":"本题考查薪酬的功能。 薪酬对员工的功能有：保障功能、激励功能和调节功能，选项 BCD 正确。 增值功能和改善用人活动功效的功能属于薪酬对企业的功能，选项 AE 错误。 故本题选 BCD 选项。 ▎考点 薪酬管理的含义及其影响因素★","id":"gongshang-0210","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"影响企业薪酬管理的外部因素主要有（ ）。","material":"","options":[{"key":"A","text":"劳动力和人才市场"},{"key":"B","text":"国家有关的法律法规"},{"key":"C","text":"企业所在地的生活水平"},{"key":"D","text":"企业的经营战略"},{"key":"E","text":"企业的经营状况"}],"answer":["A","B","C"],"explanation":"本题考查影响薪酬管理的主要因素。 影响企业薪酬管理的因素主要有三大类： （1）企业外部因素； （2）企业内部因素； （3）员工个人因素。 企业外部因素主要包括： （1）法律法规（选项 B 正确）； （2）物价水平（选项 C 正确）； （3）劳动力市场的供求状况（选项 A 正确）； （4）其他企业的薪酬状况。 企业的经营战略和企业的经营状况属于影响企业薪酬管理的内部因素（选项 DE 错误）。 故本题选 ABC 选项。","id":"gongshang-0211","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"影响企业薪酬管理的主要因素不包括（ ）。","material":"","options":[{"key":"A","text":"企业外部因素"},{"key":"B","text":"企业内部因素"},{"key":"C","text":"员工个人因素"},{"key":"D","text":"市场因素"}],"answer":["D"],"explanation":"本题考查影响薪酬管理的主要因素。 影响薪酬管理的因素主要有三类，即企业外部因素、企业内部因素和员工个人因素。 故本题选 D 选项。 ▎考点 企业薪酬制度设计的原则和流程★★★","id":"gongshang-0212","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"企业在进行薪酬制度设计时，应该遵循的原则主要有（ ）。","material":"","options":[{"key":"A","text":"公平原则"},{"key":"B","text":"效率优先原则"},{"key":"C","text":"竞争原则"},{"key":"D","text":"量力而行原则"},{"key":"E","text":"合法原则"}],"answer":["A","C","D","E"],"explanation":"本题考查企业薪酬制度设计的原则。 企业在进行薪酬制度设计时应遵循以下原则：（1）公平原则；（2）竞争原则；（3）激励原则；（4）量力而行原则；（5）合法原则。 故本题选 ACDE 选项。","id":"gongshang-0213","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"下列不属于企业薪酬设计的流程的是（ ）。","material":"","options":[{"key":"A","text":"明确现状和需求"},{"key":"B","text":"调查分析企业外部环境"},{"key":"C","text":"确定员工薪酬策略"},{"key":"D","text":"进行工作分析"}],"answer":["B"],"explanation":"本题考查企业薪酬制度设计的流程。 企业薪酬制度设计的流程包括： （1）明确现状和需求（选项 A 不符合题意）； （2）确定薪酬策略（选项 C 不符合题意）； （3）进行工作分析（选项 D 不符合题意）； （4）进行职位评价； （5）进行等级划分； （6）建立健全配套制度； （7）进行市场薪酬调查； （8）确定薪酬结构与水平； （9）薪酬制度的实施与修正。 故本题选 B 选项。 ▎考点 基本薪酬设计★★","id":"gongshang-0214","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"企业确定薪酬浮动率时要考虑的因素有（ ）。","material":"","options":[{"key":"A","text":"本企业的薪酬支付能力"},{"key":"B","text":"同一行业其他企业同种职位的薪酬标准"},{"key":"C","text":"本企业各薪酬等级的价值"},{"key":"D","text":"本企业各薪酬等级之间的价值差异"},{"key":"E","text":"本企业各薪酬等级的重叠比率"}],"answer":["A","C","D","E"],"explanation":"本题考查薪酬等级的建立。 薪酬浮动率是指薪酬区间的最高值或最低值偏离区间中值的比率。对于不同的薪酬等级，薪酬浮动率可以是相同的，也可以是不同的，企业应当根据自身的实际情况来确定这一比率的具体数值。一般来说，确定薪酬浮动率时要考虑的主要因素包括： （1）企业的薪酬支付能力； （2）各薪酬等级的价值； （3）各薪酬等级之间的价值差异； （4）各薪酬等级的重叠比率等。 故本题选 ACDE 选项。","id":"gongshang-0215","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"下列属于以技能为导向的基本薪酬设计方法的有（ ）。","material":"","options":[{"key":"A","text":"计点法"},{"key":"B","text":"职位等级法"},{"key":"C","text":"因素比较法"},{"key":"D","text":"以知识为基础的基本薪酬制度设计方法"},{"key":"E","text":"以技能为基础的基本薪酬制度设计方法"}],"answer":["D","E"],"explanation":"本题考查以技能为导向的基本薪酬设计。 以技能为导向的基本薪酬设计具体可分为以知识为基础的基本薪酬制度设计方法和以技能为基础的基本薪酬制度设计方法。 选项 ABC 属于以职位为导向的基本薪酬设计的方法。 故本题选 DE 选项。 ▎考点 激励薪酬设计★★★","id":"gongshang-0216","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"下列薪酬形式中，属于激励薪酬的有（ ）。","material":"","options":[{"key":"A","text":"奖金"},{"key":"B","text":"员工持股"},{"key":"C","text":"员工分红"},{"key":"D","text":"保险福利"},{"key":"E","text":"带薪休假"}],"answer":["A","B","C"],"explanation":"本题考查激励薪酬设计。 激励薪酬一般可以分为个人激励薪酬和群体激励薪酬两种类型。 （1）个人激励薪酬：计件制，工时制，绩效工资（绩效调薪、绩效奖金、月/季度浮动薪酬，以及特殊绩效认可计划），选项 A 正确。 （2）群体激励薪酬： 利润分享计划； 收益分享计划； 员工持股计划：员工持股计划是将年终分享利润以股票的形式发放给员工，员工在一定年限后可以转让这些股票获取价差或继续持有并参与分红，选项 BC 正确。 带薪休假属于国家法定福利，属于福利内容，选项 A 错误， 故本题选 ABC 选项。","id":"gongshang-0217","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"下列薪酬形式中，不属于个人激励薪酬形式的是（ ）。","material":"","options":[{"key":"A","text":"计件制"},{"key":"B","text":"工时制"},{"key":"C","text":"绩效奖金"},{"key":"D","text":"员工持股制度"}],"answer":["D"],"explanation":"本题考查激励薪酬设计。 激励薪酬一般可以分为个人激励薪酬和群体激励薪酬两种。 个人激励薪酬的主要形式包括： （1）计件制，选项 A 不符合题意； （2）工时制，选项 B 不符合题意； （3）绩效工资。 其中，绩效工资又分为绩效调薪、绩效奖金、月/季度浮动薪酬和特殊绩效认可计划四种，选项 C 不符合题意。 员工持股制度属于群体激励薪酬的形式，选项 D 符合题意。 故本题选 D 选项。 ▎考点 激励薪酬设计★★★","id":"gongshang-0218","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"下列关于福利的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"福利即企业支付给员工的直接薪酬"},{"key":"B","text":"福利具有准固定成本的性质"},{"key":"C","text":"福利的形式灵活多样，可以满足员工的不同的需要"},{"key":"D","text":"福利具备一定的可变性，与员工个人绩效直接相连"},{"key":"E","text":"福利具有税收方面的优惠"}],"answer":["B","C","E"],"explanation":"本题考查福利。 福利是指企业支付给员工的间接薪酬，而不是直接薪酬，选项 A 错误。 直接薪酬具备一定的可变性，与员工个人直接相关，而福利则具有准固定成本的性质，选项 D 错误。 故本题选 BCE 选项。","id":"gongshang-0219","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"下列工作中，属于福利管理规划阶段的有（ ）。","material":"","options":[{"key":"A","text":"开展福利调查"},{"key":"B","text":"确定需要提供的福利项目"},{"key":"C","text":"福利成本预算"},{"key":"D","text":"制订福利实施计划"},{"key":"E","text":"对员工进行反馈调查"}],"answer":["B","C","D"],"explanation":"本题考查福利的管理。 福利管理阶段包括调查阶段、规划阶段、实施阶段和反馈阶段。 在福利规划阶段： （1）企业要根据内外部调查的结果和企业自身情况，确定需要提供的福利项目（选项 B 正确）。 （2）要对福利成本做出预算（选项 C 正确），包括总的福利费用、各个福利内容的成本、每个员工的福利成本等； （3）要制订出详细的福利实施计划（选项 D 正确），如福利产品购买的时间、发放的时间、购买的程序、保管的制度等。 开展福利调查属于调查阶段的工作（选项 A 错误）。 对员工进行反馈调查属于反馈阶段的工作（选项 E 错误）。 故本题选 BCD 选项。 ▮ 考点 货币时间价值观念★★★","id":"gongshang-0220","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"资金的时间价值是扣除了（ ）因素后的平均资金利润率或平均报酬率。","material":"","options":[{"key":"A","text":"风险报酬"},{"key":"B","text":"利率"},{"key":"C","text":"概率"},{"key":"D","text":"时间"},{"key":"E","text":"通货膨胀"}],"answer":["A","E"],"explanation":"本题考查货币时间价值概念。 货币时间价值有两种表现形式： 一是相对数，即时间价值率，是扣除风险报酬和通货膨胀因素后的平均资金利润率或平均报酬率； 二是绝对数，即时间价值额，是一定数额的资金与时间价值率的乘积。 故本题选 AE 选项。","id":"gongshang-0221","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"某公司向银行借款 5000 万元，期限为 5 年，年利率为 10%，复利计息，到期后企业应一次性偿还的金额为（ ）万元。","material":"","options":[{"key":"A","text":"5000"},{"key":"B","text":"5500"},{"key":"C","text":"7320.5"},{"key":"D","text":"8052.55"}],"answer":["D"],"explanation":"本题考查货币的时间价值计算。 根据公式，终值=现值×（1＋基期利率）n，计算如下： （1）现值：题目已知借款 5000 万元； （2）计息周期数：题目已知期限为 5 年； （3）利率：题目已知年利率为 10%； 将上述信息代入公式，终值=5000×（1＋10%）5=5000×1.61051=8052.55（万元）。 故本题选 D 选项。 ▮ 考点 风险价值观念★★★","id":"gongshang-0222","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"在不考虑通货膨胀的情况下，投资必要报酬率的构成要素包括（ ）。","material":"","options":[{"key":"A","text":"综合资本成本率"},{"key":"B","text":"资金时间价值"},{"key":"C","text":"个别资本成本率"},{"key":"D","text":"风险报酬率"},{"key":"E","text":"标准离差率"}],"answer":["B","D"],"explanation":"本题考查风险价值的相关概念。 在不考虑通货膨胀的情况下，投资必要报酬率包括两部分： （1）资金的时间价值，它是不考虑投资风险而得到的价值，即无风险报酬率； （2）风险价值，即风险报酬率。 故本题选 BD 选项。","id":"gongshang-0223","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"某公司计划开发 A 产品，经测算，开发生产 A 产品的投资期望报酬率的标准离差率为 50%，风险报酬系数为 40%，则该公司开发 A 产品的风险报酬率是（ ）。","material":"","options":[{"key":"A","text":"12.5%"},{"key":"B","text":"9.0%"},{"key":"C","text":"45.0%"},{"key":"D","text":"20.0%"}],"answer":["D"],"explanation":"本题考查风险报酬估计。 风险报酬率=风险报酬系数×标准离差率×100%=40%×50%×100%=20%。 故本题选 D 选项。 ；提醒； 对计算容易混的同学，计算过程中可以将百分数化为数值来计算，例如 0.4×0.5×1=0.2，即 20%。 ▮ 考点 资本成本★★★","id":"gongshang-0224","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"个别资本成本率的高低取决于（ ）。","material":"","options":[{"key":"A","text":"筹资费用"},{"key":"B","text":"用资费用"},{"key":"C","text":"筹资额"},{"key":"D","text":"个别资本所占比重"},{"key":"E","text":"资本结构"}],"answer":["A","B","C"],"explanation":"本题考查个别资本成本率。 个别资本成本率的一般公式为：式中，K 为资本成本率；D 为用资费用额；P 为筹资额，f 为筹资费用额。 从公式中可以看出个别资本成本率高低取决于筹资费用、用资费用和筹资额三个因素，选项 ABC 正确。 个别资本所占比重和资本结构是综合资本成本率的影响因素，选项 DE 错误。 故本题选 ABC 选项。","id":"gongshang-0225","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"决定综合资本成本率的因素有（ ）。","material":"","options":[{"key":"A","text":"筹资总量"},{"key":"B","text":"企业资产总额"},{"key":"C","text":"个别资本成本率"},{"key":"D","text":"各种资本结构"},{"key":"E","text":"所筹资本的投资去向"}],"answer":["C","D"],"explanation":"本题考查综合资本成本率。 个别资本成本率和各种资本结构两个因素决定综合资本成本率。 故本题选 CD 选项。 ▮ 考点 杠杆理论★★","id":"gongshang-0226","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"下列关于营业杠杆的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"营业杠杆系数越高，表示企业息税前盈余对销售量变化的影响越高，经营风险越小"},{"key":"B","text":"营业杠杆系数越高，表示企业息税前盈余对销售量变化的影响越高，经营风险越大"},{"key":"C","text":"营业杠杆系数越低，表示企业息税前盈余受销售量变化的影响越大，经营风险越小"},{"key":"D","text":"营业杠杆系数越低，表示企业息税前盈余受销售量变化的影响越小，经营风险越小"},{"key":"E","text":"营业杠杆系数越高，表示企业息税前盈余受销售量变化的影响越小，经营风险越小"}],"answer":["B","D"],"explanation":"本题考查营业杠杆。 营业杠杆系数越大，表示企业息税前盈余受销售量变化的影响越大，经营风险越高，选项 B 正确，选项 AE 错误； 营业杠杆系数越小，表示企业息税前盈余受销售量变化的影响越小，经营风险越低，选项 D 正确，选项 C 错误。 故本题选 BD 选项。","id":"gongshang-0227","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"当财务杠杆系数和营业杠杆系数都为 1.5 时，则联合杠杆系数为（ ）。","material":"","options":[{"key":"A","text":"3"},{"key":"B","text":"2.25"},{"key":"C","text":"1.5"},{"key":"D","text":"1"}],"answer":["B"],"explanation":"本题考查总杠杆。 总杠杆系数=财务杠杆系数×营业杠杆系数=1.5×1.5=2.25。 故本题选 B 选项。 ▮ 考点 资本结构理论★","id":"gongshang-0228","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"早期资本结构理论中，忽略了财务风险的是（ ）。","material":"","options":[{"key":"A","text":"净营业收益观点"},{"key":"B","text":"净收益观点"},{"key":"C","text":"代理成本理论"},{"key":"D","text":"动态权衡理论"}],"answer":["B"],"explanation":"本题考查早期资本结构理论。 早期资本结构理论包括：净收益观点、净营业收益观点和传统观点。 其中，净收益观点认为，由于债务资本成本率一般低于股权资本成本率，因此， 公司的债务资本越多，债务资本比例就越高，综合资本成本率就越低，从而公司的价值就越大。 这种观点忽略了财务风险，如果公司的债务资本过多，债务资本比例过高，财务风险也会很高，公司的综合资本成本率就会上升，公司的价值反而会下降。 故本题选 B 选项。","id":"gongshang-0229","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"下列属于现代资本结构理论的有（ ）。","material":"","options":[{"key":"A","text":"代理成本理论"},{"key":"B","text":"啄序理论"},{"key":"C","text":"动态权衡理论"},{"key":"D","text":"市场择时理论"},{"key":"E","text":"双因素理论"}],"answer":["A","B","C","D"],"explanation":"本题考查现代的资本结构理论。 现代资本结构理论有代理成本理论、啄序理论、动态权衡理论和市场择时理论。 故本题选 ABCD 选项。 ▮ 考点 资本结构决策★","id":"gongshang-0230","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"资本结构的影响因素主要有（ ）。","material":"","options":[{"key":"A","text":"企业财务目标"},{"key":"B","text":"企业资产结构"},{"key":"C","text":"税务政策"},{"key":"D","text":"企业高层管理者素质"},{"key":"E","text":"经营状况的稳定性和成长性"}],"answer":["A","B","C","E"],"explanation":"本题考查资本结构的影响因素。 资本结构的影响因素主要有企业财务目标、经营状况的稳定性和成长性、企业的财务状况和信用等级、企业资产结构、企业投资者及管理者的态度、行业特征及发展周期、财政政策及货币政策等。 故本题选 ABCE 选项。","id":"gongshang-0231","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"根据每股利润分析法，当公司实际的息税前盈余大于息税前盈余平衡点时，公司宜选择的筹资方式有（ ）。","material":"","options":[{"key":"A","text":"银行贷款"},{"key":"B","text":"发行普通股"},{"key":"C","text":"发行债券或优先股"},{"key":"D","text":"资本成本固定型筹资方式"},{"key":"E","text":"资本成本非固定型筹资方式"}],"answer":["A","C","D"],"explanation":"本题考查每股利润分析法。 每股利润分析法决策规则： （1）当实际 EBIT 大于无差别点时，选择资本成本固定型的筹资方式更有利，如银行贷款、发行债券或优先股； （2）当实际 EBIT 小于无差别点时，选择资本成本非固定型筹资方式，如发行普 通股。 故本题选 ACD 选项。 ▮ 考点 固定资产投资决策★★★","id":"gongshang-0232","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"在进行投资项目的现金流量估算时，需要估算的是与项目相关的（ ）。","material":"","options":[{"key":"A","text":"增量现金流量"},{"key":"B","text":"企业全部现金流量"},{"key":"C","text":"投资现金流量"},{"key":"D","text":"经营现金流量"}],"answer":["A"],"explanation":"本题考查现金流量估算。 估算投资方案的现金流量应遵循的最基本的原则是：只有增量现金流量才是与项目相关的现金流量。 故本题选 A 选项。","id":"gongshang-0233","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"非贴现现金流量指标包括（ ）。","material":"","options":[{"key":"A","text":"投资回收期"},{"key":"B","text":"平均报酬率"},{"key":"C","text":"净现值"},{"key":"D","text":"内部报酬率"},{"key":"E","text":"外部报酬率"}],"answer":["A","B"],"explanation":"本题考查财务可行性评价指标。 （1）非贴现现金流量指标：包括投资回收期，平均报酬率，选项 AB 正确； （2）贴现现金流量指标包括：净现值、内部报酬率、获利指数，选项 CDE 错误。 故本题选 AB 选项。 ▮ 考点 长期股权投资决策☆","id":"gongshang-0234","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"甲公司出资 1 亿元对乙公司进行股权投资，该项投资应计入（ ）。","material":"","options":[{"key":"A","text":"甲公司资产负债表上的资产"},{"key":"B","text":"乙公司资产负债表上的负债"},{"key":"C","text":"甲公司资产负债表上的负债"},{"key":"D","text":"甲公司资产负债表上的股东权益"}],"answer":["A"],"explanation":"本题考查长期股权投资概述。 甲公司出资获得乙公司的股权，属于长期股权投资，长期股权投资是一种交换行为，是企业将资产让渡给被投资单位所获得的另一项资产，故该项投资应该计入甲公司的资产。 故本题选 A 选项。","id":"gongshang-0235","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"长期股权投资的运营管理风险有（ ）。","material":"","options":[{"key":"A","text":"投资项目的可行性论证风险"},{"key":"B","text":"公司治理结构风险"},{"key":"C","text":"投资协议风险"},{"key":"D","text":"道德风险"},{"key":"E","text":"退出风险"}],"answer":["B","C","D"],"explanation":"本题考查长期股权投资的风险类型。 长期股权投资的风险包括投资决策风险、投资运营管理风险、投资清理风险。 其中投资运营管理风险包括：（1）股东选择风险；（2）公司治理结构风险（选项 B 错误）；（3）投资协议风险（选项 C 错误）；（4）道德风险（选项 D 错误）；（5）被投资企业存在的经营风险和财务风险；（6）项目小组和外派人员风险；（7）信息披露风险等。 投资项目的可行性论证风险属于投资决策风险，选项 A 错误。 退出风险属于投资清理风险，选项 E 错误。 故本题选 BCD 选项。 ▮ 考点 并购重组动因☆","id":"gongshang-0236","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"企业重组是指企业以（ ）为目的，运用资产重组、负债重组和产权重组方式，优化资产结构、负债结构、产权结构，充分利用资源，实现资源优化配置。","material":"","options":[{"key":"A","text":"资本保值增值"},{"key":"B","text":"扩大市场占有率"},{"key":"C","text":"提升企业声望"},{"key":"D","text":"扩充企业资产"}],"answer":["A"],"explanation":"本题考查并购重组动因。 企业重组是指企业以资本保值为目标，运用资产重组，负债重组和产权重组方式，优化企业资产结构，负债结构和产权结构，以充分利用现有资源，实现资源优化配置。 故本题选 A 选项。","id":"gongshang-0237","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"并购重组的动因有多方面，下列属于客观动因的有（ ）。","material":"","options":[{"key":"A","text":"多元化经营"},{"key":"B","text":"减少竞争"},{"key":"C","text":"实现个人雄心壮志"},{"key":"D","text":"实现规模经营"},{"key":"E","text":"提高生产能力"}],"answer":["A","B","D","E"],"explanation":"本题考查并购重组动因。 客观动因是从企业发展本身出发考虑的动因，包括谋求更长远发展、多元化经营（选项 A 正确）、实现规模经营（选项 D 正确）、减少竞争（选项 B 正确）、缩短投入产出时间、确保原材料和半成品供应、提高生产能力（选项 E 正确）、提高科研水平等。 主观动因包括扩大管理者职权、以并购业绩保障经理职位及自我实现层次需要等，实现个人雄心壮志属于主观动因中的自我实现层次需要（选项 C 错误）。 故本题选 ABDE 选项。 ▮ 考点 并购重组方式及效应★★★","id":"gongshang-0238","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"甲公司与乙公司重组后，两家公司设立新公司丙公司，原有甲、乙两家公司均解散，此次重组的方式是（ ）。","material":"","options":[{"key":"A","text":"新设合并"},{"key":"B","text":"吸收合并"},{"key":"C","text":"收购"},{"key":"D","text":"回购"}],"answer":["A"],"explanation":"本题考查企业收购与企业兼并的含义。 （1）两个以上公司合并设立一个新的公司为新设合并，合并各方解散。根据题目信息可知合并的原有两家公司均解散，并且成立了一个新的丙公司，可知符合新设合并的概念。 （2）一个公司吸收其他公司为吸收合并，被吸收的公司解散。 （3）企业收购是指一个企业用现金、有价证券等方式购买另一家企业的资产或股权，以获得对该企业控制权的一种经济行为。 故本题选 A 选项。","id":"gongshang-0239","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"公司分立的效应包括（ ）。","material":"","options":[{"key":"A","text":"减轻负担"},{"key":"B","text":"筹集资金"},{"key":"C","text":"适应战略调整"},{"key":"D","text":"实现协同效应"},{"key":"E","text":"降低代理成本"}],"answer":["A","B","C"],"explanation":"本题考查分立的动机。 公司分立的效应主要包括：（1）适应战略调整；（2）减轻负担；（3）筹集资金；（4）清晰主业；（5）化解内部竞争性冲突，选项 ABC 正确。 实现协同效应和降低代理成本属于并购效应，选项 DE 错误。 故本题选 ABC 选项。 【提醒】分立效应和并购效应注意区分。 并购的效应有： （1）实现协同效应，包括管理协同、经营协同、财务协同。 （2）实现战略重组，开展多元化经营。 （3）获得特殊资产和渠道，包括土地，优秀管理队伍、优秀研究人员或专门人才以及专有技术、商标、品牌等无形资产，国外市场和技术。 （4）降低代理成本。代理成本包括：契约成本、监督成本和剩余损失。 ▮ 考点 企业价值评估★","id":"gongshang-0240","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"下列方法中，可用于企业价值评估的方法有（ ）。","material":"","options":[{"key":"A","text":"获利指数法"},{"key":"B","text":"市盈率法"},{"key":"C","text":"收益法"},{"key":"D","text":"投资回收期法"},{"key":"E","text":"每股利润分析法"}],"answer":["B","C"],"explanation":"本题考查企业价值评估。 企业价值评估的方法主要有收益法、市盈率法、市净率法、市盈率相对盈利增长比率法、市销率估值法，选项 BC 正确。 获利指数属于贴现现金流量指标，选项 A 错误。 投资回收期属于非贴现现金流量指标，选项 D 错误。 每股利润分析法属于资本结构的决策方法，选项 E 错误。 故本题选 BC 选项。","id":"gongshang-0241","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"对企业进行价值评估的方法主要有（ ）。","material":"","options":[{"key":"A","text":"收益法"},{"key":"B","text":"市盈率法"},{"key":"C","text":"市净率法"},{"key":"D","text":"市销率法"},{"key":"E","text":"市净率相对销售额增长比率法"}],"answer":["A","B","C","D"],"explanation":"本题考查企业价值评估。 价值评估是买卖双方对标的（企业或股权或资产）做出的价值判断，是并购重组的重要环节。 价值评估的方法主要有： （1）收益法，选项 A 正确； （2）市盈率法，选项 B 正确； （3）市净率法，选项 C 正确； （4）市盈率相对盈利增长比率法，选项 E 错误； （5）市销率法，选项 D 正确。 故本题选 ABCD 选项。 ▍ 考点 电子商务的产生背景及概念★★★","id":"gongshang-0242","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"促使电子商务产生的主要因素有（ ）。","material":"","options":[{"key":"A","text":"经济全球化"},{"key":"B","text":"实体店升级"},{"key":"C","text":"信息技术改革"},{"key":"D","text":"全球交通便利化"},{"key":"E","text":"第三方物流"}],"answer":["A","C"],"explanation":"本题考查电子商务的产生背景。 20世纪90年代，随着经济全球化和计算机网络技术的发展，电子商务迅速崛起。信息技术革命推动了信息经济和知识经济的发展，改变了国际经济贸易的环境，加速了世界经济结构的调整，这些变化不仅改变了经济活动、商务运作过程和方式，也影响了人类的思维、工作和生活方式，从而催生了电子商务。因此，促使电子商务产生的主要因素是经济全球化和信息技术革命。故本题选AC选项。","id":"gongshang-0243","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"电子商务的手段是（ ）。","material":"","options":[{"key":"A","text":"经济全球化"},{"key":"B","text":"商务活动"},{"key":"C","text":"计算机网络"},{"key":"D","text":"电子化方式"}],"answer":["D"],"explanation":"本题考查电子商务的概念。 从根本上来说，电子商务是以商务活动为主体，以计算机网络为基础，以电子化方式为手段的一种商务模式。故本题选D选项。 ▍ 考点 电子商务的功能和特点★★★","id":"gongshang-0244","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"电子商务的功能有（ ）。","material":"","options":[{"key":"A","text":"广告宣传"},{"key":"B","text":"咨询洽谈"},{"key":"C","text":"线上订购"},{"key":"D","text":"网上服务"},{"key":"E","text":"提高利润"}],"answer":["A","B","C","D"],"explanation":"本题考查电子商务的功能。 电子商务的功能有：广告宣传、咨询洽谈、线上订购、电子支付、线上服务、网络调研、交易管理。故本题选ABCD选项。","id":"gongshang-0245","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"下列关于电子商务的特点表述错误的是（ ）。","material":"","options":[{"key":"A","text":"交易透明化"},{"key":"B","text":"交易虚拟化"},{"key":"C","text":"成本低廉化"},{"key":"D","text":"服务大众化"}],"answer":["D"],"explanation":"本题考查电子商务的特点。 电子商务的特点包括：市场全球化、跨时空限制、交易虚拟化、成本低廉化、交易透明化、操作方便化、服务个性化、运作高效化。是服务个性化不是服务大众化，选项D错误。故本题选D选项。 ；提醒； 电子商务的特点之一是服务个性化，而不是大众化。追求个性化和定制化是电子商务的重要特点。企业可利用网络追踪、数据挖掘等技术分析消费者的偏好、需求和购物习惯，促进企业针对消费者进行商品和服务研究和开发活动，更好地为他们提供个性化服务。 ▍ 考点 电子商务的分类★★★","id":"gongshang-0246","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"电子商务按照运行方式可以分为（ ）。","material":"","options":[{"key":"A","text":"完全电子商务"},{"key":"B","text":"非完全电子商务"},{"key":"C","text":"全球电子商务"},{"key":"D","text":"远程国内电子商务"},{"key":"E","text":"区域化电子商务"}],"answer":["A","B"],"explanation":"本题考查电子商务的分类。 按照商业活动的运行方式划分：完全的电子商务和非完全的电子商务，选项AB正确。 按照开展电子交易的地域范围分类，电子商务分为：区域化电子商务、远程国内电子商务、全球电子商务，选项CDE错误。故本题选AB选项。","id":"gongshang-0247","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"按照开展电子交易的地域范围，可将电子商务分为（ ）。","material":"","options":[{"key":"A","text":"区域化电子商务"},{"key":"B","text":"远程国内电子商务"},{"key":"C","text":"全球电子商务"},{"key":"D","text":"消费者对政府的电子商务"},{"key":"E","text":"线上对线下的电子商务"}],"answer":["A","B","C"],"explanation":"本题考查电子商务的分类。 按照开展电子交易的地域范围，可将电子商务分为区域化电子商务、远程国内电子商务、全球电子商务，选项ABC正确。 消费者对政府的电子商务和线上对线下的电子商务是按照交易的主体划分，选项DE错误。故本题选ABC选项。 ▍ 考点 电子商务中的商流、资金流、物流、信息流★★★","id":"gongshang-0248","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"电子商务交易活动的达成必然需要（ ）在时空上的协作，缺一不可。","material":"","options":[{"key":"A","text":"物流"},{"key":"B","text":"资金流"},{"key":"C","text":"时间流"},{"key":"D","text":"信息流"},{"key":"E","text":"商流"}],"answer":["A","B","D","E"],"explanation":"本题考查电子商务中的商流、资金流、物流、信息流。 电子商务交易活动的达成必然需要商流、资金流、物流、信息流在时空上的协作，缺一不可，选项ABDE正确。故本题选ABDE选项。","id":"gongshang-0249","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"关于电子商务流通过程中的四大组成部分之间的关系，下列说法正确的有（ ）。","material":"","options":[{"key":"A","text":"物流是条件"},{"key":"B","text":"资金流是手段"},{"key":"C","text":"信息流是归宿"},{"key":"D","text":"商流是动机和目的"}],"answer":["D"],"explanation":"本题考查电子商务中商流、资金流、物流、信息流的关系。 商流、资金流、物流、信息流是一个相互联系、互相伴随、共同支撑电子商务活动的整体。商流是动机和目的，资金流是条件，物流是终结和归宿，信息流是手段。故本题选D选项。 ▍ 考点 电子商务对企业经营管理的影响★★","id":"gongshang-0250","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"电子商务对企业经营管理的影响是多方面的，其中在组织形式方面的变化主要体现为（ ）。","material":"","options":[{"key":"A","text":"组织结构由金字塔型向扁平型转变"},{"key":"B","text":"企业组织信息传递的方式由单向的“一对多”到双向的“多对多”转换"},{"key":"C","text":"降低企业的交易成本、减少企业库存、缩短生产周期、增加企业交易机会"},{"key":"D","text":"配送速度、产品质量、售后服务、商家信用等越来越受到消费者的重视"}],"answer":["A"],"explanation":"本题考查电子商务对企业经营管理的影响。 电子商务给传统的企业组织形式带来了猛烈的冲击，组织结构由金字塔向扁平形转变，原有各工作单元之间的界限被打破，重新组合成了一个直接为客户服务的新的工作单元，选项A正确； 企业组织信息传递的方式由单向的“一对多”到双向的“多对多”转换属于对管理模式的影响，选项B错误。 降低企业的交易成本、减少企业库存、缩短生产周期、增加企业交易机会属于对生产经营的影响，选项C错误。 配送速度、产品质量、售后服务、商家信用等越来越受消费者的重视属于对竞争方式的影响，选项D错误。故本题选A选项。","id":"gongshang-0251","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"下列说法中，属于电子商务对企业管理模式的影响的有（ ）。","material":"","options":[{"key":"A","text":"企业内部构造了内部网、数据库"},{"key":"B","text":"组织流程“并行”"},{"key":"C","text":"减少企业库存"},{"key":"D","text":"企业管理由集权制向分权制转换"},{"key":"E","text":"企业需要树立全球化观念"}],"answer":["A","B","D"],"explanation":"本题考查电子商务对企业经营管理的影响。 电子商务对企业管理模式的影响主要有以下三点： （1）企业内部构造了内部网、数据库，选项A正确； （2）企业管理由集权制向分权制转换，选项D正确； （3）组织流程并行，选项B正确。 减少企业库存是电子商务对生产经营方面影响的表现，选项C错误。企业需要树立全球化观念是电子商务对管理思想领域影响的体现，选项E错误。故本题选ABD选项。 ▍ 考点 电子商务的一般框架★★★","id":"gongshang-0252","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"电子商务的运作系统里，一般框架的三大层次包括（ ）。","material":"","options":[{"key":"A","text":"网络层"},{"key":"B","text":"信息发布与传输层"},{"key":"C","text":"一般业务服务层"},{"key":"D","text":"公共政策层"},{"key":"E","text":"电子支付层"}],"answer":["A","B","C"],"explanation":"本题考查电子商务的一般框架。 电子商务的一般框架包含三个层次：网络层、信息发布与传输层、一般业务服务层。故本题选ABC选项。 ；提醒； 电子商务系统框架结构是由三个层次和四个支柱组成的。 （1）三个层次包括：网络层、信息发布与传输层、一般业务服务层。 （2）两个支柱包括：公共政策和法律规范、技术标准和网络协议。","id":"gongshang-0253","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"在电子商务系统框架结构中，实现电子商务的基础设施层是（ ）。","material":"","options":[{"key":"A","text":"网络层"},{"key":"B","text":"数据库层"},{"key":"C","text":"信息传输层"},{"key":"D","text":"业务服务层"}],"answer":["A"],"explanation":"本题考查商务的一般框架。 电子商务系统框架结构是指电子商务系统中拓展性强的一种结构模式，它由三个层次和两个支柱组成，三个层次分别是网络层、信息发布与传输层、一般业务服务层。 其中，网络层是指网络基础设施，即“信息高速公路”，是实现电子商务最底层的硬件基础设施。故本题选A选项。 ▍ 考点 电子商务运作系统的组成要素★","id":"gongshang-0254","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"电子商务运作系统的组成要素包括（ ）。","material":"","options":[{"key":"A","text":"消费者"},{"key":"B","text":"企业"},{"key":"C","text":"技术标准"},{"key":"D","text":"物流配送体系"},{"key":"E","text":"法律规范"}],"answer":["A","B","D"],"explanation":"本题考查电子商务运作系统的组成要素。 电子商务运作系统的组成要素包括：消费者、企业、网络支付体系、物流配送体系、CA认证中心、其他要素。故本题选ABD选项。","id":"gongshang-0255","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"电子商务运作系统的组成要素中，（ ）构成了商务活动的核心要素。","material":"","options":[{"key":"A","text":"企业"},{"key":"B","text":"消费者"},{"key":"C","text":"银行"},{"key":"D","text":"政府"}],"answer":["B"],"explanation":"本题考查电子商务运作系统的组成要素。 电子商务系统由消费者、企业、网络支付体系、物流配送体系、CA认证中心及其他要素组成。 消费者是电子商务运作系统的组成要素之一，构成了商务活动的核心要素。故本题选B选项。 ▍ 考点 电子商务的交易模式及一般流程★","id":"gongshang-0256","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"由买卖双方企业之外的第三者建立，以便匹配买卖双方需求与价格的B2B电子商务模式是（ ）。","material":"","options":[{"key":"A","text":"卖方控制型"},{"key":"B","text":"买方控制型"},{"key":"C","text":"中介控制型"},{"key":"D","text":"官方控制型"}],"answer":["C"],"explanation":"本题考查电子商务的交易模式及一般流程。 按市场战略的不同，B2B可分为三种类型： 卖方控制型B2B由单一卖方企业建立，以期寻求众多的买者，旨在建立或维持其在交易中的市场势力，选项A错误。 买方控制型B2B由一个或多个买方企业建立，旨在把市场势力和价值转移到买方。买方控制型B2B除了一个由买方企业直接建立市场之外，还包括买方代理型和买方合作型两种类型，选项B错误。 中介控制型B2B由买卖双方企业之外的第三者建立，以便匹配市场上的需求与价格，选项C正确。 B2B的类型不包含官方控制型，选项D错误。故本题选C选项。","id":"gongshang-0257","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"B2C的一种特殊形式是（ ）。","material":"","options":[{"key":"A","text":"B2B"},{"key":"B","text":"O2O"},{"key":"C","text":"C2C"},{"key":"D","text":"B2C"}],"answer":["B"],"explanation":"本题考查电子商务的交易模式及一般流程。 O2O是指线上与线下协调集成的电子商务。O2O实现了信息和实物之间、线上和线下之间的紧密联系。某种程度上，O2O是B2C的一种特殊形式。故本题选B选项。 ▍ 考点 企业实施电子商务的运作步骤★★★","id":"gongshang-0258","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"在企业实施电子商务的运作步骤中，系统设计与开发阶段的任务主要包括（ ）。","material":"","options":[{"key":"A","text":"功能设计"},{"key":"B","text":"数据库设计"},{"key":"C","text":"岗位设计"},{"key":"D","text":"网站设计"},{"key":"E","text":"流程设计"}],"answer":["A","B","D","E"],"explanation":"本题考查系统设计与开发。 企业实施电子商务的运作步骤主要包括明确愿景、制定战略、选择策略、系统设计与开发和电子商务组织实施五个阶段。 其中，在系统设计与开发设计阶段，主要任务包括： （1）功能设计； （2）流程设计； （3）网站设计； （4）数据库设计； （5）网页开发。故本题选ABDE选项。","id":"gongshang-0259","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"在电子商务的运作过程中，流程设计属于（ ）阶段的工作。","material":"","options":[{"key":"A","text":"电子商务组织实施"},{"key":"B","text":"制定战略"},{"key":"C","text":"选择策略"},{"key":"D","text":"系统设计与开发"}],"answer":["D"],"explanation":"本题考查企业实施电子商务的运作步骤。 系统设计与开发阶段的内容包括：功能设计、流程设计、网站设计、数据库设计、系统开发。故本题选D选项。 ▍ 考点 电子支付的概念和特点★","id":"gongshang-0260","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"电子支付过程中，货币以（ ）的方式被持有、处理、接收。","material":"","options":[{"key":"A","text":"数字信息"},{"key":"B","text":"物理实体"},{"key":"C","text":"金银铸币"},{"key":"D","text":"商品实物"}],"answer":["A"],"explanation":"本题考查电子支付的概念。 电子支付过程中，货币以数字信息的方式被持有、处理、接收。故本题选A选项。","id":"gongshang-0261","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"与传统支付方式相比，电子支付的优势主要包括（ ）。","material":"","options":[{"key":"A","text":"无风险"},{"key":"B","text":"方便"},{"key":"C","text":"快捷"},{"key":"D","text":"高效"},{"key":"E","text":"经济"}],"answer":["B","C","D","E"],"explanation":"本题考查电子支付的特点。 电子支付具有方便、快捷、高效、经济的优势。用户只要拥有一台能上网的个人计算机或手机，便可足不出户，在很短的时间内完成整个电子支付过程；电子支付成本费用远小于传统支付成本费用。故本题选BCDE选项。 ▍ 考点 电子支付的分类★","id":"gongshang-0262","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"电子货币的主要功能包括（ ）。","material":"","options":[{"key":"A","text":"转账结算功能"},{"key":"B","text":"咨询洽谈"},{"key":"C","text":"网上服务"},{"key":"D","text":"兑现功能"},{"key":"E","text":"消费贷款功能"}],"answer":["A","D","E"],"explanation":"本题考查电子货币。 电子货币的主要功能包括：转账结算功能、储蓄功能、兑现功能、消费贷款功能。故本题选ADE选项。","id":"gongshang-0263","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"关于网上银行的主要优势，下列说法正确的有（ ）。","material":"","options":[{"key":"A","text":"全面实现无纸化交易"},{"key":"B","text":"交易无风险"},{"key":"C","text":"服务方便、快捷、高效、可靠"},{"key":"D","text":"经营成本低廉"},{"key":"E","text":"简单易用"}],"answer":["A","C","D","E"],"explanation":"本题考查网上银行的主要优势。 网上银行是在互联网上的虚拟银行柜台，不受时间、空间限制。网上银行的主要优势包括：（1）全面实现无纸化交易；（2）服务方便、快捷、高效、可靠；（3）经营成本低廉；（4）简单易用。故本题选ACDE选项。 ▍ 考点 第三方支付☆","id":"gongshang-0264","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"在通过（ ）的交易中，买方选购商品后，使用第三方平台提供的账户进行货款支付，由第三方通知卖家货款到达、进行发货；买方检验物品后，就可以通知付款给卖家，第三方将款预转至卖家账户。","material":"","options":[{"key":"A","text":"网上银行"},{"key":"B","text":"第三方支付"},{"key":"C","text":"银行卡"},{"key":"D","text":"电子货币"}],"answer":["B"],"explanation":"本题考查第三方支付的概念。 在通过第三方支付平台的交易中，买方选购商品后，使用第三方平台提供的账户进行货款支付，由第三方通知卖家货款到达、进行发货；买方检验物品后，就可以通知付款给卖家，第三方将款预转至卖家账户。故本题选B选项。 ▍ 考点 网络营销的概念和特点★★★","id":"gongshang-0265","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"网络营销的特点包括（ ）。","material":"","options":[{"key":"A","text":"经济性"},{"key":"B","text":"交互式"},{"key":"C","text":"个性化"},{"key":"D","text":"封闭性"},{"key":"E","text":"多维性"}],"answer":["A","B","C","E"],"explanation":"本题考查网络营销的特点。 网络营销的特点包括跨时域性、交互性、个性化、经济性、多维性、超前性、整合性、高效性、技术性。故本题选ABCE选项。","id":"gongshang-0266","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"企业利用互联网、移动互联网平台，可以每周7天，每天24小时随时随地的提供全球性营销服务，这体现了网络营销（ ）的特点。","material":"","options":[{"key":"A","text":"交互性"},{"key":"B","text":"个性化"},{"key":"C","text":"超前性"},{"key":"D","text":"跨时域性"}],"answer":["D"],"explanation":"本题考查网络营销的特点。 选项A错误，交互性指通过互联网展示商品图像、提供商品信息查询，实现供需互动与双向沟通。 选项B错误，个性化指互联网上的促销是一对一的、理性的、消费者主导的、非强迫性的、循序渐进式的，而且是一种低成本与人性化的促销方式。 选项C错误，超前性指互联网是一种功能强大的营销工具，它同时兼具渠道、促销、电子交易、互动服务以及市场信息分析与信息提供等多种功能。 选项D正确，跨时域性指互联网能够超越时间约束和空间限制进行信息交换，使营销脱离时空限制进行交易变成可能。企业有了更多时间和更大空间进行营销，可随时随地提供全球性营销服务。故本题选D选项。 ▍ 考点 网络市场调研的概念和方法★★","id":"gongshang-0267","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"网络市场直接调研的方法有（ ）。","material":"","options":[{"key":"A","text":"网上观察法"},{"key":"B","text":"专题讨论法"},{"key":"C","text":"在线问卷法"},{"key":"D","text":"网上实验法"},{"key":"E","text":"搜索引擎法"}],"answer":["A","B","C","D"],"explanation":"本题考查网络市场调研的概念和方法。 网络市场直接调研的方法有四种：网上观察法、专题讨论法、在线问卷法和网上实验法，选项ABCD正确。 搜索引擎法属于网络市场间接调研的方法，选项E错误。故本题选ABCD选项。","id":"gongshang-0268","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"下列网络市场调研中，属于网络市场间接调研的是（ ）。","material":"","options":[{"key":"A","text":"网上观察法"},{"key":"B","text":"在线问卷法"},{"key":"C","text":"网上实验法"},{"key":"D","text":"搜索引擎法"}],"answer":["D"],"explanation":"本题考查网络市场调查的方法。 网络市场直接调研的方法有四种：网上观察法、专题讨论法、在线问卷法和网上实验法，选项ABC错误。 网络市场间接调研的方法包括：利用搜索引擎；访问相关网站，如各种专题性或综合性网站；利用相关的网上数据库，选项D正确。故本题选D选项。 ▍ 考点 网络营销策略★","id":"gongshang-0269","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"在网络营销的产品策略中，适合做网上销售的产品的特点包括（ ）。","material":"","options":[{"key":"A","text":"廉价性"},{"key":"B","text":"时尚性"},{"key":"C","text":"标准化"},{"key":"D","text":"产品个性化"},{"key":"E","text":"重购性"}],"answer":["A","B","C","E"],"explanation":"本题考查产品形态。 适合网上销售的产品有信息产品、有形产品和网上服务。适合做网上销售的产品应具备的特点包括： （1）标准化； （2）重购性； （3）时尚性； （4）廉价性。 故本题选ABCE选项。","id":"gongshang-0270","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"在价格策略中，网络营销中产品和服务的定价要考虑的因素有（ ）。","material":"","options":[{"key":"A","text":"弹性化"},{"key":"B","text":"趋低化"},{"key":"C","text":"趋高化"},{"key":"D","text":"国际化"},{"key":"E","text":"价格解释体系"}],"answer":["A","B","D","E"],"explanation":"本题考查价格策略。 网络营销中产品和服务的定价要考虑的因素有：国际化，趋低化，弹性化，价格解释体系。故本题选ABDE选项。 ▍ 考点 网络营销方式★","id":"gongshang-0271","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"关于电子商务的说法，下列错误的是（ ）。","material":"","options":[{"key":"A","text":"电子支付使用的是最先进的通信手段"},{"key":"B","text":"经营成本低廉是网上银行的主要优势"},{"key":"C","text":"网络营销的特点包括跨时域性、个性化、多维性、超前性等"},{"key":"D","text":"网上观察法和在线问卷法是网络市场间接调研的方法"},{"key":"E","text":"博客营销和网络社群营销不属于网络营销的方式"}],"answer":["D","E"],"explanation":"本题考查网络营销。 网上观察法和在线问卷法是网络市场直接调研的方法，选项D错误； 博客营销和网络社群营销属于网络营销的方式，选项E错误。故本题选DE选项。","id":"gongshang-0272","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"企业将品牌、产品和服务等信息以新闻报道的方式在门户网站传播，这种网络营销方式属于（ ）。","material":"","options":[{"key":"A","text":"网络事件营销"},{"key":"B","text":"网络软文营销"},{"key":"C","text":"网络口碑营销"},{"key":"D","text":"网络视频营销"}],"answer":["B"],"explanation":"本题考查网络营销方式。 选项A错误，网络事件营销是指企业主要以网络为传播平台，通过精心策划和实施让客户直接参与并享受乐趣的事件吸引或转移客户注意力，改善、增进与客户的关系，塑造企业良好的形象，以谋求更大效益的一种营销传播活动。 选项B正确，网络软文营销是指通过门户网站、地方或行业网站等平台传播一些具有叙述性、新闻性和宣传性的文章，把企业、品牌、人物、产品、服务、活动项目等相关信息以新闻报道的方式，及时、全面、有效、经济地向客户广泛传播的新型营销方式。 选项C错误，网络口碑营销是指把传统的口碑营销与网络技术有机结合起来的一种新型营销方式。 选项D错误，网络视频营销是指企业将各种视频短片以各种形式放到互联网平台上，达到宣传企业品牌、产品及服务信息目的的营销手段。故本题选B选项。 ▊ 考点 国际商务的含义☆","id":"gongshang-0273","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"国际商务活动的类型有（ ）。","material":"","options":[{"key":"A","text":"电子商务"},{"key":"B","text":"国际贸易"},{"key":"C","text":"国际直接投资"},{"key":"D","text":"企业分立"},{"key":"E","text":"特许经营"}],"answer":["B","C","E"],"explanation":"本题考查国际商务的含义。 国际商务活动可以分为三大类： ①国际贸易，即货物与服务的进出口，选项B正确； ②国际直接投资，即以控制国（境）外企业的经营管理权为核心的经济活动，选项C正确； ③其他国际经济活动，主要包括特许经营、合作经营、合作开发、工程承包及劳务合作、国际信贷及融资等活动，选项E正确。 故本题选BCE选项。 ▊ 考点 跨国公司的概念及组织形式★★","id":"gongshang-0274","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"跨国公司的界定标准不包括（ ）。","material":"","options":[{"key":"A","text":"结构标准"},{"key":"B","text":"业绩标准"},{"key":"C","text":"行为标准"},{"key":"D","text":"员工数量标准"}],"answer":["D"],"explanation":"本题考查跨国公司的概念。 判定一家企业是否为跨国公司，通常有以下三种标准：结构标准、业绩标准和行为标准。 故本题选D选项。","id":"gongshang-0275","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"关于分公司与子公司的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"分公司在法律上和经济上没有独立性"},{"key":"B","text":"子公司是一个独立的法律实体"},{"key":"C","text":"分公司能独立支配财产"},{"key":"D","text":"子公司没有独立的财产权"},{"key":"E","text":"总公司对分公司的债务负无限责任"}],"answer":["A","B","E"],"explanation":"本题考查跨国公司的法律组织形式。 选项A正确，分公司是总公司的一个分支机构或附属机构，在法律上和经济上没有独立性，不是法人。 选项B正确，子公司是指按当地法律注册成立，由母公司控制但法律上是一个独 立的法律实体的企业机构。 选项C错误，选项E正确，分公司没有自己独立的公司名称和章程，其全部资产都属于总公司，没有独立的财产权，总公司对其债务负无限责任。 选项D错误，子公司自身是一个完整的公司，有独立的名称、章程和行政管理机构；能独立支配财产，自负盈亏。 故本题选ABE选项。 ▊ 考点 跨国公司的国外市场进入方式★★★","id":"gongshang-0276","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"跨国公司的国外市场进入方式包括（ ）。","material":"","options":[{"key":"A","text":"出口"},{"key":"B","text":"交钥匙工程"},{"key":"C","text":"技术授权"},{"key":"D","text":"企业分立"},{"key":"E","text":"与东道国企业成立合资企业"}],"answer":["A","B","C","E"],"explanation":"本题考查跨国公司的国外市场进入方式。 跨国公司通常采用六种方式进入国外市场，即出口、交钥匙工程、技术授权、特许经营、成立合资企业以及成立全资子公司。 故本题选ABCE选项。","id":"gongshang-0277","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"在跨国公司的国外市场进入方式中，有助于跨国公司实现区位经济和经验曲线效应的有（ ）。","material":"","options":[{"key":"A","text":"出口"},{"key":"B","text":"交钥匙工程"},{"key":"C","text":"技术授权"},{"key":"D","text":"特许经营"},{"key":"E","text":"成立全资子公司"}],"answer":["A","E"],"explanation":"本题考查跨国公司的国外市场进入方式。 出口模式的优点之一是帮助跨国公司实现经验曲线效应和区位经济。通过在一个中心区域制造产品，然后出口到其他国家市场，跨国公司可以从它的全球销量中实现巨大的规模经济。 成立全资子公司的优点包含有助于跨国公司实现区位经济和经验曲线效应。 出口和成立全资子公司有助于跨国公司实现区位经济和经验曲线效应。 故本题选AE选项。 ▊ 考点 跨国公司的战略选择、组织形式和控制系统★★","id":"gongshang-0278","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"在跨国公司经营战略中，当降低成本的压力强烈而地区调适的压力很低时，使用（ ）最为有效。","material":"","options":[{"key":"A","text":"跨国战略"},{"key":"B","text":"本土化战略"},{"key":"C","text":"全球标准化战略"},{"key":"D","text":"国际战略"}],"answer":["C"],"explanation":"本题考查跨国公司的战略选择。 跨国公司在国际环境竞争中通常采用四种基本的经营战略，即全球标准化战略、跨国战略、国际战略和本土化战略。 各种战略的适用性取决于降低成本和地区调适压力的大小。 当降低成本的压力高，地区调适的压力也很高时，适合使用跨国战略，选项A错误。 当降低成本的压力低而地区调适的压力很高时，适合使用本土化战略，选项B错误。 当降低成本的压力高而地区调适的压力很低时，使用全球标准化战略能达到最好的效果，选项C正确。 当降低成本的压力低，地区调适的压力也低时，适合使用国际战略，选项D错误。 故本题选C选项。","id":"gongshang-0279","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"关于跨国公司经营战略下的部门间相互依赖性、绩效模糊程度和控制成本程度的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"全球标准化战略部门间相互依赖性高，绩效模糊程度高，控制成本程度高"},{"key":"B","text":"本土化战略部门间相互依赖性高，绩效模糊程度低，控制成本程度低"},{"key":"C","text":"跨国战略部门间相互依赖性低，绩效模糊程度高，控制成本程度低"},{"key":"D","text":"国际战略部门间相互依赖性低，绩效模糊程度高，控制成本程度高"}],"answer":["A"],"explanation":"本题考查跨国公司经营战略下的组织形式和控制系统。 选项A正确，全球标准化战略部门间相互依赖性高，绩效模糊程度高，控制成本程度高； 选项B错误，本土化战略部门间相互依赖性低，绩效模糊程度低，控制成本程度低； 选项C错误，跨国战略部门间相互依赖性很高，绩效模糊程度很高，控制成本程度很高； 选项D错误，国际战略部门间相互依赖性中等，绩效模糊程度中等，控制成本程度中等。 故本题选A选项。 ▊ 考点 国际直接投资的动机与理论★★★","id":"gongshang-0280","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"国际直接投资动机中，为了规避汇率风险，获取自然资源和原材料的动机属于（ ）。","material":"","options":[{"key":"A","text":"市场导向型"},{"key":"B","text":"降低成本导向型"},{"key":"C","text":"优惠政策导向型"},{"key":"D","text":"分散投资风险导向型"}],"answer":["B"],"explanation":"本题考查国际直接投资的动机。 降低成本导向型动机主要有以下五种情况： ①出于获取自然资源和原材料方面的考虑； ②出于利用国外廉价劳动力等生产要素方面的考虑； ③出于规避汇率风险方面的考虑； ④出于利用各国关税税率的不同来降低生产成本方面的考虑； ⑤出于利用闲置设备、工业产权与专有技术等技术资源方面的考虑。 根据题干\"为了规避汇率风险，获取自然资源和原材料\"，符合降低成本导向型动机。 故本题选B选项。","id":"gongshang-0281","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"根据产品生命周期理论，企业开始在其他发达国家或地区进行对外直接投资并建立子公司进行出口替代发生在（ ）。","material":"","options":[{"key":"A","text":"产品创新阶段"},{"key":"B","text":"产品再创新阶段"},{"key":"C","text":"产品成熟阶段"},{"key":"D","text":"产品标准化阶段"}],"answer":["C"],"explanation":"本题考查产品生命周期理论。 弗农将产品生命周期划分为三个阶段，在不同的阶段企业采取不同的投资战略： ①产品创新阶段。技术创新国家的企业利用其垄断的技术诀窍开发新产品，此阶段替代产品少、新产品的附加价值高，绝大部分产品供应国内市场，少部分产品通过出口的形式满足国际市场的需求； ②产品成熟阶段，新技术日趋成熟，技术垄断优势逐渐减弱，国外仿制品开始出现，竞争主要集中在成本上。为了降低生产成本，企业开始对外直接投资并在国外建立子公司进行出口替代，对外直接投资的对象主要是与本国环境相似但生产成本低的其他发达国家和地区； ③产品标准化阶段，新产品和技术均已标准化，技术的垄断优势已经消失，企业可以进行大规模的批量生产，生产成本的优势进一步凸显。此阶段企业会选择在生产成本较低的发展中国家进行直接投资，并从东道国进口该产品以满足国内市场的需求。 根据题干\"在其他发达国家或地区进行对外直接投资并建立子公司进行出口替代\"，符合产品成熟阶段。 故本题选C选项。 ▊ 考点 国际直接投资企业的建立方式★","id":"gongshang-0282","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"以新建方式设立国际直接投资企业的缺点有（ ）。","material":"","options":[{"key":"A","text":"投资建设周期长"},{"key":"B","text":"容易受到当地舆论的抵制"},{"key":"C","text":"容易受到东道国法律的限制"},{"key":"D","text":"不利于迅速进行跨行业经营"},{"key":"E","text":"手续繁琐"}],"answer":["A","D"],"explanation":"本题考查在东道国建立新企业。 以新建方式设立国际直接投资企业又称绿地投资。 绿地投资的优点： ①创建新的企业不易受到东道国法律和政策上的限制，也不易受到当地舆论的抵制，选项BC错误； ②在多数国家，创建海外企业比并购海外企业的手续简单，选项E错误； ③在东道国创建新的企业，尤其是合资企业，常会享受东道国的优惠政策； ④对新创建海外企业所需要的资金一般能做出准确的估价，后续工作流程简单，其缺点包括：a. 投资建设周期长，选项A正确；b. 不利于迅速进入东道国以及其他国家市场；c. 不利于迅速进行跨行业经营，迅速实现产品与服务多样化，选项D正确。 故本题选AD选项。","id":"gongshang-0283","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"跨国并购的缺点包括（ ）。","material":"","options":[{"key":"A","text":"容易面临当地舆论抵制"},{"key":"B","text":"面临东道国法律上的障碍"},{"key":"C","text":"投资建设期长"},{"key":"D","text":"会增加市场上的竞争对手"},{"key":"E","text":"无法利用原有销售渠道"}],"answer":["A","B"],"explanation":"本题考查并购东道国企业。 跨国并购的缺点包括： ①由于目标企业所在国的会计准则与财务制度往往与东道国存在差异，所以有时候难以准确评估目标企业的真实财务情况，导致并购目标企业的实际投资金额增加； ②东道国反托拉斯法的存在以及对外来资本股权和被并购企业行业的限制，是并购行为在法律和政策上的障碍，选项B正确； ③当对一国的并购数量和并购金额较大时，常会受到当地舆论的抵制，选项A正确； ④目标企业原有契约或传统关系的存在，会成为对其进行改造的障碍。如目标企业的人员安置问题。 投资建设期长属于绿地投资的缺点，选项C错误。 跨国并购的优点包括可以利用目标企业原有的销售渠道和可以减少市场上的竞争对手，选项DE错误。 故本题选AB选项。 ▊ 考点 国际直接投资中的生产选址★","id":"gongshang-0284","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"在国际直接投资中，生产选址的影响因素不包括（ ）。","material":"","options":[{"key":"A","text":"渠道因素"},{"key":"B","text":"国家因素"},{"key":"C","text":"技术因素"},{"key":"D","text":"生产因素"}],"answer":["A"],"explanation":"本题考查生产选址的影响因素。 生产选址的影响因素有国家因素、技术因素、生产因素。 故本题选A选项。","id":"gongshang-0285","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"跨国企业在进行国际直接投资时，适合采取分散生产战略的情形是（ ）。","material":"","options":[{"key":"A","text":"贸易壁垒低"},{"key":"B","text":"预期重要的汇率将保持相对稳定"},{"key":"C","text":"区位外部性很重要"},{"key":"D","text":"产品的价值重量比低"}],"answer":["D"],"explanation":"本题考查生产选址的基本战略。 分散生产最具合理性的情形包括： ①各国之间政治、经济、文化和相对要素成本的差异对各国生产成本没有很大的影响； ②贸易壁垒高，选项A错误； ③区位外部性不是很重要，选项C错误； ④预期重要的汇率变动频繁，选项B错误； ⑤生产技术的固定成本低，最小有效规模小，且不存在柔性制造技术； ⑥产品的价值重量比低，选项D正确； ⑦产品不能满足共同需要，即各国消费者的品位和偏好存在很大差异。 故本题选D选项。 ▊ 考点 国际直接投资的收益、成本和政策工具★","id":"gongshang-0286","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"在国际直接投资的政策工具中，东道国限制外来直接投资的政策包括（ ）。","material":"","options":[{"key":"A","text":"投资领域准入限制"},{"key":"B","text":"外商投资者持股比例限制"},{"key":"C","text":"产品的国产化程度限制"},{"key":"D","text":"技术转移限制"},{"key":"E","text":"企业资本转出数量限制"}],"answer":["A","B","C","D"],"explanation":"本题考查东道国的政策工具。 限制外来直接投资最常见的两种方式是所有权限制和运作限制。 所有权限制形式有投资领域准入限制（选项A正确）和外商投资者持股比例限制（选项B正确），所有权限制是出于对国家安全和竞争的考虑，通常采取的做法是将外来投资排除在某些特定的行业之外；常见的运作限制包括产品的国产化程度（选项C正确）、出口量、技术转移（选项D正确）以及当地居民参与高层管理等方面。 企业资本转出数量限制属于母国限制国际直接投资的政策，选项E错误。 故本题选ABCD选项。","id":"gongshang-0287","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"下列属于母国限制本国企业进行国际直接投资的政策的有（ ）。","material":"","options":[{"key":"A","text":"提供资助或补贴"},{"key":"B","text":"提供低息贷款"},{"key":"C","text":"限制本国企业投资某些特定的国家"},{"key":"D","text":"采取税收政策鼓励企业在本国投资"},{"key":"E","text":"限制企业资本转出的数量"}],"answer":["C","D","E"],"explanation":"本题考查母国的政策工具。 母国可以通过政策鼓励或限制本国企业的国际直接投资。 鼓励国际直接投资的政策包括保险、资金支持、税收优惠和政治压力。限制国际直接投资的政策包括限制企业资本转出的数量，采取税收政策鼓励企业在本国投资，限制本国企业投资某些特定的国家等，选项CDE正确。 提供资助或补贴和提供低息贷款属于东道国鼓励外来直接投资的政策，选项AB错误。 故本题选CDE选项。 ▊ 考点 交易磋商及合同签订★★","id":"gongshang-0288","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"关于发盘的条件和种类的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"发盘不得使用口头形式"},{"key":"B","text":"发盘必须指定可以表示接受的受盘人"},{"key":"C","text":"按照发盘人是否受发盘的约束，发盘分为实盘和虚盘"},{"key":"D","text":"虚盘对发盘人无约束力，对受盘人有约束力"},{"key":"E","text":"实盘的特点是缺少主要交易条件"}],"answer":["B","C"],"explanation":"本题考查发盘。 发盘一般可采用书面和口头两种方式，选项A错误。 发盘必须指定可以表示接受的受盘人，按照发盘人是否受发盘的约束，发盘分为实盘和虚盘，选项BC正确。 虚盘是指对发盘人和受盘人都无约束力的发盘，选项D错误。 虚盘的特点有：①在发盘中保留条件。②发盘的内容模糊。③缺少主要交易条件，选项E错误。 故本题选BC选项。","id":"gongshang-0289","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"我国对外贸易业务中，主要采用的书面合同有（ ）。","material":"","options":[{"key":"A","text":"合同"},{"key":"B","text":"确认书"},{"key":"C","text":"协议书"},{"key":"D","text":"备忘录"},{"key":"E","text":"意向书"}],"answer":["A","B"],"explanation":"本题考查国际贸易合同签订。 我国对外贸易业务中，主要采用的书面合同是\"合同\"\"确认书\"两种。 故本题选AB选项。 ▊ 考点 国际贸易术语★★★","id":"gongshang-0290","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"国际贸易术语明确的内容不包括（ ）。","material":"","options":[{"key":"A","text":"产品产地"},{"key":"B","text":"交货地点"},{"key":"C","text":"费用划分"},{"key":"D","text":"责任"}],"answer":["A"],"explanation":"本题考查国际贸易术语。 国际贸易术语是在长期的国际贸易实践中产生的，用来表示商品的价格构成，说明交货地点，确定风险、责任、费用划分等问题的专门用语，是贸易合同中价格条款的核心内容。 故本题选A选项。","id":"gongshang-0291","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"根据《2020年国际贸易术语解释通则》，适用于任何运输方式的贸易术语是（ ）。","material":"","options":[{"key":"A","text":"CIP"},{"key":"B","text":"CFR"},{"key":"C","text":"FOB"},{"key":"D","text":"CIF"}],"answer":["A"],"explanation":"本题考查国际贸易术语。 CIP适用于任何运输方式；CFR、FOB、CIF适用于海运或内河水运。 故本题选A选项。 ▊ 考点 商品出口的主要业务环节★★★","id":"gongshang-0292","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"关于信用证修改的做法，错误的是（ ）。","material":"","options":[{"key":"A","text":"由信用证受益人向开证行提出修改申请"},{"key":"B","text":"在同一信用证上如有多处需要修改的，应当一次提出"},{"key":"C","text":"对通知行转来的修改通知书内容，如经审核不能接受时，应及时表示拒绝"},{"key":"D","text":"如一份修改通知书中包括多项内容，只能全部接受或全部拒绝"}],"answer":["A"],"explanation":"本题考查催证、审证、改证。 在审证过程中，如发现信用证内容与合同规定不符，应及时提醒开证申请人修改（选项A错误），在同一信用证上如有多处需要修改的，应当一次提出（选项B正确）。 对通知行转来的修改通知书内容，如经审核不能接受时，应及时表示拒绝（选项C正确）。 如一份修改通知书中包括多项内容，只能全部接受或全部拒绝，不能只接受其中一部分，而拒绝另一部分（选项D正确）。 故本题选A选项。","id":"gongshang-0293","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"multi","stem":"班轮运输具有\"四固定\"的特点，具体是指（ ）。","material":"","options":[{"key":"A","text":"相对固定的费率"},{"key":"B","text":"固定航线"},{"key":"C","text":"固定港口"},{"key":"D","text":"固定货物"},{"key":"E","text":"固定船期"}],"answer":["A","B","C","E"],"explanation":"本题考查班轮运输。 班轮运输具有\"四固定\"的特点，即固定航线、固定港口、固定船期和相对固定的费率。 故本题选ABCE选项。 ▊ 考点 商品进口的主要业务环节★★","id":"gongshang-0294","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"按FOB条件成交的进口合同，货物采用海运的方式进行运输，使用（ ）确定装卸时间比较公平，船、货双方均愿接受。","material":"","options":[{"key":"A","text":"连续日"},{"key":"B","text":"工作日"},{"key":"C","text":"晴天工作日"},{"key":"D","text":"连续24小时晴天工作日"}],"answer":["D"],"explanation":"本题考查装卸费用、装卸时间、装卸率。 连续24小时晴天工作日，即天气晴好、时钟连续走24小时算一个工作日，在此期间如有几个小时是坏天气不能作业，则予以扣除。这种方法比较公平，船、货双方均愿接受。 故本题选D选项。","id":"gongshang-0295","bank":"gongshang"},{"chapter":"","point":"配送管理","type":"single","stem":"对承运人发起的进口索赔被称为（ ）。","material":"","options":[{"key":"A","text":"贸易索赔"},{"key":"B","text":"运输索赔"},{"key":"C","text":"保险索赔"},{"key":"D","text":"连带索赔"}],"answer":["B"],"explanation":"本题考查进口索赔。 进口索赔的对象通常有三个，即卖方、承运人和保险人，对应的索赔分别称
