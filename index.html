"C","text":"有限责任公司"},{"key":"D","text":"股份有限公司"},{"key":"E","text":"有限两合公司（"}],"answer":["A","B","C","D"],"explanation":"本题考查公司的种类。人根据组织结构不同，公司可分为无限公司、两合公司、有限责任公司、股份有限公司和股份两合公司。故本题选ABCD选项。","id":"jichu-0268","bank":"jichu"},{"chapter":"刷章节母题 第三十六章 公司法律制度 共16题","point":"公司登记与企业信用信息公示","type":"single","stem":"公司登记事项发生变更的，应当自作出变更决议、决定或者法定变更事项发生之日起（ ）日内向登记机关申请变更登记。","material":"","options":[{"key":"A","text":"15"},{"key":"B","text":"30"},{"key":"C","text":"45"},{"key":"D","text":"60"}],"answer":["B"],"explanation":"本题考查变更登记的一般规定。 公司登记事项发生变更的，应当自作出变更决议、决定或者法定变更事项发生之 日起30日内向登记机关申请变更登记。 故本题选B选项。","id":"jichu-0269","bank":"jichu"},{"chapter":"刷章节母题 第三十六章 公司法律制度 共16题","point":"公司登记与企业信用信息公示","type":"single","stem":"公司创立行为发生效力和公司法人主体资格产生的行为，称为（ ）。","material":"","options":[{"key":"A","text":"设立登记"},{"key":"B","text":"变更登记"},{"key":"C","text":"注销登记"},{"key":"D","text":"歇业登记"}],"answer":["A"],"explanation":"本题考查设立登记的概念。公司设立登记是公司创立行为发生效力和公司法人主体资格产生的行为。故本题选A选项。","id":"jichu-0270","bank":"jichu"},{"chapter":"刷章节母题 第三十六章 公司法律制度 共16题","point":"公司的设立","type":"single","stem":"关于有限责任公司设立的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"有限责任公司最低注册资本有限额要求"},{"key":"B","text":"全体股东的货币出资金额应占注册资本的30%"},{"key":"C","text":"有限责任公司由１个以上50个以下股东出资设立"},{"key":"D","text":"全体股东首次出资额应当达到法律规定的比例（ ）。"}],"answer":["C"],"explanation":"本题考查有限责任公司的设立。设立有限责任公司，应当具备下列条件：（1）股东人数：有限责任公司由一个以上五十个以下股东出资设立（选项C正确）；（3）股东出资及公司资本方面的要求：）①有限责任公司的注册资本为在公司登记机关登记的全体股东认缴的出资额，最低限额的条款已经自2006年后取消（选项A错误）。②股东可以用货币出资，也可以用实物、知识产权、土地使用权、股权、债权等可以用货币估价并可以依法转让的非货币财产作价出资；但是，法律、行政法规规定不得作为出资的财产除外。③股东缴付出资义务及未发行义务的责任；④董事会核查出资情况及股东失权制度；③禁止股东抽逃出资；③股东出资义务加速到期。（4）设立中公司的债务承担。选项C、D的条款已经取消。故本题选C选项。","id":"jichu-0271","bank":"jichu"},{"chapter":"刷章节母题 第三十六章 公司法律制度 共16题","point":"公司的设立","type":"multi","stem":"股份有限公司设立的条件内容包括（ ）。","material":"","options":[{"key":"A","text":"由50人以下股东出资设立"},{"key":"B","text":"有符合章程规定的全体发起人认购的股本总额"},{"key":"C","text":"根据公司的情况进行股份发行、筹办等事项"},{"key":"D","text":"发起人半数以上必须是中国国籍"},{"key":"E","text":"发起人应当在公司成立前按照其认购的股份全额缴纳股款"}],"answer":["B","E"],"explanation":"本题考查公司的设立。选项A是有限责任公司设立条件之一。股份发行、筹办事项应符合法律规定，选项C错误。设立股份有限公司，应当有1人以上200人以下为发起人，其中须有半数以上的发起人在中国境内有住所，选项D错误。故本题选BE选项。","id":"jichu-0272","bank":"jichu"},{"chapter":"刷章节母题 第三十六章 公司法律制度 共16题","point":"公司的组织机构","type":"multi","stem":"根据有限责任公司的股东会议议事规则，下列决议事项中，必须经代表三分之二以上表决权的股东通过的有（ ）。","material":"","options":[{"key":"A","text":"变更公司形式"},{"key":"B","text":"解聘公司高级经理人员"},{"key":"C","text":"增加公司注册资本"},{"key":"D","text":"修改公司章程（ ）。"},{"key":"E","text":"决定公司经营计划和投资方案"}],"answer":["A","C","D"],"explanation":"本题考查股东会表决。股东会作出修改公司章程、增加或者减少注册资本的决议，以及公司合并、分立、解散或者变更公司形式的决议，应当经代表2/3以上表决权的股东通过。故本题选ACD选项。","id":"jichu-0273","bank":"jichu"},{"chapter":"刷章节母题 第三十六章 公司法律制度 共16题","point":"公司的组织机构","type":"single","stem":"根据《中华人民共和国公司法》的规定，有限责任公司设董事会，其成员为（ ）。人。","material":"","options":[{"key":"A","text":"1人以上"},{"key":"B","text":"2人以上"},{"key":"C","text":"3人以上"},{"key":"D","text":"5人以上"}],"answer":["C"],"explanation":"本题考查董事会。有限责任公司、股份有限公司董事会成员为3人以上，其成员中可以有公司职工代表。故本题选C选项。","id":"jichu-0274","bank":"jichu"},{"chapter":"刷章节母题 第三十六章 公司法律制度 共16题","point":"股东资格和股东权利","type":"single","stem":"以下不属于股东名册的内容是（ ）。","material":"","options":[{"key":"A","text":"股东的姓名或者名称及住所"},{"key":"B","text":"各股东所认购的股份种类及股份数"},{"key":"C","text":"各股东取得股份的日期"},{"key":"D","text":"股东股份取得的方式"}],"answer":["D"],"explanation":"本题考查股东资格和股东权利。股东名册应当记载下列事项：①股东的姓名或者名称及住所；②各股东所认购的股份种类及股份数；③发行纸面形式的股票的，股票的编号；④各股东取得股份的日期。故本题选D选项。","id":"jichu-0275","bank":"jichu"},{"chapter":"刷章节母题 第三十六章 公司法律制度 共16题","point":"股东资格和股东权利","type":"multi","stem":"资产收益权是指股东依法从公司取得收益、财产或者处分自已股权的权利，包括（ ）。","material":"","options":[{"key":"A","text":"表决权"},{"key":"B","text":"股息红利分配请求权"},{"key":"C","text":"知情权"},{"key":"D","text":"新股优先认购权"},{"key":"E","text":"剩余财产分配请求权"}],"answer":["B","D","E"],"explanation":"本题考查资产收益权。资产收益权是指股东依法从公司取得收益、财产或者处分自己股权的权利，包括股息红利分配请求权、剩余财产分配请求权、新股优先认购权、股权转让权等。故本题选BDE选项。","id":"jichu-0276","bank":"jichu"},{"chapter":"刷章节母题 第三十六章 公司法律制度 共16题","point":"董事、监事和高级管理人员的任职资格和法定义务","type":"multi","stem":"《中华人民共和国公司法》规定，不得担任公司的董事、监事、高级管理人员的情形包括（ ）。","material":"","options":[{"key":"A","text":"无民事行为能力或者限制民事行为能力"},{"key":"B","text":"因贪污、贿赂、侵占财产、挪用财产或者破坏社会主义市场经济秩序，被判处刑罚执行期满未逾5年（ ）。"},{"key":"C","text":"担任破产清算的公司、企业的董事或者厂长、经理，对该公司、企业的破产负有个人责任的，自该公司、企业破产清算完结之日起未逾2年"},{"key":"D","text":"担任因违法被吊销营业执照、责令关闭的公司、企业的法定代表人，并负有个人责任的，自该公司、企业被吊销营业执照、责令关闭之日起未逾3年"},{"key":"E","text":"个人因所负数额较大债务到期未清偿被人民法院列为失信被执行人"}],"answer":["A","B","D","E"],"explanation":"本题考查董事、监事和高级管理人员的任职资格。《公司法》第一百七十八条规定，有下列情形之一的，不得担任公司的董事、监事、高级管理人员：①无民事行为能力或者限制民事行为能力；②因贪污、贿赂、侵占财产、挪用财产或者破坏社会主义市场经济秩序，被判处刑罚，或者因犯罪被剥夺政治权利，执行期满未逾5年，被宣告缓刑的，自缓刑考验期满之日起未逾2年；③担任破产清算的公司、企业的董事或者厂长、经理，对该公司、企业的破产负有个人责任的，自该公司、企业破产清算完结之日起未逾3年；④担任因违法被吊销营业执照、责令关闭的公司、企业的法定代表人，并负有个人责任的，自该公司、企业被吊销营业执照、责令关闭之日起未逾3年； ③个人因所负数额较大债务到期未清偿被人民法院列为失信被执行人。 故本题选ABDE选项。","id":"jichu-0277","bank":"jichu"},{"chapter":"刷章节母题 第三十六章 公司法律制度 共16题","point":"董事、监事和高级管理人员的任职资格和法定义务","type":"multi","stem":"根据《中华人民共和国公司法》，下列公司人员中，对公司负有忠实义务和勤勉义务的有（ ）。","material":"","options":[{"key":"A","text":"职工"},{"key":"B","text":"董事"},{"key":"C","text":"高级管理人员"},{"key":"D","text":"监事"},{"key":"E","text":"股东"}],"answer":["B","C","D"],"explanation":"本题考查董事、监事和高级管理人员的法定义务。公司的董事、监事和高级管理人员应当遵守法律、行政法规和公司章程，对公司负有忠实义务和勤勉义务。故本题选BCD选项。","id":"jichu-0278","bank":"jichu"},{"chapter":"刷章节母题 第三十六章 公司法律制度 共16题","point":"股份有限公司的股份发行和转让","type":"multi","stem":"公司发行新股，股东会应作出决议的事项有（ ）。","material":"","options":[{"key":"A","text":"新股种类及数额。"},{"key":"B","text":"新股发行价格（ ）。"},{"key":"C","text":"新股发行的起止日期。"},{"key":"D","text":"向原有股东发行新股的种类及数额"},{"key":"E","text":"新股的发行范围"}],"answer":["A","B","C","D"],"explanation":"本题考查发行新股和授权资本制引入。公司发行新股，股东会应当对下列事项作出决议：①新股种类及数额；②新股发行价格；③新股发行的起止日期；④向原有股东发行新股的种类及数额。故本题选ABCD选项。","id":"jichu-0279","bank":"jichu"},{"chapter":"刷章节母题 第三十六章 公司法律制度 共16题","point":"股份有限公司的股份发行和转让","type":"multi","stem":"根据《中华人民共和国公司法》，公司可以收购本公司股份的情形包括（ ）。","material":"","options":[{"key":"A","text":"减少公司注册资本"},{"key":"B","text":"增加公司注册资本"},{"key":"C","text":"将股份用于员工持股计划"},{"key":"D","text":"与持有本公司股份的其他公司合并"},{"key":"E","text":"股东因对股东会作出的公司合并、分立决议持异议，要求公司收购其股份"}],"answer":["A","C","D","E"],"explanation":"本题考查公司收购本公司股份的规定。公司可以收购本公司股份的情形包括：①减少公司注册资本；②与持有本公司股份的其他公司合并；③将股份用于员工持股计划或者股权激励；④股东因对股东会作出的公司合并、分立决议持异议，要求公司收购其股份；③将股份用于转换上市公司发行的可转换为股票的公司债券；③上市公司为维护公司价值及股东权益所必需。故本题选ACDE选项。","id":"jichu-0280","bank":"jichu"},{"chapter":"刷章节母题 第三十六章 公司法律制度 共16题","point":"公司的合并、分立、增资、减资、解散和清算","type":"single","stem":"一个公司吸收其他公司，被吸收的公司解散，属于（ ）。","material":"","options":[{"key":"A","text":"吸收合并"},{"key":"B","text":"新设合并"},{"key":"C","text":"新设分立"},{"key":"D","text":"派生分立"}],"answer":["A"],"explanation":"本题考查公司合并。一个公司吸收其他公司为吸收合并，被吸收的公司解散。两个以上公司合并设立一个新的公司为新设合并，合并各方解散。故本题选A选项。","id":"jichu-0281","bank":"jichu"},{"chapter":"刷章节母题 第三十六章 公司法律制度 共16题","point":"公司的合并、分立、增资、减资、解散和清算","type":"multi","stem":"公司出现一定情形时可以解散，这些情形包括（ ）。","material":"","options":[{"key":"A","text":"公司章程规定的营业期限届满"},{"key":"B","text":"股东会决议解散"},{"key":"C","text":"因公司合并需要解散（ ）。"},{"key":"D","text":"因公司分立需要解散"},{"key":"E","text":"公司不能清偿到期债务。"}],"answer":["A","B","C","D"],"explanation":"本题考查公司解散。、公司解散的情形有：①公司章程规定的营业期限届满或者公司章程规定的其他解散事由出现；②股东会决议解散；③因公司合并或者分立需要解散；④依法被吊销营业执照、责令关闭或者被撤销；（ ）。③公司经营管理发生严重困难，继续存续会使股东利益受到重大损失，通过其他途径不能解决的，持有公司10%以上表决权的股东请求人民法院解散公司的，人民法院依法予以解散。故本题选ABCD选项。人","id":"jichu-0282","bank":"jichu"},{"chapter":"刷章节母题 第三十七章 其他法律制度 共12题","point":"工业产权法律制度","type":"multi","stem":"关于工业产权的内容说法正确的有（ ）。","material":"","options":[{"key":"A","text":"工业产权具有专有性、地域性和时间性的特征"},{"key":"B","text":"我国工业产权主要指专利权和商标专用权"},{"key":"C","text":"发明人或设计人可以是自然人，也可以是单位、集体或课题组"},{"key":"D","text":"专利权的客体包括发明、实用新型和外观设计"},{"key":"E","text":"声音商标属于非传统商标"}],"answer":["A","B","D","E"],"explanation":"本题考查工业产权的概念与特征。工业产权的特征包括专有性、地域性和时间性，选项A正确。工业产权与著作权统称为知识产权，在我国工业产权主要指专利权和商标专用权，选项B正确。发明人或设计人只能是自然人，不能是单位、集体或课题组，选项C错误。专利权的客体包括发明、实用新型和外观设计，选项D正确。声音商标属于非传统商标，选项E正确。故本题选ABDE选项。【乐提示】（ ）。本题中注意选项C：发明人（设计人）、专利申请人和专利权是三个不同的概念，要注意区分。（1）发明人是指对发明创造的实质性特点做出创造性贡献的人，也就是发明出产品的人。（2）发明人或者设计人，只能是自然人，不能是单位、集体或课题组。以课题组为例，课题组是由人组成的，所以最终的发明或设计人仍然是自然人。（3）专利申请人和专利权人是拥有专利申请权或专利权的人。发明（设计）人不一定就能够拥有专利申请权或专利权。如职务发明。","id":"jichu-0283","bank":"jichu"},{"chapter":"刷章节母题 第三十七章 其他法律制度 共12题","point":"工业产权法律制度","type":"single","stem":"关于我国商标注册法律制度的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"商标注册采取自愿注册的原则"},{"key":"B","text":"未经注册的商标不可以使用。"},{"key":"C","text":"商标设计必须具备显著特征，易于识别"},{"key":"D","text":"未使用注册商标的商品不得在市场上销售"}],"answer":["C"],"explanation":"本题考查商标注册的概念和条件。在我国，商标注册采用自愿注册和强制注册相结合、以自愿注册为主的制度（选项A错误)。法律、行政法规规定必须使用注册商标的商品，必须申请商标的注册，未经核准注册的，不得在市场上销售（选项D错误)。经商标管理机关核准注册的商标为注册商标，商标注册人对注册商标享有商标专用权，受法律保护。未经注册的商标虽然也可以使用，但使用人不享有专用权（选项B错误）。商标注册的积极条件为商标应当有显著特征，便于识别（选项C正确）。 故本题选C选项。","id":"jichu-0284","bank":"jichu"},{"chapter":"刷章节母题 第三十七章 其他法律制度 共12题","point":"劳动合同法律制度","type":"multi","stem":"根据《中华人民共和国劳动合同法》，应签订无固定期限劳动合同的法定情形包括（ ）。","material":"","options":[{"key":"A","text":"劳动者在该用人单位连续工作满十年"},{"key":"B","text":"劳动者在该用人单位累计工作满十年"},{"key":"C","text":"用人单位初次实行劳动合同制度或者国有企业改制重新订立劳动合同时，劳动者在该用人单位连续工作满十年且距法定退休年龄不足十年的"},{"key":"D","text":"连续订立两次固定期限劳动合同的，而且单位对劳动者依法不能享有法定解除权，续订劳动合同"},{"key":"E","text":"劳动者在该用人单位连续工作满10年，劳动者提出订立固定期限劳动合同"}],"answer":["A","C","D"],"explanation":"本题考查劳动合同的类型。用人单位与劳动者协商一致，可以订立无固定期限劳动合同。有下列情形之一，劳动者提出或者同意续订、订立劳动合同的，除劳动者提出订立固定期限劳动合同外，应当订立无固定期限劳动合同：、（①劳动者在该用人单位连续工作满10年的（选项A正确，选项B、E错误)；②用人单位初次实行劳动合同制度或者国有企业改制重新订立劳动合同时，劳动者在该用人单位连续工作满10年且距法定退休年龄不足10年的（选项C正确）；③连续订立2次固定期限劳动合同，且用人单位对劳动者没有依《劳动合同法》规定的法定解除权，续订劳动合同的（选项D正确）。用人单位自用工之日起满1年不与劳动者订立书面劳动合同的，视为用人单位与劳动者已订立无固定期限劳动合同。故本题选ACD选项。","id":"jichu-0285","bank":"jichu"},{"chapter":"刷章节母题 第三十七章 其他法律制度 共12题","point":"劳动合同法律制度","type":"multi","stem":"下列关于劳动合同法律制度的内容说法不正确的有（ ）。","material":"","options":[{"key":"A","text":"劳动者在该用人单位连续工作满10年的，除劳动者提出订立固定期限劳动合同外，应当订立无固定期限劳动合同"},{"key":"B","text":"订立劳动合同，应当遵循合法、公平、平等自愿、协商一致、诚实信用原则"},{"key":"C","text":"用人单位与劳动者在用工前订立劳动合同的，劳动关系自订立劳动合同之日起建立"},{"key":"D","text":"试用期和劳动合同期限是劳动合同的必备条款"},{"key":"E","text":"劳动合同被确认无效，劳动者已付出劳动的，用人单位应当向劳动者支付劳动报酬，劳动报酬的数额，参照所在地最低工资标准确定"}],"answer":["C","D","E"],"explanation":"本题考查劳动合同的订立。有下列情形之一，劳动者提出或者同意续订、订立劳动合同的，除劳动者提出订立固定期限劳动合同外，应当订立无固定期限劳动合同：①劳动者在该用人单位连续工作满10年的（选项A正确）。②用人单位初次实行劳动合同制度或者国有企业改制重新订立劳动合同时，劳动者在该用人单位连续工作满10年且距法定退休年龄不足10年的；③连续订立2次固定期限劳动合同，而且用人单位对劳动者没有依《劳动合同法》规定的法定解除权，续订劳动合同的，用人单位自用工之日起满1年不与劳 动者订立书面劳动合同的，视为用人单位与劳动者已订立无固定期限劳动合同。 《劳动合同法》规定，订立劳动合同，应当遵循：合法、公平、平等自愿、协商 一致、诚实信用原则（选项B正确）。 建立劳动关系，应当订立书面劳动合同。已建立劳动关系，未同时订立书面劳动 合同的，应当自用工之日起1个月内订立书面劳动合同。用人单位与劳动者在用 工前订立劳动合同的，劳动关系自用工之日起建立（选项C错误）。 劳动合同的必备条款包括： ①用人单位的名称、住所和法定代表人或者主要负责人； ②劳动者的姓名、住址和居民身份证或者其他有效身份证件号码； ③劳动合同期限； ④工作内容和工作地点； ③工作时间和休息休假; ③劳动报酬； 社会保险； ③劳动保护、劳动条件和职业危害防护等； ③法律法规规定应当纳入劳动合同的其他事项（选项D错误）。 劳动合同部分无效，不影响其他部分效力的，其他部分仍然有效。劳动合同被确 认无效，劳动者已付出劳动的，用人单位应当向劳动者支付劳动报酬。劳动报酬 的数额，参照本单位相同或者相近岗位劳动者的劳动报酬确定（选项E错误)。 故本题选CDE选项。","id":"jichu-0286","bank":"jichu"},{"chapter":"刷章节母题 第三十七章 其他法律制度 共12题","point":"消费者权益保护法律制度","type":"multi","stem":"根据《中华人民共和国消费者权益保护法》，下列权利中，属于消费者法定权利的有（ ）。","material":"","options":[{"key":"A","text":"安全保障权"},{"key":"B","text":"无条件退货权"},{"key":"C","text":"自主选择权"},{"key":"D","text":"公平交易权"},{"key":"E","text":"知悉真情权"}],"answer":["A","C","D","E"],"explanation":"本题考查消费者的权利。《消费者权益保护法》对消费者的倾斜性保护，体现在以立法方式明确消费者的各项权利，包括以下几方面内容：①安全保障权（人身、财产安全不受侵害）；②知悉真情权；③自主选择权；④公平交易权（公平交易、拒绝强制交易）；③依法求偿权；③依法结社权：消费者享有依法成立维护合法权益的社会团体；求教获知权；③维护尊严权：人格尊严、民族风格习惯得到尊重；个人信息权；监督批评权。故本题选ACDE选项。","id":"jichu-0287","bank":"jichu"},{"chapter":"刷章节母题 第三十七章 其他法律制度 共12题","point":"消费者权益保护法律制度","type":"single","stem":"消费者李某从甲商场购买一个乙厂生产的电饭煲，使用时电饭煲发生爆炸，造成李某和其家人烫伤。关于李某主张权利的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"李某只能向消费者协会进行投诉，由消费者协会决定索赔事项"},{"key":"B","text":"李某只能向甲商场要求赔偿"},{"key":"C","text":"李某可以向甲商场要求赔偿，也可以向乙厂要求赔偿"},{"key":"D","text":"李某只能向乙厂要求赔偿"}],"answer":["C"],"explanation":"本题考查消费争议解决。消费者或者其他受害人因商品缺陷造成人身、财产损害的，可以向销售者要求赔偿，也可以向生产者要求赔偿。故本题选C选项。","id":"jichu-0288","bank":"jichu"},{"chapter":"刷章节母题 第三十七章 其他法律制度 共12题","point":"反垄断法律制度人","type":"single","stem":"反垄断执法机构调查涉嫌垄断行为，不能采取的措施是（ ）。","material":"","options":[{"key":"A","text":"进入被调查的经营者的营业场所或者其他有关场所进行检查"},{"key":"B","text":"询问被调查的经营者、利害关系人或者其他有关单位或者个人，要求其说明有关情况"},{"key":"C","text":"冻结经营者的银行账户"},{"key":"D","text":"查封、扣押相关证据"}],"answer":["C"],"explanation":"本题考查反垄断机构设置。反垄断执法机构调查涉嫌垄断行为，可以采取下列措施：①进入被调查的经营者的营业场所或者其他有关场所进行检查；②询问被调查的经营者、利害关系人或者其他有关单位或者个人，要求其说明有关情况；③查阅、复制被调查的经营者、利害关系人或者其他有关单位或者个人的有关单 证、协议、会计账簿、业务函电、电子数据等文件、资料； ④查封、扣押相关证据； ③查询经营者的银行账户。 采用上述规定的措施，应当向反垄断执法机构主要负责人书面报告，并经批准。 进入被调查的经营者的营业场所或者其他有关场所进行检查，选项A正确。 询问被调查的经营者、利害关系人或者其他有关单位或者个人，要求其说明有关 情况选项，选项B正确。 冻结经营者的银行账户错误，只能是查询，选项C错误。 查封、扣押相关证据，选项D正确。 故本题选C选项。","id":"jichu-0289","bank":"jichu"},{"chapter":"刷章节母题 第三十七章 其他法律制度 共12题","point":"反垄断法律制度人","type":"multi","stem":"经营者能够证明所达成的协议属于特定情形的，可被《反垄断法》豁免，这些情形包括（ ）。","material":"","options":[{"key":"A","text":"固定商品价格的"},{"key":"B","text":"为实现节约能源、保护环境、救灾救助等社会公共利益的"},{"key":"C","text":"因经济不景气，为缓解销售量严重下降或者生产明显过剩的"},{"key":"D","text":"为改进技术、研究开发新产品的"},{"key":"E","text":"限定向第三人转售商品的最低价格（ ）。"}],"answer":["B","C","D"],"explanation":"本题考查垄断行为。·（ ）。垄断协议的豁免是指不以限制竞争为目的，为某种公共利益而达成的合意或者一致行动，反垄断法是允许的。其情形包括：①为改进技术、研究开发新产品的②为提高产品质量、降低成本、增进效率、统一产品规格、标准或者实行专业化分工的。③为提高中小经营者经营效率，增强中小经营者竞争力的④为实现节约能源、保护环境、救灾救助等社会利益的（ ）。③因经济不景气，为缓解销售量严重下降或者生产明显过剩的③为保障对外贸易和对外经济合作中的正当利益的上述①-③经营者还应当证明所达成的协议不会严重限制相关市场的竞争，并且能够使消费者分享由此产生的利益，选项B、C、D正确。选项A错误，固定或者变更商品价格属于具有竞争关系的经营者达成的垄断协议（横向垄断协议）。选项E错误，限定向第三人转售商品的最低价格属于经营者与交易相对人达成的垄断协议（纵向垄断协议)。故本题选BCD选项。","id":"jichu-0290","bank":"jichu"},{"chapter":"刷章节母题 第三十七章 其他法律制度 共12题","point":"反不正当竞争法律制度","type":"multi","stem":"根据《中华人民共和国反不正当竞争法》，下列行为中，属于不正当竞争行为的是（ ）。","material":"","options":[{"key":"A","text":"乙厂在其饮料包装上使用“雷碧”的名称，而“雪碧”是知名饮料"},{"key":"B","text":"丙企业将牛奶的生产日期推迟了5天标志在产品外包装上"},{"key":"C","text":"丁商场采取抽奖式的销售策略，最高奖项为价值1000元购物券"},{"key":"D","text":"甲企业为清偿其债务，低于市场价格销售产品"},{"key":"E","text":"戊企业规定，销售一台空调给中间人4%的佣金，如实入账"}],"answer":["A","B"],"explanation":"本题考查不正当竞争行为的种类。选项A正确，属于不正当竞争行为的混淆行为。选项B正确，属于不正当竞争行为虚假宣传行为。选项C错误，没超过5万元，不属于不正当竞争行为。选项E错误，经营者在交易活动中，可以以明示方式向交易相对方支付折扣，或者向中间人支付佣金。选项D错误，为清偿债务降价销售，属于法律明确规定的除外情形，不构成不正当竞争。故本题选AB选项。","id":"jichu-0291","bank":"jichu"},{"chapter":"刷章节母题 第三十七章 其他法律制度 共12题","point":"反不正当竞争法律制度","type":"multi","stem":"根据《中华人民共和国反不正当竞争法》，下列（ ）行为给被侵权人造成的实际损失，侵权人因侵权所获得的利益难以确定的，由法院根据侵权行为的情节判决给予权利人500万元以下的赔偿。","material":"","options":[{"key":"A","text":"为独占市场而以低于成本的价格销售商品"},{"key":"B","text":"从事混淆.侵犯商业秘密（ ）。"},{"key":"C","text":"不正当有奖销售"},{"key":"D","text":"低毁商誉"}],"answer":["B","C"],"explanation":"本题考查违反反不正当竞争法的法律责任。从事混淆行为和侵犯商业秘密的行为给被侵权人造成的实际损失，侵权人因侵权所获得的利益难以确定的，由法院根据侵权行为的情节判决给予权利人500万元以下的赔偿。故本题选BC选项。","id":"jichu-0292","bank":"jichu"},{"chapter":"刷章节母题 第三十七章 其他法律制度 共12题","point":"产品质量法律制度","type":"single","stem":"根据《中华人民共和国产品质量法》，下列物品中，属于“产品”的是（ ）。","material":"","options":[{"key":"A","text":"经过加工制作并用于销售的建筑材料人"},{"key":"B","text":"天然的物品"},{"key":"C","text":"建设工程"},{"key":"D","text":"自产自用的物品"}],"answer":["A"],"explanation":"本题考查产品质量法概述。《产品质量法》所称产品是指经过加工、制作，用于销售的产品。天然存在或自然生长的物品，以及非用于销售的物品，均不属于该法界定的产品范围。此外，《产品质量法》规定，建设工程不适用该法规定；但建设工程使用的建筑材料、建筑构配件和设备，属于该法规定的产品范围的，适用该法规定。故本题选A选项。","id":"jichu-0293","bank":"jichu"},{"chapter":"刷章节母题 第三十七章 其他法律制度 共12题","point":"产品质量法律制度","type":"multi","stem":"根据《中华人民共和国产品质量法》，产品或者包装上的标识除必须真实外，还（ ）。","material":"","options":[{"key":"A","text":"有产品质量检验合格证明"},{"key":"B","text":"有中文标明的产品，名称、生产厂名和厂址"},{"key":"C","text":"产品说明的内容可以由生产者根据实际使用需要进行相应调整"},{"key":"D","text":"限期使用的产品，应当在显著位置清晰地标明生产日期和安全使用期限或者失效日期"},{"key":"E","text":"使用不当，容易造成产品本身损坏或者可能危及人身、财产安全的产品，应该进行标识"}],"answer":["A","B","D","E"],"explanation":"本题考查生产者的产品质量义务。产品或者其包装上的标识必须真实，并符合下列要求：①有产品质量检验的合格证明；②有中文标明的产品名称、产厂的厂名和地址；③根据产品的特点和使用要求，需要标明产品规格、等级、主要成分的名称和含量的，用中文相应予以标明；需要事先让消费者知晓的，应当在外包装上标明或者预先向消费者提供有关资料；④限期使用的产品，应当在显著位置清晰地标明生产日期和安全使用期或者失效日期。故本题选ABDE选项。","id":"jichu-0294","bank":"jichu"}]},{"id":"gongshang","name":"工商管理 · 章节母题","questions":[{"chapter":"","point":"企业战略与企业战略管理的内涵","type":"single","stem":"下列不属于企业战略的特征的是（ ）。","material":"","options":[{"key":"A","text":"全局性与复杂性"},{"key":"B","text":"稳定性与动态性"},{"key":"C","text":"长期性与短期性"},{"key":"D","text":"收益性与风险性"}],"answer":["C"],"explanation":"本题考查企业战略的特征。 企业战略的特征： （1）全局性与复杂性 （2）稳定性与动态性 （3）收益性与风险性 故本题选 C 选项。","id":"gongshang-0001","bank":"gongshang"},{"chapter":"","point":"企业战略与企业战略管理的内涵","type":"multi","stem":"下列关于企业战略管理者的表述，正确的有（ ）。","material":"","options":[{"key":"A","text":"按照企业的职能层次结构，可以将企业战略管理者划分为三个层次，即高层、中层和基层"},{"key":"B","text":"高层战略管理者是总体战略的责任者，其战略管理的重点是确立企业的核心价值观，制定和实施企业的使命、目标、政策和策略"},{"key":"C","text":"中层战略管理者是企业业务战略的责任者，其战略重点是制定和实施企业总体战略下的相关业务战略"},{"key":"D","text":"基层战略管理者是企业职能战略的责任者，其战略重点是使各职能部门的功能协调配合，确保企业总体战略、企业业务战略的具体落实"},{"key":"E","text":"战略的实施和控制是企业高层战略管理者的主要职责"}],"answer":["A","B","C","D"],"explanation":"本题考查企业战略管理的内涵。 企业总体战略的制定和决策是企业高层战略管理者的主要职责，战略的实施和控制是企业中层、基层战略管理者的主要职责，选项 E 错误。 故本题选 ABCD 选项。","id":"gongshang-0002","bank":"gongshang"},{"chapter":"","point":"企业战略的制定","type":"single","stem":"企业战略制定的第一步是（ ）。","material":"","options":[{"key":"A","text":"确定企业使命与目标"},{"key":"B","text":"评价和确定战略方案"},{"key":"C","text":"分析外部环境，评估自身的能力"},{"key":"D","text":"识别和鉴定现行的战略"}],"answer":["A"],"explanation":"本题考查企业战略的制定。 企业战略制定内容包括： （1）确定企业愿景、使命与战略目标； （2）准备战略方案； （3）评价和选择战略方案。 故本题选 A 选项。","id":"gongshang-0003","bank":"gongshang"},{"chapter":"","point":"企业战略的制定","type":"multi","stem":"企业的战略目标因企业的类型和使命不同而各不相同，一般可分为（ ）。","material":"","options":[{"key":"A","text":"盈利"},{"key":"B","text":"服务"},{"key":"C","text":"员工"},{"key":"D","text":"顾客"},{"key":"E","text":"社会责任"}],"answer":["A","B","C","E"],"explanation":"本题考查企业战略目标。 企业的战略目标因企业的类型和使命不同而各不相同，一般可分为盈利、服务、员工和社会责任四个方面。 故本题选 ABCE 选项。","id":"gongshang-0004","bank":"gongshang"},{"chapter":"","point":"企业战略的实施","type":"multi","stem":"关于企业战略实施的模式，下列表述错误的有（ ）。","material":"","options":[{"key":"A","text":"变革型模式较适合于复杂而又缺少稳定性环境的企业"},{"key":"B","text":"合作型模式比较适合于环境确定性较大的企业"},{"key":"C","text":"增长型对管理者的要求很高，它要能正确评判下层的各种建议，淘汰不适当的方案"},{"key":"D","text":"指挥型模式的特点是企业高层领导考虑的是如何制定一个最佳战略"},{"key":"E","text":"在变革型模式中，企业高层领导制定战略的同时，也更加关注如何实施战略"}],"answer":["A","B"],"explanation":"本题考查企业战略实施的模式。 变革型模式较适合于环境确定性较大的企业，选项 A 错误。 合作型模式比较适合于复杂而又缺少稳定性环境的企业，选项 B 错误。 故本题选 AB 选项。","id":"gongshang-0005","bank":"gongshang"},{"chapter":"","point":"企业战略的实施","type":"multi","stem":"麦肯锡公司提出的 7S 模型中，属于企业成功的“硬件要素”是（ ）。","material":"","options":[{"key":"A","text":"企业人员"},{"key":"B","text":"企业战略"},{"key":"C","text":"企业风格"},{"key":"D","text":"企业结构"},{"key":"E","text":"企业制度"}],"answer":["B","D","E"],"explanation":"本题考查 7S 模型。 麦肯锡公司提出的 7S 模型指出，企业在发展过程中，需要全面考虑结构、制度、人员、风格、技能、战略和共同价值观这七个方面的情况。 该模型认为，企业战略、结构和制度是企业成功的“硬件”，选项 BDE 正确； 而风格、人员、技能和共同价值观是企业成功的“软件”。 企业人员、企业风格属于软件要素，选项 AC 错误。 故本题选 BDE 选项。","id":"gongshang-0006","bank":"gongshang"},{"chapter":"","point":"企业战略的控制","type":"single","stem":"某企业在战略控制过程中严格但不乏弹性，切忌过度。控制的范围、程度和频度要恰到好处，否则，控制过多可能会引起混乱和目标移位。这体现了战略控制的（ ）原则。","material":"","options":[{"key":"A","text":"确保目标"},{"key":"B","text":"适度控制"},{"key":"C","text":"适应性"},{"key":"D","text":"适时控制"}],"answer":["B"],"explanation":"本题考查战略控制的原则。 选项 A 错误，确保目标原则指战略控制过程是确保实现企业目标的过程，通过执行战略计划来确保战略目标的实现。 选项 B 正确，适度控制原则指控制过程要严格但不乏弹性，切忌控制过度。控制过度可能会引起混乱和目标移位。 选项 C 错误，适应性原则指控制要能够反映不同经营业务的性质与需要。 选项 D 错误，适时控制原则指控制要掌握适当时机、选择适当的契机进行战略修正，要尽可能避免在不该修正时采取行动或者在需要修正时没有及时采取行动。 故本题选 B 选项。","id":"gongshang-0007","bank":"gongshang"},{"chapter":"","point":"企业战略的控制","type":"multi","stem":"在战略控制过程中，企业可以选择的战略控制方法有（ ）。","material":"","options":[{"key":"A","text":"平衡计分卡"},{"key":"B","text":"PESTEL 分析法"},{"key":"C","text":"杜邦分析法"},{"key":"D","text":"核心竞争力分析法"},{"key":"E","text":"利润计划轮盘"}],"answer":["A","C","E"],"explanation":"本题考查战略控制的方法。 战略控制的方法有：杜邦分析法，平衡计分卡，利润计划轮盘，选项 ACE 正确。 PESTEL 分析法是外部宏观环境分析方法，选项 B 错误； 核心竞争力分析法属于企业内部环境分析方法，选项 D 错误。 故本题选 ACE 选项。","id":"gongshang-0008","bank":"gongshang"},{"chapter":"","point":"企业外部环境分析","type":"multi","stem":"企业进行战略环境分析时，外部环境分析的主要包括（ ）。","material":"","options":[{"key":"A","text":"宏观环境分析"},{"key":"B","text":"行业环境分析"},{"key":"C","text":"价值链分析"},{"key":"D","text":"经营和竞争环境分析"},{"key":"E","text":"SWOT 分析"}],"answer":["A","B","D"],"explanation":"本题考查企业外部环境分析。 外部环境分析主要包括宏观环境分析、行业环境分析以及经营和竞争环境分析，选项 ABD 正确。 价值链分析属于企业内部环境分析，选项 C 错误。 SWOT 分析为企业综合分析，选项 E 错误。 故本题选 ABD 选项。","id":"gongshang-0009","bank":"gongshang"},{"chapter":"","point":"企业外部环境分析","type":"multi","stem":"企业进行行业环境分析时，行业环境分析的主要内容有（ ）。","material":"","options":[{"key":"A","text":"社会环境分析"},{"key":"B","text":"行业生命周期分析"},{"key":"C","text":"企业核心竞争力分析"},{"key":"D","text":"行业竞争结构分析"},{"key":"E","text":"战略群体分析"}],"answer":["B","D","E"],"explanation":"本题考查行业环境分析。 企业外部行业环境分析的主要内容有： （1）行业生命周期分析； （2）行业竞争结构分析； （3）战略群体分析，选项 BDE 正确。 社会环境分析属于外部宏观环境分析的内容，选项 A 错误。 企业核心竞争力分析属于企业内部环境分析的内容，选项 C 错误。 故本题选 BDE 选项。","id":"gongshang-0010","bank":"gongshang"},{"chapter":"","point":"企业内部环境分析","type":"multi","stem":"下列分析方法中，适用于分析企业内部环境的有（ ）。","material":"","options":[{"key":"A","text":"PESTEL 分析法"},{"key":"B","text":"波特五力模型"},{"key":"C","text":"价值链分析法"},{"key":"D","text":"核心竞争力分析法"},{"key":"E","text":"波士顿矩阵分析法"}],"answer":["C","D","E"],"explanation":"本题考查企业内部环境分析。 企业内部环境分析包括：企业核心竞争力分析、价值链分析、波士顿矩阵分析、内部因素评价矩阵和 VRIO 框架分析法，选项 CDE 正确。 PESTEL 分析法和波特五力模型属于企业外部环境分析方法，选项 AB 错误。 故本题选 CDE 选项。","id":"gongshang-0011","bank":"gongshang"},{"chapter":"","point":"企业内部环境分析","type":"multi","stem":"企业进行内部战略环境分析的方法有（ ）。","material":"","options":[{"key":"A","text":"PESTEL 分析法"},{"key":"B","text":"价值链分析法"},{"key":"C","text":"核心竞争力分析法"},{"key":"D","text":"SWOT 分析法"},{"key":"E","text":"内部因素评价矩阵"}],"answer":["B","C","E"],"explanation":"本题考查企业内部环境分析。 内部环境分析方法有：核心竞争力分析、价值链分析、波士顿矩阵分析、内部因素评价矩阵和 VRIO 框架分析法，选项 BCE 正确。 PESTEL 分析法属于外部环境分析的方法，选项 A 错误。 SWOT 属于综合环境分析法，选项 D 错误。 故本题选 BCE 选项。","id":"gongshang-0012","bank":"gongshang"},{"chapter":"","point":"企业综合分析","type":"single","stem":"下列（ ）方法属于企业综合环境分析法。","material":"","options":[{"key":"A","text":"PEST 分析法"},{"key":"B","text":"五力模型法"},{"key":"C","text":"价值链法"},{"key":"D","text":"SWOT 分析法"}],"answer":["D"],"explanation":"本题考查构造 SWOT 分析矩阵。 进行企业综合分析常用 SWOT 分析法，选项 D 正确。 PESTEL 分析法是宏观环境分析方法，选项 A 错误。 五力模型法是行业环境分析法，选项 B 错误。 价值链分析是企业内部环境分析方法，选项 C 错误。 故本题选 D 选项。","id":"gongshang-0013","bank":"gongshang"},{"chapter":"","point":"企业综合分析","type":"single","stem":"企业进行综合分析常用的分析方法是（ ）。","material":"","options":[{"key":"A","text":"PESTEL 分析法"},{"key":"B","text":"SWOT 分析法"},{"key":"C","text":"波士顿矩阵分析"},{"key":"D","text":"波特的“五力模型”"}],"answer":["B"],"explanation":"本题考查企业综合分析。 进行企业综合分析常用 SWOT 分析法，选项 B 正确。 PESTEL 分析法属于宏观环境分析的方法，选项 A 错误。 波士顿矩阵分析属于企业内部环境分析，选项 C 错误。 波特的“五力模型”属于行业生命周期分析，选项 D 错误。 故本题选 B 选项。","id":"gongshang-0014","bank":"gongshang"},{"chapter":"","point":"基本竞争战略","type":"single","stem":"某牛奶生产企业采用成本领先战略进行市场竞争，则其做法有（ ）。","material":"","options":[{"key":"A","text":"加强内部控制，提高生产效率"},{"key":"B","text":"创立新品牌突出产品竞争力"},{"key":"C","text":"提高产品质量，生产高质量产品"},{"key":"D","text":"提供独特的服务，以服务取胜"}],"answer":["A"],"explanation":"本题考查成本领先战略。 成本领先战略又称低成本战略，即企业的全部成本低于竞争对手的成本，甚至是同行业中的最低成本。其核心就是企业加强内部成本控制，选项 A 正确。 创立新品牌突出产品竞争力、高产品质量，生产高质量产品和提供独特的服务，以服务取胜均是差异化战略的做法，选项 BCD 错误。 故本题选 A 选项。","id":"gongshang-0015","bank":"gongshang"},{"chapter":"","point":"基本竞争战略","type":"single","stem":"当企业研发和营销能力较强、经营的产品市场异质性又比较高时，企业应选择的市场战略为（ ）。","material":"","options":[{"key":"A","text":"低成本战略"},{"key":"B","text":"集中战略"},{"key":"C","text":"差异化战略"},{"key":"D","text":"无差异化战略"}],"answer":["C"],"explanation":"本题考查差异化战略的适用范围。 差异化战略适用于符合以下条件的企业： （1）企业有一定数量且研究开发能力强的研发人员、敏锐的市场意识和创新精神，能够及时了解顾客需求，不断地在产品及服务中创造出独特性。 （2）企业在产品或服务上要具有领先的声望，具有很高的知名度和美誉度。 （3）企业要有很强的市场营销能力。 （4）企业内部的研究开发、生产制造和市场营销等职能部门之间要有很好的协作性。 根据题干描述“研发和营销能力较强、经营的产品市场异质性又比较高时”，可知选择差异化战略比较合适。 故本题选 C 选项。","id":"gongshang-0016","bank":"gongshang"},{"chapter":"","point":"企业成长战略","type":"multi","stem":"下列属于密集型成长战略的有（ ）。","material":"","options":[{"key":"A","text":"市场渗透战略"},{"key":"B","text":"市场开发战略"},{"key":"C","text":"新产品开发战略"},{"key":"D","text":"相关多元化战略"},{"key":"E","text":"股权式战略联盟"}],"answer":["A","B","C"],"explanation":"本题考查密集型成长战略。 一般来说，密集型成长战略主要有市场渗透、市场开发和新产品开发三种具体的战略形式，选项 ABC 正确。 相关多元化战略属于多元化战略，选项 D 错误。 股权式战略联盟属于战略联盟，选项 E 错误。 故本题选 ABC 选项","id":"gongshang-0017","bank":"gongshang"},{"chapter":"","point":"企业成长战略","type":"multi","stem":"一体化战略具体包括（ ）。","material":"","options":[{"key":"A","text":"纵向一体化战略"},{"key":"B","text":"前向一体化战略"},{"key":"C","text":"横向一体化战略"},{"key":"D","text":"后向一体化战略"},{"key":"E","text":"非相关多元化战略"}],"answer":["A","B","C","D"],"explanation":"本题考查一体化战略。 一体化战略具体包括纵向一体化战略和横向一体化战略。其中，纵向一体化战略又包括后向一体化战略和前向一体化战略。 选项 E 非相关多元化战略属于多元化战略类型。 故本题选 ABCD 选项。","id":"gongshang-0018","bank":"gongshang"},{"chapter":"","point":"企业稳定战略","type":"multi","stem":"在企业战略类型中，属于稳定战略的有（ ）。","material":"","options":[{"key":"A","text":"无变化战略"},{"key":"B","text":"维持利润战略"},{"key":"C","text":"暂停战略"},{"key":"D","text":"谨慎实施战略"},{"key":"E","text":"清算战略"}],"answer":["A","B","C","D"],"explanation":"本题考查企业稳定战略。 企业稳定战略主要包括无变化战略、维持利润战略、暂停战略和谨慎实施战略。 选项 E 属于企业紧缩战略。 故本题选 ABCD 选项。","id":"gongshang-0019","bank":"gongshang"},{"chapter":"","point":"企业稳定战略","type":"single","stem":"当企业实施稳定战略时，可以选择的战略类型主要包括无变化战略、维持利润战略、谨慎实施战略和（ ）。","material":"","options":[{"key":"A","text":"转向战略"},{"key":"B","text":"暂停战略"},{"key":"C","text":"清算战略"},{"key":"D","text":"放弃战略"}],"answer":["B"],"explanation":"本题考查企业稳定战略。 稳定战略主要类型包括：无变化战略、维持利润战略、暂停战略和谨慎实施战略，选项 B 正确。 转向战略、清算战略和放弃战略属于企业紧缩战略，选项 ACD 错误。 故本题选 B 选项。","id":"gongshang-0020","bank":"gongshang"},{"chapter":"","point":"企业紧缩战略","type":"multi","stem":"下列企业战略中，属于紧缩战略的有（ ）。","material":"","options":[{"key":"A","text":"保持利润战略"},{"key":"B","text":"转向战略"},{"key":"C","text":"放弃战略"},{"key":"D","text":"谨慎实施战略"},{"key":"E","text":"新产品开发战略"}],"answer":["B","C"],"explanation":"本题考查紧缩战略。 紧缩战略是企业从目前的经营战略领域和基础水平上收缩和撤退，且偏离起点较 大的一种战略。 具体类型包括三种：转向战略；放弃战略；清算战略，选项 BC 正确。 保持利润战略和谨慎实施战略属于企业稳定战略，选项 AD 错误 新产品开发战略属于密集型成长战略，选项 E 错误。 故本题选 BC 选项。","id":"gongshang-0021","bank":"gongshang"},{"chapter":"","point":"企业紧缩战略","type":"single","stem":"为了扭转亏损，某家电生产企业将旗下的洗衣机事业部整体出售，这一做法表明该企业采取的战略是（ ）。","material":"","options":[{"key":"A","text":"放弃战略"},{"key":"B","text":"暂停战略"},{"key":"C","text":"转向战略"},{"key":"D","text":"清算战略"}],"answer":["A"],"explanation":"本题考查企业紧缩战略。 在转向战略无效时，可采取放弃战略。放弃战略是指将企业的一个或几个主要部门转让、出卖或停止经营的战略。这个部门可以是一个经营单位、一条生产线或者一个事业部。 故本题选 A 选项。","id":"gongshang-0022","bank":"gongshang"},{"chapter":"","point":"企业经营决策的概念和类型☆","type":"multi","stem":"关于经营决策的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"经营决策要有明确的目标"},{"key":"B","text":"经营决策要有多个备选方案供选择"},{"key":"C","text":"经营决策均是有关企业未来发展的全局性、整体性的重大决策"},{"key":"D","text":"决策者是企业经营决策的主体"},{"key":"E","text":"经营决策必须在有关活动尚未进行、环境条件并未受到影响的情况下进行"}],"answer":["A","B","D"],"explanation":"本题考查企业经营决策的概念和类型。 选项 C 错误，根据决策的重要性分类，与企业战略的层次相对应，经营决策可分为企业总体层经营决策、业务层经营决策和职能层经营决策，可知不是所有类型的决策都是重大的； 选项 E 错误，根据决策的类型中环境因素可控程度划分的类型可知，环境因素可能是不可控的，也可能存在风险，受到影响。 故本题选 ABD 选项。","id":"gongshang-0023","bank":"gongshang"},{"chapter":"","point":"企业经营决策的概念和类型☆","type":"single","stem":"关于企业经营决策的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"企业经营决策要有明确的目标"},{"key":"B","text":"企业经营决策可分为单目标决策和多目标决策"},{"key":"C","text":"决策者是企业经营决策的主体"},{"key":"D","text":"决策树分析法适用于分析比较简单的问题"}],"answer":["D"],"explanation":"本题考查企业经营决策。 决策树分析法是指将构成决策方案的有关因素以树状图形的方式表现出来，并据以分析和选择决策方案的一种系统分析法。它是风险型决策最常用的方法之一，特别适用于分析比较复杂的问题，选项 D 错误。 故本题选 D 选项。","id":"gongshang-0024","bank":"gongshang"},{"chapter":"","point":"企业经营决策的要素","type":"multi","stem":"企业经营决策的要素包括（ ）。","material":"","options":[{"key":"A","text":"决策条件"},{"key":"B","text":"决策者"},{"key":"C","text":"决策目标"},{"key":"D","text":"决策时间"},{"key":"E","text":"决策备选方案"}],"answer":["A","B","C","E"],"explanation":"本题考查企业经营决策的要素。 经营决策的要素主要有：（1）决策者；（2）决策目标；（3）决策备选方案；（4）决策条件；（5）决策结果。 故本题选 ABCE 选项。","id":"gongshang-0025","bank":"gongshang"},{"chapter":"","point":"企业经营决策的要素","type":"single","stem":"下列企业经营决策的要素中，（ ）的确立是科学决策的起点，为决策指明了方向，也为决策实施的控制提供了依据。","material":"","options":[{"key":"A","text":"决策者"},{"key":"B","text":"决策目标"},{"key":"C","text":"决策条件"},{"key":"D","text":"决策方案"}],"answer":["B"],"explanation":"本题考查企业经营决策的要素。 企业经营决策目标是指决策所要达到的目的。决策目标的确立是科学决策的起点，它为决策指明了方向，为选择行动方案提供了衡量标准，也为决策实施的控制提供了依据。 故本题选 B 选项。","id":"gongshang-0026","bank":"gongshang"},{"chapter":"","point":"企业经营决策的流程☆","type":"multi","stem":"下列关于经营决策的流程说法正确的是（ ）。","material":"","options":[{"key":"A","text":"确定目标是经营决策的前提"},{"key":"B","text":"拟定方案是企业经营决策中最关键的一步"},{"key":"C","text":"选定方案阶段要注意方案选择的标准是否科学合理"},{"key":"D","text":"执行过程要具有监督和控制环节，及时解决执行中的问题"},{"key":"E","text":"评价阶段是经营决策的最后一个流程"}],"answer":["A","C","D","E"],"explanation":"本题考查企业经营决策的流程。 确定目标是决策的前提（选项 A 正确）。科学的决策流程，大致包括五个阶段：确定目标、拟订方案、选定方案、方案实施和监督及评价五个阶段（选项 E 正确）。选定方案阶段是经营决策的最关键的一步（选项 B 错误）。选择企业经营决策方 案时，要注意以下问题：①方案是否能够实现企业的目标；②方案选择的标准是否科学合理（选项 C 正确）；③方案选择的方法是否科学适用；④方案选择的流程是否规范。 为了保证方案的有效实施，需要注意以下问题：①保证方案的执行进度，按照计划逐步推进并保证计划具有一定弹性；②确定方案执行的责任人；③建立信息沟通系统，保证信息的顺畅流转；④执行过程要具有监督和控制环节，及时解决执行中的问题（选项 D 正确）。 故本题选 ACDE 选项。","id":"gongshang-0027","bank":"gongshang"},{"chapter":"","point":"企业经营决策的流程☆","type":"single","stem":"在企业经营决策的流程中，（ ）是企业经营决策的前提。","material":"","options":[{"key":"A","text":"方案实施"},{"key":"B","text":"拟订方案"},{"key":"C","text":"方案评价"},{"key":"D","text":"确定目标"}],"answer":["D"],"explanation":"本题考查经营决策的流程。 确定目标是企业经营决策的前提。 故本题选 D 选项。","id":"gongshang-0028","bank":"gongshang"},{"chapter":"","point":"企业经营决策的方法","type":"multi","stem":"下列决策方法中，属于定性决策方法的有（ ）。","material":"","options":[{"key":"A","text":"头脑风暴法"},{"key":"B","text":"哥顿法"},{"key":"C","text":"德尔菲法"},{"key":"D","text":"期望损益决策法"},{"key":"E","text":"后悔值分析法"}],"answer":["A","B","C"],"explanation":"本题考查定性决策方法。 定性决策方法有：头脑风暴法、德尔菲法、名义小组法、哥顿法。 选项 DE 为定量决策方法。 故本题选 ABC 选项。","id":"gongshang-0029","bank":"gongshang"},{"chapter":"","point":"企业经营决策的方法","type":"single","stem":"下列属于定量决策的方法是（ ）。","material":"","options":[{"key":"A","text":"头脑风暴法"},{"key":"B","text":"德尔菲法"},{"key":"C","text":"名义小组法"},{"key":"D","text":"后悔值法"}],"answer":["D"],"explanation":"本题考查定量决策方法。 头脑风暴法、德尔菲法、名义小组法属于定性决策，而后悔值法属于定量分析法中的不确定型决策的一种方法。 故本题选 D 选项。","id":"gongshang-0030","bank":"gongshang"},{"chapter":"","point":"商业模式分析","type":"multi","stem":"成功的商业模式通常具有哪些特点（ ）。","material":"","options":[{"key":"A","text":"能够创造独特的价值"},{"key":"B","text":"具有整合性和系统性"},{"key":"C","text":"具有抵御风险的能力"},{"key":"D","text":"可操作性弱"},{"key":"E","text":"易于模仿"}],"answer":["A","B","C"],"explanation":"本题考查成功商业模式的特点。 成功的商业模式通常具有以下五个特点： （1）能够创造独特的价值，选项 A 正确。 （2）具有整合性和系统性，选项 B 正确。 （3）难以模仿，选项 E 错误。 （4）具有抵御风险的能力，选项 C 正确。 （5）可操作性强，选项 D 错误。 故本题选 ABC 选项。","id":"gongshang-0031","bank":"gongshang"},{"chapter":"","point":"商业模式分析","type":"single","stem":"商业模式的要素不包括（ ）。","material":"","options":[{"key":"A","text":"定位"},{"key":"B","text":"信息系统"},{"key":"C","text":"资源与能力"},{"key":"D","text":"盈利模式"}],"answer":["B"],"explanation":"本题考查商业模式的要素。 商业模式的要素包括定位、资源与能力、业务系统、盈利模式、现金流结构、企业价值等。 故本题选 B 选项。","id":"gongshang-0032","bank":"gongshang"},{"chapter":"","point":"公司概述","type":"multi","stem":"所有权（或产权）是指经济主体对稀缺性资源所拥有的一组权利的集合，包括的权利有（ ）。","material":"","options":[{"key":"A","text":"占有权"},{"key":"B","text":"使用权"},{"key":"C","text":"收益权"},{"key":"D","text":"优先权"},{"key":"E","text":"处分权"}],"answer":["A","B","C","E"],"explanation":"本题考查公司概述。 公司制企业的出现，使得企业所有者与经营者之间发生了分离。一般而言，公司所有者是指公司财产所有权（或产权）的拥有者，而所有权（或产权）是指经济主体对稀缺性资源所拥有的一组权利的集合，包括占有、使用、收益和处分等权利。 故本题选 ABCE 选项。","id":"gongshang-0033","bank":"gongshang"},{"chapter":"","point":"公司概述","type":"multi","stem":"与个人业主制企业和合伙制企业相比，公司具有的基本特点包括（ ）。","material":"","options":[{"key":"A","text":"专业化分工"},{"key":"B","text":"资合的特质"},{"key":"C","text":"承担有限责任"},{"key":"D","text":"所有权与经营权相分离"},{"key":"E","text":"所有权与产权相分离"}],"answer":["B","C","D"],"explanation":"本题考查公司概述。 与个人业主制企业和合伙制企业这类自然人企业相比较，公司具有以下三个基本特点： ①资合的特质。资合性是指公司强调投资人投入资本的聚集，以资本为信用基础； ②承担有限责任。除无限责任公司外，公司的股东或出资人都以其拥有的股权或出资额为限，对公司债务承担有限责任； ③所有权与经营权相分离。公司的经营业务由公司的组织机构来执行，股东或出资人不直接参与。 故本题选 BCD 选项。","id":"gongshang-0034","bank":"gongshang"},{"chapter":"","point":"公司所有者","type":"single","stem":"原始所有权是出资人（股东）对投入资本的终极所有权，其表现为（ ）。","material":"","options":[{"key":"A","text":"物权"},{"key":"B","text":"产权"},{"key":"C","text":"股权"},{"key":"D","text":"收益权"}],"answer":["C"],"explanation":"本题考查公司的原始所有权。 原始所有权是出资人（股东）对投入资本的终极所有权，其表现为股权。股权是公司股东基于其投资人资格而享有的权利。 故本题选 C 选项。","id":"gongshang-0035","bank":"gongshang"},{"chapter":"","point":"公司所有者","type":"multi","stem":"公司财产权能的两次分离包括（ ）。","material":"","options":[{"key":"A","text":"原始所有权与法人产权的分离"},{"key":"B","text":"经营权与收益权的分离"},{"key":"C","text":"法人产权与经营权的分离"},{"key":"D","text":"占有权与控制权的分离"},{"key":"E","text":"处分权与使用权的分离"}],"answer":["A","C"],"explanation":"本题考查公司财产权能的两次分离。 公司财产权能的分离是以公司法人为中介的所有权与经营权的两次分离。 第一次分离是具有法律意义的出资人与公司法人的分离，即原始所有权与法人产权的分离； 第二次分离是具有经济意义的法人产权与经营权的分离，这种分离形式是企业所有权与经营权分离的最高形式。 故本题选 AC 选项。","id":"gongshang-0036","bank":"gongshang"},{"chapter":"","point":"公司经营者☆","type":"multi","stem":"现代企业经营者具有的显著特征包括（ ）。","material":"","options":[{"key":"A","text":"经营者的岗位呈现职业化趋势"},{"key":"B","text":"经营者具有比较深厚的企业经营管理素养"},{"key":"C","text":"经营者必须具备较强的协调沟通能力"},{"key":"D","text":"经营者和公司之间体现为有偿雇佣关系"},{"key":"E","text":"经营者的权力受股东会的限制"}],"answer":["A","B","C","D"],"explanation":"本题考查公司经营者的含义。 现代企业经营者有五个显著特征： ①经营者的岗位呈现职业化趋势，已经形成经理人群体和经理人市场，选项 A 正确； ②经营者具有比较深厚的企业经营管理素养，能够引领企业获得良好的业绩，选项 B 正确； ③经营者必须具备较强的协调沟通能力，能够协调好所有者、下属员工及客户之间的关系，选项 C 正确； ④公司中经营者的产生基于有偿雇佣，是公司的“高级雇员”，即受股东委托的企业经营代理人，选项 D 正确； ⑤经营者的权力受董事会委托范围的限制，凡是超越该范围的决策和公司章程规定的董事会职权所辖事宜，都须报董事会决定，选项 E 错误。 故本题选 ABCD 选项。","id":"gongshang-0037","bank":"gongshang"},{"chapter":"","point":"公司经营者☆","type":"multi","stem":"市场竞争机制是经营者激励与约束机制的重要组成部分，包括（ ）。","material":"","options":[{"key":"A","text":"资本市场的竞争"},{"key":"B","text":"产品市场的竞争"},{"key":"C","text":"企业家市场的竞争"},{"key":"D","text":"要素市场的竞争"},{"key":"E","text":"劳动力市场的竞争"}],"answer":["A","B","C"],"explanation":"本题考查经营者的激励与约束机制。 市场竞争机制是经营者激励与约束机制的重要组成部分，包括企业家市场的竞争、资本市场的竞争和产品市场的竞争。 故本题选 ABC 选项。","id":"gongshang-0038","bank":"gongshang"},{"chapter":"","point":"所有者与经营者的关系","type":"multi","stem":"在现代企业中，所有者与经营者的关系主要表现在（ ）。","material":"","options":[{"key":"A","text":"所有者与经营者之间的委托代理关系"},{"key":"B","text":"所有者与经营者之间的自愿平等关系"},{"key":"C","text":"所有者与经营者之间的监督管理关系"},{"key":"D","text":"股东会、董事会、监事会和经理层之间的相互制衡关系"},{"key":"E","text":"股东会、董事会、监事会和经理层之间的上下级关系"}],"answer":["A","D"],"explanation":"本题考查所有者与经营者的关系。 在现代企业中，所有者与经营者的关系主要表现在以下两个方面： ①所有者与经营者之间的委托代理关系； ②股东会、董事会、监事会和经理层之间的相互制衡关系。 故本题选 AD 选项。","id":"gongshang-0039","bank":"gongshang"},{"chapter":"","point":"所有者与经营者的关系","type":"multi","stem":"在现代公司治理结构中，股东会、董事会、监事会和经理层之间的相互制衡关系表现在（ ）。","material":"","options":[{"key":"A","text":"股东会是公司的权力机构，选举和更换董事、监事"},{"key":"B","text":"董事会全权负责公司经营，必须对股东负责"},{"key":"C","text":"监事会对董事会负责"},{"key":"D","text":"经营者的管理权限不能超过董事会决定的授权范围"},{"key":"E","text":"经理层受聘于股东会，统管企业日常经营事务"}],"answer":["A","B","D"],"explanation":"本题考查所有者与经营者的关系。 股东会、董事会、监事会和经理层之间的相互制衡关系表现在： ①股东会是公司的权力机构，选举和更换董事、监事（选项 A 正确）。然而，一旦授权董事会负责公司后，股东就不能随意干预董事会的决策了； ②董事会作为公司最主要的法定代表人全权负责公司经营，拥有支配法人财产的权利和任命、指挥经营者的全权，但董事会必须对股东负责（选项 B 正确）。正是由于需要建立股东与董事会之间的制约与平衡关系，法律才将股东会确定为公司最高权力机构； ③经理层受聘于董事会（选项 E 错误），作为公司的意定代理人统管企业日常经营事务。在董事会授权范围之内，经营者有权决策，他人不能随意干涉。但是，经营者的管理权限和代理权限不能超过董事会决定的授权范围（选项 D 正确）， 经营者经营业绩的优劣由董事会考核和评判； ④监事会对董事会和经理层的工作实行全面监督（选项 C 错误）。 故本题选 ABD 选项。","id":"gongshang-0040","bank":"gongshang"},{"chapter":"","point":"股东概述","type":"single","stem":"张某等 13 人拟发起设立股份有限公司。根据《公司法》，发起人中在中国境内有住所的至少应达到（ ）人。","material":"","options":[{"key":"A","text":"5"},{"key":"B","text":"6"},{"key":"C","text":"7"},{"key":"D","text":"8"}],"answer":["C"],"explanation":"本题考查发起人股东与一般股东。 根据《公司法》，设立股份有限公司，应当有 1 人以上 200 人以下发起人，其中应当有半数以上的发起人在中华人民共和国境内有住所。 该题中，13 人拟发起设立股份有限公司，应当有 7 人以上的发起人在中华人民共和国境内有住所。 故本题选 C 选项。","id":"gongshang-0041","bank":"gongshang"},{"chapter":"","point":"股东概述","type":"multi","stem":"根据《公司法》，关于股份有限公司发起人相关责任规定的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"设立股份有限公司，应当有 1 人以上 200 人以下发起人"},{"key":"B","text":"应当有 2/3 以上的发起人在中华人民共和国境内有住所"},{"key":"C","text":"以募集设立方式设立股份有限公司的，发起人认购的股份不得少于公司章程规定的公司设立时应发行股份总数的 35%"},{"key":"D","text":"发起人不按照其认购的股份缴纳股款，该发起人在出资不足的范围内承担全部责任"},{"key":"E","text":"以发起设立方式设立股份有限公司的，发起人应当认足公司章程规定的公司设立时应发行的股份"}],"answer":["A","C","E"],"explanation":"本题考查发起人股东与一般股东。 股份有限公司设立过程中发起人的相关责任规定如下： ①设立股份有限公司，应当有 1 人以上 200 人以下发起人（选项 A 正确），其中应当有半数以上的发起人在中华人民共和国境内有住所（选项 B 错误）； ②股份有限公司发起人承担公司筹办事务。发起人应当签订发起人协议，明确各自的权利和义务； ③以发起设立方式设立股份有限公司的，发起人应当认足公司章程规定的公司设立时应发行的股份（选项 E 正确）。以募集设立方式设立股份有限公司的，发起人认购的股份不得少于公司章程规定的公司设立时应发行股份总数的 35%（选项 C 正确）。但是，法律、行政法规另有规定的，从其规定； ④发起人应当在公司成立前按照其认购的股份全额缴纳股款； ⑤发起人不按照其认购的股份缴纳股款，或者作为出资的非货币财产的实际价额显著低于所认购的股份的，其他发起人与该发起人在出资不足的范围内承担连带责任（选项 D 错误）。故本题选 ACE 选项。","id":"gongshang-0042","bank":"gongshang"},{"chapter":"","point":"股东会的性质及职权","type":"single","stem":"根据《公司法》，上市公司在一年内购买、出售重大资产或者向他人提供担保的金额超过公司资产总额（ ）的，应当由股东会作出决议，并经出席会议的股东所持表决权的 2/3 以上通过。","material":"","options":[{"key":"A","text":"25%"},{"key":"B","text":"30%"},{"key":"C","text":"35%"},{"key":"D","text":"40%"}],"answer":["B"],"explanation":"本题考查股东会的性质及职权。 《公司法》对上市公司股东会职权有如下规定：上市公司在一年内购买、出售重大资产或者向他人提供担保的金额超过公司资产总额 30%的，应当由股东会作出决议，并经出席会议的股东所持表决权的 2/3 以上通过。 故本题选 B 选项。","id":"gongshang-0043","bank":"gongshang"},{"chapter":"","point":"股东会的性质及职权","type":"multi","stem":"根据《公司法》，股东会行使的职权包括（ ）。","material":"","options":[{"key":"A","text":"选举和更换董事、监事"},{"key":"B","text":"批准宣告破产"},{"key":"C","text":"修改公司章程"},{"key":"D","text":"审议批准公司的利润分配方案和弥补亏损方案"},{"key":"E","text":"对公司增加或者减少注册资本作出决议"}],"answer":["A","C","D","E"],"explanation":"本题考查股东会的性质及职权。 《公司法》规定，股东会行使下列职权： ①选举和更换董事、监事，决定有关董事、监事的报酬事项，选项 A 正确； ②审议批准董事会的报告； ③审议批准监事会报告； ④审议批准公司利润分配方案和弥补亏损方案，选项 D 正确； ⑤对公司增加或者减少注册资本作出决议，选项 E 正确； ⑥对公司发行债券作出决议； ⑦对公司合并、分立、解散、清算或者变更公司形式作出决议； ⑧修改公司章程，选项 C 正确； ⑨公司章程规定的其他职权。 此外，股东会可以授权董事会对发行公司债券作出决议。 故本题选 ACDE 选项。","id":"gongshang-0044","bank":"gongshang"},{"chapter":"","point":"股东会会议","type":"multi","stem":"有限责任公司的股东会会议可分为（ ）。","material":"","options":[{"key":"A","text":"首次会议"},{"key":"B","text":"定期会议"},{"key":"C","text":"特别会议"},{"key":"D","text":"临时会议"},{"key":"E","text":"常务会议"}],"answer":["A","B","D"],"explanation":"本题考查有限责任公司的股东会会议。 有限责任公司的股东会会议分为三种：首次会议、定期会议和临时会议。首次会议是指公司成立后召集的第一次股东会会议。定期会议是指按照公司章程规定按时召开的股东会会议。临时会议是指在两次定期会议之间因法定事由的出现而由公司临时召集的股东会会议。 故本题选 ABD 选项。","id":"gongshang-0045","bank":"gongshang"},{"chapter":"","point":"股东会会议","type":"multi","stem":"《公司法》规定，应当在 2 个月内召开临时股东会会议的情形包括（ ）。","material":"","options":[{"key":"A","text":"董事人数不足《公司法》规定人数或者公司章程所定人数的 2/3 时"},{"key":"B","text":"公司未弥补的亏损达实收股本总额 1/3 时"},{"key":"C","text":"公司未弥补的亏损达注册资本总额 1/5 时"},{"key":"D","text":"单独或者合计持有公司 10%以上股份的股东请求时"},{"key":"E","text":"董事会认为必要时"}],"answer":["A","B","D","E"],"explanation":"本题考查股份有限公司的股东会会议。 《公司法》规定，有下列情形之一的，应当在 2 个月内召开临时股东会会议： ①董事人数不足《公司法》规定人数或者公司章程所定人数的 2/3 时，选项 A 正确； ②公司未弥补的亏损达实收股本总额 1/3 时，选项 B 正确，选项 C 错误； ③单独或者合计持有公司 10%以上股份的股东请求时，选项 D 正确； ④董事会认为必要时，选项 E 正确； ⑤监事会提议召开时； ⑥公司章程规定的其他情形。 故本题选 ABDE 选项。","id":"gongshang-0046","bank":"gongshang"},{"chapter":"","point":"董事会的作用和性质","type":"multi","stem":"董事会作为公司的法定常设机构主要体现在（ ）。","material":"","options":[{"key":"A","text":"董事会对股东会负责，向股东会汇报工作"},{"key":"B","text":"董事会成员固定、任期固定且任期内不能无故解除"},{"key":"C","text":"董事会决议内容多为公司经常性重大事项，董事会会议召开次数较多"},{"key":"D","text":"董事会负责管理、执行公司业务和公司事务"},{"key":"E","text":"董事会通常设置专门工作机构处理日常事务"}],"answer":["B","C","E"],"explanation":"本题考查董事会的性质。 董事会是公司的法定必备机构。董事会作为常设机构的性质主要体现在： ①董事会成员固定、任期固定且任期内不能无故解除，选项 B 正确； ②董事会决议内容多为公司经常性重大事项，董事会会议召开次数较多，选项 C 正确； ③董事会通常设置专门工作机构（如办公室、秘书室）处理日常事务，选项 E 正确。 董事会对股东会负责，向股东会汇报工作是董事会是代表股东对公司进行管理的 机构的表现，选项 A 错误。 董事会负责管理、执行公司业务和公司事务是董事会是公司的执行机构的体现，选项 D 错误。 故本题选 BCE 选项。","id":"gongshang-0047","bank":"gongshang"},{"chapter":"","point":"董事会的作用和性质","type":"multi","stem":"关于董事会性质的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"董事会是代表股东对公司进行管理的机构"},{"key":"B","text":"董事会是公司的最高权力机构"},{"key":"C","text":"董事会是公司法人的对外代表机构"},{"key":"D","text":"董事会是公司的经营决策机构"},{"key":"E","text":"董事会是公司的法定常设机构"}],"answer":["A","C","D","E"],"explanation":"本题考查董事会的性质。 董事会的性质表现在： ①董事会是代表股东对公司进行管理的机构（选项 A 正确）； ②董事会是公司的执行机构； ③董事会是公司的经营决策机构（选项 D 正确）； ④董事会是公司法人的对外代表机构（选项 C 正确）； ⑤董事会是公司的法定常设机构（想 E 正确）。 股东会是公司的最高权力机构（选项 B 错误）。 故本题选 ACDE 选项。","id":"gongshang-0048","bank":"gongshang"},{"chapter":"","point":"董事会的职权","type":"multi","stem":"根据《公司法》，上市公司在董事会中设置审计委员会的，董事会作出决议前应当经审计委员会全体成员过半数通过的事项包括（ ）。","material":"","options":[{"key":"A","text":"聘用、解聘承办公司审计业务的会计师事务所"},{"key":"B","text":"决定公司的利润分配方案和弥补亏损方案"},{"key":"C","text":"聘任、解聘财务负责人"},{"key":"D","text":"披露财务会计报告"},{"key":"E","text":"聘任、解聘公司经理"}],"answer":["A","C","D"],"explanation":"本题考查董事会的职权。 《公司法》中有关“上市公司组织机构的特别规定”指出，上市公司在董事会中设置审计委员会的，董事会对下列事项作出决议前应当经审计委员会全体成员过半数通过： ①聘用、解聘承办公司审计业务的会计师事务所； ②聘任、解聘财务负责人； ③披露财务会计报告； ④国务院证券监督管理机构规定的其他事项。 故本题选 ACD 选项。","id":"gongshang-0049","bank":"gongshang"},{"chapter":"","point":"董事会的职权","type":"single","stem":"根据《公司法》，下列不属于董事会的职权范围的是（ ）。","material":"","options":[{"key":"A","text":"执行股东会的决议"},{"key":"B","text":"决定公司的经营计划和投资方案"},{"key":"C","text":"制定公司的基本管理制度"},{"key":"D","text":"主持公司的生产经营管理工作"}],"answer":["D"],"explanation":"本题考查董事会的职权。 《公司法》规定，董事会行使下列职权： ①召集股东会会议，并向股东会报告工作； ②执行股东会的决议（选项 A 不符合题意）； ③决定公司的经营计划和投资方案（选项 B 不符合题意）； ④制订公司的利润分配方案和弥补亏损方案； ⑤制订公司增加或者减少注册资本以及发行公司债券的方案； ⑥制订公司合并、分立、解散或者变更公司形式的方案； ⑦决定公司内部管理机构的设置； ⑧决定聘任或者解聘公司经理及其报酬事项，并根据经理的提名决定聘任或者解聘公司副经理、财务负责人及其报酬事项； ⑨制定公司的基本管理制度（选项 C 不符合题意）； ⑩公司章程规定或者股东会授予的其他职权。 主持公司的生产经营管理工作不在董事会的职权范围（选项 D 符合题意）。 故本题选 D 选项。","id":"gongshang-0050","bank":"gongshang"},{"chapter":"","point":"董事会的组成","type":"multi","stem":"关于董事会组成的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"规模较小的有限责任公司，可以不设董事会，设一名董事"},{"key":"B","text":"上市公司独立董事的具体管理办法，由公司章程决定"},{"key":"C","text":"董事会成员为 3 人以上"},{"key":"D","text":"职工人数 300 人以上的公司，其董事会成员中应当有公司职工代表"},{"key":"E","text":"董事会中的职工代表由股东会决定"}],"answer":["A","C","D"],"explanation":"本题考查董事会组成。 有限责任公司和股份有限公司设董事会，但是规模较小或者股东人数较少的有限责任公司和股份有限公司，可以不设董事会，设一名董事（选项 A 正确），行使《公司法》规定的董事会的职权。 《公司法》规定，有限责任公司和股份有限公司董事会的成员为 3 人以上（选项 C 正确），其成员中可以有公司职工代表。职工人数 300 人以上的有限责任公司和股份有限公司，除依法设监事会并有公司职工代表的外，其董事会成员中应当有公司职工代表（选项 D 正确）。 董事会中的职工代表由公司职工通过职工代表大会、职工大会或者其他形式民主选举产生（选项 E 错误）。 故本题选 ACD 选项。","id":"gongshang-0051","bank":"gongshang"},{"chapter":"","point":"董事会的组成","type":"single","stem":"《公司法》规定，上市公司主要负责公司股东会和董事会会议的筹备、文件保管以及公司股东资料的管理，办理信息披露事务等事宜的是（ ）。","material":"","options":[{"key":"A","text":"独立董事"},{"key":"B","text":"董事会秘书"},{"key":"C","text":"董事长"},{"key":"D","text":"部门经理"}],"answer":["B"],"explanation":"本题考查董事会组成。 《公司法》中有关“上市公司组织机构的特别规定”规定，上市公司设董事会秘书，负责公司股东会和董事会会议的筹备、文件保管以及公司股东资料的管理，办理信息披露事务等事宜。 故本题选 B 选项。","id":"gongshang-0052","bank":"gongshang"},{"chapter":"","point":"董事会会议","type":"single","stem":"某股份有限公司股东王某持有公司 20%股权，其在公司召开半年度工作总结会后，于 2023 年 7 月 8 日向董事会提议召开临时董事会会议。董事长李某当日接到提议后，应当在 2023 年（ ）前召开临时董事会会议。","material":"","options":[{"key":"A","text":"7 月 18 日"},{"key":"B","text":"8 月 8 日"},{"key":"C","text":"7 月 23 日"},{"key":"D","text":"9 月 8 日"}],"answer":["A"],"explanation":"本题考查董事会会议的召集和主持。 《公司法》规定，股份有限公司代表 1/10 以上表决权的股东、1/3 以上董事或者监事会，可以提议召开临时董事会会议。董事长应当自接到提议后 10 日内，召集和主持董事会会议。依据题干表述，该股东符合 1/10 以上表决权的股东这一条件，有权提议召开临时董事会会议。董事长自 2023 年 7 月 8 日接到提议后，应当在 2023 年 7 月 18 日前召开董事会临时会议。 故本题选 A 选项。","id":"gongshang-0053","bank":"gongshang"},{"chapter":"","point":"董事会会议","type":"multi","stem":"根据《公司法》，上市公司董事与董事会会议决议事项所涉及的企业或者个人有关联关系的，下列做法正确的有（ ）。","material":"","options":[{"key":"A","text":"该董事应当及时向董事会书面报告"},{"key":"B","text":"有关联关系的董事不得对该项决议行使表决权"},{"key":"C","text":"有关联关系的董事可以代理其他董事行使表决权"},{"key":"D","text":"该董事会会议由过半数的无关联关系董事出席即可举行"},{"key":"E","text":"出席董事会会议的无关联关系董事人数不足 5 人的，应当将该事项提交上市公司股东会审议"}],"answer":["A","B","D"],"explanation":"本题考查董事会会议的议事规则和表决程序。 《公司法》规定，上市公司董事与董事会会议决议事项所涉及的企业或者个人有关联关系的，该董事应当及时向董事会书面报告（选项 A 正确）。 有关联关系的董事不得对该项决议行使表决权，也不得代理其他董事行使表决权（选项 B 正确，选项 C 错误）。该董事会会议由过半数的无关联关系董事出席即可举行（选项 D 正确），董事会会议所作决议须经无关联关系董事过半数通过。 出席董事会会议的无关联关系董事人数不足 3 人的，应当将该事项提交上市公司股东会审议（选项 E 错误）。 故本题选 ABD 选项。","id":"gongshang-0054","bank":"gongshang"},{"chapter":"","point":"董事的任期、任职资格和义务","type":"single","stem":"根据《公司法》，有限责任公司和股份有限公司董事的每届任期不得超过（ ）年。","material":"","options":[{"key":"A","text":"2"},{"key":"B","text":"3"},{"key":"C","text":"4"},{"key":"D","text":"5"}],"answer":["B"],"explanation":"本题考查董事的任期。 有限责任公司和股份有限公司董事的任期由公司章程规定，但每届任期不得超过 3 年，董事任期届满，连选可以连任。 故本题选 B 选项。","id":"gongshang-0055","bank":"gongshang"},{"chapter":"","point":"董事的任期、任职资格和义务","type":"multi","stem":"根据《上市公司章程指引（2022 年修订）》，董事对公司负有的忠实义务包括（ ）。","material":"","options":[{"key":"A","text":"不得挪用公司资金"},{"key":"B","text":"不得将公司资产以其个人名义开立账户存储"},{"key":"C","text":"不得利用职务之便为自己或他人谋利"},{"key":"D","text":"不得擅自披露公司秘密"},{"key":"E","text":"不得妨碍监事会或者监事行使职权"}],"answer":["A","B","C","D"],"explanation":"本题考查董事的忠实和勤勉义务。 《上市公司章程指引》第一百零一条规定，董事对公司负有下列忠实义务： ①不得侵占公司财产、挪用公司资金（选项 A 正确）； ②不得将公司资金以其个人名义或者其他个人名义开立账户存储（选项 B 正确）； ③不得利用职权贿赂或者收受其他非法收入（选项 C 正确）； ④未向董事会或者股东会报告，并按照本章程的规定经董事会或者股东会决议通过，不得直接或者间接与本公司订立合同或者进行交易； ⑤不得利用职务便利，为自己或者他人谋取属于公司的商业机会，但向董事会或者股东会报告并经股东会决议通过，或者公司根据法律、行政法规或者本章程的规定，不能利用该商业机会的除外； ⑥未向董事会或者股东会报告，并经股东会决议通过，不得自营或者为他人经营与本公司同类的业务； ⑦不得接受他人与公司交易的佣金归为己有； ⑧不得擅自披露公司秘密（选项 D 正确）； ⑨不得利用其关联关系损害公司利益； ⑩法律、行政法规、部门规章及本章程规定的其他忠实义务。 故本题选 ABCD 选项。","id":"gongshang-0056","bank":"gongshang"},{"chapter":"","point":"独立董事","type":"single","stem":"根据《上市公司独立董事管理办法》（以下简称《管理办法》）的规定，担任独立董事应当符合的基本条件不包括（ ）。","material":"","options":[{"key":"A","text":"根据法律、行政法规及其他有关规定，具备担任上市公司董事的资格"},{"key":"B","text":"符合《管理办法》关于独立性的要求"},{"key":"C","text":"具有 3 年以上履行独立董事职责所必需的法律、会计或者经济等工作经验"},{"key":"D","text":"具备上市公司运作的基本知识，熟悉相关法律法规和规则"}],"answer":["C"],"explanation":"本题考查独立董事的任职要求。 《管理办法》规定，担任独立董事应当符合下列基本条件： ①根据法律、行政法规及其他有关规定，具备担任上市公司董事的资格（选项 A 不符合题意）； ②符合《管理办法》关于独立性的要求（选项 B 不符合题意）； ③具备上市公司运作的基本知识，熟悉相关法律法规和规则（选项 D 不符合题意）； ④具有 5 年以上履行独立董事职责所必需的法律、会计或者经济等工作经验（选项 C 符合题意）； ⑤具有良好的个人品德，不存在重大失信等不良记录； ⑥法律、行政法规、中国证监会规定、证券交易所业务规则和公司章程规定的其他条件。 故本题选 C 选项。","id":"gongshang-0057","bank":"gongshang"},{"chapter":"","point":"独立董事","type":"single","stem":"关于独立董事的选举和聘任的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"上市公司股东会选举 2 名以上独立董事的，应当实行一票否决制"},{"key":"B","text":"独立董事可以连选连任，但是连续任职不得超过 6 年"},{"key":"C","text":"独立董事每年在上市公司的现场工作时间应当不少于 15 日"},{"key":"D","text":"上市公司董事会、监事会、单独或者合计持有上市公司已发行股份 1%以上的股东可以提出独立董事候选人，并经股东会选举决定"}],"answer":["A"],"explanation":"本题考查独立董事的选举和聘任。 上市公司股东会选举 2 名以上独立董事的，应当实行累积投票制，选项 A 错误。 独立董事每届任期与上市公司其他董事任期相同，任期届满，可以连选连任，但是连续任职不得超过 6 年，选项 B 正确。 独立董事每年在上市公司的现场工作时间应当不少于 15 日，选项 C 正确。 上市公司董事会、监事会、单独或者合计持有上市公司已发行股份 1%以上的股东可以提出独立董事候选人，并经股东会选举决定，选项 D 正确。 故本题选 A 选项。","id":"gongshang-0058","bank":"gongshang"},{"chapter":"","point":"经理层的地位","type":"multi","stem":"关于公司经理层的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"经理层是董事会的辅助机构"},{"key":"B","text":"经理层对董事会负责"},{"key":"C","text":"所有公司必须设置经理层"},{"key":"D","text":"董事会与经理层的关系表现为一种以控制为基础的合作关系"},{"key":"E","text":"经理层直接对股东会负责"}],"answer":["A","B","D"],"explanation":"本题考查经理层的地位。 公司设置经理的目的是辅助董事会执行业务（选项 A 正确）。 经理对董事会负责。对于专属董事会做出决议的经营事项，经理不得越俎代庖，擅自做决策并执行（选项 B 正确，选项 E 错误）。 《公司法》规定，有限责任公司可以设经理；（选项 C 错误）。 董事会与经理的关系是以董事会对经理实施控制为基础的合作关系（选项 D 正确）。 故本题选 ABD 选项。","id":"gongshang-0059","bank":"gongshang"},{"chapter":"","point":"经理层的地位","type":"single","stem":"在现代企业制度下，经理的职权范围通常是来自（ ）的授权，在其授权的范围内对外代表公司。","material":"","options":[{"key":"A","text":"股东会"},{"key":"B","text":"监事会"},{"key":"C","text":"执委会"},{"key":"D","text":"董事会"}],"answer":["D"],"explanation":"本题考查经理层的地位。 经理对董事会负责。经理的职权范围通常是来自董事会的授权，只能在董事会或董事长授权的范围内对外代表公司。 故本题选 D 选项。","id":"gongshang-0060","bank":"gongshang"},{"chapter":"","point":"经理的职权","type":"multi","stem":"关于经理的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"有限责任公司可以不设经理"},{"key":"B","text":"股份有限公司可以不设经理"},{"key":"C","text":"从本质来看，经理被授予了部分董事会的职权"},{"key":"D","text":"经理有权列席股东会会议"},{"key":"E","text":"经理有权列席董事会会议"}],"answer":["A","C","E"],"explanation":"本题考查经理的任职。 从本质上来讲，经理被授予了部分董事会的职权（选项 C 正确）。 我国《公司法》规定，有限责任公司可以设经理；股份有限公司设经理（选项 A 正确，选项 B 错误）。 经理由董事会决定聘任或解聘，经理对董事会负责。 经理根据公司章程的规定或者董事会的授权行使职权；经理有权列席董事会会议（选项 E 正确，选项 D 错误）。 故本题选 ACE 选项。","id":"gongshang-0061","bank":"gongshang"},{"chapter":"","point":"经理的聘任与解聘☆","type":"single","stem":"根据《公司法》，经理由（ ）决定聘任或解聘。","material":"","options":[{"key":"A","text":"股东会"},{"key":"B","text":"董事会"},{"key":"C","text":"监事会"},{"key":"D","text":"独立董事"}],"answer":["B"],"explanation":"本题考查经理的聘任与解聘。 据《公司法》，经理由董事会决定聘任或解聘。 故本题选 B 选项。","id":"gongshang-0062","bank":"gongshang"},{"chapter":"","point":"监事会制度","type":"multi","stem":"一般情况下，公司监事会的监督职能主要表现在（ ）。","material":"","options":[{"key":"A","text":"监事不能列席董事会会议，但可以列席股东会会议"},{"key":"B","text":"监事会的基本职能是监督公司的一切经营活动"},{"key":"C","text":"以董事会和总经理为主要监督对象"},{"key":"D","text":"监事会不仅要进行会计监督，而且要进行业务监督"},{"key":"E","text":"监事会不仅有事后监督，还有事前监督和事中监督"}],"answer":["B","C","D","E"],"explanation":"本题考查监事会制度。 一般情况下，公司监事会的监督职能主要表现在三个方面： ①监事会是公司内部的专职监督机构； ②监事会的基本职能是监督公司的一切经营活动（选项 B 正确），以董事会和总经理为主要监督对象（选项 C 正确）。为了完成其监督职能，监事可以列席董事会会议（选项 A 错误）； ③监事会监督的形式多种多样。为了完成监督职能，监事会不仅要进行会计监督，而且要进行业务监督（选项 D 正确）；不仅要有事后监督，而且要有事前监督和事中监督（选项 E 正确）。 故本题选 BCDE 选项。","id":"gongshang-0063","bank":"gongshang"},{"chapter":"","point":"监事会制度","type":"multi","stem":"《公司法》规定，公司监事会的主要监督对象包括（ ）。","material":"","options":[{"key":"A","text":"股东会"},{"key":"B","text":"董事会"},{"key":"C","text":"总经理"},{"key":"D","text":"财务人员"},{"key":"E","text":"职工代表大会"}],"answer":["B","C"],"explanation":"本题考查监事会制度。 监事会的基本职能是监督公司的一切经营活动，以董事会和总经理为主要监督对象。在监督过程中，随时要求董事会和经理人员纠正违反公司章程的越权行为。 故本题选 BC 选项。","id":"gongshang-0064","bank":"gongshang"},{"chapter":"","point":"监事会组成和监事任期","type":"single","stem":"关于监事会的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"有限责任公司和股份有限公司监事会成员为 3 人以上"},{"key":"B","text":"按规定设置的审计委员会，可以行使监事会的职权"},{"key":"C","text":"监事会中的职工代表可以通过职工代表大会选举产生"},{"key":"D","text":"规模较小或者股东人数较少的有限责任公司，可以不设监事会，但必须设一名监事"}],"answer":["D"],"explanation":"本题考查监事会组成和监事任期。 《公司法》规定，规模较小或者股东人数较少的有限责任公司和股份有限公司，可以不设监事会，设一名监事，行使《公司法》规定的监事会的职权。规模较小或者股东人数较少的有限责任公司，经全体股东一致同意，也可以不设监事，选项 D 错误。 故本题选 D 选项。","id":"gongshang-0065","bank":"gongshang"},{"chapter":"","point":"监事会组成和监事任期","type":"single","stem":"根据《公司法》，监事会成员应当包括股东代表和适当比例的公司职工代表，其中职工代表的比例不得低于（ ）。","material":"","options":[{"key":"A","text":"1/2"},{"key":"B","text":"2/3"},{"key":"C","text":"1/3"},{"key":"D","text":"1/4"}],"answer":["C"],"explanation":"本题考查监事会组成和监事任期。 根据《公司法》，监事会成员应当包括股东代表和适当比例的公司职工代表，其中职工代表的比例不得低于 1/3，具体比例由公司章程规定。 故本题选 C 选项。","id":"gongshang-0066","bank":"gongshang"},{"chapter":"","point":"监事会的职权","type":"multi","stem":"监事会的职权包括（ ）。","material":"","options":[{"key":"A","text":"检查公司财务"},{"key":"B","text":"决定经理的解任"},{"key":"C","text":"提议召开临时股东会会议"},{"key":"D","text":"依照相关规定，对董事、高级管理人员损害公司利益的行为进行处罚"},{"key":"E","text":"依照相关规定，对董事、高级管理人员提起诉讼"}],"answer":["A","C","E"],"explanation":"本题考查监事会的职权。 《公司法》规定，有限责任公司与股份有限公司的监事会，行使下列职权： ①检查公司财务（选项 A 正确）； ②对董事、高级管理人员执行公司职务的行为进行监督，对违反法律、行政法规、公司章程或者股东会决议的董事、高级管理人员提出解任的建议； ③当董事、高级管理人员的行为损害公司的利益时，要求董事、高级管理人员予以纠正（选项 D 错误）； ④提议召开临时股东会会议（选项 C 正确），在董事会不履行《公司法》规定的召集和主持股东会会议职责时召集和主持股东会会议； ⑤向股东会会议提出提案； ⑥依照《公司法》的相关规定，对董事、高级管理人员提起诉讼（选项 E 正确）； ⑦公司章程规定的其他职权。 决定经理的解任属于董事会的职权（选项 B 错误）。 故本题选 ACE 选项。","id":"gongshang-0067","bank":"gongshang"},{"chapter":"","point":"监事会的召开和议事规则","type":"multi","stem":"关于监事会议事规则的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"监事会决议应当经全体监事的过半数通过"},{"key":"B","text":"监事会决议应当经出席会议的监事的过半数通过"},{"key":"C","text":"监事会决议的表决，应当一人一票"},{"key":"D","text":"监事会应当对所议事项的决定形成会议记录"},{"key":"E","text":"全体监事应当在会议记录上签名"}],"answer":["A","C","D"],"explanation":"本题考查监事会的召开和议事规则。 监事会的议事方式和表决程序，除《公司法》有规定的外，由公司章程规定。 监事会决议应当经全体监事的过半数通过（选项 A 正确，选项 B 错误）。 监事会决议的表决，应当一人一票（选项 C 正确）。 监事会应当对所议事项的决定作成会议记录（选项 D 正确），出席会议的监事应当在会议记录上签名（选项 E 错误）。 故本题选 ACD 选项。","id":"gongshang-0068","bank":"gongshang"},{"chapter":"","point":"监事会的召开和议事规则","type":"single","stem":"《公司法》规定，股份有限公司监事会至少每（ ）召开一次会议。","material":"","options":[{"key":"A","text":"三个月"},{"key":"B","text":"六个月"},{"key":"C","text":"一年"},{"key":"D","text":"两年"}],"answer":["B"],"explanation":"本题考查监事会的召开和议事规则。 有限责任公司监事会每年度至少召开一次会议，股份有限公司监事会每六个月至少召开一次会议。监事可以提议召开临时监事会会议。 故本题选 B 选项。","id":"gongshang-0069","bank":"gongshang"},{"chapter":"","point":"国家出资公司治理的基本原则","type":"multi","stem":"改进国有企业法人治理结构，完善国有企业现代企业制度应遵循的原则包括（ ）。","material":"","options":[{"key":"A","text":"坚持深化改革"},{"key":"B","text":"坚持党的领导"},{"key":"C","text":"坚持以企业为核心"},{"key":"D","text":"坚持依法治企"},{"key":"E","text":"坚持权责对等"}],"answer":["A","B","D","E"],"explanation":"本题考查国家出资公司治理的基本原则。 根据《指导意见》和有关文件精神，改进国有企业法人治理结构，完善国有企业现代企业制度应遵循以下原则：①坚持深化改革。②坚持党的领导。③坚持依法治企。④坚持权责对等。 故本题选 ABDE 选项。","id":"gongshang-0070","bank":"gongshang"},{"chapter":"","point":"国家出资公司治理的基本原则","type":"single","stem":"《国务院办公厅关于进一步完善国有企业法人治理结构的指导意见》明确了国有企业（ ）在法人治理结构中的法定地位。","material":"","options":[{"key":"A","text":"党组织"},{"key":"B","text":"股东会"},{"key":"C","text":"国有资产监督管理机构"},{"key":"D","text":"工会组织"}],"answer":["A"],"explanation":"本题考查国家出资公司治理的基本原则。 《国务院办公厅关于进一步完善国有企业法人治理结构的指导意见》（以下简称《指导意见》）指出，落实全面从严治党战略部署，把加强党的领导和完善公司治理统一起来，明确国有企业党组织在法人治理结构中的法定地位，发挥国有企业党组织的领导作用，保证党组织把方向、管大局、保落实。 故本题选 A 选项。","id":"gongshang-0071","bank":"gongshang"},{"chapter":"","point":"国家出资公司党组织","type":"multi","stem":"国家出资公司党组织的地位和作用表现在（ ）。","material":"","options":[{"key":"A","text":"国家出资公司重大经营管理事项必须经党委（党组）研究讨论后，再由股东会作出决定"},{"key":"B","text":"国家出资公司实行“双向进入、交叉任职”的领导体制"},{"key":"C","text":"国有独资公司党委（党组）领导班子成员可以直接进入董事会、监事会、经理层"},{"key":"D","text":"党组织担负公司领导人员选拔任用、培养教育和管理监督中的责任，支持董事会依法选择公司经营管理者、经营管理者依法行使用人权"},{"key":"E","text":"担负反腐倡廉“两个责任”"}],"answer":["B","D","E"],"explanation":"本题考查国家出资公司党组织的地位和作用。 国家出资公司党组织的地位和作用表现在： ①发挥领导作用。国家出资公司重大经营管理事项必须经党委（党组）研究讨论后，再由董事会或者经理层作出决定（选项 A 错误）； ②发挥人才保障作用。国家出资公司实行“双向进入、交叉任职”的领导体制（选项 B 正确）。符合条件的国有独资公司党委（党组）领导班子成员可以通过法定程序进入董事会、监事会、经理层（选项 C 错误）。国家出资公司贯彻党管干部原则。党组织担负公司领导人员选拔任用、培养教育和管理监督中的责任，支持董事会依法选择公司经营管理者、经营管理者依法行使用人权（选项 D 正确）； ③担负反腐倡廉“两个责任”（选项 E 正确）。 故本题选 BDE 选项。","id":"gongshang-0072","bank":"gongshang"},{"chapter":"","point":"国家出资公司党组织","type":"multi","stem":"国家出资公司的下列事项中，必须经党委（党组）研究讨论的有（ ）。","material":"","options":[{"key":"A","text":"公司发展战略"},{"key":"B","text":"公司生产计划"},{"key":"C","text":"公司组织架构设置和调整"},{"key":"D","text":"公司资产重组"},{"key":"E","text":"公司市场营销活动"}],"answer":["A","C","D"],"explanation":"本题考查国家出资公司须经党组织研究讨论的事项。 《条例》规定，国家出资公司重大经营管理事项必须经党委（党组）研究讨论后，再由董事会或者经理层作出决定。须经党组织研究讨论的事项主要包括： ①贯彻党中央决策部署和落实国家发展战略的重大举措； ②公司发展战略（选项 A 正确）、中长期发展规划，重要改革方案； ③公司资产重组（选项 D 正确）、产权转让、资本运作和大额投资中的原则性方向性问题； ④公司组织架构设置和调整（选项 C 正确），重要规章制度的制定和修改； ⑤涉及公司安全生产、维护稳定、职工权益、社会责任等方面的重大事项； ⑥其他应当由党委（党组）研究讨论的重要事项。 故本题选 ACD 选项。","id":"gongshang-0073","bank":"gongshang"},{"chapter":"","point":"履行出资人职责的机构","type":"multi","stem":"国有独资公司的下列事项中，应当由履行出资人职责的机构决定的有（ ）。","material":"","options":[{"key":"A","text":"制定公司章程"},{"key":"B","text":"公司合并"},{"key":"C","text":"决定经理的聘任"},{"key":"D","text":"增加注册资本"},{"key":"E","text":"检查公司财务"}],"answer":["A","B","D"],"explanation":"本题考查履行出资人职责的机构。 《公司法》规定，履行出资人职责的机构可以授权公司董事会行使股东会的部分职权，但公司章程的制定和修改（选项 A 正确），公司的合并（选项 B 正确）、分立、解散、申请破产，增加或者减少注册资本（选项 E 正确），分配利润，应当由履行出资人职责的机构决定。 决定经理的聘任属于董事会的职权（选项 C 错误）。 检查公司财务属于监事会的职权（选项 E 错误）。 故本题选 ABD 选项。","id":"gongshang-0074","bank":"gongshang"},{"chapter":"","point":"履行出资人职责的机构","type":"single","stem":"根据《公司法》，关于履行出资人职责的机构的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"代表本级人民政府履行出资人职责的机构、部门，统称为履行出资人职责的机构"},{"key":"B","text":"国有独资公司章程由董事会制定，履行出资人职责的机构监督"},{"key":"C","text":"国有独资公司不设股东会，由履行出资人职责的机构行使股东会职权"},{"key":"D","text":"履行出资人职责的机构可以授权公司董事会行使股东会的部分职权"}],"answer":["B"],"explanation":"本题考查履行出资人职责的机构。 履行出资人职责的机构可以授权公司董事会行使股东会的部分职权，但公司章程的制定和修改，公司的合并、分立、解散、申请破产，增加或者减少注册资本，分配利润，应当由履行出资人职责的机构决定，选项 B 错误。 故本题选 B 选项。","id":"gongshang-0075","bank":"gongshang"},{"chapter":"","point":"国家出资公司董事会","type":"single","stem":"关于国有独资公司董事会的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"国有独资公司可以不设董事会"},{"key":"B","text":"国有独资公司的董事会成员中，外部董事的比例不能低于 1/3"},{"key":"C","text":"国有独资公司的董事会成员中，应当有公司职工代表"},{"key":"D","text":"国有独资公司董事会成员中的职工代表由履行出资人职责的机构委派"}],"answer":["C"],"explanation":"本题考查董事会的职权和设置。 根据《公司法》，国有独资公司设董事会（选项 A 错误），并依照《公司法》的规定行使职权。 国有独资公司的董事会成员中，应当过半数为外部董事（选项 B 错误），并应当有公司职工代表（选项 C 正确）。 董事会成员由履行出资人职责的机构委派；但是，董事会成员中的职工代表由公司职工代表大会选举产生（选项 D 错误）。 故本题选 C 选项。","id":"gongshang-0076","bank":"gongshang"},{"chapter":"","point":"国家出资公司董事会","type":"single","stem":"关于国家出资公司董事会议事规则的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"严格实行集体审议、独立表决、企业负责的决策制度"},{"key":"B","text":"一人一票表决"},{"key":"C","text":"建立规范透明的重大事项信息公开和对外披露制度"},{"key":"D","text":"建立董事会决议跟踪落实以及事后评估制度"}],"answer":["A"],"explanation":"本题考查董事会的议事规则。 根据《指导意见》，国家出资公司董事会要严格实行集体审议、独立表决、个人负责的决策制度，平等充分发表意见，一人一票表决，选项 A 错误。 故本题选 A 选项。","id":"gongshang-0077","bank":"gongshang"},{"chapter":"","point":"国家出资公司经理层","type":"multi","stem":"国家出资公司总经理拥有的职权包括（ ）。","material":"","options":[{"key":"A","text":"管理生产经营"},{"key":"B","text":"分配利润"},{"key":"C","text":"向董事会报告工作"},{"key":"D","text":"组织实施董事会决议"},{"key":"E","text":"制定公司章程"}],"answer":["A","C","D"],"explanation":"本题考查国家出资公司经理层的设立和职责。 《指导意见》指出，经理层是公司的执行机构，依法由董事会聘任或解聘，接受董事会管理和监事会监督。 总经理对董事会负责，依法行使管理生产经营、组织实施董事会决议等职权，向董事会报告工作，董事会闭会期间向董事长报告工作。 故本题选 ACD 选项。","id":"gongshang-0078","bank":"gongshang"},{"chapter":"","point":"国家出资公司经理层","type":"single","stem":"国家出资公司经理层的管理制度不包括（ ）。","material":"","options":[{"key":"A","text":"经理层授权管理制度"},{"key":"B","text":"职业经理人制度"},{"key":"C","text":"以优进绌退为目标的考核评价制度"},{"key":"D","text":"与公司性质相适应的平均化薪酬分配制度"}],"answer":["D"],"explanation":"本题考查国家出资公司经理层的管理制度。 国家出资公司经理层的管理制度有： ①经理层授权管理制度（选项 A 不符合题意）； ②职业经理人制度（选项 B 不符合题意）； ③以优进绌退为目标的考核评价制度（选项 C 不符合题意）； ④与社会主义市场经济相适应的薪酬分配制度（选项 D 符合题意）。 故本题选 D 选项。","id":"gongshang-0079","bank":"gongshang"},{"chapter":"","point":"国家出资公司的监督机制☆","type":"single","stem":"关于国家出资公司的监督机制的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"国家出资公司必须设置监事会"},{"key":"B","text":"国有独资、全资公司的监事会中须有职工监事"},{"key":"C","text":"国家出资公司要加强职工民主管理与监督"},{"key":"D","text":"国家出资公司应当加强内部合规管理"}],"answer":["A"],"explanation":"本题考查国家出资公司的监督体系。 关于国有独资公司监事会的设置，《公司法》关于“国家出资公司组织机构的特别规定”中明确指出，国有独资公司在董事会中设置由董事组成的审计委员会行使《公司法》规定的监事会职权的，不设监事会或者监事，选项 A 错误。 故本题选 A 选项。","id":"gongshang-0080","bank":"gongshang"},{"chapter":"","point":"国家出资公司的监督机制☆","type":"single","stem":"国家出资公司应当加强内部合规管理，具体要求不包括（ ）。","material":"","options":[{"key":"A","text":"明晰各部门合规审查职责和界限"},{"key":"B","text":"进一步提升合规审查的柔性"},{"key":"C","text":"确保“应审必审”"},{"key":"D","text":"完善合规审查闭环管理"}],"answer":["B"],"explanation":"本题考查公司内部的合规管理。 根据《中央企业合规管理办法》，合规审查应满足以下要求： ①明晰各部门合规审查职责和界限（选项 A 不符合题意）； ②进一步强化合规审查的刚性约束（选项 B 符合题意）。企业应当将合规审查作为必经程序嵌入流程，重大决策事项的合规审查意见应当由首席合规官签字，对决策事项的合规性提出明确意见，进一步突出合规审查的刚性约束，确保“应审必审”（选项 C 不符合题意）； ③完善合规审查闭环管理（选项 D 不符合题意）。 故本题选 B 选项。","id":"gongshang-0081","bank":"gongshang"},{"chapter":"","point":"市场营销宏观环境","type":"multi","stem":"下列因素中，属于市场营销宏观环境中人口环境的有（ ）。","material":"","options":[{"key":"A","text":"宗教信仰"},{"key":"B","text":"年龄结构"},{"key":"C","text":"教育水平"},{"key":"D","text":"性别结构"},{"key":"E","text":"民族构成"}],"answer":["B","D","E"],"explanation":"本题考查市场营销宏观环境。 市场营销宏观环境中的人口环境包括人口总量、地理分布、年龄结构、性别结构、民族构成等因素，选项 BDE 正确。 宗教信仰、伦理道德、习俗、教育水平因素属于社会文化环境，选项 AC 错误。 故本题选 BDE 选项。","id":"gongshang-0082","bank":"gongshang"},{"chapter":"","point":"市场营销宏观环境","type":"multi","stem":"可任意支配收入是可支配收入减去（ ）之后的剩余资金。","material":"","options":[{"key":"A","text":"购买食品"},{"key":"B","text":"缴纳所得税"},{"key":"C","text":"支付房租"},{"key":"D","text":"支付燃气费"},{"key":"E","text":"偿还房贷"}],"answer":["A","C","D","E"],"explanation":"本题考查市场营销宏观环境。 可任意支配收入是指个人可支配收入减去维持生命所必需的支出（如购买食品，交付房租、燃气费、暖气费、水电费等）和其他固定支出（如偿还贷款等）之后的余额，这部分收入越多，人们的消费水平越高，企业的营销机会也就越多，选项 ACDE 正确。 可支配收入是指个人收入减去直接负担的各项税款（如所得税、消费税等）和非税性负担（如工会会费、住房公积金等）之后的余额，选项 B 错误。 故本题选 ACDE 选项。","id":"gongshang-0083","bank":"gongshang"},{"chapter":"","point":"市场营销微观环境☆","type":"multi","stem":"市场营销环境是指作用于企业营销活动的一切外界因素和力量的总和，可以分为宏观环境和微观环境，下列选项中属于微观环境的有（ ）。","material":"","options":[{"key":"A","text":"人口环境"},{"key":"B","text":"公众"},{"key":"C","text":"供应商"},{"key":"D","text":"竞争者"},{"key":"E","text":"自然环境"}],"answer":["B","C","D"],"explanation":"本题考查市场营销微观环境。 （1）市场营销微观环境包括：企业自身的各种因素、竞争者、供应商、营销渠道企业、顾客、公众，选项 BCD 正确。 （2）市场营销宏观环境包括：人口、经济、自然、技术、政治法律和社会文化环境，选项 AE 错误。 故本题选 BCD 选项。","id":"gongshang-0084","bank":"gongshang"},{"chapter":"","point":"市场营销微观环境☆","type":"single","stem":"下列不属于市场营销微观环境要素的是（ ）。","material":"","options":[{"key":"A","text":"企业自身"},{"key":"B","text":"竞争者"},{"key":"C","text":"顾客和公众"},{"key":"D","text":"社会购买力"}],"answer":["D"],"explanation":"本题考查市场营销微观环境。 市场营销微观环境要素包括： （1）企业自身，选项 A 不符合题意； （2）供应商； （3）竞争者，选项 B 不符合题意； （4）营销渠道企业； （5）顾客； （6）公众，选项 C 不符合题意。 社会购买力属于市场营销宏观环境中的经济环境要素，选项 D 符合题意。 故本题选 D 选项。","id":"gongshang-0085","bank":"gongshang"},{"chapter":"","point":"市场营销环境分析","type":"single","stem":"根据环境威胁矩阵图，当处于第Ⅳ象限时，企业的反应为（ ）。","material":"","options":[{"key":"A","text":"企业应处于高度重视状态，必须严密监视和预测其发展变化趋势，积极采取相应的对策"},{"key":"B","text":"企业应制定相应的措施，力争避免危害"},{"key":"C","text":"企业应该予以重视，准备相应的对策措施"},{"key":"D","text":"企业不必担心，但应该注意观察其发展变化，看它是否有向其他象限发展变化的可能"}],"answer":["C"],"explanation":"本题考查环境威胁矩阵图。 根据环境威胁矩阵，可知： 选项 A 错误，在第Ⅰ象限内，环境威胁的影响程度高，出现的概率大，表明企业面临着严重的环境危机。企业应高度重视这一问题，必须严密监视和预测其发展变化趋势，积极采取相应的对策。 选项 B 错误，在第Ⅱ象限内，环境威胁的影响程度高，出现的概率小。虽然出现的概率小，但一旦出现会给企业营销带来特别大的危害。企业应制定相应的措施，力争避免危害。 选项 D 错误，在第Ⅲ象限内，环境威胁的影响程度低，出现的概率小，在这种情况下，企业不必过于担心，但应该注意观察其发展变化，看它是否有向其他象限发展变化的可能。 选项 C 正确，在第Ⅳ象限内，环境威胁的影响程度低，但出现的概率却很大，对 此企业也应该予以重视，准备相应的对策措施。 故本题选 C 选项。","id":"gongshang-0086","bank":"gongshang"},{"chapter":"","point":"市场营销环境分析","type":"single","stem":"根据环境威胁矩阵图，在第Ⅱ象限内（ ）。","material":"","options":[{"key":"A","text":"环境威胁程度高，出现的概率大"},{"key":"B","text":"环境威胁程度高，出现的概率小"},{"key":"C","text":"环境威胁程度低，出现的概率很大"},{"key":"D","text":"环境威胁程度低，出现的概率也小"}],"answer":["B"],"explanation":"本题考查环境威胁矩阵图。 在第Ⅰ象限内，环境威胁的影响程度高，出现的概率大，选项 A 错误。 在第Ⅱ象限内，环境威胁的影响程度高，出现的概率小，选项 B 正确。 在第Ⅲ象限内，环境威胁的影响程度低，出现的概率小，选项 D 错误。 在第Ⅳ象限内，环境威胁的影响程度低，但出现的概率却很大，选项 C 错误。 故本题选 B 选项。","id":"gongshang-0087","bank":"gongshang"},{"chapter":"","point":"市场营销战略规划","type":"multi","stem":"企业任务书应满足的条件包括（ ）。","material":"","options":[{"key":"A","text":"反映的目标应是有限的、具体的、明确的"},{"key":"B","text":"应是市场导向而非产品导向"},{"key":"C","text":"要富有激励性"},{"key":"D","text":"定量与定性相结合"},{"key":"E","text":"政策具体、分工明确"}],"answer":["A","B","C","E"],"explanation":"本题考查确定企业任务。 企业任务书应满足的条件包括： （1）反映的目标应是有限的、具体的、明确的； （2）应是市场导向而非产品导向； （3）要富有激励性； （4）政策具体、分工明确。 故本题选 ABCE 选项。","id":"gongshang-0088","bank":"gongshang"},{"chapter":"","point":"市场营销战略规划","type":"single","stem":"通用电气矩阵可分为三个地带，其中行业吸引力和战略业务单位的业务力量居于一般水平的是（ ）。","material":"","options":[{"key":"A","text":"绿色地带"},{"key":"B","text":"红色地带"},{"key":"C","text":"蓝色地带"},{"key":"D","text":"黄色地带"}],"answer":["D"],"explanation":"本题考查安排业务组合。 通用电气矩阵可以分为三个地带： （1）绿色地带的行业吸引力和战略业务单位的业务力量都很强。 （2）黄色地带的行业吸引力和战略业务单位的业务力量居于一般水平。 （3）红色地带的行业吸引力偏小，战略业务单位的业务力量偏弱。 故本题选 D 选项。","id":"gongshang-0089","bank":"gongshang"},{"chapter":"","point":"目标市场战略","type":"multi","stem":"下列关于市场细分的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"市场细分是把某一产品的整体市场分割成需求不同的若干个市场的过程"},{"key":"B","text":"市场细分是通过产品本身的分类来细分市场"},{"key":"C","text":"市场细分是根据不同的顾客群来进行细分市场"},{"key":"D","text":"市场细分的基础是消费需求的差异性"},{"key":"E","text":"市场细分的主要变量有地理变量、人口变量、心理变量和行为变量"}],"answer":["A","C","D","E"],"explanation":"本题考查市场细分。 市场细分并不是通过产品本身的分类来进行细分，而是根据不同的顾客群来进行细分，也就是说，消费需求的差异性是市场细分的基础，选项 B 错误。 故本题选 ACDE 选项。","id":"gongshang-0090","bank":"gongshang"},{"chapter":"","point":"目标市场战略","type":"single","stem":"某企业实力雄厚，全方位地进入各个细分市场，为所有顾客提供全心全意所需要的性能不同的系列产品。该企业选择目标市场的模式属于（ ）。","material":"","options":[{"key":"A","text":"全面进入模式"},{"key":"B","text":"产品专业化模式"},{"key":"C","text":"选择专业化模式"},{"key":"D","text":"市场专业化模式"}],"answer":["A"],"explanation":"本题考查选择目标市场的模式相关内容。 企业在选择目标市场时可采用的模式主要有以下五种。 选项 A 正确，全面进入指企业全方位进入各个细分市场，为所有顾客提供所需要的性能不同的系列产品。 选项 B 错误，产品专业化指企业向各类顾客同时供应某种产品，但是这种产品在质量、款式、档次等方面都会有所不同。 选项 C 错误，选择性专业化指企业有选择地进入几个不同的细分市场，为不同顾客群提供不同性能的产品。 选项 D 错误，市场专业化指企业向同一顾客群提供性能有所区别的产品。 故本题选 A 选项。","id":"gongshang-0091","bank":"gongshang"},{"chapter":"","point":"产品策略","type":"single","stem":"某企业在其干脆面产品中放入随机的动画人物卡片属于（ ）包装。","material":"","options":[{"key":"A","text":"分量"},{"key":"B","text":"附赠品"},{"key":"C","text":"个别"},{"key":"D","text":"分等级"}],"answer":["B"],"explanation":"本题考查包装策略。 选项 A 错误，分量包装策略，即企业根据目标市场消费者的使用需要，将产品按照不同数量或重量进行包装。 选项 B 正确，附赠品包装策略是指企业在产品包装内附加一些赠品，或奖券或实物，给消费者以意外的惊喜，从而吸引其购买。 选项 C 错误，个别包装策略，即企业的各种产品都有自己独特的包装，在设计上采用不同的风格。 选项 D 错误，分等级包装策略，即企业根据产品的不同质量档次，设计、使用不同等级的包装。 故本题选 B 选项。","id":"gongshang-0092","bank":"gongshang"},{"chapter":"","point":"产品策略","type":"single","stem":"要求消费者改变原有消费模式的产品是（ ）。","material":"","options":[{"key":"A","text":"全新产品"},{"key":"B","text":"换代产品"},{"key":"C","text":"工艺创新"},{"key":"D","text":"改进产品"}],"answer":["B"],"explanation":"本题考查新产品的分类。 换代产品，即在原有产品的基础上，采用或部分采用新技术、新材料、新工艺研制出来的产品。如数字电视就是彩色电视的换代产品。一般而言，这种新产品要求消费者改变原有的消费模式。 故本题选 B 选项。","id":"gongshang-0093","bank":"gongshang"},{"chapter":"","point":"定价策略","type":"multi","stem":"对企业定价影响较大的因素主要有（ ）。","material":"","options":[{"key":"A","text":"市场需求"},{"key":"B","text":"市场竞争"},{"key":"C","text":"成本"},{"key":"D","text":"服务"},{"key":"E","text":"产品性能"}],"answer":["A","B","C"],"explanation":"本题考查影响产品定价的因素。 对企业定价影响较大的因素主要有：市场需求、成本、市场竞争。 故本题选 ABC 选项。","id":"gongshang-0094","bank":"gongshang"},{"chapter":"","point":"定价策略","type":"multi","stem":"企业常用的产品定价方法主要有（ ）。","material":"","options":[{"key":"A","text":"成本导向定价法"},{"key":"B","text":"战略导向定价法"},{"key":"C","text":"需求导向定价法"},{"key":"D","text":"供给导向定价法"},{"key":"E","text":"竞争导向定价法"}],"answer":["A","C","E"],"explanation":"本题考查产品定价方法。 企业常用的产品定价方法可概括为成本导向定价法、需求导向定价法和竞争导向定价法。 故本题选 ACE 选项。","id":"gongshang-0095","bank":"gongshang"},{"chapter":"","point":"促销策略","type":"multi","stem":"营销人员可以选择的基本促销组合策略包括（ ）。","material":"","options":[{"key":"A","text":"拉引策略"},{"key":"B","text":"垂直营销策略"},{"key":"C","text":"推动策略"},{"key":"D","text":"水平营销策略"},{"key":"E","text":"多渠道营销策略"}],"answer":["A","C"],"explanation":"本题考查促销组合。 营销人员可以选择两种基本的促销组合策略为拉引策略与推动策略。 故本题选 AC 选项。","id":"gongshang-0096","bank":"gongshang"},{"chapter":"","point":"促销策略","type":"single","stem":"某商场为了刺激需求，采用了价格促销、抽奖等促销措施，这属于促销策略中的（ ）。","material":"","options":[{"key":"A","text":"公共关系"},{"key":"B","text":"人员推销"},{"key":"C","text":"销售促进"},{"key":"D","text":"拉引销售"}],"answer":["C"],"explanation":"本题考查销售促进。 销售促进的工具多种多样。 针对消费者的销售促进工具，有价格促销、赠品促销、抽奖、会员与积分、免费试用等； 针对中间商的销售促进工具，有价格折扣、津贴补助、销售奖励、培训支持等； 针对推销人员的销售促进工具，提供业务培训、奖金、佣金等。 故本题选 C 选项。","id":"gongshang-0097","bank":"gongshang"},{"chapter":"","point":"品牌资产","type":"multi","stem":"在大卫·艾克提出的品牌资产的“五星”概念模型中，品牌资产包括（ ）。","material":"","options":[{"key":"A","text":"品牌知名度"},{"key":"B","text":"品牌满意度"},{"key":"C","text":"品牌忠诚度"},{"key":"D","text":"品牌认知度"},{"key":"E","text":"品牌扩张度"}],"answer":["A","C","D"],"explanation":"本题考查品牌资产。 大卫·艾克在 1991 年提出品牌资产的“五星”概念模型，即品牌资产是由品牌知名度、品牌联想度、品牌忠诚度、品牌认知度和品牌其他资产五部分组成。选项 ACD 正确。 选项 B 品牌满意度、选项 E 品牌扩张度为错误选项。 故本题选 ACD 选项。","id":"gongshang-0098","bank":"gongshang"},{"chapter":"","point":"品牌资产","type":"single","stem":"在大卫·艾克提出的品牌资产的“五星”概念模型中，消费者对某一品牌在品质上的整体印象称为（ ）。","material":"","options":[{"key":"A","text":"品牌认知度"},{"key":"B","text":"品牌忠诚度"},{"key":"C","text":"品牌联想度"},{"key":"D","text":"品牌知名度"}],"answer":["A"],"explanation":"本题考查对品牌资产。 选项 A 正确，品牌认知度是指消费者对某一品牌在品质上的整体印象，主要包括消费者对产品质量和服务质量的认知。 选项 B 错误，品牌忠诚度是指消费者在购买决策中多次表现出来的对某个品牌有偏向性的行为反应，也是消费者对某种品牌的心理决策和评估过程。 选项 C 错误，品牌联想度是指消费者通过品牌而产生的所有联想，是对产品特征、消费者利益、使用场合、产地、人物、个性等的人格化描述。 选项 D 错误，品牌知名度是指消费者对一个品牌的记忆程度。 故本题选 A 选项。","id":"gongshang-0099","bank":"gongshang"},{"chapter":"","point":"家族品牌决策","type":"single","stem":"企业对各种不同的产品分别使用不同的品牌，这属于（ ）。","material":"","options":[{"key":"A","text":"个别品牌策略"},{"key":"B","text":"统一品牌策略"},{"key":"C","text":"分类家族品牌策略"},{"key":"D","text":"企业名称与个别品牌并用策略"}],"answer":["A"],"explanation":"本题考查家族品牌决策。 个别品牌策略，即企业对各种不同的产品分别使用不同的品牌，选项 A 正确。 统一品牌策略，即企业所有的产品使用同一个品牌，选项 B 错误。 分类家族品牌策略，即企业对各种类别不同的产品分别使用不同的品牌选项 C 错误。 企业名称与个别品牌并用策略，即在每一个品牌之前均冠以企业名称，以企业名称表明产品出处，以品牌名称表明产品的特点，选项 D 错误。 故本题选 A 选项。","id":"gongshang-0100","bank":"gongshang"},{"chapter":"","point":"家族品牌决策","type":"single","stem":"某空调生产企业针对高端产品品牌定位为“*帝”，中端品牌定位为“*尔”，低端品牌定位为“*星”，则该企业使用的品牌策略为（ ）。","material":"","options":[{"key":"A","text":"个别品牌策略"},{"key":"B","text":"统一品牌策略"},{"key":"C","text":"企业名称与个别品牌并用策略"},{"key":"D","text":"分类家族品牌策略"}],"answer":["D"],"explanation":"本题考查家族品牌决策。 选项 A 错误，个别品牌策略，即企业对各种不同的产品分别使用不同的品牌。 选项 B 错误，统一品牌策略，即企业所有的产品都使用同一个品牌。 选项 C 错误，企业名称与个别品牌并用策略，即在每一个品牌之前均冠以企业名称，以企业名称表明产品出处，以品牌名称表明产品的特点。 选项 D 正确，分类家族品牌策略即企业对各种类别不同的产品分别使用不同的品牌。该家电企业针对不同档次的空调，定义不同的品牌名称。 故本题选 D 选项。","id":"gongshang-0101","bank":"gongshang"},{"chapter":"","point":"家族延伸决策","type":"single","stem":"企业将现有成功的品牌名称使用到新产品上，包括新包装、新规格和新式样等，这属于（ ）。","material":"","options":[{"key":"A","text":"品牌有无决策"},{"key":"B","text":"品牌延伸决策"},{"key":"C","text":"家族品牌决策"},{"key":"D","text":"品牌重新定位决策"}],"answer":["B"],"explanation":"本题考查品牌战略。 选项 A 错误，品牌有无决策指对大多数企业来说，使用品牌有着十分重要的意义，但有些产品就没有必要使用品牌。 选项 B 正确，品牌延伸决策即企业将现有成功的品牌名称使用到新产品上，包括新包装、新规格和新式样等。 选项 C 错误，家族品牌决策即企业对其生产的不同种类、规格、质量的产品选择统一或不同的品牌名称。 选项 D 错误，一个品牌在市场上长久使用，消费者就会失去新鲜感；或者当一种相似产品出现之后，消费者可能转移消费，使本企业的产品销量下降，这就要求企业对原有品牌进行重新定位。 故本题选 B 选项。","id":"gongshang-0102","bank":"gongshang"},{"chapter":"","point":"多品牌决策☆","type":"single","stem":"某电视机品牌同时经营“*星”和“*月”两个相互竞争的品牌，这种品牌策略属于（ ）。","material":"","options":[{"key":"A","text":"个别品牌策略"},{"key":"B","text":"统一品牌策略"},{"key":"C","text":"分类家族品牌策略"},{"key":"D","text":"多品牌决策"}],"answer":["D"],"explanation":"本题考查多品牌决策。 选项 A 错误，个别品牌策略指企业对各种不同的产品分别使用不同的品牌。 选项 B 错误，统一品牌策略，即企业所有的产品使用同一个品牌。 选项 C 错误，分类家族品牌策略指企业对各种类别不同的产品分别使用不同的品牌。 选项 D 正确，多品牌决策是指，企业决定同时经营两种或两种以上互相竞争的品牌。电视机品牌同时经营“*星”和“*月”两个相互竞争的品牌，属于多品牌决 策。 故本题选 D 选项。","id":"gongshang-0103","bank":"gongshang"},{"chapter":"","point":"渠道管理概述","type":"multi","stem":"下列属于分销渠道成员的是（ ）。","material":"","options":[{"key":"A","text":"生产者"},{"key":"B","text":"中间商"},{"key":"C","text":"广告代理机构"},{"key":"D","text":"最终消费者"},{"key":"E","text":"金融机构"}],"answer":["A","B","D"],"explanation":"本题考查市场营销渠道和分销渠道。 分销渠道的成员是指商品从生产者向消费者转移过程中，取得这种商品的所有权或帮助所有权转移的所有企业和个人，包括生产者、中间商和最终消费者，选项 ABD 正确。 广告代理机构和金融机构属于辅助商，不属于分销渠道，选项 CE 错误。 故本题选 ABD 选项。","id":"gongshang-0104","bank":"gongshang"},{"chapter":"","point":"渠道管理概述","type":"single","stem":"（ ）既是企业分销渠道管理目标，也是企业经营活动的重要指标，反映企业的经营状况。","material":"","options":[{"key":"A","text":"市场占有率"},{"key":"B","text":"净资产收益率"},{"key":"C","text":"利润额"},{"key":"D","text":"销售增长额"}],"answer":["C"],"explanation":"本题考查分销渠道管理目标。 利润额是指企业的分销活动能给企业带来的利润数量。利润额的多少反映了企业经营状况的好坏。实现一定的利润额不仅是企业分销渠道管理的目标，也是评价企业经营活动的重要指标之一。 故本题选 C 选项。 ；提醒； 分销渠道管理的目标有 3 个，每一项反映的内容不一样。可理解记忆。 （1）利润额反映企业经营状况的好坏，是分销活动能给企业带来的利润数量，不仅是企业分销渠道管理目标，也是企业经营活动重要的指标之一。 （2）市场占有率反映的是企业营销能力，占有率高的代表营销能力强。 （3）销售增长额反映企业发展状况，销售增长额越多发展的越好。","id":"gongshang-0105","bank":"gongshang"},{"chapter":"","point":"不同类型商品分销渠道的构建","type":"single","stem":"将消费品按照消费者购买习惯分类，那么家用电器属于（ ）。","material":"","options":[{"key":"A","text":"便利品"},{"key":"B","text":"选购品"},{"key":"C","text":"特殊品"},{"key":"D","text":"非渴求品"}],"answer":["B"],"explanation":"本题考查消费品的定义及分类。 选项 A 错误，便利品是指消费者购买频繁，不愿花时间和精力比较品牌、价格，希望随时随地能买到的产品。 选项 B 正确，选购品是指消费者对产品或服务的价格、质量、款式、耐用性等进行比较之后才会购买的产品，如家用电器、服装、美容美发产品等。 选项 C 错误，特殊品是指具备独有特征或品牌标志的产品。对这些产品，消费者愿意付出特殊的购买努力，如特殊品牌和式样的汽车、服装等。 选项 D 错误，非渴求品是指那些消费者不知道或虽然知道但一般情况下不会主动购买的产品。 故本题选 B 选项。","id":"gongshang-0106","bank":"gongshang"},{"chapter":"","point":"不同类型商品分销渠道的构建","type":"multi","stem":"工业品市场特点表现为（ ）。","material":"","options":[{"key":"A","text":"需求的派生性"},{"key":"B","text":"专业采购"},{"key":"C","text":"需求弹性大"},{"key":"D","text":"一次购买量大"},{"key":"E","text":"顾客分散"}],"answer":["A","B","D"],"explanation":"本题考查工业品市场及其特点。 工业品市场特点表现为：需求的派生性、需求弹性小、专业采购、一次购买量大和顾客集中稳定。 故本题选 ABD 选项。","id":"gongshang-0107","bank":"gongshang"},{"chapter":"","point":"渠道成员管理","type":"multi","stem":"下列对渠道成员的激励方法中属于业务激励的有（ ）。","material":"","options":[{"key":"A","text":"佣金总额动态管理"},{"key":"B","text":"合作制订经营计划"},{"key":"C","text":"灵活确定佣金比例"},{"key":"D","text":"安排经销商会议"},{"key":"E","text":"公关宴请"}],"answer":["A","B","C","D"],"explanation":"本题考查渠道成员的激励。 企业对渠道成员的业务激励包括佣金总额动态管理、灵活确定佣金比例、安排经销商会议和合作制订经营计划等，选项 ABCD 正确。 公关宴请属于沟通激励，选项 E 错误。 故本题选 ABCD 选项。","id":"gongshang-0108","bank":"gongshang"},{"chapter":"","point":"渠道权力管理","type":"single","stem":"某成功企业将其先进的管理经验、品牌、技术等以特许经营的方式授予加盟店，并对加盟店进行统一管理，以此建立业务渠道，该企业进行渠道管理的权力来源是（ ）。","material":"","options":[{"key":"A","text":"强迫权"},{"key":"B","text":"认同权"},{"key":"C","text":"专长权"},{"key":"D","text":"信息权"}],"answer":["C"],"explanation":"本题考查渠道权力来源的类型。 专长权是指受影响的渠道成员认为，影响者具备其所不具备的某种特殊知识或有用的专长。例如，特许经营就是一种典型的租借授权人的专长开展自己业务的渠道管理方式，题目中描述的特许经营属于专长权。 故本题选 C 选项。","id":"gongshang-0109","bank":"gongshang"},{"chapter":"","point":"渠道权力管理","type":"multi","stem":"在一个行业或市场中，作为供应者的生产厂商处于有利的控制者地位，此时存在的情况通常包括（ ）。","material":"","options":[{"key":"A","text":"厂商能实施前向一体化"},{"key":"B","text":"厂商的产品没有互补品"},{"key":"C","text":"消费者或者产品是同质化的"},{"key":"D","text":"获得该生产厂商的产品对消费者十分重要"},{"key":"E","text":"该行业由少数几家大厂商控制"}],"answer":["A","D","E"],"explanation":"本题考查生产厂商渠道控制力的保持。 在一个行业或市场中，如果存在下列情况，则作为供应者的生产厂商处于有利的 控制者地位： （1）该行业由少数几家大厂商控制（选项 E 正确）； （2）厂商的产品没有替代品（选项 B 错误）； （3）获得该生产厂商的产品对消费者十分重要（选项 D 正确）； （4）消费者或者产品是差异化的（选项 C 错误），厂商能够方便地完成成本转移； （5）厂商能实施前向一体化（选项 A 正确）。 故本题选 ADE 选项。","id":"gongshang-0110","bank":"gongshang"},{"chapter":"","point":"渠道冲突管理","type":"multi","stem":"渠道冲突的本质是渠道主体在（ ）上的冲突。","material":"","options":[{"key":"A","text":"心理"},{"key":"B","text":"目标"},{"key":"C","text":"行为"},{"key":"D","text":"利益"},{"key":"E","text":"价值观"}],"answer":["A","C","D"],"explanation":"本题考查渠道冲突的定义。 渠道冲突是指渠道成员之间因为利益关系产生的矛盾和不协调，其本质是渠道主体利益、行为和心理上的冲突。 故本题选 ACD 选项。","id":"gongshang-0111","bank":"gongshang"},{"chapter":"","point":"渠道冲突管理","type":"multi","stem":"导致渠道冲突的原因包括（ ）。","material":"","options":[{"key":"A","text":"角色错位"},{"key":"B","text":"目标差异"},{"key":"C","text":"期望一致"},{"key":"D","text":"资源稀缺"},{"key":"E","text":"地理位置"}],"answer":["A","B","D"],"explanation":"本题考查渠道冲突产生的原因。 渠道冲突产生的原因包括角色错位、目标差异、观点差异、沟通困难、决策权分歧、期望差异和资源稀缺等。 故本题选 ABD 选项。","id":"gongshang-0112","bank":"gongshang"},{"chapter":"","point":"渠道差距评估","type":"single","stem":"服务质量差距模型中，由于企业未能执行宣传中的服务质量标准而形成的差距属于（ ）。","material":"","options":[{"key":"A","text":"服务传递差距"},{"key":"B","text":"质量标准差距"},{"key":"C","text":"功能性冲突"},{"key":"D","text":"市场沟通差距"}],"answer":["D"],"explanation":"本题考查渠道差距的产生。 选项 A 错误，服务传递差距是指因为服务生产与传递过程未按照企业所设定的标 准进行而产生的差距。 选项 B 错误，质量标准差距是指服务提供者制定的服务标准与管理者所认知的顾客期望不一致导致的差距。 选项 C 错误，功能性冲突属于渠道冲突的类型，不属于服务质量差距模型。 选项 D 正确，市场沟通差距意味着企业在市场宣传中所承诺的服务与企业实际提供的服务不同。 故本题选 D 选项。","id":"gongshang-0113","bank":"gongshang"},{"chapter":"","point":"渠道差距评估","type":"single","stem":"消除供应方差距的思路不包括（ ）。","material":"","options":[{"key":"A","text":"改变当前渠道成员的角色"},{"key":"B","text":"引进新的分销专家，改进渠道运营"},{"key":"C","text":"利用新的分销技术降低成本"},{"key":"D","text":"详细了解细分市场顾客需求"}],"answer":["D"],"explanation":"本题考查消除渠道差距的思路。 消除供应方差距的思路有： （1）改变当前渠道成员的角色，选项 A 不符合题意； （2）利用新的分销技术降低成本，选项 C 不符合题意； （3）引进新的分销专家，改进渠道运营，选项 B 不符合题意。 详细了解细分市场顾客需求属于消除需求方差距的思路，选项 D 符合题意。 故本题选 D 选项。","id":"gongshang-0114","bank":"gongshang"},{"chapter":"","point":"分销渠道运行绩效评估","type":"multi","stem":"以下指标可以用来评价渠道畅通性的有（ ）。","material":"","options":[{"key":"A","text":"商品周转速度"},{"key":"B","text":"货款回收速度"},{"key":"C","text":"渠道销售增长率"},{"key":"D","text":"渠道费用利润率"},{"key":"E","text":"销售回款率"}],"answer":["A","B","E"],"explanation":"本题考查渠道畅通性评估。 渠道畅通性主要评价产品流通速度，用商品传输时间来衡量。商品传输时间是指商品从企业流到最终消费者手中的时间，以“天”为单位。 商品传输时间越短，说明渠道畅通性越好。常用的畅通性评价指标包括商品周转速度、货款回收速度和销售回款率，选项 ABE 正确。 渠道销售增长率和渠道费用利润率属于渠道盈利能力指标，选项 CD 错误。 故本题选 ABE 选项。","id":"gongshang-0115","bank":"gongshang"},{"chapter":"","point":"分销渠道运行绩效评估","type":"multi","stem":"下列指标可用于衡量渠道盈利能力的是（ ）。","material":"","options":[{"key":"A","text":"渠道销售利润率"},{"key":"B","text":"渠道资产利润率"},{"key":"C","text":"渠道费用利润率"},{"key":"D","text":"分销渠道费用率"},{"key":"E","text":"销售回款率"}],"answer":["A","B","C"],"explanation":"本题考查渠道盈利能力指标。 渠道盈利能力可用以下指标衡量：渠道销售增长率、渠道销售利润率、渠道费用利润率和渠道资产利润率，选项 ABC 正确。 分销渠道费用率属于分销渠道费用指标，选项 D 错误。 销售回款率属于渠道畅通性评估，选项 E 正确。 故本题选 ABC 选项。","id":"gongshang-0116","bank":"gongshang"},{"chapter":"","point":"网络分销渠道","type":"multi","stem":"网络分销渠道的特征包括（ ）。","material":"","options":[{"key":"A","text":"复杂性"},{"key":"B","text":"全球性"},{"key":"C","text":"便利性"},{"key":"D","text":"经济性"},{"key":"E","text":"虚拟性"}],"answer":["C","D","E"],"explanation":"本题考查网络分销渠道的特征。 网络分销渠道的特征包括： （1）虚拟性，整个购物过程只是人与网站的对话，销售活动在虚拟环境下完成； （2）经济性，网络分销渠道可以有效地降低分销成本，提高分销效率； （3）便利性，与传统分销渠道比较起来，网络分销渠道更能节省时间与精力。 故本题选 CDE 选项。","id":"gongshang-0117","bank":"gongshang"},{"chapter":"","point":"网络分销渠道","type":"multi","stem":"网络分销功能的实现需要完整的系统支撑，这些系统包括（ ）。","material":"","options":[{"key":"A","text":"订货系统"},{"key":"B","text":"设计系统"},{"key":"C","text":"结算系统"},{"key":"D","text":"配送系统"},{"key":"E","text":"生产系统"}],"answer":["A","C","D"],"explanation":"本题考查网络分销系统。 网络分销功能的实现需要完整的系统支撑，这些系统包括订货系统、结算系统和配送系统。 故本题选 ACD 选项。","id":"gongshang-0118","bank":"gongshang"},{"chapter":"","point":"渠道扁平化☆","type":"multi","stem":"促进渠道扁平化的原因包括（ ）。","material":"","options":[{"key":"A","text":"渠道横向一体化的影响"},{"key":"B","text":"顾客对商品的个性化要求越来越高"},{"key":"C","text":"经济全球化的影响"},{"key":"D","text":"消费的“折中主义”"},{"key":"E","text":"顾客不确定性的增加和承诺的丧失"}],"answer":["B","D","E"],"explanation":"本题考查渠道扁平化的原因。 渠道扁平化的原因有： （1）网络信息技术的影响； （2）渠道纵向一体化的影响； （3）顾客需求特征的影响，包括顾客对商品的个性化要求越来越高、顾客不确定性的增加和承诺的丧失以及消费的“折中主义”三个方面。 故本题选 BDE 选项。","id":"gongshang-0119","bank":"gongshang"},{"chapter":"","point":"渠道扁平化☆","type":"single","stem":"渠道扁平化的形式中，（ ）也称为绝对扁平化渠道，是最原始的交易方式。","material":"","options":[{"key":"A","text":"直接渠道"},{"key":"B","text":"有一层中间商的扁平化渠道"},{"key":"C","text":"有两层中间商的扁平化渠道"},{"key":"D","text":"有三层中间商的扁平化渠道"}],"answer":["A"],"explanation":"本题考查渠道扁平化的形式。 （1）渠道扁平化的形式分为三种，直接渠道、有一层中间商的扁平化渠道、有两层中间商的扁平化渠道。 （2）渠道扁平化的形式中，直接渠道也称绝对扁平化渠道，这是最原始的交易方式。在网络环境下，这种环境的直接渠道形式呈现出新的形式，如网站订单、短信订单等模式。 故本题选 A 选项。","id":"gongshang-0120","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"multi","stem":"渠道战略联盟的形式包括（ ）。","material":"","options":[{"key":"A","text":"经销商之间的战略联盟"},{"key":"B","text":"生产商之间的战略联盟"},{"key":"C","text":"供应商之间的战略联盟"},{"key":"D","text":"生产商和供应商之间的战略联盟"},{"key":"E","text":"生产商和经销商之间的战略联盟"}],"answer":["A","B","E"],"explanation":"本题考查渠道战略联盟。 渠道战略联盟的形式包括经销商之间的战略联盟、生产商之间的战略联盟、生产商和经销商之间的战略联盟。 故本题选 ABE 选项。","id":"gongshang-0121","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"面对产品市场上愈演愈烈的价格战，生产商之间可以通过达成一定的联盟来抵御价格的滑坡，事实上生产商之间的联盟大多数是在（ ）下的短期行为。","material":"","options":[{"key":"A","text":"利益驱动"},{"key":"B","text":"成本驱动"},{"key":"C","text":"市场份额驱动"},{"key":"D","text":"顾客偏好驱动"}],"answer":["A"],"explanation":"本题考查生产商之间的战略联盟。 生产商之间的战略联盟通常出现在买方市场上，随着产品同质化程度加大和市场 竞争加剧，生产商对愈演愈烈的价格战苦不堪言，不得不通过形成一定的联盟（最初是价格联盟）来抵御价格的下降。 部分联盟在经过较长时期的合作之后最终发展成战略联盟，而更多的联盟却受外部环境条件变化的影响，其合作关系具有动态性。事实上，生产商之间形成联盟多为在一定利益驱动下的短期行为。 故本题选 A 选项。 ▎考点 生产能力★★★★","id":"gongshang-0122","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"下列关于企业的生产能力的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"是按照直接参加和间接参加生产的固定资产来计算的"},{"key":"B","text":"必须和一定的技术组织条件相联系"},{"key":"C","text":"反映的是一定时期内的实物量"},{"key":"D","text":"是生产系统内部各种资源能力的综合反映"}],"answer":["A"],"explanation":"本题考查生产能力的概念。 狭义的生产能力具体包括以下三个方面的含义。 （1）企业的生产能力按照直接参加生产的固定资产计算，选项 A 错误。 （2）生产能力必须和一定的技术组织条件相联系，选项 B 正确。 （3）生产能力反映的是一定时期内的实物量，选项 C 正确。 生产能力是生产系统内部各种资源能力的综合反映，直接关系着企业产品和服务能否满足市场需要，选项 D 正确。 故本题选 A 选项。","id":"gongshang-0123","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"生产型企业在进行生产能力核算时，应首先计算（ ）的生产能力。","material":"","options":[{"key":"A","text":"设备组"},{"key":"B","text":"工段"},{"key":"C","text":"车间"},{"key":"D","text":"企业"}],"answer":["A"],"explanation":"本题考查生产能力的核算。 企业生产能力的核算，首先计算设备组的生产能力，平衡后确定小组、工段、车间的生产能力，然后各车间进行平衡，确定企业的生产能力。 故本题选 A 选项。 ▎考点 生产计划的含义与指标★★★★","id":"gongshang-0124","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"multi","stem":"下列企业的生产计划的类型中，属于生产作业计划的有（ ）。","material":"","options":[{"key":"A","text":"企业 3 年的发展计划"},{"key":"B","text":"企业 5 年的发展计划"},{"key":"C","text":"企业 1 年的生产计划"},{"key":"D","text":"企业每月的生产计划"},{"key":"E","text":"企业每周的生产计划"}],"answer":["D","E"],"explanation":"本题考查生产计划的含义。 （1）生产作业计划：把全年的任务细化为各月、各周甚至每天每班的具体任务，选项 DE 正确； （2）长期生产计划：长期生产计划是指生产战略计划，是服务于企业的总体发展战略，计划期一般为 3～5 年，选项 AB 错误； （3）中期生产计划的计划期一般为 2～3 年。 （4）年度生产计划：计划期为 1 年，选项 C 错误。 故本题选 DE 选项。","id":"gongshang-0125","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"multi","stem":"为了有效和全面指导企业计划期的生产活动，应建立的生产指标体系应包括（ ）。","material":"","options":[{"key":"A","text":"产品品种指标"},{"key":"B","text":"产品产值指标"},{"key":"C","text":"产品质量指标"},{"key":"D","text":"产品产量指标"},{"key":"E","text":"产品技术指标"}],"answer":["A","B","C","D"],"explanation":"本题考查生产计划指标。 制订生产计划指标是企业生产计划的重要内容。为了有效地和全面地指导企业计划期的生产活动，生产计划应建立包括：产品品种、产品质量、产品产量及产品产值四类指标为主要内容的生产指标体系。 故本题选 ABCD 选项。 ▎考点 生产计划的编制☆","id":"gongshang-0126","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"生产计划的编制流程中，第三个步骤是（ ）。","material":"","options":[{"key":"A","text":"生产计划大纲定稿与报批"},{"key":"B","text":"统筹安排，初步提出生产计划指标"},{"key":"C","text":"综合平衡，编制计划方案"},{"key":"D","text":"调查研究"}],"answer":["C"],"explanation":"本题考查生产计划的编制。 生产计划的编制分为四个步骤： （1）调查研究； （2）统筹安排，初步提出生产计划指标； （3）综合平衡，编制计划方案； （4）生产计划大纲定稿与报批。 故本题选 C 选项。","id":"gongshang-0127","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"multi","stem":"下列属于生产计划编制的步骤的有（ ）。","material":"","options":[{"key":"A","text":"调查研究"},{"key":"B","text":"统筹安排，初步提出生产计划指标"},{"key":"C","text":"综合平衡，编制计划方案"},{"key":"D","text":"生产计划大纲定稿与报批"},{"key":"E","text":"生产过程的控制"}],"answer":["A","B","C","D"],"explanation":"本题考查生产计划的编制。 生产计划编制的步骤包括： （1）调查研究； （2）统筹安排，初步提出生产计划指标； （3）综合平衡，编制计划方案； （4）生产计划大纲定稿与报批。 故本题选 ABCD 选项。 ▎考点 产品出产进度的安排☆","id":"gongshang-0128","bank":"gongshang"},{"chapter":"","point":"渠道战略联盟","type":"single","stem":"大量大批生产企业安排出产进度的主要内容是确定计划年度内各季、月的产量，其中将全年计划产量按照开始增长较快，以后增长较慢的要求安排各月任务，使产量增长的曲线呈抛物线形状，这种方法
