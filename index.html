key":"D","text":"5"}],"answer":["B"],"explanation":"《公司法》规定，股份有限公司监事会每六个月至少召开一次会议。","id":"guanfang-0181","bank":"guanfang"},{"chapter":"第二章公司法人治理结构","section":"第一节公司所有者与经营者","point":"","type":"multi","stem":"关于股份有限公司监事会主席和副主席选任的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"监事会主席和副主席由半数以上监事选举产生"},{"key":"B","text":"监事会主席和副主席由2/3 以上监事选举产生"},{"key":"C","text":"监事会主席和副主席由职工代表大会民主选举产生"}],"answer":["A","C"],"explanation":"监事会的议事方式和表决程序，除《公司法》有规定的外，由公司章程规定。监事会决议应当经全体监事的过半数通过。监事会决议的表决，应当一人一票。监事会应当对所议事项的决定作成会议记录，出席会议的监事应当在会议记录上签名。","id":"guanfang-0182","bank":"guanfang"},{"chapter":"第二章公司法人治理结构","section":"第六节中国特色国家出资公司的治理","point":"","type":"single","stem":"《国务院办公厅关于进一步完善国有企业法人治理结构的指导意见》（以下简称《指导意见》)明确了国有企业（ ）在法人治理结构中的法定地位。","material":"","options":[{"key":"A","text":"党组织"},{"key":"B","text":"股东会"},{"key":"C","text":"国有资产监督管理机构"},{"key":"D","text":"工会组织"}],"answer":["A"],"explanation":"《指导意见》指出，落实全面从严治党战略部署，把加强党的领导和完善公司治理统一起来，明确国有企业党组织在法人治理结构中的法定地位，发挥国有企业党组织的领导作用，保证党组织把方向、管大局、保落实。","id":"guanfang-0183","bank":"guanfang"},{"chapter":"第二章公司法人治理结构","section":"第六节中国特色国家出资公司的治理","point":"","type":"multi","stem":"改进国有企业法人治理结构，完善国有企业现代企业制度应遵循的原则包括（ ）。","material":"","options":[{"key":"A","text":"坚持深化改革"},{"key":"B","text":"坚持党的领导"},{"key":"C","text":"坚持效益至上"},{"key":"D","text":"坚持依法治企"},{"key":"E","text":"坚持权责对等"}],"answer":["A","B","D","E"],"explanation":"根据《指导意见》和有关文件精神，改进国有企业法人治理结构，完善国有企业现代企业制度应遵循以下原则：①坚持深化改革。②坚持党的领导。③坚持依法治企。④坚持权责对等。","id":"guanfang-0184","bank":"guanfang"},{"chapter":"第二章公司法人治理结构","section":"第六节中国特色国家出资公司的治理","point":"","type":"single","stem":"关于国家出资公司党组织领导作用的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"进入董事会、监事会、经理层的党组织领导班子成员必须落实党组织决定"},{"key":"B","text":"党组织研究讨论是董事会、经理层决策重大问题的前置程序"},{"key":"C","text":"党组织决定董事会、经理层的成员"},{"key":"D","text":"重大经营管理事项必须经党委（党组）研究讨论后，再由董事会或者经理层作出决定"}],"answer":["C"],"explanation":"国家出资公司应当将党建工作要求写人公司章程，写明党组织的职责权限、机构设置、运行机制、基础保障等重要事项，明确党组织研究讨论是董事会、经理层决策重大问题的前置程序，落实党组织在公司治理结构中的法定地位。国家出资公司重大经营管理事项必须经党委（党组）研究讨论后，再由董事会或者经理层作出决定。","id":"guanfang-0185","bank":"guanfang"},{"chapter":"第二章公司法人治理结构","section":"第六节中国特色国家出资公司的治理","point":"","type":"multi","stem":"国家出资公司党组织的工作原则包括（ ）。","material":"","options":[{"key":"A","text":"把党的领导融人公司治理各环节"},{"key":"B","text":"以公司改革发展成果检验党组织工作成效"},{"key":"C","text":"培养高素质专业化公司领导人员队伍和人才队伍"},{"key":"D","text":"增强基层党组织生机活力"},{"key":"E","text":"体现党组织的主人翁地位"}],"answer":["A","B","C","D"],"explanation":"I中共中央印发的《中国共产党国有企业基层组织工作条例（试行）》（以下简称条例》)对国家出资公司党组织的工作原则作了明确的规定，具体内容包括：①加强党的领导和完善公司治理相统一，把党的领导融人公司治理各环节。②坚持党建工作与生产经营深度融合，以公司改革发展成果检验党组织工作成效。③坚持党管干部、党管人才，培养高素质专业化公司领导人员队伍和人才队伍。④坚持抓基层、打基础，突出党支部建设，增强基层党组 只生机活力。③坚持全心全意依靠工人阶级，体现公司职工群众主人翁地位，巩固党执政的阶 及基础。","id":"guanfang-0186","bank":"guanfang"},{"chapter":"第二章公司法人治理结构","section":"第六节中国特色国家出资公司的治理","point":"","type":"multi","stem":"国家出资公司的下列事项中，必须经党委（党组）研究讨论的有（ ）。","material":"","options":[{"key":"A","text":"公司发展战略"},{"key":"B","text":"公司生产计划"},{"key":"C","text":"公司组织架构设置和调整"},{"key":"D","text":"公司资产重组"},{"key":"E","text":"公司市场营销活动"}],"answer":["A","C","D"],"explanation":"《条例》规定，国家出资公司重大经营管理事项必须经党委（党组）研究讨论后，再由董事会或者经理层作出决定。须经党组织研究讨论的事项主要包括：①贯彻党中央决部署和落实国家发展战略的重大举措。②公司发展战略、中长期发展规划，重要改革方案。③公司资产重组、产权转让、资本运作和大额投资中的原则性方向性问题。④公司组织架构设量和调整，重要规章制度的制定和修改。③涉及公司安全生产、维护稳定、职工权益、社会责任等方面的重大事项。③其他应当由党委（党组）研究讨论的重要事项。","id":"guanfang-0187","bank":"guanfang"},{"chapter":"第二章公司法人治理结构","section":"第六节中国特色国家出资公司的治理","point":"","type":"single","stem":"根据《指导意见》,我国对国有资本授权经营体制的改革以管（ ）为主。","material":"","options":[{"key":"A","text":"资本"},{"key":"B","text":"人才"},{"key":"C","text":"结构"},{"key":"D","text":"制度"}],"answer":["A"],"explanation":"根据《指导意见》,要以管资本为主改革国有资本授权经营体制。对直接出资的国独资公司，履行出资人职责的机构重点管好国有资本布局、规范资本运作、强化资本约束、提资本回报、维护资本安全。对国有全资公司、国有控股企业，履行出资人职责的机构主要依居股权份额通过参加股东会议、审核需由股东决定的事项、与其他股东协商作出决议等方式履行职责，除法律法规或公司章程另有规定外，不得干预公司自主经营活动。","id":"guanfang-0188","bank":"guanfang"},{"chapter":"第二章公司法人治理结构","section":"第六节中国特色国家出资公司的治理","point":"","type":"single","stem":"国有独资公司章程由（ ）制定。","material":"","options":[{"key":"A","text":"股东会"},{"key":"B","text":"董事会"},{"key":"C","text":"履行出资人职责的机构"},{"key":"D","text":"党委（党组）"}],"answer":["C"],"explanation":"国有独资公司章程由履行出资人职责的机构制定。国有独资公司不设股东会，由履行出资人职责的机构行使股东会职权。","id":"guanfang-0189","bank":"guanfang"},{"chapter":"第二章公司法人治理结构","section":"第六节中国特色国家出资公司的治理","point":"","type":"multi","stem":"国有独资公司的下列事项中，应当由履行出资人职责的机构决定的有","material":"","options":[{"key":"A","text":"制定公司章程"},{"key":"B","text":"公司合并"},{"key":"C","text":"决定经理的聘任"},{"key":"D","text":"增加注册资本"},{"key":"E","text":"发行公司债券"}],"answer":["A","B","D"],"explanation":"《公司法》规定，履行出资人职责的机构可以授权公司董事会行使股东会的部分只权，但公司章程的制定和修改，公司的合并、分立、解散、申请破产，增加或者减少注册资本，分配利润，应当由履行出资人职责的机构决定。","id":"guanfang-0190","bank":"guanfang"},{"chapter":"第二章公司法人治理结构","section":"第六节中国特色国家出资公司的治理","point":"","type":"single","stem":"关于国有独资公司董事长的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"董事会设董事长一人，可以设副董事长"},{"key":"B","text":"董事长由履行出资人职责的机构从董事会成员中指定"},{"key":"C","text":"董事会成员不可以兼任经理"},{"key":"D","text":"未经履行出资人职责的机构同意，董事长不得在其他有限责任公司、股份有限公司或 者其他经济组织兼职"}],"answer":["C"],"explanation":"国有独资公司设董事会，并依照《公司法》的规定行使职权。国有独资公司的董事会成员中，应当过半数为外部董事，并应当有公司职工代表。董事会成员由履行出资人职责的l构委派。但是，董事会成员中的职工代表由公司职工代表大会选举产生。","id":"guanfang-0191","bank":"guanfang"},{"chapter":"第二章公司法人治理结构","section":"第六节中国特色国家出资公司的治理","point":"","type":"single","stem":"关于国家出资公司董事会议事规则的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"严格实行集体审议、独立表决、企业负责的决策制度"},{"key":"B","text":"一人一票表决"},{"key":"C","text":"建立规范透明的重大事项信息公开和对外披露制度"},{"key":"D","text":"建立董事会决议跟踪落实以及事后评估制度"}],"answer":["C"],"explanation":"国有独资公司董事会设董事长一人，可以设副董事长。董事长、副董事长由履行出冬人职责的机构从董事会成员中指定。经履行出资人职责的机构同意，董事会成员可以兼任经理。国有独资公司的董事、高级管理人员，未经履行出资人职责的机构同意，不得在其他有艮责任公司、股份有限公司或者其他经济组织兼职。","id":"guanfang-0192","bank":"guanfang"},{"chapter":"第二章公司法人治理结构","section":"第六节中国特色国家出资公司的治理","point":"","type":"single","stem":"国家出资公司董事会设立的专门委员会中，应当由外部董事组成的包括","material":"","options":[{"key":"A","text":"提名委员会"},{"key":"B","text":"薪酬与考核委员会"},{"key":"C","text":"审计委员会"},{"key":"D","text":"战略与投资委员会"},{"key":"E","text":"风险管理委员会"}],"answer":["A"],"explanation":"国家出资公司董事会严格实行集体审议、独立表决、个人负责的决策制度，平等充发表意见，一人一票表决，建立规范透明的重大事项信息公开和对外披露制度，保障董事会会议记录和提案资料的完整性，,建立董事会决议跟踪落实以及事后评估制度，做好与其他治理三体的联系沟通。","id":"guanfang-0193","bank":"guanfang"},{"chapter":"第二章公司法人治理结构","section":"第六节中国特色国家出资公司的治理","point":"","type":"multi","stem":"某市属国有独资公司拟聘任总经理，该事项的决定权属于（ ）。","material":"","options":[{"key":"A","text":"该公司履行出资人职责的机构"},{"key":"B","text":"该市国有资产监督管理机构"},{"key":"C","text":"该公司董事会"},{"key":"D","text":"该公司党组织"}],"answer":["B","C"],"explanation":"国家出资公司董事会应当设立提名委员会、薪酬与考核委员会、审计委员会等专门委员会，为董事会决策提供咨询，其中薪酬与考核委员会、审计委员会应由外部董事组成。","id":"guanfang-0194","bank":"guanfang"},{"chapter":"第二章公司法人治理结构","section":"第六节中国特色国家出资公司的治理","point":"","type":"single","stem":"国家出资公司经理层的管理制度不包括（ ）。","material":"","options":[{"key":"A","text":"经理层授权管理制度 ①根据《公司法》国有独资公司是国家出资公司的一种类型。"},{"key":"B","text":"职业经理人制度"},{"key":"C","text":"以优进细退为目标的考核评价制度"},{"key":"D","text":"与公司性质相适应的平均化薪酬分配制度"}],"answer":["C"],"explanation":"《公司法》规定，国有独资公司的经理由董事会聘任或者解聘。","id":"guanfang-0195","bank":"guanfang"},{"chapter":"第二章公司法人治理结构","section":"第六节中国特色国家出资公司的治理","point":"","type":"single","stem":"国家出资公司总经理拥有的职权包括（ ）。","material":"","options":[{"key":"A","text":"管理生产经营"},{"key":"B","text":"分配利润"},{"key":"C","text":"向董事会报告工作"},{"key":"D","text":"组织实施董事会决议"},{"key":"E","text":"制定公司章程"}],"answer":["D"],"explanation":"国家出资公司经理层的管理制度有：①经理层授权管理制度。②职业经理人制度。②以优进细退为目标的考核评价制度。④与社会主义市场经济相适应的薪酬分配制度。","id":"guanfang-0196","bank":"guanfang"},{"chapter":"第二章公司法人治理结构","section":"第六节中国特色国家出资公司的治理","point":"","type":"multi","stem":"根据《公司法》,国有独资公司在董事会中设置由董事组成的审计委员会行使监事会职权的，）。","material":"","options":[{"key":"A","text":"同时设监事会"},{"key":"B","text":"同时设一名监事"},{"key":"C","text":"不设监事会或者监事"},{"key":"D","text":"增设独立于董事会的外部监督机构"}],"answer":["A","C","D"],"explanation":"国家出资公司总经理对董事会负责，依法行使管理生产经营、组织实施董事会决议等职权，向董事会报告工作，董事会闭会期间向董事长报告工作。","id":"guanfang-0197","bank":"guanfang"},{"chapter":"第二章公司法人治理结构","section":"第六节中国特色国家出资公司的治理","point":"","type":"single","stem":"关于国家出资公司监督机制的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"国家出资公司应当支持和保证职工代表大会依法行使职权"},{"key":"B","text":"国有独资和国有全资公司的董事会中，应当依法设置职工董事"},{"key":"C","text":"国有独资和国有全资公司依法设立监事会的，可以不设置职工监事"},{"key":"D","text":"国家出资公司的合规管理须做好事前防范、事中控制和事后追责 二、参考答業及解析"}],"answer":["C"],"explanation":"国有独资公司在董事会中设置由董事组成的审计委员会行使《公司法》规定的监事会职权的，不设监事会或者监事。","id":"guanfang-0198","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第一节市场营销环境","point":"","type":"single","stem":"某企业对所在地区的居民总量、性别结构以及民族构成等因素进行分析，该企业分析的市场营销环境要素属于（ ）。","material":"","options":[{"key":"A","text":"人口环境"},{"key":"B","text":"经济环境"},{"key":"C","text":"自然环境"},{"key":"D","text":"社会文化环境"}],"answer":["A"],"explanation":"市场营销宏观环境是指那些给企业带来市场机会和环境威胁的主要社会力量，它是间接影响企业市场营销活动的各种环境要素，包括人口环境、经济环境、自然环境、技术环境、政治和法律环境、社会文化环境等要素。人口环境要素中，人口是构成市场的第一要素，人口数量直接决定市场规模和潜在容量。人口总量、地理分布、年龄结构、性别结构、民族构成等人口环境要素会对市场格局产生深刻影响。","id":"guanfang-0199","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第一节市场营销环境","point":"","type":"single","stem":"某企业通过引人机器人进行高精度产品的生产，取得了更大的市场份额。这反映的是（ ）要素对企业营销的影响。","material":"","options":[{"key":"A","text":"技术环境"},{"key":"B","text":"经济环境"},{"key":"C","text":"政治和法律环境"},{"key":"D","text":"社会文化环境"}],"answer":["A"],"explanation":"技术是一种“创造性的毁灭力量”,这一认识高度概括了科技发展对企业营销的影响。引人机器人进行生产反映了市场营销宏观环境中的技术环境要素对企业营销的影响。","id":"guanfang-0200","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第一节市场营销环境","point":"","type":"single","stem":"生活方式和风俗习惯等要素属于市场营销环境中的（ ）。","material":"","options":[{"key":"A","text":"技术环境"},{"key":"B","text":"经济环境"},{"key":"C","text":"政治和法律环境"},{"key":"D","text":"社会文化环境"}],"answer":["D"],"explanation":"夜社会文化环境是指在一种社会形态下已经形成的由民族特征、价值观念、宗教信仰、生活方式、风俗习惯、伦理道德、教育水平、相关群体、社会结构等因素构成的环境。","id":"guanfang-0201","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第一节市场营销环境","point":"","type":"single","stem":"下列不属于企业内部公众的是（ ）。","material":"","options":[{"key":"A","text":"企业职工"},{"key":"B","text":"股东"},{"key":"C","text":"管理者"},{"key":"D","text":"媒介"}],"answer":["D"],"explanation":"公众是指对企业营销目标的实现有现实或潜在影响的群体和个人，主要包括：企业外部公众，如媒介、政府、社团、金融公众等；企业内部公众，即企业职工、股东及管理者等。","id":"guanfang-0202","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第一节市场营销环境","point":"","type":"multi","stem":"下列属于市场营销宏观环境要素的有（ ）。","material":"","options":[{"key":"A","text":"人口环境"},{"key":"B","text":"经济环境"},{"key":"C","text":"技术环境"},{"key":"D","text":"政治和法律环境"},{"key":"E","text":"企业竞争者"}],"answer":["A","B","C","D"],"explanation":"影响市场营销的宏观环境要素主要包括：人口环境、经济环境、自然环境、技术环境、政治和法律环境、社会文化环境。","id":"guanfang-0203","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第一节市场营销环境","point":"","type":"single","stem":"在环境威胁矩阵图中，若企业分析面临的环境威胁处于第I象限内，其应采取的对策为（ ）。","material":"","options":[{"key":"A","text":"考虑相应的应对措施，避免危害"},{"key":"B","text":"予以一定程度的重视，准备相应的应对措施"},{"key":"C","text":"不必过于担心，但应该注意观察其发展变化，看它是否有向其他象限发展变化的可能"},{"key":"D","text":"高度重视，严密监视和预测其发展变化趋势，积极采取相应的对策"}],"answer":["D"],"explanation":"在环境威胁矩阵图中的第I象限内，环境威胁的影响程度高，出现的概率大，表明企业面临着严重的环境危机。企业应高度重视这一问题，必须严密监视和预测其发展变化趋势，积极采取相应的对策。","id":"guanfang-0204","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第一节市场营销环境","point":"","type":"single","stem":"企业市场营销管理者分析其所面临的环境威胁时，主要考虑的是环境威胁(）。","material":"","options":[{"key":"A","text":"发生的可能性和对企业的影响程度"},{"key":"B","text":"发生的可能性和应对措施"},{"key":"C","text":"对企业的影响程度和应对措施"},{"key":"D","text":"发生的可能性和发展趋势"}],"answer":["A"],"explanation":"环境威胁是指由于环境的变化形成或可能形成的对企业现有经营的冲击和挑战。企业市场营销管理者应善于识别企业所面临的环境威胁，主要从两个方面考虑，一是环境威胁对企业的影响程度，二是出现环境威胁的可能性。","id":"guanfang-0205","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第一节市场营销环境","point":"","type":"single","stem":"某项业务的机会水平低、威胁水平低，根据威胁－机会综合分析矩阵，该项业务属于（ ）。","material":"","options":[{"key":"A","text":"理想业务"},{"key":"B","text":"冒险业务"},{"key":"C","text":"成熟业务"},{"key":"D","text":"困难业务"}],"answer":["C"],"explanation":"通过威胁－机会综合分析矩阵评价企业在一定环境中的业务，结果可以分为四类：①理想业务，其特点是高机会、低威胁。②冒险业务，其特点是高机会、高威胁。③成熟业务，其特点是低机会、低威胁。④困难业务，其特点是低机会、高威胁。","id":"guanfang-0206","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第一节市场营销环境","point":"","type":"single","stem":"在威胁－机会综合分析矩阵中，理想业务和冒险业务的共同点是（)。","material":"","options":[{"key":"A","text":"高机会"},{"key":"B","text":"低机会"},{"key":"C","text":"高威胁"},{"key":"D","text":"低威胁"}],"answer":["A"],"explanation":"理想业务的特点是高机会、低威胁，冒险业务的特点是高机会、高威胁。两类业务的共同点是高机会。","id":"guanfang-0207","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第一节市场营销环境","point":"","type":"single","stem":"在威胁－机会综合分析矩阵中，困难业务和冒险业务的共同点是（ ）。","material":"","options":[{"key":"A","text":"高机会"},{"key":"B","text":"低机会"},{"key":"C","text":"高威胁"},{"key":"D","text":"低威胁"}],"answer":["C"],"explanation":"困难业务的特点是高威胁、低机会，冒险业务的特点是高威胁、高机会。两类业务的共同点是高威胁。","id":"guanfang-0208","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第一节市场营销环境","point":"","type":"multi","stem":"在威胁－机会综合分析矩阵中，关于不同业务企业应采取的措施的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"对于理想业务，企业务必抓住机遇，不可错失良机"},{"key":"B","text":"对于冒险业务，企业应冒险争取利益"},{"key":"C","text":"理想业务和冒险业务都属于高机会的业务，企业应采取相同的措施"},{"key":"D","text":"对于成熟业务，企业可以选择不改变经营方式，获取平均利润"},{"key":"E","text":"对于困难业务，企业可以选择放弃"}],"answer":["A","D","E"],"explanation":"在威胁－机会综合分析矩阵中，理想业务，即高机会和低威胁的业务。在此条件下，利益大于危险，这是企业难得遇上的好环境，企业务必抓住机遇，不可错失良机。冒险业务，即高机会和高威胁的业务。在此条件下，机会与危险同在，利益与风险并存，企业应当进行全面分析，慎重块择，争取利益。成熟业务，即低机会和低威胁的业务。在此条件下，企业面临比较平稳的环境，企业一方面按常规经营取得平均利润；另一方面也可以积蓄力量，为进入理想环境做准备。困难业务，即低机会和高威胁的业务。在此条件下，企业处境十分困难，企业必须想方设法扭转局面；如果无法扭转局面，则应果断放弃，另谋发展出路。","id":"guanfang-0209","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"一份行之有效、对企业经营有指导作用的任务书应满足的条件不包括","material":"","options":[{"key":"A","text":"反映的目标有限、具体、明确"},{"key":"B","text":"界定业务范围时使用产品导向"},{"key":"C","text":"富有激励性"},{"key":"D","text":"政策具体、分工明确"}],"answer":["B"],"explanation":"一份行之有效、对企业经营有指导作用的任务书应满足以下条件：①反映的目标有限、具体、明确。②市场导向而非产品导向。③富有激励性。④政策具体、分工明确。","id":"guanfang-0210","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"下列选项中，不属于企业常用的衡量财务、经营目标指标的是（ ）。","material":"","options":[{"key":"A","text":"投资收益率"},{"key":"B","text":"市场占有率"},{"key":"C","text":"资产负债率"},{"key":"D","text":"销售增长率"}],"answer":["C"],"explanation":"企业常用的衡量财务、经营目标的指标主要有投资收益率、市场占有率和销售增长率。资产负债率反映了企业的长期偿债能力。","id":"guanfang-0211","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"某公司上个月的销售额为4万元，本月的销售额为8万元，预计下个月","material":"","options":[{"key":"A","text":"15%"},{"key":"B","text":"20%"},{"key":"C","text":"25%"},{"key":"D","text":"50%"}],"answer":["C"],"explanation":"销售增长率是指本期产品销售增加额与上期产品销售额的比值。计算公式为：销集尴长率－本期销售额－上期销售额～100%，代人数据可得，预计该公司下个目销焦增销售增长率=本期销青期销焦额销告额×100%，代人数据可得：预计该公司下个月销售增销合增长车一上期销售额一义100%，代人效据可得：损计该公可下1方销合增长率=10-8 ×100%=25%。","id":"guanfang-0212","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"通用电气矩阵中，企业对“黄色地带”的战略业务单位应采取的投资决策为（ ）。","material":"","options":[{"key":"A","text":"重点发展战略"},{"key":"B","text":"收割战略"},{"key":"C","text":"放弃战略"},{"key":"D","text":"维持战略"}],"answer":["D"],"explanation":"通用电气矩阵可分为以下三个地带：①左上角地带，又称“绿色地带”,这个地带包括的三个小格是“大强”“中强”“大中”。这个地带的行业吸引力和战略业务单位的业务力量 都很强。因此，企业对这个地带的战略业务单位要“开绿灯”,采取增加投资和重点发展的战 略。②从左下角到右上角的对角线地带，又称“黄色地带”。这个地带包括的三个小格分别 是“小强”“中中”“大弱”。这个地带的行业吸引力和战略业务单位的业务力量居于一般水平。 因此，企业对这个地带的战略业务单位要“开黄灯”,采取维持现有投资水平和市场占有率的 战略。③右下角地带，又称“红色地带”。这个地带包括的三个小格是“小弱”“小中”“中弱”。 总的来看，这个地带的行业吸引力偏小，战略业务单位的业务力量偏弱。因此，企业对这个地 带的战略业务单位要“开红灯”,采取收割或放弃的战略。","id":"guanfang-0213","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"multi","stem":"企业进行市场营销战略规划的步骤包括（ ）。","material":"","options":[{"key":"A","text":"确定企业任务"},{"key":"B","text":"规定企业目标 C进行市场细分"},{"key":"C","text":"安排业务组合"},{"key":"D","text":"制订新业务计划"}],"answer":["A","B","D"],"explanation":"市场营销战略规划是企业战略规划的重要组成部分。市场营销战略规划是企业根据外部营销环境和内部资源条件对营销活动制定的较长时期的、全局性的行动方案，包括确定企业任务、规定企业目标、安排业务组合、制订新业务计划四项内容。进行市场细分属于制定目标市场战略的范畴。","id":"guanfang-0214","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"市场细分的基础是（ ）。","material":"","options":[{"key":"A","text":"产品种类"},{"key":"B","text":"消费需求的差异性"},{"key":"C","text":"文化习俗"},{"key":"D","text":"地理位置"}],"answer":["B"],"explanation":"市场细分是指企业通过市场调研，根据顾客对产品或服务不同的需要和欲望，不同的购买行为与购买习惯，把某一产品的整体市场分割成需求不同的若干个市场的过程。需要强调的是，市场细分并不是通过产品本身的分类来细分市场，而是根据不同的顾客群来细分市场，也就是说，消费需求的差异性是市场细分的基础。","id":"guanfang-0215","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"某企业产品分为三个系列，分别面向高收人、中等收人和低收人群体。这种市场细分采用的细分变量是（ ）。","material":"","options":[{"key":"A","text":"地理变量细分"},{"key":"B","text":"心理变量细分"},{"key":"C","text":"行为变量细分"},{"key":"D","text":"人口变量细分"}],"answer":["D"],"explanation":"市场细分的主要变量有地理变量、人口变量、心理变量和行为变量。其中，人口变量具体包括人口总数、人口密度、家庭户数、年龄、性别、职业、民族、文化、宗教、国籍、收人、家庭生命周期等。","id":"guanfang-0216","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"某化妆品企业相继开发了美白、保湿、抗皱三种功效的护肤品，该企业进行市场细分的变量属于（ ）。","material":"","options":[{"key":"A","text":"人口变量"},{"key":"B","text":"行为变量"},{"key":"C","text":"心理变量"},{"key":"D","text":"地理变量"}],"answer":["B"],"explanation":"市场细分的主要变量有地理变量、人口变量、心理变量和行为变量。其中，行为变量具体包括购买时机、使用者状况、忠诚程度、使用频率、待购阶段和态度等。","id":"guanfang-0217","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"某家电企业把消费者分成从未使用者、曾经使用者、潜在使用者、首次使用者和经常使用者，该企业进行市场细分的变量属于（ ）。","material":"","options":[{"key":"A","text":"地理变量"},{"key":"B","text":"人口变量"},{"key":"C","text":"心理变量"},{"key":"D","text":"行为变量"}],"answer":["D"],"explanation":"市场细分的行为变量包括的要素有购买时机、使用者状况、忠诚程度、使用频率、待购阶段和态度等。其中，根据消费者对产品的使用状况，可以把消费者分成从未使用者、曾经使用者、潜在使用者、首次使用者和经常使用者等。","id":"guanfang-0218","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"下列市场细分变量中，不属于心理细分的变量是（ ）。","material":"","options":[{"key":"A","text":"购买动机"},{"key":"B","text":"购买时机"},{"key":"C","text":"价值取向"},{"key":"D","text":"对价格反应的灵敏度"}],"answer":["B"],"explanation":"心理变量具体包括生活方式、个性、购买动机、价值取向、对商品和服务方式的感受或偏爱、对商品价格反应的灵敏度等。购买时机属于行为变量。","id":"guanfang-0219","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"某轮胎企业将其产品细分为雪地轮胎、沙漠轮胎、雨林轮胎，这种市场细分采用的细分变量是（ ）。","material":"","options":[{"key":"A","text":"心理变量"},{"key":"B","text":"行为变量"},{"key":"C","text":"人口变量"},{"key":"D","text":"地理变量"}],"answer":["D"],"explanation":"企业将产品细分为雪地轮胎、沙漠轮胎、雨林轮胎，是依据地区差异进行的细分，地区属于地理变量细分的具体内容。","id":"guanfang-0220","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"某服装企业专注于男装市场，专门生产经营商务男装。该企业选择目标市场采用的模式属于（ ）。","material":"","options":[{"key":"A","text":"产品－市场集中化"},{"key":"B","text":"产品专业化"},{"key":"C","text":"市场专业化"},{"key":"D","text":"选择性专业化"}],"answer":["A"],"explanation":"产品－市场集中化即企业的目标市场无论是从市场（顾客）或是从产品角度，都是集中于一个细分市场。企业只生产或经营某一类产品，只供应某一顾客群。","id":"guanfang-0221","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"某服装企业仅面向儿童、青年客户提供不同款式的夏季服装，该企业选择目标市场采用的模式是（ ）。","material":"","options":[{"key":"A","text":"产品一市场集中化"},{"key":"B","text":"产品专业化"},{"key":"C","text":"市场专业化"},{"key":"D","text":"选择性专业化"}],"answer":["D"],"explanation":"选择性专业化即企业有选择地进入几个不同的细分市场，为不同顾客群提供不同性能的产品。","id":"guanfang-0222","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"某公司专注于微波炉的生产，向顾客同时供应不同质量、款式、档次的微皮炉。该公司选择目标市场采用的模式是（ ）。","material":"","options":[{"key":"A","text":"产品专业化"},{"key":"B","text":"市场专业化"},{"key":"C","text":"选择性专业化"},{"key":"D","text":"全面进入"}],"answer":["A"],"explanation":"产品专业化即企业向各类顾客同时供应某种产品，但是在质量、款式、档次等方面都会有所不同。","id":"guanfang-0223","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"某公司专门向建筑企业供应推土机、打桩机、起重机、搅拌机等机械设备，该公司选择目标市场采用的模式是（ ）。","material":"","options":[{"key":"A","text":"市场集中化"},{"key":"B","text":"市场专业化"},{"key":"C","text":"全面进入"},{"key":"D","text":"产品专业化"}],"answer":["B"],"explanation":"市场专业化即企业向同一顾客群提供性能有所区别的产品。","id":"guanfang-0224","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"某汽车公司供应全球汽车市场，为不同顾客群体提供不同档次、性能的气车，该公司选择目标市场采用的模式是（ ）。","material":"","options":[{"key":"A","text":"选择性专业化"},{"key":"B","text":"市场专业化"},{"key":"C","text":"全面进入"},{"key":"D","text":"产品专业化"}],"answer":["C"],"explanation":"全面进入即企业全方位进入各个细分市场，为所有顾客提供所需要的性能不同的系列产品。","id":"guanfang-0225","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"某企业专注于婴幼儿奶粉市场，针对婴幼儿的营养需求研发产品和设计营销组合，实行专业化经营。这种目标市场选择战略属于（ ）。","material":"","options":[{"key":"A","text":"无差异营销战略"},{"key":"B","text":"差异性营销战略"},{"key":"C","text":"市场组合营销战略"},{"key":"D","text":"集中性营销战略"}],"answer":["D"],"explanation":"集中性营销战略是指企业在市场细分的基础上，选择一个或几个细分市场作为目标市场，制定营销组合方案，实行专业化经营，集中使用企业有限的资源，在较小的目标市场上拥有较大的市场占有率。","id":"guanfang-0226","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"某企业将市场细分为老年人市场、中青年市场和儿童市场三类，并根据每类市场的需求分别设计不同的产品和营销组合。该企业采用的目标市场选择战略是","material":"","options":[{"key":"A","text":"无差异营销战略"},{"key":"B","text":"差异性营销战略"},{"key":"C","text":"集中性营销战略"},{"key":"D","text":"市场组合营销战略"}],"answer":["B"],"explanation":"差异性营销战略以市场细分为基础。企业按照对消费者需求差异的调查分析，将整体市场分割为若干个子市场，从中选择多个乃至全部细分市场作为目标市场，针对不同的子市场的需求特点，设计和生产不同产品，并采用不同的营销组合，分别满足不同需求。","id":"guanfang-0227","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"将许多过于狭小的子市场组合起来，以便以较低的价格去满足市场需求的战略是（ ）。","material":"","options":[{"key":"A","text":"超细分战略"},{"key":"B","text":"反市场细分战略"},{"key":"C","text":"多数谬误战略"},{"key":"D","text":"市场细分战略"}],"answer":["B"],"explanation":"反市场细分战略是指企业将许多过于狭小的子市场组合起来，以便能以较低的价格去满足市场需求。","id":"guanfang-0228","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"关于集中性营销战略的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"满足了市场的多样化需求"},{"key":"B","text":"能够使企业在较小的市场上取得较大的成功"},{"key":"C","text":"目标市场比较单一和窄小"},{"key":"D","text":"市场需求发生急剧变化时，企业可能因此遭受较大的损失"}],"answer":["A"],"explanation":"集中性营销战略由于能够在较小的市场上切实满足一部分消费者的特殊需求，有利于企业在市场上发挥局部优势，因而能够在较小的市场上取得较大的成功。但由于目标市场比较单一和窄小，一旦市场需求发生急剧变化或出现强大的竞争者，而企业又不能随机应变时，就有可能造成巨大的损失。","id":"guanfang-0229","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"某公司一直以一种口味、一种包装和统一的广告宣传，长期占领全球软饮料市场。该公司采用的目标市场选择战略是（ ）。","material":"","options":[{"key":"A","text":"无差异营销战略"},{"key":"B","text":"差异性营销战略"},{"key":"C","text":"集中性营销战略"},{"key":"D","text":"利基市场战略"}],"answer":["A"],"explanation":"无差异营销战略是指企业把整体市场看作一个大的目标市场，忽略了消费者需求存在的不明显的微小差异，只向市场投放单一的产品，设计一种营销组合策略，通过大规模分销和投放大众化的广告，满足市场绝大多数消费者的需求。","id":"guanfang-0230","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"multi","stem":"关于目标市场选择战略的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"无差异营销战略不进行市场细分"},{"key":"B","text":"差异性营销战略满足的是局部市场需求"},{"key":"C","text":"集中性营销战略是在市场细分的基础上进行的"},{"key":"D","text":"无差异营销战略满足的可能是全部市场需求"},{"key":"E","text":"集中性营销战略满足的可能是全部市场需求"}],"answer":["A","C","D"],"explanation":"无差异营销战略、差异性营销战略和集中性营销战略的区别在于：①无差异营销战略不进行市场细分，而其他两种战略都是在市场细分的基础上进行的。②无差异营销战略和差异性营销战略最终满足的可能是全部市场需求，而集中性营销战略最终满足的只是局部市场需求。","id":"guanfang-0231","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"关于市场定位的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"市场定位是指企业根据竞争者产品所在区域，确定本企业产品的市场位置"},{"key":"B","text":"市场定位依据的是本企业产品的某种特征或属性的重要程度"},{"key":"C","text":"企业可以根据产品的属性与利益进行市场定位"},{"key":"D","text":"企业通过为自已的产品创立鲜明的特色或个性，塑造出独特的市场形象实现市场定位"}],"answer":["A"],"explanation":"市场定位是指企业根据竞争者现有产品在市场上所处的位置，针对该产品某种特征或属性的重要程度，塑造出本企业产品与众不同的个性或形象，并把这种形象传递给消费者，从而使该产品在目标市场上确定适当的位置。市场定位是企业通过为自已的产品创立鲜明的特色或个性，塑造出独特的市场形象来实现的。最常用的市场定位方法有以下五种:①根据属性与利益定位。②根据使用者定位。③根据竞争者的情况定位。④根据价格定位。③组合定位。","id":"guanfang-0232","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"某企业推出一种新产品，大力宣传其“节能、环保”的特点，这种市场定位方法是（ ）。","material":"","options":[{"key":"A","text":"根据使用者定位"},{"key":"B","text":"组合定位"},{"key":"C","text":"根据属性与利益定位"},{"key":"D","text":"根据竞争者的情况定位"}],"answer":["C"],"explanation":"木根据属性与利益定位是指使消费者从产品本身的“属性”以及由此而获得的“利益”感受该产品的价值。","id":"guanfang-0233","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"某品牌汽车被称为“青年人的第一辆车”,这种市场定位方法是（ ）。","material":"","options":[{"key":"A","text":"根据属性与利益定位"},{"key":"B","text":"组合定位"},{"key":"C","text":"根据竞争者的情况定位"},{"key":"D","text":"根据使用者定位"}],"answer":["D"],"explanation":"根据使用者定位是指企业把某些产品指引给适当的使用者或某个细分市场，以便根据该细分市场的特点创建恰当的形象。","id":"guanfang-0234","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第二节市场营销战略","point":"","type":"single","stem":"某品牌智能手表在宣传中强调“24小时健康监测，超长续航14天，限时特惠仅售399元，适合学生、上班族、运动爱好者”,该产品的市场定位属于（ ）。","material":"","options":[{"key":"A","text":"根据属性与利益定位"},{"key":"B","text":"组合定位"},{"key":"C","text":"根据竞争者的情况定位"},{"key":"D","text":"根据使用者定位"}],"answer":["B"],"explanation":"“24小时健康监测，超长续航14天”体现了根据属性与利益定位（强调产品本身的属性以及由此而获得的利益），“限时特惠仅售399元”体现了根据价格定位，“适合学生、定位。","id":"guanfang-0235","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"某企业共生产6种山地车、5种公路车、3种助力车和4种滑板车，则该企业产品组合的宽度和长度分别是（ ）。","material":"","options":[{"key":"A","text":"18和4"},{"key":"B","text":"4和18"},{"key":"C","text":"5和2"},{"key":"D","text":"2和5"}],"answer":["B"],"explanation":"产品组合的宽度是指企业所经营的不同产品线的数量。产品线（产品大类）是指产品类别中具有密切关系的一组产品。产品组合的长度是指产品组合中所包含的产品项目的总数。该企业产品组合的宽度为4,即四类产品。该企业产品组合的长度为18,即6+5+3+4=18。","id":"guanfang-0236","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"某公司的牙膏产品线下的产品项目有3种，A品牌牙膏是其中一种。A","material":"","options":[{"key":"A","text":"3"},{"key":"B","text":"2"},{"key":"C","text":"5"},{"key":"D","text":"6"}],"answer":["D"],"explanation":"产品组合的深度是指产品线中每种产品有多少花色、品种、规格等。该题中,A品牌牙膏有3种规格和2种配方，则共有6种不同的A品牌牙膏，故A品牌牙膏的产品组合的深度是 6。","id":"guanfang-0237","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"设备更新属于（ ）策略。","material":"","options":[{"key":"A","text":"扩大产品组合"},{"key":"B","text":"缩减产品组合"},{"key":"C","text":"产品线延伸"},{"key":"D","text":"产品线现代化"}],"answer":["D"],"explanation":"产品线现代化策略强调把现代科学技术应用到生产过程中去，这就要求企业对产品线实施现代化改造，如设备更新。","id":"guanfang-0238","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"multi","stem":"企业优化产品组合时，可以采取的策略有（。","material":"","options":[{"key":"A","text":"扩大产品组合策略"},{"key":"B","text":"集中产品组合策略"},{"key":"C","text":"缩减产品组合策略"},{"key":"D","text":"产品线延伸策略"},{"key":"E","text":"分散产品组合策略"}],"answer":["A","C","D"],"explanation":"企业优化产品组合时，可以采取的策略有：①扩大产品组合策略。②缩减产品组合策略。③产品线延伸策略。④产品线现代化策略。","id":"guanfang-0239","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"multi","stem":"甲企业生产经营牙膏、香皂、纸巾三类产品。目前，该企业决定推出一种高档牙膏、一种除菌香皂、一种去屑洗发水。该企业采取的产品组合策略有（ ）。","material":"","options":[{"key":"A","text":"扩大产品组合策略"},{"key":"B","text":"集中产品组合策略"},{"key":"C","text":"产品线现代化策略"},{"key":"D","text":"产品线延伸策略"},{"key":"E","text":"分散产品组合策略"}],"answer":["A","D"],"explanation":"扩大产品组合策略包括增加产品组合的宽度、长度及深度。增加产品组合的宽度是指在原产品组合中增加一个或几个产品大类，扩大经营范围；增加产品组合的长度是指在 品种、规格等。产品线延伸策略中的向上延伸策略，即在企业原有产品档次的基础上增加高档 产品的生产。","id":"guanfang-0240","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"与企业内部组织、供应商、顾客等因素属于同一类市场营销环境的有（)。","material":"某企业利用威胁－机会综合分析矩阵，分析了企业内部组织、供应商、顾客等因素对企业发展的影响，分析结果表明企业当前业务既存在较大的机会，也面临较大的威胁。推出新产品前，该企业共生产3种矿泉水，2种茶饮料，4种碳酸饮料,2种气泡水。本年年初，该企业决定新推出一款乳品饮料。","options":[{"key":"A","text":"人口环境"},{"key":"B","text":"经济环境"},{"key":"C","text":"竞争者"},{"key":"D","text":"营销渠道企业"}],"answer":["D"],"explanation":"市场营销微观环境是指对企业服务其顾客的能力构成直接影响的各种力量，包 括企业自身、供应商、竞争者、营销渠道企业、顾客和公众等要素。","id":"guanfang-0241","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"该企业业务属于威胁－机会综合分析矩阵中的（ ）。","material":"某企业利用威胁－机会综合分析矩阵，分析了企业内部组织、供应商、顾客等因素对企业发展的影响，分析结果表明企业当前业务既存在较大的机会，也面临较大的威胁。推出新产品前，该企业共生产3种矿泉水，2种茶饮料，4种碳酸饮料,2种气泡水。本年年初，该企业决定新推出一款乳品饮料。","options":[{"key":"A","text":"理想业务"},{"key":"B","text":"冒险业务"},{"key":"C","text":"成熟业务"},{"key":"D","text":"困难业务"}],"answer":["B"],"explanation":"用威胁－机会综合分析矩阵评价企业在一定环境中的业务，可能会出现四种不同 的结果，即理想业务、冒险业务、成熟业务和困难业务。其中，冒险业务即高机会和高威胁的业 务。在此条件下，机会与危险同在，利益与风险并存，企业应当进行全面分析，慎重执择，争取 利益。","id":"guanfang-0242","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"新产品推出前，该企业产品组合的长度为（ ）。","material":"某企业利用威胁－机会综合分析矩阵，分析了企业内部组织、供应商、顾客等因素对企业发展的影响，分析结果表明企业当前业务既存在较大的机会，也面临较大的威胁。推出新产品前，该企业共生产3种矿泉水，2种茶饮料，4种碳酸饮料,2种气泡水。本年年初，该企业决定新推出一款乳品饮料。","options":[{"key":"A","text":"5"},{"key":"B","text":"4"},{"key":"C","text":"12"},{"key":"D","text":"11"}],"answer":["D"],"explanation":"产品组合的长度是指产品组合中所包含的产品项目的总数，新产品推出前，该企 业产品组合的长度为11,即3+2+4+2=11。","id":"guanfang-0243","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"推出新产品后，该企业产品组合的宽度为（ ）。","material":"某企业利用威胁－机会综合分析矩阵，分析了企业内部组织、供应商、顾客等因素对企业发展的影响，分析结果表明企业当前业务既存在较大的机会，也面临较大的威胁。推出新产品前，该企业共生产3种矿泉水，2种茶饮料，4种碳酸饮料,2种气泡水。本年年初，该企业决定新推出一款乳品饮料。","options":[{"key":"A","text":"4"},{"key":"B","text":"5"},{"key":"C","text":"9"},{"key":"D","text":"10"}],"answer":["B"],"explanation":"产品组合的宽度是指企业所经营的不同产品线的数量。该企业推出乳品饮料 后，产品大类共有矿泉水、茶饮料、碳酸饮料、气泡水和乳品饮料五类，故产品组合的宽度 是5。","id":"guanfang-0244","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"某化妆品企业推出七夕套装礼盒，内含1瓶香水、1支口红、1瓶精华液。这种包装策略是（ ）。","material":"","options":[{"key":"A","text":"相似包装策略"},{"key":"B","text":"个别包装策略"},{"key":"C","text":"相关包装策略"},{"key":"D","text":"复用包装策略"}],"answer":["C"],"explanation":"相关包装策略，即将多种相关的产品配套放在同一包装物内出售的包装策略，如化妆品套装。这样可以方便消费者购买和使用，扩大企业的销售，增加企业利润，特别有利于推广和销售新产品，同时还可以节约包装费用。","id":"guanfang-0245","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"某企业在其干脆面产品中随机放人动画人物卡片。这种包装策略属于","material":"","options":[{"key":"A","text":"分量包装策略"},{"key":"B","text":"附赠品包装策略"},{"key":"C","text":"个别包装策略"},{"key":"D","text":"分等级包装策略"}],"answer":["B"],"explanation":"附赠品包装策略是指企业在产品包装内附加一些赠品，或奖券或实物，给消费者以意外的惊喜，从而吸引消费者购买的包装策略。","id":"guanfang-0246","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"产品包装中，为了便于储运的若干个次要包装的集合包装指的是","material":"","options":[{"key":"A","text":"首要包装"},{"key":"B","text":"次要包装"},{"key":"C","text":"装运包装"},{"key":"D","text":"销售包装"}],"answer":["C"],"explanation":"产品包装一般包括三个层次：首要包装，即直接盛装产品的包装；次要包装，即保护首要包装的二次包装；装运包装，即为了便于储运的若干个次要包装的集合包装。","id":"guanfang-0247","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"某品牌巧克力采用精美铁盒包装，包装盒可以盛放其他物品。这种包装策略属于（ ）。","material":"","options":[{"key":"A","text":"复用包装策略"},{"key":"B","text":"改变包装策略"},{"key":"C","text":"相关包装策略"},{"key":"D","text":"个别包装策略"}],"answer":["A"],"explanation":"复用包装策略，又称双重用途包装策略，即原包装的产品使用完后，包装物本身还可作其他用途的包装策略，如香水瓶可以当作工艺品摆放。这种策略一方面可以使消费者一物二用”,另一方面可以在消费者对包装物再使用时，发挥其广告效应，不断提示消费者重复购买。","id":"guanfang-0248","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"某食品企业在简装月饼的基础上，推出了礼盒装月饼，突出其高档形象。这种包装策略属于（ ）。","material":"","options":[{"key":"A","text":"相似包装策略"},{"key":"B","text":"分等级包装策略"},{"key":"C","text":"分量包装策略"},{"key":"D","text":"相关包装策略"}],"answer":["B"],"explanation":"分等级包装策略，即企业根据产品的不同质量档次，设计、使用不同等级的包装。需要注意的是，产品分级要体现产品的实际质量差异，使包装表现出的价值特征与产品的质量档次相符。","id":"guanfang-0249","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"某化妆品公司为了避免由于某一产品推销失败而影响其他产品的声誉，在包装设计上，针对不同产品采用不同的包装风格、色调和材料。这种包装策略属于（)。","material":"","options":[{"key":"A","text":"相似包装策略"},{"key":"B","text":"个别包装策略"},{"key":"C","text":"相关包装策略"},{"key":"D","text":"分等级包装策略"}],"answer":["B"],"explanation":"个别包装策略，即企业的各种产品都有自己独特的包装，在设计上采用不同风格的包装策略。这种策略能够避免由于某一产品推销失败而影响其他产品的声誉，但也相应增加了包装设计费用和新产品促销费用。","id":"guanfang-0250","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"洗衣机从半自动控制发展到全自动控制，性能有了重大突破，全自动洗衣机是半自动洗衣机的（ ）。","material":"","options":[{"key":"A","text":"全新产品"},{"key":"B","text":"换代产品"},{"key":"C","text":"工艺创新"},{"key":"D","text":"改进产品"}],"answer":["B"],"explanation":"换代产品，即在原有产品的基础上，完全采用或部分采用新技术、新材料、新工艺研制出来的新产品。一般而言，这种新产品要求消费者改变原有的消费模式。","id":"guanfang-0251","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"某公司发布了全球首款搭载量子通信技术的手机，使量子通信技术首次进入通信市场。这种手机对市场而言属于（ ）。","material":"","options":[{"key":"A","text":"全新产品"},{"key":"B","text":"换代产品"},{"key":"C","text":"工艺创新"},{"key":"D","text":"改进产品"}],"answer":["A"],"explanation":"全新产品，即应用新技术、新材料研制出的具有全新功能的产品。这种产品无论对企业或市场而言，都属于新产品。例如，计算机在市场上第一次出现时，就属于全新产品。","id":"guanfang-0252","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"multi","stem":"按照新产品革新程度不同，新产品开发策略有（ ）。","material":"","options":[{"key":"A","text":"联合研制"},{"key":"B","text":"创新策略"},{"key":"C","text":"抢先策略"},{"key":"D","text":"模仿策略"},{"key":"E","text":"跟进策略"}],"answer":["B","D"],"explanation":"按照新产品革新程度不同，新产品开发的策略有：①创新策略，即企业研制和推出市场上从未有过的新产品。②模仿策略，即企业仿制市场上其他企业的产品。","id":"guanfang-0253","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"multi","stem":"按照开发新产品的方式不同，新产品开发策略有（ ）。","material":"","options":[{"key":"A","text":"自主开发"},{"key":"B","text":"联合研制"},{"key":"C","text":"完全创新"},{"key":"D","text":"委托开发"},{"key":"E","text":"模仿创新"}],"answer":["A","B","D"],"explanation":"按照开发新产品的方式不同，新产品开发策略有：①自主开发，即企业设立研究部门，通过自身的研发力量来完成产品的构思、设计和生产工作。②委托开发，即委托独立的研发机构为企业开发某种新产品。③联合研制，联合研制的方式包括联合经营、购买专利、经营特许、外包生产、合作经营、兼并以及一般技术或专有技术引进。","id":"guanfang-0254","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"企业产品价格的下限取决于（ ）。","material":"","options":[{"key":"A","text":"市场需求"},{"key":"B","text":"成本"},{"key":"C","text":"市场竞争"},{"key":"D","text":"国家政策"}],"answer":["B"],"explanation":"成本构成了企业产品价格的下限。在正常情况下，企业不可能将自己的产品价格定得低于成本。","id":"guanfang-0255","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"下列企业产品定价的影响因素中，影响企业产品价格上限的是（ ）。","material":"","options":[{"key":"A","text":"市场需求"},{"key":"B","text":"成本"},{"key":"C","text":"企业规模"},{"key":"D","text":"企业性质"}],"answer":["A"],"explanation":"影响产品定价的因素主要有市场需求、成本和市场竞争。其中，市场需求是企业制定产品价格时要考虑的主要因素，市场需求影响企业产品价格的上限。","id":"guanfang-0256","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"某企业的产品总投资为200万元，年固定成本为40万元，年单位可变成本为20元，预计年销售量为8万个，若采用目标利润定价法，投资收益率定为30%,则该企业产品的单价为（ ）元。","material":"","options":[{"key":"A","text":"25"},{"key":"B","text":"32.5"},{"key":"C","text":"30"},{"key":"D","text":"12.5"}],"answer":["D"],"explanation":"成本加成定价法是指在产品成本的基础上加上一定比例的加成作为产品价格的方法。其公式为：产品价格=单位成本×（1+加成率）。代人数据，该乳品饮料的价格=（260000+200000+1.5）×（1+20%）～3.4（元／瓶）。","id":"guanfang-0257","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"下列方法中，不属于认知价值定价法的是（ ）。","material":"","options":[{"key":"A","text":"诊断法"},{"key":"B","text":"需求差别定价法"},{"key":"C","text":"直接价格评比法"},{"key":"D","text":"直接认知价值评比法"}],"answer":["B"],"explanation":"目标利润定价法是指企业根据总成本和预计的总销售量，确定期望达到的投资收益率，然后推算产品价格的定价方法。其公式为：目标价格=（总成本＋目标利润）－总销量，目标利润=投资额×投资收益率。代人数据，目标利润=2000000×30%=600000（元）,该企业产品的单价=（400000+20×80000+600000）→80000=32.5（元）。","id":"guanfang-0258","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"某奶制品企业推出一款有机高蛋白牛奶，经调查发现市场上同类牛奶的价格范围为7~8元，为了避免价格竞争带来的损失，该企业决定将该款牛奶价格定为7.5元。该企业采用的定价方法是（ ）。","material":"","options":[{"key":"A","text":"成本加成定价法"},{"key":"B","text":"直接价格评比法"},{"key":"C","text":"目标利润定价法"},{"key":"D","text":"随行就市定价法"}],"answer":["B"],"explanation":"认知价值定价法有三种，分别是直接价格评比法、直接认知价值评比法和诊断法。","id":"guanfang-0259","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"企业常用的产品定价方法有（ ）。","material":"","options":[{"key":"A","text":"成本导向定价法"},{"key":"B","text":"战略导向定价法"},{"key":"C","text":"需求导向定价法"},{"key":"D","text":"供给导向定价法"},{"key":"E","text":"竞争导向定价法"}],"answer":["D"],"explanation":"在垄断竞争和完全竞争的市场结构条件下，企业很难凭借自已的实力在市场上取得绝对的优势。为了避免价格竞争带来的损失，有些企业采用随行就市定价法，即通过将本企业某产品价格保持在市场平均价格水平上来获得平均报酬。采用随行就市定价法，企业就不必去全面了解消费者对不同价差的反应，也不会引起价格波动。","id":"guanfang-0260","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"multi","stem":"下列定价方法中，属于竞争导向定价法的有（ ）。","material":"","options":[{"key":"A","text":"随行就市定价法"},{"key":"B","text":"直接认知价值评比法"},{"key":"C","text":"诊断法"},{"key":"D","text":"目标利润定价法"},{"key":"E","text":"密封投标定价法"}],"answer":["A","C","E"],"explanation":"企业常用的产品定价方法有成本导向定价法、需求导向定价法和竞争导向定价","id":"guanfang-0261","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"该企业采用的目标市场选择模式是（ ）。","material":"某企业生产经营牙膏产品，面向广大消费者。该企业不同的牙膏产品在质量和功能上有所区别。随着消费需求变得更加多元化，该企业决定推出一种强调“快速亮 白、脱敏”的新牙膏产品，该产品定价明显高于企业当前牙膏产品的定价。经测算，生产新产 品的投资额为800万元，年固定成本为400万元，单位变动成本为10元，预计年销售量为20 万支，预期年投资收益率为20%（假定利润额为总收人扣除总的固定成本和总的变动成本）。","options":[{"key":"A","text":"产品－市场专业化"},{"key":"B","text":"产品专业化"},{"key":"C","text":"市场专业化"},{"key":"D","text":"选择性专业化"}],"answer":["A"],"explanation":"竞争导向定价法主要以市场上相互竞争的同类商品价格为定价基本依据，参考成本和供求状况确定商品价格，主要包括随行就市定价法和密封投标定价法三种。","id":"guanfang-0262","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"新牙膏产品强调“快速亮白、脱敏”,其市场定位方法是（ ）。","material":"某企业生产经营牙膏产品，面向广大消费者。该企业不同的牙膏产品在质量和功能上有所区别。随着消费需求变得更加多元化，该企业决定推出一种强调“快速亮 白、脱敏”的新牙膏产品，该产品定价明显高于企业当前牙膏产品的定价。经测算，生产新产 品的投资额为800万元，年固定成本为400万元，单位变动成本为10元，预计年销售量为20 万支，预期年投资收益率为20%（假定利润额为总收人扣除总的固定成本和总的变动成本）。","options":[{"key":"A","text":"根据价格定位"},{"key":"B","text":"根据竞争者的情况定位"},{"key":"C","text":"根据属性与利益定位"},{"key":"D","text":"组合定位"}],"answer":["B"],"explanation":"企业在选择目标市场时可采用的模式主要有以下五种：产品－市场专业化、产品专业化、市场专业化、选择性专业化、全面进入。其中，产品专业化是指企业向各类顾客同时供应某种产品，但是这种产品在质量、款式、档次等方面都会有所不同。","id":"guanfang-0263","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"该企业采用的产品线延伸策略是（ ）。","material":"某企业生产经营牙膏产品，面向广大消费者。该企业不同的牙膏产品在质量和功能上有所区别。随着消费需求变得更加多元化，该企业决定推出一种强调“快速亮 白、脱敏”的新牙膏产品，该产品定价明显高于企业当前牙膏产品的定价。经测算，生产新产 品的投资额为800万元，年固定成本为400万元，单位变动成本为10元，预计年销售量为20 万支，预期年投资收益率为20%（假定利润额为总收人扣除总的固定成本和总的变动成本）。","options":[{"key":"A","text":"向上延伸策略"},{"key":"B","text":"向下延伸策略"},{"key":"C","text":"双向延伸策略"},{"key":"D","text":"产品线现代化策略"}],"answer":["C"],"explanation":"市场定位的方法有根据属性与利益定位、根据使用者定位、根据竞争者的情况定位、根据价格定位以及组合定位。其中，根据属性与利益定位是指企业强调产品本身的属性以及由此获得的利益使消费者体会到产品价值的市场定位方法。","id":"guanfang-0264","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"若实现预期年收益率目标，该企业新牙膏产品的单价为（ ）元。","material":"某企业生产经营牙膏产品，面向广大消费者。该企业不同的牙膏产品在质量和功能上有所区别。随着消费需求变得更加多元化，该企业决定推出一种强调“快速亮 白、脱敏”的新牙膏产品，该产品定价明显高于企业当前牙膏产品的定价。经测算，生产新产 品的投资额为800万元，年固定成本为400万元，单位变动成本为10元，预计年销售量为20 万支，预期年投资收益率为20%（假定利润额为总收人扣除总的固定成本和总的变动成本）。","options":[{"key":"A","text":"28"},{"key":"B","text":"30"},{"key":"C","text":"38"},{"key":"D","text":"40"}],"answer":["A"],"explanation":"产品线延伸策略有向上延伸、向下延伸和双向延伸三种策略。向上延伸策略即在企业原有产品档次的基础上增加高档产品的生产。","id":"guanfang-0265","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"某企业推出新产品时制定了一个较高的价格，目的是在短期内获得高额利润。该企业采用的新产品定价策略是（ ）。","material":"","options":[{"key":"A","text":"市场渗透定价策略"},{"key":"B","text":"撇脂定价策略"},{"key":"C","text":"心理定价策略"},{"key":"D","text":"温和定价策略"}],"answer":["C"],"explanation":"投资收益率是衡量、比较企业投资效果的一项重要指标。投资收益率越高，意味 着单位投资所获得的利润越多。计算公式为：投资收益率=利润额＋投入资本总额×100%， 利润额=（单价－单位变动成本）×年销售量－年固定成本。代人数据，利润额=800000× 20%=160000（元）,该企业新牙膏产品的单价=（1600000+400000）→200000+10=38（元）。","id":"guanfang-0266","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"某企业将其生产的高、中、低档女装分别定价为1200元、880元和580元，则该企业女装采用的产品组合定价策略为（ ）。","material":"","options":[{"key":"A","text":"产品线定价策略"},{"key":"B","text":"备选产品定价策略"},{"key":"C","text":"产品束定价策略"},{"key":"D","text":"副产品定价策略"}],"answer":["B"],"explanation":"新产品定价策略包括三种:①撇脂定价策略，一种短期内追求最大利润的高价策略，指在新产品上市之初，将价格定得很高，以便尽可能在短期内赚取高额利润。②市场渗透定价策略，一种低价策略，指在新产品上市之初，将价格定得较低，利用物美价廉的优势迅速占领市场，取得较高的市场占有率，以获得较大利润。③温和定价策略，一种中价策略，指在新产品上市之初，将价格定在高价和低价之间，力求使买卖双方都满意。","id":"guanfang-0267","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"某游乐场共有6个游乐项目，每个项目的票价分别为20元、30元、30元、40元、40元、50元，通票定价为160元。这种产品组合定价策略为（ ）。","material":"","options":[{"key":"A","text":"产品束定价策略"},{"key":"B","text":"备选产品定价策略"},{"key":"C","text":"产品线定价策略"},{"key":"D","text":"副产品定价策略"}],"answer":["A"],"explanation":"产品线定价策略是指对产品线内不同质量档次的产品制定不同价格的策略。","id":"guanfang-0268","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"手机配件的价格被定得远高于成本通过给配件制定价格来提高手机产品的整体利润，这一定价策略是（ ）。","material":"","options":[{"key":"A","text":"备选产品定价策略"},{"key":"B","text":"附属产品定价策略"},{"key":"C","text":"产品线定价策略"},{"key":"D","text":"产品束定价策略"}],"answer":["A"],"explanation":"产品束定价即企业将几种产品组合在一起，进行低价销售。","id":"guanfang-0269","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"下列属于新产品定价策略的有（ ）。","material":"","options":[{"key":"A","text":"市场渗透定价策略"},{"key":"B","text":"撇脂定价策略"},{"key":"C","text":"产品线定价策略"},{"key":"D","text":"产品束定价策略"},{"key":"E","text":"温和定价策略"}],"answer":["A"],"explanation":"对于手机而言，配件如耳机、手机壳，是备选产品，不是必买品，但配件可以满足不同客户的偏好。备选产品定价策略通常是指给备选产品制定高价格，通过备选产品的高利润提高整体利润。","id":"guanfang-0270","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"multi","stem":"关于撇脂定价策略的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"能迅速打开产品的销路"},{"key":"B","text":"容易诱发竞争，企业压力大"},{"key":"C","text":"可在短期内获取高额利润"},{"key":"D","text":"可阻止竞争者进入，便于企业长期占领市场"},{"key":"E","text":"高价高利时期较短"}],"answer":["A","B","E"],"explanation":"新产品定价策略包括三种：①撇脂定价策略。②市场渗透定价策略。③温和定价策略。","id":"guanfang-0271","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"multi","stem":"M企业保温杯产品采用的包装策略为（ ）。","material":"M企业的业务涵盖服装、日用百货、智能家居等9个品类，共200余种产品。在日用百货品类下，M企业将保温杯细分为日常便携系列、高端商务系列和定制礼品系列，并分别设计了不同的包装以体现产品不同的档次。目前，M企业决定推出一款新型真空保温杯，经核算，生产此保温杯的投资额为1000万元，年固定成本为500万元，年变动成本为300万元，预估年销售量为10万个，期望年投资收益率为30%。与此同时，为了进一步丰富智能家居品类，M企业拟推出一款新型智能门锁。市场上智能门锁的市场价格区间为50~500元，M企业决定将其智能门锁的价格定为120元。","options":[{"key":"A","text":"个别包装策略"},{"key":"B","text":"相关包装策略"},{"key":"C","text":"分等级包装策略"},{"key":"D","text":"分量包装策略"}],"answer":["B","C"],"explanation":"撇脂定价策略是一种短期内追求最大利润的高价策略，是指在新产品上市之初，将价格定得很高，以便尽可能在短期内赚取高额利润。高价格能够带来高利润，能迅速补偿研究与开发费用，便于企业快速收回资金，并掌握调价主动权。但是，高价格会诱发竞争，企业压力大；企业新产品的高价高利时期较短。","id":"guanfang-0272","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"根据目标利润定价法，M企业新型真空保温杯的目标价格为（ ）元／个。","material":"M企业的业务涵盖服装、日用百货、智能家居等9个品类，共200余种产品。在日用百货品类下，M企业将保温杯细分为日常便携系列、高端商务系列和定制礼品系列，并分别设计了不同的包装以体现产品不同的档次。目前，M企业决定推出一款新型真空保温杯，经核算，生产此保温杯的投资额为1000万元，年固定成本为500万元，年变动成本为300万元，预估年销售量为10万个，期望年投资收益率为30%。与此同时，为了进一步丰富智能家居品类，M企业拟推出一款新型智能门锁。市场上智能门锁的市场价格区间为50~500元，M企业决定将其智能门锁的价格定为120元。","options":[{"key":"A","text":"80"},{"key":"B","text":"100"},{"key":"C","text":"110"},{"key":"D","text":"180"}],"answer":["C"],"explanation":"分等级包装策略即企业根据产品的不同质量档次，设计、使用不同等级的包装。案例中，M企业为保温杯分别设计了不同的包装以体现不同的档次，这属于分等级包装策略。","id":"guanfang-0273","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"M企业新型智能门锁采用的新产品定价策略为（ ）。","material":"M企业的业务涵盖服装、日用百货、智能家居等9个品类，共200余种产品。在日用百货品类下，M企业将保温杯细分为日常便携系列、高端商务系列和定制礼品系列，并分别设计了不同的包装以体现产品不同的档次。目前，M企业决定推出一款新型真空保温杯，经核算，生产此保温杯的投资额为1000万元，年固定成本为500万元，年变动成本为300万元，预估年销售量为10万个，期望年投资收益率为30%。与此同时，为了进一步丰富智能家居品类，M企业拟推出一款新型智能门锁。市场上智能门锁的市场价格区间为50~500元，M企业决定将其智能门锁的价格定为120元。","options":[{"key":"A","text":"撇脂定价策略"},{"key":"B","text":"市场渗透定价策略"},{"key":"C","text":"产品束定价策略"},{"key":"D","text":"温和定价策略"}],"answer":["C"],"explanation":"目标利润定价法的计算公式为：目标价格=（总成本+目标利润）÷总销量，目标利润=投资额×投资收益率。代人数据，M企业新型真空保温杯的目标利润=1000×30%=300（万元），目标价格=（500+300+300）→10=110（元）。","id":"guanfang-0274","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"关于M企业采用的新产品定价策略的特点的说法，正确的有（ ）。","material":"M企业的业务涵盖服装、日用百货、智能家居等9个品类，共200余种产品。在日用百货品类下，M企业将保温杯细分为日常便携系列、高端商务系列和定制礼品系列，并分别设计了不同的包装以体现产品不同的档次。目前，M企业决定推出一款新型真空保温杯，经核算，生产此保温杯的投资额为1000万元，年固定成本为500万元，年变动成本为300万元，预估年销售量为10万个，期望年投资收益率为30%。与此同时，为了进一步丰富智能家居品类，M企业拟推出一款新型智能门锁。市场上智能门锁的市场价格区间为50~500元，M企业决定将其智能门锁的价格定为120元。","options":[{"key":"A","text":"使企业获取适当的平均利润"},{"key":"B","text":"能兼顾消费者的利益"},{"key":"C","text":"收人甚微，投资回收期长"},{"key":"D","text":"适用于需求复杂多变或竞争激烈的市场环境"}],"answer":["D"],"explanation":"温和定价策略是一种中价策略，是指在新产品上市之初，将价格定在高价和低价之间，力求使买卖双方都满意。案例中，M企业将智能门锁的价格设定在高价与低价之间，即温和定价策略。","id":"guanfang-0275","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"multi","stem":"生产商利用广告和公共关系手段，极力向消费者介绍产品，使他们产生兴趣，吸引、诱导消费者购买产品。这类促销组合策略是（ ）。","material":"","options":[{"key":"A","text":"推动策略"},{"key":"B","text":"拉引策略"},{"key":"C","text":"销售促进"},{"key":"D","text":"人员推销"}],"answer":["A","B"],"explanation":"撇脂定价策略定价较高，易引起消费者不满，有一定风险；而市场渗透定价策略又定价过低，虽对消费者有利，但企业在新产品上市之初，收人甚微，投资回收期长，而温和定价策略可避免上述两种定价策略带来的生产难题，既能使企业获取适当的平均利润，又能兼顾消费者的利益。缺点是比较保守，不适用于需求复杂多变或竞争激烈的市场环境。","id":"guanfang-0276","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"对买方比较有利的促销组合策略是（ ）。","material":"","options":[{"key":"A","text":"价格策略"},{"key":"B","text":"拉引策略"},{"key":"C","text":"渠道策略"},{"key":"D","text":"推动策略"}],"answer":["B"],"explanation":"两种基本的促销组合策略是拉引策略和推动策略。拉引策略是指生产商为刺激消费者的需求，主要利用广告与公共关系等手段，极力向消费者介绍产品及企业，使他们产生兴趣，吸引、诱导他们来购买产品；推动策略是指生产商运用人员推销和销售促进，将产品由生产商向批发商推销，再由批发商向零售商推销，最后再由零售商向消费者推销。","id":"guanfang-0277","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"某生产企业对订货量超过1万件的中间商提供5%的价格折扣，5万件以上提供9%的价格折扣。该企业采用的促销策略为（ ）。","material":"","options":[{"key":"A","text":"公共关系"},{"key":"B","text":"销售促进"},{"key":"C","text":"直复营销"},{"key":"D","text":"广告"}],"answer":["D"],"explanation":"促销组合策略包括拉引策略和推动策略。其中，推动策略表明生产商的营销努力针对渠道成员，引导他们持有产品并推销给最终消费者，因而对买方较为有利。","id":"guanfang-0278","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"某乳制品企业通过赞助体育活动扩大品牌影响力，树立企业的良好形象。该企业采用的促销策略为（ ）。","material":"","options":[{"key":"A","text":"广告"},{"key":"B","text":"销售促进"},{"key":"C","text":"人员推销"},{"key":"D","text":"公共关系"}],"answer":["B"],"explanation":"销售促进是指在一个较大的目标市场中，为了刺激需求而采取的能够迅速产生激励作用的促销措施。针对中间商的销售促进工具有价格折扣、津贴补助、销售奖励、培训支持等。","id":"guanfang-0279","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"针对中间商的促销工具不包括（ ）。","material":"","options":[{"key":"A","text":"销售奖励"},{"key":"B","text":"培训支持"},{"key":"C","text":"免费试用"},{"key":"D","text":"津贴补助"}],"answer":["B"],"explanation":"针对消费者的销售促进工具有价格促销、赠品促销、抽奖、会员与积分、免费试用等。","id":"guanfang-0280","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"single","stem":"广告的功能有（ ）。A、展示功能B.激发功能","material":"","options":[{"key":"A","text":"引导功能"},{"key":"B","text":"体验功能"},{"key":"C","text":"认知功能"}],"answer":["C"],"explanation":"针对中间商的销售促进工具有价格折扣、津贴补助、销售奖励、培训支持等。免费试用一般是针对消费者的销售促进工具。","id":"guanfang-0281","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"multi","stem":"企业在设计推销队伍的结构时，可选择的类型有（ ）。","material":"","options":[{"key":"A","text":"地区型结构"},{"key":"B","text":"水平型结构"},{"key":"C","text":"产品型结构"},{"key":"D","text":"顾客型结构"},{"key":"E","text":"复合型结构"}],"answer":["A","B","C","E"],"explanation":"广告具有以下功能：①展示功能。②认知功能。③激发功能。①引导功能。","id":"guanfang-0282","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第三节市场营销组合策略","point":"","type":"multi","stem":"下列营销活动中，属于直复营销方式的有（ ）。","material":"","options":[{"key":"A","text":"某化妆品公司向目标客户群体寄送样品与宣传手册"},{"key":"B","text":"某食品企业在超市内设立免费试吃摊位，并派发优惠券"},{"key":"C","text":"某电商平台在直播间进行产品销售"},{"key":"D","text":"某保险公司通过电话向客户推销健康险产品"},{"key":"E","text":"某电视台开设购物频道并进行产品售卖活动"}],"answer":["A","C","D","E"],"explanation":"推销队伍的结构类型包括：①地区型结构，即每一位推销人员分管一个地区，负责在该地区推销企业的所有产品。②产品型结构，即每一位推销人员负责一种或一类产品的推销工作。③顾客型结构，即按照顾客类别分配推销人员。④复合型结构，如地区型结构与产品型结构组合、产品型结构与顾客型结构组合、地区型结构与顾客型结构组合等。","id":"guanfang-0283","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"品牌体现的内容不包括（ ）。","material":"","options":[{"key":"A","text":"群体"},{"key":"B","text":"文化"},{"key":"C","text":"个性"},{"key":"D","text":"工艺"}],"answer":["D"],"explanation":"品牌是一个复杂的概念，体现六个方面的内容：属性、利益、价值、文化、个性和群体。","id":"guanfang-0284","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"对消费者而言，某牌汽车意味着耐用、昂贵等，其所体现的品牌内涵是","material":"","options":[{"key":"A","text":"属性"},{"key":"B","text":"利益"},{"key":"C","text":"个性"},{"key":"D","text":"价值"}],"answer":["A"],"explanation":"品牌首先给消费者展示的是产品的某种属性。如对消费者而言，A牌汽车意味着耐用、昂贵等。","id":"guanfang-0285","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"消费者对某高端品牌服装的印象是设计大胆、颜色丰富，其所体现的品牌概念是（ ）。","material":"","options":[{"key":"A","text":"属性"},{"key":"B","text":"利益"},{"key":"C","text":"个性"},{"key":"D","text":"价值"}],"answer":["C"],"explanation":"品牌反映一定的个性。如A牌汽车让人联想到严谨的老板、威严的狮子。","id":"guanfang-0286","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"品牌资产的“五星”概念模型中，消费者对于品牌的记忆程度称为（ ）。","material":"","options":[{"key":"A","text":"品牌认知度"},{"key":"B","text":"品牌忠诚度"},{"key":"C","text":"品牌联想度"},{"key":"D","text":"品牌知名度"}],"answer":["D"],"explanation":"大卫·艾克在综合前人经验的基础上，于1991年提炼出品牌资产的“五星”概念模型，即品牌资产由品牌知名度、品牌认知度、品牌联想度、品牌忠诚度和品牌其他资产五个部分组成。其中，品牌知名度是指消费者对一个品牌的记忆程度。","id":"guanfang-0287","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"品牌资产的“五星”概念模型中，消费者对某一品牌在品质上的整体印象称为（ ）。","material":"","options":[{"key":"A","text":"品牌认知度"},{"key":"B","text":"品牌忠诚度"},{"key":"C","text":"品牌联想度"},{"key":"D","text":"品牌知名度"}],"answer":["A"],"explanation":"品牌认知度是指消费者对某一品牌在品质上的整体印象，主要包括消费者对产品质量和服务质量的认知。","id":"guanfang-0288","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"品牌资产的核心是（ ）。","material":"","options":[{"key":"A","text":"品牌认知度"},{"key":"B","text":"品牌忠诚度"},{"key":"C","text":"品牌联想度"},{"key":"D","text":"品牌知名度"}],"answer":["B"],"explanation":"品牌忠诚度是品牌资产的核心。","id":"guanfang-0289","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"消费者在没有任何提示的情况下第一个想到或脱口而出的品牌，属于（ ）品牌。","material":"","options":[{"key":"A","text":"无知名度"},{"key":"B","text":"提示知名度"},{"key":"C","text":"未提示知名度"},{"key":"D","text":"顶端知名度"}],"answer":["D"],"explanation":"品牌知名度可分为无知名度、提示知名度、未提示知名度和顶端知名度。其中，顶端知名度;即消费者在没有任何提示的情况下第一个想到或脱口而出的品牌。","id":"guanfang-0290","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"某类消费者不仅会无条件地购买这类品牌，而且对该品牌有着强烈的情感认同，甚至引以为傲，这类消费者属于（。","material":"","options":[{"key":"A","text":"情感购买者"},{"key":"B","text":"承诺购买者"},{"key":"C","text":"满意购买者"},{"key":"D","text":"习惯购买者"}],"answer":["B"],"explanation":"品牌忠诚度可分为五个级别：无忠诚购买者、习惯购买者、满意购买者、情感购买者和承诺购买者。其中，承诺购买者是品牌忠诚的最高级别。消费者不仅会无条件地购买这类品牌，而且对该品牌有着强烈的情感认同，甚至引以为傲。","id":"guanfang-0291","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"张某购买手机时，对品牌没有特别的偏好，只根据自己的预算进行选择。从品牌忠诚度的角度来看，小王属于（ ）。","material":"","options":[{"key":"A","text":"情感购买者"},{"key":"B","text":"习惯购买者"},{"key":"C","text":"无忠诚购买者"},{"key":"D","text":"承诺购买者"},{"key":"E","text":"品牌知名度"},{"key":"F","text":"品牌满意度"},{"key":"G","text":"品牌认知度"},{"key":"H","text":"品牌忠诚度"},{"key":"I","text":"品牌整合度"}],"answer":["C"],"explanation":"无忠诚购买者会不断更换品牌，他们对品牌没有特别的偏好，只对价格变动比较敏感。","id":"guanfang-0292","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"multi","stem":"品牌联想度是指通过品牌而产生的所有联想，品牌联想的主要类型有","material":"","options":[{"key":"A","text":"产品特征"},{"key":"B","text":"相对价格"},{"key":"C","text":"用途"},{"key":"D","text":"竞争对手"},{"key":"E","text":"服务质量"}],"answer":["A","C","D"],"explanation":"品牌资产由品牌知名度、品牌认知度、品牌联想度、品牌忠诚度和品牌其他资产五个部分组成。","id":"guanfang-0293","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"multi","stem":"衡量产品质量的要素包括（ ）。","material":"","options":[{"key":"A","text":"性能"},{"key":"B","text":"耐用性"},{"key":"C","text":"可靠性"},{"key":"D","text":"外观"},{"key":"E","text":"价格 二、参考答及解析"}],"answer":["A","B","C","D"],"explanation":"品牌联想主要包括以下几种类型：①产品特征。②相对价格。③用途。④竞争对手。③国家（地域）。","id":"guanfang-0294","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"multi","stem":"使用品牌的好处不包括（ ）。","material":"","options":[{"key":"A","text":"提高顾客忠诚度"},{"key":"B","text":"获得品牌溢价"},{"key":"C","text":"节约成本"},{"key":"D","text":"获得法律保护"}],"answer":["A","B","C","D"],"explanation":"衡量产品质量的要素包括:①性能。②耐用性。③可靠性。④外观。③其他要素，如产品的功能、符合标准的程度以及服务能力等。國第五节品牌战略","id":"guanfang-0295","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"下列产品中，一般没有必要使用品牌的有（ ）。","material":"","options":[{"key":"A","text":"大米"},{"key":"B","text":"电力"},{"key":"C","text":"洗发水"},{"key":"D","text":"煤炭"},{"key":"E","text":"原油"}],"answer":["C"],"explanation":"对大多数企业来说，使用品牌有着十分重要的意义，如有利于提高顾客忠诚度，能加强与中间商讨价还价的能力，易于拓展品牌，能够获得品牌溢价，有助于获得法律保护等。","id":"guanfang-0296","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"multi","stem":"某企业对不同的产品分别使用不同的品牌，其采取的家族品牌决策是","material":"","options":[{"key":"A","text":"统一品牌策略"},{"key":"B","text":"个别品牌策略"},{"key":"C","text":"分类家族品牌策略"},{"key":"D","text":"品牌延伸策略"}],"answer":["B","D"],"explanation":"有些产品没有必要使用品牌。例如，某些难以保证统一质量的，或消费者无须辨认的，或差别不大的商品，如电力、原油、煤炭等原始或初级的产品。","id":"guanfang-0297","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"某公司生产的电视机、音响、剃须刀、灯泡、果汁机等产品系列都使用了同一品牌，其采取的家族品牌决策是（ ）。","material":"","options":[{"key":"A","text":"统一品牌策略"},{"key":"B","text":"个别品牌策略"},{"key":"C","text":"分类家族品牌策略"},{"key":"D","text":"品牌延伸策略"}],"answer":["B"],"explanation":"家族品牌决策即企业对其生产的不同种类、规格、质量的产品选择统一或不同的品牌名称，具体包括以下四种备选策略：个别品牌策略、统一品牌策略、分类家族品牌策略、企业名称与个别品牌并用策略。其中，个别品牌策略即企业对各种不同的产品分别使用不同的品牌。","id":"guanfang-0298","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"某美妆集团分别为护肤产品、彩妆产品、洗护产品打造专属的独立品牌，该企业采用的家族品牌决策是（ ）。","material":"","options":[{"key":"A","text":"统一品牌策略"},{"key":"B","text":"个别品牌策略"},{"key":"C","text":"分类家族品牌策略"},{"key":"D","text":"企业名称与个别品牌并用策略"}],"answer":["A"],"explanation":"统一品牌策略即企业所有的产品使用同一个品牌。","id":"guanfang-0299","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"某汽车公司有三种品牌的汽车产品，其品牌名称前都冠以该公司简称GM”,其采取的家族品牌决策是（ ）。","material":"","options":[{"key":"A","text":"统一品牌策略"},{"key":"B","text":"个别品牌策略"},{"key":"C","text":"分类家族品牌策略"},{"key":"D","text":"企业名称与个别品牌并用策略"}],"answer":["C"],"explanation":"分类家族品牌策略即企业对不同类别的产品分别使用不同的品牌。","id":"guanfang-0300","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"关于个别品牌策略的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"企业对各种不同的产品分别使用不同的品牌"},{"key":"B","text":"个别产品的失误不会影响到整个企业的形象"},{"key":"C","text":"提高或降低产品档次，不会影响原有产品"},{"key":"D","text":"花费的广告宣传费用更少"}],"answer":["C"],"explanation":"分类家族品牌策略即企业对不同类别的产品分别使用不同的品牌。","id":"guanfang-0301","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"关于统一品牌策略的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"企业所有的产品使用同一个品牌"},{"key":"B","text":"可以节省产品投放市场的费用"},{"key":"C","text":"容易向市场推出新产品"},{"key":"D","text":"新上市的产品如果不成功，不至于损害企业本身的声誉"}],"answer":["D"],"explanation":"企业名称与个别品牌并用策略即在每一个品牌之前均冠以企业名称，以企业名称表明产品出处，以品牌名称表明产品的特点。","id":"guanfang-0302","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"企业将现有成功的品牌名称使用到新产品上，包括新包装、新规格和新式样等，这属于（ ）。","material":"","options":[{"key":"A","text":"品牌质量决策"},{"key":"B","text":"品牌延伸决策"},{"key":"C","text":"家族品牌决策"},{"key":"D","text":"品牌重新定位决策"}],"answer":["D"],"explanation":"个别品牌策略即企业对不同类别的产品分别使用不同的品牌。使用这一策略的好处包括：①个别产品的失误不会影响到整个企业的形象，特别是新上市的产品如果不成功，不至于损害企业本身的声誉。②改变产品档次，不会影响原有产品。","id":"guanfang-0303","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"使用品牌延伸决策的优势有（ ）。","material":"","options":[{"key":"A","text":"减少新产品的市场风险"},{"key":"B","text":"强化品牌效应"},{"key":"C","text":"使品牌保持相对的独立性"},{"key":"D","text":"明确新产品的定位"},{"key":"E","text":"提高整体品牌组合的投资效益"}],"answer":["D"],"explanation":"统一品牌策略即企业所有的产品使用同一个品牌。使用这一策略的好处包括：①不需要花费大量费用去设计更多的品牌，可以节省产品投放市场的费用。②企业的品牌一且获得市场成功，可以很容易地向市场推出新产品，新产品的销售可以得到加强。但使用这一策略也有缺点，即企业会因任何一种产品的失败而使整个企业的品牌蒙受损失。","id":"guanfang-0304","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"single","stem":"某公司的洗发水产品有多个互相竞争的品牌，这属于（ ）。","material":"","options":[{"key":"A","text":"品牌质量决策"},{"key":"B","text":"多品牌决策"},{"key":"C","text":"家族品牌决策"},{"key":"D","text":"品牌重新定位决策"}],"answer":["B"],"explanation":"品牌延伸决策即企业将现有成功的品牌名称使用到新产品上，包括新包装、新规格和新式样等。","id":"guanfang-0305","bank":"guanfang"},{"chapter":"第三章市场营销与品牌管理","section":"第四节品牌与品牌资产","point":"","type":"multi","stem":"使用多品牌决策的优势包括（ ）。","material":"","options":[{"key":"A","text":"提高产品的陈列比例"},{"key":"B","text":"减少企业开支"},{"key":"C","text":"提高市场占有率"},{"key":"D","text":"引人竞争机制，提高工作效率"},{"key":"E","text":"有利于企业聚集优势资源 二、参考答紫及解析"}],"answer":["A","B","D","E"],"explanation":"使用品牌延伸决策具有如下优势：①可以明确新产品的定位。②有助于减少 新产品的市场风险。③有助于强化品牌效应，增加经济价值。①能够提升品牌形象，提高整体 品牌组合的投资效益。","id":"guanfang-0306","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"市场营销渠道中的辅助商不包括（ ）。","material":"","options":[{"key":"A","text":"物流公司"},{"key":"B","text":"银行"},{"key":"C","text":"保险公司"},{"key":"D","text":"代理商"}],"answer":["D"],"explanation":"市场营销渠道中的辅助商包括支持分销活动的仓储、运输、金融、广告代理机构等。代理商属于中间商。","id":"guanfang-0307","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"在分销渠道管理目标中，（ ）既是企业分销渠道管理的目标，也是评价企业经营活动的重要指标，反映企业经营状况的好坏。","material":"","options":[{"key":"A","text":"资产负债率"},{"key":"B","text":"利润额"},{"key":"C","text":"资本成本率"},{"key":"D","text":"存货周转率"}],"answer":["B"],"explanation":"分销渠道管理目标一般包括市场占有率、利润额和销售增长额。其中，利润额是指企业的分销活动能给企业带来的利润数量。利润额的多少反映了企业经营状况的好坏。利润额指标不仅是企业分销渠道管理的目标，也是评价企业经营活动的重要指标之一。","id":"guanfang-0308","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"下列选项中，不属于分销渠道成员的是（ ）。","material":"","options":[{"key":"A","text":"消费者"},{"key":"B","text":"生产者"},{"key":"C","text":"中间商"},{"key":"D","text":"物流企业"}],"answer":["D"],"explanation":"分销渠道是指促使某种商品和服务经由市场交换过程，顺利地转移给消费者（用户）消费使用的一整套相互依存的组织。其成员是指商品从生产者向消费者转移过程中，取得这种商品的所有权或帮助所有权转移的所有企业和个人，包括生产者、中间商和最终消费者。","id":"guanfang-0309","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"multi","stem":"分销渠道管理的主要任务包括（ ）。","material":"","options":[{"key":"A","text":"制定分销目标"},{"key":"B","text":"监测分销效率"},{"key":"C","text":"确保利润额"},{"key":"D","text":"解决渠道冲突"},{"key":"E","text":"改善和重建分销渠道"}],"answer":["A","B","D","E"],"explanation":"分销渠道管理是指根据分销渠道的基本职能和性质开展的活动。其主要任务包括：提出并制定分销目标；监测分销效率；协调渠道成员关系，解决渠道冲突；促进商品销售；改善和重建分销渠道。","id":"guanfang-0310","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"multi","stem":"N公司制造某一产品，原有销售模式是通过批发商、零售商及第三方物流公司，最后流转到消费者，后放弃传统的分销模式，仅通过几家精选的零售商销售产品。N公司新的分销渠道成员包括（ ）。","material":"","options":[{"key":"A","text":"N公司"},{"key":"B","text":"供应商"},{"key":"C","text":"零售商"},{"key":"D","text":"消费者"},{"key":"E","text":"第三方物流公司"}],"answer":["A","C","D"],"explanation":"渠道成员是指商品从生产者向消费者转移过程中，取得这种商品的所有权或帮助所有权转移的所有企业和个人，包括生产者、中间商和最终消费者。其中，中间商包括批发商、零售商、代理商。","id":"guanfang-0311","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"对于大多数消费者来说，具备独特品牌标志的高端奢侈品属于消费品分类中的（ ）。","material":"","options":[{"key":"A","text":"日用品"},{"key":"B","text":"应急物品"},{"key":"C","text":"选购品"},{"key":"D","text":"特殊品"}],"answer":["D"],"explanation":"特殊品是指具备独有特征或品牌标志的产品。对这些产品，消费者愿意付出特殊的购买努力，如特殊品牌和式样的汽车、服装等。","id":"guanfang-0312","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"对大多数消费者来说，食盐属于消费品分类中的（ ）。","material":"","options":[{"key":"A","text":"选购品"},{"key":"B","text":"日用品"},{"key":"C","text":"冲动购买品"},{"key":"D","text":"应急物品"}],"answer":["B"],"explanation":"便利品可分为日用品、冲动购买品和应急物品三种。其中，日用品是指那些价格低、经常使用和购买的产品，如食盐、洗涤用品等。","id":"guanfang-0313","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"雨伞、雨衣属于消费品分类中的（ ）。","material":"","options":[{"key":"A","text":"选购品"},{"key":"B","text":"日用品"},{"key":"C","text":"冲动购买品"},{"key":"D","text":"应急物品"}],"answer":["D"],"explanation":"应急物品是指消费者在紧急情况下所购买的产品，如急诊药品、应急雨伞等。","id":"guanfang-0314","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"某公司以分装厂为核心，由分装厂建立经营部，由经营部负责向各个零售终端供应商品。该公司的分销渠道模式属于（ ）模式。","material":"","options":[{"key":"A","text":"厂家直供"},{"key":"B","text":"多家经销（代理）"},{"key":"C","text":"独家经销（代理）"},{"key":"D","text":"平台式销售"}],"answer":["D"],"explanation":"平台式销售模式是指生产厂家以商品的分装厂为核心，由分装厂建立经营部，由经营部负责向各个零售终端供应商品。","id":"guanfang-0315","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"某啤酒生产厂家向超市、酒吧和KTV销售其生产的啤酒，这种分销渠道模式属于（ ）模式。","material":"","options":[{"key":"A","text":"多家经销（代理）"},{"key":"B","text":"厂家直供"},{"key":"C","text":"独家经销（代理）"},{"key":"D","text":"平台式销售"}],"answer":["B"],"explanation":"厂家直供模式是指生产厂家直接将商品供应给终端渠道进行销售的渠道模式。","id":"guanfang-0316","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"一般来说，生产厂家经常在新商品上市之初或企业本身知名度不高时选择的分销渠道模式是（ ）模式。","material":"","options":[{"key":"A","text":"多家经销（代理）"},{"key":"B","text":"厂家直供"},{"key":"C","text":"独家经销（代理）"},{"key":"D","text":"平台式销售"}],"answer":["C"],"explanation":"一般来说，生产厂家经常在新商品上市之初或企业本身知名度不高时选择独家经销(代理）模式。","id":"guanfang-0317","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"在消费品分销渠道模式中，不属于独家经销（代理）模式优点的是","material":"","options":[{"key":"A","text":"市场覆盖面广"},{"key":"B","text":"生产厂家容易与中间商达成共识"},{"key":"C","text":"能够最大限度地调动中间商的积极性"},{"key":"D","text":"市场价格比较稳定"}],"answer":["A"],"explanation":"独家经销（代理）模式的优点是生产厂家容易与中间商达成共识，能够最大限度地 调动中间商的积极性、市场价格比较稳定。其缺点是商品销售权完全交给中间商，生产厂家在 渠道控制方面存在风险。 S.RCDF，常见的消费品分销渠道模式有：①厂家直供模式。②多家经销（代理）模式。 ③独家经销（代理）模式。④平台式销售模式。","id":"guanfang-0318","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"常见的消费品分销渠道模式有（ ）。","material":"","options":[{"key":"A","text":"混合销售模式"},{"key":"B","text":"厂家直供模式"},{"key":"C","text":"平台式销售模式"},{"key":"D","text":"多家经销（代理)模式"},{"key":"E","text":"独家经销（代理）模式"}],"answer":["A"],"explanation":"RD多家经销（代理）模式的优点是分销渠道市场覆盖面广、市场渗透力强和各级渠道成员职责分明：其缺点是渠道环节多、管理困难且容易产生窜货和价格混乱的问题。","id":"guanfang-0319","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"关于消费品的多家经销（代理）模式优点的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"市场渗透力强"},{"key":"B","text":"各级渠道成员职责分明"},{"key":"C","text":"渠道环节较少"},{"key":"D","text":"市场覆盖面广"},{"key":"E","text":"管理较为容易"}],"answer":["A"],"explanation":"在实践中、企业工业品分销渠道主要以直接销售为主。","id":"guanfang-0320","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"multi","stem":"在实践中，企业工业品分销渠道主要以（ ）为主。","material":"","options":[{"key":"A","text":"直接销售"},{"key":"B","text":"间接销售"},{"key":"C","text":"独家代理"},{"key":"D","text":"多家代理"}],"answer":["A","C","D"],"explanation":"工业品市场的特点表现为以下五个方面：①需求具有派生性。②需求弹性小。③专业采购。④一次购买量大。③顾客集中稳定。","id":"guanfang-0321","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"与消费品市场相比，工业品市场的特点表现为（ ）。","material":"","options":[{"key":"A","text":"需求具有派生性"},{"key":"B","text":"需求受价格影响大，需求弹性大"},{"key":"C","text":"购买活动一般由专业采购人员或团队完成"},{"key":"D","text":"一次采购量大"},{"key":"E","text":"顾客分散且变动大"}],"answer":["C"],"explanation":"基本分类法将服务产品分成四类。其中，信息处理服务不一定要求顾客直接参与，现场服务或异地服务均可，如会计服务、银行服务、法律服务、程序编写、科学研究、证券投资等。","id":"guanfang-0322","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"按服务对象和服务特征划分，货运服务属于（ ）。","material":"","options":[{"key":"A","text":"人体处理服务"},{"key":"B","text":"物体处理服务"},{"key":"C","text":"信息处理服务"},{"key":"D","text":"脑刺激处理服务"}],"answer":["A"],"explanation":"采用直接分销模式的根本原因在于服务产品的不可分离性，直接分销模式经常被医疗机构、会计师事务所等提供服务的单位采用。","id":"guanfang-0323","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"multi","stem":"会计师事务所通常采用的分销渠道模式是（ ）。","material":"","options":[{"key":"A","text":"直接分销"},{"key":"B","text":"代理商"},{"key":"C","text":"经纪人"},{"key":"D","text":"批发商"}],"answer":["A","B"],"explanation":"人体处理服务属于顾客高卷人的服务，如客运、医疗、美容、餐饮、手术等。","id":"guanfang-0324","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"multi","stem":"按服务对象和服务特征划分，下列属于针对人的，需要顾客高卷人的服务有（ ）。","material":"","options":[{"key":"A","text":"美容美发"},{"key":"B","text":"餐饮服务"},{"key":"C","text":"家电维修"},{"key":"D","text":"理财服务"},{"key":"E","text":"外科手术"}],"answer":["B","C","D"],"explanation":"服务产品的基本特性可归纳为以下五个方面：①无形性，即与有形的消费品或工业品相比，服务产品的特质及组成的元素往往是无形无质的，甚至使用服务产品后的利益也很难被察觉。②不可分离性，即一般情况下，服务产品的生产与消费过程是同时进行的，两者在时间上不可分离。③差异性，即服务产品的构成成分及其质量水平经常发生变化，很难统一界定。④不可储存性，即服务产品的无形性以及生产与消费同时进行的特性，使服务产品不可能像有形的消费品或工业品一样能够被储存起来。③所有权的不可转让性，服务产品生产消费过程中不涉及任何有形产品所有权的转移。","id":"guanfang-0325","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"multi","stem":"关于服务产品特征的说法，错误的有（ ）。","material":"","options":[{"key":"A","text":"服务产品一般无形无质，且使用后的利益难以被察觉"},{"key":"B","text":"服务产品的生产和消费是在不同时间和空间进行的"},{"key":"C","text":"服务产品的质量标准具有一致性和稳定性"},{"key":"D","text":"服务产品的生产和消费过程伴随着所有权的转移"},{"key":"E","text":"服务产品无法像有形产品那样被储存"}],"answer":["A","B","D","E"],"explanation":"利用中介机构提供服务的常见形式包括以下四种:①代理商，主要应用于旅游、运输、信贷、工商服务等领域。②经纪人，指专门执行或提供某种服务，再以特许权的方式销售该服务，如保险经纪人。③批发商，专指以大批量方式提供服务的中间商。①零售商，如商业零售商、照相馆、干洗店等。","id":"guanfang-0326","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"利用中介机构提供服务的常见形式有（ ）。","material":"","options":[{"key":"A","text":"代理商"},{"key":"B","text":"批发商"},{"key":"C","text":"直营店"},{"key":"D","text":"经纪人"},{"key":"E","text":"零售商"}],"answer":["B"],"explanation":"企业对渠道成员的扶持激励包括实施优惠促销、提供广告津贴、培训销售人员以及融资支持。","id":"guanfang-0327","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"在经销商激励方面，某公司为经销商开展不定期销售人员培训活动，并为经销商提供融资支持。该公司采用的激励方法属于（ ）。","material":"","options":[{"key":"A","text":"差别激励"},{"key":"B","text":"扶持激励"},{"key":"C","text":"沟通激励"},{"key":"D","text":"业务激励"}],"answer":["A"],"explanation":"当商品流通企业给予渠道成员的优惠条件超过它取得合作所需提供的条件时，就会出现激励过度的情况，结果是商品流通企业的销售量提高而利润下降。","id":"guanfang-0328","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"当企业给予渠道成员的激励过度时会导致（ ）。","material":"","options":[{"key":"A","text":"销售量提高而利润下降"},{"key":"B","text":"销售量和利润都提高"},{"key":"C","text":"销售量下降而利润提高"},{"key":"D","text":"销售量和利润都下降"}],"answer":["D"],"explanation":"。当商品流通企业给予渠道成员的条件过于昔刻，以致不能很好地激励渠道成员努力时，就会出现激励不足的情况，结果是商品流通企业的销售量下降，利润下降。。“","id":"guanfang-0329","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"multi","stem":"当企业给予渠道成员的激励不足时会导致（ ）。","material":"","options":[{"key":"A","text":"销售量提高而利润下降"},{"key":"B","text":"销售量和利润都提高"},{"key":"C","text":"销售量下降而利润提高"},{"key":"D","text":"销售量和利润都下降"}],"answer":["A","B","C","D"],"explanation":"企业对渠道成员的业务激励包括动态管理佣金总额、灵活确定佣金比例、安排经销商会议和合作制订经营计划等。","id":"guanfang-0330","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"multi","stem":"下列对渠道成员的激励方法中，属于业务激励的有（ ）。","material":"","options":[{"key":"A","text":"动态管理佣金总额"},{"key":"B","text":"合作制订经营计划"},{"key":"C","text":"灵活确定佣金比例"},{"key":"D","text":"安排经销商会议"},{"key":"E","text":"提供广告津贴"}],"answer":["B","E"],"explanation":"沟通激励的措施主要包括：①提供产品、技术动态信息。②公关宴请。③交流市场信息。④让经销商发泄不满。","id":"guanfang-0331","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"下列企业激励渠道成员的方法中，属于沟通激励的有（ ）。","material":"","options":[{"key":"A","text":"融资支持"},{"key":"B","text":"让经销商发泄不满"},{"key":"C","text":"安排经销商会议"},{"key":"D","text":"培训销售人员"},{"key":"E","text":"公关宴请"}],"answer":["D"],"explanation":"认同权也称参照权，是指当一个渠道成员在使用另一个渠道成员的品牌或者从事对对方有利的活动时，对另一方成员产生的影响。当某渠道成员感到自身的目标与其他成员的目标关系密切或趋于一致时容易产生认同权。换言之，认同权容易产生于渠道成员认为自己已与其他成员处于同一阵营时。","id":"guanfang-0332","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"一些流通企业通过选择与某知名制造商合作，达到提高市场声誉的目的。在这种渠道权力关系中，被选择的制造商具备的渠道权力是（ ）。","material":"","options":[{"key":"A","text":"奖励权"},{"key":"B","text":"强迫权"},{"key":"C","text":"法定权"},{"key":"D","text":"认同权"}],"answer":["B"],"explanation":"专长权是指受影响的渠道成员认为，影响者具备其所不具备的某种特殊知识或有用的专长。特许经营是一种典型的租借授权人的专长开展自己业务的渠道管理方式。","id":"guanfang-0333","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"特许经营是特许人以合同形式将其拥有的经营资源许可被特许人使用的活动，在渠道权力关系中，特许人拥有的权力是（ ）。","material":"","options":[{"key":"A","text":"奖励权"},{"key":"B","text":"专长权"},{"key":"C","text":"认同权"},{"key":"D","text":"信息权"}],"answer":["A"],"explanation":"奖励权与强迫权具有一定的关联性，“赏罚分明”就是指对这两种权力的运用。","id":"guanfang-0334","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"在渠道权力的来源中，“赏罚分明”就是指对（ ）的运用。","material":"","options":[{"key":"A","text":"奖励权与强迫权"},{"key":"B","text":"奖励权与法定权"},{"key":"C","text":"专长权与法定权"},{"key":"D","text":"专长权与强迫权"}],"answer":["A"],"explanation":"来源于渠道成员之间签署的合同的法定权，可以称为法律法定权。实践中，法定权还来源于渠道关系中确定的行事标准以及交易中的规范、价值观和信仰等，这类法定权可以称为传统法定权。","id":"guanfang-0335","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"来源于渠道关系中确定的行事标准以及交易中的规范、价值观和信仰的渠道权力是（ ）。","material":"","options":[{"key":"A","text":"法定权"},{"key":"B","text":"专长权"},{"key":"C","text":"强迫权"},{"key":"D","text":"信息权"}],"answer":["C"],"explanation":"强迫权是指渠道中的影响者对受影响者施加惩罚的能力。渠道成员往往把强迫权看作实施者对自己和企业业务的一种攻击，经常导致自我防卫和报复等行为。","id":"guanfang-0336","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"在渠道权力的来源中，容易导致渠道成员自我防卫的是（ ）。","material":"","options":[{"key":"A","text":"法定权"},{"key":"B","text":"专长权"},{"key":"C","text":"强迫权"},{"key":"D","text":"信息权"}],"answer":["D"],"explanation":"信息权是指渠道成员提供某类信息的能力。任何渠道成员都可能因为及时得到某些真实可靠的信息资料而具备这一权力，如零售商由于更方便地接触消费者而具有与消费者相关的信息权。","id":"guanfang-0337","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"multi","stem":"在有两层中间商的扁平化渠道中，相比于生产商，零售商具有与消费者相关的（ ）。","material":"","options":[{"key":"A","text":"参照权"},{"key":"B","text":"专长权"},{"key":"C","text":"法定权"},{"key":"D","text":"信息权"}],"answer":["A","B","D"],"explanation":"当影响者向目标对象展示权力时就在使用中介性权力，即影响者可以迫使目标对象承认它的权力，中介性权力包括奖励权、强迫权和法律法定权。而没有目标对象的觉察就不存在的权力则属于非中介性权力，包括专长权、信息权、认同权和传统法定权。","id":"guanfang-0338","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"在渠道权力的来源中，属于中介性权力的有（ ）。","material":"","options":[{"key":"A","text":"奖励权"},{"key":"B","text":"强迫权"},{"key":"C","text":"传统法定权"},{"key":"D","text":"法律法定权"},{"key":"E","text":"专长权"}],"answer":["A"],"explanation":"许诺战略表现为“如果你按照我说的去做，我会奖励你”,其权力来源是奖励权。","id":"guanfang-0339","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"渠道成员运用许诺战略所基于的权力来源是（ ）。","material":"","options":[{"key":"A","text":"奖励权"},{"key":"B","text":"强迫权"},{"key":"C","text":"法定权"},{"key":"D","text":"认同权"}],"answer":["D"],"explanation":"请求战略表现为“请按照我希望的去做”,其权力来源有认同权、奖励权、强迫权。3. 建议战略表现为“如果你按照我说的去做，你会有更多盈利”。","id":"guanfang-0340","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"渠道成员运用请求战略时必要的权力来源不包括（ ）。","material":"","options":[{"key":"A","text":"强迫权"},{"key":"B","text":"奖励权"},{"key":"C","text":"认同权"},{"key":"D","text":"信息权"}],"answer":["A"],"explanation":"威胁战略必要的权力来源是强迫权。","id":"guanfang-0341","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"在渠道权力的运用中，建议战略的表现是（ ）。","material":"","options":[{"key":"A","text":"“请按照我希望的去做” B“无须说明我想要的是什么，我们来探讨什么对我的合作伙伴更有利”"},{"key":"B","text":"“如果你按照我说的去做，你会有更多盈利”"},{"key":"C","text":"“你必须按照我说的去做，因为从某种意义讲，你已经同意这样做了”"}],"answer":["B"],"explanation":"法律战略表现为“你必须按照我说的去做，因为从某种意义讲，你已经同意这样做了”。","id":"guanfang-0342","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"在渠道权力的运用战略中，威胁战略必要的权力来源是（)。A、强迫权B.法定权","material":"","options":[{"key":"A","text":"认同权"},{"key":"B","text":"信息权"}],"answer":["A"],"explanation":"信息交换战略表现为“无须说明我想要的是什么，我们来探讨什么对我的合作伙伴更有利”,其权力来源有专长权、信息权、奖励权。","id":"guanfang-0343","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"当渠道中的某位成员向另一位成员说：“你必须按照我说的去做，因为从某种意义讲，你已经同意这样做了”,他运用的是（ ）。","material":"","options":[{"key":"A","text":"威胁战略"},{"key":"B","text":"法律战略"},{"key":"C","text":"建议战略"},{"key":"D","text":"请求战略"}],"answer":["C"],"explanation":"灰色市场策略是中间商保持渠道控制力的重要手段之一，是指中间商从所在分销渠道之外的厂商采购商品的做法。灰色市场策略会冲击分销渠道内生产厂商的销量。","id":"guanfang-0344","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"multi","stem":"渠道成员运用信息交换战略时使用的权力来源是（ ）。","material":"","options":[{"key":"A","text":"奖励权"},{"key":"B","text":"强迫权"},{"key":"C","text":"法定权"},{"key":"D","text":"专长权"},{"key":"E","text":"信息权"}],"answer":["A","B","C","D"],"explanation":"中间商保持渠道控制力可采取的策略有：采用有影响力的自主品牌；形成大批量的销售规模；提供促销服务；培养忠诚顾客；集中采购；适时、适度利用灰色市场；签订长期 合作协议以销售流转慢的商品；适时采用垂直一体化战略；通过批零兼营、价格折扣等手段吸 引更多顾客；通过灵活的货款结算政策影响供应商。","id":"guanfang-0345","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"multi","stem":"中间商从所在分销渠道之外的厂商采购商品的做法被称为（ ）。","material":"","options":[{"key":"A","text":"垂直一体化战略"},{"key":"B","text":"横向一体化战略"},{"key":"C","text":"灰色市场策略"},{"key":"D","text":"多元化战略"}],"answer":["A","D"],"explanation":"在一个行业或市场中，如果存在下列情况，则作为供应者的生产厂商处于有利的控制者地位：①该行业由少数几家大型厂商控制。②厂商的产品在市场上没有替代品。③获得该生产厂商的产品对消费者十分重要。④消费者或者产品是差异化的，厂商很容易完成成本转移。③厂商能实施前向一体化。","id":"guanfang-0346","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"中间商保持渠道控制力可采取的策略有（ ）。","material":"","options":[{"key":"A","text":"集中采购"},{"key":"B","text":"采用有影响力的自主品牌"},{"key":"C","text":"培养忠诚顾客"},{"key":"D","text":"适时、适度利用灰色市场"},{"key":"E","text":"分散采购"}],"answer":["D"],"explanation":"多渠道冲突是指当某个厂商建立了两条或两条以上的渠道向同一市场出售产品或服务时，发生在这些渠道之间的冲突。","id":"guanfang-0347","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"下列情形中，厂商（供应者）处于有利的控制者地位的有（ ）。","material":"","options":[{"key":"A","text":"厂商能实施前向一体化"},{"key":"B","text":"厂商的产品没有互补品"},{"key":"C","text":"消费者或者产品是同质化的"},{"key":"D","text":"获得该生产厂商的产品对消费者十分重要"},{"key":"E","text":"该行业由少数几家大型厂商控制"}],"answer":["C"],"explanation":"按照利益冲突与对抗性行为的关系，利用杜茨模型将冲突分为四种：冲突、潜伏性冲突、虚假冲突和不冲突。其中，虚假冲突是指不存在利益冲突，但是双方存在对抗性行为的情况。","id":"guanfang-0348","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"多渠道冲突是指（ ）。","material":"","options":[{"key":"A","text":"同一渠道中同一层次的成员之间的冲突"},{"key":"B","text":"同一渠道中不同层次的成员之间的冲突"},{"key":"C","text":"当某个厂商建立了两条或两条以上的渠道向不同市场出售产品或服务时，发生在这些 渠道之间的冲突"},{"key":"D","text":"当某个厂商建立了两条或两条以上的渠道向同一市场出售产品或服务时，发生在这些 渠道之间的冲突"}],"answer":["A"],"explanation":"功能性冲突是指渠道成员通过相互对抗来消除渠道成员之间潜在的、有害的紧张气氛和不良动机的行为，通过提出和克服分歧，激励对方并相互挑战，从而共同提高绩","id":"guanfang-0349","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"某企业分销渠道成员间不存在利益冲突，但是成员间存在对抗性行为。这属于杜茨模型冲突分类中的（ ）。","material":"","options":[{"key":"A","text":"功能性冲突"},{"key":"B","text":"不冲突"},{"key":"C","text":"虚假冲突"},{"key":"D","text":"潜伏性冲突"}],"answer":["D"],"explanation":"破坏性冲突是指渠道成员间的不安心理和对抗动机外化成对抗性行为，并超过了一定的限度，对渠道绩效水平和渠道关系产生消极的破坏性影响的一种冲突状态，如窜货、赖账、制假售假等行为导致的渠道冲突。","id":"guanfang-0350","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"渠道成员通过相互对抗消除渠道成员之间潜在的、有害的紧张气氛和不良动机的行为，通过提出和克服分歧，激励对方并相互挑战，从而共同提高绩效。这种渠道冲突属于（ ）。","material":"","options":[{"key":"A","text":"功能性冲突"},{"key":"B","text":"破坏性冲突"},{"key":"C","text":"虚假冲突"},{"key":"D","text":"潜伏性冲突"}],"answer":["B"],"explanation":"根据利益冲突与对抗性行为的关系，渠道冲突可以划分为冲突、潜伏性冲突、虚假冲突和不冲突四种类型。","id":"guanfang-0351","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"multi","stem":"窜货、赖账、制假售假等行为导致的渠道冲突属于（ ）。","material":"","options":[{"key":"A","text":"高度冲突"},{"key":"B","text":"中度冲突"},{"key":"C","text":"功能性冲突"},{"key":"D","text":"破坏性冲突"}],"answer":["A","C","D"],"explanation":"渠道冲突按照渠道成员的层级关系可分为水平冲突、垂直冲突和多渠道冲突。考点+","id":"guanfang-0352","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"将渠道冲突划分为冲突、潜伏性冲突、虚假冲突和不冲突的依据是","material":"","options":[{"key":"A","text":"渠道成员的层级关系"},{"key":"B","text":"利益冲突与对抗性行为的关系"},{"key":"C","text":"渠道冲突程度"},{"key":"D","text":"目标冲突与对抗性行为的关系"}],"answer":["D"],"explanation":"渠道冲突产生的原因之一是资源稀缺。资源稀缺造成的渠道冲突是指由于渠道资源分配不均而造成的冲突。一家制造商在决定采用间接销售渠道后，仍然决定保留其价值较大的客户作为自己的直接客户，这样就会导致渠道成员产生不满。","id":"guanfang-0353","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"multi","stem":"按照渠道成员的层级关系可以将渠道冲突分为（ ）。","material":"","options":[{"key":"A","text":"水平冲突"},{"key":"B","text":"潜伏性冲突"},{"key":"C","text":"垂直冲突"},{"key":"D","text":"多渠道冲突"},{"key":"E","text":"虚假冲突"}],"answer":["A","B","D"],"explanation":"渠道冲突产生的原因包括角色错位、目标差异、观点差异、沟通困难、决策权分歧、期望差异和资源稀缺等。","id":"guanfang-0354","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"一家制造商在决定采用间接销售渠道后，仍然决定保留其较大的客户作为自己的直接客户，在此情况下，渠道冲突产生的原因是（ ）。","material":"","options":[{"key":"A","text":"角色错位"},{"key":"B","text":"决策权分歧"},{"key":"C","text":"期望差异"},{"key":"D","text":"资源稀缺"}],"answer":["B"],"explanation":"采用人员交换的做法减少冲突，是指在两个或者两个以上渠道层次上交换人员。通过人员交换，有利于交换人员接触对方的工作和观点，从而增加双方间的相互了解，有利于双方更好地合作。","id":"guanfang-0355","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"single","stem":"导致渠道冲突的原因包括（ ）。","material":"","options":[{"key":"A","text":"角色错位"},{"key":"B","text":"目标差异"},{"key":"C","text":"期望一致"},{"key":"D","text":"资源稀缺"},{"key":"E","text":"地理位置"}],"answer":["A"],"explanation":"协商、调解、仲裁和诉讼是处理经常性冲突和激烈冲突的常用手段。","id":"guanfang-0356","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第一节渠道运营管理","point":"","type":"multi","stem":"管理者将制造商的管理人员派驻到分销商处工作，将分销商的人员派驻到制造商的相关部门进行体验，这种处理渠道冲突的方式属于（ ）。","material":"","options":[{"key":"A","text":"适当运用激励手段"},{"key":"B","text":"人员交换"},{"key":"C","text":"适时清除渠道成员"},{"key":"D","text":"调解"}],"answer":["A","C"],"explanation":"为减少渠道冲突，渠道领导者需要适时对相关的渠道政策、计划进行折中处理，对相关的活动规则进行修改。渠道管理中经常采用价格折扣、数量折扣、付款信贷、业绩奖励制度、分销人员的培训、分销商会议等激励方法。","id":"guanfang-0357","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第二节分销渠道系统评估","point":"","type":"single","stem":"服务质量差距模型的核心是（ ）。","material":"","options":[{"key":"A","text":"服务传递差距"},{"key":"B","text":"质量感知差距"},{"key":"C","text":"市场沟通差距"},{"key":"D","text":"服务感知差距"}],"answer":["D"],"explanation":"根据服务质量差距模型，决定服务质量的要素之间有五种差异，也就是质量差距。最主要的差距是服务感知差距，这是服务质量差距模型的核心。","id":"guanfang-0358","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第二节分销渠道系统评估","point":"","type":"single","stem":"在服务质量差距模型中，服务提供者制定的服务标准与管理者所认知的顾客期望不一致导致的差距属于（ ）。","material":"","options":[{"key":"A","text":"期望感知差距"},{"key":"B","text":"质量标准差距"},{"key":"C","text":"服务传递差距"},{"key":"D","text":"市场沟通差距"}],"answer":["B"],"explanation":"在服务质量差距模型中，质量标准差距是指服务提供者制定的服务标准与管理者所认知的顾客期望不一致导致的差距。","id":"guanfang-0359","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第二节分销渠道系统评估","point":"","type":"single","stem":"在服务质量差距模型中，企业市场调查和信息分析不准确，对顾客期望的服务了解得不准确等原因导致的差距属于（ ）。","material":"","options":[{"key":"A","text":"期望感知差距"},{"key":"B","text":"质量标准差距"},{"key":"C","text":"服务传递差距"},{"key":"D","text":"市场沟通差距"}],"answer":["A"],"explanation":"在服务质量差距模型中，期望感知差距是指企业不能准确地感知顾客的服务期望。该差距产生的原因包括市场调查和信息分析不准确、对顾客期望的服务了解得不准确、没作需求分析和顾客需求信息在传递中改变等。","id":"guanfang-0360","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第二节分销渠道系统评估","point":"","type":"single","stem":"在服务质量差距模型中，顾客期望的服务和顾客感知或实际体验的服务不一致的情况属于（ ）。","material":"","options":[{"key":"A","text":"期望感知差距"},{"key":"B","text":"服务感知差距"},{"key":"C","text":"服务传递差距"},{"key":"D","text":"市场沟通差距"}],"answer":["B"],"explanation":"在服务质量差距模型中，服务感知差距是指顾客期望的服务和顾客感知或实际体验的服务不一致的情况。","id":"guanfang-0361","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第二节分销渠道系统评估","point":"","type":"single","stem":"在服务质量差距模型中，企业未能执行宣传中的服务质量标准而造成的差距属于（ ）。","material":"","options":[{"key":"A","text":"服务传递差距"},{"key":"B","text":"质量标准差距"},{"key":"C","text":"质量感知差距"},{"key":"D","text":"市场沟通差距"}],"answer":["D"],"explanation":"在服务质量差距模型中，市场沟通差距意味着企业在市场宣传中所承诺的服务与企业实际提供的服务不同。企业未能执行宣传中的服务质量标准属于市场沟通差距。","id":"guanfang-0362","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第二节分销渠道系统评估","point":"","type":"single","stem":"在服务质量差距模型中，市场沟通差距产生的
