<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>中级经济师刷题</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --ink: #18181b;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --green: #16a34a;
      --green-soft: #dcfce7;
      --red: #dc2626;
      --red-soft: #fee2e2;
      --amber: #d97706;
      --amber-soft: #fef3c7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    .wrap { max-width: 640px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    header.top {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .brand { font-weight: 700; font-size: 16px; }
    .btn {
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      border-radius: 10px; padding: 10px 16px; font-size: 15px; line-height: 1.2;
      cursor: pointer; min-height: 44px; display: inline-flex; align-items: center;
      justify-content: center; gap: 6px; text-decoration: none;
    }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .btn.primary:disabled { background: #a3b8e0; border-color: #a3b8e0; }
    .btn.ghost { background: transparent; }
    .btn.block { width: 100%; }
    main { flex: 1; padding: 16px; }

    .home h1 { font-size: 20px; margin: 4px 0 4px; }
    .home .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .bank-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      padding: 16px; margin-bottom: 14px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .bank-card:active { background: #fafafa; }
    .bank-card .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .bank-card .name { font-weight: 700; font-size: 16px; }
    .bank-card .count { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .bank-card .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .reset-link { color: var(--muted); font-size: 12px; margin-left: 10px; cursor: pointer; text-decoration: underline; }
    .reset-link:active { color: var(--red); }
    .progress { height: 8px; background: var(--line); border-radius: 999px; margin-top: 12px; overflow: hidden; }
    .progress > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .badge.red { background: var(--red-soft); color: var(--red); }
    .badge.green { background: var(--green-soft); color: var(--green); }
    .section-title { font-size: 15px; font-weight: 700; margin: 22px 4px 10px; color: var(--ink); }
    .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 8px; }

    .quiz .meta { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .quiz .qbadge { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 7px; margin-left: 8px; }
    .quiz .stem { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
    .material {
      background: var(--amber-soft); border: 1px solid #fde68a; border-radius: 10px;
      padding: 12px; font-size: 14px; color: #78350f; margin: 10px 0 14px; white-space: pre-wrap;
    }
    .opts { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
    .opt {
      display: flex; gap: 10px; align-items: flex-start; text-align: left;
      border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px;
      padding: 13px 14px; font-size: 15px; cursor: pointer; min-height: 48px;
    }
    .opt .key {
      flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; background: #f1f5f9;
      color: var(--muted); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center;
    }
    .opt .txt { flex: 1; }
    .opt.selected { border-color: var(--accent); background: #f0f6ff; }
    .opt.selected .key { background: var(--accent); color: #fff; }
    .opt.right { border-color: var(--green); background: var(--green-soft); }
    .opt.right .key { background: var(--green); color: #fff; }
    .opt.wrong { border-color: var(--red); background: var(--red-soft); }
    .opt.wrong .key { background: var(--red); color: #fff; }
    .opt.muted { opacity: .6; }
    .opt:disabled { cursor: default; }

    .result {
      border-radius: 14px; padding: 14px 16px; margin: 14px 0; font-size: 14px;
    }
    .result.correct { background: var(--green-soft); border: 1px solid #bbf7d0; }
    .result.correct .tag { color: var(--green); }
    .result.wrong { background: var(--red-soft); border: 1px solid #fecaca; }
    .result.wrong .tag { color: var(--red); }
    .result .tag { font-weight: 800; font-size: 15px; }
    .result .ans { font-weight: 700; }
    .result .exp { margin-top: 8px; color: var(--ink); white-space: pre-wrap; }

    .actions { display: flex; gap: 10px; margin-top: 8px; }
    .actions .btn { flex: 1; }

    .foot { padding: 16px; border-top: 1px solid var(--line); background: var(--surface); position: sticky; bottom: 0; }
    .foot .hint { color: var(--muted); font-size: 12px; text-align: center; }

    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
    .modal { background: #fff; border-radius: 16px; padding: 20px; max-width: 420px; width: 100%; }
    .modal h3 { margin: 0 0 8px; font-size: 17px; }
    .modal p { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
    .modal .actions { margin: 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">中级经济师刷题</div>
      <button class="btn ghost" id="homeBtn" hidden>返回题库</button>
    </header>
    <main>
      <section class="home" id="homeView">
        <h1>选择题库</h1>
        <p class="sub">每题一页，作答后显示答案与解析；错题自动收集。</p>
        <div id="bankList"></div>
        <div class="section-title">错题重温</div>
        <div id="wrongList"></div>
      </section>

      <section class="quiz hidden" id="quizView">
        <div class="meta" id="quizMeta"></div>
        <div id="material" class="material hidden"></div>
        <p class="stem" id="qStem"></p>
        <div class="opts" id="qOpts"></div>
        <button class="btn primary block" id="submitBtn">确认答案</button>
        <div class="result hidden" id="qResult"></div>
        <div class="actions hidden" id="qActions">
          <button class="btn" id="nextBtn">下一题</button>
        </div>
      </section>
    </main>
    <footer class="foot"><div class="hint">进度与错题保存在本机浏览器中</div></footer>
  </div>

  <div class="modal-mask hidden" id="resetMask">
    <div class="modal">
      <h3>重置进度？</h3>
      <p id="resetText">将清空该题库的作答记录与错题，且不可恢复。</p>
      <div class="actions">
        <button class="btn" id="resetCancel">取消</button>
        <button class="btn primary" id="resetOk">确认重置</button>
      </div>
    </div>
  </div>

  <script>
    const DATA = {"banks":[{"id":"jichu","name":"经济基础 · 章节母题","questions":[{"chapter":"刷章节母题 第一章 社会主义基本经济制度 共8题","point":"社会主义基本经济制度的内涵","type":"single","stem":"我国实行按劳分配为主体的收入分配制度是基于（ ）。","material":"","options":[{"key":"A","text":"劳动在一定程度上可以替代其他生产要素"},{"key":"B","text":"我国生产力发展水平较高"},{"key":"C","text":"我国实行公有制为主体、多种所有制经济共同发展的所有制结构"},{"key":"D","text":"我国社会主义市场经济体制"}],"answer":["C"],"explanation":"本题考查社会主义基本经济制度的内涵。在社会主义基本经济制度中，以公有制为主体、多种所有制经济共同发展的所有制结构处于核心地位，决定了我国必须实行以按劳分配为主体、多种分配方式并存的收入分配制度。故本题选C选项。","id":"jichu-0001","bank":"jichu"},{"chapter":"刷章节母题 第一章 社会主义基本经济制度 共8题","point":"社会主义基本经济制度的内涵","type":"multi","stem":"以下关于社会主义基本经济制度的地位和作用，说法正确的是","material":"","options":[{"key":"A","text":"社会主义基本经济制度既体现了社会主义制度的优越性，又同我国社会主义初级阶段的社会生产力发展水平相适应（ ）。"},{"key":"B","text":"公有制经济在关系到国家安全、国民经济命脉和国计民生的重要行业和关键领域等方面起到主体作用"},{"key":"C","text":"非公有制经济在促进经济增长、优化经济结构、增加就业、改善民生等方面有重要作用"},{"key":"D","text":"市场在宏观调控、市场监管、公共服务、生态环境保护和实现共同富裕中发挥主导作用"},{"key":"E","text":"公有制经济在促进经济增长、优化经济结构、增加就业、改善民生等方面有重要作用"}],"answer":["A","B","C"],"explanation":"本题考查社会主义基本经济制度的地位和作用。社会主义基本经济制度是中国特色社会主义制度的重要支柱，既体现了社会主义制度的优越性，又同我国社会主义初级阶段的社会生产力发展水平相适应。社会主义基本经济制度既有利于发挥公有制经济在保障广大人民群众共同利益、实现共同富裕、巩固和完善社会主义制度，在关系到国家安全、国民经济命脉和国计民生的重要行业和关键领域等方面的主体作用，又有利于发挥非公有制经济在促进经济增长、优化经济结构、增加就业、改善民生等方面作用（选项E错误）。社会主义基本经济制度既有利于市场在资源配置中发挥决定性作用，发挥市场机制灵敏、有效的优势，增强市场主体活力，保持市场平衡，又有利于加强党对经济工作的集中统一领导，发挥政府在宏观调控、市场监管、公共服务、生态环境保护和实现共同富裕中的主导作用（选项D错误）。故本题选ABC选项。 ；提醒； 注意区分公有制经济和非公有制经济的具体内容，考查的时候通常会交叉考 查，避免混淆。","id":"jichu-0002","bank":"jichu"},{"chapter":"刷章节母题 第一章 社会主义基本经济制度 共8题","point":"社会主义所有制结构","type":"single","stem":"在我国现阶段，社会主义全民所有制经济就是（ ）。","material":"","options":[{"key":"A","text":"国有经济"},{"key":"B","text":"集体经济"},{"key":"C","text":"混合所有制经济"},{"key":"D","text":"股份制经济"}],"answer":["A"],"explanation":"本题考查社会主义全民所有制经济。社会主义全民所有制经济是全体社会成员联合起来共同占有生产资料的公有制形式，由国家作为全体人民的代表对全民所有的生产资料行使所有权。因此，在现阶段，国有经济即社会主义全民所有制经济。故本题选A选项。","id":"jichu-0003","bank":"jichu"},{"chapter":"刷章节母题 第一章 社会主义基本经济制度 共8题","point":"社会主义所有制结构","type":"multi","stem":"下列选项中，属于非公有制经济的有（ ）。","material":"","options":[{"key":"A","text":"全民所有制经济"},{"key":"B","text":"外商独资经济。"},{"key":"C","text":"混合所有制经济（ ）。"},{"key":"D","text":"私营经济"},{"key":"E","text":"个体经济"}],"answer":["B","D","E"],"explanation":"本题考查非公有制经济的内涵、形式及作用。选项D、E正确，非公有制经济主要包括个体经济、私营经济和外资经济等多种形式，还包括混合所有制经济中的非公有成分。选项B正确，其中外资经济目前包括外商独资企业、中外合资企业和中外合作经营企业等具体形式。其中，以中外合资、合作方式形成的外资经济属于混合所有制经济形式，其中所包含的国有经济或集体经济部分属于公有制经济的范畴。所以不能简单地认为外资经济就完全是非公有制经济。人选项C错误，非公有制经济包括混合所有制经济中的非公有成分，而不是混合所有制经济。选项A错误，全民所有制经济属于公有制经济。故本题选BDE选项。","id":"jichu-0004","bank":"jichu"},{"chapter":"刷章节母题 第一章 社会主义基本经济制度 共8题","point":"社会主义收入分配制度","type":"multi","stem":"按劳分配的内涵包括（ ）。","material":"","options":[{"key":"A","text":"巩固公有制经济的主体地位"},{"key":"B","text":"等量劳动领取等量报酬"},{"key":"C","text":"完善市场秩序"},{"key":"D","text":"增加劳动者报酬"},{"key":"E","text":"各尽所能"}],"answer":["B","E"],"explanation":"本题考查社会主义收入分配制度的内涵。按劳分配的内涵包括两个方面：（1）各尽所能，就是有劳动能力的社会成员都必须参加社会劳动；（2）等量劳动领取等量报酬。故本题选BE选项。","id":"jichu-0005","bank":"jichu"},{"chapter":"刷章节母题 第一章 社会主义基本经济制度 共8题","point":"社会主义收入分配制度","type":"single","stem":"我国实行的收入分配制度是（ ）。","material":"","options":[{"key":"A","text":"按投资分配"},{"key":"B","text":"按生产要素分配"},{"key":"C","text":"按劳分配。"},{"key":"D","text":"按劳分配为主体、多种分配方式并存（ ）。"}],"answer":["D"],"explanation":"本题考查社会主义收入分配制度的内涵。我国实行以按劳分配为主体、多种分配方式并存的收入分配制度。故本题选D选项。","id":"jichu-0006","bank":"jichu"},{"chapter":"刷章节母题 第一章 社会主义基本经济制度 共8题","point":"社会主义市场经济体制（ ）。","type":"single","stem":"资源配置的实质是（ ）。","material":"","options":[{"key":"A","text":"生产要素在城乡之间的分配"},{"key":"B","text":"劳动力资源在各部门之间的分配"},{"key":"C","text":"自然资源在各部门之间的分配"},{"key":"D","text":"社会总劳动时间在各种产品生产之间的分配"}],"answer":["D"],"explanation":"本题考查资源配置的实质。资源配置的实质，就是马克思所提出的社会总劳动时间在各种产品生产上如何分配的问题，或按一定比例分配社会劳动的问题。故本题选D选项。","id":"jichu-0007","bank":"jichu"},{"chapter":"刷章节母题 第一章 社会主义基本经济制度 共8题","point":"社会主义市场经济体制（ ）。","type":"multi","stem":"关于社会主义市场经济体制，说法正确的有（ ）。","material":"","options":[{"key":"A","text":"资源配置的实质，就是马克思所提出的社会总劳动时间在各种产品生产上如何分配的问题，或按一定比例分配社会劳动的问题"},{"key":"B","text":"资源配置方式主要有市场调节方式和政府调节方式"},{"key":"C","text":"将经济资源有效地分配到社会生产不同部门是人类社会生产活动的首要任务"},{"key":"D","text":"社会经济资源主要是由政府配置"},{"key":"E","text":"社会主义市场经济是建立在社会主义经济制度基础之上的，其存在的制度基础是社会主义高级阶段的经济制度"}],"answer":["A","B","C"],"explanation":"本题考查社会主义市场经济体制的内涵和特征。选项A正确，资源配置的实质，就是马克思所提出的社会总劳动时间在各种产品生产上如何分配的问题，或按一定比例分配社会劳动的问题。选项B正确，一般认为，资源配置方式主要有两种：市场调节方式和政府调节方式。选项C正确，将经济资源有效地分配到社会生产不同部门是人类社会生产活动的首要任务。选项D错误，社会经济资源主要是由市场配置，而不是由政府配置或政府的计划配置；价格主要由市场决定，而不是由政府制定。市场对资源配置起决定性作用，就是通过价格机制、供求机制、竞争机制等市场机制对资源配置发挥决定性作用。选项E错误，社会主义市场经济是建立在社会主义经济制度基础之上的，其存在的制度基础是社会主义初级阶段的经济制度。故本题选ABC选项。","id":"jichu-0008","bank":"jichu"},{"chapter":"刷章节母题 第二章 市场需求、供给与均衡价格 共8题","point":"市场需求","type":"multi","stem":"下列关于需求和供给的说法中，正确的有（ ）。","material":"","options":[{"key":"A","text":"需求是指在一定时间内和一定价格条件下，消费者对某种商品或服务愿意而且能够购买的数量"},{"key":"B","text":"市场需求就是所有消费者和生产者需求的总和"},{"key":"C","text":"供给是指在某一时间内和一定的价格水平下生产者愿意并可能为市场提供某种商品或服务的数量"},{"key":"D","text":"市场供给是所有生产者供给的总和"},{"key":"E","text":"需求与通常所说的需要是相同的"}],"answer":["A","C","D"],"explanation":"本题考查需求的含义。选项B错误，市场需求就是所有消费者需求的总和。选项E错误，需求与通常所说的需要是不同的，需求有两个构成要素。故本题选ACD选项。","id":"jichu-0009","bank":"jichu"},{"chapter":"刷章节母题 第二章 市场需求、供给与均衡价格 共8题","point":"市场需求","type":"single","stem":"如果甲产品的价格上升引起乙产品需求曲线向左移动，那么，以下说法正确的是（ ）。","material":"","options":[{"key":"A","text":"甲产品和乙产品是互补品"},{"key":"B","text":"甲产品和乙产品是替代品"},{"key":"C","text":"甲产品乙产品是高档商品"},{"key":"D","text":"甲产品乙产品是低档商品"}],"answer":["A"],"explanation":"本题考查需求函数、需求规律和需求曲线。选项C、D错误，根据题干进行分析：甲乙是两种商品，判断的是这两种商品的关系，即是替代品还是互补品，而非判断档次。选项B错误，已知甲价格上升，则根据需求规律，先推出甲的需求量会下降；再根据已知“乙需求曲线向左移动”得到乙的需求减少，那么甲和乙需求都减少了，则得到甲和乙是互补品，因为互补品的需求量是一起变化的，替代品的两种商品需求量是反向变化的。故本题选A选项。","id":"jichu-0010","bank":"jichu"},{"chapter":"刷章节母题 第二章 市场需求、供给与均衡价格 共8题","point":"市场供给","type":"multi","stem":"影响供给的因素主要包括（ ）。","material":"","options":[{"key":"A","text":"产品价格"},{"key":"B","text":"生产成本"},{"key":"C","text":"生产技术"},{"key":"D","text":"生产要素的价格"},{"key":"E","text":"消费者的个人收入"}],"answer":["A","B","C","D"],"explanation":"本题考查供给的影响因素。影响供给的主要因素有以下几方面：（1）产品价格。在其他条件不变的情况下，某种产品自身的价格与其供给的变动呈正方向变化。在其他条件一定时，价格提高，就会增加企业的收益或利润，从而吸引企业去生产更多的产品，其他企业也会生产这种产品，使供给增加；反之，价格下降，收益减少，供给就会减少，选项A正确。（2）生产成本。在其他条件不变时，生产成本降低，意味着利润增加，则供给就会增加；反之，生产成本上升，供给就会减少，选项B正确。（3）生产技术。生产技术的进步或革新，意味着效率的提高或成本的下降，从而影响企业的利润。因此，技术水平在一定程度上决定着生产成本，进而影响供给，选项C正确。（4）预期。生产者或销售者对商品或服务价格的预期，往往会引起该商品或服务供给的变化。（5）相关产品的价格。（6）其他因素，包括生产要素的价格以及国家政策等，选项D正确。消费者的个人收入属于影响需求的主要因素之一，选项E错误。故本题选ABCD选项。","id":"jichu-0011","bank":"jichu"},{"chapter":"刷章节母题 第二章 市场需求、供给与均衡价格 共8题","point":"市场供给","type":"single","stem":"假设纵轴是商品价格，横轴是数量，绘制出某种香烟的供给曲线和需求曲线。当政府实行增税措施，使得香烟的生产成本增加，在坐标图上的曲线变化是（ ）。","material":"","options":[{"key":"A","text":"香烟的需求曲线将向左移动"},{"key":"B","text":"香烟的供给曲线将向右移动"},{"key":"C","text":"香烟的供给曲线将向左移动"},{"key":"D","text":"香烟的需求曲线将向右移动（ ）。"}],"answer":["C"],"explanation":"本题考查供给规律和供给曲线。选项C正确、选项B错误，由于价格以外的其他因素如成本等发生变动而引起供给的变动，称为供给的变动，这种情形表现为供给曲线的变动。本题通过生产成本增加可选择供给曲线向左移动。选项A、D错误，由于题干没有给出诸如市场需求减少等导致需求曲线发生位移的因素，所以无法得出需求曲线是向什么方位移动。高句故本题选C选项。","id":"jichu-0012","bank":"jichu"},{"chapter":"刷章节母题 第二章 市场需求、供给与均衡价格 共8题","point":"均衡价格","type":"multi","stem":"均衡价格的特点有（ ）。","material":"","options":[{"key":"A","text":"偶然的"},{"key":"B","text":"绝对的"},{"key":"C","text":"暂时的"},{"key":"D","text":"相对的"},{"key":"E","text":"频繁的"}],"answer":["A","C","D"],"explanation":"本题考查均衡价格和均衡数量的形成和变动。选项A、C、D正确，均衡价格是市场供给力量和需求力量相互抵消时所达到的价格水平。供求平衡时所对应的价格就是均衡价格。在实际生活中，供求十分活跃，经常发生变化，所以任何市场上供求平衡都是偶然的、暂时的、相对的。选项B错误，微观经济学中的“均衡价格”是指供求的动态平衡，由于是“动态的”，则不可能是“绝对的”。选项E错误，“频繁的”指具有一定规律性，但是均衡价格经常变化，并不具有规律性，反而具有偶然性、暂时性。故本题选ACD选项。","id":"jichu-0013","bank":"jichu"},{"chapter":"刷章节母题 第二章 市场需求、供给与均衡价格 共8题","point":"均衡价格","type":"single","stem":"下列关于最高限价的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"其目标是保护消费者利益或降低某些生产者的生产成本"},{"key":"B","text":"属于政府对价格的干预措施"},{"key":"C","text":"最高限价高于均衡价格（ ）。"},{"key":"D","text":"最高限价低于均衡价格"}],"answer":["C"],"explanation":"本题考查最高限价分析。选项A正确，最高限价就是政府为某种产品规定一个具体的价格，市场交易只能在这一价格下进行。其目的是保护消费者利益或降低某些生产者的生产成本。选项B正确，在我国，最高限价和保护价格均属于政府对市场价格的干预措施。选项C错误、选项D正确，最高限价是低于均衡价格的。故本题选C选项。","id":"jichu-0014","bank":"jichu"},{"chapter":"刷章节母题 第二章 市场需求、供给与均衡价格 共8题","point":"弹性","type":"single","stem":"（ ）是指一种商品价格的相对变化与由此引起的另一种商品需求量的相对变化之间的比率。","material":"","options":[{"key":"A","text":"需求价格弹性"},{"key":"B","text":"供给价格弹性"},{"key":"C","text":"需求交叉弹性"},{"key":"D","text":"供给交叉价格弹性"}],"answer":["C"],"explanation":"本题考查需求交叉弹性。选项A错误，需求价格弹性是需求量对价格变动的反应程度，是需求量变动百分比与价格变动百分比的比值。选项B错误，供给价格弹性是价格的相对变化与所引起的供给量的相对变化之间的比值。 选项C正确，一种商品价格的相对变化与由此引起的另一种商品需求量相对变化 之间的比值，称为需求交叉弹性。 选项D错误，供给交叉价格弹性是指在其他条件不变的情况下，某种商品或劳务 价格变动所引起的另一种商品或劳务供给量变动的程度。和需求交叉弹性异曲同 工，只是供给量的变动率作比。 故本题选C选项。","id":"jichu-0015","bank":"jichu"},{"chapter":"刷章节母题 第二章 市场需求、供给与均衡价格 共8题","point":"弹性","type":"multi","stem":"影响供给价格弹性的因素有（ ）。","material":"","options":[{"key":"A","text":"替代品数量和相近程度"},{"key":"B","text":"商品重要性"},{"key":"C","text":"时间"},{"key":"D","text":"投入品替代性大小及相近程度"},{"key":"E","text":"生产周期和自然条件"}],"answer":["C","D","E"],"explanation":"本题考查供给价格弹性。选项A、B错误，影响需求价格弹性的因素：替代品的数量和相近程度、商品的重要性、商品用途的多少、时间。AB均为需求价格弹性的影响因素，不属于供给价格弹性的，故错误。选项C、D、E正确，影响供给价格弹性的因素：时间、生产周期和自然条件、投入品替代性大小和相似程度。其中时间是决定供给价格弹性的首要因素。故本题选CDE选项。","id":"jichu-0016","bank":"jichu"},{"chapter":"刷章节母题 第三章 生产和成本理论 共6题","point":"生产者的组织形式和企业理论","type":"multi","stem":"企业的主要组织形式包括（ ）。","material":"","options":[{"key":"A","text":"公司制企业"},{"key":"B","text":"综合型企业"},{"key":"C","text":"合伙制企业"},{"key":"D","text":"专业型企业"},{"key":"E","text":"个人独资企业"}],"answer":["A","C","E"],"explanation":"本题考查企业的组织形式。企业的主要组织形式包括个人独资企业、合伙制企业和公司制企业。故本题选ACE选项。","id":"jichu-0017","bank":"jichu"},{"chapter":"刷章节母题 第三章 生产和成本理论 共6题","point":"生产者的组织形式和企业理论","type":"multi","stem":"下列关于企业形成的理论说法正确的有（ ）。","material":"","options":[{"key":"A","text":"交易费用包括企业产生签订契约时交易双方面临的必然因素所可能带来的损"},{"key":"B","text":"协调和配置资源的方式包括企业和市场机制。"},{"key":"C","text":"企业产生后社会上形成了企业外部的市场交易和企业内部的交易"},{"key":"D","text":"企业的本质或显著特征是交易成本的节约。"},{"key":"E","text":"企业存在的根本原因是信息的不完全性"}],"answer":["B","C"],"explanation":"本题考查企业形成的相关理论。选项A错误，交易费用包括企业产生签订契约时交易双方面临的偶然因素所可能带来的损失，以及签订契约及监督和执行契约所花费的成本。选项B、C正确，从企业产生后，企业和市场机制就是两种不同的协调生产和配置资源的方式，同时社会上就形成了两种交易，即企业外部的市场交易和企业内部的交易。选项D错误，企业的本质或显著特征是作为市场机制或价格机制的替代物。选项E错误，企业存在的根本原因是交易成本的节约。导致市场机制和企业的交易费用不同的主要因素在于信息的不完全性。故本题选BC选项。","id":"jichu-0018","bank":"jichu"},{"chapter":"刷章节母题 第三章 生产和成本理论 共6题","point":"生产函数和生产曲线","type":"multi","stem":"投入主要包括企业生产过程中所使用的各种生产要素。生产要素一般被划分为（ ）。","material":"","options":[{"key":"A","text":"劳动"},{"key":"B","text":"市场"},{"key":"C","text":"资本"},{"key":"D","text":"土地"},{"key":"E","text":"企业家才能"}],"answer":["A","C","D","E"],"explanation":"本题考查生产及其相关概念。生产要素划分为劳动、资本、土地和企业家才能四种类型。市场不属于生产要素。故本题选ACDE选项。【乐拓展】投入主要包括企业生产过程中所使用的各种生产要素。生产要素一般被划分为劳动、资本、土地和企业家才能等类型。投入可以分为可变投入与不变投入，从较长时期来看，企业的各项投入都是可以改变的。但在短期内，部分生产要素，如厂房、设备等资本投入一般是不能改变的，称为不变投入。因此，当各种投入要素都可变时，一般是研究企业的长期行为；当某种或几种要素不可变时，一般是研究企业的短期行为。","id":"jichu-0019","bank":"jichu"},{"chapter":"刷章节母题 第三章 生产和成本理论 共6题","point":"生产函数和生产曲线","type":"single","stem":"在其他情况不变时，企业内部各种生产要素按照相同比例变化时所带来的产量的变化称为（ ）。·）","material":"","options":[{"key":"A","text":"总产量"},{"key":"B","text":"平均产量"},{"key":"C","text":"规模报酬"},{"key":"D","text":"边际产量"}],"answer":["C"],"explanation":"本题考查规模报酬。选项A错误，总产量是指生产出来的用实物单位衡量的产出总量。选项B错误，平均产量是指总产量除以总投入的单位数，或者说是每单位投入生产的产出。选项C正确，规模报酬也称规模收益是指在其他情况不变时，企业内部各种生产要素按照相同比例变化时所带来的产量的变化。人选项D错误，边际产量是指在其他投入保持不变的条件下，由于新增一单位的投入而多生产出来的产量或产出。故本题选C选项。意包","id":"jichu-0020","bank":"jichu"},{"chapter":"刷章节母题 第三章 生产和成本理论 共6题","point":"成本函数和成本曲线","type":"single","stem":"下列关于经济利润的说法中错误的是（ ）。","material":"","options":[{"key":"A","text":"企业的经济利润是指企业的总收益和总成本的差额"},{"key":"B","text":"经济利润也可以称为超额利润"},{"key":"C","text":"经济利润中包括正常利润"},{"key":"D","text":"与经济利润相对的是正常利润"}],"answer":["C"],"explanation":"本题考查成本和利润的含义。选项A正确，企业的经济利润是指企业的总收益和总成本的差额，简称企业的利 润。 选项B正确，经济利润也可以称为超额利润。 选项C错误、选项D正确，和经济利润相对的是正常利润，通常是指企业对自己 所提供的企业家才能的报酬支付。正常利润是生产成本的一部分，是作为隐成本 的一部分计入成本的，因此经济利润中不包括正常利润。 故本题选C选项。 【乐拓展】 经济利润=总收益-总成本=总收益－（显成本+隐成本)，正常利润属于隐成本，由 以上公式得出，经济利润里剔除了隐成本，故经济利润不含正常利润。","id":"jichu-0021","bank":"jichu"},{"chapter":"刷章节母题 第三章 生产和成本理论 共6题","point":"成本函数和成本曲线","type":"single","stem":"平均总成本曲线的最低点慢于且高于平均可变成本曲线的最低点的原因在于","material":"","options":[{"key":"A","text":"边际成本曲线具有的Ｕ型特征"},{"key":"B","text":"平均总成本还包括平均固定成本"},{"key":"C","text":"平均可变成本曲线低于平均总成本曲线"},{"key":"D","text":"平均可变成本曲线的U型特征"}],"answer":["B"],"explanation":"本题考查成本曲线。B选项正确，由于平均总成本既包括平均可变成本，还包括平均固定成本，随着产量的增加，受固定成本的影响，平均总成本曲线的最低点的出现慢于且高于平均可变成本曲线的最低点。平均可变成本曲线低于平均总成本曲线是现象描述，而非原因解释，选项A、C、D错误。故本题选B选项。","id":"jichu-0022","bank":"jichu"},{"chapter":"刷章节母题 第四章 市场结构理论 共8题","point":"市场结构的类型","type":"single","stem":"市场类型划分标准是（ ）。","material":"","options":[{"key":"A","text":"市场的竞争程度或垄断程度"},{"key":"B","text":"本行业内部的生产者数目或企业数目"},{"key":"C","text":"本行业内各企业生产的产品的差别程度"},{"key":"D","text":"进入障碍的大小"}],"answer":["A"],"explanation":"本题考查划分市场结构的标准。市场类型划分标准是市场的竞争程度或垄断程度，即可以根据竞争程度由低到高、垄断程度由高到低依次分为：完全垄断市场、寡头垄断市场、垄断竞争市场、完全竞争市场四种类型选项B、C、D属于具体的划分行业类型的依据。故本题选A选项。","id":"jichu-0023","bank":"jichu"},{"chapter":"刷章节母题 第四章 市场结构理论 共8题","point":"市场结构的类型","type":"multi","stem":"完全竞争市场的特征有（ ）。","material":"","options":[{"key":"A","text":"同一行业有众多生产者和消费者人"},{"key":"B","text":"每个生产者或消费者都是价格的决定者"},{"key":"C","text":"买卖双方对市场信息有充分的了解。"},{"key":"D","text":"进入或退出行业存在较大的障碍"},{"key":"E","text":"同行业各个企业生产的同一产品不存在差别"}],"answer":["A","C","E"],"explanation":"本题考查完全竞争市场的特征。完全竞争市场特征：（1）市场上有很多生产者与消费者，或买者和卖者，且生产者的规模都很小，没有任何一个买者或卖者能够影响市场价格，每个生产者和消费者都只能是市场价格的接受者，不是价格的决定者，选项B错误。（2）企业生产的产品是同质的，即不存在产品质量差别。（3）买卖双方对市场信息都有充分的了解。（4）资源可以自由流动，企业可以自由进入或退出市场，选项D错误。故本题选ACE选项。","id":"jichu-0024","bank":"jichu"},{"chapter":"刷章节母题 第四章 市场结构理论 共8题","point":"完全竞争市场上生产者的行为","type":"single","stem":"完全竞争市场上，单个企业的需求曲线是（ ）。","material":"","options":[{"key":"A","text":"与整个行业的需求曲线一致"},{"key":"B","text":"是向右下方倾斜的"},{"key":"C","text":"是与横轴平行的"},{"key":"D","text":"不影响市场价格"}],"answer":["C"],"explanation":"本题考查完全竞争市场行业的供求曲线和个别企业的需求曲线。在完全竞争市场上，每一个企业都是价格接受者，其所面对的需求曲线是一条平行于横轴的水平线。故本题选C选项。","id":"jichu-0025","bank":"jichu"},{"chapter":"刷章节母题 第四章 市场结构理论 共8题","point":"完全竞争市场上生产者的行为","type":"multi","stem":"下列关于完全竞争市场上生产者的行为的表述正确的有（ ）。","material":"","options":[{"key":"A","text":"个别企业的需求曲线是一条平行于横轴的水平线"},{"key":"B","text":"个别企业的需求曲线是向右下方倾斜的曲线"},{"key":"C","text":"企业的平均收益和边际收益都等于单位产品价格"},{"key":"D","text":"企业的平均收益、边际收益和需求曲线都是同一条线"},{"key":"E","text":"边际收益小于平均收益。"}],"answer":["A","C","D"],"explanation":"本题考查完全竞争市场的收益曲线。如图为完全竞争市场中行业和企业的需求曲线：PiP1图1：行业供求曲线图2：企业需求曲线A/生成选项A正确，完全竞争市场中个别企业的需求曲线是一条平行于横轴的水平线。选项B错误，在完全竞争市场中，行业的需求曲线是一条向右下方倾斜的曲线，企业的需求曲线是水平线。选项C、D正确，完全竞争市场上，企业的平均收益和边际收益都等于单位产品价格，是水平线（即三线合一，平均收益线=边际收益线=需求曲线）。选项E错误，指的是完全垄断企业的情形。故本题选ACD选项。","id":"jichu-0026","bank":"jichu"},{"chapter":"刷章节母题 第四章 市场结构理论 共8题","point":"完全垄断市场上生产者的行为","type":"single","stem":"关于完全垄断厂商的说法不正确的是（ ）。","material":"","options":[{"key":"A","text":"面临的需求曲线向右下方倾斜"},{"key":"B","text":"在利润最大化产量上，价格等于边际收益"},{"key":"C","text":"边际收益与平均收益不相等"},{"key":"D","text":"在利润最大化产量上，价格高于边际成本"}],"answer":["B"],"explanation":"本题考查完全断市场中生产者的行为。在完全垄断市场上，企业的需求曲线就是市场需求曲线，按照市场需求曲线，销售量和价格按照相反的方向变化，价格随销售量的增加而下降，因此，完全垄断企业的需求曲线向右下方倾斜，斜率为负，选项A正确。在完全垄断市场上，企业的平均收益等于单位产品的价格。企业的边际收益不等于平均收益或价格，而是小于平均收益或价格，选项C正确。实现利润最大化的条件是边际收益等于边际成本，所以边际成本小于平均收益或价格，选项B错误，选项D正确。故本题选B选项。","id":"jichu-0027","bank":"jichu"},{"chapter":"刷章节母题 第四章 市场结构理论 共8题","point":"完全垄断市场上生产者的行为","type":"multi","stem":"价格歧视也称为差别定价，是指垄断企业为获取更大的利润，对同一产品规定不同价格。下列关于价格歧视的表述正确的有（ ）。","material":"","options":[{"key":"A","text":"二级价格歧视下所有的消费者剩余都被垄断者占有了"},{"key":"B","text":"一级价格歧视是指按不同价格出售不同单位产量，但每个购买相同数量的购买者支付的价格相同，也称为批量作价，垄断厂商侵蚀了一部分消费者剩余"},{"key":"C","text":"三级价格歧视是建立在不同的需求价格弹性的基础上"},{"key":"D","text":"企业实行价格歧视的基本原则是不同市场上的边际收益相等并等于边际成本"},{"key":"E","text":"实行价格歧视的条件之一是必须有可能根据不同的需求价格弹性划分出两组或两组以上的不同购买者（ ）。"}],"answer":["C","D","E"],"explanation":"本题考查价格歧视。一级价格歧视又叫完全价格歧视，是指企业对每一单位都按照消费者所愿意支付的最高价格出售，一级价格歧视下的所有消费者剩余都被卖家占有，选项A错误。二级价格歧视是指按照不同的价格出售不同批量的产量，但是每个购买相同批量产品的购买者支付的价格相同。这就是我们通常说的批量作价，选项B错误。三级价格歧视是指建立在不同的需求价格弹性基础上，对各组购买者规定不同的价格，选项C正确。实施价格歧视的基本条件：（1）必须有可能根据不同的需求价格弹性划分出两组或两组以上的不同购买者。E选项正确。（2）市场必须是能够有效地隔离开的，同一产品不能在不同市场之间流动。企业实施价格歧视的基本原则是，不同市场上的边际收益相等并等于边际成本，选项D正确。故本题选CDE选项。","id":"jichu-0028","bank":"jichu"},{"chapter":"刷章节母题 第四章 市场结构理论 共8题","point":"垄断竞争市场和寡头垄断市场上生产者的行为","type":"multi","stem":"关于垄断竞争市场特征和生产者行为的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"个别企业的需求曲线是条向右下方倾斜的曲线"},{"key":"B","text":"企业的需求曲线也就是行业的需求曲线"},{"key":"C","text":"垄断竞争市场的产量一般低于完全竞争市场的产量"},{"key":"D","text":"企业能在一定程度上控制价格"},{"key":"E","text":"个别企业的需求曲线是一条平行于横轴的水平线"}],"answer":["A","C","D"],"explanation":"本题考查垄断竞争市场上生产者的行为。选项B错误，只有是在完全垄断市场，由于整个行业只有一个生产者，因此企业的需求曲线也就是行业的需求曲线。而在垄断竞争市场，企业的需求曲线不是行业的需求曲线。选项E错误，垄断竞争市场个别企业的需求曲线向右下方倾斜。故本题选ACD选项。","id":"jichu-0029","bank":"jichu"},{"chapter":"刷章节母题 第四章 市场结构理论 共8题","point":"垄断竞争市场和寡头垄断市场上生产者的行为","type":"multi","stem":"关于寡头垄断市场协议价格的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"协议价格制度非常稳定，一旦形成就不会破裂"},{"key":"B","text":"协议价格制一般会受到政府的鼓励"},{"key":"C","text":"它是通过行业中某一占支配地位的企业率先确定价格，其他企业跟随的方式形成的"},{"key":"D","text":"它通过限制各个生产者的产量，使行业边际收益等于行业边际成本"},{"key":"E","text":"生产者或销售者之间共同维持一个协议价格，使得行业净收益最大"}],"answer":["D","E"],"explanation":"本题考查寡头垄断市场上生产者的行为。人选项A错误，协议价格制一般是不稳定的，很难长期存在下去。选项B错误，协议价格制很多国家都是不鼓励的，受到反垄断法律法规的严格禁止。选项C错误，价格领袖制，即行业中某一个占支配地位的企业率先确定价格，其他企业则参照这个价格来制定和调整本企业产品的价格，与其保持一致。选项D、E正确。生产者或销售者之间共同维持一个协议价格，使得行业净收益最大，其方式是通过限制各个生产者的产量，使其行业边际收益等于行业边际成本。故本题选DE选项。","id":"jichu-0030","bank":"jichu"},{"chapter":"刷章节母题 第五章 生产要素市场理论 共6题","point":"生产者使用生产要素的原则","type":"single","stem":"下列关于生产者对生产要素的需求表述错误的是（ ）。","material":"","options":[{"key":"A","text":"生产者对生产要素的需求量很大程度上取决于消费者对产品的需求量"},{"key":"B","text":"生产者对每一种生产要素的需求数量取决于所有生产要素的价格"},{"key":"C","text":"各生产要素之间存在互补性，同时各生产要素之间也存在一定的替代性"},{"key":"D","text":"消费者的需求曲线不会影响生产要素的价格"}],"answer":["D"],"explanation":"本题考查生产者对生产要素的需求。选项A正确，选项D错误，引致需求是指生产者对生产要素的需求量很大程度上取决于消费者对产品的需求量，所以消费者的需求曲线会影响生产要素的价格。选项B、C正确，联合需求，即复合需求是生产者对生产要素的需求具有相互依赖性，各种生产要素要共同发挥作用才能生产最终产品，生产者对每一种生产要素的需求数量取决于所有生产要素的价格，同时各要素之间也存在一定的替代性。故本题选D选项。","id":"jichu-0031","bank":"jichu"},{"chapter":"刷章节母题 第五章 生产要素市场理论 共6题","point":"生产者使用生产要素的原则","type":"single","stem":"（ ）表示增加单位要素投入所带来的成本增量，等于边际物质产品乘以边际成本。（ ）。","material":"","options":[{"key":"A","text":"边际产品价值"},{"key":"B","text":"边际要素成本"},{"key":"C","text":"边际收益产品"},{"key":"D","text":"平均要素成本"}],"answer":["B"],"explanation":"本题考查生产者使用生产要素的原则。，。，边际物质产品（MPP）也称边际产量，表示增加单位要素投入所带来的产量增量。边际收益产品（MRP）表示增加单位要素使用所带来的收益的增量，选项C错误。边际产品价值（VMP）表示每增加一单位的要素投入所增加的价值，选项A错误。边际要素成本（MFC）表示增加单位要素投入所带来的成本增量，等于边际物质产品乘以边际成本，选项B正确。平均要素成本（AFC）表示平均每单位要素投入的成本，选项D错误。故本题选B选项。","id":"jichu-0032","bank":"jichu"},{"chapter":"刷章节母题 第五章 生产要素市场理论 共6题","point":"完全竞争生产者对生产要素的需求","type":"single","stem":"完全竞争厂商的要素需求曲线的形状是（ ）。","material":"","options":[{"key":"A","text":"后弯"},{"key":"B","text":"平行横轴"},{"key":"C","text":"右上倾斜"},{"key":"D","text":"右下倾斜"}],"answer":["D"],"explanation":"本题考查完全竞争生产者的要素需求曲线。，．．，，，。，由于生产者使用要素的原则是MRP=MFC，所以对于完全竞争生产者而言，在每一 给定的市场要素价格下，为了实现利润最大化的要素使用量必须满足MRP=MFC。 即生产者是沿着MRP曲线确定要素使用量，所以MRP=VMP曲线也是完全竞争厂商 的要素需求曲线，向下倾斜。 故本题选D选项。","id":"jichu-0033","bank":"jichu"},{"chapter":"刷章节母题 第五章 生产要素市场理论 共6题","point":"完全竞争生产者对生产要素的需求","type":"single","stem":"在完全竞争要素市场上，生产者边际要素成本曲线、平均要素成本曲线和要素供给曲线的关系是（ ）。","material":"","options":[{"key":"A","text":"边际要素成本曲线与平均要素成本曲线重合，要素供给曲线向右上方倾斜"},{"key":"B","text":"边际要素成本曲线、平均要素成本曲线和要素供给曲线是重合的"},{"key":"C","text":"边际要素成本曲线向右下方倾斜，而平均要素成本曲线和要素供给重合"},{"key":"D","text":"边际要素成本曲线、平均要素成本曲线和要素供给曲线都是U型曲线"}],"answer":["B"],"explanation":"本题考查完全竞争生产者的要素需求曲线。在完全竞争要素市场上，生产者面临的要素供给曲线为水平线，要素价格为常数，所以完全竞争生产者的边际要素成本曲线及平均要素成本曲线和要素供给曲线重合。故本题选B选项。","id":"jichu-0034","bank":"jichu"},{"chapter":"刷章节母题 第五章 生产要素市场理论 共6题","point":"劳动供给曲线和均衡工资的决定","type":"single","stem":"下列关于对投入的说法正确的是（ ）。 ）","material":"","options":[{"key":"A","text":"投入按生产要素分类可分为劳动、资本、土地、企业家才能"},{"key":"B","text":"各种投入要素都可变时，一般是研究企业的短期行为"},{"key":"C","text":"当某种或几种要素不可变时，一般是研究企业的长期行为"},{"key":"D","text":"资本仅可以表现为货币形态"}],"answer":["A"],"explanation":"本题考查生产要素供给的一般分析。、投入按生产要素分类可分为劳动、资本、土地、企业家才能，选项A正确。各种投入要素都可变时，一般是研究企业的长期行为，选项B错误。当某种或几种要素不可变时，一般是研究企业的短期行为，选项C错误。资本可以表现为实物形态和货币形态，选项D错误。人故本题选A选项。","id":"jichu-0035","bank":"jichu"},{"chapter":"刷章节母题 第五章 生产要素市场理论 共6题","point":"劳动供给曲线和均衡工资的决定","type":"multi","stem":"下列关于劳动供给曲线的表述，正确的有（ ）。","material":"","options":[{"key":"A","text":"劳动的供给曲线是后弯曲线"},{"key":"B","text":"劳动供给曲线表明，当工资较低时，提高工资，则劳动供给增加；当工资提高到一定程度时，劳动供给减少"},{"key":"C","text":"当工资低而收入少时，工资上升，其替代效应小于收入效应，消费者的劳动供给会增加"},{"key":"D","text":"当工资提高到一定程度时，消费者相对比较富有，工资增加的替代效应大于收入效应，劳动供给减少"},{"key":"E","text":"土地和资本的供给在短期内是垂直线，而从长期来看是一条后弯曲线"}],"answer":["A","B"],"explanation":"本题考查劳动供给曲线。选项C错误，一般地，当工资低而收入少时，工资上升，其替代效应大于收入效 应，消费者的劳动供给会增加。 选项D错误，当工资提高到一定程度时，消费者相对比较富有，工资增加的替代 效应小于收入效应，劳动供给减少。 选项E错误，由于土地的数量一般不会变化，所以土地的供给曲线是一条垂直 线，资本的供给在短期内也是垂直线，从长期来看是一条后弯曲线。 故本题选AB选项。","id":"jichu-0036","bank":"jichu"},{"chapter":"刷章节母题 第六章 市场失灵和政府的干预 共6题","point":"市场失灵的含义","type":"single","stem":"下列资源配置中，达到帕累托最优的是（ ）。","material":"","options":[{"key":"A","text":"不存在帕累托改进"},{"key":"B","text":"一国的国民收入实现了公平分配"},{"key":"C","text":"社会主体成员的福利同时得到改善"},{"key":"D","text":"实现外部影响内部化"}],"answer":["A"],"explanation":"本题考查帕累托最优状态。帕累托最优状态是不存在帕累托改进的资源配置状态。帕累托最优状态又被称作经济效率。满足帕累托最优状态就是具有经济效率的，不满足帕累托状态就是缺乏经济效率的。故本题选A选项。","id":"jichu-0037","bank":"jichu"},{"chapter":"刷章节母题 第六章 市场失灵和政府的干预 共6题","point":"市场失灵的含义","type":"single","stem":"市场失灵的含义是（ ）。","material":"","options":[{"key":"A","text":"市场机制下不能充分发挥作用而导致的资源配置缺乏效率或资源配置失当的情况"},{"key":"B","text":"由于市场监管规则不同导致的市场保护主义的情况（ ）。"},{"key":"C","text":"由于市场监管规则不同导致的市场分割情况"},{"key":"D","text":"生产要素市场不够发达的情况"}],"answer":["A"],"explanation":"本题考查市场失灵的含义。市场失灵就是指由于市场机制不能充分地发挥作用而导致的资源配置缺乏效率或资源配置失当的情况。故本题选A选项。","id":"jichu-0038","bank":"jichu"},{"chapter":"刷章节母题 第六章 市场失灵和政府的干预 共6题","point":"市场失灵的原因。","type":"multi","stem":"以下属于市场失灵的原因的有（ ）。人","material":"","options":[{"key":"A","text":"断"},{"key":"B","text":"公共物品"},{"key":"C","text":"信息完全意包"},{"key":"D","text":"外部性"},{"key":"E","text":"内部性"}],"answer":["A","B","D"],"explanation":"本题考查市场失灵的原因。市场失灵的原因包括：垄断、外部性、信息不对称、公共物品，选项A、B、D正确。信息完全是不会导致市场失灵的，选项C错误；选项E错误，内部性属于超纲内容，内部性是指由交易一方所经受的但没有在交易条款中说明的交易的成本和效益。这里的成本即指负内部性或内部不经济，而效益则是指正内部性或内部经济。 故本题选ABD选项。","id":"jichu-0039","bank":"jichu"},{"chapter":"刷章节母题 第六章 市场失灵和政府的干预 共6题","point":"市场失灵的原因。","type":"single","stem":"某造纸厂在其生产过程中，向附近的河流排放了大量的污水，并因此导致了附近粮食产量大幅度下降，但该厂又不对附近种粮农民进行相应的赔偿。这种现象通常被称为（ ）。","material":"","options":[{"key":"A","text":"生产的外部经济"},{"key":"B","text":"生产的外部不经济"},{"key":"C","text":"消费的外部经济"},{"key":"D","text":"消费的外部不经济"}],"answer":["B"],"explanation":"本题考查外部不经济。所谓外部不经济就是某人或某企业的经济活动会给社会上其他人或其他企业带来损害，但该人或该企业却不必为这种损害进行补偿。如果这种经济活动的主体是生产者则被称为生产的外部不经济。故本题选B选项。","id":"jichu-0040","bank":"jichu"},{"chapter":"刷章节母题 第六章 市场失灵和政府的干预 共6题","point":"政府对市场的干预","type":"single","stem":"科斯定理的含义是（ ）。","material":"","options":[{"key":"A","text":"只要财产权是明确的，那么无论在开始时将财产权赋予谁，市场均衡的最终结果都是有效的，就可以实现资源的帕累托最优。"},{"key":"B","text":"只要财产权是明确的，并且交易成本为零，或者很小，那么无论在开始时将财产权赋予谁，市场均衡的最终结果都是有效率的，就可以实现资源配置的帕累托最优"},{"key":"C","text":"只要交易成本为零，或者很小，市场均衡的最终结果都是有效率的，就可以实现资源配置的帕累托最优"},{"key":"D","text":"不论财产权是否明确，只要交易成本为零，或者很小，市场均衡的最终结果都是有可以实现资源配置的帕累托最优（ ）。"}],"answer":["B"],"explanation":"本题考查政府对市场的干预。关于科斯定理，通常的说法是：只要财产权是明确的，并且交易成本为零，或者很小，那么无论在开始时将财产权赋予谁，市场均衡的最终结果都是有效率的，就可以实现资源配置的帕累托最优。进一步看，还可以认为，一且考虑到交易成本，产权的初始界定对于经济运行的效率就会产生十分重要的作用。从而可以引申出一个重要结论：不同的产权制度，会导致不同的资源配置效率，包A/生成选项A、C、D错误。故本题选B选项。","id":"jichu-0041","bank":"jichu"},{"chapter":"刷章节母题 第六章 市场失灵和政府的干预 共6题","point":"政府对市场的干预","type":"multi","stem":"为了克服垄断导致的市场失灵，政府可以采取的措施有（ ）。","material":"","options":[{"key":"A","text":"制定《反不正当竞争法》和《反垄断法》"},{"key":"B","text":"对商品的说明、质量标准和广告做出具体的法律规定"},{"key":"C","text":"规定限价"},{"key":"D","text":"规定利润率"},{"key":"E","text":"征收适度的税费"}],"answer":["A","C","D"],"explanation":"本题考查政府对市场的干预。，选项A正确，政府可以通过法律手段来限制垄断和反对不正当竞争，比如制定《反不正当竞争法》《反垄断法》。选项B错误，这是解决因信息不对称所造成的市场失灵的手段。选项C、D正确，政府对垄断进行干预的另一种手段是对垄断行业进行公共管制，主要是对垄断行业的产品或服务的价格进行管制或规定限价，或规定利润率。选项E错误，征收适度的税费是消除外部性的做法。故本题选ACD选项。","id":"jichu-0042","bank":"jichu"},{"chapter":"刷章节母题 第七章 国民收入核算和简单的国民收入决定 共8题","point":"国民收入核算","type":"single","stem":"关于国内生产总值的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"国内生产总值又称为国民总收入"},{"key":"B","text":"国内生产总值的计算方法仅包括收入法和支出法"},{"key":"C","text":"国内生产总值仅具有价值形态和收入形态"},{"key":"D","text":"国内生产总值是目前世界各国（或地区）普遍使用的衡量经济总量的基本指标"}],"answer":["D"],"explanation":"本题考查国民生产总值的含义。国内生产总值不同于国民总收入。国民生产总值（国民总收入）=国内生产总值+国民的净要素收入，国民总收入是一个收入概念，而国内生产总值是一个生产概念，选项A错误。国内生产总值的计算方法包括生产法、收入法和支出法，选项B错误。国内生产总值有三种形态，即价值形态、收入形态和产品形态，选项C错误。故本题选D选项。","id":"jichu-0043","bank":"jichu"},{"chapter":"刷章节母题 第七章 国民收入核算和简单的国民收入决定 共8题","point":"国民收入核算","type":"multi","stem":"下列关于国内生产总值收入法与支出法的说法中正确的有（ ）。","material":"","options":[{"key":"A","text":"收入法是从社会最终使用的角度计算的国内生产总值（ ）。"},{"key":"B","text":"运用收入法核算国内生产总值，可以计算资本形成率和最终消费率"},{"key":"C","text":"支出法下的国内生产总值由最终消费、资本形成总额、净出口三部分组成"},{"key":"D","text":"收入法下的国内生产总值等于所有常住单位收入增加值之和"},{"key":"E","text":"收入法增加值由劳动者报酬、固定资产折旧、生产税净额、营业盈余四部分组"}],"answer":["C","D","E"],"explanation":"本题考查国内生产总值的计算方法。支出法是从社会最终使用的角度计算的国内生产总值，选项A错误。运用支出法核算国内生产总值，可以计算资本形成率和最终消费率，选项B错误。支出法下的国内生产总值=最终消费+资本形成总额+净出口，选项C正确。收入法下的国内生产总值等于所有常住单位收入增加值之和，选项D正确。收入法增加值=劳动者报酬+固定资产折旧+生产税净额+营业盈余，选项E正确。故本题选CDE选项。 ；提醒； 出去的这些产品价值加进去。 支出法中核算的产品最终使用去向：（1）最终消费；（2）资本形成总额；（3）用 于出口。将一定时期内这三项最终使用价值相加，就得到支出法的GDP。 “用于出口”就是公式中的净出口，支出法衡量的是产品最终去向，所以要用出 一进口，而不是进口－出口。","id":"jichu-0044","bank":"jichu"},{"chapter":"刷章节母题 第七章 国民收入核算和简单的国民收入决定 共8题","point":"宏观经济均衡的基本模型","type":"single","stem":"在一个两部门经济中，已知消费函数为C=200+0.5Y，投资I=500亿元，求均衡国民收入等于（ ）亿元。","material":"","options":[{"key":"A","text":"1400"},{"key":"B","text":"600"},{"key":"C","text":"2800"},{"key":"D","text":"1200"}],"answer":["A"],"explanation":"本题考查简单的国民收入决定。在两部门经济中，从支出的角度来看，国内生产总值等于总支出，即消费支出的总和，所以有GDP=Y=C+I，将题目所给的数据代入，则有：Y=200+0.5Y+500，移项得0.5Y=700，Y=1400。故本题选A选项。","id":"jichu-0045","bank":"jichu"},{"chapter":"刷章节母题 第七章 国民收入核算和简单的国民收入决定 共8题","point":"宏观经济均衡的基本模型","type":"single","stem":"（ ）表示了整个社会的储蓄（私人储蓄和政府储蓄之和）和整个社会的投资的恒等关系。","material":"","options":[{"key":"A","text":"I=S"},{"key":"B","text":"I=S+ （M-x）"},{"key":"C","text":"I=S+（T-G） + （M-X）"},{"key":"D","text":"I=S+ （T-G）"}],"answer":["D"],"explanation":"本题考查三部门经济中的储蓄投资恒等式。I=S+（T-G)，其中（T-G）可以看作是政府部门的储蓄，S为家庭储蓄和企业储蓄之和，称为私人储蓄。这样，S+（T-G）可以表示整个社会的储蓄。因此，公式I=S+（T-G），表示整个社会的储蓄（私人储蓄和政府储蓄之和）和整个社会的投资的恒等关系。故本题选D选项。","id":"jichu-0046","bank":"jichu"},{"chapter":"刷章节母题 第七章 国民收入核算和简单的国民收入决定 共8题","point":"消费、储蓄和投资","type":"multi","stem":"当消费函数为C=100+0.8Y（其中C表示消费，Y表示收入）时，下列结论正确的有（ ）。","material":"","options":[{"key":"A","text":"边际储蓄倾向为0.2"},{"key":"B","text":"当Y=1000时，消费支出为900"},{"key":"C","text":"投资乘数为0.5"},{"key":"D","text":"当消费支出为900时，储蓄为100"},{"key":"E","text":"边际消费倾向为0.8"}],"answer":["A","B","D","E"],"explanation":"本题考查消费函数。当Y=1000时，C=100+0.8×1000=900，选项B正确。β 为边际消费倾向，为0.8，边际储蓄倾向s=1-β=0.2，选项A、E正确。投资乘数k=1／（1-β）=1/s=5，选项C错误。当C=900时，Y=1000，则储蓄S=1000-900=100，选项D正确。故本题选ABDE选项。","id":"jichu-0047","bank":"jichu"},{"chapter":"刷章节母题 第七章 国民收入核算和简单的国民收入决定 共8题","point":"消费、储蓄和投资","type":"multi","stem":"下列有关投资函数与投资乘数的说法中，正确的有（ ）。","material":"","options":[{"key":"A","text":"投资既包括购置厂房、设备等物质资本的活动，也包括金融投资活动"},{"key":"B","text":"投资是利率的减函数"},{"key":"C","text":"凯恩斯认为，投资的成本取决于实际利率，实际利率越低，投资量越大"},{"key":"D","text":"决定投资的主要因素有实际利率、预期收益率和投资风险等，预期的通货膨胀率和折旧等也在一定程度上影响投资"},{"key":"E","text":"投资乘数等于边际消费倾向的倒数"}],"answer":["B","C","D"],"explanation":"本题考查投资函数和投资乘数。投资是购置物质资本（如厂房、设备和存货，以及住房建筑物）的活动，即形成固定资产的活动。一般不包括金融投资在内，选项A错误。投资是利率的减函数，选项B正确。凯恩斯认为，实际利率越低，投资量越大。投资的成本取决于实际利率，选项C正确。决定投资的主要因素有实际利率、预期收益率和投资风险等，预期的通货膨胀率和折旧等也在一定程度上影响投资，选项D正确。投资乘数等于边际储蓄倾向（或1一边际消费倾向）的倒数，选项E错误。故本题选BCD选项。","id":"jichu-0048","bank":"jichu"},{"chapter":"刷章节母题 第七章 国民收入核算和简单的国民收入决定 共8题","point":"总需求和总供给","type":"single","stem":"由于价格总水平的变动引起居民收入及财富的实际购买力的反向变动，从而导致总需求反向变动的现象称为（ ）。","material":"","options":[{"key":"A","text":"利率效应"},{"key":"B","text":"出口效应"},{"key":"C","text":"财富效应"},{"key":"D","text":"总效用"}],"answer":["C"],"explanation":"本题考查总需求。利率效应是指由价格总水平变动引起利率变化，利率与投资、消费及总需求的反 方向变化的现象，选项A错误。 出口效应是指由于价格总水平通过汇率变动影响出口需求的变化与总需求呈反 方向变化的现象，选项B错误。 总效用不属于总需求的内容，而是商品价格产生的两种效应（替代效应、收入效 应）的加总，选项D错误。 财富效应是指由于价格总水平的变动引起居民收入及财富的实际购买力反方向 变动，从而导致总需求反方向变动的现象，选项C正确。 故本题选C选项。","id":"jichu-0049","bank":"jichu"},{"chapter":"刷章节母题 第七章 国民收入核算和简单的国民收入决定 共8题","point":"总需求和总供给","type":"single","stem":"总供给是指在其他条件不变的情况下，一定时期内在一定价格水平上，一个国家或地区的生产者愿意向市场提供的产品总量。下列关于总供给的表述错误的是","material":"","options":[{"key":"A","text":"决定总供给的基本因素就是价格与成本"},{"key":"B","text":"如果企业对未来利润的预期是下降的，企业就会减少生产，从而使总供给减少"},{"key":"C","text":"总供给曲线是条向右下方倾斜的曲线"},{"key":"D","text":"长期总供给只取决于劳动、资本与技术，以及经济体制等因素"}],"answer":["C"],"explanation":"本题考查总供给。（选项A正确，决定总供给的基本因素是价格和成本。选项B正确，决定总供给的其他因素：技术进步、工资水平变动、能源及原材料价格变动等。另外预期也是一个重要影响因素，如果企业对未来利润的预期是下降的，企业就会减少生产，从而使总供给减少。选项C错误，短期总供给曲线一般应是一条向右上方倾斜的曲线。选项D正确，长期总供给曲线是一条垂直于横轴的直线。从长期看，总供给变动与价格总水平无关，长期总供给只取决于劳动、资本与技术，以及经济体制等因素。故本题选C选项。","id":"jichu-0050","bank":"jichu"},{"chapter":"刷章节母题 第八章 经济增长和经济发展理论 共6题","point":"经济增长","type":"single","stem":".以下对经济增长和经济发展关系的表述中，正确的是（ ）。","material":"","options":[{"key":"A","text":"对一国经济增长速度的度量，通常用经济增长率来表示"},{"key":"B","text":"经济发展是经济增长的基础"},{"key":"C","text":"用不变价格计算的国内生产总值，可以反映一个国家或地区的经济发展规模"},{"key":"D","text":"经济增长的含义比经济发展广泛"}],"answer":["A"],"explanation":"本题考查经济增长的含义及经济增长与经济发展的区别。选项A正确，对一国经济增长速度的度量，通常用经济增长率来表示。选项B错误，经济增长是经济发展的基础。选项C错误，按不变价格计算的GDP，可以用来计算经济增长速度。选项D错误，经济发展比经济增长的含义更广。故本题选A选项。","id":"jichu-0051","bank":"jichu"},{"chapter":"刷章节母题 第八章 经济增长和经济发展理论 共6题","point":"经济增长","type":"multi","stem":"资本的效率也就是所谓的投资效益，一般用（ ）表示。","material":"","options":[{"key":"A","text":"单位资本投入数量所能产生的国内生产总值。"},{"key":"B","text":"国内生产总值与资本总额的比率（ ）。"},{"key":"C","text":"生产单位国内生产总值需要投入的资本数量"},{"key":"D","text":"单位劳动时间所生产的国内生产总值来计算"},{"key":"E","text":"一定时间内每个劳动者所生产的国内生产总值来计算"}],"answer":["A","B","C"],"explanation":"本题考查决定经济增长的基本因素。资本的效率也就是所谓的投资效益，是指单位资本投入数量所能产生的国内生产总值。一般用国内生产总值与资本总额的比率来表示，也可以用生产单位国内生产总值需要投入的资本数量来表示。故本题选ABC选项。","id":"jichu-0052","bank":"jichu"},{"chapter":"刷章节母题 第八章 经济增长和经济发展理论 共6题","point":"经济周期和经济波动","type":"single","stem":"按照周期波动时间的长短，经济周期分为长周期、中周期和短周期，在现实生活中，对经济运行影响较大且较为明显的是（)。","material":"","options":[{"key":"A","text":"长周期"},{"key":"B","text":"短周期"},{"key":"C","text":"中周期"},{"key":"D","text":"小循环"}],"answer":["C"],"explanation":"本题考查经济周期和经济波动的类型。，按照周期波动的时间长短，经济的周期性波动主要有三种类型，即长周期、中周期和短周期。在现实生活中，对经济运行影响较大且较为明显的是中周期，人们最关注的也是中周期。 故本题选C选项。","id":"jichu-0053","bank":"jichu"},{"chapter":"刷章节母题 第八章 经济增长和经济发展理论 共6题","point":"经济周期和经济波动","type":"multi","stem":"导致经济运行出现周期性波动的因素包括（ ）。","material":"","options":[{"key":"A","text":"投资率的变动"},{"key":"B","text":"消费需求的波动.技术进步的状况"},{"key":"C","text":"大规模疫情等因素的冲击"},{"key":"D","text":"财政收入的增加"}],"answer":["A","B","C","D"],"explanation":"本题考查导致经济波动的主要因素。经济波动的主要原因：（1）投资率的变动；（2）消费需求的波动；（3）技术进步的状况；（4）预期的变化；（5）国际经济因素的冲击；（6）大规模疫情等因素的冲击。故本题选ABCD选项。","id":"jichu-0054","bank":"jichu"},{"chapter":"刷章节母题 第八章 经济增长和经济发展理论 共6题","point":"经济发展","type":"multi","stem":"经济发展不仅包括经济增长，而且还包括经济结构和社会结构的变化，这些变化包括（ ）。","material":"","options":[{"key":"A","text":"产业结构的不断优化"},{"key":"B","text":"城市化进程的逐步推进"},{"key":"C","text":"广大居民生活水平的持续提高"},{"key":"D","text":"国民收入分配状况的逐步改善"},{"key":"E","text":"财政收入不断提高"}],"answer":["A","B","C","D"],"explanation":"本题考查经济发展的基本理论。经济发展不仅包括经济增长，而且还包括经济结构和社会结构的变化。这些变化包括： （1）产业结构不断优化。 （2）城市化进程逐步推进。 （3）广大居民生活水平持续提高。 （4）国民收入分配状况逐步改善。 故本题选ABCD选项。","id":"jichu-0055","bank":"jichu"},{"chapter":"刷章节母题 第八章 经济增长和经济发展理论 共6题","point":"经济发展","type":"single","stem":"关于我国经济社会发展的基本理念，下列说法错误的是（ ）。","material":"","options":[{"key":"A","text":"创新是引领发展的第一动力"},{"key":"B","text":"绿色是持续健康发展的内在要求"},{"key":"C","text":"开放是国家繁荣发展的必由之路"},{"key":"D","text":"共享是中国特色社会主义的本质要求"}],"answer":["B"],"explanation":"本题考查新发展理念。“十三五”时期我国经济社会发展的基本理念有：创新、协调、绿色、开放、共享。创新是引领发展的第一动力，选项A正确；协调是持续健康发展的内在要求，选项B错误；绿色是永续发展的必要条件和人民对美好生活追求的重要体现；开放是国家繁荣发展的必由之路，选项C正确；共享是中国特色社会主义的本质要求，选项D正确。故本题选B选项。（","id":"jichu-0056","bank":"jichu"},{"chapter":"刷章节母题 第九章 价格总水平和就业、失业 共8题","point":"价格总水平","type":"single","stem":"下列说法中，不属于发达国家或地区度量价格总水平方法的是（ ）。","material":"","options":[{"key":"A","text":"编制消费者价格指数"},{"key":"B","text":"编制批发价格指数"},{"key":"C","text":"计算国内生产总值缩减指数"},{"key":"D","text":"编制各种成本指数"}],"answer":["D"],"explanation":"本题考查价格总水平的含义和度量。选项A、B、C不符合题意，目前，世界各国或地区度量价格总水平的方法主要有两种：一是编制各种价格指数，如居民消费价格指数（又称消费者价格指数）、批发价格指数等；二是计算国内生产总值缩减指数。选项D符合题意，在发达国家，有特定用途的成本指数（如建筑成本指数、劳动力成本指数等)，但它们主要用于行业成本分析，不是宏观经济层面度量整体价格总水平的主流指标。故本题选D选项。","id":"jichu-0057","bank":"jichu"},{"chapter":"刷章节母题 第九章 价格总水平和就业、失业 共8题","point":"价格总水平","type":"single","stem":"下列各项中不属于决定价格总水平变动的主要因素是（ )。","material":"","options":[{"key":"A","text":"货币供给量、总产出"},{"key":"B","text":"货币流通速度"},{"key":"C","text":"总需求和总供给"},{"key":"D","text":"产业结构"}],"answer":["D"],"explanation":"本题考查决定价格总水平变动的因素。决定价格总水平变动的因素包括货币供给量、货币流通速度、总产出、总需求和总供给。故本题选D选项。","id":"jichu-0058","bank":"jichu"},{"chapter":"刷章节母题 第九章 价格总水平和就业、失业 共8题","point":"就业与失业","type":"multi","stem":"关于就业和失业的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"失业是指有劳动能力并愿意就业但在目前没有从事有报酬或者收入的工作的现象"},{"key":"B","text":"努力扩大就业减少失业，是提高人民生活水平的重要途径"},{"key":"C","text":"促进经济增长是增加就业的主要途径"},{"key":"D","text":"如果第三产业在GDP中所占比例较大，则就业弹性较高"},{"key":"E","text":"解决自愿失业是宏观经济调控的重点"}],"answer":["A","B","C","D"],"explanation":"本题考查就业与失业。解决非自愿失业是宏观经济调控的重点，选项E错误。故本题选ABCD选项。","id":"jichu-0059","bank":"jichu"},{"chapter":"刷章节母题 第九章 价格总水平和就业、失业 共8题","point":"就业与失业","type":"single","stem":"根据失业的分类，因总需求不足而减少劳动力派生需求所导致的失业是（ ）。","material":"","options":[{"key":"A","text":"周期性失业"},{"key":"B","text":"自愿失业"},{"key":"C","text":"摩擦性失业"},{"key":"D","text":"强制失业"}],"answer":["A"],"explanation":"本题考查失业的类型。因总需求不足而导致的失业称为需求不足型失业，也叫周期性失业、非自愿性失业。故本题选A选项。","id":"jichu-0060","bank":"jichu"},{"chapter":"刷章节母题 第九章 价格总水平和就业、失业 共8题","point":"失业和经济增长及价格总水平的相互关系","type":"multi","stem":"关于奥肯定律含义的说法，错误的有（ ）。","material":"","options":[{"key":"A","text":"奥肯定律揭示了欧盟的某个时期经济增长和财政支出之间的相关关系"},{"key":"B","text":"奥肯定律揭示了发展中经济体经济增长和资本跨境流动之间的关系"},{"key":"C","text":"奥肯定律的政策含义是政府应当把促进经济增长作为增加就业或降低失业的主要途径"},{"key":"D","text":"奥肯定律揭示了美国在某个时期产出与失业之间的一个数量相关关系"},{"key":"E","text":"奥肯定律所提出的通货膨胀和失业之间的数量关系具有普遍适用性"}],"answer":["A","B","E"],"explanation":"本题考查奥肯定律。美国经济学家阿瑟·奥肯在20世纪60年代初提出了美国的产出与失业之间的一个数量相关关系，即奥肯定律或奥肯法则。选项E错误，奥肯定律所提出的经济增长和失业之间的具体数量相关关系可能会随着时代的变化而有所不同，在不同的国家或地区可能差别更大。但是，这一定律具有重要的政策含义，表明了在经济增长和就业之间存在一定的正相关关系。其政策含义就是，政府应当把促进经济增长作为增加就业或降低失业的主要途径。选项A、B错误，应该为经济增长和失业之间的具体数量相关关系。故本题选ABE选项。","id":"jichu-0061","bank":"jichu"},{"chapter":"刷章节母题 第九章 价格总水平和就业、失业 共8题","point":"宏观经济治理的内涵与特征（ ）。","type":"single","stem":"下列对健全宏观经济治理体系措施表述错误的是（ ）。","material":"","options":[{"key":"A","text":"要充分发挥国家发展规划的战略导向作用"},{"key":"B","text":"要进一步完善财政政策和货币政策"},{"key":"C","text":"必须健全就业、产业、投资、消费、环保、区域等政策紧密配合的机制"},{"key":"D","text":"发挥筹资政策对优化供给结构的关键性作用，补短板、锻长板，促进产业结构调整。"}],"answer":["D"],"explanation":"本题考查宏观经济治理的内涵与特征。注意题干问的是“表述错误的是”，选项A、B、C均正确，选项D错误，应是发挥投资政策对优化供给结构的关键性作用，补短板、锻长板，促进产业结构调整。故本题选D选项。","id":"jichu-0062","bank":"jichu"},{"chapter":"刷章节母题 第九章 价格总水平和就业、失业 共8题","point":"宏观经济治理的内涵与特征（ ）。","type":"multi","stem":"《“十四五”规划纲要》对宏观经济治理的内涵作出了明确规定，下列选项中符合的是（ ）。","material":"","options":[{"key":"A","text":"坚持全国一盘棋，调动各方面积极性，集中力量办大事"},{"key":"B","text":"发挥投资政策对优化供给结构的关键性作用，补短板、锻长板，促进产业结构调整"},{"key":"C","text":"以国家发展规划为战略导向"},{"key":"D","text":"就业、产业、投资、消费、环保、区域等政策紧密配合"},{"key":"E","text":"以财政政策和货币政策为主要手段"}],"answer":["C","D","E"],"explanation":"本题考查宏观经济治理的内涵与特征。选项C、D、E正确，《“十四五”规划纲要》对宏观经济治理的内涵作出了明确规 定，即“健全以国家发展规划为战略导向，以财政政策和货币政策为主要手段， 就业、产业、投资、消费、环保、区域等政策紧密配合，目标优化、分工合理、 高效协同的宏观经济治理体系”。，..。 注意选的是《“十四五”规划纲要》对宏观经济治理的内涵，选项A、B为健全宏 观经济治理体系的具体做法，不符合题意。 故本题选CDE选项。","id":"jichu-0063","bank":"jichu"},{"chapter":"刷章节母题 第十章 国际贸易理论和政策 共6题","point":"国际贸易理论","type":"single","stem":"经济学家亚当·斯密提出的国际贸易理论是（ ）。","material":"","options":[{"key":"A","text":"绝对优势理论"},{"key":"B","text":"要素赋理论"},{"key":"C","text":"比较优势理论"},{"key":"D","text":"规模经济贸易理论"}],"answer":["A"],"explanation":"本题考查绝对优势理论。绝对优势理论是英国经济学家亚当·斯密在18世纪提出的。故本题选A选项。","id":"jichu-0064","bank":"jichu"},{"chapter":"刷章节母题 第十章 国际贸易理论和政策 共6题","point":"国际贸易理论","type":"multi","stem":"影响一国出口贸易的因素主要有（ ）。","material":"","options":[{"key":"A","text":"经济总量和总产出水平"},{"key":"B","text":"汇率水平"},{"key":"C","text":"生产能力和技术水平"},{"key":"D","text":"自然资源的丰裕程度。"},{"key":"E","text":"国际市场需求水平和需求结构（ ）。"}],"answer":["B","C","D","E"],"explanation":"本题考查影响一国出口贸易的因素。选项B、C、D、E正确，影响一国出口贸易的因素主要有：（1）自然资源的丰裕程度；（2）生产能力和技术水平的高低；（3）汇率水平的高低；（4）一国出口贸易水平的高低，不仅取决于本国的经济状况，还受国际市场需求水平和需求结构变动的影响。选项A错误，经济总量和总产出水平是影响一国进口贸易的因素。故本题选BCDE选项。","id":"jichu-0065","bank":"jichu"},{"chapter":"刷章节母题 第十章 国际贸易理论和政策 共6题","point":"国际贸易政策 人","type":"multi","stem":"政府对出口贸易进行干预的手段主要有（ ）。","material":"","options":[{"key":"A","text":"实行利率管制"},{"key":"B","text":"实行出口信贷意包A成"},{"key":"C","text":"出口退税"},{"key":"D","text":"调整汇率"},{"key":"E","text":"对还债能力进行控制"}],"answer":["B","C"],"explanation":"本题考查政府对国际贸易干预的目的。政府干预出口贸易以刺激出口增加的主要措施是出口补贴。出口补贴分为直接补贴和间接补贴两种。直接补贴是政府直接以现金形式弥补出口企业国际市场价格与本国国内市场价格的差价；间接补贴是对出口企业在出口商品时给予财政上的优惠待遇，如出口退税、出口信贷等（选项B、C正确）。 实行出口补贴的目的是降低本国出口产品的价格，提高其在国际市场上的竞争力， 扩大出口。 故本题选BC选项。","id":"jichu-0066","bank":"jichu"},{"chapter":"刷章节母题 第十章 国际贸易理论和政策 共6题","point":"国际贸易政策 人","type":"single","stem":"根据《中华人民共和国反不正当竞争法》，下列情形中，属于低价倾销行为的是（ ）。","material":"","options":[{"key":"A","text":"销售鲜活商品"},{"key":"B","text":"为独占市场而以低于成本的价格销售商品"},{"key":"C","text":"季节性降价"},{"key":"D","text":"歇业降价商品"}],"answer":["B"],"explanation":"本题考查低价销售行为。选项B符合题意。选项A、C、D不符合题意，下列4种情况不属于低价倾销行为：（1）销售鲜活商品：（2）处理有效期限即将到期的商品或者其他积压的商品；（4）因清偿债务、转产、歇业降价销售商品。故本题选B选项。·（ ）。考点 建设更高水平对外开放新体制☆","id":"jichu-0067","bank":"jichu"},{"chapter":"刷章节母题 第十章 国际贸易理论和政策 共6题","point":"国际贸易政策 人","type":"multi","stem":"下列关于建设高水平对外开放新体制的举措，正确的是（ ）。","material":"","options":[{"key":"A","text":"通过制度和规则建设，实施更大范围、更宽领域、更高层次的全面开放"},{"key":"B","text":"通过制度和规则建设，实施大范围、大领域、多层次的局部开放"},{"key":"C","text":"重视国家经济安全，处理好利用外资和国家安全的关系（ ）。"},{"key":"D","text":"重视国家经济安全，处理好利用内外资和国家安全的关系（ ）。"},{"key":"E","text":"我国的“放管服”改革，改善营商环境、建设外商外资制度"}],"answer":["A","C","E"],"explanation":"本题考查建设更高水平对外开放新体制。人建设高水平对外开放新体制的举措主要有：（1）通过制度和规则建设，实施更大范围、更宽领域、更高层次的全面开放，选项A正确、选项B错误；近年来，我国加大“放管服”改革，不断改善营商环境，在外商外资制度建设方面迈出了新步伐，选项E正确。（2）在扩大对外开放的进程中进一步重视国家经济安全，处理好利用外资和国家安全的关系，选项C正确、选项D错误。故本题选ACE选项。","id":"jichu-0068","bank":"jichu"},{"chapter":"刷章节母题 第十章 国际贸易理论和政策 共6题","point":"国际贸易政策 人","type":"single","stem":"下列关于建设高水平对外开放新体制的说法错误的是（ ）。","material":"","options":[{"key":"A","text":"坚持对外开放的基本国策"},{"key":"B","text":"坚持走出去和引进来战略目标"},{"key":"C","text":"打通国内国际两个市场"},{"key":"D","text":"在构建双循环新发展格局中实现更高水平的对外开放"}],"answer":["B"],"explanation":"本题考查建设更高水平对外开放新体制。建设高水平对外开放新体制的内容：（1）坚持对外开放的基本国策；A正确。（2）打通国内国际两个市场，高效利用国内国际两种资源，促进国内国际要素资源有序自由流动、全球高效配置；C正确。（3）在构建双循环新发展格局中实现更高水平的对外开放，并把它作为双循环新发展格局的重要内容。D正确。B项不属于建设高水平对外开放新体制的内容，本题为反选题。故本题选B选项。","id":"jichu-0069","bank":"jichu"},{"chapter":"刷章节母题 第十一章 公共物品与财政职能 共6题","point":"公共物品的定义及其融资与生产","type":"multi","stem":"下列关于公共物品的表述正确的有（ ）。","material":"","options":[{"key":"A","text":"公共物品的需求显示是通过自愿的市场交易实现的"},{"key":"B","text":"公共物品的非竞争性是主要特征，是指增加一个人消费的边际供给成本为零，强调了集体提供公共物品的潜在收益"},{"key":"C","text":"公共物品的非排他性指出了通过市场机制提供公共物品的潜在困难"},{"key":"D","text":"政府融资的缺点是难以满足社会成员对公共物品的多样化需求"},{"key":"E","text":"合同外包是公共服务提供私有化的表现"}],"answer":["B","C","D","E"],"explanation":"本题考查公共物品的定义及其融资与生产。公共物品的需求显示是通过强制性的政治交易实现的，选项A错误。公共物品的两个特征中，非竞争性是主要特征，指的是某种公共物品一旦被提供，增加一个人的消费并不增加任何额外成本，也就是增加一个人消费的边际供给成本为零。这一特征强调了集体提供公共物品的潜在收益，选项B正确。公共物品的非排他性指的是一种公共物品一旦被提供，要排除一个额外的消费者在技术上不可行，或者尽管技术上排他是可行的，但这样做的成本过高。这一特征指出了通过市场机制提供公共物品的潜在困难，选项C正确。政府融资的缺点是难以满足社会成员对公共物品的多样化需求，选项D正确。在合同外包中，私人签约者可能是营利性机构，也可能是非营利性机构，不论其性质如何，合同外包都是公共服务提供私有化的表现，选项E正确。故本题选BCDE选项。","id":"jichu-0070","bank":"jichu"},{"chapter":"刷章节母题 第十一章 公共物品与财政职能 共6题","point":"公共物品的定义及其融资与生产","type":"single","stem":"可能导致公共物品供给的数量不足和结构不平衡的公共物品融资方式是（ ）。","material":"","options":[{"key":"A","text":"政府融资"},{"key":"B","text":"私人融资"},{"key":"C","text":"联合融资"},{"key":"D","text":"强制融资"}],"answer":["B"],"explanation":"本题考查公共物品的融资与生产。私人融资的缺点是可能导致公共物品供给的数量不足和结构不平衡，选项B正确。包A住成政府融资（强制融资）的缺点是难以满足社会成员对公共物品的多样化需求，选项A、D错误。联合融资是公共物品在一定情况下，由私人来提供是可能的，但多数情况下，应在私人融资和公共融资之间作出分工。对于政府来说，通过价格机制激励私人自愿提供公共物品，而不是亲自来提供，则是最为理想的。常见的手段是政府以财政补贴和税收优惠等方式，鼓励私人机构提供公共物品，选项C错误。故本题选B选项。","id":"jichu-0071","bank":"jichu"},{"chapter":"刷章节母题 第十一章 公共物品与财政职能 共6题","point":"市场与政府的经济活动范围","type":"multi","stem":"关于市场系统中主体的说法错误的有（ ）。","material":"","options":[{"key":"A","text":"市场系统是由居民和企业两个相对独立的主体组成的"},{"key":"B","text":"居民的基本目标是满足需要和效用水平最大化"},{"key":"C","text":"居民为市场提供劳动力、资本和土地等生产要素"},{"key":"D","text":"企业是商品生产和商品交换的基本单位"},{"key":"E","text":"企业的基本目标是满足社会公共需要"}],"answer":["A","E"],"explanation":"本题考查市场和市场效率。市场系统是由居民、企业和政府三个相对独立的主体组成的，选项A错误。居民（或家庭）是社会的基本细胞，也是社会生活的基本单位。居民为市场提供劳动力、资本和土地等生产要素，并通过提供生产要素获取收入，而后用收入到市场上购买生活消费品或从事投资，选项C正确。居民的基本目标是满足需要和效用水平的最大化，选项B正确。企业是商品生产和商品交换的基本单位，选项D正确。企业的基本目标是利润最大化并实现扩大再生产，选项E错误。故本题选AE选项。","id":"jichu-0072","bank":"jichu"},{"chapter":"刷章节母题 第十一章 公共物品与财政职能 共6题","point":"市场与政府的经济活动范围","type":"multi","stem":"关于市场与政府的经济活动范围说法正确的有（ ）。","material":"","options":[{"key":"A","text":"市场系统是由居民、企业和政府三个相对独立的主体组成的"},{"key":"B","text":"企业的基本目标是满足需要和效用水平的最大化"},{"key":"C","text":"市场是具有效率的商品交易机制"},{"key":"D","text":"市场机制的基本规律就是价值规律"},{"key":"E","text":"政府经济活动范围应主要集中于提供公共物品或服务、矫正外部性、维持有效竞争、调节收入分配和稳定经济"}],"answer":["A","C","E"],"explanation":"本题考查政府经济活动范围。市场系统是由居民、企业和政府三个相对独立的主体组成的，选项A正确。居民的基本目标是满足需要和效用水平的最大化。企业的基本目标是利润最大化并实现扩大再生产，选项B错误。市场是商品交易的场所，是在无数个买者和卖者的相互作用下形成的商品交易机制，并且是具有效率的商品交易机制，选项C正确。市场机制的基本规律就是供求规律：供给大于需求，价格下降，库存增加，生产低迷；需求大于供给，价格上涨，库存减少，生产增长；通过价格和产量不断波动，达到供给和需求的平衡，选项D错误。政府经济活动范围应主要集中于：提供公共物品或服务；矫正外部性；维持有效竞争；调节收入分配；稳定经济，选项E正确。故本题选ACE选项。","id":"jichu-0073","bank":"jichu"},{"chapter":"刷章节母题 第十一章 公共物品与财政职能 共6题","point":"财政的基本职能","type":"single","stem":"公共财政配置社会资源的机制和手段是（ ）。","material":"","options":[{"key":"A","text":"加强税收调节"},{"key":"B","text":"发挥公共支出的作用"},{"key":"C","text":"为公共工程提供必要的资金保障"},{"key":"D","text":"通过税收、财政补贴、财政贴息、公债等调节社会投资需求水平"}],"answer":["C"],"explanation":"本题考查资源配置职能。，财政配置社会资源的机制和手段包括：（1）根据政府职能的动态变化确定社会公共需要的基本范围。（2）优化财政支出结构。（3）为公共工程提供必要的资金保障（选项C正确）。（4）通过政府直接投资、财政贴息、税收优惠等方式，引导和调节社会投资方向。（5）通过实行部门预算、建立国库收集收付制度和绩效评价制度等体制、机制改革，提高财政自身管理和运营效率。选项A、B是收入分配职能的实现手段，选项D是经济稳定与发展职能的实现手段。故本题选C选项。","id":"jichu-0074","bank":"jichu"},{"chapter":"刷章节母题 第十一章 公共物品与财政职能 共6题","point":"财政的基本职能","type":"multi","stem":"下列属于资源配置职能范围的有（ ）。","material":"","options":[{"key":"A","text":"国家安全支出"},{"key":"B","text":"一般公共服务支出"},{"key":"C","text":"公共卫生"},{"key":"D","text":"维护市场竞争"},{"key":"E","text":"私人物品"}],"answer":["A","B","C","D"],"explanation":"本题考查资源配置职能。财政资源配置职能应当是市场失灵而社会又需要的公共物品和服务的领域，具体包括：（1）满足政府执行职能的需要，如国家安全支出（选项A正确），一般公共服务 支出（选项B正确）；.....： （2）市场不能有效提供而社会又需要的准公共物品和服务的支出，如公共卫生 （选项C正确）、科技、公共工程； （3）对社会资源配置的引导性支出，如矫正外部效应、维护市场竞争（选项D正 确)。 私人物品不属于财政资源配置职能的范围，选项E错误。 故本题选ABCD选项。","id":"jichu-0075","bank":"jichu"},{"chapter":"刷章节母题 第十二章 财政支出 共10题","point":"财政支出及其分类","type":"single","stem":"财政支出总额占国内生产总值的比重称为（ ）。","material":"","options":[{"key":"A","text":"财政支出规模"},{"key":"B","text":"财政支出结构"},{"key":"C","text":"财政支出的经济性质"},{"key":"D","text":"财政支出方向"}],"answer":["A"],"explanation":"本题考查理解财政支出数据。财政支出规模是指财政支出总额占国内生产总值（GDP）的比重。它反映了政府实际上参与社会经济生活的程度，有助于人们了解政府支配了多少社会资源，简单地说就是掌控和运用了多少钱，选项A正确。财政支出结构是指在财政支出总额中各类支出所占的比重，选项B错误。财政支出的经济性质是指各项财政支出的具体经济构成，选项C错误。指财政资金投入的具体领域或用途，属于政策导向或结构调整的表述，而非一个规范的统计指标，选项D错误。故本题选A选项。","id":"jichu-0076","bank":"jichu"},{"chapter":"刷章节母题 第十二章 财政支出 共10题","point":"财政支出及其分类","type":"multi","stem":"下列关于财政支出分类方法的表述正确的有（ ）。","material":"","options":[{"key":"A","text":"支出功能分类是按照政府提供公共物品与服务的产出性质进行的分类，反映政府的职能活动"},{"key":"B","text":"支出经济分类是按照政府生产公共物品的成本投入进行分类，反映政府支出的经济性质和具体用途"},{"key":"C","text":"根据交易经济性质可将财政支出分为购买性支出和转移性支出"},{"key":"D","text":"利用交易性质分类可以从宏观上考察一国政府在多大程度上作为经济主体直接参与经济过程，其职能是偏好于资源配置，还是收入再分配"},{"key":"E","text":"在实施购买性支出过程中，政府仅扮演中介者的角色，依法向受益对象拨付财政资金但并不要求获得相应的物品与劳务人"}],"answer":["A","B","C","D"],"explanation":"本题考查财政支出分类方法。支出功能分类是按照政府提供公共物品与服务的产出性质进行的分类，反映政府的职能活动，选项A正确。支出经济分类是按照政府生产公共物品的成本投入进行分类，反映政府支出的经济性质和具体用途，选项B正确。根据交易经济性质可将财政支出分为购买性支出和转移性支出，选项C正确。利用交易性质分类可以从宏观上考察一国政府在多大程度上作为经济主体直接参与经济过程，其职能是偏好于资源配置，还是收入再分配，选项D正确。在实施转移性支出过程中，政府仅扮演中介者的角色，依法向受益对象拨付财政资金但并不要求获得相应的物品与劳务，选项E错误。故本题选ABCD选项。","id":"jichu-0077","bank":"jichu"},{"chapter":"刷章节母题 第十二章 财政支出 共10题","point":"财政支出规模及其增长趋势","type":"single","stem":"下列关于财政支出规模的表述错误的是（ ）。，","material":"","options":[{"key":"A","text":"当年财政支出占当年国内生产总值的比重，反映中央政府对地方政府的控制程"},{"key":"B","text":"正常情况下财政支出占国内生产总值的比重是不断上升的"},{"key":"C","text":"各工业化国家的财政支出规模先是持续增大，后来渐渐稳定在相对较高的水平"},{"key":"D","text":"财政支出绝对规模通常由按当年价格计算的财政支出的加总来反映"}],"answer":["A"],"explanation":"本题考查衡量财政支出规模的指标。．财政支出规模是衡量一定时期内政府支配社会资源的多少、满足公共需要能力高低的重要指标，反映着政府对社会经济发展影响力的强弱，选项A错误。正常情况下，财政支出占国内生产总值的比重是不断上升的，中央财政支出占全国财政支出的比重是相对稳定的，它取决于国家的制度安排。人均财政支出指标一般也呈现不断增长的趋势，选项B正确。根据各国财政支出的实践看，自20世纪初期以来，各工业化国家的财政支出规模先是持续增大，后来渐渐稳定在相对较高的水平上，选项C正确。财政支出的绝对规模通常由按当年价格计算的财政支出的加总来反映，选项D正确。故本题选A选项。","id":"jichu-0078","bank":"jichu"},{"chapter":"刷章节母题 第十二章 财政支出 共10题","point":"财政支出规模及其增长趋势","type":"multi","stem":"下列经济理论中，属于财政支出规模增长理论的有（ ）。","material":"","options":[{"key":"A","text":"梯度渐进增长理论"},{"key":"B","text":"非均衡增长理论"},{"key":"C","text":"政府活动扩张法则"},{"key":"D","text":"内生增长理论人"},{"key":"E","text":"经济发展阶段增长理论"}],"answer":["A","B","C","E"],"explanation":"本题考查财政支出规模增长的理论解释。关于财政支出规模增长的理论解释主要有：政府活动扩张法则；梯度渐进增长理论；经济发展阶段增长理论；非均衡增长理论；公共选择学派的解释。故本题选ABCE选项。【乐拓展】内生增长理论是现代宏观经济增长理论的一种，强调技术进步、人力资本积累等内生于经济系统，可能解释经济增长的动力，但它不是专门解释财政支出增长的理论。","id":"jichu-0079","bank":"jichu"},{"chapter":"刷章节母题 第十二章 财政支出 共10题","point":"财政支出效益分析","type":"multi","stem":"下列关于财政支出效益分析法主要内容的表述，正确的有（ ）。","material":"","options":[{"key":"A","text":"成本效益法的目的是提高整个社会资源配置的效率"},{"key":"B","text":"公共定价法的政策方法有免费政策、低价政策、平价政策、高价政策"},{"key":"C","text":"最低费用法适用于军事、行政、文化、卫生等支出项目"},{"key":"D","text":"成本效益分析法对于选择最优支出方案，提高财政资金使用的经济效益大有裨"},{"key":"E","text":"最低费用选择法与成本效益分析法大体相同，但不要求计算支出的无形成本与效益"}],"answer":["C","D","E"],"explanation":"本题考查衡量财政支出效益的方法。选项A错误，公共定价法的目的和原则不仅是要提高整个社会资源配置的效率，而且还要保证居民的生活水平和生活安定。选项B错误，公共劳务收费法的政策方法有免费政策、低价政策、平价政策、高价政策。选项C正确，最低费用选择法是指对每个备选的财政支出方案进行经济分析时，只计算备选方案的有形成本，而不用货币计算备选方案支出的社会效益，并以成 本最低为择优的标准，适用于军事、行政、文化、卫生等支出项目。 选项D正确，成本效益分析法是指根据国家所确定的建设目标，提出若干个实现 建设目标的方案，通过计算成本效益的比率来分析比较不同方案的效益，从中选 择最优的支出方案。成本效益分析法对于选择最优支出方案，提高财政资金使用 的经济效益大有禅益。 选项E正确，最低费用选择法的操作步骤与成本一效益分析法大体相同，但最低 费用选择法不要求计算支出的无形成本与效益，故运用起来比成本一效益分析法 简单。 故本题选CDE选项。","id":"jichu-0080","bank":"jichu"},{"chapter":"刷章节母题 第十二章 财政支出 共10题","point":"购买性支出","type":"multi","stem":"购买性支出包括（ ）。","material":"","options":[{"key":"A","text":"政府消费性支出"},{"key":"B","text":"政府投资性支出"},{"key":"C","text":"社会保障支出"},{"key":"D","text":"财政补贴支出"},{"key":"E","text":"社会保险"}],"answer":["A","B"],"explanation":"本题考查政府消费性支出。购买性支出包括政府消费性支出和政府投资性支出，选项A、B正确。转移性支出主要由社会保障支出和财政补贴构成，选项C、D错误。“社会保险”属于社会保障支出，选项E错误。故本题选AB选项。","id":"jichu-0081","bank":"jichu"},{"chapter":"刷章节母题 第十二章 财政支出 共10题","point":"购买性支出","type":"single","stem":"政府投资性支出的特点不包括（ ）。","material":"","options":[{"key":"A","text":"增长性"},{"key":"B","text":"非营利性"},{"key":"C","text":"长期性"},{"key":"D","text":"外部性"}],"answer":["A"],"explanation":"本题考查政府投资性支出。与非政府投资相比较，政府投资性支出具有以下特点：非营利性、长期性和外部性。故本题选A选项。","id":"jichu-0082","bank":"jichu"},{"chapter":"刷章节母题 第十二章 财政支出 共10题","point":"转移性支出","type":"multi","stem":"在国家财政支出项目中，属于社会保障支出的有（ ）。","material":"","options":[{"key":"A","text":"行政管理支出"},{"key":"B","text":"国防支出"},{"key":"C","text":"社会保险"},{"key":"D","text":"卫生健康支出"},{"key":"E","text":"社会救助支出"}],"answer":["C","E"],"explanation":"本题考查社会保障支出。政府消费性支出有行政管理支出、国防支出、教育支出、科学技术支出、卫生健康支出等（选项A、B、D错误）社会保障支出包括社会保险、社会救助、社会福利、社会优抚（选项C、E正确）。故本题选CE选项。","id":"jichu-0083","bank":"jichu"},{"chapter":"刷章节母题 第十二章 财政支出 共10题","point":"转移性支出","type":"multi","stem":"关于政府的购买性支出与转移性支出的说法正确的有（ ）。","material":"","options":[{"key":"A","text":"若购买性支出所占比重大，表明财政具有较强的资源配置职能"},{"key":"B","text":"若转移性支出所占比重大，表明财政具有较强的收入分配职能"},{"key":"C","text":"若转移性支出所占比重大，表明财政具有较强的资源配置职能"},{"key":"D","text":"市场经济发达国家转移性支出所占比重较大（ ）。"},{"key":"E","text":"大多数发展中国家购买性支出所占比重较大"}],"answer":["A","B","D","E"],"explanation":"本题考查购买性支出与转移性支出功能的比较。购买性支出与转移性支出功能的比较主要体现在以下方面：（1）对生产与就业影响的方式不同。（2）对政府支出效益约束的强度不同。（3）体现财政的不同职能：①在财政支出总额中，若购买性支出所占比重大，相应地直接通过财政配置的资源规模也大，这表明财政具有较强的资源配置职能（选项A正确)；②若转移性支出所占比重大，相应的财政活动对社会收入分配的直接影响就大，这表明财政具有较强的收入分配职能（选项B正确、选项C错误)。一般来说，市场经济发达国家政府直接参与生产活动较少，转移性支出所占比重往往较大（选项D正确)；大多数发展中国家，政府直接或间接介入经济活动相对较多，购买性支出所占比重往往较大（选项E正确)。是包A主成故本题选ABDE选项。","id":"jichu-0084","bank":"jichu"},{"chapter":"刷章节母题 第十三章 财政收入 共8题","point":"财政收入和财政集中度","type":"multi","stem":"在《2025年政府收支分类科目》中，非税收入包括（ ）。","material":"","options":[{"key":"A","text":"行政事业性收费收入"},{"key":"B","text":"国有资本经营收入"},{"key":"C","text":"捐赠收入"},{"key":"D","text":"债务收入"},{"key":"E","text":"罚没收入"}],"answer":["A","B","C","E"],"explanation":"本题考查财政收入及其分类。我国《2025年政府收支分类科目》将政府一般公共预算收入科目分为税收收入、非税收入、债务收入和转移性收入四类（选项D错误)。其中非税收入包括专项收入、行政事业性收费收入、罚没收入、国有资本经营收入、国有资源（资产）有偿使用收入、捐赠收入、政府住房基金收入和其他收入八款（选项A、B、C、E正确）。故本题选ABCE选项。","id":"jichu-0085","bank":"jichu"},{"chapter":"刷章节母题 第十三章 财政收入 共8题","point":"财政收入和财政集中度","type":"single","stem":"国家通过各种形式，从国民经济收支环流中截取并运用的资金占国民经济总量的比重称为（ ）。","material":"","options":[{"key":"A","text":"财政集中度"},{"key":"B","text":"税负转嫁"},{"key":"C","text":"财政收入规模"},{"key":"D","text":"国债负担率"}],"answer":["A"],"explanation":"本题考查财政集中度与宏观税负。，，（ ）。财政集中度，通俗地称为宏观税负，是指国家通过各种形式，从国民经济收支环流中截取并运用的资金占国民经济总量的比重，选项A正确。税负转嫁是指纳税人将所缴纳的税款通过各种途径和方式转由他人负担的行为和过程，选项B错误。财政收入规模是指财政收入的总水平，选项C错误。国债负担率又称国民经济承受能力，是指国债累计余额占国内生产总值（GDP）的比重，选项D错误。故本题选A选项。","id":"jichu-0086","bank":"jichu"},{"chapter":"刷章节母题 第十三章 财政收入 共8题","point":"税收","type":"multi","stem":"关于税收基本含义的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"纳税主体是政府"},{"key":"B","text":"征税的目的是满足社会公共需要"},{"key":"C","text":"税收征收凭借的是国家的政治权力"},{"key":"D","text":"征税的过程是物质财富在征纳双方之间有偿转移的过程"},{"key":"E","text":"税收征收的直接结果是国家通过税收方式取得了财政收入"}],"answer":["B","C","E"],"explanation":"本题考查税收的基本含义。税收的征收主体是国家，征收客体是单位和个人，选项A错误。征税的过程是物质财富从私人部门单向地无偿地转移给国家的过程，选项D错误。税收的征收目的是为了满足国家实现其职能的需要，或者说是满足社会公共需要，选项B正确。税收征收的依据是法律，凭借的是政治权力，而不是财产权力，选项C正确。从税收征收的直接结果看，国家通过税收方式取得了财政收入，选项E正确。故本题选BCE选项。","id":"jichu-0087","bank":"jichu"},{"chapter":"刷章节母题 第十三章 财政收入 共8题","point":"税收","type":"multi","stem":"下列关于税收的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"税收的职能是税收本质的具体表现"},{"key":"B","text":"税收具有财政职能、经济职能和监督职能"},{"key":"C","text":"税收具有固定性、无偿性、强制性三大基本特征"},{"key":"D","text":"税收的监督职能仅涉及宏观层面，不涉及微观层面"},{"key":"E","text":"经济职能是税收是首要的和最基本的职能"}],"answer":["A","B","C"],"explanation":"本题考查税收的含义。选项A正确，税收的职能是指在一定社会制度下，税收这种分配关系本身在社会经济活动中内在固有的基本功能，它是税收本质的具体表现。选项B、C正确，税收的三项职能为：财政职能、经济职能和监督职能。选项D错误，税收的监督职能在宏观和微观层面都涉及。选项E错误，财政职能是税收是首要的和最基本的职能。故本题选ABC选项。","id":"jichu-0088","bank":"jichu"},{"chapter":"刷章节母题 第十三章 财政收入 共8题","point":"税负转嫁／（ ）。","type":"single","stem":"企业通过改善经营管理、提高劳动生产率等措施来降低成本、增加利润，从而抵消税负。这种税负转嫁方式是（ ）。","material":"","options":[{"key":"A","text":"税收资本化人"},{"key":"B","text":"混转"},{"key":"C","text":"旁转"},{"key":"D","text":"消转"}],"answer":["D"],"explanation":"本题考查税负转嫁的方式。消转是指纳税人用降低征税物品成本的办法使税负从新增利润中得到抵补。这种转嫁方式既不是通过提高销售价格的形式前转也不是通过压低进价的方式后转，而是通过改善经营管理、提高劳动生产率等措施降低成本、增加利润来抵消税负，选项D正确。税收资本化是指生产要素购买者将所购买的生产要素未来应当缴纳的税款，通过从购入价格中预先扣除的方法，向后转嫁给生产要素的出售者。税收资本化主要发生在土地和收益来源较具永久性质的政府债券等资本物品的交易中，税收资本化是现在承担未来的税收，最典型的就是对土地交易的课税，选项A错误。混转也称为散转，纳税人既可以把税负转嫁给供应商，又可以把税负转嫁给购买 者，实际上是前转和后转的混合方式。这种转嫁方式在实践中比较常见，选项B 错误。 旁转也称“侧转”，是指纳税人将应负担的税款转嫁给除购买者或者供应者以外 的其他人负担，选项C错误。 故本题选D选项。","id":"jichu-0089","bank":"jichu"},{"chapter":"刷章节母题 第十三章 财政收入 共8题","point":"税负转嫁／（ ）。","type":"multi","stem":"下列税种中，（ ）的税收负担较易转嫁。","material":"","options":[{"key":"A","text":"增值税"},{"key":"B","text":"消费税"},{"key":"C","text":"所得税"},{"key":"D","text":"财产税"},{"key":"E","text":"房产税"}],"answer":["A","B"],"explanation":"本题考查影响税负转嫁的因素。通过经济交易过程而间接对纳税人征收的税是比较容易转嫁的，如对商品或者劳务征收的增值税、消费税等，选项A、B正确。所得税和财产税属于直接税，税负不容易转嫁，财产税包括房产税，选项C、D、E错误。故本题选AB选项。","id":"jichu-0090","bank":"jichu"},{"chapter":"刷章节母题 第十三章 财政收入 共8题","point":"国债","type":"multi","stem":"国债的特点包括（ ）。","material":"","options":[{"key":"A","text":"不确定性"},{"key":"B","text":"自愿性O原包"},{"key":"C","text":"强制性"},{"key":"D","text":"有偿性"},{"key":"E","text":"灵活性"}],"answer":["B","D","E"],"explanation":"本题考查国债的基本含义。国债具有自愿性、有偿性和灵活性的特征。故本题选BDE选项。","id":"jichu-0091","bank":"jichu"},{"chapter":"刷章节母题 第十三章 财政收入 共8题","point":"国债","type":"single","stem":"下列关于实物国债的说法中正确的是（ ）。","material":"","options":[{"key":"A","text":"现代世界各国发行的国债基本上都是实物国债"},{"key":"B","text":"实物国债不能避免因货币贬值而给债权人带来的损失"},{"key":"C","text":"实物国债一般在通货紧缩时采用"},{"key":"D","text":"我国1950年发行的“人民胜利折实公债”是实物国债"}],"answer":["D"],"explanation":"本题考查国债的种类。，现代世界各国发行的国债基本上都是货币国债，选项A错误。实物国债可以避免因货币贬值而给债权人带来的损失，故其一般在通货膨胀时采用，选项B、错误。我国1950年发行的“人民胜利折实公债”是实物国债，选项D正确。故本题选D选项。","id":"jichu-0092","bank":"jichu"},{"chapter":"刷章节母题 第十四章 税收制度 共10题","point":"税制要素与税收分类","type":"single","stem":"税制的基本要素不包括（ ）。","material":"","options":[{"key":"A","text":"税率"},{"key":"B","text":"纳税期限"},{"key":"C","text":"课税对象"},{"key":"D","text":"纳税人"}],"answer":["B"],"explanation":"本题考查税制要素。税制要素是指构成一国税收制度的主要因素，具体包括：纳税人、课税对象、税率、纳税环节、纳税期限、减税和免税、违章处理、纳税地点等。其中，纳税人、课税对象和税率是税制的基本要素。故本题选B选项。","id":"jichu-0093","bank":"jichu"},{"chapter":"刷章节母题 第十四章 税收制度 共10题","point":"税制要素与税收分类","type":"single","stem":"下列税种中，属于间接税的是（ ）。","material":"","options":[{"key":"A","text":"车船税"},{"key":"B","text":"消费税"},{"key":"C","text":"个人所得税（ ）。"},{"key":"D","text":"房产税"}],"answer":["B"],"explanation":"本题考查税收分类。直接税是指由纳税人直接负担税负、不发生税负转嫁关系的税收，如所得税和财产税。间接税是指纳税人能将税负转嫁给他人负担的税收，如消费税和增值税。选项A、C、D是直接税。故本题选B选项。（","id":"jichu-0094","bank":"jichu"},{"chapter":"刷章节母题 第十四章 税收制度 共10题","point":"货物和劳务税类","type":"single","stem":"下列商品或服务中，适用增值税税率为9%的是（ ）。","material":"","options":[{"key":"A","text":"销售小汽车"},{"key":"B","text":"基础电信服务"},{"key":"C","text":"有形动产租赁服务"},{"key":"D","text":"增值电信服务"}],"answer":["B"],"explanation":"本题考查增值税。纳税人销售或者进口包括粮食在内的农产品、自来水、暖气、石油液化气、天然气、食用植物油、冷气、热水、煤气、居民用煤炭制品、食用盐、农机、饲料、农药、农膜、化肥、沼气、二甲醚、图书、报纸、杂志、音像制品、电子出版物，税率为9%；提供交通运输、邮政、基础电信（选项B正确）、建筑、不动产租赁服务，销售不动产，转让土地使用权，税率也为9%。选项A、C适用增值税税率为13%，选项D适用增值税为6%。 故本题选B选项。","id":"jichu-0095","bank":"jichu"},{"chapter":"刷章节母题 第十四章 税收制度 共10题","point":"货物和劳务税类","type":"single","stem":"下列关于消费税的相关说法正确的是（ ）。","material":"","options":[{"key":"A","text":"消费税的计税方法采用扣税法"},{"key":"B","text":"啤酒、黄酒、成品油适用于定额税率和比例税率相结合"},{"key":"C","text":"白酒、卷烟等应税消费品适用于定额税率"},{"key":"D","text":"消费税实行从价定率、从量定额、复合计税"}],"answer":["D"],"explanation":"本题考查消费税。增值税的计税方法采用扣税法；消费税实行从价定率、从量定额、复合计税的方法，选项A错误，选项D正确。白酒、卷烟等应税消费品适用于定额税率和比例税率相结合，啤酒、黄酒、成品油适用于定额税率，选项B、C错误。故本题选D选项。","id":"jichu-0096","bank":"jichu"},{"chapter":"刷章节母题 第十四章 税收制度 共10题","point":"所得税类","type":"multi","stem":"下列关于所得税的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"属于间接税，税负易转嫁（ ）。"},{"key":"B","text":"税负存在一定的不公平性"},{"key":"C","text":"税负相对比较公平"},{"key":"D","text":"属于单环节征收，不存在重复征税问题"},{"key":"E","text":"税源可靠，收入具有弹性"}],"answer":["C","D","E"],"explanation":"本题考查所得税的特点。所得税具有三个特点：（ ）。（1）税负相对比较公平（选项C正确）。所得税税额的多少直接取决于有无所得和所得多少。一般实行所得多的多征、所得少的少征、无所得的不征，比较符合“量能负担”原则；所得税类一般规定有起征点、免征额和扣除项目，可以减轻或消除低收入者的负担。（2）所得税类以纳税人的应税所得额为计税依据，属于单环节征收，不存在重复征税问题（选项D正确)；应税所得额不构成商品价格的追加，也不易转嫁，不会影响商品的相对价格。（3）税源可靠，收入具有弹性（选项E正确）。随着经济发展和经济增长质量提高，所得税税源将不断扩大；所得税多数情况下采取累进税率，与流转税比较，收入更富有弹性；所得税能够自动适应经济发展周期变化，发挥“内在稳定器”的作用。所得税属于直接税，税负不易转嫁（选项A错误）。属于财产税的特点，所得税税负相对比较公平（选项B错误）。故本题选CDE选项。","id":"jichu-0097","bank":"jichu"},{"chapter":"刷章节母题 第十四章 税收制度 共10题","point":"财产税类","type":"multi","stem":"关于财产税的内容，说法正确的有（ ）。","material":"","options":[{"key":"A","text":"财产税属于直接税，不易转嫁，是中央政府财政收入的主要来源"},{"key":"B","text":"房产税的纳税人包括产权所有人、承典人、房产代管人或者使用人"},{"key":"C","text":"房屋赠与向受赠人征收契税，房屋买卖向出售人征收契税"},{"key":"D","text":"境内单位和个人租入外国籍船舶的，不征收车船税"},{"key":"E","text":"房产税、车船税实行定额税率，契税实行幅度比例税率（ ）。"}],"answer":["B","D"],"explanation":"本题考查财产税的特点。在各国税收体系中，财产税一直是地方政府财政收入的主要来源。财产持有者在财产使用上一般不与他人发生经济关系，财产税属于直接税，不易转嫁，政府征收财产税增加了有产者的负担，同时等于相对减轻了无产者的负担，选项A错误。房产税的纳税人是在我国城市、县城、建制镇和工矿区内拥有房屋产权的单位和个人。具体包括产权所有人、承典人、房产代管人或者使用人，选项B正确。在中华人民共和国境内转移土地、房屋权属，承受的单位和个人为契税的纳税人。房屋的受赠人原则上要按规定缴纳契税。房屋买卖由买房人缴纳契税，选项C错误。境内单位和个人租入外国籍船舶的，不征收车船税。境内单位和个人将船舶出租到境外的，应依法征收车船税，选项D正确。我国现行房产税采用比例税率。契税实行3%一5%的幅度税率。车船税实行定额税率，即对征税的车船规定单位固定税额，选项E错误。故本题选BD选项。","id":"jichu-0098","bank":"jichu"},{"chapter":"刷章节母题 第十四章 税收制度 共10题","point":"财产税类","type":"multi","stem":"下列关于契税的内容，说法正确的有（ ）。","material":"","options":[{"key":"A","text":"国有土地使用权出让、房屋互换、房屋典当均需征收契税"},{"key":"B","text":"土地使用权互换、房屋互换，其计税依据为所换取的土地使用权、房屋的价格差额"},{"key":"C","text":"契税的纳税义务发生时间是纳税人签订土地、房屋权属转移合同的当日，或者纳税人取得其他具有土地、房屋权属转移合同性质凭证的当日"},{"key":"D","text":"纳税人应当在依法办理土地、房屋权属登记手续后申报缴纳契税"},{"key":"E","text":"契税在土地、房屋所在地的征收机关缴纳"}],"answer":["B","C","E"],"explanation":"本题考查契税。不属于契税的征收范围：土地、房屋典当、分拆（分割)、抵押以及出租等行为，选项A错误。土地使用权互换、房屋互换，其计税依据为所换取的土地使用权、房屋的价格差额，选项B正确。契税的纳税义务发生时间是纳税人签订土地、房屋权属转移合同的当日，或者纳税人取得其他具有土地、房屋权属转移合同性质凭证的当日，选项C正确。纳税人应当在依法办理土地、房屋权属登记手续前申报缴纳契税，选项D错误。契税在土地、房屋所在地的征收机关缴纳，选项E正确。故本题选BCE选项。","id":"jichu-0099","bank":"jichu"},{"chapter":"刷章节母题 第十四章 税收制度 共10题","point":"财产税类","type":"multi","stem":"“十四五”规划提出的完善现代税收制度的内容包括（ ）。","material":"","options":[{"key":"A","text":"优化税制结构，健全直接税体系，适当提高间接税比重"},{"key":"B","text":"完善个人所得税制度，推进扩大综合征收范围，优化税率结构"},{"key":"C","text":"调整优化消费税征收范围和税率，推进征收环节后移并稳步下划地方"},{"key":"D","text":"推进房地产税立法，健全地方税体系，逐步扩大地方税政管理权"},{"key":"E","text":"深化税收征管制度改革建设智慧税务，推动税收征管现代化"}],"answer":["B","C","D","E"],"explanation":"本题考查深化税收征管改革。（1）优化税制结构，健全直接税体系，适当提高直接税比重，选项A错误。（2）完善个人所得税制度，推进扩大综合征收范围，优化税率结构，选项B正确。（3）聚焦支持稳定制造业、巩固产业链供应链，进一步优化增值税制度。（4）调整优化消费税征收范围和税率，推进征收环节后移并稳步下划地方，选项C正确。（5）规范完善税收优惠。 （6）推进房地产税立法，健全地方税体系，逐步扩大地方税政管理权，选项D正 确。 （7）深化税收征管制度改革，建设智慧税务，推动税收征管现代化，选项E正 故本题选BCDE选项。","id":"jichu-0100","bank":"jichu"},{"chapter":"刷章节母题 第十四章 税收制度 共10题","point":"财产税类","type":"multi","stem":"深化税收征管改革的主要内容包括（ ）。","material":"","options":[{"key":"A","text":"全面推进税收征管数字化升级和智能化改造"},{"key":"B","text":"不断完善税务执法制度和机制"},{"key":"C","text":"大力推行优质高效智能税费服务"},{"key":"D","text":"精准实施税务监管"},{"key":"E","text":"加强风险防控，增强财政可持续性"}],"answer":["A","B","C","D"],"explanation":"本题考查深化税收征管改革。深化税收征管改革的主要内容包括：（1）全面推进税收征管数字化升级和智能化改造，选项A正确。（2）不断完善税务执法制度和机制，选项B正确。（3）大力推行优质高效智能税费服务，选项C正确。（4）精准实施税务监管，选项D正确。（5）持续深化拓展税收共治格局。··）（6）强化税务组织保障。故本题选ABCD选项。","id":"jichu-0101","bank":"jichu"},{"chapter":"刷章节母题 第十五章 政府预算 共10题","point":"政府预算的职能与原则","type":"single","stem":"下列关于政府预算的说法中错误的是（ ）。","material":"","options":[{"key":"A","text":"从形式上看，政府预算反映了可供政府集中支配的财政资金的数量的多少"},{"key":"B","text":"政府预算是国家和政府意志的体现"},{"key":"C","text":"监督政府部门收支运作情况是政府预算的三大职能之一"},{"key":"D","text":"政府预算的原则包括完整性、统一性、可靠性、合法性、年度性、公开性"}],"answer":["A"],"explanation":"本题考查政府预算的职能与原则。从技术性方面看，政府预算包含两层含义：①从形式上看，政府预算是政府的财政收支计划，是政府的工作计划。②从内容上看，政府预算反映了可供政府集中支配的财政资金的数量的多少（选项A错误)。从本质方面看，政府预算是国家和政府意志的体现（选项B正确）。政府预算的三大职能：反映政府部门活动；监督政府部门收支运作的情况；控制政府部门支出（选项C正确）。政府预算的原则：完整性、统一性、可靠性、合法性、年度性、公开性（选项D正确）。（ ）。故本题选A选项。","id":"jichu-0102","bank":"jichu"},{"chapter":"刷章节母题 第十五章 政府预算 共10题","point":"政府预算的职能与原则","type":"single","stem":"政府预算活动的每个环节都必须根据法定程序进行。政府预算的成立，预算执行中的调整和预算执行的结果，都会经过立法机关审查批准，这是政府预算（ ）。原则的要求。","material":"","options":[{"key":"A","text":"统一性"},{"key":"B","text":"公开性"},{"key":"C","text":"完整性"},{"key":"D","text":"合法性"}],"answer":["D"],"explanation":"本题考查政府预算的原则。政府预算的原则主要有：完整性原则；统一性原则；可靠性原则；合法性原则；公开性原则；年度性原则。其中，合法性原则是指政府预算活动的每个环节都必须按照法定程序进行，政府预算的成立、预算执行中的调整和预算执行结果都必须经过立法机关审查批准。根据题干中“根据法定程序进行”可选择合法性。故本题选D选项。","id":"jichu-0103","bank":"jichu"},{"chapter":"刷章节母题 第十五章 政府预算 共10题","point":"我国政府预算管理职权划分","type":"multi","stem":"根据《中华人民共和国预算法》的规定，各级人民代表大会常务委员会的预算管理职权包括（ ）。","material":"","options":[{"key":"A","text":"编制本级总预算草案"},{"key":"B","text":"批准本级总预算草案"},{"key":"C","text":"监督本级总预算的执行"},{"key":"D","text":"审查本级预算的调整方案"},{"key":"E","text":"决定本级预算预备费的动用"}],"answer":["C","D"],"explanation":"本题考查我国政府预算职权划分。全国人民代表大会常务委员会有权监督中央和地方预算的执行，审查和批准中央预算的调整方案，审查和批准中央决算（选项C、D正确）。撤销国务院制定的同宪法、法律相抵触的关于预算、决算的行政法规、决定和命令，撤销省、自治区、直辖市人民代表大会及其常务委员会制定的同宪法、法律和行政法规相抵触的关于预算、决算的地方性法规和决议。县级以上地方各级人民代表大会常务委员会有权监督本级总预算的执行，审查和批准本级预算的调整方案，审查和批准本级政府决算，撤销本级政府和下一级人民代表大会及其常务委员会关于预算、决算的不适当的决定、命令和决议。选项A是各级政府财政部门的职权。选项B是各级人民代表大会的职权。选项E是各级人民政府的职权。故本题选CD选项。","id":"jichu-0104","bank":"jichu"},{"chapter":"刷章节母题 第十五章 政府预算 共10题","point":"我国政府预算管理职权划分","type":"multi","stem":"根据《预算法》，各级人民政府的预算管理职权有（ ）。","material":"","options":[{"key":"A","text":"审批本级预算调整方案"},{"key":"B","text":"组织编制本级预算草案"},{"key":"C","text":"决定本级政府预备费的动用"},{"key":"D","text":"编制本级预算调整方案"},{"key":"E","text":"组织编制本级决算草案"}],"answer":["B","C","D","E"],"explanation":"本题考查我国政府预算的职权划分。各级人民政府的预算管理职权有；县级以上人民政府组织编制本级预算、决算草案（选项B错误、选项E正确），向本级人民代表大会作关于本级总预算草案的报告；组织本级总预算执行；决定本级预算预备费的动用（选项C正确)；编制本级预算的调整方案（选项D正确)；监督本级各部门和下级政府的预算执行；改变或者撤销本级各部门和下级政府关于预算、决算的不适当的决定、命令；向本级人民代表大会及其常务委员会报告本级总预算的执行情况。“审批本级预算调整方案”属于各级人民代表大会常务委员会的职权（选项A错误）。包故本题选BCDE选项。","id":"jichu-0105","bank":"jichu"},{"chapter":"刷章节母题 第十五章 政府预算 共10题","point":"我国政府预算体系","type":"single","stem":"我国的政府预算体系中，（ ）不能用于平衡其他预算。","material":"","options":[{"key":"A","text":"政府性基金预算"},{"key":"B","text":"国有资本经营预算"},{"key":"C","text":"社会保险基金预算"},{"key":"D","text":"一般公共预算"}],"answer":["C"],"explanation":"本题考查我国政府预算体系。 我国政府预算体系中的四类预算既相互独立、又有机衔接： （1）从独立性来看，每一类预算与政府预算的关系都是局部与全局的关系，它 们各自有不同的收入来源，支出用途和管理方式，不可相互混用，特别是社会保 险基金预算不能用于平衡一般公共预算等其他预算，选项C正确。 （2）从衔接性上看，一般公共预算中安排了大量社会保障支出；国有资本经营 预算和政府性基金预算中，都可以调剂部分资金用于社会保障选项。选项A、B、 D三个预算之间可以相互平衡，与题意不符。 故本题选C选项。","id":"jichu-0106","bank":"jichu"},{"chapter":"刷章节母题 第十五章 政府预算 共10题","point":"我国政府预算体系","type":"multi","stem":"下列关于我国政府预算体系的表述正确的有（ ）。","material":"","options":[{"key":"A","text":"我国政府预算体系包括一般公共预算、政府性基金预算、国有资本经营预算和社会保险基金预算"},{"key":"B","text":"一般公共预算是政府预算体系的基础"},{"key":"C","text":"具有专款专用性质且不宜纳入一般公共预算管理的资金应当纳入政府性基金预算"},{"key":"D","text":"适当提高中央企业国有资本收益上交比例，新增部分的一定比例用于社会保障等民生支出"},{"key":"E","text":"社会保险基金不能用于平衡财政预算，财政预算也不可补助社会保险基金"}],"answer":["A","B","C","D"],"explanation":"本题考查我国政府预算体系。我国完整的政府预算体系包括一般公共预算、政府性基金预算、国有资本经营预算和社会保险基金预算，选项A正确。一般公共预算是政府预算体系的基础，选项B正确。具有专款专用性质且不宜纳入一般公共预算管理的资金应当纳入政府性基金预算，选项C正确。适当提高中央企业国有资本收益上交比例，新增部分的一定比例用于社会保障等民生支出，选项D正确。社会保险基金不能用于平衡财政预算，财政预算可补助社会保险基金，选项E错误。故本题选ABCD选项。","id":"jichu-0107","bank":"jichu"},{"chapter":"刷章节母题 第十五章 政府预算 共10题","point":"我国政府预算编制和执行制度","type":"multi","stem":"关于政府预算的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"部门支出预算编制采用增量预算法"},{"key":"B","text":"我国政府预算年度采用历年制"},{"key":"C","text":"经常性预算主要以国债为收入来源，以经济建设项目为支出对象"},{"key":"D","text":"政府预算制度最早出现在法国"},{"key":"E","text":"政府预算从编制审查批准到执行调整和决算，都要依照法律规范"}],"answer":["B","E"],"explanation":"本题考查预算编制制度。部门支出预算编制采用零基预算法，选项A错误。经常性预算主要以税收为收入来源，以政府事业项目为支出对象，资本预算主要以国债为收入来源，以经济建设项目为支出对象，如政府贷款及偿还国债等支出，选项C错误。 政府预算最早出现在英国，选项D错误。 故本题选BE选项。","id":"jichu-0108","bank":"jichu"},{"chapter":"刷章节母题 第十五章 政府预算 共10题","point":"我国政府预算编制和执行制度","type":"single","stem":"关于国库集中收付制度的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"国库集中收付制度通过各部门转拨财政性资金"},{"key":"B","text":"国库集中收付制度建立以财政部门为主体的国库单一账户体系"},{"key":"C","text":"国库集中收付制度实行直接缴款和集中汇缴制度"},{"key":"D","text":"国库集中收付制度改变财政资金分散拨付方式"}],"answer":["A"],"explanation":"本题考查国库集中收付制度。从2001年开始，我国正式实施国库管理制度改革。改革目标是将传统的财政资金银行账户管理体系和资金缴拨方式，改为以国库单一账户体系为基础、资金缴拨以国库集中收付为主要形式的财政国库管理制度。主要内容是：（1）取消各部门在商业银行开设的账户，建立以财政部门为主体的国库单一账户体系（选项B正确），所有财政性资金全部在国库单一账户体系中运作，由财政部门统一管理。（2）规范财政性资金收缴方式，对政府财政收入分别实行直接缴库和集中汇缴制度（选项C正确），取消各执收单位自行开设和管理的收入过渡账户，所有收入通过代理银行直接缴入国库或财政专户。（3)改变财政资金分散拨付方式(选项D正确），由财政部门根据不同支付主体，对不同类型的支出分别采取财政直接支付和财政授权支付等方式，将原通过各部门转拨的财政性资金，改为财政部门通过国库单一账户体系直接支付或授权各部门支付到个人、用款单位或者商品供应商和劳务提供者（选项A错误）。故本题选A选项。","id":"jichu-0109","bank":"jichu"},{"chapter":"刷章节母题 第十五章 政府预算 共10题","point":"深化预算管理制度改革","type":"multi","stem":"下列内容中，属于深化预算管理制度改革的有（ ）。","material":"","options":[{"key":"A","text":"加大预算收入统筹力度（"},{"key":"B","text":"严格预算编制管理"},{"key":"C","text":"强化预算执行和绩效管理人"},{"key":"D","text":"加强风险防控"},{"key":"E","text":"健全中央和地方财力与事权相匹配的财税体制"}],"answer":["A","B","C","D"],"explanation":"本题考查深化预算管理制度改革。深化预算管理制度改革的主要内容有：（1）加大预算收入统筹力度，增强财政保障能力；（2）规范预算支出管理，推进财政支出标准化；（3）严格预算编制管理，增强财政预算完整性；（4）强化预算执行和绩效管理，增强预算约束力；（5）加强风险防控，增强财政可持续性；（6）增强财政透明度，提高预算管理信息化水平。故本题选ABCD选项。","id":"jichu-0110","bank":"jichu"},{"chapter":"刷章节母题 第十五章 政府预算 共10题","point":"深化预算管理制度改革","type":"multi","stem":"下列关于深化预算管理制度改革的内容，说法正确的有（ ）。","material":"","options":[{"key":"A","text":"加大预算收入统筹力度，增强财政保障能力"},{"key":"B","text":"规范预算支出管理，推进财政支出标准化"},{"key":"C","text":"强化预算执行和绩效管理，减弱预算约束力"},{"key":"D","text":"增强财政非透明度，提高预算管理信息化水平"},{"key":"E","text":"严格预算编制管理，增强财政预算完整性"}],"answer":["A","B","E"],"explanation":"本题考查深化预算管理制度改革。深化预算管理制度改革的主要内容包括以下几个方面：（1）加大预算收入统筹力度，增强财政保障能力（选项A正确）；（2）规范预算支出管理，推进财政支出标准化（选项B正确）；（3）严格预算编制管理，增强财政预算完整性（选项E正确）；（4）强化预算执行和绩效管理，增强预算约束力（选项C错误）；（5）加强风险防控，增强财政可持续性；（6）增强财政透明度，提高预算管理信息化水平（选项D错误）。故本题选ABE选项。","id":"jichu-0111","bank":"jichu"},{"chapter":"刷章节母题 第十六章 财政管理体制 共8题","point":"财政管理体制内容与类型","type":"single","stem":"广义的财政管理体制不包括（ ）。","material":"","options":[{"key":"A","text":"税收管理体制"},{"key":"B","text":"政府预算管理体制"},{"key":"C","text":"国有资产收益管理体制"},{"key":"D","text":"公共部门财务管理体制"}],"answer":["C"],"explanation":"本题考查财政管理体制的含义。广义的财政管理体制包括政府预算管理体制、税收管理体制、公共部门财务管理体制等，选项A、B、D不符合题意。狭义的财政管理体制是指政府预算管理体制。国有资产管理体制是关于国有资产管理机构的设置、职责以及管理方式和方法等有关制度的总称，选项C符合题意。故本题选C选项。","id":"jichu-0112","bank":"jichu"},{"chapter":"刷章节母题 第十六章 财政管理体制 共8题","point":"财政管理体制内容与类型","type":"single","stem":"下列关于政府间财政收入划分的说法错误的是（)。","material":"","options":[{"key":"A","text":"税种属性是决定政府间财政收入划分的主要标准（ ）。"},{"key":"B","text":"政府间财政收支划分呈现的基本特征是收入结构与支出结构的对称性安排"},{"key":"C","text":"市场经济成熟国家遵循集权原则、效率原则"},{"key":"D","text":"市场经济成熟国家遵循恰当原则、收益与负担对等原则"}],"answer":["B"],"explanation":"本题考查财政管理体制内容。，税种属性是决定政府间财政收入划分的主要标准，选项A正确。政府间财政收支划分呈现的基本特征是收入结构与支出结构的非对称性安排，即收入结构划分以中央政府为主，支出结构划分以地方政府为主，选项B错误。市场经济成熟国家遵循集权原则、效率原则、恰当原则、收益与负担对等原则，选项C、D正确。人故本题选B选项。","id":"jichu-0113","bank":"jichu"},{"chapter":"刷章节母题 第十六章 财政管理体制 共8题","point":"分税制财政管理体制","type":"single","stem":"根据分税制体制规定，将同经济发展直接相关的主要税种划分为（ ）。","material":"","options":[{"key":"A","text":"中央税"},{"key":"B","text":"地方税"},{"key":"C","text":"中央地方共管税"},{"key":"D","text":"中央地方共享税"}],"answer":["D"],"explanation":"本题考查分税制财政管理体制的主要内容。 根据分税制体制规定，将同经济发展直接相关的主要税种划分为中央与地方共享 税，选项D正确，选项C错误。 将维护国家权益、实施宏观调控所必须的税种划分为中央税，选项A错误。 将适合地方征收的税种划分为地方税，并调整、充实地方税种，增加地方税收入， 选项B错误。 故本题选D选项。","id":"jichu-0114","bank":"jichu"},{"chapter":"刷章节母题 第十六章 财政管理体制 共8题","point":"分税制财政管理体制","type":"single","stem":"以下不属于我国分税制改革主要成效的是（ ）。","material":"","options":[{"key":"A","text":"建立了财政收入稳定增长机制"},{"key":"B","text":"增强了中央政府宏观调控能力"},{"key":"C","text":"促进了产业结构调整和资源优化配置"},{"key":"D","text":"加大了财政转移支付的力度，促进了中东西部地区的协调发展"}],"answer":["D"],"explanation":"本题考查分税制财政管理体制改革的主要成效。选项A、B、C不符合题意，我国分税制改革的主要成效包括：建立了财政收入稳定增长机制；增强了中央政府宏观调控能力；促进了产业结构调整和资源优化配置。故本题选D选项。","id":"jichu-0115","bank":"jichu"},{"chapter":"刷章节母题 第十六章 财政管理体制 共8题","point":"财政转移支付制度","type":"multi","stem":"关于财政转移支付的内容，说法正确的有（ ）。","material":"","options":[{"key":"A","text":"最早提出转移支付概念的是著名经济学家庇古"},{"key":"B","text":"财政转移支付制度的最基本的作用是通过财政转移支付为地方政府提供稳定的收入来源，弥补其收支差额"},{"key":"C","text":"财政转移支付具有完整性、不对称性、科学性、统一性和灵活性相结合、法制性的特点"},{"key":"D","text":"专项转移支付严格限于中央委托事务、共同事权事务、效益外溢事务和符合中央政策导向事务（"},{"key":"E","text":"我国现行的一般性转移支付包括均衡性转移支付、民族地区转移支付、县级基本财力保障机制奖补资金、调整工资转移支付、农村税费改革转移支付、资源枯竭城市转移支付等"}],"answer":["A","B","D","E"],"explanation":"本题考查财政转移支付及其特点。最早提出转移支付概念的是著名经济学家庇古，他在1928年出版的《财政学研究》中第一次使用这一概念，选项A正确。财政转移支付制度的最基本的作用是：通过财政转移支付为地方政府提供稳定的收入来源，弥补其收支差额，选项B正确。财政转移支付的特点：完整性、对称性（上级政府对下级政府转移支付的财力与能否满足该级政府承担事权职责需求相对应)、科学性、统一性和灵活性相结合、法制性，选项C错误。转移支付一般可以归结为均衡拨款与专项拨款两大类。通常情况下，对于地方事权范围的支出项目，中央政府通过一般性转移支付实施财力匹配与均衡；专项转移支付严格限于中央委托事务、共同事权事务、效益外溢事务和符合中央政策导向事务，选项D正确。 我国现行的财政转移支付由一般性转移支付和专项转移支付组成：①一般性转移 支付包括均衡性转移支付、民族地区转移支付、县级基本财力保障机制奖补资金、 调整工资转移支付、农村税费改革转移支付、资源枯竭城市转移支付等具体项目， 选项E正确；②专项转移支付重点用于教育、医疗卫生、社会保障、支农等公共 服务领域。 故本题选ABDE选项。","id":"jichu-0116","bank":"jichu"},{"chapter":"刷章节母题 第十六章 财政管理体制 共8题","point":"财政转移支付制度","type":"single","stem":"关于我国现阶段规范财政转移支付制度的任务，下列表述错误的是（ ）。","material":"","options":[{"key":"A","text":"重点增加对革命老区、民族地区、边疆地区、贫困地区的转移支付"},{"key":"B","text":"促进地区间财力均衡"},{"key":"C","text":"增加一般性转移支付规模和比例"},{"key":"D","text":"增加专项转移支付项目"}],"answer":["D"],"explanation":"本题考查规范财政转移支付制度的任务。规范财政转移支付制度的任务主要有：（1）完善一般性转移支付的稳定增长机制。增加一般性转移支付的规模和比例。促进地区财力平衡，重点增加对革命老区、民族地区、边疆地区、贫困地区的转移支付，选项A、B、C正确。（2）清理、整合、规范专项转移支付项目，大幅度减少转移支付项目，归并重复交叉的项目，逐步取消竞争性领域专项和地方资金配套，严格控制引导类、救济类、应急类专项，对保留的专项进行甄别，属于地方事务且数额相对固定的项目，划入一般性转移支付，并根据经济社会发展及时清理专项转移支付项目，选项D错误。故本题选D选项。","id":"jichu-0117","bank":"jichu"},{"chapter":"刷章节母题 第十六章 财政管理体制 共8题","point":"建立现代财政制度，合理划分中央与地方财政事权和支出责任","type":"multi","stem":"关于合理划分中央与地方财政事权和支出责任的表述正确的有（ ）。","material":"","options":[{"key":"A","text":"坚持财政事权由中央决定"},{"key":"B","text":"信息复杂且获取困难的基本公共服务优先作为地方的财政事权"},{"key":"C","text":"坚持加强中央对微观事务的直接管理"},{"key":"D","text":"按照谁的财政事权谁承担支出责任的原则，确定各级政府支出责任"},{"key":"E","text":"中央财政事权如委托地方行使，要通过中央专项转移支付安排相应的经费"}],"answer":["A","B","D","E"],"explanation":"本题考查合理划分中央与地方财政事权和支出责任。合理划分中央与地方财政事权和支出责任的总体要求之一是坚持财政事权由中央决定（选项A正确）。划分原则中，将所需信息量大、信息复杂且获取困难的基本公共服务优先作为地方的财政事权（选项B正确），提高行政效率，降低行政成本。信息比较容易获取和甄别的全国性基本公共服务宜作为中央财政事权。划分原则中，按照“谁的财政事权谁承担支出责任”的原则，确定各级政府支出责任（选项D正确）。主要内容中，完善中央与地方支出责任划分，中央的财政事权如委托地方行使，要通过中央专项转移支付安排相应的经费（选项E正确）。 总体要求中，要切实落实地方政府在中央授权范围内履行财政事权的责任，最大 限度地减少中央对微观事务的直接管理（选项B错误），发挥地方政府因地制宜 加强区域内事务管理的优势，调动和保护地方干事创业的积极性和主动性。 故本题选ABDE选项。","id":"jichu-0118","bank":"jichu"},{"chapter":"刷章节母题 第十六章 财政管理体制 共8题","point":"建立现代财政制度，合理划分中央与地方财政事权和支出责任","type":"multi","stem":"合理划分中央与地方财政事权和支出责任的原则，包括（ ）。","material":"","options":[{"key":"A","text":"体现基本公共服务受益范围"},{"key":"B","text":"兼顾政府职能和行政效率"},{"key":"C","text":"实现权、责、利相统一"},{"key":"D","text":"做到中央统筹、地方协助"},{"key":"E","text":"激励地方政府主动作为"}],"answer":["A","B","C","E"],"explanation":"本题考查合理划分中央与地方财政事权和支出责任的原则。合理划分中央与地方财政事权和支出责任的原则主要有：（1）体现基本公共服务受益范围，选项A正确。（2）兼顾政府职能和行政效率，选项B正确。（3）实现权、责、利相统一，选项C正确。（4）做到中央统筹、地方协助不是该内容，选项D错误。（5）激励地方政府主动作为，选项E正确。故本题选ABCE选项。","id":"jichu-0119","bank":"jichu"},{"chapter":"刷章节母题 第十七章 财政政策 共6题","point":"财政政策功能与目标","type":"multi","stem":"下列政策中属于财政政策的是（ ）。","material":"","options":[{"key":"A","text":"预算政策"},{"key":"B","text":"税收政策"},{"key":"C","text":"国债政策"},{"key":"D","text":"利率政策"},{"key":"E","text":"汇率政策"}],"answer":["A","B","C"],"explanation":"本题考查财政政策的含义。财政政策是一国政府为实现预期的经济社会发展目标，对财政收支关系进行调整的指导原则和措施。财政政策由预算政策、税收政策、支出政策、国债政策等组成，选项A、B、C正确。利率和汇率政策均属于货币政策，选项D、E错误。故本题选ABC选项。","id":"jichu-0120","bank":"jichu"},{"chapter":"刷章节母题 第十七章 财政政策 共6题","point":"财政政策功能与目标","type":"single","stem":"政府通过财政政策，调整社会总需求和总供给，实现总供需的总量平衡和结构平衡，进而实现国民经济的又好又快发展，这体现的是财政政策的（ ）功能。","material":"","options":[{"key":"A","text":"导向"},{"key":"B","text":"协调"},{"key":"C","text":"控制"},{"key":"D","text":"稳定"}],"answer":["D"],"explanation":"本题考查财政政策的功能。财政政策的功能包括导向、协调、控制、稳定。）（ ）。（1）导向功能是指财政政策通过财政分配和管理活动，调整人们的物质利益，进而调节企业和个人的经济行为，引导国民经济运行，选项A错误。（2）协调功能主要体现在对社会经济发展过程中，在地区之间、行业之间、部门之间等出现的某些失衡状况的调节和制约，选项B错误。（3）控制功能是指政府通过财政政策调节企业和居民等市场经济主体的经济行为，实现对经济社会的有效控制，选项C错误。（4)稳定功能是指政府通过财政政策调整社会总需求和总供给，实现供求平衡，选项D正确。故本题选D选项。","id":"jichu-0121","bank":"jichu"},{"chapter":"刷章节母题 第十七章 财政政策 共6题","point":"财政政策工具与类型","type":"multi","stem":"在经济萧条时，财政可以通过（ ）来扩大需求，刺激经济发展。","material":"","options":[{"key":"A","text":"减少福利补贴支出"},{"key":"B","text":"增加政府采购"},{"key":"C","text":"降低税率"},{"key":"D","text":"提高税率"},{"key":"E","text":"提高财政补贴"}],"answer":["B","C","E"],"explanation":"本题考查财政政策的工具。在经济萧条时期，政府通过降低税率、增加财政补贴支出使企业和个人的可支配收入增加，鼓励企业和个人的投资需求和消费需求，增加社会总需求，促进经济增长。故本题选BCE选项。","id":"jichu-0122","bank":"jichu"},{"chapter":"刷章节母题 第十七章 财政政策 共6题","point":"财政政策工具与类型","type":"multi","stem":"根据财政政策调节经济周期的作用划分，将财政政策分为（ ）。","material":"","options":[{"key":"A","text":"自动稳定的财政政策"},{"key":"B","text":"扩张性财政政策（ ）。"},{"key":"C","text":"中性财政政策"},{"key":"D","text":"紧缩性财政政策"},{"key":"E","text":"相机块择的财政政策"}],"answer":["A","E"],"explanation":"本题考查财政政策的类型。选项A、E正确，将财政政策分为自动稳定的财政政策和相机择的财政政策，是根据财政政策调节经济周期的作用来划分的。选项B、
