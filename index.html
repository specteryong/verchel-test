算机软件"},{"key":"D","text":"工程设计图"},{"key":"E","text":"地理标志"}],"answer":["A","B","C","E"],"explanation":"根据《中华人民共和国商标法》的规定，注册商标的有效期为10年，自核准注册之日起计算。注册商标有效期期满，需要继续使用的，商标注册人应当在期满前 12个月内按照规定办理续展手续；在此期间未能办理的，可以给予6个月的宽展期。每次续展注册的有效期为10年，自该商标上一届有效期满次日起计算。期满未办理续展手续的，注销其注册商标。","id":"guanfang-0631","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"multi","stem":"关于商标的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"注册商标的有效期为10 年，自核准注册之日起计算"},{"key":"B","text":"注册商标有效期期满，需要继续使用的，商标注册人应当在期满前12个月内按照规定 办理续展手续"},{"key":"C","text":"每次续展注册的有效期为10年，自该商标上一届有效期满次日起计算"},{"key":"D","text":"每次续展注册的有效期为5年，自该商标上一届有效期满次日起计算"},{"key":"E","text":"有效期满未办理续展手续的，注销其注册商标"}],"answer":["A","B","D"],"explanation":"著作权包括下列人身权和财产权：发表权、署名权、修改权、保护作品完整权、复制权、发行权、出租权、展览权、表演权、放映权、广播权、信息网络传播权、摄制权、改编权、翻译权、汇编权、应当由著作权人享有的其他权利，共计十七项权利。其中，作者的署名权、修改权、保护作品完整权的保护期不受限制。","id":"guanfang-0632","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"下列著作权中，保护期不受限制的有（ ）。","material":"","options":[{"key":"A","text":"作者的署名权"},{"key":"B","text":"作者的修改权"},{"key":"C","text":"作者的发表权"},{"key":"D","text":"作者的保护作品完整权"},{"key":"E","text":"作者的复制权"}],"answer":["C"],"explanation":"根据技术创新的新颖程度不同，技术创新分为渐进性创新和根本性创新。其中， 渐进性创新是指对现有技术的改进和完善引起的渐进性、连续性的创新。它在技术原理上没 有重大变化，只是根据市场需要对现有产品或生产工艺进行功能上的扩展和改进。","id":"guanfang-0633","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"基于技术创新的新颖程度，V公司研发的金属3D打印技术属于（ ）。","material":"经过市场分析，V公司决定研发一种金属3D打印技术满足市场需要，该技术可使生产的零部件精度更高、性能更稳定。V公司决定采用领先战略，组建专门的部门进行研发。该技术研发成功后，V公司于2024年3月16日申请实用新型专利，2025年4月17日获得授权。","options":[{"key":"A","text":"原始创新"},{"key":"B","text":"集成创新"},{"key":"C","text":"渐进性创新"},{"key":"D","text":"根本性创新"}],"answer":["B"],"explanation":"在需求拉动创新模式中，市场需求信息是技术创新活动的出发点。它对产品和技 术提出了明确的要求，通过技术创新活动，创造出适合这一需求的产品或服务。","id":"guanfang-0634","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"multi","stem":"V公司的创新活动属于（ ）。","material":"经过市场分析，V公司决定研发一种金属3D打印技术满足市场需要，该技术可使生产的零部件精度更高、性能更稳定。V公司决定采用领先战略，组建专门的部门进行研发。该技术研发成功后，V公司于2024年3月16日申请实用新型专利，2025年4月17日获得授权。","options":[{"key":"A","text":"技术推动创新模式"},{"key":"B","text":"需求拉动创新模式"},{"key":"C","text":"技术和市场交互作用创新模式"},{"key":"D","text":"A-U过程创新模式"}],"answer":["A","C"],"explanation":"采用领先战略，技术来源以自主研发为主。领先战略技术开发的重点主要涉及 产品的基本原理和功能，开发重心处于技术链的前端。领先战略要求企业必须率先开发市场， 一般是要开拓一个全新的市场。领先战略的投资重点随技术开发的进展而逐渐移动。在技术 开发阶段，投资重心在技术研究开发上；在技术开发成功后，投资重心移向生产和市场开发，但 为了维持领先性，用于后续研究开发的投资仍需保持相当大的比例。","id":"guanfang-0635","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"multi","stem":"关于领先战略的说法，正确的有（ ）。","material":"经过市场分析，V公司决定研发一种金属3D打印技术满足市场需要，该技术可使生产的零部件精度更高、性能更稳定。V公司决定采用领先战略，组建专门的部门进行研发。该技术研发成功后，V公司于2024年3月16日申请实用新型专利，2025年4月17日获得授权。","options":[{"key":"A","text":"以自主研发为主"},{"key":"B","text":"以开发细分市场为主"},{"key":"C","text":"技术开发重点是产品的基本原理和功能"},{"key":"D","text":"投资重点始终在生产和销售领域"}],"answer":["B","C"],"explanation":"《中华人民共和国专利法》规定，发明专利权的期限为20 年，实用新型专利权的 期限为10年，外观设计专利权的期限为15年，均自申请日起计算。","id":"guanfang-0636","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"关于公司获得的该项专利保护期的说法，正确的是（ ）。","material":"经过市场分析，V公司决定研发一种金属3D打印技术满足市场需要，该技术可使生产的零部件精度更高、性能更稳定。V公司决定采用领先战略，组建专门的部门进行研发。该技术研发成功后，V公司于2024年3月16日申请实用新型专利，2025年4月17日获得授权。","options":[{"key":"A","text":"保护期为20年"},{"key":"B","text":"保护期为10年"},{"key":"C","text":"保护期自2024年3月16日起"},{"key":"D","text":"保护期自2025年4月17日起"}],"answer":["B"],"explanation":"在投资项目评估中，折现现金流的判断准则是，如果项目的净现值大于0,即项目可行，否则不可行。","id":"guanfang-0637","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"根据折现现金流法，判断投资项目可行的标准是项目净现值（。","material":"","options":[{"key":"A","text":"小于０"},{"key":"B","text":"大于０"},{"key":"C","text":"大于1"},{"key":"D","text":"小于１"}],"answer":["C"],"explanation":"定量评估方法包括折现现金流法和风险分析法。","id":"guanfang-0638","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"甲企业A项目评估中使用的现金流信息是在对未来事件进行预测的基础上估计出来的，并不是实际发生值。甲企业A项目评估时采用的风险分析方法属于（ ）。","material":"","options":[{"key":"A","text":"主观分析法"},{"key":"B","text":"客观分析法"},{"key":"C","text":"定量评估方法"},{"key":"D","text":"定性评估方法"}],"answer":["B"],"explanation":"在使用动态排序列表法对项目进行决策时，首先，对各个项目分别按照不同的单一评价指标进行排序，然后，将同一项目按不同指标排序的序号进行算术平均，,得到项目的排序分值。本题中，项目甲的排序分值为（3+2+3）÷3～2.67；项目乙的排序分值为（2+3+1）3=2；项目丙的排序分值为（4+1+4）3=3；项目丁的排序分值为（1+4+2）3～2.33。项目乙的分值最低，应采用项目乙。","id":"guanfang-0639","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"某企业采用动态排序列表法对四个备选项目进行评估，评估结果见下表。则该企业应采用（ ）。","material":"","options":[{"key":"A","text":"项目甲"},{"key":"B","text":"项目乙"},{"key":"C","text":"项目丙"},{"key":"D","text":"项目丁"}],"answer":["A"],"explanation":"评分法的优点包括：①确定项目的评价标准或因素比较灵活，可以根据项目的实际情况来确定。②权重的确定比较容易和灵活。③评价结果为一个综合指标，因此便于对项目进行排序比较。④既可以考虑财务指标，又可以考虑非财务指标。③简单、易于操作。其缺点包括：①结果算出的综合指标的实际意义不明确。②不能提供和比较不同结果出现的可能性。③不同的因素或评判标准之间可能具有较强的相关性，互相不独立，因而导致对同一方面因素的重复考虑。④权重确定或评分过程中的主观性较强。","id":"guanfang-0640","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"multi","stem":"评分法是一种技术创新决策评估的方法，下列关于评分法的说法中，错误的是（ ）。","material":"","options":[{"key":"A","text":"结果算出的综合指标的实际意义明确"},{"key":"B","text":"权重的确定比较容易和灵活"},{"key":"C","text":"不同的因素或评判标准之间互相不独立"},{"key":"D","text":"既可以考虑财务指标，又可以考虑非财务指标"}],"answer":["B","D"],"explanation":"轮廓图法和检查清单法都需要先确定一组评价研发项目的关键因素。轮廓图法只能提供每个项目的绩效轮廊，不能对每个项目给出一个综合性的指标；检查清单法尽管可以通过加总令人满意的因素个数给出一个综合指标，但这种方法没有考虑每个因素的重要程度，评估精准度较差。","id":"guanfang-0641","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"multi","stem":"关于轮廓图法和检查清单法的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"轮廓图法能提供每个项目的绩效轮廓，对每个项目给出一个综合性的指标"},{"key":"B","text":"检查清单法考虑了每个因素的重要程度，评估精准度较好"},{"key":"C","text":"检查清单法可以通过加总令人满意的因素个数给出一个综合指标"},{"key":"D","text":"两种方法都需要先确定一组评价研发项目的关键因素"}],"answer":["B","C","D"],"explanation":"定性评估方法包括轮廓图法、检查清单法、评分法和动态排序列表法。","id":"guanfang-0642","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"下列评估方法中，属于定性评估方法的有（ ）。","material":"","options":[{"key":"A","text":"矩阵法"},{"key":"B","text":"轮廓图法"},{"key":"C","text":"检查清单法"},{"key":"D","text":"评分法"},{"key":"E","text":"动态排序列表法"}],"answer":["D"],"explanation":"风险－收益气泡图有珍珠、面包和黄油、白象、牡蛎四类项目，其中，面包和黄油型项目预期收益不高，但企业通过不断改进产品或工艺，通过市场细分吸引新客户，可以为企业 提供稳定的收人，是企业重要的短期现金流来源。","id":"guanfang-0643","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"根据风险－收益气泡图，属于企业短期现金来源的项目是（ ）。","material":"","options":[{"key":"A","text":"牡蛎项目"},{"key":"B","text":"白象项目"},{"key":"C","text":"珍珠项目"},{"key":"D","text":"面包和黄油项目"}],"answer":["C"],"explanation":"风险－收益气泡图中，牡蛎项目通常是一些需要长远规划、具有探索性的研发项目，虽然潜在收益很高，但是开发成功的可能性较小、风险较大。","id":"guanfang-0644","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"multi","stem":"某技术项目潜在收益很高，但开发成功的可能性较小、风险较大。根据风险一收益气泡图，该项目属于（ ）项目。","material":"","options":[{"key":"A","text":"珍珠型"},{"key":"B","text":"面包和黄油型"},{"key":"C","text":"牡蛎型"},{"key":"D","text":"白象型"}],"answer":["A","C"],"explanation":"风险－收益气泡图的四个象限分别是珍珠、面包和黄油、白象、牡蛎。①珍珠：这类项目具有较高的预期收益和很高的开发成功概率，项目的风险较小，属于比较有潜力的明星项目。②面包和黄油：这类项目较小、技术上比较简单，技术风险小；开发成功率较高，但预期收益不是很好。③白象：这类项目通常不仅开发风险较大，而且预期效益不好，不值得进行投资和开发。④牡蛎:这类项目通常是一些需要长远规划、具有探索性的研发项目。在这四类项目中，面包和黄油型项目预期收益不高，但企业通过不断改进产品或工艺，通过市场细分吸引新客户，可以为企业提供稳定的收人，是企业重要的短期现金流来源。珍珠型项目能够帮助企业开拓新市场、扩展新业务，为企业带来高额利润，是企业快速发展的动力。牡蛎型项目则是企业根据长期技术发展战略对新兴或突破性技术的研究和开发项目，是企业长期竞争优势的源泉。白象型项目消耗技术资源，却不能给企业带来预期利益，应该终止或排除。","id":"guanfang-0645","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"multi","stem":"关于风险－收益气泡图的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"面包和黄油型项目预期收益低、开发成功率较高"},{"key":"B","text":"白象型项目预期收益高、开发成功率较低"},{"key":"C","text":"珍珠型项目能为企业带来高额利润"},{"key":"D","text":"白象型项目是重要的短期现金流来源"},{"key":"E","text":"牡蛎型项目是企业长期竞争优势的源泉"}],"answer":["B","D"],"explanation":"矩阵法的产生基于以下认识：技术变迁的路径和周期总体上而言是可以预见的；成功的技术管理的基石是技术战略；企业制定技术战略时需要了解自身的技术能力和分析不同技术在行业发展中的地位。在分析技术组合时，要对企业的每一项重要技术从两个维度进行分析，一个维度代表某一具体技术对行业发展的重要性，另一个维度表示企业在此技术上的投资和相对竞争地位。","id":"guanfang-0646","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"用矩阵法分析技术组合时，采用的维度包括（ ）。","material":"","options":[{"key":"A","text":"技术的可模仿性"},{"key":"B","text":"技术对行业发展的重要性"},{"key":"C","text":"技术的复杂性"},{"key":"D","text":"技术上的投资和相对竞争地位"},{"key":"E","text":"技术的兼容性"}],"answer":["C"],"explanation":"成本模型的公式为:P=(C+V)B。式中,P为技术商品的评估价格;C为技术开发中的物质消耗；V为技术开发中的人力消耗;β为技术复杂系数（β>1);为研究开发的风险概率(失败概率)。 代人数据，该技术成果的价格=(400+500)×1.3=1950(万元)。单（大效概单。代效据，以技不成来的价格一1-40%一15方","id":"guanfang-0647","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"某企业拟开发一项新技术，经评估，预计该技术开发的物质消耗为 400","material":"","options":[{"key":"A","text":"702"},{"key":"B","text":"1154"},{"key":"C","text":"1950"},{"key":"D","text":"1500"}],"answer":["B"],"explanation":"市场模拟模型的公式为:P=Po×a×b×c。式中,P为技术商品的评估价格;P。为类似技术的实际交易价格;a为技术性能修正系数;b为时间修正系数;c为技术寿命修正系数。代人数据，甲企业购买该项技术发明的评估价格=600×1.15×1.1×1.2=910.8（万元）。","id":"guanfang-0648","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"甲企业拟引进乙企业的某项技术发明，经专家调查评估，类似技术的实际交易价格为 600万元，技术性能修正系数为1.15,时间修正系数为1.1,技术寿命修正系数为","material":"","options":[{"key":"A","text":"522.7"},{"key":"B","text":"910.8"},{"key":"C","text":"828"},{"key":"D","text":"759"}],"answer":["B"],"explanation":"效益模型的公式为:P=_B)。 式中,P为技术商品的评估价格;B,为第1 年被","id":"guanfang-0649","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"为提高生产效率，甲企业拟向一家科研机构购买一项新的生产技术。经预测，该技术可再使用5年，采用该技术后，甲企业每件产品价格比同类产品可提高30元，预计未来5年产品的销量分别是8万件、8万件、7万件、7万件、8万件。根据行业投资收益率，折现率确定为10%,复利现值系数见下表。根据效益模型，该项新技术的价格为（ ）万元。","material":"","options":[{"key":"A","text":"930.37"},{"key":"B","text":"866.58"},{"key":"C","text":"756.78"},{"key":"D","text":"1050.67"}],"answer":["D"],"explanation":"效盖模型的式为：1-台（1+i）：°式，1为技不简品的计后相，D为第年设评估技术所产生的经济效益；i为折现率;n为被评估技术的寿命。代人数据，该项新技术的价格 =30 ×8 ×0.909+30 ×8×0.826+30×7×0.751+30×7×0.683+30 ×8×0.621=866.58(万元)。","id":"guanfang-0650","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"single","stem":"）是结构最为简单、行动最为灵活的创新组织形式。","material":"","options":[{"key":"A","text":"内企业"},{"key":"B","text":"技术创新小组"},{"key":"C","text":"新事业发展部"},{"key":"D","text":"企业技术中心"}],"answer":["A"],"explanation":"内企业由少数几个人组成，基本上没有分工，自主决策、自主开发，而且其运作方式多是非正式的。内企业是结构最简单、行动最灵活的创新组织形式。","id":"guanfang-0651","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"single","stem":"关于企业技术创新内部组织模式的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"内企业家的活动局限在企业内部"},{"key":"B","text":"技术创新小组拥有较大的决策权，只接受企业最高层的领导"},{"key":"C","text":"新事业发展部更接近“自由人联合体”,成员更容易具有认同感"},{"key":"D","text":"企业技术中心一般采取直线型组织架构"}],"answer":["A"],"explanation":"新事业发展部拥有很大的决策权，只接受企业最高层的领导。技术创新小组的优点之一是小组接近“自由人联合体”,成员更容易产生认同感、归属感、成就感，具有更多的自由意识。企业技术中心一般采取矩阵式组织架构。内企业家与企业家的根本不同在于，内企业家的活动局限在企业内部。","id":"guanfang-0652","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"single","stem":"企业为了鼓励创新，允许自已的员工在一定时间内离开本岗位工作，从事自己感兴趣的创新活动，这种技术创新组织模式称为（ ）。","material":"","options":[{"key":"A","text":"内企业"},{"key":"B","text":"技术创新小组"},{"key":"C","text":"新事业发展部"},{"key":"D","text":"企业技术中心"}],"answer":["A"],"explanation":"企业为了鼓励创新，允许自已的员工在一定限度的时间内离开本岗位工作，从事自已感兴趣的创新活动，并且可以利用企业的现有条件，如资金、设备等。由于这些员工的创新行为颇具企业家的特征，而创新的风险和收益均由所在企业承担，因此称这些从事创新活动的员工为“内企业家”，由内企业家创建的企业称为“内企业”。","id":"guanfang-0653","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"multi","stem":"企业技术创新的内部组织模式有（ ）。","material":"","options":[{"key":"A","text":"内企业"},{"key":"B","text":"企业联盟"},{"key":"C","text":"技术创新小组"},{"key":"D","text":"新事业发展部"},{"key":"E","text":"企业技术中心"}],"answer":["A","C","D","E"],"explanation":"企业作为技术创新的主体，必须在内部形成一整套技术创新体系，以及与企业战略、技术、规模以及人员素质相适应的技术创新组织模式。企业技术创新的内部组织模式包括：①内企业。②技术创新小组。③新事业发展部。④企业技术中心。","id":"guanfang-0654","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"multi","stem":"关于技术创新小组的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"技术创新小组是一个封闭性组织"},{"key":"B","text":"技术创新小组是指为完成某一创新项目临时从各部门抽调若干专业人员而成立的一 种创新组织"},{"key":"C","text":"技术创新小组成员少，工作效率高"},{"key":"D","text":"成员自主决定工作方式"},{"key":"E","text":"组织形式是一种典型的简单矩阵式结构"}],"answer":["B","C","D","E"],"explanation":"技术创新小组是指为完成某一创新项目，临时从各部门抽调若干专业人员而成立的一种创新组织。其主要特点是：①技术创新小组是针对复杂的技术创新项目中的技术难题或较简单小型的技术项目而成立的，组成人员少，工作效率高。②一般情况下，技术创新小组可由企业研究开发、生产、营销和财务等部门的人员组成，这些人员在一定时期内脱离原部门工作，完成创新任务之后，小组就随之解散。③技术创新小组是一个开放性组织，小组成员随着技术项目的需要增加或减少。④技术创新小组具有明确的创新目标和任务，企业高层主管对创新小组充分授权，完全由创新小组成员自主决定工作方式。③小组成员既要接受原部门的领导，又要接受技术创新小组的领导，其组织形式是一种典型的简单矩阵式结构。③技术创新小组成员之间不存在严格意义上的上下级关系，而是工作中的协作与合作关系，多为扁平型结构。因此，技术创新小组是一二个自由联合体，可以消除由于职能部门分工不同而造成的跨部门的效率损失，而且体制灵活，是最适合中小企业的一种技术创新组织模式。","id":"guanfang-0655","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"multi","stem":"关于新事业发展部的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"大企业为了开创全新事业而单独设立的组织形式"},{"key":"B","text":"全新事业可能是重大的产品创新，也可能是全新的工艺创新 .新事业发展部是一种临时性的组织"},{"key":"C","text":"新事业发展部拥有很大的决策权，只接受企业最高层的领导"},{"key":"D","text":"在设立新事业发展部以后，企业应该充分集权"}],"answer":["A","B","D"],"explanation":"新事业发展部是大企业为了开创全新事业而单独设立的组织形式，是独立于现有企业运行体系之外的分权组织。全新事业可能是重大的产品创新，也可能是全新的工艺创新。新事业发展部拥有很大的决策权，只接受企业最高层的领导。这类组织是一种固定性的组织，多数由若干部门抽调专人组成，是企业进入新的技术领域和产业领域的重要方式之一。新事业发展部的设立和发展，为企业开展多元化经营提供了组织支持，也为企业进行重大创新 提供了一种适宜的组织环境。因此，在设立新事业发展部以后，企业应该充分授权，使其创新 活动更加高效。","id":"guanfang-0656","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"single","stem":"某体育用品公司在全国范围筛选了100多家代工厂，代工厂严格按照该公司的标准进行生产，而公司将资源和精力集中在研发、设计、营销等环节。该公司与代工厂组成的企业联盟是（ ）。","material":"","options":[{"key":"A","text":"星形模式"},{"key":"B","text":"联邦模式"},{"key":"C","text":"平行模式"},{"key":"D","text":"科层模式"}],"answer":["A"],"explanation":"星形模式是一种有盟主的企业联盟组织形式。盟主企业负责制定联盟的运行规则，并负责协调各个伙伴之间的关系，负责在伙伴之间出现冲突时做出合理仲裁。垂直供应链型企业适宜采用星形模式。例如，公司与其遍布全球的代工厂组成的企业联盟就是一种星形联盟，公司是盟主企业，负责管理遍布全球的生产商。","id":"guanfang-0657","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"single","stem":"企业联盟的主要形式是（ ）。","material":"","options":[{"key":"A","text":"产品联盟"},{"key":"B","text":"技术联盟"},{"key":"C","text":"行业标准联盟"},{"key":"D","text":"知识联盟"}],"answer":["B"],"explanation":"企业联盟也称动态联盟或虚拟企业，其主要形式是技术联盟。","id":"guanfang-0658","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"single","stem":"企业联盟中，某一企业制定原材料采购标准，其他企业依据该标准进行采购，这种企业联盟的组织运行模式是（ ）。","material":"","options":[{"key":"A","text":"平行模式"},{"key":"B","text":"星形模式"},{"key":"C","text":"并行模式"},{"key":"D","text":"联邦模式"}],"answer":["B"],"explanation":"星形模式是一种有盟主的企业联盟组织模式。这类联盟一般由占主导地位的盟主企业和一些相对固定的伙伴（如供应商）组成。盟主企业负责制定联盟的运行规则，并负责协调各个伙伴之间的关系，负责在伙伴之间出现冲突时作出合理仲裁。","id":"guanfang-0659","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"single","stem":"各联盟伙伴之间的地位平等、独立的企业联盟组织运行模式是（ ）。","material":"","options":[{"key":"A","text":"平行模式"},{"key":"B","text":"星形模式"},{"key":"C","text":"扁平模式"},{"key":"D","text":"联邦模式"}],"answer":["A"],"explanation":"平行模式的企业联盟由多个实力较强且较均衡的优势互补企业或同类企业依据一定的市场机制共同组建，没有盟主企业，没有核心企业，企业间没有明显的主从关系，合作伙伴地位平等、独立。","id":"guanfang-0660","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"single","stem":"企业联盟中，联邦模式的联盟核心是（ ）。","material":"","options":[{"key":"A","text":"盟主企业"},{"key":"B","text":"联盟协调委员会"},{"key":"C","text":"核心团队"},{"key":"D","text":"外围企业"}],"answer":["C"],"explanation":"联邦模式的联盟核心是核心团队，由具备核心能力的企业联合组成。","id":"guanfang-0661","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"single","stem":"关于企业联盟的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"企业联盟有利于降低技术创新风险"},{"key":"B","text":"联邦模式可用于高新技术产品的快速开发"},{"key":"C","text":"平行模式的核心是盟主企业"},{"key":"D","text":"星形模式适用于垂直供应链型企业"}],"answer":["C"],"explanation":"企业联盟突破了企业规模对技术创新的限制，有助于利用聚合知识，激发创新灵感，分散研发成本，缩短研发时间，提高技术创新成功率，降低技术创新风险。联邦模式可用于高新技术产品的快速开发。平行模式由多个实力较强且较均衡的优势互补企业或同类企业依据一定的市场机制共同组建，没有盟主企业，没有核心企业，企业间没有明显的主从关系。星形模式是一种有盟主的企业联盟组织形式。这类联盟一般由占主导地位的盟主企业和一些相对固定的伙伴（如供应商）组成。垂直供应链型企业适宜采用星形模式。","id":"guanfang-0662","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"multi","stem":"企业联盟的组织运行模式主要有（ ）。","material":"","options":[{"key":"A","text":"网状模式"},{"key":"B","text":"星形模式"},{"key":"C","text":"矩阵模式"},{"key":"D","text":"平行模式"},{"key":"E","text":"联邦模式"}],"answer":["B","D","E"],"explanation":"企业联盟的组织运行模式主要有星形模式、平行模式和联邦模式三种类型。","id":"guanfang-0663","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"multi","stem":"企业技术创新的外部组织模式有（ ）。","material":"","options":[{"key":"A","text":"产学研合作模式"},{"key":"B","text":"企业技术中心"},{"key":"C","text":"企业－政府模式"},{"key":"D","text":"技术创新小组"},{"key":"E","text":"企业联盟"}],"answer":["A","C","E"],"explanation":"企业技术创新的外部组织模式包括产学研合作模式、企业－政府模式和企业联盟。企业技术中心和技术创新小组属于企业技术创新的内部组织模式。","id":"guanfang-0664","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"single","stem":"甲企业出资2000万元在某研究院设立实验室，研发工业机器人，这种研发模式属于（ ）。","material":"","options":[{"key":"A","text":"自主研发"},{"key":"B","text":"委托研发"},{"key":"C","text":"合作研发"},{"key":"D","text":"研发外包"}],"answer":["C"],"explanation":"从研发主体和技术来源来看，企业研发主要分为自主研发、合作研发和委托研发三种。其中，合作研发是指企业、科研院所、高等院校、行业基金会和政府等组织机构，为了克服研发中的高额投入和不确定性，规避风险，缩短产品的研发周期，应对紧急事件的威胁，节约交易成本而结成伙伴关系，共同研发。","id":"guanfang-0665","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"single","stem":"A公司与B公司签订协议，由B公司独立按照协议相关内容完成某项技术的研发，A公司按照协议支付相应的资金并享用研发成果，这种研发模式属于（ ）。","material":"","options":[{"key":"A","text":"自主研发"},{"key":"B","text":"合作研发"},{"key":"C","text":"委托研发"},{"key":"D","text":"内部研发"}],"answer":["C"],"explanation":"委托研发又称研发外包，即企业将所需要技术的研发工作通过协议委托给外部的企业或机构来完成。受托方投入研发的知识和技术，委托方投入资金。委托方与受托方就具体研发工作达成协议，委托方不参与研发的具体过程，但最后享用研发成果、实现创新目标。","id":"guanfang-0666","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"single","stem":"运用新材料、采用新设计开发创造满足市场需求的新产品的开发研究是","material":"","options":[{"key":"A","text":"工艺改造"},{"key":"B","text":"基础研究"},{"key":"C","text":"应用研究"},{"key":"D","text":"新产品开发"}],"answer":["D"],"explanation":"开发研究一般包括新产品开发与工艺改造两大类。其中，新产品开发是根据应用研究的成果以及市场的需求，运用新材料、采用新设计开发创造满足市场需求的新产品；工艺改造是为了降低生产制造成本、提高产品的性能和质量，采用新的知识与技术，追求更经济的方法改进现有产品的研究。","id":"guanfang-0667","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"multi","stem":"关于企业不同研发模式特点的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"对于自主研发，企业的资金负担较大"},{"key":"B","text":"委托研发有助于企业形成自己独特的产品或技术"},{"key":"C","text":"合作研发可以分散风险"},{"key":"D","text":"自主研发不需要企业投入太多的精力"},{"key":"E","text":"自主研发的商品化速度相对较慢"}],"answer":["A","C","E"],"explanation":"从研发主体以及技术来源来看，企业研发主要有自主研发、合作研发和委托研发 三种模式。自主研发有助于企业形成自己独特的产品或技术；委托研发不需要企业投入太多 精力。","id":"guanfang-0668","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第三节技术创新组织与研发管理","point":"","type":"multi","stem":"合作研发的组织方式通常包括（ ）。","material":"","options":[{"key":"A","text":"联合开发"},{"key":"B","text":"建立联盟"},{"key":"C","text":"企业技术小组"},{"key":"D","text":"共建机构"},{"key":"E","text":"项目合作"}],"answer":["A","B","D","E"],"explanation":"合作研发通常有四种组织方式，即联合开发、建立联盟、共建机构和项目合作。","id":"guanfang-0669","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第四节企业管理创新","point":"","type":"single","stem":"下列选项中，不属于管理创新主体的是（ ）。","material":"","options":[{"key":"A","text":"企业家"},{"key":"B","text":"管理者"},{"key":"C","text":"股东"},{"key":"D","text":"员工"}],"answer":["C"],"explanation":"管理创新的主体是指管理创新过程的参与者和管理创新活动的承担者。对企业来说，管理创新的主体包括企业家、管理者和员工，他们各自在管理创新中扮演着不同的角色，承担着不同的职能。","id":"guanfang-0670","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第四节企业管理创新","point":"","type":"single","stem":"企业的管理创新面临很多不确定性因素，任何一方面出问题都可能导致失败。这体现了管理创新的（ ）。","material":"","options":[{"key":"A","text":"风险性"},{"key":"B","text":"全员性"},{"key":"C","text":"基础性"},{"key":"D","text":"动态性"}],"answer":["A"],"explanation":"管理创新的风险性是企业各类创新的共同特征，创新是基于对未来的预测而做出的改变，包含许多不确定性因素，这种不确定性使管理创新必然具有风险。","id":"guanfang-0671","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第四节企业管理创新","point":"","type":"single","stem":"管理创新需要随着内外部环境的变化而持续进行，这体现了管理创新的","material":"","options":[{"key":"A","text":"基础性"},{"key":"B","text":"风险性"},{"key":"C","text":"系统性"},{"key":"D","text":"动态性"}],"answer":["D"],"explanation":"创新是一个不断变化的过程，具有动态性的特征。同时，管理活动也是与时俱进的，需要不断随着内外部环境的改变而改变，否则面对激烈多变的竞争环境，一成不变的企业将会遭受被淘汰的命运。","id":"guanfang-0672","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第四节企业管理创新","point":"","type":"multi","stem":"关于管理创新与技术创新的关系的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"技术创新是管理创新的前提"},{"key":"B","text":"管理创新决定技术创新的方向"},{"key":"C","text":"技术创新与管理创新相互制约"},{"key":"D","text":"管理创新有助于促进技术创新"},{"key":"E","text":"技术创新与管理创新相互依存"}],"answer":["C","D","E"],"explanation":"管理创新与技术创新的关系可以描述为：一方面，管理创新是技术创新的前提，没有高效的管理，就不可能产生技术创新，而技术创新为管理开辟了新的领域和局面，对管理提出了更多的要求，促进了新一轮管理创新的出现，没有技术创新就没有企业的发展，就没有管理创新，技术创新与管理创新相互依存；另一方面，对企业而言，所有的技术创新都是在管理下实现的，落后的管理系统中很难产生先进的技术，先进的管理促进技术创新，管理系统从体制、组织、战略、领导、环境、运作方式和资源配置效率等方面为技术创新提供保证。从这个意义上讲，技术创新与管理创新又相互制约。 者共同发挥作用。外部动因主要源自企业外部环境的变化。其中，自然条件的约束是指自 然资源日益短缺，运营成本日趋提高，环境污染日益严重，政府对自然资源的干预、对生态环 境的治理不断加强，迫使企业进行管理创新，从根本上解决企业生产与环境保护不协调的 问题。","id":"guanfang-0673","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第四节企业管理创新","point":"","type":"single","stem":"下列因素中，属于管理创新外部动因的是（ ）。","material":"","options":[{"key":"A","text":"环境污染"},{"key":"B","text":"超额利润"},{"key":"C","text":"股权激励"},{"key":"D","text":"责任感"}],"answer":["D"],"explanation":"管理创新的内部动因是指管理创新主体内在激发创新的因素，主要是由管理创新的主体对成就、自我价值、责任、经济效益等方面的追求而产生的。管理创新行为的动因主要包括自我价值实现、责任感和经济性动机。","id":"guanfang-0674","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第四节企业管理创新","point":"","type":"multi","stem":"下列因素中，属于管理创新内部动因的是（ ）。","material":"","options":[{"key":"A","text":"经济的发展变化"},{"key":"B","text":"环境污染"},{"key":"C","text":"科学技术的发展"},{"key":"D","text":"自我价值的实现"}],"answer":["A","B","C","D"],"explanation":"管理创新的外部动因主要包括：①社会文化环境的变迁。②经济的发展变化。③自然条件的约束。④科学技术的发展。","id":"guanfang-0675","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第四节企业管理创新","point":"","type":"single","stem":"下列因素中，属于管理创新外部动因的有（ ）。","material":"","options":[{"key":"A","text":"社会文化环境的变迁"},{"key":"B","text":"经济的发展变化"},{"key":"C","text":"自然条件的约束"},{"key":"D","text":"科学技术的发展"},{"key":"E","text":"经济性动机"}],"answer":["D"],"explanation":"管理制度创新涉及企业管理制度的诸多方面，如人力资源管理制度、财务管理制度、生产管理制度等。“以岗定级、以级定薪、人岗匹配、易岗易薪”是对公司薪酬管理的系统性规则和流程的重新设计，属于管理制度层面的创新。","id":"guanfang-0676","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第四节企业管理创新","point":"","type":"multi","stem":"某公司创新性地建立起了基于职位的“以岗定级、以级定薪、人岗匹配易岗易薪”薪酬管理体系，这种创新属于（。","material":"","options":[{"key":"A","text":"管理理念创新"},{"key":"B","text":"管理组织创新"},{"key":"C","text":"管理方式方法创新"},{"key":"D","text":"管理制度创新"}],"answer":["B","C","D"],"explanation":"管理方式方法创新主要有以下五种情况：①采用一种新的管理手段。②实行一 种新的管理方式。③提出一种新的资源利用措施。④采用一种更有效的业务流程。③创设一 种新的工作方式。","id":"guanfang-0677","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第四节企业管理创新","point":"","type":"multi","stem":"下列创新中，属于管理方式方法创新的有（ ）。","material":"","options":[{"key":"A","text":"重新构建组织结构"},{"key":"B","text":"采用一种新的管理手段"},{"key":"C","text":"提出一种新的资源利用措施"},{"key":"D","text":"采用一种更有效的业务流程"},{"key":"E","text":"采用一种新的管理理念"}],"answer":["A","B","D"],"explanation":"管理创新中的各种管理制度、管理方法的创新都离不开管理理念的创新，都以理念的创新为依托。管理组织创新的内容包括重新建构组织内成员的责权利关系。引人企业资源计划（ERP）属于管理方式方法创新。管理制度创新涉及人力资源制度、财务管理制度、生产管理制度等方面。","id":"guanfang-0678","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第四节企业管理创新","point":"","type":"single","stem":"关于管理创新的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"管理理念创新是管理创新的主要领域之一"},{"key":"B","text":"管理组织创新的内容包括重新构建组织内成员的责权利关系"},{"key":"C","text":"引人企业资源计划（ERP）属于管理制度创新"},{"key":"D","text":"引人企业资源计划（ERP）属于管理方式方法创新"},{"key":"E","text":"推出新的人力资源管理制度属于管理组织创新"}],"answer":["C"],"explanation":"产学研合作按合作主体的关系可分为校内产学研合作模式、双向联合体合作模式、多向联合体合作模式、中介协调型合作模式。其中，多向联合体合作模式以三主体为主要形式，三主体包括技术成果方（学校）、出资方（金融机构或社会资本投资者）与生产经营企业。","id":"guanfang-0679","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第四节企业管理创新","point":"","type":"single","stem":"甲企业与M高校和N投资公司采用的产学研合作模式为（ ）。","material":"基于市场上的竞争现状和客户需求，甲企业与M高校、N投资公司签订合作协议：甲企业负责生产，M高校提供技术，N投资公司出资，三方共同研发一种新型材料生产技术。经测算，该技术研发的物质消耗为500万元，人力资本消耗为700万元，技术复杂系数为1.2,研发失败的概率为 40%。两年后，该技术研发成功。合作三方于 2024 年8月10日提交发明专利申请，2026年3月12日获得国家知识产权局授权。运用该技术后，甲企业生产的新型材料性能显著优于同类产品。为进一步提升竞争力，甲企业一方面采用新设备改进生产线；另一方面推进管理创新，重塑业务流程，调整职能结构与机构设置。","options":[{"key":"A","text":"校内产学研合作模式"},{"key":"B","text":"双向联合体合作模式"},{"key":"C","text":"多向联合体合作模式"},{"key":"D","text":"中介协调型合作模式"}],"answer":["C"],"explanation":"成本模型的公式为:P=（C+V)B。式中,P为技术商品的评估价格;C为技术开（2成本模型的公式为：F-一1-一。式中，F为技术商器的评估价格；为技不发中的物质消耗；V为技术开发中的人力消耗;β为技术复杂系数（β>1）；为研究开发的风险概率（失败概率)。代人数据，该新型材料生产技术的评估价格=（500+700）×1.2÷（1-40%）=2400（万元）。","id":"guanfang-0680","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第四节企业管理创新","point":"","type":"multi","stem":"根据成本模型，该新型材料生产技术的评估价格为（ ）万元。","material":"基于市场上的竞争现状和客户需求，甲企业与M高校、N投资公司签订合作协议：甲企业负责生产，M高校提供技术，N投资公司出资，三方共同研发一种新型材料生产技术。经测算，该技术研发的物质消耗为500万元，人力资本消耗为700万元，技术复杂系数为1.2,研发失败的概率为 40%。两年后，该技术研发成功。合作三方于 2024 年8月10日提交发明专利申请，2026年3月12日获得国家知识产权局授权。运用该技术后，甲企业生产的新型材料性能显著优于同类产品。为进一步提升竞争力，甲企业一方面采用新设备改进生产线；另一方面推进管理创新，重塑业务流程，调整职能结构与机构设置。","options":[{"key":"A","text":"1200"},{"key":"B","text":"1440"},{"key":"C","text":"2400"},{"key":"D","text":"3600"}],"answer":["B","C"],"explanation":"《中华人民共和国专利法》规定，发明专利权的期限为20 年，自申请日起计算。本题中，合作三方于2024年8月10日提交发明专利申请，所以有效期自2024年8月10日起计算，有效期是20年。","id":"guanfang-0681","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第四节企业管理创新","point":"","type":"multi","stem":"关于该新型材料生产技术发明专利权有效期的说法，正确的有（ ）。","material":"基于市场上的竞争现状和客户需求，甲企业与M高校、N投资公司签订合作协议：甲企业负责生产，M高校提供技术，N投资公司出资，三方共同研发一种新型材料生产技术。经测算，该技术研发的物质消耗为500万元，人力资本消耗为700万元，技术复杂系数为1.2,研发失败的概率为 40%。两年后，该技术研发成功。合作三方于 2024 年8月10日提交发明专利申请，2026年3月12日获得国家知识产权局授权。运用该技术后，甲企业生产的新型材料性能显著优于同类产品。为进一步提升竞争力，甲企业一方面采用新设备改进生产线；另一方面推进管理创新，重塑业务流程，调整职能结构与机构设置。","options":[{"key":"A","text":"有效期为10年"},{"key":"B","text":"有效期自2024年8月10日起计算"},{"key":"C","text":"有效期为20年"},{"key":"D","text":"有效期自2026年3月12日起计算"}],"answer":["A","C"],"explanation":"根据技术创新对象的不同，技术创新可分为产品创新和工艺创新。工艺创新是指产品的生产技术变革，其成果包括新工艺、新设备和新组织管理方式，案例中的这种技术创新属于工艺创新。根据技术创新模式的不同，技术创新分为原始创新，集成创新和引进、消化吸收再创新三种模式。其中，原始创新活动主要集中在基础科学和前沿技术领域。原始创新是为未来发展奠定坚实基础的创新，其本质属性是原创性和第一性。案例中提到改进生产线不是原始创新。根据技术创新的新颖程度不同，技术创新分为渐进性创新和根本性创新。其中，渐进性创新是指对现有技术的改进和完善引起的渐进性、连续性的创新。它在技术原理上没有重大变化，只是根据市场需要对现有产品或生产工艺进行功能上的扩展和改进。甲企业对该新型材料生产线的改进属于渐进性创新。技术推动创新模式的基本观点是研究开发是创新构思的主要来源。甲企业基于市场上的竞争现状和客户需求，对现有生产线进行改进的技术创新不符合技术推动创新模式的特征。","id":"guanfang-0682","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第四节企业管理创新","point":"","type":"single","stem":"甲企业对该新型材料生产线的改进是一种技术创新，关于这种技术创新的说法，正确 的有（)。","material":"基于市场上的竞争现状和客户需求，甲企业与M高校、N投资公司签订合作协议：甲企业负责生产，M高校提供技术，N投资公司出资，三方共同研发一种新型材料生产技术。经测算，该技术研发的物质消耗为500万元，人力资本消耗为700万元，技术复杂系数为1.2,研发失败的概率为 40%。两年后，该技术研发成功。合作三方于 2024 年8月10日提交发明专利申请，2026年3月12日获得国家知识产权局授权。运用该技术后，甲企业生产的新型材料性能显著优于同类产品。为进一步提升竞争力，甲企业一方面采用新设备改进生产线；另一方面推进管理创新，重塑业务流程，调整职能结构与机构设置。","options":[{"key":"A","text":"根据技术创新对象的不同，这种技术创新属于工艺创新"},{"key":"B","text":"根据技术创新模式的不同，这种技术创新属于原始创新"},{"key":"C","text":"根据技术创新的新颖程度的不同，这种技术创新属于渐进性创新"},{"key":"D","text":"这种技术创新属于技术推动创新模式"}],"answer":["B"],"explanation":"管理组织创新是指企业通过打破或调整原有的管理组织结构，并对组织内成员的责、权、利关系加以重新构建，使组织的功能得到发展，从而获得更好的效益。管理组织创新包括组织体制、职能结构、机构设置、横向协调等方面的创新。案例中提到“重塑业务流程，调整","id":"guanfang-0683","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第一节人力资源规划","point":"","type":"single","stem":"根据企业现状制定人员的提升政策属于（ ）。","material":"","options":[{"key":"A","text":"补充规划"},{"key":"B","text":"晋升规划"},{"key":"C","text":"配备规划"},{"key":"D","text":"薪酬规划"}],"answer":["B"],"explanation":"晋升规划就是根据企业的人员分布状况、层级结构、发展趋势和人才价值观等，制定人员的提升政策。","id":"guanfang-0684","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第一节人力资源规划","point":"","type":"single","stem":"企业为中长期的发展所需补充的职位空缺而事先准备人才的活动，属于","material":"","options":[{"key":"A","text":"培养开发规划"},{"key":"B","text":"补充规划"},{"key":"C","text":"员工职业生涯规划"},{"key":"D","text":"配备规划"}],"answer":["A"],"explanation":"培养开发规划是为了企业中长期的发展所需补充的职位空缺而事先准备人才，使人岗之间持续匹配和开发储备人才而进行的活动。","id":"guanfang-0685","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第一节人力资源规划","point":"","type":"single","stem":"配备规划中，纵向流动指的是（ ）。","material":"","options":[{"key":"A","text":"轮岗交流"},{"key":"B","text":"职位层级的升降"},{"key":"C","text":"外部招聘"},{"key":"D","text":"岗位平调"}],"answer":["B"],"explanation":"配备规划指的是对企业内部人员未来岗位作出的统筹安排，包括纵向流动和横向流动两种情况，前者指职位层级的升降，后者指同层级间的岗位平调与轮岗交流。","id":"guanfang-0686","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第一节人力资源规划","point":"","type":"multi","stem":"下列选项中，属于人力资源规划内容的有（ ）。","material":"","options":[{"key":"A","text":"晋升规划"},{"key":"B","text":"补充规划"},{"key":"C","text":"培养开发规划"},{"key":"D","text":"组织结构规划"},{"key":"E","text":"薪酬规划"}],"answer":["A","B","C","E"],"explanation":"人力资源规划包括晋升规划、补充规划、培养开发规划、配备规划、薪酬规划、员工职业生涯规划。","id":"guanfang-0687","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第一节人力资源规划","point":"","type":"single","stem":"企业人力资源规划程序的第一步是（ ）。","material":"","options":[{"key":"A","text":"预测企业人员需求量"},{"key":"B","text":"核查企业现有人员"},{"key":"C","text":"预测企业人员供给量"},{"key":"D","text":"确定企业人员净需求量"}],"answer":["B"],"explanation":"企业人力资源规划的制定程序一般分为以下八个步骤：核查企业现有人员、预测企业人员需求量、预测企业人员供给量、确定企业人员净需求量、制定企业人员规划政策、确定执行计划、执行反馈和控制、评估企业人员规划政策。","id":"guanfang-0688","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第一节人力资源规划","point":"","type":"multi","stem":"评估人力资源规划时，需要进行比较和分析的因素有（ ）。","material":"","options":[{"key":"A","text":"实际补充人员与预测的人员需求量之间的差异"},{"key":"B","text":"劳动生产率的实际水平与预测水平之间的差异"},{"key":"C","text":"实际的人员流动率与预测的人员流动率之间的差异"},{"key":"D","text":"企业员工平均年龄与行业平均年龄之间的差异"},{"key":"E","text":"行动方案的收益与成本之间的差异"}],"answer":["A","B","C","E"],"explanation":"评估人力资源规划时，需要对以下几个因素进行比较和分析：①实际补充的人员与预测的人员需求量之间的比较和分析。②实际的劳动生产率水平与预测的劳动生产率水平之间的比较和分析。③实际的人员流动率与预测的人员流动率之间的比较和分析。④实际执行的行动方案与规划的行动方案之间的比较和分析。③实施行动方案后的结果与预测结果之间的比较和分析。③行动方案的实施成本与预算成本之间的比较和分析。①行动方案的收益与成本之间的比较和分析。","id":"guanfang-0689","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第一节人力资源规划","point":"","type":"single","stem":"某企业营销部经理和营销总监，根据各自工作经验和对企业未来业务量增减情况预测营销人员的需求数量。该企业采用的人力资源需求预测方法是（ ）。","material":"","options":[{"key":"A","text":"管理人员判断法"},{"key":"B","text":"线性回归分析法"},{"key":"C","text":"德尔菲法"},{"key":"D","text":"人员核查法"}],"answer":["A"],"explanation":"企业人力资源需求预测的方法主要有管理人员判断法、德尔菲法、转换比率分析法和一元回归分析法。其中，管理人员判断法是由企业的各级管理人员根据各自的工作经验和对企业未来业务量增减情况的直觉判断，自下而上地确定未来所需人员的方法。","id":"guanfang-0690","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第一节人力资源规划","point":"","type":"single","stem":"下列人力资源需求预测方法中，能够充分发挥专家作用、集思广益、预测准确度较高的方法是（ ）。","material":"","options":[{"key":"A","text":"人员核查法"},{"key":"B","text":"德尔菲法"},{"key":"C","text":"转换比率分析法"},{"key":"D","text":"一元回归分析法"}],"answer":["B"],"explanation":"德尔非法是在每位专家均不知除自己以外的其他专家的任何情况下进行的，避免了彼此身份地位的差别、人际关系以及群体压力等因素对意见表达的影响，充分发挥了各位专家的作用，集思广益，预测的准确度相对较高，因此这种方法的应用比较广泛。","id":"guanfang-0691","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第一节人力资源规划","point":"","type":"single","stem":"使用一元回归分析法进行人力资源需求预测的关键是（ ）。","material":"","options":[{"key":"A","text":"收集历史数据"},{"key":"B","text":"确定概率"},{"key":"C","text":"提出对策"},{"key":"D","text":"找出相关变量"}],"answer":["D"],"explanation":"使用一元回归分析法进行人力资源需求预测时，关键在于找出与人力资源需求高度相关的变量。","id":"guanfang-0692","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第一节人力资源规划","point":"","type":"single","stem":"根据一元回归分析法，该企业2027年需要销售人员（ ）人。","material":"某企业进行人力资源需求与供给预测，经过调查研究与分析，确认本企业的销售额和所需销售人员数量之间可用一元线性回归模型表示，并根据过去20年的统计资料建立了预测模型y=20+0.02x,其中：代表销售人员数量，α代表销售额（万元）。同时，该企业预计2027年销售额将达到1000万元，2028年销售额将达到1500万元。通过统计研究发现，企业销售额每增加500万元，需增加管理人员、销售人员和客服人员共14人；新增人员中，管理人员、销售人员和客服人员的比例是1：5：1。根据人力资源需求与供给情况，该企业制定了晋升规划、补充规划、培养开发规划等人力资源规划的内容。","options":[{"key":"A","text":"20"},{"key":"B","text":"30"},{"key":"C","text":"40"},{"key":"D","text":"50"}],"answer":["C"],"explanation":"根据一元回归分析法，代人数据，该企业2027年需要的销售人数=20+0.02×1000=40（人）。","id":"guanfang-0693","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第一节人力资源规划","point":"","type":"single","stem":"运用转换比率分析法，该企业2028年较2027年需要增加管理人员（ ）人。","material":"某企业进行人力资源需求与供给预测，经过调查研究与分析，确认本企业的销售额和所需销售人员数量之间可用一元线性回归模型表示，并根据过去20年的统计资料建立了预测模型y=20+0.02x,其中：代表销售人员数量，α代表销售额（万元）。同时，该企业预计2027年销售额将达到1000万元，2028年销售额将达到1500万元。通过统计研究发现，企业销售额每增加500万元，需增加管理人员、销售人员和客服人员共14人；新增人员中，管理人员、销售人员和客服人员的比例是1：5：1。根据人力资源需求与供给情况，该企业制定了晋升规划、补充规划、培养开发规划等人力资源规划的内容。","options":[{"key":"A","text":"1"},{"key":"B","text":"2"},{"key":"C","text":"5"},{"key":"D","text":"10"}],"answer":["B"],"explanation":"根据转换比率分析法，该企业2028 年较2027年销售额的增加量=1500-1000=500（万元），所以需增加各类人员=500→500×14=14（人）。新增管理人员、销售人员和客服人员的比例是1:5：1,所以该企业2028年需要新增的管理人员的数量=14－（1+5+1）×1= 2(人）。 公》（3）ACD补充规划是指企业根据自身运转的实际情况，对中长期内可能产生的空缺职 位进行合理补充的活动。补充规划可以充实企业的人力资源、改变企业内部人力资源结构失 衡和人岗不匹配的状况，但补充规划要与其他规划相配合才会产生好的效果。","id":"guanfang-0694","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第一节人力资源规划","point":"","type":"single","stem":"补充规划的作用包括（ ）。","material":"某企业进行人力资源需求与供给预测，经过调查研究与分析，确认本企业的销售额和所需销售人员数量之间可用一元线性回归模型表示，并根据过去20年的统计资料建立了预测模型y=20+0.02x,其中：代表销售人员数量，α代表销售额（万元）。同时，该企业预计2027年销售额将达到1000万元，2028年销售额将达到1500万元。通过统计研究发现，企业销售额每增加500万元，需增加管理人员、销售人员和客服人员共14人；新增人员中，管理人员、销售人员和客服人员的比例是1：5：1。根据人力资源需求与供给情况，该企业制定了晋升规划、补充规划、培养开发规划等人力资源规划的内容。","options":[{"key":"A","text":"充实企业的人力资源"},{"key":"B","text":"激发企业员工的工作积极性"},{"key":"C","text":"改善企业内部人岗不匹配的状况"},{"key":"D","text":"改变企业内部人力资源结构失衡的状况"}],"answer":["A"],"explanation":"人员核查法是一种静态的方法，多用于中小企业短期人力资源供给预测。","id":"guanfang-0695","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第一节人力资源规划","point":"","type":"single","stem":"下列预测方法中，多用于中小企业短期人力资源供给预测的是（ ）。","material":"","options":[{"key":"A","text":"人员核查法"},{"key":"B","text":"转换比率分析法"},{"key":"C","text":"马尔可夫模型法"},{"key":"D","text":"管理人员判断法"}],"answer":["B"],"explanation":"企业进行人力资源外部供给预测时，必须考虑影响企业外部人力资源供给的因素。这些因素主要有本地区的人口总量与人力资源供给率、本地区人力资源的构成、宏观经济形势和失业率预期、本地区劳动力市场供求状况、本行业劳动力市场供求状况和职业市场状况等。本行业劳动力市场供求状况包括本行业劳动力的平均价格、与外地市场比较的相对价格、当地的物价指数等，它们都会对企业的人力资源外部供给产生影响。","id":"guanfang-0696","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第一节人力资源规划","point":"","type":"single","stem":"影响企业人力资源外部供给量的因素不包括（ ）。","material":"","options":[{"key":"A","text":"所在地区的物价指数"},{"key":"B","text":"所属行业的价值链长度"},{"key":"C","text":"所在地区人力资源的构成"},{"key":"D","text":"所在行业劳动力的平均价格"}],"answer":["D"],"explanation":"根据马尔可夫模型法，该企业2025 年生产主管的内部供给量由两部分构成，一部分是原有生产主管继续留任，另一部分是生产工人晋升为生产主管，即2026年生产主管的内部供给量=30×0.7+700×0.02=35（人）。","id":"guanfang-0697","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第二节绩效考评","point":"","type":"single","stem":"下列属于影响员工个人绩效的客观因素的是（ ）。","material":"","options":[{"key":"A","text":"员工具备的知识"},{"key":"B","text":"员工的能力"},{"key":"C","text":"员工受到的激励"},{"key":"D","text":"员工的工作意愿"}],"answer":["C"],"explanation":"影响员工绩效的因素主要包括员工个人所拥有的与工作相关的知识与能力，受到的激励与所处的环境等。其中，知识与能力是主观因素，激励与环境是客观因素。","id":"guanfang-0698","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第二节绩效考评","point":"","type":"multi","stem":"绩效的特点包括（ ）。","material":"","options":[{"key":"A","text":"多因性"},{"key":"B","text":"稳定性"},{"key":"C","text":"多维性"},{"key":"D","text":"差异性"},{"key":"E","text":"动态性"}],"answer":["A","C","E"],"explanation":"绩效具有多因性、多维性和动态性的特点。","id":"guanfang-0699","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第二节绩效考评","point":"","type":"single","stem":"某公司将根据绩效考评结果对员工进行奖惩、职位升降、工作转换、培训。这体现了绩效考评的（ ）。","material":"","options":[{"key":"A","text":"管理功能"},{"key":"B","text":"激励功能"},{"key":"C","text":"学习和导向功能"},{"key":"D","text":"沟通功能"}],"answer":["A"],"explanation":"绩效考评既要解决考评什么和怎样考评的问题，又要根据绩效考评结果对员工进行奖惩、职位升降、工作转换、培训等，这些都充分体现了它的管理功能。","id":"guanfang-0700","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第二节绩效考评","point":"","type":"single","stem":"企业要了解和掌握其成员完成任务的数量、质量和效率等信息，并据此制定相应的人事决策和措施，以提高工作绩效。这体现了绩效考评的（ ）。","material":"","options":[{"key":"A","text":"激励功能"},{"key":"B","text":"监控功能"},{"key":"C","text":"学习和导向功能"},{"key":"D","text":"管理功能"}],"answer":["B"],"explanation":"绩效考评对企业来说，可以帮助其了解和掌握其成员完成任务的数量、质量和效率等信息，并据此制定相应的人事决策和措施，以提高员工的工作绩效，这体现了绩效考评的监控功能。","id":"guanfang-0701","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第二节绩效考评","point":"","type":"single","stem":"客观公正的绩效考评可以促使员工更加积极、主动、规范地工作，以完成绩效目标。这体现了绩效考评的（。","material":"","options":[{"key":"A","text":"管理功能"},{"key":"B","text":"激励功能"},{"key":"C","text":"沟通功能"},{"key":"D","text":"监控功能"}],"answer":["B"],"explanation":"激励功能表现在客观公正的绩效考评可以激发员工的积极性，促使员工更加积极、主动、规范地工作，以完成绩效目标。","id":"guanfang-0702","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第二节绩效考评","point":"","type":"multi","stem":"绩效考评是评价主体对员工的（ ）进行考核和评价的过程。","material":"","options":[{"key":"A","text":"工作态度"},{"key":"B","text":"工作强度"},{"key":"C","text":"工作行为"},{"key":"D","text":"工作业绩"},{"key":"E","text":"个人发展情况"}],"answer":["A","C","D","E"],"explanation":"绩效考评又称绩效评估、绩效评价，是指评价主体根据企业的战略目标和绩效计划，对照工作目标或绩效标准，采用科学合理的评价方法，对员工的工作态度、工作行为、工作业绩和个人发展情况进行考核和评价的过程。","id":"guanfang-0703","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第二节绩效考评","point":"","type":"single","stem":"根据绩效考评的基本流程，下列选项中，排列顺序正确的是（ ）。","material":"","options":[{"key":"A","text":"确立目标→建立考评系统→整理数据→分析判断→输出结果"},{"key":"B","text":"建立考评系统→确立目标→分析判断→整理数据→输出结果"},{"key":"C","text":"确立目标→整理数据→建立考评系统→输出结果→分析判断"},{"key":"D","text":"分析判断→确立目标→建立考评系统→整理数据→输出结果"}],"answer":["A"],"explanation":"绩效考评的基本流程为:确立目标→建立考评系统→整理数据→分析判断→输出结果。","id":"guanfang-0704","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第二节绩效考评","point":"","type":"single","stem":"绩效考评流程中，建立考评系统的主要任务不包括（ ）。","material":"","options":[{"key":"A","text":"确定并培训考评者"},{"key":"B","text":"构建考评指标体系"},{"key":"C","text":"选择适当的考评方法"},{"key":"D","text":"对绩效不佳原因进行分析"}],"answer":["D"],"explanation":"建立考评系统的主要任务包括:①确定并培训考评者。②构建考评指标体系。③选择适当的考评方法。","id":"guanfang-0705","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第二节绩效考评","point":"","type":"single","stem":"某企业对一名技术主管进行绩效考评。首先，由该技术主管做个人述职报告，然后，由技术部经理、其他技术主管以及该技术主管所管理的员工对其工作绩效做出评价，最后，综合分析各方面意见得出该技术主管的绩效考评结果。这种绩效考评方法是（)。","material":"","options":[{"key":"A","text":"目标管理法"},{"key":"B","text":"配对比较法"},{"key":"C","text":"民主评议法"},{"key":"D","text":"行为锚定考评量表法"}],"answer":["C"],"explanation":"民主评议法是指在听取考评对象个人述职报告的基础上，由考评对象的上级主管、同事、下级以及与其有工作关系的人员，对其工作绩效做出评价，然后综合分析各方面的意见得出该考评对象的绩效考评结果。","id":"guanfang-0706","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第二节绩效考评","point":"","type":"single","stem":"某主管在绩效考评期内对下属员工不断观察，用描述性的文字记录各下属员工工作中的关键行为，,并以此作为对下属员工工作绩效评价的依据。该主管采用的绩效考评方法是（ ）。","material":"","options":[{"key":"A","text":"民主评议法"},{"key":"B","text":"关键事件法"},{"key":"C","text":"等级量表法"},{"key":"D","text":"比较法"}],"answer":["B"],"explanation":"关键事件法是指考评者通过观察，用描述性的文字记录下在工作中发生的对考评对象工作绩效有直接影响的重大的和关键性的事件和行为。考评者运用这些长期记录下来的事实依据，对考评对象的工作绩效进行评价。","id":"guanfang-0707","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第二节绩效考评","point":"","type":"single","stem":"某部门主管运用配对比较法对4名员工进行绩效考评，具体情况见下表。考评对象比较对象#李某张某王某赵某张某。—+—++王某-—。-—+李某—-—+。—+赵某———。由上表可知，绩效从高到低，排名第二的员工是（ ）。","material":"","options":[{"key":"A","text":"张某"},{"key":"B","text":"王某"},{"key":"C","text":"李某"},{"key":"D","text":"赵某"}],"answer":["B"],"explanation":"在运用配对比较法时，绩效考评表格中“+”表示某考评对象比对比对象绩效水平高，“_”表示比对比对象绩效水平差。将每一个考评对象得到的“+”次数相加，得到的“+”越多，对该考评对象的评价就越高。本题中，四位员工的绩效排名从高到低分别是赵某（3次+）王某(2次+)李某（1 次+）张某（0次+),因此，绩效排名第二的员工是王某。","id":"guanfang-0708","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第二节绩效考评","point":"","type":"single","stem":"某企业在考评之前先选出一位员工，以他的各方面表现为标准，对其他员工进行考评，这种绩效考评方法是（ ）。","material":"","options":[{"key":"A","text":"交替排序法"},{"key":"B","text":"配对比较法"},{"key":"C","text":"人物比较法"},{"key":"D","text":"强制分布法"}],"answer":["C"],"explanation":"人物比较法又称标准人物比较法，是指在考评之前先选出一位员工作为“标准人物”,以其各方面表现为标准，对其他员工进行考评。相较于前两种比较法，人物比较法是将所有考评对象与特定的“标准人物”进行比较，考评的依据更加客观。","id":"guanfang-0709","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第二节绩效考评","point":"","type":"multi","stem":"比较法是一种常用的绩效考评方法，其主要形式有（ ）。","material":"","options":[{"key":"A","text":"人物比较法"},{"key":"B","text":"书面鉴定法"},{"key":"C","text":"配对比较法"},{"key":"D","text":"关键事件法"},{"key":"E","text":"交替排序法"}],"answer":["A","C","E"],"explanation":"比较法最常用的形式有以下三种：交替排序法、配对比较法和人物比较法。","id":"guanfang-0710","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第二节绩效考评","point":"","type":"multi","stem":"企业对员工进行绩效考评时，常用的方法有（ ）。","material":"","options":[{"key":"A","text":"职位等级法"},{"key":"B","text":"职位分类法"},{"key":"C","text":"民主评议法"},{"key":"D","text":"书面鉴定法"},{"key":"E","text":"关键事件法"}],"answer":["C","D","E"],"explanation":"常用的绩效考评方法主要有：①民主评议法。②书面鉴定法。③关键事件法。④比较法，包括交替排序法、配对比较法和人物比较法。③量表法，包括评级量表法和行为锚定考评量表法。","id":"guanfang-0711","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第二节绩效考评","point":"","type":"multi","stem":"关于绩效考评方法的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"民主评议法主要适用于对企业中层和基层管理人员的绩效考评"},{"key":"B","text":"书面鉴定法是考评者以书面文字的形式对考评对象做出评价的方法"},{"key":"C","text":"关键事件法中的关键事件可以是具体的事件和行为，也可以是对某种品质或能力的评 价判断"},{"key":"D","text":"比较法适用于考评对象人数较少的情况"},{"key":"E","text":"量表法是指把绩效考评的指标和标准制作成量表进行考核"}],"answer":["A","B","D","E"],"explanation":"常用的绩效考评方法包括：①民主评议法，主要适用于企业中层和基层管理人员的绩效考评。②书面鉴定法，是指考评者以书面文字的形式对考评对象做出评价的方法，一般包括考评对象的成绩与不足、潜在能力、改进建议和培养方法等内容。③关键事件法，是指考评者通过观察，用描述性的文字记录下在工作中发生的对考评对象工作绩效有直接影响的重大的和关键性的事件和行为的方法。④比较法，一般只适用于考评对象人数较少的情况。③量表法。把绩效考评的指标和标准制作成量表，根据量表对考评对象的工作绩效进行考评的方法。","id":"guanfang-0712","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"企业给员工提供的福利属于（ ）。","material":"","options":[{"key":"A","text":"基本薪酬"},{"key":"B","text":"固定薪酬"},{"key":"C","text":"间接薪酬"},{"key":"D","text":"激励薪酬"}],"answer":["C"],"explanation":"在企业中，员工的薪酬一般包括直接薪酬（如基本工资、奖金、津贴和股权）和间接酬（如福利）两部分。","id":"guanfang-0713","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"企业根据员工所承担或完成的工作本身或者员工所具备的完成工作的技能或能力，向员工支付的相对稳定的经济性报酬是（ ）。","material":"","options":[{"key":"A","text":"基本薪酬"},{"key":"B","text":"可变薪酬"},{"key":"C","text":"激励薪酬"},{"key":"D","text":"间接薪酬"}],"answer":["A"],"explanation":"基本薪酬是指一个企业根据员工所承担或完成的工作或者员工所具备的技能或能而向员工支付的相对稳定的经济性报酬。","id":"guanfang-0714","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"对员工在特殊条件下的劳动消耗、额外的生活支出等给予的工资性补偿属于(）。","material":"","options":[{"key":"A","text":"补贴"},{"key":"B","text":"津贴"},{"key":"C","text":"奖金"},{"key":"D","text":"可变薪酬"}],"answer":["B"],"explanation":"津贴是指对员工在特殊条件下的劳动消耗、额外的生活支出等给予的工资性补偿。见的津贴包括高温津贴、井下津贴、夜班津贴、交通补贴、通讯补贴等。补贴是为了保证员工的收入水平不受物价变动影响而支付的各种形式的工资性补偿，如副食品价格补贴、粮价补占、水电补贴、取暖补贴等。","id":"guanfang-0715","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"企业给员工办理的商业保险属于（ ）。","material":"","options":[{"key":"A","text":"福利"},{"key":"B","text":"津贴"},{"key":"C","text":"可变薪酬"},{"key":"D","text":"补贴"}],"answer":["A"],"explanation":"福利或服务不是以员工向企业提供的工作时间为计算单位的，它一般包括非工作寸间付薪、向员工个人及其家庭提供的服务（如儿童看护、工作餐等）健康及医疗保健、商业呆险及补充养老金等。","id":"guanfang-0716","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"multi","stem":"下列选项中，属于非法定福利范畴的有（ ）。","material":"","options":[{"key":"A","text":"社会保险"},{"key":"B","text":"企业年金"},{"key":"C","text":"工作餐"},{"key":"D","text":"补充医疗保险"},{"key":"E","text":"住房公积金"}],"answer":["B","C","D"],"explanation":"福利分为法定福利和非法定福利。前者是国家法律要求企业必须提供给员工的富利项目，如各类社会保险；后者则是企业根据自身的情况酌情制定的相关福利项目，如企业年金、工作餐、补充医疗保险等。","id":"guanfang-0717","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"薪酬管理能够通过影响员工的工作行为、工作态度和工作业绩，直接影响企业的经营绩效。这体现了薪酬管理可以（ ）。","material":"","options":[{"key":"A","text":"塑造和强化企业文化"},{"key":"B","text":"保障企业战略落地，改善企业经营绩效"},{"key":"C","text":"支持企业变革"},{"key":"D","text":"帮助企业有效控制经营成本"}],"answer":["B"],"explanation":"薪酬管理可以保障企业战略落地，改善企业经营绩效。薪酬对于员工的工作行为、工作度及工作业绩具有直接的影响。薪酬不仅决定了企业可以招募到的员工的数量、质量与企业人资源存量，也影响现有员工的激励效果，左右其工作效率、归属感及忠诚度，最终对企业经营绩女产生重要影响。科学的薪酬管理有利于保障企业战略落地。","id":"guanfang-0718","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"认同企业薪酬管理的员工会留下，并为完成业绩目标而努力，不认同的员工会选择离开。这体现了薪酬管理可以（ ）。","material":"","options":[{"key":"A","text":"塑造和强化企业文化"},{"key":"B","text":"保障企业战略落地，改善企业经营绩效"},{"key":"C","text":"支持企业变革"},{"key":"D","text":"帮助企业有效控制经营成本"}],"answer":["A"],"explanation":"薪酬体现了一个企业的价值观，公司鼓励什么、反对什么，都体现在薪酬制度里。认同全业薪酬管理的员工会留下，并为完成业绩目标而努力，不认同的员工会选择离开。因此，合理为、富有激励性的薪酬管理有助于塑造企业文化，或者对已有的企业文化起到积极的强化作用。","id":"guanfang-0719","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"企业内部各类、各级职位之间的薪酬标准要适当拉开距离，以提高员工的工作积极性。这体现了薪酬制度设计的（ ）。","material":"","options":[{"key":"A","text":"公平原则"},{"key":"B","text":"合法原则"},{"key":"C","text":"激励原则"},{"key":"D","text":"量力而行原则"}],"answer":["C"],"explanation":"企业在进行薪酬制度设计时应遵循以下五项原则：公平原则、竞争原则、激励原则量力而行原则、合法原则。其中，激励原则是指企业内部各类、各级职位之间的薪酬标准要适的拉开距离，避免平均化。利用薪酬的激励功能提高员工的工作积极性。","id":"guanfang-0720","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"企业在设计薪酬制度时必须考虑自身的经济实力，避免薪酬过高或过低的情况出现，这体现了薪酬制度设计的（ ）。","material":"","options":[{"key":"A","text":"竞争原则"},{"key":"B","text":"合法原则"},{"key":"C","text":"公平原则"},{"key":"D","text":"量力而行原则"}],"answer":["D"],"explanation":"量力而行原则是指企业在设计薪酬制度时必须考虑自身的经济实力，避免薪酬过高或薪酬过低的情况出现，进而避免使企业成本过高或缺乏吸引力和竞争力。","id":"guanfang-0721","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"企业在进行薪酬制度设计时，强调各职位的薪酬要与其贡献一致，这体现了薪酬制度设计的（ ）原则。","material":"","options":[{"key":"A","text":"量力而行"},{"key":"B","text":"员工个人公平"},{"key":"C","text":"内部公平"},{"key":"D","text":"外部公平"}],"answer":["C"],"explanation":"企业在进行薪酬制度设计时应遵循公平原则。这里的公平包括外部公平、内部公平和员工个人公平。其中，内部公平是指同一企业中不同职位之间的薪酬水平应该相互协调，即各职位的薪酬要与其贡献一致。内部公平强调的是职位本身对报酬的决定作用。","id":"guanfang-0722","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"multi","stem":"企业在进行薪酬制度设计时，应遵循的原则主要有（ ）。","material":"","options":[{"key":"A","text":"公平原则"},{"key":"B","text":"效率优先原则"},{"key":"C","text":"竞争原则"},{"key":"D","text":"激励原则"},{"key":"E","text":"合法原则"}],"answer":["A","C","D","E"],"explanation":"～企业在进行薪酬制度设计时应遵循以下原则：①公平原则。②竞争原则③激励原则。④量力而行原则。③合法原则。","id":"guanfang-0723","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"某企业进行基本薪酬设计时，主管薪酬等级的薪酬区间中值为6000元，薪酬浮动率为25%,则该薪酬等级的薪酬区间最低值为（ ）元。","material":"","options":[{"key":"A","text":"1500"},{"key":"B","text":"4500"},{"key":"C","text":"6000"},{"key":"D","text":"7500"}],"answer":["B"],"explanation":"薪酬浮动率是指薪酬区间的最高值或最低值偏离薪酬区间中值的比率。薪酬区间最低值=薪酬区间中值×（1-薪酬浮动率）=6000×（1-25%）=4500（元）。","id":"guanfang-0724","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"某企业进行薪酬设计时，将员工的职位划分为若干个级别，按员工所处的职位级别确定其基本薪酬的水平和数额。该企业采用的薪酬设计方法是（)。","material":"","options":[{"key":"A","text":"职位分类法"},{"key":"B","text":"职位等级法"},{"key":"C","text":"要素计点法"},{"key":"D","text":"要素比较法"}],"answer":["B"],"explanation":"基本薪酬设计的方法包括:①职位等级法。②职位分类法。③要素计点法。④要素比较法。其中，职位等级法将员工的职位划分为若干个级别（即职级),按其所处的职级确定其基本薪酬的水平和数额。","id":"guanfang-0725","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"某企业进行薪酬设计时，将所有职位划分为若干类型，根据各类职位对企业的重要程度和贡献，确定每一类职位中所有员工的薪酬水平。该企业采用的薪酬设计方法是（ ）。","material":"","options":[{"key":"A","text":"职位分类法"},{"key":"B","text":"职位等级法"},{"key":"C","text":"要素计点法"},{"key":"D","text":"要素比较法"}],"answer":["A"],"explanation":"职位分类法将企业中的所有职位划分为若干类型，如管理类、技术类、操作类（或生产类）财务类、营销类、行政类等，然后根据各类职位对企业的重要程度和贡献，确定每一类职位中所有员工的薪酬水平。它适用于专业化程度高、分工较细、技术单一、工作目标比较固定的企业和工种。","id":"guanfang-0726","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"multi","stem":"企业进行基本薪酬设计时，以职位为导向的基本薪酬设计常用的方法有","material":"","options":[{"key":"A","text":"职位等级法"},{"key":"B","text":"职位分类法"},{"key":"C","text":"关键绩效指标法"},{"key":"D","text":"目标管理法"},{"key":"E","text":"要素计点法"}],"answer":["A","B","E"],"explanation":"以职位为导向的基本薪酬设计常用的方法包括职位等级法、职位分类法、要素计点法和要素比较法。","id":"guanfang-0727","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"multi","stem":"下列方法中，以技能为导向的基本薪酬制度设计的有（ ）。","material":"","options":[{"key":"A","text":"职位等级法"},{"key":"B","text":"以知识为基础的基本薪酬制度设计"},{"key":"C","text":"职位分类法"},{"key":"D","text":"要素比较法"},{"key":"E","text":"以技能为基础的基本薪酬制度设计"}],"answer":["B","E"],"explanation":"以技能为导向的基本薪酬设计的思路是，根据员工掌握的知识和技能而不是其职位确定员工的基本薪酬，具体可分为以知识为基础的基本薪酬制度设计和以技能为基础的基本薪酬制度设计。","id":"guanfang-0728","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"该企业第一薪酬等级的薪酬区间最高值为（ ）元／月。","material":"某企业根据职位评价的结果，划分了若干个薪酬等级，每一薪酬等级又分别划分了若干薪酬级别，各薪酬级别之间的差距是相等的。其中，第一薪酬等级分为四个薪酬级别，第一薪酬等级的薪酬区间中值为6000元／月，薪酬浮动率为40%。","options":[{"key":"A","text":"3600"},{"key":"B","text":"8400"},{"key":"C","text":"4286"},{"key":"D","text":"9000"}],"answer":["B"],"explanation":"每一薪酬等级的薪酬区间最高值=薪酬区间中值×（1+薪酬浮动率),本题中，企业第一薪酬等级的薪酬区间最高值=6000×（1+40%）=8400（元）。","id":"guanfang-0729","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"该企业第一薪酬等级中的第二薪酬级别的薪酬值为（ ）元／月。","material":"某企业根据职位评价的结果，划分了若干个薪酬等级，每一薪酬等级又分别划分了若干薪酬级别，各薪酬级别之间的差距是相等的。其中，第一薪酬等级分为四个薪酬级别，第一薪酬等级的薪酬区间中值为6000元／月，薪酬浮动率为40%。","options":[{"key":"A","text":"4800"},{"key":"B","text":"5200"},{"key":"C","text":"3600"},{"key":"D","text":"6400"}],"answer":["B"],"explanation":"每一薪酬等级的薪酬区间最低值=薪酬区间中值×（1-薪酬浮动率),本题中，企业第一薪酬等级的薪酬区间最低值=6000×（1-40%）=3600（元）,第二薪酬级别的薪酬值=3600+（8400-3600）→3=5200（元）。","id":"guanfang-0730","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"该企业在进行职位等级划分时，应遵循的基本原则是（ ）。","material":"某企业根据职位评价的结果，划分了若干个薪酬等级，每一薪酬等级又分别划分了若干薪酬级别，各薪酬级别之间的差距是相等的。其中，第一薪酬等级分为四个薪酬级别，第一薪酬等级的薪酬区间中值为6000元／月，薪酬浮动率为40%。","options":[{"key":"A","text":"等级数量越少越好，以简化管理"},{"key":"B","text":"等级数量越多越好，以体现精细化管理"},{"key":"C","text":"能够反映职位的价值差异"},{"key":"D","text":"参照同行业其他企业的等级数量"}],"answer":["C"],"explanation":"职位等级划分的数量取决于多种因素，如企业内部职位的数量、职位评价的结果、企业的薪酬政策等，但是其基本的原则是能够反映职位的价值差异。","id":"guanfang-0731","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"multi","stem":"该企业确定薪酬浮动率时需要考虑的因素有（ ）。","material":"某企业根据职位评价的结果，划分了若干个薪酬等级，每一薪酬等级又分别划分了若干薪酬级别，各薪酬级别之间的差距是相等的。其中，第一薪酬等级分为四个薪酬级别，第一薪酬等级的薪酬区间中值为6000元／月，薪酬浮动率为40%。","options":[{"key":"A","text":"本企业的薪酬支付能力"},{"key":"B","text":"其他企业同类职位的薪酬标准"},{"key":"C","text":"本企业各薪酬等级的重叠比率"}],"answer":["A","C"],"explanation":"一般来说，确定薪酬浮动率时主要考虑的因素包括：①企业的薪酬支付能力。②各薪酬等级的价值。③各薪酬等级之间的价值差异。④各薪酬等级的重叠比率。","id":"guanfang-0732","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"下列选项中，属于群体绩效薪酬形式的是（ ）。","material":"","options":[{"key":"A","text":"直接计件工资"},{"key":"B","text":"绩效加薪"},{"key":"C","text":"标准工时工资"},{"key":"D","text":"成功分享计划"}],"answer":["D"],"explanation":"群体绩效薪酬的形式主要包括利润分享计划、收益分享计划、成功分享计划。","id":"guanfang-0733","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"某制造企业规定，当车间的生产成本低于预算标准、废品率下降时，将节省成本的30%作为奖金发放给该车间全体员工。这种群体绩效薪酬方式属于（ ）。","material":"","options":[{"key":"A","text":"利润分享计划"},{"key":"B","text":"收益分享计划"},{"key":"C","text":"成功分享计划"},{"key":"D","text":"直接计件工资"}],"answer":["B"],"explanation":"收益分享计划是企业提供的一种与员工分享因生产率提高、成本节约和质量提高而带来的收益的绩效薪酬形式。","id":"guanfang-0734","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"某科技公司将年度净利润的5%作为奖金，以现金形式发放给公司全体员工。这种群体绩效薪酬方式属于（ ）。","material":"","options":[{"key":"A","text":"利润分享计划"},{"key":"B","text":"收益分享计划"},{"key":"C","text":"成功分享计划"},{"key":"D","text":"标准工时计划"}],"answer":["A"],"explanation":"利润分享计划是指根据对某种企业绩效指标（通常是指利润等财务指标）的衡量结果，向员工支付报酬的一种绩效薪酬形式。根据这一计划，所有或者特定的员工按照一个事先设计好的公式，分享企业所创造利润的某一百分比。员工根据企业整体业绩获得年终奖或者股票，或者以现金或延期支付的形式得到红利。","id":"guanfang-0735","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"某销售公司员工小王在6月超额完成了个人月度销售目标的200%，公司为表彰其突出表现，当月月底给予小王5000元现金奖励，并在全体员工大会上对其进行了表扬。这种短期绩效薪酬方式属于（ ）。","material":"","options":[{"key":"A","text":"绩效加薪"},{"key":"B","text":"收益分享计划"},{"key":"C","text":"特殊绩效认可计划"},{"key":"D","text":"标准工时计划"}],"answer":["C"],"explanation":"由于绩效加薪本身在加薪周期及加薪幅度方面都存在一定的限制，所以很多企业还采用了特殊绩效认可计划，对那些非常突出的绩效表现给予一次性的奖励。特殊绩效认可计划的核心是即时激励、强化正向行为，它提高了报酬系统的灵活性和自发性。","id":"guanfang-0736","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"下列选项中，属于长期绩效薪酬方式的是（ ）。","material":"","options":[{"key":"A","text":"绩效加薪"},{"key":"B","text":"特殊绩效认可计划"},{"key":"C","text":"股票所有权计划"},{"key":"D","text":"收益分享计划"}],"answer":["C"],"explanation":"长期绩效薪酬计划是指绩效衡量周期在1 年以上的，对既定绩效目标的达成提供奖励（以股权类为主要表现形式）的计划。股票所有权计划是指组织以股票为媒介所实施的一 种长期绩效薪酬形式。","id":"guanfang-0737","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"multi","stem":"下列选项中，属于个人绩效薪酬方式的有（ ）。","material":"","options":[{"key":"A","text":"直接计件工资"},{"key":"B","text":"利润分享计划"},{"key":"C","text":"标准工时工资"},{"key":"D","text":"差额计件工资"},{"key":"E","text":"收益分享计划"}],"answer":["A","C","D"],"explanation":"个人绩效薪酬的形式有：直接计件工资、标准工时工资、差额计件工资。","id":"guanfang-0738","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"single","stem":"下列福利项目中，属于企业自主福利的是（ ）。","material":"","options":[{"key":"A","text":"公休假日"},{"key":"B","text":"住房公积金"},{"key":"C","text":"老人护理"},{"key":"D","text":"基本医疗保险"}],"answer":["C"],"explanation":"一般来说，可将福利划分为两大类：国家法定福利和企业自主福利。企业可以向员工提供自主福利，如法定福利之外的各种假期、带薪休假，为员工及其家属提供的各种服务项目（如儿童看护、老人护理等）,以及灵活多样的员工退休计划等。","id":"guanfang-0739","bank":"guanfang"},{"chapter":"第九章人力资源规划与薪酬管理","section":"第三节薪酬管理","point":"","type":"multi","stem":"下列各项中，属于国家法定福利的有（ ）。","material":"","options":[{"key":"A","text":"失业保险"},{"key":"B","text":"住房公积金"},{"key":"C","text":"老人护理假"},{"key":"D","text":"儿童看护假"},{"key":"E","text":"公休假日"}],"answer":["A","B","E"],"explanation":"国家法定福利是由国家相关法律和法规规定的福利内容，具有强制性，任何企业都必须执行，主要包括：①法定的社会保险。②住房公积金。③法定假期。其中，法定假期主要包括公休假日、法定休假日、带薪年休假等，其他假期包括探亲假、丧假、婚假、产假与配偶陪产假等。","id":"guanfang-0740","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节财务管理的基本价值观念","point":"","type":"single","stem":"货币时间价值率是指扣除（ ）和通货膨胀因素后的平均资金利润率或平均报酬率。","material":"","options":[{"key":"A","text":"风险报酬"},{"key":"B","text":"营业成本"},{"key":"C","text":"机会成本"},{"key":"D","text":"资本成本"}],"answer":["A"],"explanation":"货币时间价值又称资金时间价值，是指货币经历一定时间的投资和再投资所增加的价值。货币时间价值是客观存在的经济范畴，任何企业的财务活动都是在特定的时空进行的。货币时间价值原理正确揭示了不同时点上的资金之间的换算关系，是财务决策的基础。货币时间价值率是扣除风险报酬和通货膨胀因素后的平均资金利润率或平均报酬率。","id":"guanfang-0741","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节财务管理的基本价值观念","point":"","type":"single","stem":"某公司计划投资某项目，预计6年后可获得300万元，假定年利率为10%,则这笔收益相当于现在的（ ）万元。（P/F，10%,6）=0.5645。","material":"","options":[{"key":"A","text":"100"},{"key":"B","text":"150"},{"key":"C","text":"169"},{"key":"D","text":"200"}],"answer":["C"],"explanation":"复利现值是指将来一定时间点发生的特定资金按复利计算的现在价值，也可以说是未来收取（或支付）一定的本利和现在所需要的本金。其计算公式为:P=F（PIF,i,n)。代人数据，该公司这笔收益相当于现在的金额：300×0.5645～169（万元）。","id":"guanfang-0742","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节财务管理的基本价值观念","point":"","type":"single","stem":"假设企业以10%的年利率借50000元资金，投资某个期限为10年的项目。为使该投资项目有利可图，企业每年年末至少应收回（ ）元。（P/A,10%，10）=6.1446。","material":"","options":[{"key":"A","text":"5000"},{"key":"B","text":"6321"},{"key":"C","text":"7847"},{"key":"D","text":"8137"}],"answer":["D"],"explanation":"后付年金的现值是指一定时期内每期期末等额的系列收付款项的复利现值之和。其计算公式为:P=A（PIA,i,n)。代人数据，企业每年年末至少应收回：50000÷6.1446～8137（元）。","id":"guanfang-0743","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节财务管理的基本价值观念","point":"","type":"single","stem":"甲公司从乙公司租人一台特种仪器。合同约定租期为5年，甲公司每年年末支付租金50万元，年利率为10%,则甲公司5年支付的租金终值合计（ ）万元。（FIA，10%, 5)=6.1051。","material":"","options":[{"key":"A","text":"288"},{"key":"B","text":"305"},{"key":"C","text":"260"},{"key":"D","text":"255"}],"answer":["B"],"explanation":"后付年金又称普通年金，即各期期末发生的年金。后付年金终值是指一定时期内每期期末等额的系列收付款项的复利终值之和。其计算公式为:F=A（F/A,i,n)。代人数据，甲公司5年支付的租金终值合计为：50×6.1051～305（万元）。","id":"guanfang-0744","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节财务管理的基本价值观念","point":"","type":"single","stem":"某企业拟建立专项技术奖励基金，每年年初存人100000元，若年利率为10%,5年后该项基金本利和为（ ）元。（FIA，10%,5）=6.1051。","material":"","options":[{"key":"A","text":"871600"},{"key":"B","text":"610500"},{"key":"C","text":"671561"},{"key":"D","text":"564100"}],"answer":["C"],"explanation":"先付年金是指从第一期起，在一定时期内每期期初等额收付的系列款项。先付年金的终值是各期收付系列款项的复利终值之和。其计算公式为：F=A（F/A,i，n）（1+i)。代人数据，5年后该项基金的本利和为：100000×6.1051×（1+10%）=671561（元）。","id":"guanfang-0745","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节财务管理的基本价值观念","point":"","type":"single","stem":"假定银行年利率为10%,某投资项目采取后付年金的形式，投资期为5年，终值为100万元。若该项目改为先付年金的形式，其他条件不变，则该项目5 年期先付年金的终值为（ ）万元。","material":"","options":[{"key":"A","text":"90"},{"key":"B","text":"105"},{"key":"C","text":"110"},{"key":"D","text":"121"}],"answer":["C"],"explanation":"n期先付年金与n期后付年金的付款次数相同，但由于其付款时间不同,n期先付年金终值比n期后付年金的终值多计算一期利息。因此，5 年期先付年金终值=5 年期后付年金终值×（1+i）=100×（1+10%）=110（万元）。","id":"guanfang-0746","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节财务管理的基本价值观念","point":"","type":"single","stem":"K公司与某物业公司签署办公场所租赁协议，租期为10年，约定3年后每年年末支付租金80万元，共支付7年。这种租金安排可视为（ ）。","material":"","options":[{"key":"A","text":"先付年金"},{"key":"B","text":"后付年金"},{"key":"C","text":"递延年金"},{"key":"D","text":"永续年金"}],"answer":["C"],"explanation":"年金按其每次收付发生的时点不同，可分为后付年金、先付年金、递延年金、永续年金四种。其中，递延年金是指在最初若干期没有收付款项，后面若干期才有等额收付的年金形式。","id":"guanfang-0747","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节财务管理的基本价值观念","point":"","type":"single","stem":"某公司每年优先股股息为0.8元，投资者要求的必要报酬率为每年5%，按永续年金模型计算，则该优先股的现值为（ ）元。","material":"","options":[{"key":"A","text":"16"},{"key":"B","text":"26"},{"key":"C","text":"40"},{"key":"D","text":"32"}],"answer":["A"],"explanation":"永续年金是指限期趋于无穷的普通年金，优先股的股息可视为永续年金。永续年金的现值计算公式为：P=A/i。式中,A为年金，i为投资者要求的必要报酬率。代人数据，该优先股的现值=0.8+5%=16（元）。","id":"guanfang-0748","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节财务管理的基本价值观念","point":"","type":"single","stem":"某公司租赁设备，租期为8年，约定从第2年起至第8年，每年年末支付租金80万元，假定年复利率为4%,则该公司支付的租金现值总计是（ ）万元。（PIA,4%,7)=6.0021。","material":"","options":[{"key":"A","text":"461.7"},{"key":"B","text":"480.2"},{"key":"C","text":"500.0"},{"key":"D","text":"450.5"}],"answer":["A"],"explanation":"递延年金是指在最初若干期没有收付款项，后面若干期才有等额收付款项的年金形式。设年金发生期数为n,递延期数为m,则递延年金现值的计算公式为:P=A［（PIA,i,n）】（1+i）-\"。代人数据，该公司支付的租金现值=80×6.0021×（1+4%）=461.7（万元）。","id":"guanfang-0749","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节财务管理的基本价值观念","point":"","type":"single","stem":"期望报酬率的标准离差反映的是项目报酬的（ ）对期望值的偏离程度。","material":"","options":[{"key":"A","text":"各种可能结果的平均值"},{"key":"B","text":"各种可能结果的最大值"},{"key":"C","text":"各种可能结果的最小值"},{"key":"D","text":"各种可能结果"}],"answer":["D"],"explanation":"一个随机事件的实际结果可能会偏离或严重偏离其期望值。标准离差简称标准差，是反映概率分布中各种可能结果对期望值的偏离或离散程度的一个数值。","id":"guanfang-0750","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节财务管理的基本价值观念","point":"","type":"single","stem":"某公司计划开发一款新产品，根据调查研究资料可知，预期收益只受未来市场状态影响，在未来市场状态为好、一般、差三种情况下的报酬率分别为40%、15%、-5%,对应的概率分别为 40%、40%、20%,则该产品的期望报酬率为（ ）。","material":"","options":[{"key":"A","text":"15%"},{"key":"B","text":"21%"},{"key":"C","text":"25%"},{"key":"D","text":"40% 的标准离差率为（ ）。"},{"key":"E","text":"10%"},{"key":"F","text":"40%"},{"key":"G","text":"60%"},{"key":"H","text":"167%"}],"answer":["B"],"explanation":"期望值是一个概率分布中的所有可能结果以各自相应的概率为权数计算的加权平均值，它反映了预计报酬的平均化。期望报酬率的计算公式为:K= K,P。式中,K为期望报酬率;K,为第i种可能结果的报酬率;P,为第i种可能结果的概率;n为可能结果的个数。代人数据，该产品的期望报酬率=40%×40%+15%×40%+（-5%）×20%=21%。","id":"guanfang-0751","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节财务管理的基本价值观念","point":"","type":"single","stem":"某共享单车投资项目的标准离差为20%,期望报酬率为60%。假设其风险报酬系数为1.2,则其风险报酬率为（ ）。","material":"","options":[{"key":"A","text":"24%"},{"key":"B","text":"30%"},{"key":"C","text":"40%"},{"key":"D","text":"72%"}],"answer":["C"],"explanation":"标准离差率是标准离差与期望报酬率的比值。在期望报酬率不同的情况下，标准离差率越大，风险越大；反之，标准离差率越小，风险越小。标准离差率的计算公式为：V==×100%。式中,V为标准离差率;8 为标准离差;K为期望报酬率。代人数据，开发该产品的标准离差率为:v=15%×100%=60%。-4 C、 风险报酬率是在标准离差率的基础上，引人一个风险报酬系数来进行风险的计算与评估。其计算公式为：风险报酬率=风险报酬系数 × 标准离差率×100%。其中，标 准离差率=标准离差/期望报酬率×100%。代人数据，该共享单车投资项目的风险报酬 率=1.2×（20% = 60%）)×100%=40%。","id":"guanfang-0752","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节财务管理的基本价值观念","point":"","type":"single","stem":"某公司现有W、X、Y、Z四个投资项目可供选择。经测算，四个投资项目的标准离差率分别为8.5%、33.7%、18.9%、47.6%,则风险最大的投资项目是（)。","material":"","options":[{"key":"A","text":"W项目"},{"key":"B","text":"X项目"},{"key":"C","text":"Y项目"},{"key":"D","text":"Z项目"}],"answer":["D"],"explanation":"标准离差率是标准离差同期望报酬率的比值。在期望报酬率不同的情况下，标准离差率越大，风险越大;反之，风险越小。本题中,Z项目的标准离差率最大，则其风险最大。","id":"guanfang-0753","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节财务管理的基本价值观念","point":"","type":"single","stem":"已知无风险报酬率为5%,某一投资项目方案的风险报酬系数为10%,标准离差率为32%,则该投资项目的投资必要报酬率是（ ）。","material":"","options":[{"key":"A","text":"1.8%"},{"key":"B","text":"3.2%"},{"key":"C","text":"11.8%"},{"key":"D","text":"8.2%"}],"answer":["D"],"explanation":"投资必要报酬率=资金时间价值（无风险报酬率)+风险报酬率，风险报酬率=风险报酬系数 × 标准离差率 ×100%。代人数据，该项目的风险报酬率=10%×32%×100%=3.2%，则该投资项目的投资必要报酬率=5%+3.2%=8.2%。","id":"guanfang-0754","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第一节财务管理的基本价值观念","point":"","type":"multi","stem":"关于风险及风险报酬的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"一般而言，投资者都力求回避风险"},{"key":"B","text":"在财务管理中，风险报酬通常用风险报酬率加以计量"},{"key":"C","text":"风险报酬有风险报酬额和风险报酬率两种表示方法"},{"key":"D","text":"风险越大，投资者要求的风险报酬率越小"},{"key":"E","text":"风险报酬额是指投资者因冒着风险进行投资而获得的超过资金时间价值的额外收益"}],"answer":["B","C","E"],"explanation":"风险是事件本身的不确定性。风险报酬是指投资者由于冒着风险进行投资而获得的超过资金时间价值的额外收益。风险报酬有两种表示方法：①相对数，即风险报酬率，在财务管理中经常被使用。②绝对数，即风险报酬额。投资者追求的更多是风险收益，而不是讨厌风险；风险越大，投资者要求的风险报酬率也越大。","id":"guanfang-0755","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"某企业有一笔银行长期借款8亿元，借款利息率为7%，借款期限为5年，约定每年付息一次，到期一次性还本，企业所得税税率为 30%。假设该项筹资未发生筹资费用，则这笔银行借款的资本成本率为（ ）。","material":"","options":[{"key":"A","text":"5.6%"},{"key":"B","text":"4.9%"},{"key":"C","text":"2.4%"},{"key":"D","text":"7%"}],"answer":["B"],"explanation":"营业杠杆又称经营杠杆或营运杠杆，是指企业在生产经营过程中，由于固定成本的存在，当销售额（营业额）增减时，息税前盈余会有更大幅度的增减。","id":"guanfang-0756","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"某企业从银行借款2亿元，期限为5年，借款年利率为8%，每年付息，到期一次性还本，筹资费用率为0.2%,企业所得税税率为25%,则该企业这笔银行借款的资本成本率为（ ）。","material":"","options":[{"key":"A","text":"5.34%"},{"key":"B","text":"4.12%"},{"key":"C","text":"6.01%"},{"key":"D","text":"6.56%"}],"answer":["A"],"explanation":"营业杠杆系数（DOL）也称营业杠杆程度，是息税前盈余的变动率与销售额（营业额)变动率的比值，计算公式为:DOL=4EBIT/EBIT。依据题干表述，某企业的营业杠杆系数为5,说明该企业营业额增长1倍时，息税前盈余将增长5倍。","id":"guanfang-0757","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"借款合同如果附加补偿性余额条款，则企业借款的实际利率和资本成本率将会（ ）。","material":"","options":[{"key":"A","text":"上升"},{"key":"B","text":"下降"},{"key":"C","text":"不变"},{"key":"D","text":"先下降后上升"}],"answer":["C"],"explanation":"财务杠杆又称融资杠杆，是指由于债务利息等固定性融资成本的存在，普通股每股收益变动幅度大于息税前盈余变动幅度的现象。定量衡量这一影响程度用财务杠杆系数。财务杠杆系数（DFL）是指普通股每股收益变动率与息税前盈余变动率的比值。其测算公式为：DFL-_EBIT，式中，I为债各年利自额:FPIT为自税前盈全，代入数据该公司的财务杠杆。DFL=EBI-7。式中,1为债务年利息额;EBIT为息税前盈余。代入数据，该公司的财务杠杆系数=100-2100 10%=1.25。效100-200×10%-1.25。","id":"guanfang-0758","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"某企业2024年度发行债券融资，每张债券面值为100元，票面利率8%，期限5年，发行200万张，筹资总额2亿元。假设筹资费用率为1.5%，企业所得税税率为25%，不考虑货币时间价值，则发行该债券的资本成本率是（ ）。","material":"","options":[{"key":"A","text":"5.94%"},{"key":"B","text":"6.09%"},{"key":"C","text":"5.78%"},{"key":"D","text":"5.85%"}],"answer":["A"],"explanation":"财务杠杆系数（DFL）是指普通股每股收益变动率与息税前盈余变动率的比值。如果财务杠杆系数为2,即普通股每股收益变动率是息税前盈余变动率的2倍。","id":"guanfang-0759","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"某公司采取固定股利政策，每年每股分派现金股利3元，普通股每股融资净额为15元，则该公司的普通股资本成本率为（ ）。","material":"","options":[{"key":"A","text":"25%"},{"key":"B","text":"30%"},{"key":"C","text":"10%"},{"key":"D","text":"20%"}],"answer":["A"],"explanation":"财务杠杆系数的测算公式可表示为:DFL为息税前盈余。所以，息税前盈余和债务年利息额会影响财务杠杆系数的大小。","id":"guanfang-0760","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"multi","stem":"某公司采取固定增长股利政策，如果第1年的每股股利为2元，每年股利增长率为5%,普通股每股融资净额为10元，则该公司的普通股资本成本率为（ ）。","material":"","options":[{"key":"A","text":"5%"},{"key":"B","text":"15%"},{"key":"C","text":"25%"},{"key":"D","text":"30%"}],"answer":["A","D"],"explanation":"财务杠杆也称融资杠杆，是指由于债务利息等固定性融资成本的存在，普通股每股收益变动幅度大于息税前盈余变动幅度的现象。用财务杠杆系数定量衡量这一影响程度。财务杠杆系数是指普通股每股收益变动率与息税前盈余变动率的比值。财务杠杆系数越大，财务风险越大，财务杠杆利益也越大。","id":"guanfang-0761","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"某公司普通股股票的风险系数为1.1,市场平均报酬率为9%,无风险报","material":"","options":[{"key":"A","text":"4.4%"},{"key":"B","text":"5.5%"},{"key":"C","text":"9.5%"},{"key":"D","text":"9.9%"}],"answer":["B"],"explanation":"资本资产定价模型的计算公式为：K。=Rr+β（Rm-Rr)。式中,K。为普通股的资本成 本率；R为无风险报酬率；R为市场平均报酬率;β为风险系数。代人数据，T公司的股权资 本成本率=4.5%+1.1×（10.5%-4.5%)=11.1%。","id":"guanfang-0762","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"综合资本成本率的高低取决于资本结构和（ ）两个因素。","material":"","options":[{"key":"A","text":"个别资本成本率"},{"key":"B","text":"利息率"},{"key":"C","text":"民间资本借贷率"},{"key":"D","text":"企业所得税税率"}],"answer":["B"],"explanation":"，综合资本成本率的测算公式为:K=之KW。K.为综合资本成本率;K为第i种 （2）综合员本成本平的测异公式为：-台w。w为综合员本成本华，为第于科 资本成本率；W,为第种资本比例，含w=1。代人数据，T公司此次筹资的综合资本成本率= 30 - 40 ×11.1%+10 + 40 ×6%=9.825%。 （3）总杠杆系数=营业杠杆系数× 财务杠杆系数。代人数据,T公司的总杠杆系数= 1.4 ×1.3=1.82。（4）AB按并购的支付方式划分，企业并购可分为承担债务式并购、现金购买式并购、股权交易式并购三种。股权交易式并购，即并购企业用其股权换取被并购企业的股权或资产。上市公司可以向特定对象发行可转换为股票的公司债券、定向权证用于购买资产或者与其他公司合并。","id":"guanfang-0763","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"某公司投资环保项目需要1000万元，拟通过以下两种方式筹资：向银行借款600万元，资本成本率为10%；发行普通股股票融资400万元，资本成本率为15%。则该笔筹资的综合资本成本率为（ ）。","material":"","options":[{"key":"A","text":"10%"},{"key":"B","text":"12%"},{"key":"C","text":"15%"},{"key":"D","text":"25%"}],"answer":["A"],"explanation":"净收益观点认为，由于债务资本成本率一般低于股权资本成本率，因此，公司的债务资本越多，债务资本比例就越高，综合资本成本率就越低，从而公司的价值就越大。这种观点忽略了财务风险。","id":"guanfang-0764","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"从绝对量的构成来看，企业的资本成本包括（ ）。","material":"","options":[{"key":"A","text":"用资费用"},{"key":"B","text":"管理费用"},{"key":"C","text":"销售费用"},{"key":"D","text":"筹资费用"},{"key":"E","text":"制造费用"}],"answer":["D"],"explanation":"净营业收益观点认为，在公司的资本结构中，债务资本的多少、比例的高低与公司的价值没有关系。决定公司价值的真正因素应该是公司的净营业收益。","id":"guanfang-0765","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"下列模型中，可用于估算普通股资本成本率的有（ ）。","material":"","options":[{"key":"A","text":"股利折现模型"},{"key":"B","text":"成本模型"},{"key":"C","text":"市场模拟模型"},{"key":"D","text":"资本资产定价模型"},{"key":"E","text":"现金流折现模型"}],"answer":["C"],"explanation":"啄序理论认为，公司倾向于首先采用内部筹资，因而不会传递任何可能对股价不利的信息；如果需要外部筹资，公司将优先选择债权筹资，再选择其他外部股权筹资，这种筹资顺序的选择也不会传递对公司股价产生不利影响的信息。按照啄序理论，不存在明显的目标资本结构。","id":"guanfang-0766","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"债券的筹资费用包括（ ）。","material":"","options":[{"key":"A","text":"申请费"},{"key":"B","text":"注册费"},{"key":"C","text":"上市费"},{"key":"D","text":"利息"},{"key":"E","text":"印刷费"}],"answer":["D"],"explanation":"市场择时理论的研究结论是，当公司股价被高估时，理性的决策者应该选择增发股票；当公司股价被过分低估时，理性的决策者应该回购股票。","id":"guanfang-0767","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"根据资本资产定价模型，该公司此次增发普通股筹资的资本成本率为（ ）。","material":"某公司年度报告显示，期末资产总额为18亿元，负债总额为9亿元。该公司拟新建一条生产线，总投资额为6亿元，通过公开增发普通股筹资5亿元，利用留存收益筹资1亿元。经测算，公司债务的资本成本率为5%公司普通股股票的风险系数为1.3,无风险报酬率为5%,市场平均报酬率为12%。","options":[{"key":"A","text":"14.1%"},{"key":"B","text":"17.0%"},{"key":"C","text":"14.7%"},{"key":"D","text":"18.3%"}],"answer":["A"],"explanation":"，代理成本理论指出，公司债务的违约风险是财务杠杆系数的增函数；随着公司债权资本的增加，债权人的监督成本随之提升，债权人会要求更高的利率。这种代理成本最终由股东承担，公司资本结构中债权比率过高会导致股东价值的降低。根据代理成本理论，债权资本适度的资本结构会增加股东的价值。","id":"guanfang-0768","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"该公司还可以采用（ ）估算普通股筹资的资本成本率。","material":"某公司年度报告显示，期末资产总额为18亿元，负债总额为9亿元。该公司拟新建一条生产线，总投资额为6亿元，通过公开增发普通股筹资5亿元，利用留存收益筹资1亿元。经测算，公司债务的资本成本率为5%公司普通股股票的风险系数为1.3,无风险报酬率为5%,市场平均报酬率为12%。","options":[{"key":"A","text":"自由现金流折现模型"},{"key":"B","text":"盈亏平衡点模型"},{"key":"C","text":"股利折现模型"},{"key":"D","text":"每股利润无差别点模型"}],"answer":["C"],"explanation":"MM资本结构理论提出了两个重要命题。其中，命题I：利用财务杠杆的公司，其股权资本成本率随筹资额的增加而增加，因此公司的市场价值不会随债权资本比例的上升而增加。资本成本较低的债务给公司带来的财务杠杆利益会随股权资本成本率的上升而被抵销。在没有企业和个人所得税的情况下，风险相同的企业，其价值不受负债及其程度的影响。","id":"guanfang-0769","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"该公司利用留存收益筹资，这种筹资方式的特点包括（ ）。","material":"某公司年度报告显示，期末资产总额为18亿元，负债总额为9亿元。该公司拟新建一条生产线，总投资额为6亿元，通过公开增发普通股筹资5亿元，利用留存收益筹资1亿元。经测算，公司债务的资本成本率为5%公司普通股股票的风险系数为1.3,无风险报酬率为5%,市场平均报酬率为12%。","options":[{"key":"A","text":"留存收益筹资的资本成本率高于债券筹资的资本成本率"},{"key":"B","text":"留存收益筹资的资本成本是一种机会成本"},{"key":"C","text":"估算留存收益资本成本率不考虑筹资费用"},{"key":"D","text":"估算留存收益资本成本率需要考虑所得税因素"}],"answer":["D"],"explanation":"资本结构是指企业各种资金来源的构成及其比例关系，其中最重要的比例是负债比率。","id":"guanfang-0770","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"multi","stem":"综合资本成本率可以作为（ ）的依据。","material":"某公司年度报告显示，期末资产总额为18亿元，负债总额为9亿元。该公司拟新建一条生产线，总投资额为6亿元，通过公开增发普通股筹资5亿元，利用留存收益筹资1亿元。经测算，公司债务的资本成本率为5%公司普通股股票的风险系数为1.3,无风险报酬率为5%,市场平均报酬率为12%。","options":[{"key":"A","text":"确定股利支付率"},{"key":"B","text":"选择追加筹资方案"},{"key":"C","text":"评价经营业绩"},{"key":"D","text":"确定折现率"}],"answer":["B","C","D"],"explanation":"关于资本结构的理论研究主要有：①早期资本结构理论，包括净收益观点、净营业收益观点和传统观点。②MM资本结构理论。③现代资本结构理论，包括代理成本理论、啄序理论、动态权衡理论和市场择时理论。","id":"guanfang-0771","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"multi","stem":"营业杠杆是指企业在生产经营过程中存在（ ）而产生的风险收益放大效应。","material":"","options":[{"key":"A","text":"人工成本"},{"key":"B","text":"固定成本"},{"key":"C","text":"付现成本"},{"key":"D","text":"固定财务费用"}],"answer":["B","D"],"explanation":"现代资本结构理论主要包括代理成本理论、啄序理论、动态权衡理论和市场择时理论。净收益观点和净营业收益观点属于早期资本结构理论。","id":"guanfang-0772","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"如果某企业的营业杠杆系数为5,则说明（ ）。","material":"","options":[{"key":"A","text":"当企业营业额增长1倍时，息税前盈余将增长5倍"},{"key":"B","text":"当企业息税前盈余增长1倍时，营业额将增长5倍"},{"key":"C","text":"当企业息税前盈余增长1倍时，普通股每股收益将增长5倍"},{"key":"D","text":"当企业普通股每股收益增长1倍时，息税前盈余将增长5倍"}],"answer":["C"],"explanation":"企业资本结构决策即确定最佳资本结构。最佳资本结构是指企业在适度财务风险的条件下，使其预期的综合资本成本率最低，同时使企业价值最大的资本结构。","id":"guanfang-0773","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"某公司全部债务资本为200万元，债务的年利息率为10%，当销售额为500万元时，息税前盈余为100万元，则该公司的财务杠杆系数为（ ）。","material":"","options":[{"key":"A","text":"1.08"},{"key":"B","text":"1.15"},{"key":"C","text":"1.25"},{"key":"D","text":"1.45"}],"answer":["D"],"explanation":"资本结构的决策方法包括资本成本比较法和每股利润分析法。","id":"guanfang-0774","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"multi","stem":"如果某公司的财务杠杆系数是2,则说明（ ）。","material":"","options":[{"key":"A","text":"当公司息税前盈余增长1倍时，普通股每股收益将增长2倍"},{"key":"B","text":"当公司普通股每股收益增长1倍时，息税前盈余增长2倍"},{"key":"C","text":"当公司营业额增长1倍时，息税前盈余增长2倍"},{"key":"D","text":"当公司息税前盈余增长1倍时，营业额增长2倍"}],"answer":["A","C","D"],"explanation":"资本结构的影响因素主要有企业财务目标、经营状况的稳定性和成长性、企业的财务状况和信用等级、企业资产结构、企业投资者及管理者的态度、行业特征及发展周期、财政政策及货币政策等。","id":"guanfang-0775","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"下列选项中，影响财务杠杆系数大小的是（ ）。","material":"","options":[{"key":"A","text":"债务年利息额"},{"key":"B","text":"股权结构"},{"key":"C","text":"资产结构"},{"key":"D","text":"营业收人"}],"answer":["B"],"explanation":"资本结构是指企业各种资金来源的构成及其比例关系，其中最重要的比例是负债比率。","id":"guanfang-0776","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"企业的财务杠杆系数越大，表明企业的（ ）。","material":"","options":[{"key":"A","text":"财务风险越高"},{"key":"B","text":"营业风险越高"},{"key":"C","text":"营业杠杆利益越大"},{"key":"D","text":"财务杠杆利益越大"},{"key":"E","text":"流动资产比率越高"}],"answer":["A"],"explanation":"每股利润无差别点是指两种或两种以上筹资方案下普通股每股利润相等时的息税前盈余点。根据每股利润无差别点，可以分析选择筹资方式进行资本结构决策。测算公式如下：（EBI1-1>(1-1)-D_（EBI1-12)(1-1)-DP。式中,EBIT为息税前盈余平衡点，即每股利润无差别点;II、I为两种增资方式下的长期债务年利息；T为企业所得税税率；Dp、Dp,为两种增资方式下的优先股年股息；NI、N,为两种增资方式下的普通股股数。代人数据，（EBIT-20×12% ) ×(1-25% ) ÷ 10.2 = (EBIT-20 ×12%-5 ×10% ) ×（1-25% ) ÷ 10。","id":"guanfang-0777","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"single","stem":"根据资本资产定价模型，T公司的股权资本成本率为（ ）。","material":"T公司是一家智能装备制造企业，已在境内上市6年。近年来，为抓住人工智能发展机遇，T公司采取以内生增长为主、并购为辅的发展策略，持续整合产业链，提升综合竞争力。2026年，T公司决定以现金方式收购3家标的公司100%的股权，并投资建设一个新项目。收购和新建项目带来筹资需求40亿元，T公司决定通过定向增发新股筹资30亿元，通过银行贷款筹资10亿元。经测算，2026年无风险报酬率为4.5%，市场平均报酬率为10.5%,该公司股票的风险系数（β）为1.1,债务资本成本率为6%。公司财务杠杆系数为 1.3，营业杠杆系数为1.4,不考虑企业所得税。","options":[{"key":"A","text":"9.9%"},{"key":"B","text":"11.1%"},{"key":"C","text":"13.5%"},{"key":"D","text":"15.9%"}],"answer":["A"],"explanation":"每股利润分析法决策规则如下：解出EBIT（无差别点）,当实际EBIT大于无差别点时，选择资本成本固定型的筹资方式更有利，如银行贷款、发行债券或优先股；当实际EBIT小于无差别点时，选择资本成本非固定型筹资方式，如发行普通股。本题中，K公司选择了方案一，即通过发行债券来筹资，说明实际EBIT大于无差别点，即计算所得的息税前盈余平衡点小于公司2026年息税前盈余。","id":"guanfang-0778","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第二节筹资决策","point":"","type":"multi","stem":"根据资本资产定价模型计算得出的股权资本成本率，T公司此次筹资的综合资本成 本率为（ ）。","material":"T公司是一家智能装备制造企业，已在境内上市6年。近年来，为抓住人工智能发展机遇，T公司采取以内生增长为主、并购为辅的发展策略，持续整合产业链，提升综合竞争力。2026年，T公司决定以现金方式收购3家标的公司100%的股权，并投资建设一个新项目。收购和新建项目带来筹资需求40亿元，T公司决定通过定向增发新股筹资30亿元，通过银行贷款筹资10亿元。经测算，2026年无风险报酬率为4.5%，市场平均报酬率为10.5%,该公司股票的风险系数（β）为1.1,债务资本成本率为6%。公司财务杠杆系数为 1.3，营业杠杆系数为1.4,不考虑企业所得税。","options":[{"key":"A","text":"9.25%"},{"key":"B","text":"9.825%"},{"key":"C","text":"10.25%"},{"key":"D","text":"10.825%"}],"answer":["A","C","D"],"explanation":"指导企业筹资决策的理论有杠杆理论和资本结构理论。MM资本结构理论、啄序理论和动态权衡理论都属于资本结构理论。","id":"guanfang-0779","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节投资决策","point":"","type":"single","stem":"如果采用调整现金流量法对项目风险进行衡量和处理，确定肯定当量系数很重要，其数值所在区间为（ ）。","material":"","options":[{"key":"A","text":"-1 ~0"},{"key":"B","text":"-1 ~ 1"},{"key":"C","text":"0~1"},{"key":"D","text":"1~ 100"}],"answer":["C"],"explanation":"调整现金流量法是把不确定的现金流量调整为确定的现金流量，然后用无风险报酬率作为折现率计算净现值。肯定当量系数是指不确定的1元现金流量相当于使投资者肯定满意的金额系数，数值在0～1。","id":"guanfang-0780","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节投资决策","point":"","type":"single","stem":"企业在估算初始现金流量和终结现金流量时，均要考虑（ ）。","material":"","options":[{"key":"A","text":"企业所得税"},{"key":"B","text":"折旧"},{"key":"C","text":"付现成本"},{"key":"D","text":"流动资产"}],"answer":["D"],"explanation":"初始现金流量中包括流动资产投资，终结现金流量中包括原来垫支在各种流动资产上的资金收回，所以在估算初始现金流量和终结现金流量时，均要考虑流动资产。","id":"guanfang-0781","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节投资决策","point":"","type":"single","stem":"某项目预计完成后经济寿命是10年。该项目的固定资产投资为6000","material":"","options":[{"key":"A","text":"1262.5"},{"key":"B","text":"750"},{"key":"C","text":"1000"},{"key":"D","text":"1550.5"}],"answer":["A"],"explanation":"年净营业现金流量=年营业收人－付现成本－所得税=净利润+折旧。本题中，年折旧额=（6000-500）－10=550（万元）,利润总额=销售收人－付现成本－折旧=2500-100-900-550=950（万元）,净利润=利润总额×（1-企业所得税税率）=950×（1-25%）=712.5（万元），该项目每年净营业现金流量=净利润+折旧=712.5+550=1262.5（万元）。","id":"guanfang-0782","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节投资决策","point":"","type":"single","stem":"下列投资决策的评价指标中，没有考虑货币时间价值的是（ ）。","material":"","options":[{"key":"A","text":"净现值"},{"key":"B","text":"内部报酬率"},{"key":"C","text":"获利指数"},{"key":"D","text":"平均报酬率"}],"answer":["D"],"explanation":"投资决策的评价指标中，财务可行性指标可分为非贴现现金流量指标和贴现现金流量指标。其中，非贴现现金流量指标是指不考虑货币时间价值的指标，一般包括投资回收期（静态）和平均报酬率；贴现现金流量指标是指考虑货币时间价值的指标，包括净现值、内部报酬率和获利指数等。","id":"guanfang-0783","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节投资决策","point":"","type":"single","stem":"如果一个项目的IRR为10%,这说明（ ）。","material":"","options":[{"key":"A","text":"如果以10%为贴现率，该项目的获利指数大于1"},{"key":"B","text":"如果以10%为贴现率，该项目的净现值小于0"},{"key":"C","text":"如果以10%为贴现率，该项目的净现值大于0"},{"key":"D","text":"如果以10%为贴现率，该项目的净现值等于0"}],"answer":["D"],"explanation":"内部报酬率（IRR）是指使投资项目的净现值等于零的贴现率。内部报酬率反映投资项目的真实报酬率。依据此概念，如果一个项目的IRR为 10%,说明该项目的净现值等于零时的贴现率是10%。","id":"guanfang-0784","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节投资决策","point":"","type":"single","stem":"获利指数法的决策规则是，在有多个互斥方案时，应采用获利指数（ ）的投资项目。","material":"","options":[{"key":"A","text":"小于1"},{"key":"B","text":"等于1"},{"key":"C","text":"大于1"},{"key":"D","text":"大于1且最大"}],"answer":["D"],"explanation":"获利指数又称利润指数，是投资项目未来报酬的总现值与初始投资额的现值之比。获利指数法的决策规则是：①在只有一个备选方案的决策中，获利指数大于或等于1,则采纳该方案。②在有多个互斥方案时，选择获利指数最大的投资项目。","id":"guanfang-0785","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节投资决策","point":"","type":"single","stem":"公司在多个互斥方案的投资决策中，当使用不同的决策指标所选的方案不一致时，在无资本限量的情况下，应以（ ）指标为选择依据。，","material":"","options":[{"key":"A","text":"获利指数"},{"key":"B","text":"净现值"},{"key":"C","text":"静态投资回收期"},{"key":"D","text":"动态投资回收期"}],"answer":["B"],"explanation":"在进行投资决策时，主要的依据是贴现指标。在有多个互斥方案时，使用净现值、内部报酬率和获利指数三个贴现指标得出的结论不一致时，在无资本限量的情况下，以净现值为选择标准。","id":"guanfang-0786","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节投资决策","point":"","type":"single","stem":"在使用内部报酬率法进行固定资产投资决策时，方案可行的标准是内部报酬率（ ）。","material":"","options":[{"key":"A","text":"大于或等于企业的资本成本率"},{"key":"B","text":"小于或等于企业的资本成本率"},{"key":"C","text":"大于或等于企业的标准离差率"},{"key":"D","text":"小于或等于企业的标准离差率"}],"answer":["A"],"explanation":"内部报酬率的决策规则如下：在只有一个备选方案的决策中，如果计算出的内部报酬率大于或等于企业的资本成本率或必要报酬率，则采纳该方案；在有多个互斥方案时，选择内部报酬率超过资本成本率或必要报酬率最大的投资项目。","id":"guanfang-0787","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节投资决策","point":"","type":"multi","stem":"投资项目现金流量估算中，终结现金流量包括（ ）。","material":"","options":[{"key":"A","text":"固定资产的残值收人或变价收入"},{"key":"B","text":"停止使用的土地的变价收人"},{"key":"C","text":"筹资活动现金流量"},{"key":"D","text":"营业现金流量"},{"key":"E","text":"原来垫支在各种流动资产上的资金收回"}],"answer":["A","B","E"],"explanation":"终结现金流量是指投资项目完结时所发生的现金流量，主要包括：①固定资产的残值收人或变价收人。②原来垫支在各种流动资产上的资金收回。③停止使用的土地的变价收入。","id":"guanfang-0788","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节投资决策","point":"","type":"single","stem":"方案一的初始现金流量为（ ）万元。","material":"N公司是科创板上市的高端制造企业。在国家创新驱动发展战略指导下，N公司计划向银行贷款5000万元，用于扩大智能装备产能，推动技术升级，现有以下两套方案。线折旧，残值为800万元）流动资产投资1000万元；投产后预计年销售收人为5500万元，年固定成本（不含折旧）为600万元，年变动成本为2000万元，企业所得税税率为15%。方案二：吸收合并同行业企业。向L公司股东发行普通股，吸收合并L公司。","options":[{"key":"A","text":"-9000"},{"key":"B","text":"-10600"},{"key":"C","text":"-10800"},{"key":"D","text":"-11600"}],"answer":["C"],"explanation":"初始现金流量是指开始投资时发生的现金流量，总体是现金流出量，用负数或带括号的数字表示，主要包括以下四个方面：①固定资产投资额。②流动资产投资额。③其他投资费用。④原有固定资产的变价收人。案例中，方案一的初始现金流量只涉及固定资产投资和流动资产投资，所以方案一的初始现金流量=-（9800+1000）=-10800（万元）。","id":"guanfang-0789","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节投资决策","point":"","type":"single","stem":"方案一的每年净营业现金流量为（ ）万元。","material":"N公司是科创板上市的高端制造企业。在国家创新驱动发展战略指导下，N公司计划向银行贷款5000万元，用于扩大智能装备产能，推动技术升级，现有以下两套方案。线折旧，残值为800万元）流动资产投资1000万元；投产后预计年销售收人为5500万元，年固定成本（不含折旧）为600万元，年变动成本为2000万元，企业所得税税率为15%。方案二：吸收合并同行业企业。向L公司股东发行普通股，吸收合并L公司。","options":[{"key":"A","text":"1700"},{"key":"B","text":"2300"},{"key":"C","text":"2600"},{"key":"D","text":"3365"}],"answer":["C"],"explanation":"年净营业现金流量=净利润+折旧。代人数据，折旧=（9800-800）=10=900（万元），息税前利润=5500-600-2000-900=2000（万元），净利润=2000×（1-15%）=1700（万元）,所以方案一的每年净营业现金流量=1700+900=2600（万元）。","id":"guanfang-0790","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节投资决策","point":"","type":"multi","stem":"N公司采用银行借款方式筹资，其资本成本率的影响因素有（ ）。","material":"N公司是科创板上市的高端制造企业。在国家创新驱动发展战略指导下，N公司计划向银行贷款5000万元，用于扩大智能装备产能，推动技术升级，现有以下两套方案。线折旧，残值为800万元）流动资产投资1000万元；投产后预计年销售收人为5500万元，年固定成本（不含折旧）为600万元，年变动成本为2000万元，企业所得税税率为15%。方案二：吸收合并同行业企业。向L公司股东发行普通股，吸收合并L公司。","options":[{"key":"A","text":"企业所得税税率"},{"key":"B","text":"股利率"},{"key":"C","text":"借款利息率"},{"key":"D","text":"息税前盈余率"}],"answer":["A","C"],"explanation":"，长期借款资本成本率的测算公式为:K-I(1-T)，式中K为长期借款资本成","id":"guanfang-0791","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节投资决策","point":"","type":"multi","stem":"若N公司选择方案二，带来的影响有（ ）。","material":"N公司是科创板上市的高端制造企业。在国家创新驱动发展战略指导下，N公司计划向银行贷款5000万元，用于扩大智能装备产能，推动技术升级，现有以下两套方案。线折旧，残值为800万元）流动资产投资1000万元；投产后预计年销售收人为5500万元，年固定成本（不含折旧）为600万元，年变动成本为2000万元，企业所得税税率为15%。方案二：吸收合并同行业企业。向L公司股东发行普通股，吸收合并L公司。","options":[{"key":"A","text":"N公司股本减少"},{"key":"B","text":"N公司原股东股权被稀释"},{"key":"C","text":"L公司成为N公司的子公司"},{"key":"D","text":"L公司成为N公司的母公司"}],"answer":["A","C"],"explanation":"长期借款资本成本率的测算公式为:K=1-号。式中，K为长期借款资本成","id":"guanfang-0792","bank":"guanfang"},{"chapter":"第十章企业投融资决策及并购重组","section":"第三节投资决策","point":"","type":"multi","stem":"在长期股权投资决策中，投资项目的尽职调查及可行性论证风险属于","material":"","options":[{"key":"A","text":"投资运营管理风险"},{"key":"B","text":"投资决策风险"},{"key":"C","text":"投资清理风险"},{"key":"D","text":"投资体制风险"}],"answer":["A","C"],"explanation":"长期情款负本成本单的测异公式为：K-L(1-F)°式中,KI为长期情款货本成本率；I为长期借款年利息额;L为长期借款筹资额，即借款本金；T为企业所得税税率；F为长期借款筹资费用率，即借款手续费率。所以，N公司采用银行借款筹资，其资本成本率的影响因素有企业所得税税率和借款利息率。","id":"guanfang-0793","bank":"guanfang"},{"chapter":"第十章企业投融资决策及
