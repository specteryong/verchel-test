y":"A","text":"采购控制"},{"key":"B","text":"在制品控制"},{"key":"C","text":"投入控制"},{"key":"D","text":"产成品控制"}],"answer":["B"],"explanation":"，在制品控制是企业生产控制的基础工作，是指对生产运作过程中各工序原材料、半成品等在制品所处位置、数量、车间之间的物料转运等进行的控制。","id":"guanfang-0456","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"single","stem":"生产进度控制的目的是（ ）。","material":"","options":[{"key":"A","text":"保证产品产量最大化"},{"key":"B","text":"保证生产过程协调进行"},{"key":"C","text":"保证以最少的人力完成生产任务"},{"key":"D","text":"保证产品能准时装配出厂"}],"answer":["D"],"explanation":"生产进度控制的目的在于保证产品能准时装配出厂。","id":"guanfang-0457","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"multi","stem":"生产进度控制的基本内容包括（ ）。","material":"","options":[{"key":"A","text":"投入进度控制"},{"key":"B","text":"研发进度控制"},{"key":"C","text":"工序进度控制"},{"key":"D","text":"销售进度控制"},{"key":"E","text":"出产进度控制"}],"answer":["A","C","E"],"explanation":"生产控制的核心在于进度管理，生产进度控制的基本内容包括投入进度控制、工序进度控制和出产进度控制。","id":"guanfang-0458","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"multi","stem":"广义的生产作业控制包括（ ）。","material":"","options":[{"key":"A","text":"生产进度控制"},{"key":"B","text":"在制品控制"},{"key":"C","text":"人员控制"},{"key":"D","text":"生产调度"},{"key":"E","text":"设备控制"}],"answer":["A","B","D"],"explanation":"生产作业控制是在生产计划执行过程中，为保证生产作业计划目标的实现而进行的监督、检查、调度和调节。其主要目的是保证完成生产作业计划所规定的产品产量和交货期限指标。广义上，生产作业控制包括生产进度控制、在制品控制、库存控制、生产调度等内容。","id":"guanfang-0459","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"single","stem":"下列在制品中，（ ）是指经机械加工成为零件，并已经检验合格办完人库手续的在制品。","material":"","options":[{"key":"A","text":"毛坏"},{"key":"B","text":"人库前成品"},{"key":"C","text":"半成品"},{"key":"D","text":"车间在制品"}],"answer":["C"],"explanation":"半成品是指毛坏经机械加工成为零件，并已经检验合格办完人库手续的在制品。","id":"guanfang-0460","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"single","stem":"在制品定额是指一定生产技术组织条件下，各生产环节为了保证数量上的衔接所必需的和（ ）的在制品储备量。","material":"","options":[{"key":"A","text":"最高限度"},{"key":"B","text":"最低限度"},{"key":"C","text":"平均水平"},{"key":"D","text":"预计水平"}],"answer":["B"],"explanation":"在制品定额是指在一定生产技术组织条件下，各生产环节为了保证数量上的衔接所必需的、最低限度的在制品储备量。","id":"guanfang-0461","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"multi","stem":"大量大批流水线生产条件下在制品定额的制定包括（ ）。","material":"","options":[{"key":"A","text":"流水线内部在制品定额的制定"},{"key":"B","text":"车间内部在制品定额的制定"},{"key":"C","text":"流水线之间在制品定额的制定"},{"key":"D","text":"车间之间半成品定额的制定"},{"key":"E","text":"车间之间成品定额的制定"}],"answer":["A","C"],"explanation":"大量大批流水线生产条件下在制品定额的制定包括：①流水线内部在制品定额的制定。②流水线之间在制品定额的制定。","id":"guanfang-0462","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"multi","stem":"成批轮番生产条件下在制品定额的制定依据有（ ）。","material":"","options":[{"key":"A","text":"车间之间成品定额的制定"},{"key":"B","text":"车间内部在制品定额的制定"},{"key":"C","text":"流水线之间在制品定额的制定"},{"key":"D","text":"车间之间半成品定额的制定"},{"key":"E","text":"流水线内部在制品定额的制定"}],"answer":["B","D"],"explanation":"成批轮番生产条件下在制品定额的制定可按车间内部在制品和车间之间半成品来确定。","id":"guanfang-0463","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"multi","stem":"流水线之间的在制品可分为（ ）。","material":"","options":[{"key":"A","text":"工艺在制品"},{"key":"B","text":"运输在制品"},{"key":"C","text":"周转在制品"},{"key":"D","text":"保险在制品"},{"key":"E","text":"车间在制品"}],"answer":["B","C","D"],"explanation":"流水线内部的在制品可分为工艺在制品、运输在制品、周转在制品和保险在制品四种。流水线之间的在制品可分为运输在制品、周转在制品和保险在制品三种。","id":"guanfang-0464","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"single","stem":"库存管理成本中，每次订购物料所需的联系、谈判等费用属于（ ）。","material":"","options":[{"key":"A","text":"仓储成本"},{"key":"B","text":"订货成本"},{"key":"C","text":"机会成本"},{"key":"D","text":"沉没成本"}],"answer":["B"],"explanation":"库存管理成本包括仓储成本、订货成本和机会成本。其中，订货成本是指每次订购物料所需的联系、谈判、运输、检验等费用。订货成本与订购次数有关。","id":"guanfang-0465","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"single","stem":"库存管理成本中，购置库存物料所占用资金的利息费用属于（ ）。","material":"","options":[{"key":"A","text":"沉没成本"},{"key":"B","text":"订货成本"},{"key":"C","text":"机会成本"},{"key":"D","text":"仓储成本"}],"answer":["D"],"explanation":"仓储成本是指维持库存物料本身所需花费，包括存储成本、搬运和盘点成本、保险和税收以及库存物料由于变质、陈旧、损坏、丢失等造成损失及购置库存物料所占用资金的利息等。","id":"guanfang-0466","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"single","stem":"下列措施中，可以降低调节库存的是（ ）。","material":"","options":[{"key":"A","text":"减少库存批量"},{"key":"B","text":"缩短生产、配送周期"},{"key":"C","text":"使生产和需求相吻合"},{"key":"D","text":"使订货时间、订货量尽量接近需求时间和需求量"}],"answer":["C"],"explanation":"降低库存的措施包括：①降低周转库存。基本做法是减少库存批量。②降低在途库存。主要策略是缩短生产、配送周期。③降低调节库存。基本策略是尽量使生产和需求相吻合。④降低安全库存。安全库存是一种额外持有的库存，以免缺货影响生产和销售，起缓冲作用。降低安全库存的主要目的是使订货时间、订货量尽量接近需求时间和需求量。","id":"guanfang-0467","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"single","stem":"关于ABC库存分类法库存控制策略的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"严格控制A类商品库存，设立非常低的安全库存水平"},{"key":"B","text":"对于C类商品库存，高频率、小批量订货，高频率盘点"},{"key":"C","text":"宽松地控制B类商品库存建立大量安全库存"},{"key":"D","text":"对于A类商品库存，低频率、大批量订货"}],"answer":["A"],"explanation":"根据ABC库存分类法，可采用的库存控制策略包括：严格控制A类商品库存，设立非常低的安全库存水平，高频率、小批量订货，高频率盘点，保证完整和精确的库存记录，给予最高的处理优先权等；较宽松地控制C类商品库存，建立大量安全库存，低频率、大批量订货，花费尽可能少的时间盘点库存；B类商品库存的控制程度介于A类和C类商品之间。","id":"guanfang-0468","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"multi","stem":"下列属于库存量过大所产生的问题的有（ ）。","material":"","options":[{"key":"A","text":"服务水平下降，影响销售利润和企业信誉"},{"key":"B","text":"增加仓库面积和库存管理成本，从而提高产品成本"},{"key":"C","text":"造成企业资源的大量闲置"},{"key":"D","text":"造成产成品和原材料的有形损耗和无形损耗"},{"key":"E","text":"使订货间隔期缩短，订货次数增加，订货成本提高"}],"answer":["B","C","D"],"explanation":"库存量过大所产生的问题：①增加仓库面积和库存管理成本，从而提高产品成本。②占用大量的流动资金。③造成产成品和原材料的有形损耗和无形损耗。④造成企业资源的大量闲置。③掩盖了企业生产经营过程中的各种矛盾和问题，不利于企业提高管理水平。②造成生产系统原材料或其他物料供应不足，影响生产过程的正常进行。③使订货间隔期缩短，订货次数增加，订货成本提高。④影响生产过程的均衡性和装配时的成套性。","id":"guanfang-0469","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"multi","stem":"下列属于库存量过小所产生的问题的有（ ）。","material":"","options":[{"key":"A","text":"影响生产过程的均衡性和装配时的成套性"},{"key":"B","text":"服务水平下降，影响销售利润和企业信誉"},{"key":"C","text":"造成企业资源的大量闲置"},{"key":"D","text":"造成产成品和原材料的有形损耗和无形损耗"},{"key":"E","text":"造成生产系统原材料或其他物料供应不足，影响生产过程的正常进行"}],"answer":["A","B","D"],"explanation":"库存管理成本包括：①仓储成本，是指维持库存物料本身所需的花费。②订货成本，是指每次订购物料所需的联系、谈判、运输、检验等费用，与订购次数有关。③机会成本，主要包括两方面的内容，一是由于库存不够带来的缺货损失；二是物料本身占用一定资金，企业会失去将这部分资金改作他用的机会所带来的损失。","id":"guanfang-0470","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"multi","stem":"库存管理成本包括（)。","material":"","options":[{"key":"A","text":"仓储成本"},{"key":"B","text":"订货成本"},{"key":"C","text":"销售成本"},{"key":"D","text":"机会成本"},{"key":"E","text":"供货成本"}],"answer":["B","C","D","E"],"explanation":"库存控制的主要作用:①在保证企业生产、经营需求的前提下，使库存量经常保持在合理的范围内。②掌握库存量动态，避免超储或缺货现象。③减少库存空间占用，降低库存管理成本。④控制库存资金占用，加速资金周转。","id":"guanfang-0471","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"single","stem":"库存控制的主要作用有（ ）。","material":"","options":[{"key":"A","text":"调控生产进度、投入进度"},{"key":"B","text":"在保证企业生产、经营需求的前提下，使库存量经常保持在合理的范围内"},{"key":"C","text":"掌握库存量动态，避免超储或缺货现象"},{"key":"D","text":"减少库存空间占用，降低库存管理成本"},{"key":"E","text":"控制库存资金占用，加速资金周转"}],"answer":["B"],"explanation":"生产调度是指组织执行生产进度计划，是对生产计划的执行进行的监督、检查和控制，以及发现偏差及时调整的过程。","id":"guanfang-0472","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"single","stem":"企业对生产计划的执行进行监督、检查和控制，发现偏差并及时调整的过程是","material":"","options":[{"key":"A","text":"库存控制"},{"key":"B","text":"生产调度"},{"key":"C","text":"生产进度控制"},{"key":"D","text":"在制品控制"}],"answer":["B"],"explanation":"生产调度以生产进度计划为依据，生产进度计划要通过生产调度来实现。","id":"guanfang-0473","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"single","stem":"企业生产调度的依据是（ ）。","material":"","options":[{"key":"A","text":"销售计划"},{"key":"B","text":"生产进度计划"},{"key":"C","text":"产品出产计划"},{"key":"D","text":"产品研发计划"}],"answer":["A"],"explanation":"企业应该按照上下贯通、左右协调、集中统一、灵活有效的原则建立生产调度系统。在各个生产环节中都应设置专职或兼职的调度机构和人员，负责处理日常生产活动中产生的各种偏差。大型企业一般设厂部、车间和工段三级调度。中小型企业一般只设厂部、车间二级调度。","id":"guanfang-0474","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第四节生产作业控制","point":"","type":"multi","stem":"关于生产调度系统的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"建立原则是上下贯通、左右协调、集中统一、灵活有效"},{"key":"B","text":"只需在重要环节中设置专职或兼职的调度机构和人员"},{"key":"C","text":"中小型企业一般设厂部、车间和工段三级调度"},{"key":"D","text":"大型企业一般只设厂部、车间二级调度"}],"answer":["A","C","D"],"explanation":"调度工作制度一般有调度值班制度、调度报告制度、调度会议制度、现场调度制度、班前班后小组会制度等。","id":"guanfang-0475","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第五节现代生产管理方式","point":"","type":"single","stem":"企业资源计划（ERP）的核心模块是（ ）。","material":"","options":[{"key":"A","text":"生产控制模块"},{"key":"B","text":"物流管理模块"},{"key":"C","text":"财务管理模块"},{"key":"D","text":"人力资源管理模块"}],"answer":["A"],"explanation":"企业资源计划（ERP）主要包括生产控制模块、物流管理模块、财务管理模块和人力资源管理模块。其中，生产控制模块是ERP的核心模块，它将分散的生产流程有机结合，加快生产速度，减少生产过程中材料、半成品的积压和浪费。","id":"guanfang-0476","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第五节现代生产管理方式","point":"","type":"single","stem":"企业资源计划（ERP）的模块中，实现生产运转的重要条件和保障的是","material":"","options":[{"key":"A","text":"人力资源管理模块"},{"key":"B","text":"物流管理模块"},{"key":"C","text":"财务管理模块"},{"key":"D","text":"生产控制模块"}],"answer":["B"],"explanation":"企业资源计划（ERP）的物流管理模块是实现生产运转的重要条件和保障，它包括分销管理、库存控制和采购管理三个部分。","id":"guanfang-0477","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第五节现代生产管理方式","point":"","type":"multi","stem":"企业资源计划（ERP）主要包括（ ）。","material":"","options":[{"key":"A","text":"生产控制模块"},{"key":"B","text":"财务管理模块"},{"key":"C","text":"物流管理模块"},{"key":"D","text":"研发管理模块"},{"key":"E","text":"人力资源管理模块"}],"answer":["A","B","C","E"],"explanation":"目前，生产企业使用的ERP主要包括生产控制模块、物流管理模块、财务管理模块和人力资源管理模块四个部分。","id":"guanfang-0478","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第五节现代生产管理方式","point":"","type":"multi","stem":"ERP的特点包括（ ）。","material":"","options":[{"key":"A","text":"管理范围可以扩展到企业外部"},{"key":"B","text":"由单一型生产方式向混合型生产方式发展"},{"key":"C","text":"突出强调事中控制，使事中控制与事后控制有效结合"},{"key":"D","text":"在计算机网络的使用程度上更为深化"},{"key":"E","text":"不仅应用于生产企业，也可应用于非生产企业以及从事公益事业的企业"}],"answer":["A","B","D","E"],"explanation":"RP具有以下特点：①ERP的管理范围可以扩展到企业外部，实现完整地面向供应链各个环节的有效管理，体现对整个供应链资源进行管理的思想。②ERP将供应链物料 流通体系中产、供、需等环节的运输管理、仓库管理，支持生产保障体系的质量管理、实验室管 理、设备维修、配件管理等纳人其中，使得管理功能大大加强。 ERP由单一型生产方式向混 合型生产方式发展，能较好地支持和管理混合型制造环境，满足企业多元化经营需求，体现精 益生产、敏捷生产的思想。④ERP以企业管理体系为主，支持在线分析处理、售后服务及质量 反馈，突出强调事前控制，使事前控制与事中控制相结合。③运用ERP可以将多企业、多地区 或多国家相联结。③ERP不仅可以应用于生产企业，也可以应用于非生产企业以及从事公益 事业的企业。①ERP在计算机网络的应用程度上更为深化。","id":"guanfang-0479","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第五节现代生产管理方式","point":"","type":"single","stem":"精益生产管理的目标是（ ）。","material":"","options":[{"key":"A","text":"实现生产自动化，提高生产效率"},{"key":"B","text":"扩大生产规模，降低单位成本"},{"key":"C","text":"在提供令顾客满意的产品与服务的同时，把浪费降到最低"},{"key":"D","text":"推行全面质量管理，消除产品缺陷"}],"answer":["C"],"explanation":"精益生产管理的目标是企业在提供令顾客满意的产品与服务的同时，把浪费降到最低。","id":"guanfang-0480","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第五节现代生产管理方式","point":"","type":"single","stem":"丰田生产方式（TPS）最基本的理念是（ ）。","material":"","options":[{"key":"A","text":"以人为本"},{"key":"B","text":"从顾客的需求出发、杜绝浪费资源"},{"key":"C","text":"更短的生产周期"},{"key":"D","text":"零缺陷"}],"answer":["B"],"explanation":"丰田生产方式（TPS）是一个包含了多种制造技术和管理技术的综合技术体系。TPS不仅是一种彻底追求生产过程合理性、高效性和灵活性的生产管理工具及技术，更是一种管理理念。其最基本的理念是从顾客的需求出发，杜绝浪费材料、人力、时间、空间、能量和运输等资源。","id":"guanfang-0481","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第五节现代生产管理方式","point":"","type":"single","stem":"丰田生产方式（TPS）中，控制各道工序生产活动的信息系统工具是","material":"","options":[{"key":"A","text":"看板管理系统"},{"key":"B","text":"库存管理"},{"key":"C","text":"主生产计划"},{"key":"D","text":"准时生产"}],"answer":["A"],"explanation":"看板管理系统是对生产过程中各道工序生产活动进行控制的信息系统。","id":"guanfang-0482","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第五节现代生产管理方式","point":"","type":"single","stem":"“没有看板不能生产，也不能运送”这一规则体现了看板管理（ ）。","material":"","options":[{"key":"A","text":"可以显示生产以及运送的工作指令"},{"key":"B","text":"可以防止过量生产和过量运送"},{"key":"C","text":"是进行目视管理的工具"},{"key":"D","text":"是改善的工具"}],"answer":["B"],"explanation":"看板的功能包括：①显示生产以及运送的工作指令。②防止过量生产和过量运送。③进行目视管理的工具。④改善的工具。其中，依据“没有看板不能生产，也不能运送”这一规则，看板管理能够防止过量生产和过量运送。","id":"guanfang-0483","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第五节现代生产管理方式","point":"","type":"single","stem":"看板通常是一张在透明塑料袋内的卡片，经常被使用的看板主要有取料看板和（ ）两种。","material":"","options":[{"key":"A","text":"库存看板"},{"key":"B","text":"来料看板"},{"key":"C","text":"生产看板"},{"key":"D","text":"考评看板"}],"answer":["C"],"explanation":"通常，看板是一张在透明塑料袋内的卡片。经常被使用的看板主要有两种：①取料看板，标明了后道工序应领取物料的数量等信息。②生产看板，显示了前道工序应生产物品的数量等信息。","id":"guanfang-0484","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第五节现代生产管理方式","point":"","type":"multi","stem":"精益思想的原则包括（ ）。","material":"","options":[{"key":"A","text":"正确定义价值"},{"key":"B","text":"识别价值流"},{"key":"C","text":"流动"},{"key":"D","text":"批量生产"},{"key":"E","text":"追求尽善尽美"}],"answer":["A","B","C","E"],"explanation":"精益思想强调的原则包括：①正确定义价值。②识别价值流。③流动。①拉动。③追求尽善尽美。","id":"guanfang-0485","bank":"guanfang"},{"chapter":"第四章分销渠道管理","section":"第五节现代生产管理方式","point":"","type":"multi","stem":"丰田生产方式（TPS）是一个包含了多种制造技术和管理技术的综合技术体系，其具体的思想和手段主要包括（ ）。","material":"","options":[{"key":"A","text":"准时制"},{"key":"B","text":"自动化"},{"key":"C","text":"以人为本"},{"key":"D","text":"标准化作业"},{"key":"E","text":"看板管理系统"}],"answer":["A","B","D","E"],"explanation":"丰田生产方式（TPS）是指包括经营理念、生产组织、物流控制、质量管理、成本控制、库存管理、现场管理和现场改善等在内的较为完整的生产管理技术与方法体系，具体的思想和手段包括：①准时制和自动化。②标准化作业。③多技能作业员。④看板管理系统。③全员参与的现场改善活动。③全面质量管理。","id":"guanfang-0486","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节质量与质量管理","point":"","type":"single","stem":"物美价廉”“物有所值”体现了质量的（ ）。","material":"","options":[{"key":"A","text":"经济性"},{"key":"B","text":"广义性"},{"key":"C","text":"时效性"},{"key":"D","text":"相对性"}],"answer":["A"],"explanation":"顾客和企业关注获得相应质量所需要付出的成本，关注是否能用最少的投入获得最大的效益。“物美价廉”“物有所值”“性价比高”等均反映出质量的经济性。","id":"guanfang-0487","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节质量与质量管理","point":"","type":"single","stem":"若超过规定的特性值要求会使产品整体功能丧失，这一质量特性属于","material":"","options":[{"key":"A","text":"关键质量特性"},{"key":"B","text":"重要质量特性"},{"key":"C","text":"次要质量特性"},{"key":"D","text":"一般质量特性"}],"answer":["A"],"explanation":"常用的质量特性分类方法是将质量特性划分为关键、重要和次要三类。其中，关键质量特性是指若超过规定的特性值要求，会直接影响产品安全性或使产品整体功能丧失的质量特性。","id":"guanfang-0488","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节质量与质量管理","point":"","type":"multi","stem":"一般来说，服务质量特性包括（)。","material":"","options":[{"key":"A","text":"可靠性"},{"key":"B","text":"响应性"},{"key":"C","text":"移情性"},{"key":"D","text":"无形性"},{"key":"E","text":"经济性"}],"answer":["A","B","C"],"explanation":"服务质量特性是服务产品具有的内在特性。一般来说，服务质量包括：①可靠性，即准确地履行服务承诺的能力。②响应性，即回应顾客并迅速提供服务的能力。③保证性，即员工具有的知识、礼节以及表达出自信与使人信服的能力。④移情性，即设身处地地为顾客着想和对顾客给予特别关注的能力。③有形性，即有形的设备、设施、人员。不同的服务对各种特性要求的侧重点会有所不同。","id":"guanfang-0489","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节质量与质量管理","point":"","type":"multi","stem":"软件质量特性包括（ ）。","material":"","options":[{"key":"A","text":"功能性"},{"key":"B","text":"时效性"},{"key":"C","text":"易使用性"},{"key":"D","text":"可移植性"},{"key":"E","text":"可维护性"}],"answer":["A","C","D","E"],"explanation":"软件质量是反映软件产品满足规定和潜在需求能力的特性的总和。描述和评价软件质量的一组属性称为软件质量特性。软件质量特性可以分为功能性、可靠性、易使用性、高效性、可维护性、可移植性等六种类型。","id":"guanfang-0490","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节质量与质量管理","point":"","type":"single","stem":"企业总的质量宗旨和质量管理方向指的是（ ）。","material":"","options":[{"key":"A","text":"质量目标"},{"key":"B","text":"质量方针"},{"key":"C","text":"质量策划"},{"key":"D","text":"质量改进"}],"answer":["B"],"explanation":"质量方针是指企业总的质量宗旨和质量管理方向。企业的质量方针是企业经营总方针的组成部分，是企业管理者对质量管理的指导思想和承诺。","id":"guanfang-0491","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节质量与质量管理","point":"","type":"single","stem":"质量策划的关键是（ ）。","material":"","options":[{"key":"A","text":"开展质量控制活动"},{"key":"B","text":"制定质量目标并设法使其实现"},{"key":"C","text":"建立质量保证体系"},{"key":"D","text":"实施质量改进措施"}],"answer":["B"],"explanation":"质量策划致力于制定质量目标并规定必要的运行过程，合理分配相关资源。质量策划的关键是制定质量目标并设法使其实现。","id":"guanfang-0492","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节质量与质量管理","point":"","type":"single","stem":"内部质量保证指的是（ ）。","material":"","options":[{"key":"A","text":"企业向自己的管理者提供信任"},{"key":"B","text":"企业向供应商提供信任"},{"key":"C","text":"企业向顾客提供信任"},{"key":"D","text":"企业建立完善的质量管理体系"}],"answer":["A"],"explanation":"质量保证可分为内部和外部两种：内部质量保证指的是企业向自己已的管理者提供信任；外部质量保证指的是企业向顾客或外部其他方提供信任。","id":"guanfang-0493","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节质量与质量管理","point":"","type":"multi","stem":"根据国际标准化组织的观点，质量管理活动通常包括（ ）。","material":"","options":[{"key":"A","text":"制定质量方针和质量目标"},{"key":"B","text":"质量成本核算"},{"key":"C","text":"质量策划"},{"key":"D","text":"质量控制"},{"key":"E","text":"质量改进"}],"answer":["A","C","D","E"],"explanation":"国际标准化组织认为，质量管理是指从质量方面指挥和控制组织的协调活动。这些活动通常包括制定质量方针和质量目标、质量策划、质量控制、质量保证和质量改进。","id":"guanfang-0494","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节质量检验与质量认证","point":"","type":"single","stem":"将质量检验方式分为计数检验和计量检验，其划分标准是（ ）。","material":"","options":[{"key":"A","text":"按检验数量"},{"key":"B","text":"按质量特性值"},{"key":"C","text":"按检验目的的特征"},{"key":"D","text":"按检验方法的特征"}],"answer":["B"],"explanation":"按质量特性值，质量检验方式可分为计数检验和计量检验。","id":"guanfang-0495","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节质量检验与质量认证","point":"","type":"multi","stem":"按检验目的的特征，质量检验方式包括（ ）。","material":"","options":[{"key":"A","text":"验收检验"},{"key":"B","text":"破坏性检验"},{"key":"C","text":"过程检验"},{"key":"D","text":"非破坏性检验"},{"key":"E","text":"监督检验"}],"answer":["A","C","E"],"explanation":"按检验目的的特征，质量检验方式包括验收检验、过程检验和监督检验。","id":"guanfang-0496","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节质量检验与质量认证","point":"","type":"multi","stem":"质量检验的基本要素包括（ ）。","material":"","options":[{"key":"A","text":"度量"},{"key":"B","text":"比较"},{"key":"C","text":"判断"},{"key":"D","text":"处理"},{"key":"E","text":"改进"}],"answer":["A","B","C","D"],"explanation":"质量检验包括以下四个基本要素：①度量。采用试验、测量、化验、分析与感官检查等方法测定产品的质量特性。②比较。将测定结果同质量标准进行比较。③判断。根据比较结果，对检验项目或产品作出合格与否的判定。④处理。对单件受检产品，决定是合格放行还是不合格返工、返修或报废。","id":"guanfang-0497","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节质量检验与质量认证","point":"","type":"multi","stem":"质量检验的基本任务包括（ ）。","material":"","options":[{"key":"A","text":"鉴别产品的质量水平，确定其是否符合标准或能否接收"},{"key":"B","text":"判断工序质量状态，为工序能力控制提供依据"},{"key":"C","text":"对检验不合格的产品进行维修或报废处理"},{"key":"D","text":"改善检测手段，提高检测作业发现质量缺陷的能力和有效性"},{"key":"E","text":"反馈质量信息，报告质量状况与趋势，提供质量改进的建议"}],"answer":["A","B","D","E"],"explanation":"一般来说，质量检验有五项基本任务：①鉴别产品（或零部件、外购物料等）的质量水平，确定其是否符合标准或能否接收。②判断工序质量状态，为工序能力控制提供依据。③了解产品质量的等级或缺陷的严重程度。④改善检测手段，提高检测作业发现质量缺陷的能力和有效性。③反馈质量信息，报告质量状况与趋势，提供质量改进的建议。","id":"guanfang-0498","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节质量检验与质量认证","point":"","type":"single","stem":"工序检验中，为下批生产做好生产技术准备，保证下批生产时能有较好的生产技术状态的是（ ）。","material":"","options":[{"key":"A","text":"首件检验"},{"key":"B","text":"末件检验"},{"key":"C","text":"逐件检验"},{"key":"D","text":"巡回检验"}],"answer":["B"],"explanation":"工序检验通常有三种形式：首件检验、巡回检验、末件检验。其中，末件检验是指主要靠模具、装置保证质量的加工工序，当批量加工完成后，对最后的一件或几件进行检查验证的活动。末件检验的主要目的是为下批生产做好生产技术准备，保证下批生产时能有较好的生产技术状态。","id":"guanfang-0499","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节质量检验与质量认证","point":"","type":"single","stem":"关于进货检验的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"进货检验是对外购货品人库后进行的集中检验"},{"key":"B","text":"进货检验的检验对象包括采购的原材料、辅料、外购件、外协件及配套件等"},{"key":"C","text":"收货检验应由生产操作工人完成，以节约检验成本"},{"key":"D","text":"进货检验的目的是对采购货品进行成本核算"}],"answer":["B"],"explanation":"进货检验是对外购货品的质量检验，即对采购的原材料、辅料、外购件、外协件及配套件等进行的人库前的接收检验。为了保证外购货品的质量，进厂时的收货检验应由专职检验人员按照规定的检查内容、检查方法及检查数量进行。","id":"guanfang-0500","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节质量检验与质量认证","point":"","type":"multi","stem":"下列关于工序检验的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"检验对象为在制品"},{"key":"B","text":"须检验影响质量的主要工序因素"},{"key":"C","text":"最终目的是剔除不合格品"},{"key":"D","text":"通过检验获取信息以实现质量控制与改进"},{"key":"E","text":"全面考核外购货品的质量"}],"answer":["A","B","D"],"explanation":"工序检验是对原材料投产后陆续形成成品之前的每道工序上的在制品所做的符合性检验。其目的是防止加工过程中出现大批不合格品，避免不合格品流入后道工序。因此，工序检验不仅要检验在制品是否达到规定的质量要求，还要检验影响质量的主要工序因素，以判断生产过程是否处于正常的受控状态。工序检验不是单纯地对产品质量进行把关或剔除不 合格品，而是要通过检验获取信息，进行质量控制和质量改进。","id":"guanfang-0501","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节质量检验与质量认证","point":"","type":"single","stem":"质量检验的“三检制”包括（ ）。","material":"","options":[{"key":"A","text":"首检、巡检、完工检"},{"key":"B","text":"自检、互检、专检"},{"key":"C","text":"抽检、全检、免检"},{"key":"D","text":"进料检、过程检、完工检"}],"answer":["B"],"explanation":"三检制是指“自检”“互检”“专检”相结合的一种检验制度。自检是指操作者对自已生产的产品，按图样、工艺或合同中规定的技术标准自行检验，并做出是否合格判断的活动。互检是指操作者之间的相互检验，既可以是同道工序操作者之间的相互检验，也可以是上下道工序操作者之间或同道工序轮班者之间的交接检验。专检是指由专职检验员进行的检验。","id":"guanfang-0502","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节质量检验与质量认证","point":"","type":"single","stem":"下列选项中，不能实现产品可追溯性的是（ ）。","material":"","options":[{"key":"A","text":"产品或服务检验的操作者姓名"},{"key":"B","text":"产品或服务的检验情况分析"},{"key":"C","text":"产品或服务的销售数量分析"},{"key":"D","text":"产品或服务的质量状况标识"}],"answer":["C"],"explanation":"可追溯性是指通过记录和标识，能够追溯研究对象的历史、应用情况或所处位置的能力。对产品或服务而言，可追溯性涉及的对象包括原材料和零部件的来源、产品的加工流程、产品或服务交付后的流向等。产品或服务的标识和记录以及在各种文件上的留名都是可追溯性的依据，必要时能查清责任者的姓名、特定事件发生的时间和地点。3.人。在不合格品处置中，返修是指“为使不合格产品或服务满足预期用途而对其采取的措施”。返修产品经采取补救措施后，虽仍不能完全符合质量要求，但基本上能满足预期使用要求。返修与返工的区别在于，返修只能减轻产品不合格的程度，使不合格品尚能达到基本使用要求而被接收。","id":"guanfang-0503","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节质量检验与质量认证","point":"","type":"single","stem":"在不合格品处置中，采取措施后基本能满足预期使用要求的是（)。","material":"","options":[{"key":"A","text":"返修"},{"key":"B","text":"返工"},{"key":"C","text":"降级"},{"key":"D","text":"报废"}],"answer":["C"],"explanation":"质量合格品与不合格品的判定有两种方法：符合性判定和适用性判定。符合性判定是判定产品是否符合技术标准。这种判定由检验员或检验部门作出。适用性判定是判定产品是否具有某种使用价值。适用性是指产品所具有的某种使用价值满足用户要求。一个不完全符合质量标准的产品对某些用户来说，其性能和质量可能会满足其使用要求。所以，不合格品不一定等于废品，它可以经过返修再用，或者直接回用。不合格品的适用性判定是一项技术性很强的工作，一般不要求检验员承担处置不合格品的责任。","id":"guanfang-0504","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节质量检验与质量认证","point":"","type":"single","stem":"关于不合格品判定方法的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"符合性判定由检验员或检验部门作出"},{"key":"B","text":"适用性判定是指判定产品是否具有某种使用价值"},{"key":"C","text":"符合性判定侧重判断产品能否满足用户使用要求"},{"key":"D","text":"不合格品不一定视为废品"}],"answer":["C"],"explanation":"在不合格品管理中，应坚持“三不放过”原则，即“不查清不合格原因不放过，不查清责任者不放过，不落实改进措施不放过”。","id":"guanfang-0505","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节质量管理工具","point":"","type":"single","stem":"在质量管理中，寻找影响产品质量主要因素的工具是（ ）。","material":"","options":[{"key":"A","text":"调查表"},{"key":"B","text":"散布图"},{"key":"C","text":"排列图"},{"key":"D","text":"因果分析图"}],"answer":["C"],"explanation":"排列图又称主次因素分析图或帕累托图。美国质量管理专家朱兰将帕累托图应用于质量管理领域，并使之成为寻找影响产品质量主要因素的有效工具。","id":"guanfang-0506","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节质量管理工具","point":"","type":"single","stem":"在质量管理中，需要归集性质相同的数据，对原始质量数据加以分类整理的数理统计方法是（ ）。","material":"","options":[{"key":"A","text":"直方图法"},{"key":"B","text":"因果图法"},{"key":"C","text":"排列图法"},{"key":"D","text":"分层法"}],"answer":["D"],"explanation":"分层法是质量管理中常用的数理统计方法，是指把收集到的原始质量数据按照一定的目的加以分类整理，再据此进行质量分析的方法。分层的目的是归集性质相同的数据。分层法的关键是尽量使同一层的数据波动小一些，各层间的数据波动大一些。","id":"guanfang-0507","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节质量管理工具","point":"","type":"single","stem":"关于工序能力的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"工序能力是指受控状态下工序对加工质量的保证能力"},{"key":"B","text":"工序能力具有再现性或一致性"},{"key":"C","text":"一般情况下，产品质量波动越大，加工质量一致性越高"},{"key":"D","text":"一般情况下，工序能力越强，投入越多"}],"answer":["C"],"explanation":"工序能力是指受控状态下工序对加工质量的保证能力，具有再现性或一致性的固有特性。工序能力可用工序产品质量特性值的变动来衡量，一般情况下，产品质量的实际波动越小，意味着该工序加工质量一致性越高。工序能力的大小应和质量要求相适应，工序能力过强在经济性上往往是不合适的，因为这需要投入更多的资金、时间、人力等资源降低产品质量波动。","id":"guanfang-0508","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节质量管理工具","point":"","type":"single","stem":"某零件的长度设计要求为（20±0.15）毫米，现抽取100件样本，测得样本长度的平均值为 20.05 毫米，样本标准差为 0.04 毫米，则该工序的工序能力指数为（ ）。","material":"","options":[{"key":"A","text":"0.83"},{"key":"B","text":"1.25"},{"key":"C","text":"1.00"},{"key":"D","text":"0.67"}],"answer":["B"],"explanation":"工序能力指数Cp=--_ 20.15-19.85=1.25。 其中, T为公差,T和 7,分","id":"guanfang-0509","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节质量管理工具","point":"","type":"single","stem":"若某工序能力指数为1.5,可以判断该工序的工序能力（ ）。","material":"","options":[{"key":"A","text":"正常"},{"key":"B","text":"充足"},{"key":"C","text":"不足"},{"key":"D","text":"过剩"}],"answer":["B"],"explanation":"上序能方指数效p-6-～6s～-～6×0.04-1.25。其中，1为公差,u和1L分别是公差上限和公差下限，为工序产品质量特性值的标准差，s为样本标准差。","id":"guanfang-0510","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节质量管理工具","point":"","type":"single","stem":"下列处置措施中，属于工序能力指数过大时采用的有（ ）。","material":"","options":[{"key":"A","text":"合并或减少工序"},{"key":"B","text":"改用精度较低的设备与原材料"},{"key":"C","text":"更改设计，提高产品的技术要求"},{"key":"D","text":"暂停加工，立即追查原因，全检剔除不合格品"},{"key":"E","text":"放宽公差，降低产品的技术要求"}],"answer":["B"],"explanation":"工序能力指数判断准则见下表。","id":"guanfang-0511","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第四节全面质量管理与六西格玛管理","point":"","type":"single","stem":"某企业在产品的设计阶段，采用失效模式找出产品的薄弱环节，尽可能消除隐患，这体现了全面质量管理的（ ）。","material":"","options":[{"key":"A","text":"预防原则"},{"key":"B","text":"经济原则"},{"key":"C","text":"协作原则"},{"key":"D","text":"系统原则"}],"answer":["A"],"explanation":"↑全面质量管理的预防原则主要指的是凡事要防患于未然","id":"guanfang-0512","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第四节全面质量管理与六西格玛管理","point":"","type":"multi","stem":"下列属于全面质量管理“三全一多样”要求的有（ ）。","material":"","options":[{"key":"A","text":"全企业的质量管理"},{"key":"B","text":"全过程的质量管理"},{"key":"C","text":"全产业链的质量管理"},{"key":"D","text":"全员参与的质量管理"},{"key":"E","text":"方法多种多样的质量管理"}],"answer":["A","B","D","E"],"explanation":"在推行全面质量管理时，“三全一多样”的要求指的是全企业的质量管理、全过程的质量管理、全员参与的质量管理以及方法多种多样的质量管理。","id":"guanfang-0513","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第四节全面质量管理与六西格玛管理","point":"","type":"multi","stem":"下列各项中，属于全面质量管理实施原则的有（ ）。","material":"","options":[{"key":"A","text":"预防原则"},{"key":"B","text":"协作原则"},{"key":"C","text":"效率优先原则"},{"key":"D","text":"经济原则"},{"key":"E","text":"抓住思想、目标、体系、技术四个要领"}],"answer":["A","B","D","E"],"explanation":"全面质量管理实施的原则包括：①预防原则。②经济原则。③协作原则。抓住思想、目标、体系、技术四个要领。","id":"guanfang-0514","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第四节全面质量管理与六西格玛管理","point":"","type":"single","stem":"在具体实施全面质量管理时，“五步法”指的是（ ）。","material":"","options":[{"key":"A","text":"计划、执行、检查、处理、总结"},{"key":"B","text":"决策、准备、开始、扩展、综合"},{"key":"C","text":"筹备、决策、开始、扩展、综合"},{"key":"D","text":"组织、培训、执行、检验、考核"}],"answer":["B"],"explanation":"在具体实施全面质量管理时，可以遵循“五步法”进行。这五步分别是决策、准备、开始、扩展和综合。","id":"guanfang-0515","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第四节全面质量管理与六西格玛管理","point":"","type":"single","stem":"PDCA循环中，了解顾客显在或潜在的对产品或服务的需求发生在（阶段。","material":"","options":[{"key":"A","text":"计划"},{"key":"B","text":"执行"},{"key":"C","text":"检查"},{"key":"D","text":"处理"}],"answer":["A"],"explanation":"计划阶段的主要内容是通过市场调查、客户访问、了解国家经济政策与产业发展导向等，了解顾客显在或潜在的对产品或服务的需求，确定企业质量方针、政策、目标和计划等。","id":"guanfang-0516","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第四节全面质量管理与六西格玛管理","point":"","type":"single","stem":"PDCA循环中，通过总结经验教训形成有关标准，体现了PDCA循环（ ）的特点。","material":"","options":[{"key":"A","text":"大环套小环，小环保大环"},{"key":"B","text":"不断循环，逐步提高"},{"key":"C","text":"各环节独立，互不影响"},{"key":"D","text":"推动PDCA循环，关键在处理阶段"}],"answer":["D"],"explanation":"扌推动PDCA循环，关键在处理阶段。如果只有前三个阶段，没有总结成功经验和失败教训，并形成有关标准，在制度和规定中就不能巩固成绩、吸取教训，也就不能防止类似问题再次发生。","id":"guanfang-0517","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第四节全面质量管理与六西格玛管理","point":"","type":"multi","stem":"在具体实施全面质量管理的综合阶段，需要进行整合和规划的方面有","material":"","options":[{"key":"A","text":"目标"},{"key":"B","text":"人员"},{"key":"C","text":"供应商管理"},{"key":"D","text":"关键业务流程"},{"key":"E","text":"评审和审核"}],"answer":["A","B","D","E"],"explanation":"在具体实施全面质量管理的综合阶段，需要从目标、人员、关键业务流程以及评审和审核四个方面进行整合和规划。","id":"guanfang-0518","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第四节全面质量管理与六西格玛管理","point":"","type":"multi","stem":"在具体实施全面质量管理的开始阶段，对试点单位质量评估主要涉及的内容包括（ ）。","material":"","options":[{"key":"A","text":"顾客忠诚度"},{"key":"B","text":"市场占有率"},{"key":"C","text":"不良质量成本"},{"key":"D","text":"质量文化"},{"key":"E","text":"质量管理体系"}],"answer":["A","C","D","E"],"explanation":"在具体实施全面质量管理的开始阶段，企业需要进行项目的试点，在试点中不断总结经验教训。根据试点中总结的经验，评估试点单位的质量，主要涉及以下四个方面：顾客忠诚度、不良质量成本、质量管理体系以及质量文化。在评价的基础上发现问题和寻找改进机会，然后进行有针对性的改进。","id":"guanfang-0519","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第四节全面质量管理与六西格玛管理","point":"","type":"single","stem":"六西格玛组织中，黑带大师属于（ ）。","material":"","options":[{"key":"A","text":"领导层"},{"key":"B","text":"骨干层"},{"key":"C","text":"决策层"},{"key":"D","text":"具体执行层"}],"answer":["B"],"explanation":"六西格玛团队由三个层次组成，以执行领导、倡导者为领导层，以黑带大师、黑带为骨干层，以绿带为具体执行层。三个层次的各类人员具有不同的职责和作用。","id":"guanfang-0520","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第四节全面质量管理与六西格玛管理","point":"","type":"single","stem":"六西格玛组织中，通常为企业各基层部门的骨干或负责人，侧重于六西格玛管理在日常工作中的应用的是（ ）。","material":"","options":[{"key":"A","text":"黑带大师"},{"key":"B","text":"黑带"},{"key":"C","text":"倡导者"},{"key":"D","text":"绿带"}],"answer":["D"],"explanation":"绿带为兼职从事六西格玛项目的人员，是企业内部推行六西格玛管理的众多有底线收益项目的负责人。他们通常为企业各基层部门的骨干或负责人，侧重于六西格玛管理在日常工作中的应用。在实施过程中，绿带可根据实际情况决定六西格玛管理与其他工作的比例。","id":"guanfang-0521","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第四节全面质量管理与六西格玛管理","point":"","type":"single","stem":"六西格玛的具体实施模式DMAIC中，确认顾客的关键需求并识别需要改进的产品或流程的工作属于（ ）阶段。","material":"","options":[{"key":"A","text":"控制"},{"key":"B","text":"测量"},{"key":"C","text":"分析"},{"key":"D","text":"界定"}],"answer":["D"],"explanation":"在界定阶段，需要确认顾客的关键需求并识别需要改进的产品或流程，组成项目团队，制定项目计划，确定要进行测量、分析、改进和控制的关键质量特性，确定项目所涉及的职能部门，将改进项目界定在合理的范围内。制定项目的目标，并估算达成目标后项目带来的预计收益。","id":"guanfang-0522","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第四节全面质量管理与六西格玛管理","point":"","type":"multi","stem":"关于DMAIC的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"强调以顾客为关注焦点"},{"key":"B","text":"强调以数据和统计思想为基础进行管理"},{"key":"C","text":"强调面向结果，关注改善“输出”阶段的缺陷"},{"key":"D","text":"追求提供有创新性的问题解决方案"}],"answer":["C","D"],"explanation":"MAIC强调以顾客（外部和内部）为关注焦点，并将持续改进与顾客满意度以及组织经营目标紧密地联系起来；它强调以数据的语言来描述产品或过程绩效，依据数据进行管理，并充分运用定量分析和统计思想；它追求的是打破旧有习惯、提供有创新性的问题解决方案、实现有实质改变的结果，以适应持续改进的需要；它强调面向过程，并通过降低过程的变异程度或缺陷率实现降低风险、成本与缩短周期等目的。","id":"guanfang-0523","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第五节安全生产管理","point":"","type":"single","stem":"我国安全生产的基本方针是（ ）。","material":"","options":[{"key":"A","text":"安全第一、预防为主、综合治理"},{"key":"B","text":"安全第一、预防为主、防治结合"},{"key":"C","text":"安全优先、治理为主、效益平衡"},{"key":"D","text":"安全第一、综合治理、责任追究"}],"answer":["A"],"explanation":"安全生产的基本方针是劳动过程中做好安全生产工作必须遵守的基本原则，《安全生产法》规定，安全生产工作坚持中国共产党的领导，应当以人为本，坚持人民至上、生命至上，把保护人民生命安全摆在首位，树牢安全发展理念，坚持安全第一、预防为主、综合治理的方针，从源头上防范化解重大安全风险。由此可知，安全生产的基本方针是“安全第一、预防为主、综合治理”。","id":"guanfang-0524","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第五节安全生产管理","point":"","type":"multi","stem":"安全生产的特点包括（ ）。","material":"","options":[{"key":"A","text":"预防性"},{"key":"B","text":"长期性"},{"key":"C","text":"科学性"},{"key":"D","text":"效率性"},{"key":"E","text":"群众性"}],"answer":["A","B","C","E"],"explanation":"安全生产具有预防性、长期性、科学性和群众性四个特点。 主要负责人是本单位安全生产第一责任人，对本单位的安全生产工作全面负责。其他负责人 对职责范围内的安全生产工作负责。","id":"guanfang-0525","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第五节安全生产管理","point":"","type":"single","stem":"根据《中华人民共和国安全生产法》（以下简称《安全生产法》),对本单位安全生产工作全面负责的第一责任人是（ ）。","material":"","options":[{"key":"A","text":"安全生产管理部门负责人"},{"key":"B","text":"生产经营单位主要负责人"},{"key":"C","text":"安全生产管理部门所有员工"},{"key":"D","text":"一线车间负责人"}],"answer":["B"],"explanation":"根据《安全生产法》,生产经营单位的安全生产管理机构以及安全生产管理人员应履行下列七项职责：①组织或者参与拟订本单位安全生产规章制度、操作规程和生产安全事故应急救援预案。②组织或者参与本单位安全生产教育和培训，如实记录安全生产教育和培训情况。③组织开展危险源辨识和评估，督促落实本单位重大危险源的安全管理措施。④组织或者参与本单位应急救援演练。③检查本单位的安全生产状况，及时排查生产安全事故隐患，提出改进安全生产管理的建议。③制止和纠正违章指挥、强令冒险作业、违反操作规程的 行为。①督促落实本单位安全生产整改措施。","id":"guanfang-0526","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第五节安全生产管理","point":"","type":"multi","stem":"根据《安全生产法》,生产经营单位的安全生产管理机构以及安全生产管理人员应履行的职责不包括（ ）。","material":"","options":[{"key":"A","text":"组织或者参与拟订本单位安全生产规章制度、操作规程"},{"key":"B","text":"制订本单位安全生产教育和培训计划"},{"key":"C","text":"如实记录安全生产教育和培训情况"},{"key":"D","text":"检查本单位的安全生产状况，及时排查生产安全事故隐患"}],"answer":["A","B","D"],"explanation":"生产经营单位的主要负责人对本单位的安全生产工作全面负责。《安全生产法》将其职责规定为下列七项内容：①建立健全并落实本单位全员安全生产责任制，加强安全生产标准化建设。②组织制定并实施本单位安全生产规章制度和操作规程。③组织制定并实施本单位安全生产教育和培训计划。④保证本单位安全生产投入的有效实施。③组织建立并落实安全风险分级管控和隐患排查治理双重预防工作机制，智促、检查本单位的安全生产工作，及时消除生产安全事故隐患。③组织制定并实施本单位的生产安全事故应急救援预案。①及时、如实报告生产安全事故。","id":"guanfang-0527","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第五节安全生产管理","point":"","type":"single","stem":"根据《安全生产法》，下列属于生产经营单位主要负责人的安全生产职责的有（ ）。","material":"","options":[{"key":"A","text":"组织制定并实施本单位的生产安全事故应急救援预案"},{"key":"B","text":"制止和纠正违章指挥、强令冒险作业、违反操作规程的行为"},{"key":"C","text":"及时、如实报告生产安全事故"},{"key":"D","text":"督促落实本单位安全生产整改措施"}],"answer":["C"],"explanation":"《安全生产法》第九十四条规定，生产经营单位的主要负责人未履行《安全生产法》规定的安全生产管理职责的，责令限期改正，处2万元以上5万元以下的罚款；逾期未改正的，处5万元以上10万元以下的罚款，责令生产经营单位停产停业整顿。","id":"guanfang-0528","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第五节安全生产管理","point":"","type":"single","stem":"根据《安全生产法》,生产经营单位的主要负责人未履行《安全生产法》规定的安全生产管理职责，被责令限期改正而逾期未改正的，处（ ）的罚款，并责令生产经营单位停产停业整顿。","material":"","options":[{"key":"A","text":"2万元以上5万元以下"},{"key":"B","text":"3万元以上7万元以下"},{"key":"C","text":"5万元以上10万元以下"},{"key":"D","text":"10万元以上20万元以下"}],"answer":["C"],"explanation":"《安全生产法》规定，生产经营单位的主要负责人因未履行《安全生产法》规定的安全生产管理职责受刑事处罚或者撤职处分的，自刑罚执行完毕或者受处分之日起，5 年内不得担任任何生产经营单位的主要负责人；对重大、特别重大生产安全事故负有责任的，终身不得担任本行业生产经营单位的主要负责人。","id":"guanfang-0529","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第五节安全生产管理","point":"","type":"single","stem":"生产经营单位的主要负责人因未履行《安全生产法》规定的安全生产管理职责受刑事处罚或者撤职处分的，自刑罚执行完毕或者受处分之日起，（ ）年内不得担任任何生产经营单位的主要负责人。","material":"","options":[{"key":"A","text":"1"},{"key":"B","text":"2"},{"key":"C","text":"5"},{"key":"D","text":"10"}],"answer":["B"],"explanation":"《安全生产法》第九十五条规定，生产经营单位的主要负责人未履行《安全生产法》规定的安全生产管理职责，导致发生生产安全事故的，由应急管理部门依照下列规定处以罚款：①发生一般事故的，处上一年年收入40%的罚款。②发生较大事故的，处上一年年收入60%的罚款。③发生重大事故的，处上一年年收人 80% 的罚款。④发生特别重大事故的，处上一年年收人100%的罚款。","id":"guanfang-0530","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第五节安全生产管理","point":"","type":"single","stem":"生产经营单位的主要负责人未履行《安全生产法》规定的安全生产管理职责，导致发生较大事故的，处上一年年收入（ ）的罚款。","material":"","options":[{"key":"A","text":"40%"},{"key":"B","text":"60%"},{"key":"C","text":"80%"},{"key":"D","text":"100%"}],"answer":["A"],"explanation":"《安全生产法》第九十六条规定，生产经营单位的其他负责人和安全生产管理人员未履行《安全生产法》规定的安全生产管理职责的，责令限期改正，处1万元以上3万元以下的罚款。","id":"guanfang-0531","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第五节安全生产管理","point":"","type":"single","stem":"生产经营单位的其他负责人和安全生产管理人员未履行《安全生产法》规定的安全生产管理职责的，责令限期改正，处（ ）的罚款。","material":"","options":[{"key":"A","text":"1万元以上3万元以下"},{"key":"B","text":"2万元以上5万元以下"},{"key":"C","text":"5万元以上10万元以下"},{"key":"D","text":"10万元以上20万元以下"}],"answer":["C"],"explanation":"《安全生产法》第一百一十四条规定，发生生产安全事故，对负有责任的生产经营单位除要求其依法承担相应的赔偿等责任外，由应急管理部门依照下列规定处以罚款：①发生一般事故的，处30万元以上100万元以下的罚款。②发生较大事故的，处100万元以上200万元以下的罚款。③发生重大事故的，处200万元以上1000万元以下的罚款。④发生特别重大事故的，处1000万元以上2000万元以下的罚款。 國第七章物流管理","id":"guanfang-0532","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"下列不属于物流基本功能的是（。","material":"","options":[{"key":"A","text":"包装"},{"key":"B","text":"运输"},{"key":"C","text":"增效"},{"key":"D","text":"配送"}],"answer":["C"],"explanation":"物流的基本功能包括运输、储存、装卸搬运、包装、流通加工、配送和信息处理。","id":"guanfang-0533","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"下列物流活动中，把“物”的实体运动的各个阶段连接成为连续的“流”的是（ ）。","material":"","options":[{"key":"A","text":"配送"},{"key":"B","text":"包装"},{"key":"C","text":"装卸搬运"},{"key":"D","text":"流通加工"}],"answer":["C"],"explanation":"装卸搬运是指在物流活动中的出现频率高、根据物流运输和保管需要而进行的作业。只有通过装卸搬运作业，“物”的实体运动的各个阶段才能连接成为连续的“流”,物流活动才可以顺利进行。","id":"guanfang-0534","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"下列物流活动中，实现了“物”由供应地向接收地的移动和资源优化配置的是（ ）。","material":"","options":[{"key":"A","text":"运输"},{"key":"B","text":"储存"},{"key":"C","text":"装卸搬运"},{"key":"D","text":"流通加工"}],"answer":["A"],"explanation":"运输是指使物品发生场所空间转移的物流活动。运输实现了“物”由供应地向接收地的移动，实现资源的优化配置，在物流活动中占有重要地位。","id":"guanfang-0535","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"下列物流活动中，可以消除生产和消费之间的时间差的是（ ）。","material":"","options":[{"key":"A","text":"装卸搬运"},{"key":"B","text":"运输"},{"key":"C","text":"储存"},{"key":"D","text":"配送"}],"answer":["C"],"explanation":"个储存也称仓储，即以改变“物”的时间状态为目的的物流活动，消除生产和消费之间的时间差。储存可以实现物流在时间上的优化配置。","id":"guanfang-0536","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"下列物流活动中，提高了物流对象的附加价值，降低了物流系统的成本的是（ ）。","material":"","options":[{"key":"A","text":"流通加工"},{"key":"B","text":"包装"},{"key":"C","text":"装卸搬运"},{"key":"D","text":"信息处理"}],"answer":["A"],"explanation":"流通加工，即物品从生产领域向消费领域流动的过程中，为促进物品销售、维护物品质量和提高物流效率，对物品进行加工，使物品发生物理或化学变化的活动。流通加工增加了物流系统的服务功能，提高了物流对象的附加价值，降低了物流系统的成本。","id":"guanfang-0537","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"multi","stem":"关于物流含义的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"物流服务是非实物形态的商品"},{"key":"B","text":"物流活动是生产性服务活动"},{"key":"C","text":"物流活动创造价值"},{"key":"D","text":"物流服务是典型的实物形态的商品"},{"key":"E","text":"物流活动只能创造空间价值"}],"answer":["A","B","C"],"explanation":"物流包含以下三个方面的含义：①物流服务是非实物形态的商品。②物流活动 是生产性服务活动。③物流活动创造价值。这一价值既包括时间价值，又包括空间价值。","id":"guanfang-0538","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"下列选项中，不属于包装的功能的是（ ）。","material":"","options":[{"key":"A","text":"销售功能"},{"key":"B","text":"方便功能"},{"key":"C","text":"美化功能"},{"key":"D","text":"保护功能"}],"answer":["C"],"explanation":"包装主要有保护功能、方便功能和销售功能。","id":"guanfang-0539","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"某些商品采用精美的包装激发人们的购买欲望，刺激其购买，这体现了包装的（ ）。","material":"","options":[{"key":"A","text":"销售功能"},{"key":"B","text":"美化功能"},{"key":"C","text":"保护功能"},{"key":"D","text":"方便功能"}],"answer":["A"],"explanation":"包装的销售功能主要体现为：精美的包装能激发人们的购买欲望，刺激顾客的购买行为。","id":"guanfang-0540","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"multi","stem":"关于包装的方便功能的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"便于保护物品本身的原有使用价值"},{"key":"B","text":"便于管理者识别、存取、盘点"},{"key":"C","text":"防止物品破损变形"},{"key":"D","text":"包装的集合方法和定量性特征加快了验收速度，节约了验收时间"},{"key":"E","text":"防止物品发生受潮、发霉、变质、生锈等物理化学变化"}],"answer":["A","B","D"],"explanation":"方便功能主要体现在包装使物品便于流通，包装便于保护物品本身的原有使用价值，包装物上的各种标志和标识便于管理者识别、存取、盘点，有特殊要求的物品易于引起注意；包装的集合方法和定量性特征加快了验收速度，节约了验收时间；包装规格尺寸、重量、形态适当时，便于进行装卸搬运操作，提高装卸搬运效率，特别是尺寸与运输工具的箱、仓容积吻合时，使物品更便于运输，提高运输效率。","id":"guanfang-0541","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"下列包装材料中，易于复用、回收，便于洗刷、消毒、灭菌，一般不会造成公害的是（ ）。","material":"","options":[{"key":"A","text":"纸包装"},{"key":"B","text":"玻璃包装"},{"key":"C","text":"木材包装"},{"key":"D","text":"塑料包装"}],"answer":["B"],"explanation":"玻璃包装容器易于复用、回收，便于洗刷、消毒、灭菌，一般不会造成公害，原材料资源丰富，价格便宜稳定。","id":"guanfang-0542","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"multi","stem":"关于塑料包装材料的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"具有一定的强度、弹性，耐摩擦、抗振动、防潮"},{"key":"B","text":"具有优良的比强度"},{"key":"C","text":"化学稳定性较好，防锈蚀"},{"key":"D","text":"属于轻质材料，加工成型简单"},{"key":"E","text":"有优良的透明性和表面光泽，印刷和装饰性良好"}],"answer":["A","C","D","E"],"explanation":"塑料包装材料的主要优点在于塑料具有一定的强度、弹性、耐摩擦、抗振动、防潮和气体阻漏等性能，化学稳定性较好，防锈蚀；塑料属于轻质材料，加工成型简单，有优良的透明性和表面光泽，印刷和装饰性良好。但是，塑料容易产生公害，造成白色污染。","id":"guanfang-0543","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"multi","stem":"关于金属包装材料的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"不易破碎、不透气、防潮、防光，能有效保护内装物"},{"key":"B","text":"具有良好的延展性和装潢效果"},{"key":"C","text":"耐摩擦和防潮性能好"},{"key":"D","text":"应用成本高、能耗大"},{"key":"E","text":"具有优良的比强度"}],"answer":["A","B","D"],"explanation":"金属包装材料的优点有不易破碎、不透气、防潮、防光等，能有效保护内装物；具有良好的延展性；其加工技术成熟，有特殊光泽，具有良好的装潢效果；易于再生使用。但是，金属材料在包装上的应用成本高、能耗大，在流通中容易生锈。","id":"guanfang-0544","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"关于包装操作的说法中，错误的是（。","material":"","options":[{"key":"A","text":"裹包可使用纸张、塑料薄膜等材料"},{"key":"B","text":"封口直接影响包装的密封性能"},{"key":"C","text":"检重是检查包装内容物的重量"},{"key":"D","text":"充填时要求物品在容器内有序排列"}],"answer":["D"],"explanation":"裹包是指用一层性材料包覆物品或包装件的操作，用于裹包的材料有纸张、织物、塑料薄膜等。包装封口是包装操作的一道重要工序，直接关系到包装作业的质量和包装密封性能。检重是检查包装内容物的重量。充填分为装放、填充和灌装三种形式。其中，填充是将干燥的粉状、片状或颗粒状物品装人包装容器中，其特点在于物品具有流动性，在包装容器中没有一定顺序，是对盒、袋、瓶等容器进行填充，一般是定量填充。","id":"guanfang-0545","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"multi","stem":"充填的主要形式有（ ）。","material":"","options":[{"key":"A","text":"装放"},{"key":"B","text":"填充"},{"key":"C","text":"灌装"},{"key":"D","text":"裹包"},{"key":"E","text":"捆扎"}],"answer":["A","B","C"],"explanation":"充填是将物品放人包装容器的操作，分为装放、填充和灌装三种形式。","id":"guanfang-0546","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"关于集装化包装的说法，不正确的是（ ）。","material":"","options":[{"key":"A","text":"将散装或零物品组合成一个合适的单元"},{"key":"B","text":"便于采用机械化操作，提高装卸速度"},{"key":"C","text":"降低运输成本和节省运杂费用"},{"key":"D","text":"增加装卸搬运的劳动强度"}],"answer":["D"],"explanation":"集装化包装是指将一定数量的散装或者零星的成件物品组合在一起，形成一个合适的单元，使其在装卸搬运、运输等物流环节中作为一个整件进行技术上和业务上处理的包装方式，又称组合化包装或单元化包装。集装化包装的意义在于便于采用机械化操作，可以提高装卸速度，减轻装卸搬运的劳动强度，降低运输成本和节省运杂费用，更好地保护商品的质量和数量，并促进包装实现标准化。","id":"guanfang-0547","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"化肥、糖等物品适用的集装化包装是（ ）。","material":"","options":[{"key":"A","text":"货捆"},{"key":"B","text":"集装箱"},{"key":"C","text":"框架"},{"key":"D","text":"集装袋"}],"answer":["D"],"explanation":"集装袋是用柔性材料制成的袋式包装容器，主要用于粉状、颗粒状如水泥、粮食、化肥、盐、糖、矿产品等物品的包装，集装袋的特点是结构简单、自重轻、可折叠、成本低，比较常见的有橡胶集装袋、塑料集装袋、帆布集装袋，一般都可以重复使用。","id":"guanfang-0548","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"需要根据货物的特征选择或特制其外形的集装化包装是（ ）。","material":"","options":[{"key":"A","text":"集装箱"},{"key":"B","text":"集装袋"},{"key":"C","text":"货捆"},{"key":"D","text":"框架"}],"answer":["D"],"explanation":"框架包装方式需要根据货物的外形特征选择或者特制各种形式的框架，用于货物 的集装化包装。集装化包装的货物可以更好地利用运输工具，提高其运载能力和仓容利用率。","id":"guanfang-0549","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"multi","stem":"下列属于集装化包装形式的有（ ）。","material":"","options":[{"key":"A","text":"框架集装"},{"key":"B","text":"货捆"},{"key":"C","text":"集装袋"},{"key":"D","text":"集装箱"},{"key":"E","text":"裹包"}],"answer":["A","B","C","D"],"explanation":"集装化包装的形式主要有集装箱、托盘、集装袋、货捆、框架集装等。","id":"guanfang-0550","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"multi","stem":"关于集装箱特点和技术要求的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"具有足够强度，能长期反复使用"},{"key":"B","text":"便于箱内货物装满和卸空"},{"key":"C","text":"设有供快速装卸的装置"},{"key":"D","text":"内容积等于或小于1m²"},{"key":"E","text":"运输途中需倒装"}],"answer":["A","B","C"],"explanation":"集装箱是集装化包装容器中最主要的形式，也称货箱、货柜，是具有足够的强度，可长期反复使用的适于多种运输工具而且容积在1m²以上（含1m²）的集装单元器具。集装箱应具有如下特点和技术要求：具有足够的强度，能长期反复使用；适用于一种或多种运输方式运送货物，途中无须倒装；设有供快速装卸的装置，便于从一种运输方式转到另一种运输方","id":"guanfang-0551","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"下列不属于装卸搬运作业特点的是（ ）。","material":"","options":[{"key":"A","text":"作业量小、对象简单"},{"key":"B","text":"作业具有伴生性"},{"key":"C","text":"作业对安全性要求高"},{"key":"D","text":"作业不均衡"}],"answer":["A"],"explanation":"装卸搬运作业的特点有：①装卸搬运作业量大、对象复杂。②装卸搬运作业不均衡。③装卸搬运作业对安全性要求高。④装卸搬运作业具有伴生性和起性。","id":"guanfang-0552","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"为便于叉车作业，将货物捆扎后放在枕木上。这种状态的货物装卸搬运活性为（ ）级。","material":"","options":[{"key":"A","text":"1"},{"key":"B","text":"2"},{"key":"C","text":"3"},{"key":"D","text":"4"}],"answer":["B"],"explanation":"货物装卸搬运活性分为5级，分别用数字0、1、2、3、4表示，具体含义为：0级表示货物散堆在地面上的状态；1级表示货物装箱或经捆扎后的状态；2级表示装箱或被捆扎后的货物，下面放有枕木或其他衬垫，便于叉车或其他机械作业的状态；3级表示货物被放置在台车上或用起重机吊钩钩住，即刻可以移动的状态；4级表示被装卸搬运的货物已经被启动，处于直接作业的状态。","id":"guanfang-0553","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"当装卸搬运系统平均活性指数满足0.5<<1.3时，对应的改善措施是","material":"","options":[{"key":"A","text":"采用料箱、推车存放物料"},{"key":"B","text":"采用叉车或动力搬运车搬运物料"},{"key":"C","text":"选用单元化的连续装卸搬运方式"},{"key":"D","text":"选用拖车或机车车头拖挂物料"}],"answer":["B"],"explanation":"当0.5<<1.3 时，装卸搬运系统多数处于活性指数为 1 的状态，可以采用叉车或动力搬运车进行改善。","id":"guanfang-0554","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"防止和消除无效作业的方法不包括（ ）。","material":"","options":[{"key":"A","text":"提高被装卸搬运货物的纯度"},{"key":"B","text":"减少装卸次数"},{"key":"C","text":"选择最短的作业路线"},{"key":"D","text":"散装装卸"}],"answer":["D"],"explanation":"防止和消除无效的装卸搬运作业的方法主要包括：①尽量减少装卸次数，降低人力、物力的浪费和货物损坏的可能性。②提高被装卸搬运货物的纯度。③选择最短的作业路线。④避免过度包装，减少无效负荷。③充分发挥装卸搬运机械设备的能力和装载空间，中空的物件可以填装其他小物品再进行搬运，以提高装载效率。③采用集装方式。","id":"guanfang-0555","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"multi","stem":"下列说法中，符合装卸搬运作业合理化要求的有（ ）。","material":"","options":[{"key":"A","text":"防止和消除无效作业"},{"key":"B","text":"采用散装方式进行装卸搬运作业"},{"key":"C","text":"降低货物的装卸搬运活性"},{"key":"D","text":"实现装卸搬运作业省力化"},{"key":"E","text":"合理利用装卸搬运机械设备"}],"answer":["A","D","E"],"explanation":"实现装卸搬运作业合理化的主要方法包括：防止和消除无效作业、提高货物的装卸搬运活性、实现装卸搬运作业省力化、合理利用装卸搬运机械设备。","id":"guanfang-0556","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"肉类食品的保鲜加工、冷冻加工体现了（ ）的流通加工。","material":"","options":[{"key":"A","text":"为提高商品利用率"},{"key":"B","text":"以保存商品为目的"},{"key":"C","text":"为方便消费、满足用户需求"},{"key":"D","text":"为提高物流效率、降低物流损失"}],"answer":["B"],"explanation":"流通加工的形式包括：①以保存商品为目的的流通加工。②为提高商品利用率的流通加工。③为方便消费、满足用户需求的流通加工。④为提高物流效率、降低物流损失的流通加工。其中，根据加工对象不同，以保存商品为目的的流通加工可分为生产资料流通加工和消费品流通加工。消费品的流通加工是为了使消费者满意商品的质量，如水产品、蛋类、肉类食品的保鲜加工、冷冻加工、防腐加工等。","id":"guanfang-0557","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"下列流通加工活动中，目的是提高物流效率、降低物流损失的是（)。","material":"","options":[{"key":"A","text":"自行车在装配地直接销售"},{"key":"B","text":"肉类食品的保鲜加工"},{"key":"C","text":"钢材加工搭配下料"},{"key":"D","text":"超市提供的净菜加工"}],"answer":["A"],"explanation":"有些商品由于自身的特性、形状，运输、装卸搬运作业效率低，而且很容易发生损坏，需要进行适当的流通加工以弥补这些商品的物流缺陷，这类流通加工的目的是提高物流效率、降低物流损失。例如，自行车在消费地装配后直接销售，可避免整体运输低效率和货物高损坏的情况。","id":"guanfang-0558","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"下列流通加工活动中，目的是方便消费、满足用户需求的是（ ）。","material":"","options":[{"key":"A","text":"钢材集中套裁"},{"key":"B","text":"自行车在装配地直接销售"},{"key":"C","text":"肉类食品的保鲜加工"},{"key":"D","text":"预制菜加工"}],"answer":["D"],"explanation":"为方便消费、满足用户需求，流通企业对标准规格产品按照用户需求进行改制加工，如钢材卷板的舒展、剪切加工，平板玻璃按需要规格的开片加工等。对生产型用户而言，这种流通加工形式可以缩短生产流程，提高生产技术密集程度，缩短生产周期。在消费领域中，净菜、半成品菜、预制菜以及首饰加工、服装加工等流通加工形式不同程度地满足了消费者方便、省时省力的要求。","id":"guanfang-0559","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"下列流通加工活动中，目的是提高商品利用率的是（ ）。","material":"","options":[{"key":"A","text":"肉类食品的保鲜加工"},{"key":"B","text":"钢材集中套裁"},{"key":"C","text":"服装加工"},{"key":"D","text":"自行车在装配地直接销售"}],"answer":["B"],"explanation":"利用在流通领域的集中加工代替分散在各用户的单个加工，可以大大提高商品的利用率，集中加工形式可以减少原材料消耗，提高加工质量，有时还可以充分利用加工后的副产品。例如，钢材集中下料时能充分合理下料、搭配套裁、减少边角余料的浪费。","id":"guanfang-0560","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"multi","stem":"流通加工与生产加工的区别主要体现在（ ）。","material":"","options":[{"key":"A","text":"管理职能不同"},{"key":"B","text":"加工对象不同"},{"key":"C","text":"加工深度不同"},{"key":"D","text":"附加价值不同"},{"key":"E","text":"责任人不同"}],"answer":["B","C","D","E"],"explanation":"流通加工与生产加工的区别体现在以下几个方面：①加工对象不同。流通加工的对象是进入流通领域的商品，具有商品性质；生产加工的对象是某种最终产品形成过程中的原材料、零部件和半成品。②加工深度不同。流通加工一般是简单加工，如板材的剪裁、玻璃开片等；生产加工的复杂程度以及加工深度要远远高于流通加工。③责任人不同。流通加工是由流通企业负责和组织，以满足消费者要求为目的进行的加工活动；生产加工以生产企业为责任人和组织者，更多要符合产品设计和加工技术要求。附加价值不同，从价值观点看，生产加工在于创造商品的价值和使用价值；流通加工在于完善商品的使用价值，一般在不对加工对象做大的改变的情况下提高商品价值。","id":"guanfang-0561","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"下列不属于绿色物流的是（ ）。","material":"","options":[{"key":"A","text":"绿色仓储"},{"key":"B","text":"集约资源"},{"key":"C","text":"顺向物流"},{"key":"D","text":"绿色包装"}],"answer":["C"],"explanation":"绿色物流是物流操作和管理全过程的绿色化，一般包括以下五个方面的含义：①集约资源。②绿色运输。③绿色仓储。④绿色包装。③逆向物流。","id":"guanfang-0562","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"产品召回引起的物流活动是（ ）。","material":"","options":[{"key":"A","text":"绿色运输"},{"key":"B","text":"绿色仓储"},{"key":"C","text":"逆向物流"},{"key":"D","text":"集约资源"}],"answer":["C"],"explanation":"逆向物流是指由退货、产品召回、废旧物品回收等形成的物品从供应链下游向上游运动所引起的物流活动。","id":"guanfang-0563","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"multi","stem":"下列活动中，体现绿色物流的有（ ）。","material":"","options":[{"key":"A","text":"合理布局运输线路"},{"key":"B","text":"充分利用仓储面积"},{"key":"C","text":"废旧物品回收"},{"key":"D","text":"提高原材料加工精度"},{"key":"E","text":"扩大产品生产规模"}],"answer":["A","B","C"],"explanation":"绿色物流是物流操作和管理全过程的绿色化，一般包括以下五个方面的含义：①集约资源。通过整合现有资源，优化资源配置，提高资源利用率，减少资源浪费。②绿色运输。对运输线路进行合理布局与规划，缩短运输路线，提高车辆装载率，使用清洁燃料，减少能耗及尾气排放等。③绿色仓储。一方面，合理选择仓库的位置，节约运输成本;另一方面，科学布局仓库，实现仓储面积利用最大化，减少仓储成本。④绿色包装。适度包装，选用合适的包装材料，提高包装材料的回收利用率，有效控制资源消耗，避免环境污染。③逆向物流。逆向物流是指由退货、产品召回、废旧物品回收等形成的物品从供应链下游向上游运动所引起的物流活动。逆向物流可以恢复物品价值、循环利用或合理处置物流活动中的物品。","id":"guanfang-0564","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"multi","stem":"第三方物流模式对企业的价值体现在（ ）。","material":"","options":[{"key":"A","text":"提高顾客服务水平和质量"},{"key":"B","text":"降低成本"},{"key":"C","text":"提升竞争力"},{"key":"D","text":"规避风险"},{"key":"E","text":"加强供应链管理"}],"answer":["A","B","C","D"],"explanation":"第三方物流模式的价值体现在以下五个方面：①降低企业成本。②帮助企业提高顾客服务水平和质量。③规避风险。①提升企业竞争力。③提升社会价值。","id":"guanfang-0565","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"multi","stem":"关于利用第三方物流规避风险的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"减少物流基础设施的投资"},{"key":"B","text":"提高客户响应速度"},{"key":"C","text":"加快存货的流动周转"},{"key":"D","text":"增加企业的安全库存"},{"key":"E","text":"降低企业的资金风险"}],"answer":["A","B","C","E"],"explanation":"企业自已组织运作物流活动，面临两大风险：一是投资风险；二是存货风险。如果企业采用第三方物流模式，利用第三方物流企业的运输、配送网络及其专业的物流管理能力，可以提高客户响应速度，加快存货的流动周转，减少企业的安全库存，降低企业的资金风险。考点+","id":"guanfang-0566","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"关于供应链的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"不包括最终用户"},{"key":"B","text":"节点企业之间是一种需求和供应关系"},{"key":"C","text":"是一种单向的直线结构"},{"key":"D","text":"不涉及对信息流的控制"}],"answer":["B"],"explanation":"供应链是指生产及流通过程中，围绕核心企业的核心产品或服务，由所涉及的原材料供应商、制造商、分销商、零售商直到最终用户等形成的网链结构。供应链由核心企业、核心企业的供应商、供应商的供应商、核心企业的客户、客户的客户等组成，一个企业就是一个节点，节点企业之间是一种需求和供应关系。供应链涉及物流、信息、资金等的流动。","id":"guanfang-0567","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"关于供应链管理的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"供应链管理强调各节点企业之间建立合作伙伴关系"},{"key":"B","text":"供应链管理是操作层面的物流一体化的扩展"},{"key":"C","text":"供应链管理以利润最大化为导向"},{"key":"D","text":"供应链管理的目的是实现核心企业管理最优化"}],"answer":["A"],"explanation":"供应链管理的含义包括：①供应链管理强调企业间的合作。要求各节点企业之间实现信息共享、风险共担、利益共存，强调在各节点企业之间建立合作伙伴关系。②供应链管 理是一种集成化的管理模式。供应链管理充分利用网络技术和信息技术，对业务流程进行重 组，实现从供应商开始，经由制造商、分销商、零售商直到最终用户的全要素、全过程的集成化 管理，以达到全局最优。③供应链管理以客户和最终用户为中心。无论构成供应链的节点企 业数量多少，也无论供应链节点企业的类型、层次有多少，供应链的形成都是以客户和最终用 户的需求为导向的，供应链管理绩效的最终指标是客户满意度。","id":"guanfang-0568","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第一节物流与物流管理概述","point":"","type":"single","stem":"关于供应链管理与物流管理关系的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"物流管理包含供应链管理，是对商流、物流、信息流、资金流的全面集成"},{"key":"B","text":"物流管理着眼于多企业全局优化，供应链管理侧重单一企业的物流优化"},{"key":"C","text":"物流管理美重尽谨提作层质，供应链管理合作会伴美察层应链管理仅把其他企业当作 交易方 二、参考答素及解析"}],"answer":["C"],"explanation":"物流是供应链的一部分，物流涉及原材料、零部件等物料在企业间的流动，供应链涉及从原材料采购开始到产品交付给最终用户的整个物流增值过程，是相关企业业务资源的集成和一体化，是供应链上的商流、物流、信息流、资金流的集成；物流管理只涉及物流路径范围的业务，供应链管理把对成本有影响和在满足客户需求时的供应链各方都考虑在内；物流管理关注企业的供应、存储、分销，把其他企业当作交易方，供应链管理关注企业之间达成多赢的战略合作伙伴关系；物流管理采用运筹学等方法研究物流优化，供应链管理将每个企业作为网络中的节点，追求多个企业的全局优化；物流管理侧重局部操作层面的问题，供应链管理侧重全局战略层面的问题。","id":"guanfang-0569","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"仓储的功能不包括（。","material":"","options":[{"key":"A","text":"调节功能"},{"key":"B","text":"保管检验功能"},{"key":"C","text":"集散功能"},{"key":"D","text":"供应商服务功能"}],"answer":["D"],"explanation":"仓储的功能有调节功能、保管检验功能、集散功能、客户服务功能和防范风险功能。","id":"guanfang-0570","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"仓储合理化的评判标准不包括（ ）。","material":"","options":[{"key":"A","text":"储存时间"},{"key":"B","text":"仓储面积"},{"key":"C","text":"仓储费用"},{"key":"D","text":"仓储数量"}],"answer":["B"],"explanation":"仓储合理化的评判标准有：①仓储质量，即保证在储存期间，物品的质量不会降低，不会影响客户使用。②仓储数量。考虑各种成本费用，仓储数量应有一个合理的控制范围。③储存时间。每类物品有恰当的储存保管天数，不仅需要考虑物品自身的性质和特点，还要考虑资金占用、有形和无形的耗损、贬值、跌价等情况的影响。④仓储结构。根据消费需求，不同品种、规格的物品在库存数量上的合理比例关系，反映库存物品的齐备性、配套性、全面性和供应的保证性，尤其是相关性很强的各种物品之间的比例关系。③仓储费用。对仓租费、维护费、保管费、损失费、资金占用的利息支出等的投入分析，可以从经济效益上判断仓储的合理性。","id":"guanfang-0571","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"multi","stem":"关于仓储合理化实施要点的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"采用先进先出方式，提高货物周转率"},{"key":"B","text":"采用ABC分类管理方法，对储存物品进行分类管理"},{"key":"C","text":"扩大仓储面积以增加储存量"},{"key":"D","text":"提高储存密度，有效利用仓容"},{"key":"E","text":"采用有效的储存定位系统实现快进快出"}],"answer":["A","B","D","E"],"explanation":"仓储合理化的实施要点包括：①对储存物品进行分类管理，可采用ABC分类管理方法。②采用先进先出方式，提高货物周转率。③提高储存密度，有效利用仓容。储存面积一定的情况下可以通过密集货架、窄巷道式通道等方式减少通道数量和通道面积，确保安全的前提下提高存货高度，合理布局，提高单位存储面积利用率，降低成本。④快进快出。采用集装化和有效的储存定位系统，对集装单元化物品进行序号、货架号、层号、位置号定位，利用先进的物品存储定位技术，节约物品的寻找、存放、取出时间，同时减少差错。","id":"guanfang-0572","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"通用性较强，通常修建在用户相对集中、交通便利的地方的仓库是","material":"","options":[{"key":"A","text":"自用仓库"},{"key":"B","text":"公用仓库"},{"key":"C","text":"营业仓库"},{"key":"D","text":"普通仓库"}],"answer":["C"],"explanation":"营业仓库是指某些企业专门为了经营储运业务而修建的仓库。其主要特点是仓库的通用性较强，通常修建在用户相对集中、交通便利的地方，便于为客户服务。","id":"guanfang-0573","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"按使用范围不同，托盘可分为（。","material":"","options":[{"key":"A","text":"平托盘、柱式托盘、箱式托盘、轮式托盘"},{"key":"B","text":"通用托盘、专用托盘"},{"key":"C","text":"木托盘、钢托盘、铝托盘、纸托盘、塑料托盘"},{"key":"D","text":"消耗性托盘、循环性托盘"}],"answer":["B"],"explanation":"按结构特征不同，托盘可分为平托盘、柱式托盘、箱式托盘、轮式托盘等。按使用范围不同， 盘、复合材料托盘等。按使用寿命不同，托盘可分为消耗性（一次性)托盘和循环性(多次性)托盘。","id":"guanfang-0574","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"W仓储公司某仓库使用的货架长、宽、高分别是15米、1米、4米，能承受货物的单位质量为200千克/立方米，货架容积充满系数为50%。若该公司第二天将有24吨面粉到库，则仓库管理员在当日必须整理出空货架（ ）个。","material":"","options":[{"key":"A","text":"2"},{"key":"B","text":"3"},{"key":"C","text":"4"},{"key":"D","text":"5"}],"answer":["C"],"explanation":"货架需要量的计算公式为：N={1·b.%)·k.。式中,N为货架数量（个);Q为上架存放商品的最高储存量（吨）；l、b、h分别为所选用货架的长、宽、高（米）；k为货架存放该种商品时的容积充满系数（%）；为上架存放商品的单位质量（吨／立方米）。代人数据，该公司需要的货架数量=(15x1x4)x50%×0.2=4（个）。","id":"guanfang-0575","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"某公司仓库B区为托盘存储区，每小时进出该库区的商品有1500件（单件尺寸基本相同）,每个托盘的平均使用周期为10小时，托盘的标准装载量为30件，平均装载效率为80%,则需要（ ）个托盘。","material":"","options":[{"key":"A","text":"600"},{"key":"B","text":"800"},{"key":"C","text":"900"},{"key":"D","text":"1200"}],"answer":["C"],"explanation":"托盘需要量的计算公式为: N=D·T:(1+X)。式中,N为托盘数量(个);D为单位时间进出商品的数量（件／小时）；T为托盘的平均使用周期（包括移动、等待、卸空、返回、填补等的时间）（小时）；X为托盘的平均装载效率（%）;C为托盘的标准装载量（件／个）。代人数据，该公司仓库需要的托盘数量=1500×10×（1+80%）→30=900（个）。","id":"guanfang-0576","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"某仓库为人库商品安排货位时，将同种商品存放在相同保管位置。该仓库采用的货位分配原则是（ ）。","material":"","options":[{"key":"A","text":"商品类似性原则"},{"key":"B","text":"商品同一性原则"},{"key":"C","text":"商品互补性原则"},{"key":"D","text":"商品相关性原则"}],"answer":["B"],"explanation":"货位分配原则包括：①以周转率为基础的原则。②商品相关性原则。③商品同一性原则。①商品类似性原则。③商品替代性原则。③商品相容性原则。①先进先出原则。其中，商品同一性原则是指把同一商品储放在同一保管位置的原则。","id":"guanfang-0577","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"某仓库空间有限，库存商品种类较少但单个体积较大，为提高存储空间利用率，适合采用的储存策略是（ ）。","material":"","options":[{"key":"A","text":"定位储存策略"},{"key":"B","text":"随机储存策略"},{"key":"C","text":"分类储存策略"},{"key":"D","text":"分类随机储存策略"}],"answer":["B"],"explanation":"随机储存策略，即每种商品货位不固定，随机分配货位储存。优点在于由于货位可共用，因此只要按所有库存商品的最大在库量设计即可，存储空间的利用率较高。缺点有：出库管理及盘点工作难度较大；周转率高的商品可能被存放在离出人口较远的位置，增加出人库搬运距离；具有相互影响特性的商品可能被混存，造成损坏或发生危险。适用于仓库空间有限，库存商品种类少或体积较大的情形。","id":"guanfang-0578","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"M公司仓库存放某商品时每平方米最高储存量为2.5吨，按此仓容定额进行就地堆码，M公司储存40吨该商品需要占用货位（ ）平方米。","material":"","options":[{"key":"A","text":"16"},{"key":"B","text":"20"},{"key":"C","text":"8"},{"key":"D","text":"10"}],"answer":["A"],"explanation":"计重商品就地堆码时，商品堆码占用面积按仓容定额计算。仓容定额是指某种商品在某仓库单位面积上的最高储存量，单位是吨／平方米。计重商品堆码占用面积的计算公式为：S实=N定/Q。式中，S实为商品堆码占用面积（平方米）；Q为该种商品的储存量（吨）；N是为该种商品的仓容定额（吨／平方米）。代人数据，M公司储存40吨该商品占用的货位面积=40÷2.5=16（平方米）。","id":"guanfang-0579","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"某公司东郊1库中有400台B商品要移至2库中储存，该商品的堆码极限为2层，单件商品的外形尺寸为80厘米×80厘米×80厘米（长×宽×高）,如果可以按堆码极限进行就地堆码，那么这400台商品需要占用（ ）平方米的货位。","material":"","options":[{"key":"A","text":"48"},{"key":"B","text":"64"},{"key":"C","text":"128"},{"key":"D","text":"256"}],"answer":["C"],"explanation":"计件商品就地堆码占用面积按可堆积层数计算。计算公式为:S实=单件底面积×总件数／可堆积层数。代人数据，该公司400台商品占用的货位面积=0.8×0.8×400－2=128（平方米）。","id":"guanfang-0580","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"关于商品盘点的说法，错误的是（ ）。","material":"","options":[{"key":"A","text":"盘点目的主要是清查实际库存量"},{"key":"B","text":"盘点内容主要包括数量检查、质量检查、安全检查、保管条件检查"},{"key":"C","text":"账面盘点又称实地盘点或实盘，即实际去仓库内清点数量"},{"key":"D","text":"盘点方法主要有账面盘点及现货盘点"}],"answer":["C"],"explanation":"商品盘点的目的主要是清查实际库存量、计算资产损益、发现存在的问题。通过盘点清查实际库存数量与账面库存数量，发现问题并查明原因，及时调整。商品盘点的内容主要包括数量检查、质量检查、安全检查、保管条件检查。盘点方法主要有账面盘点及现货盘点。账面盘点又称永续盘点，是指根据各有关凭证，在账簿中逐日逐笔进行登记，并随时结算出各种商品账面结存数额的一种方法。现货盘点又称为实地盘点或实盘，也就是实际去仓库内清点数量，再依商品单价计算出实际库存金额的方法。","id":"guanfang-0581","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"multi","stem":"下列属于出库业务程序的有（ ）。","material":"","options":[{"key":"A","text":"分栋"},{"key":"B","text":"复核"},{"key":"C","text":"包装"},{"key":"D","text":"点交"},{"key":"E","text":"登账"}],"answer":["B","C","D","E"],"explanation":"出库业务程序主要包括核单备料、复核、包装、点交、登账、现场和档案的清理等环节。","id":"guanfang-0582","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"为了避免物价上涨造成损失，或者为了从商品价格上涨中获利而建立的库存称为（ ）。","material":"","options":[{"key":"A","text":"投机性库存"},{"key":"B","text":"安全库存"},{"key":"C","text":"调节库存"},{"key":"D","text":"周转库存"}],"answer":["A"],"explanation":"投机性库存又称屏障库存，指为了避免物价上涨造成损失，或者为了从商品价格上 涨中获利而建立的库存。","id":"guanfang-0583","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"将库存分为独立需求库存和相关需求库存的依据是（ ）。","material":"","options":[{"key":"A","text":"库存的功能"},{"key":"B","text":"库存的需求特性"},{"key":"C","text":"库存所处的生产阶段"},{"key":"D","text":"库存存放的地点"}],"answer":["B"],"explanation":"按库存的需求特性不同，库存可分为独立需求库存和相关需求库存。","id":"guanfang-0584","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"将库存分为原材料库存、在制品库存和成品库存的依据是（ ）。","material":"","options":[{"key":"A","text":"库存的功能"},{"key":"B","text":"库存的需求特性"},{"key":"C","text":"库存所处的生产阶段"},{"key":"D","text":"库存存放的地点"}],"answer":["C"],"explanation":"按库存所处的生产阶段不同，库存可分为原材料库存、在制品库存和成品库存。","id":"guanfang-0585","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"某健身房矿泉水的平均日需求量为180箱，备运时间为3天，安全库存量为15箱，则该健身房矿泉水的订购点是（ ）箱。","material":"","options":[{"key":"A","text":"500"},{"key":"B","text":"555"},{"key":"C","text":"666"},{"key":"D","text":"700"}],"answer":["B"],"explanation":"订购点即仓库进行补货时的库存量，计算公式为：订购点=平均日需求量×备运时间+安全库存量。代人数据，该健身房矿泉水的订购点=180×3+15=555（箱）。","id":"guanfang-0586","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"企业某种原材料 "D"],"explanation":"定量库存控制法是指当库存量下降到一定水平（即订购点）时，就按固定的订购批量进行订购的库存控制方式。该库存控制法的特点有：①盘点周期不确定，即要随时将库存量与订购点进行比较，以确定是否发出订单。②每次订购的批量通常固定不变，订购批量大小依据总库存成本最低的原则确定。③相邻两次订购的间隔时间变动，这种变动取决于需求量的变化情况，需求变大，则间隔期缩短；需求变小，则间隔期拉长。订购提前期基本不变，由供应商的生产能力、运输能力等外界因素决定，与商品需求情况没有直接的联系。","id":"guanfang-0590","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"定期库存控制法的特点不包括（ ）。","material":"某玩具经销商采用定期库存控制法对存货进行管理该企业的玩具年销售量为3000件，采购单价为100元／件，每次订购成本为150元，每件玩具的年持有成本为10元。假设供应商要求的订购提前期为20 天，一年的工作日按 300 天计算，不设安全库存。","options":[{"key":"A","text":"盘点周期固定"},{"key":"B","text":"订购批量固定"},{"key":"C","text":"可用于库存商品种类较多的情形"},{"key":"D","text":"订购间隔期固定"}],"answer":["B"],"explanation":"定期库存控制法的特点在于每次的订购批量通常是变化的，而订购间隔期是固定的，即以固定周期间隔检查库存（包括在途库存),在每次检查后进行订货，使库存水平达到目标存储水平，订货量等于目标存储水平减去检查时库存。定量库存控制法下，企业需要随时监测库存变化，当商品种类很多且订购费用较高时很不经济，因而可以对多种商品规定相同的库存检查间隔期，节省订货费用。","id":"guanfang-0591","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"该玩具经销商的经济订购间隔期为（ ）天。","material":"某玩具经销商采用定期库存控制法对存货进行管理该企业的玩具年销售量为3000件，采购单价为100元／件，每次订购成本为150元，每件玩具的年持有成本为10元。假设供应商要求的订购提前期为20 天，一年的工作日按 300 天计算，不设安全库存。","options":[{"key":"A","text":"10"},{"key":"B","text":"20"},{"key":"C","text":"15"},{"key":"D","text":"30"}],"answer":["D"],"explanation":"经济订购间隔期的计算公式为:T=/祭。式中,C为每次订购成本;D为年需（2)经济罚购间隔期的计算公式为：1。-D°式中，为每次罚购成本;D为年而求量;K为单位商品的年持有成本。代人数据，该玩具经销商的经济订购间隔期=，/2x15%=0.1（年）=0.1×300=30（天）。","id":"guanfang-0592","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"该玩具经销商的最大库存量为（ ）件。","material":"某玩具经销商采用定期库存控制法对存货进行管理该企业的玩具年销售量为3000件，采购单价为100元／件，每次订购成本为150元，每件玩具的年持有成本为10元。假设供应商要求的订购提前期为20 天，一年的工作日按 300 天计算，不设安全库存。","options":[{"key":"A","text":"500"},{"key":"B","text":"600"},{"key":"C","text":"520"},{"key":"D","text":"620"}],"answer":["A"],"explanation":"最大库存量的计算公式为：E=D（T+L)/N+S。式中,E为最大库存量;D为年需求 量；T为订购间隔期;L为订购提前期；S为安全库存量；N为一年的工作日天数。代人数据， 该玩具经销商的最大库存量=3000×（30+20）+0=500（件）。 该头组销高的入库行量一30040-500（件%","id":"guanfang-0593","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第二节仓储与库存管理","point":"","type":"single","stem":"关于定期库存控制法的说法，错误的是（ ）。","material":"某玩具经销商采用定期库存控制法对存货进行管理该企业的玩具年销售量为3000件，采购单价为100元／件，每次订购成本为150元，每件玩具的年持有成本为10元。假设供应商要求的订购提前期为20 天，一年的工作日按 300 天计算，不设安全库存。","options":[{"key":"A","text":"订购费用相对较低"},{"key":"B","text":"便于获得价格折扣"},{"key":"C","text":"比定量控制法的安全库存量小"},{"key":"D","text":"登记费用和盘点次数相对较少"}],"answer":["C"],"explanation":"定期库存控制法的优点主要有：一次办理多种商品的订购，订购费用低；一次订购 的金额大，便于获得价格折扣；不必严格跟踪库存变化，减少了库存登记费用和盘点次数。缺 点有：不论库存水平降低多少，都要按期发出订单，因而当某种商品的库存水平很高时，订购量 会很小；对于每种商品而言，采用定期控制法的安全库存量比定量控制法的大。","id":"guanfang-0594","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节运输与配送管理","point":"","type":"single","stem":"同一种货物在同一线路上或平行线路上做相对方向的运送，而与对方运程的全部或一部分发生重叠交错的运输形式是（ ）。","material":"","options":[{"key":"A","text":"倒流运输"},{"key":"B","text":"对流运输"},{"key":"C","text":"迁回运输"},{"key":"D","text":"重复运输"}],"answer":["B"],"explanation":"对流运输也称“相向运输”“交错运输”,指同一种货物，或彼此间可以互相代用而又不影响管理、技术及效益的货物，在同一线路上或平行线路上做相对方向的运送，而与对方运程的全部或一部分发生重叠交错的运输。","id":"guanfang-0595","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节运输与配送管理","point":"","type":"single","stem":"不合理运输最严重的形式是（ ）。","material":"","options":[{"key":"A","text":"空驶运输"},{"key":"B","text":"重复运输"},{"key":"C","text":"迁回运输"},{"key":"D","text":"对流运输"}],"answer":["A"],"explanation":"不合理运输最严重的形式是空驶运输。在实际运输组织中，有时候必须调运空车，从管理上不能将其看成不合理运输。但是，因调运不当、货源计划不周，未采用运输社会化而 形成的空驶，是不合理运输的表现。","id":"guanfang-0596","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节运输与配送管理","point":"","type":"multi","stem":"运输系统的构成要素包括（ ）。","material":"","options":[{"key":"A","text":"运输线路"},{"key":"B","text":"运输工具"},{"key":"C","text":"运输参与者"},{"key":"D","text":"运输节点"},{"key":"E","text":"运输货物"}],"answer":["A","B","C","D"],"explanation":"运输系统的构成要素包括运输线路、运输工具、运输参与者和运输节点。","id":"guanfang-0597","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节运输与配送管理","point":"","type":"multi","stem":"运输参与者包括（ ）。","material":"","options":[{"key":"A","text":"运输监管机构"},{"key":"B","text":"货主"},{"key":"C","text":"货运代理人"},{"key":"D","text":"承运人"},{"key":"E","text":"运输经纪人"}],"answer":["B","C","D","E"],"explanation":"运输参与者包括货主、承运人、货运代理人和运输经纪人。5、ABC商品的不合理运输是指在现有条件下可以达到的运输水平而未达到，从而造成了运力浪费、运输时间增加、运费超支等问题的运输形式。不合理运输的运输形式主要有：①空驶运输。②对流运输。③迁回运输。①重复运输。③倒流运输。③过远运输。①运力选择不当。③托运方式选择不当。③无效运输。","id":"guanfang-0598","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节运输与配送管理","point":"","type":"multi","stem":"不合理运输的主要形式包括（ ）。","material":"","options":[{"key":"A","text":"空驶运输"},{"key":"B","text":"迁回运输"},{"key":"C","text":"重复运输"},{"key":"D","text":"对向运输"},{"key":"E","text":"过近运输"}],"answer":["B","C","E"],"explanation":"合理运输的实施方式包括以下五点：①合理选择运输模式。②正确选择运输工具。③确定合理的运输路线。④提高运输设备装载效率。③构建并完善运输网络系统。","id":"guanfang-0599","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节运输与配送管理","point":"","type":"multi","stem":"实施合理运输的措施包括（ ）。","material":"","options":[{"key":"A","text":"增加运输环节"},{"key":"B","text":"正确选择运输工具"},{"key":"C","text":"确定合理的运输路线"},{"key":"D","text":"降低运输设备的实载率"},{"key":"E","text":"构建并完善运输网络系统"}],"answer":["A","B","E"],"explanation":"运输外包的优点有：①减少投资。企业外包运输可以减少车辆设备的投资，节省企业资金的占用。②减少管理负担，降低风险。企业将运输外包给其他组织，可以减少相关运输管理工作，节约劳动力，降低管理成本，规避投资带来的风险。","id":"guanfang-0600","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节运输与配送管理","point":"","type":"single","stem":"关于企业运输外包优点的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"减少投资，节省企业资金的占用"},{"key":"B","text":"减少管理，降低风险"},{"key":"C","text":"在运输方面有更多的灵活性"},{"key":"D","text":"节省雇用承运人的费用"},{"key":"E","text":"无须承担车辆事故导致的责任风险"}],"answer":["B"],"explanation":"配送常见的分类方式有：①按配送的组织形式不同，可分为集中配送、共同配送（协同配送）和分散配送。②按配送商品的种类和数量不同，可分为单（少）品种大批量配送、多品种少批量多批次配送和成套配套配送。③按配送时间和数量不同，可分为定时配送、定量配送、定时定量配送、定时定路线配送和即时配送。","id":"guanfang-0601","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节运输与配送管理","point":"","type":"single","stem":"集中配送、共同配送与分散配送的分类依据是（ ）。","material":"","options":[{"key":"A","text":"配送商品的种类和数量"},{"key":"B","text":"配送的组织形式"},{"key":"C","text":"配送的时间和数量"},{"key":"D","text":"配送的频率"}],"answer":["B"],"explanation":"配送中心按物流设施的归属不同可分为自有型配送中心、公共型配送中心和合作型配送中心；按配送中心的服务对象不同可分为面向最终消费者的配送中心、面向制造企业的配送中心和面向零售商的配送中心；按运营主体不同可分为以制造商为运营主体的配送中心、以批发商为运营主体的配送中心、以零售商为运营主体的配送中心和以仓储运输企业为运营主体的配送中心。","id":"guanfang-0602","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节运输与配送管理","point":"","type":"single","stem":"将配送中心分为面向最终消费者的配送中心、面向制造企业的配送中心和面向零售商的配送中心的依据是（ ）。","material":"","options":[{"key":"A","text":"物流设施的归属不同"},{"key":"B","text":"服务对象不同"},{"key":"C","text":"运营主体不同"},{"key":"D","text":"设施规模不同"}],"answer":["A"],"explanation":"分散配送指对于小批量、零星货物或者临时需要的货物，一般由商业销售网点进行的配送。商业销售网点具有分布广、数量多、服务面广等特点，适宜开展距离近、品种多而用量小的货物配送。","id":"guanfang-0603","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节运输与配送管理","point":"","type":"single","stem":"商业销售网点进行的零星货物配送属于（ ）。","material":"","options":[{"key":"A","text":"分散配送"},{"key":"B","text":"定量配送"},{"key":"C","text":"集中配送"},{"key":"D","text":"共同配送"}],"answer":["D"],"explanation":"配送中心通过一系列作业环节完成配送任务，其作业流程依次为：①订单处理。②进货。③分类。④储存。③分栋。③配货分放。①配装。③送货。","id":"guanfang-0604","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节运输与配送管理","point":"","type":"single","stem":"配送中心正确的作业流程顺序是（ ）。","material":"","options":[{"key":"A","text":"订单处理→进货→分栋→储存→分类→配货分放→配装→送货"},{"key":"B","text":"订单处理→分类→进货→储存→配装→分栋→配货分放→送货"},{"key":"C","text":"订单处理→分类→进货一储存→分栋→配货分放→配装→送货"},{"key":"D","text":"订单处理→进货→分类→储存→分栋→配货分放→配装→送货"}],"answer":["B"],"explanation":"按订单分栋也称“摘果式”分栋，对于每一份用户订单，作业人员在仓库中巡回，将订单中的商品逐一从储存区域或者分栋区域栋取出来，然后集中在一起的分栋方式。","id":"guanfang-0605","bank":"guanfang"},{"chapter":"第六章质量管理与安全生产管理","section":"第三节运输与配送管理","point":"","type":"multi","stem":"配送中心将某一订单中的商品逐一从储存区域或者分栋区域栋取出来，然后集中在一起的分栋方式属于（ ）。","material":"","options":[{"key":"A","text":"批量分栋"},{"key":"B","text":"按订单分栋"},{"key":"C","text":"分区分栋"},{"key":"D","text":"单人分栋"}],"answer":["B","D"],"explanation":"分区分栋将订单按分区分解，能降低总的分栋时间，每个人负责自已的分区，能提高分栋效率，降低出错率。","id":"guanfang-0606","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第一节技术创新的特点、分类与模式","point":"","type":"single","stem":"技术创新成果具有准公共物品的性质，这体现了技术创新具有（ ）。","material":"","options":[{"key":"A","text":"时间差异性"},{"key":"B","text":"一体化"},{"key":"C","text":"高风险性"},{"key":"D","text":"正外部性"}],"answer":["D"],"explanation":"由于技术创新成果的使用具有非排他性，创新投入主体很难对成果实现独占，所以技术创新成果具有准公共物品的性质，技术创新活动具有较强的正外部性。","id":"guanfang-0607","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第一节技术创新的特点、分类与模式","point":"","type":"multi","stem":"关于技术创新特点的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"技术创新是一种技术行为，而非经济行为"},{"key":"B","text":"技术创新是一项高风险活动"},{"key":"C","text":"技术创新时间具有差异性"},{"key":"D","text":"技术创新具有负外部性"},{"key":"E","text":"技术创新具有国际化特征"}],"answer":["B","C","E"],"explanation":"手技术创新的主要特点包括以下五个方面：①技术创新是一种经济行为，其核心是 企业家，技术创新的产出成果是新产品和新工艺等，其目的是获取潜在的利润。②技术创新是 一项高风险活动。③技术创新时间具有差异性。①技术创新具有外部性。③技术创新具有一 体化与国际化特征。","id":"guanfang-0608","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第一节技术创新的特点、分类与模式","point":"","type":"single","stem":"某办公用品研发企业，通过新增蓝牙模块，推出了具有无线打印功能的打印机。从技术创新对象的角度来看，这种创新属于（ ）。","material":"","options":[{"key":"A","text":"原始创新"},{"key":"B","text":"产品创新"},{"key":"C","text":"模仿创新"},{"key":"D","text":"工艺创新"}],"answer":["B"],"explanation":"根据技术创新对象的不同，技术创新可分为产品创新和工艺创新。其中，产品创新是建立在产品整体概念基础上、以市场为导向的系统工程，是功能创新、形式创新、服务创新等多维交织的组合创新。","id":"guanfang-0609","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第一节技术创新的特点、分类与模式","point":"","type":"single","stem":"某生产企业通过采用新的生产设备进行生产，极大地降低了原材料和能源的消耗。从技术创新对象的角度来看，这种创新属于（ ）。","material":"","options":[{"key":"A","text":"产品创新"},{"key":"B","text":"集成创新"},{"key":"C","text":"原始创新"},{"key":"D","text":"工艺创新"}],"answer":["D"],"explanation":"工艺创新也称过程创新，是指产品的生产技术变革，其成果包括新工艺、新设备和新组织管理方式。工艺创新与提高产品质量、降低原材料和能源的消耗、提高生产效率有着密切的关系。","id":"guanfang-0610","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第一节技术创新的特点、分类与模式","point":"","type":"single","stem":"技术的创新使远程教育、远程医疗诊断等成为现实。从技术创新的新颖程度来看，这种创新属于（ ）。","material":"","options":[{"key":"A","text":"产品创新"},{"key":"B","text":"工艺创新"},{"key":"C","text":"渐进性创新"},{"key":"D","text":"根本性创新"}],"answer":["D"],"explanation":"根据技术创新的新颖程度不同，技术创新分为渐进性创新和根本性创新。其中，根本性创新是指技术有重大突破的创新，往往与科学上的重大发现相联系。例如，信息技术开创的信息时代使远程研究开发、远程教育、远程医疗诊断、远程控制等成为现实。","id":"guanfang-0611","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第一节技术创新的特点、分类与模式","point":"","type":"single","stem":"某企业对一种涂料的生产工艺进行了改进，大大提高了色牢度。根据技术创新的新颖程度不同，该企业这种技术创新属于（ ）。","material":"","options":[{"key":"A","text":"原始创新"},{"key":"B","text":"集成创新"},{"key":"C","text":"渐进性创新"},{"key":"D","text":"根本性创新"}],"answer":["C"],"explanation":"根据技术创新的新颖程度不同，技术创新分为渐进性创新和根本性创新。其中,进性创新是指对现有技术的改进和完善引起的渐进性、连续性的创新。它在技术原理上没有重大变化，只是根据市场需要对现有产品或生产工艺进行功能上的扩展和改进。","id":"guanfang-0612","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第一节技术创新的特点、分类与模式","point":"","type":"multi","stem":"根据技术创新模式的不同，可将技术创新分为（ ）。","material":"","options":[{"key":"A","text":"产品创新"},{"key":"B","text":"集成创新"},{"key":"C","text":"工艺创新"},{"key":"D","text":"原始创新"},{"key":"E","text":"引进、消化吸收再创新"}],"answer":["B","D","E"],"explanation":"根据技术创新模式的不同，技术创新分为原始创新，集成创新和引进、消化吸收再创新三种模式。","id":"guanfang-0613","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第一节技术创新的特点、分类与模式","point":"","type":"single","stem":"研究开发是创新构思的主要来源，持这种观点的技术创新模式是（)。","material":"","options":[{"key":"A","text":"技术推动创新模式"},{"key":"B","text":"需求拉动创新模式"},{"key":"C","text":"技术和市场交互作用创新模式"},{"key":"D","text":"A-U过程创新模式"}],"answer":["A"],"explanation":"技术推动创新模式的基本观点是研究开发是创新构思的主要来源。技术推动的新是一种简单的线性关系，从基础研究开始，到应用研究，到研究开发，再到生产制造，直到商业化的新产品在市场上销售。","id":"guanfang-0614","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第一节技术创新的特点、分类与模式","point":"","type":"multi","stem":"关于A-U过程创新模式的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"在不稳定阶段，产品创新和工艺创新都呈下降趋势"},{"key":"B","text":"在稳定阶段，创新的重点是围绕主导设计进行产品创新"},{"key":"C","text":"在过渡阶段，产品创新和工艺创新都呈上升趋势"},{"key":"D","text":"在不稳定阶段，研发支出较高，不易获得好的经济效益"}],"answer":["A","D"],"explanation":"-U过程创新模式把产品创新、工艺创新和产业组织的演化分为不稳定阶段、过渡阶段和稳定阶段三个阶段。①不稳定阶段。此阶段的产品创新和工艺创新都呈上升趋势，但产品创新明显强于工艺创新，这是产业发展的初期阶段。这一阶段的研究开发具有探索性，研发经费支出较高，不易获得好的经济效益。②过渡阶段。此阶段的产品创新逐渐减少，而工艺创新继续呈上升趋势，且超越产品创新，通过“纠错”形成了主导设计。③稳定阶段。此阶段的产品创新与工艺创新均表现为下降趋势，工艺创新较产品创新仍然有相对优势，产业发展进人成熟期。该阶段创新的重点是以提高质量和降低成本为目标的渐进性的工艺创新。","id":"guanfang-0615","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第一节技术创新的特点、分类与模式","point":"","type":"single","stem":"根据A-U过程创新模式，主导设计被消费者与市场接受和推崇的阶段是（ ）。","material":"","options":[{"key":"A","text":"不稳定阶段"},{"key":"B","text":"过渡阶段"},{"key":"C","text":"稳定阶段"},{"key":"D","text":"集成阶段"}],"answer":["B"],"explanation":"~ A-U过程创新模式中，过渡阶段的产品创新逐渐减少，而工艺创新继续呈上升趋势，且超越产品创新，通过“纠错”形成了主导设计。这是一个主导设计被消费市场接受和推崇的阶段。在这个阶段，企业市场地位出现分化，不能向市场提供符合主导设计产品的企业将被竞争者挤出市场，但能够围绕主导设计推出有价值产品的企业将会赢得明显的竞争优势。","id":"guanfang-0616","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第一节技术创新的特点、分类与模式","point":"","type":"multi","stem":"国家创新体系的主要功能包括（ ）。","material":"","options":[{"key":"A","text":"发展地方科技园区"},{"key":"B","text":"指导评估国家创新示范中心"},{"key":"C","text":"优化创新资源配置"},{"key":"D","text":"协调国家的创新活动"},{"key":"E","text":"开展创新教育"}],"answer":["C","D"],"explanation":"国家创新体系的主要功能是优化创新资源配置，协调国家的创新活动。","id":"guanfang-0617","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第一节技术创新的特点、分类与模式","point":"","type":"multi","stem":"负责任创新的核心原则包括（ ）。","material":"","options":[{"key":"A","text":"创新过程应公开透明"},{"key":"B","text":"创新应惠及所有人"},{"key":"C","text":"创新应尊重人权、隐私和数据安全"},{"key":"D","text":"创新应优先追求技术领先和商业利润最大化"},{"key":"E","text":"创新应减少对自然资源的消耗和污染"}],"answer":["A","B","C","E"],"explanation":"负责任创新的核心原则包括以下五个方面：①透明度。创新过程应公开透明确保所有利益相关者能够了解并参与决策过程。这有助于建立信任，减少误解和冲突。②包容性。创新应惠及所有人，特别是那些可能因技术进步而处于不利地位的人群。通过包容性设计，确保产品和服务能够满足不同人群的需求。③可持续性。创新应考虑其对环境的影响 旨在实现经济、社会和环境的协调发展。采用绿色技术和可持续生产方法，减少对自然资源的 消耗和污染。④伦理性。创新应遵循伦理原则，尊重人权、隐私和数据安全，避免利用技术侵 犯个人权益或进行不道德的行为。③责任担当。创新主体应承担社会责任，积极应对创新过 程中可能出现的风险和挑战。通过建立健全的风险管理机制，确保创新活动的安全性和可控","id":"guanfang-0618","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第一节技术创新的特点、分类与模式","point":"","type":"multi","stem":"关于大数据、人工智能、云计算、物联网推动的技术创新的说法，正确的","material":"","options":[{"key":"A","text":"物联网为大数据提供数据来源"},{"key":"B","text":"云计算为人工智能提供计算支撑"},{"key":"C","text":"大数据依托物联网实现价值挖掘"},{"key":"D","text":"人工智能优化物联网和大数据应用"},{"key":"E","text":"大数据为云计算提供处理对象"}],"answer":["A","B","D","E"],"explanation":"物联网为大数据提供数据来源：物联网通过各种传感器和智能设备收集了大量的实时数据，这些数据构成了大数据的重要组成部分。大数据为云计算提供处理对象：云计算平台通过其强大的计算能力和存储能力，对大数据进行高效地处理和分析，挖掘出有价值的信息和知识。云计算为人工智能提供计算支撑：人工智能算法需要大量的计算资源进行训练和推理，云计算平台为其提供了灵活、高效、低成本的计算服务。人工智能优化物联网和大数据应用：人工智能通过对大数据的学习和分析，能够优化物联网设备的运行和管理，提高数据的利用效率和价值。","id":"guanfang-0619","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"领先战略的特征不包括（ ）。","material":"","options":[{"key":"A","text":"率先开发市场"},{"key":"B","text":"开发细分市场"},{"key":"C","text":"技术开发重点为产品的基本原理和功能"},{"key":"D","text":"技术开发成功后，投资重心移向生产和市场开发"}],"answer":["B"],"explanation":"令领先战略的基本特征有：①技术来源以自主研发为主。②技术开发重点为产品的基本原理和功能。③一般要开拓一个全新的市场。④在技术开发阶段，投资重心在技术开发上；技术开发成功后，投资重心移向生产和市场开发。","id":"guanfang-0620","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"A、B、C三家企业将各自的研发优势进行互补，共同进行无人驾驶技术的深度研发。从技术来源的角度来看，这种技术创新战略属于（ )。","material":"","options":[{"key":"A","text":"自主创新战略"},{"key":"B","text":"模仿创新战略"},{"key":"C","text":"委托创新战略"},{"key":"D","text":"合作创新战略"}],"answer":["D"],"explanation":"根据技术来源的不同，可将企业技术创新战略分为自主创新战略、模仿创新战略和合作创新战略。其中，合作创新战略是指两个或两个以上的企业合作进行研发，共享技术创新的成果，以达到节约研发投资、缩短开发周期或进入新市场目的的创新战略。","id":"guanfang-0621","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"某企业技术实力雄厚，总是抢在竞争对手之前率先推出新产品。该企业的技术创新战略属于（ ）。","material":"","options":[{"key":"A","text":"技术跟随战略"},{"key":"B","text":"进攻型战略"},{"key":"C","text":"防御型战略"},{"key":"D","text":"切人型战略"}],"answer":["B"],"explanation":"根据企业行为方式的不同，可将企业技术创新战略分为进攻型战略、防御型战略和切人型战略。其中，进攻型战略致力于抢在竞争对手之前不断推出新的产品和生产工艺来占领市场，以进入新的或扩大原有的技术领域或市场领域。","id":"guanfang-0622","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"multi","stem":"根据企业所期望的技术竞争地位的不同，可将企业技术创新战略分为","material":"","options":[{"key":"A","text":"领先战略"},{"key":"B","text":"跟随战略"},{"key":"C","text":"进攻型战略"},{"key":"D","text":"防御型战略"},{"key":"E","text":"切人型战略"}],"answer":["A","B"],"explanation":"根据企业所期望的技术竞争地位的不同，可将企业技术创新战略分为领先战略和跟随战略。","id":"guanfang-0623","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"multi","stem":"关于自主创新战略的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"高投入、高风险"},{"key":"B","text":"有助于形成较高的技术壁垒"},{"key":"C","text":"有可能经历市场沉默期"},{"key":"D","text":"可以获得市场的中后期垄断利润"},{"key":"E","text":"能够与其他企业分摊创新成本"}],"answer":["A","B","C"],"explanation":"自主创新战略的优点包括：在技术方面，有助于形成较高的技术壁垒，为自身的领导地位奠定基础；在生产方面，自主创新企业起步较早，能够较早建立起与新产品生产相适应的核心能力；在市场方面，能获得初期的垄断利润，较早建立起销售网络，影响用户的消费行为，影响行业标准的建立。其缺点是：在技术方面，面临着高投入、高风险；在生产方面，生产人员必须经过特殊培训，同时要承担新设备、新工艺可靠性的风险；在市场方面，必须大量投入进行市场开发，有可能经历市场沉默期。","id":"guanfang-0624","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"multi","stem":"关于防御型战略的说法，正确的有（ ）。","material":"","options":[{"key":"A","text":"低风险"},{"key":"B","text":"低收益"},{"key":"C","text":"要求企业具有领先的技术开发能力"},{"key":"D","text":"要求企业重视技术创新的转移和改进"},{"key":"E","text":"要求企业重视对顾客的技术支持和服务"}],"answer":["A","B","D","E"],"explanation":"实施防御型战略的企业往往具有先进的技术，但在技术开发和国际市场上并不 领先。这种战略的特点是低风险、低收益，强调“人有我有，人新我好；不求最新，但求最好”。 这种战略要求企业重视技术创新的转移和改进，重视对顾客的技术支持和服务，注重产品细化 的市场状况，以低成本、高质量来占领市场，赢得利润。","id":"guanfang-0625","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"企业在选择领先战略或跟随战略时，应考虑的重点因素不包括（。","material":"","options":[{"key":"A","text":"优势能力"},{"key":"B","text":"劣势和威胁"},{"key":"C","text":"风险与收益"},{"key":"D","text":"领先的持久性"}],"answer":["B"],"explanation":"选择领先战略或跟随战略，需要考虑的重点因素有三个:①优势能力。②风险与收益。③领先的持久性。战略则要求企业生产销售能力较强。","id":"guanfang-0626","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"下列特点中，属于领先战略的是（ ）。","material":"","options":[{"key":"A","text":"库存管理能力强"},{"key":"B","text":"运输管理能力强"},{"key":"C","text":"生产销售能力强"},{"key":"D","text":"技术开发能力强"}],"answer":["C"],"explanation":"采用领先战略，技术来源以自主研发为主。跟随战略的技术来源以模仿、引进为主，其核心技术一般不是自行开发的。领先战略技术开发的重点主要涉及产品的基本原理和功能；跟随战略技术开发的重点在于改进工艺技术。领先战略要求企业必须率先开发市场，一般是要开拓一个全新的市场；跟随战略下，企业在领先者已开拓的大市场中开发细分市场或挤占他人市场。领先战略的投资重点是技术开发和市场开发；跟随战略的投资重点则偏向于生产、销售环节。","id":"guanfang-0627","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"关于领先战略和跟随战略的说法，正确的是（ ）。","material":"","options":[{"key":"A","text":"领先战略的技术来源以模仿、引进为主"},{"key":"B","text":"跟随战略技术开发的重点是产品技术"},{"key":"C","text":"跟随战略市场开发的重点是开发细分市场或挤占他人市场"},{"key":"D","text":"领先战略的投资重点是生产和销售领域"}],"answer":["B"],"explanation":"《中华人民共和国民法典》列出了知识产权的8项内容，知识产权是权利人依法就下列客体享有的专有的权利：①作品。②发明、实用新型、外观设计。③商标。④地理标志。③商业秘密。③集成电路布局设计。①植物新品种。③法律规定的其他客体。","id":"guanfang-0628","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"根据《中华人民共和国民法典》，下列不属于知识产权保护的客体的是","material":"","options":[{"key":"A","text":"商业秘密"},{"key":"B","text":"政府公告"},{"key":"C","text":"植物新品种"},{"key":"D","text":"商标"}],"answer":["C"],"explanation":"根据《中华人民共和国著作权法》,著作权包括下列人身权和财产权：发表权、署名权、修改权、保护作品完整权、复制权、发行权、出租权、展览权、表演权、放映权、广播权、信息网络传播权、摄制权、改编权、翻译权、汇编权、应当由著作权人享有的其他权利，共计十七项权利。作者的署名权、修改权、保护作品完整权的保护期不受限制。自然人的作品，其上述十七项权利中，除了署名权、修改权和保护作品完整权，剩余十四项权利的保护期为作者终生及其死亡后五十年，截止于作者死亡后第五十年的12月31日；如果是合作作品，截止于最后死亡的作者死亡后第五十年的12月31日。","id":"guanfang-0629","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"single","stem":"根据《中华人民共和国著作权法》,著作权中，自然人的作品发表权、发行权、出租权和改编权的保护期为作者终生及其死亡后（ ）年。","material":"","options":[{"key":"A","text":"10"},{"key":"B","text":"20"},{"key":"C","text":"50"},{"key":"D","text":"60"}],"answer":["A"],"explanation":"著作权是指文学、艺术、科学作品的作者依法对其作品享有的一系列权利和权益。作品是指文学、艺术和科学领域内具有独创性并能以一定形式表现的智力成果，包括：①文字作品。②口述作品。③音乐、戏剧、曲艺、舞蹈、杂技艺术作品。④美术、建筑作品。③摄影作品。③视听作品。①工程设计图、产品设计图、地图、示意图等图形作品和模型作品。③计算机软件。③符合作品特征的其他智力成果。","id":"guanfang-0630","bank":"guanfang"},{"chapter":"第八章技术创新管理","section":"第二节技术创新战略与技术创新决策评估方法","point":"","type":"multi","stem":"著作权保护的作品形式不包括（ ）。","material":"","options":[{"key":"A","text":"植物新品种"},{"key":"B","text":"口述作品"},{"key":"C","text":"计
